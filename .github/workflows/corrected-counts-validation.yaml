name: Corrected count-test validation

on:
  pull_request:
    paths:
      - "engine/R/continuity-correction.R"
      - "engine/R/confirm-count-search.R"
      - "engine/tests/testthat/helper-corrected-counts.R"
      - "engine/tests/testthat/test-validation-corrected-counts.R"
      - ".github/workflows/corrected-counts-validation.yaml"

concurrency:
  group: corrected-counts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validation:
    uses: ./.github/workflows/full-validation.yaml
    with:
      chunk: corrected_counts
      name: corrected_counts
