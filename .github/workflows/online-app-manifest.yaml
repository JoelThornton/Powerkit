# Checks the manifest on PRs. After a merge, publishes checked main source
# plus its generated manifest to connect-cloud, using a normal fast-forward
# push. Main itself is never changed by the bot, so it can require PRs and
# checks without an automation bypass. Posit Connect Cloud must watch the
# connect-cloud branch (docs/repository-protection.md).
name: online-app-manifest

on:
  push:
    branches: [main]
    paths:
      - "app/routing/**"
      - "engine/**"
      - "renv.lock"
      - ".github/workflows/online-app-manifest.yaml"
      - "scripts/prepare-publish-branch.py"
      - "scripts/test-publish-branch.py"
      - "!app/routing/manifest.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: online-app-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify publishing preserves checked source and branch history
        run: python3 scripts/test-publish-branch.py

      # System libraries the packages in renv.lock need (see
      # full-validation.yaml).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev libgsl-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      # Restores the package versions in renv.lock (cached between runs).
      - uses: r-lib/actions/setup-renv@v2

      # rsconnect writes the manifest; remotes installs the engine from
      # GitHub. Neither is in renv.lock (they don't affect results).
      # The engine must be installed from GitHub, at this commit, so the
      # manifest tells Connect Cloud where to get it (a locally installed
      # copy can't be found by the server).
      - name: Install rsconnect and the engine from GitHub
        env:
          ENGINE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          Rscript -e 'for (p in c("rsconnect", "remotes")) if (!requireNamespace(p, quietly = TRUE)) renv::install(p, prompt = FALSE)' \
                  -e 'remotes::install_github("${{ github.repository }}", subdir = "engine", ref = Sys.getenv("ENGINE_REF"), upgrade = "never", dependencies = FALSE)' \
                  -e 'cat("powerkit", format(packageVersion("powerkit")), "from", Sys.getenv("ENGINE_REF"), "\n")'

      # Packages are recorded against the public Posit Package Manager
      # (the repository in renv.lock), not this runner's Linux binaries.
      - name: Write app/routing/manifest.json
        shell: Rscript {0}
        run: |
          ppm <- "https://packagemanager.posit.co/cran/latest"
          options(repos = c(CRAN = ppm, RSPM = ppm))
          rsconnect::writeManifest(
            appDir = "app/routing",
            appPrimaryDoc = "app.R",
            quiet = TRUE
          )
          m <- jsonlite::read_json("app/routing/manifest.json")
          pk <- m$packages$powerkit$description
          cat(length(m$packages), "packages in the manifest; powerkit from",
              pk$RemoteType, pk$RemoteUsername, pk$RemoteRepo, pk$RemoteSubdir,
              pk$RemoteSha, "\n")
          if (!identical(pk$RemoteType, "github")) {
            stop("powerkit isn't recorded as coming from GitHub, so Connect Cloud couldn't install it.")
          }

      - name: Show what changed
        run: git diff --stat -- app/routing/manifest.json || true

      - name: Prepare the checked deployment branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CHECKED_MAIN: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          python3 scripts/prepare-publish-branch.py "$CHECKED_MAIN"
          git push origin HEAD:connect-cloud
