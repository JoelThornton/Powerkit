# Checks the manifest on PRs, and publishes the online app (Posit Connect
# Cloud) once a day, with a second look in the afternoon.
#
# Connect Cloud republishes the app whenever the branch it watches
# (connect-cloud) changes, and charges for every hour the app runs, a
# rebuild and restart included. Main changes dozens of times a day, so
# publishing after every merge kept the app rebuilding (docs/
# hosting-options.md, "What uses the plan's credits"). Instead, once a day,
# if anything the app runs (app/routing, engine and renv.lock, tests aside)
# differs between main and connect-cloud, this workflow writes the manifest
# and publishes checked main source plus that manifest to connect-cloud,
# using a normal fast-forward push (scripts/prepare-publish-branch.py).
# Main itself is never changed by the bot, so it can require PRs and checks
# without an automation bypass (docs/repository-protection.md).
#
# "Run workflow" on the Actions tab publishes at once (an urgent fix); tick
# "force" to publish even if nothing changed.
name: online-app-manifest

on:
  schedule:
    # 04:23 UTC every day, and a second look at 16:23. GitHub starts timed
    # runs late, or not at all, when it is busy (8 November 2026 had none),
    # so the second look publishes only if nothing was published in the
    # last 10 hours: it catches a missed morning without a second rebuild
    # on a normal day. The morning run always publishes what changed.
    - cron: "23 4 * * *"
    - cron: "23 16 * * *"
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if nothing the app runs has changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: online-app-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify publishing preserves checked source and branch history
        run: python3 scripts/test-publish-branch.py

      # Whether to build the manifest (always on a pull request, as a check)
      # and publish it (only from main, and only if something the app runs
      # differs from what connect-cloud holds, or on request).
      - name: Decide whether to publish
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "The online app is only published from main."
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          paths="app/routing engine renv.lock :(exclude)app/routing/tests :(exclude)engine/tests :(exclude)app/routing/manifest.json"
          publish=true
          if [ "$FORCE" = "true" ]; then
            echo "Publishing on request."
          elif ! git rev-parse -q --verify origin/connect-cloud > /dev/null; then
            echo "Nothing published yet; publishing."
          elif git diff --quiet origin/connect-cloud HEAD -- $paths; then
            echo "Nothing the app runs has changed since the last publish; not publishing."
            publish=false
          elif [ "$SCHEDULE" = "23 16 * * *" ] && [ $(( $(date +%s) - $(git log -1 --format=%ct origin/connect-cloud) )) -lt 36000 ]; then
            echo "The second look: published less than 10 hours ago, so not again today."
            publish=false
          else
            echo "Changed since the last publish:"
            git diff --stat origin/connect-cloud HEAD -- $paths | tail -n 5
          fi
          echo "build=$publish" >> "$GITHUB_OUTPUT"; echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # System libraries the packages in renv.lock need (see
      # full-validation.yaml).
      - name: Install system libraries
        if: steps.decide.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev libgsl-dev

      - uses: r-lib/actions/setup-r@v2
        if: steps.decide.outputs.build == 'true'
        with:
          r-version: renv
          use-public-rspm: true

      # Restores the package versions in renv.lock (cached between runs).
      - uses: r-lib/actions/setup-renv@v2
        if: steps.decide.outputs.build == 'true'

      # rsconnect writes the manifest; remotes installs the engine from
      # GitHub. Neither is in renv.lock (they don't affect results).
      # The engine must be installed from GitHub, at this commit, so the
      # manifest tells Connect Cloud where to get it (a locally installed
      # copy can't be found by the server).
      - name: Install rsconnect and the engine from GitHub
        if: steps.decide.outputs.build == 'true'
        env:
          ENGINE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          Rscript -e 'for (p in c("rsconnect", "remotes")) if (!requireNamespace(p, quietly = TRUE)) renv::install(p, prompt = FALSE)' \
                  -e 'remotes::install_github("${{ github.repository }}", subdir = "engine", ref = Sys.getenv("ENGINE_REF"), upgrade = "never", dependencies = FALSE)' \
                  -e 'cat("powerkit", format(packageVersion("powerkit")), "from", Sys.getenv("ENGINE_REF"), "\n")'

      # Packages are recorded against the public Posit Package Manager
      # (the repository in renv.lock), not this runner's Linux binaries.
      - name: Write app/routing/manifest.json
        if: steps.decide.outputs.build == 'true'
        shell: Rscript {0}
        run: |
          ppm <- "https://packagemanager.posit.co/cran/latest"
          options(repos = c(CRAN = ppm, RSPM = ppm))
          rsconnect::writeManifest(
            appDir = "app/routing",
            appPrimaryDoc = "app.R",
            quiet = TRUE
          )
          m <- jsonlite::read_json("app/routing/manifest.json")
          pk <- m$packages$powerkit$description
          cat(length(m$packages), "packages in the manifest; powerkit from",
              pk$RemoteType, pk$RemoteUsername, pk$RemoteRepo, pk$RemoteSubdir,
              pk$RemoteSha, "\n")
          if (!identical(pk$RemoteType, "github")) {
            stop("powerkit isn't recorded as coming from GitHub, so Connect Cloud couldn't install it.")
          }

      # Main doesn't track the manifest (it is in .gitignore), so there is
      # no diff to show; its size says it was written.
      - name: Show the manifest written
        if: steps.decide.outputs.build == 'true'
        run: ls -l app/routing/manifest.json

      - name: Prepare the checked deployment branch
        if: steps.decide.outputs.publish == 'true'
        env:
          CHECKED_MAIN: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          publish_commit=$(python3 scripts/prepare-publish-branch.py "$CHECKED_MAIN")
          git push origin "$publish_commit:refs/heads/connect-cloud"
