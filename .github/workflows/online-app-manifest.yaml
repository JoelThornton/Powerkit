# Publishes the online app (Posit Connect Cloud) at most once a day.
#
# Connect Cloud republishes the app whenever the branch it follows changes,
# and the host charges for every hour the app runs, a rebuild and restart
# included. Main changes dozens of times a day, so the app no longer
# follows main: it follows the `live` branch, which only this workflow
# writes (docs/hosting-options.md, "How the online app is published").
#
# Once a day, if the app, the engine or renv.lock changed on main since
# the last publish, this workflow writes app/routing/manifest.json (the
# packages Connect Cloud installs, with powerkit's engine pinned to main's
# commit) and adds a commit to `live` holding main's files plus that
# manifest. "Run workflow" on the Actions tab publishes at once, for an
# urgent fix; tick "force" to publish even when nothing changed. Each live
# commit names the main commit it was built from (its Built-from line),
# which is how the next run knows what changed.
#
# On a pull request it only writes the manifest and prints the changes, as
# a check that the manifest can still be made; nothing is committed.
#
# Packages come from renv.lock, as in R-CMD-check.yaml.
name: online-app-manifest

on:
  schedule:
    # 04:23 UTC every day.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the app, the engine and renv.lock haven't changed"
        type: boolean
        default: false
  pull_request:
    paths:
      - "app/routing/**"
      - "engine/DESCRIPTION"
      - "renv.lock"
      - ".github/workflows/online-app-manifest.yaml"

permissions:
  contents: write

concurrency:
  group: online-app-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Whether to build the manifest (always on a pull request, as a check)
      # and whether to publish it to live (only from main, and only if
      # something the app runs changed since the last publish).
      - name: Decide whether to publish
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "The online app is only published from main."
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=""
          if git rev-parse -q --verify origin/live > /dev/null; then
            base=$(git log -1 --format='%(trailers:key=Built-from,valueonly)' origin/live | tr -d '[:space:]')
          fi
          publish=true
          if [ "$FORCE" = "true" ]; then
            echo "Publishing on request."
          elif [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2> /dev/null; then
            echo "No earlier publish found; publishing."
          elif git diff --quiet "$base" HEAD -- app/routing engine renv.lock \
                 ':(exclude)app/routing/tests' ':(exclude)engine/tests' ':(exclude)app/routing/manifest.json'; then
            echo "Nothing the app runs has changed since $base; not publishing."
            publish=false
          else
            echo "Changed since the last publish ($base):"
            git diff --stat "$base" HEAD -- app/routing engine renv.lock \
              ':(exclude)app/routing/tests' ':(exclude)engine/tests' ':(exclude)app/routing/manifest.json' | tail -n 5
          fi
          echo "build=$publish" >> "$GITHUB_OUTPUT"; echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # System libraries the packages in renv.lock need (see
      # full-validation.yaml).
      - name: Install system libraries
        if: steps.decide.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev libgsl-dev

      - uses: r-lib/actions/setup-r@v2
        if: steps.decide.outputs.build == 'true'
        with:
          r-version: renv
          use-public-rspm: true

      # Restores the package versions in renv.lock (cached between runs).
      - uses: r-lib/actions/setup-renv@v2
        if: steps.decide.outputs.build == 'true'

      # rsconnect writes the manifest; remotes installs the engine from
      # GitHub. Neither is in renv.lock (they don't affect results).
      # The engine must be installed from GitHub, at this commit, so the
      # manifest tells Connect Cloud where to get it (a locally installed
      # copy can't be found by the server).
      - name: Install rsconnect and the engine from GitHub
        if: steps.decide.outputs.build == 'true'
        env:
          ENGINE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          Rscript -e 'for (p in c("rsconnect", "remotes")) if (!requireNamespace(p, quietly = TRUE)) renv::install(p, prompt = FALSE)' \
                  -e 'remotes::install_github("${{ github.repository }}", subdir = "engine", ref = Sys.getenv("ENGINE_REF"), upgrade = "never", dependencies = FALSE)' \
                  -e 'cat("powerkit", format(packageVersion("powerkit")), "from", Sys.getenv("ENGINE_REF"), "\n")'

      # Packages are recorded against the public Posit Package Manager
      # (the repository in renv.lock), not this runner's Linux binaries.
      - name: Write app/routing/manifest.json
        if: steps.decide.outputs.build == 'true'
        shell: Rscript {0}
        run: |
          ppm <- "https://packagemanager.posit.co/cran/latest"
          options(repos = c(CRAN = ppm, RSPM = ppm))
          rsconnect::writeManifest(
            appDir = "app/routing",
            appPrimaryDoc = "app.R",
            quiet = TRUE
          )
          m <- jsonlite::read_json("app/routing/manifest.json")
          pk <- m$packages$powerkit$description
          cat(length(m$packages), "packages in the manifest; powerkit from",
              pk$RemoteType, pk$RemoteUsername, pk$RemoteRepo, pk$RemoteSubdir,
              pk$RemoteSha, "\n")
          if (!identical(pk$RemoteType, "github")) {
            stop("powerkit isn't recorded as coming from GitHub, so Connect Cloud couldn't install it.")
          }

      - name: Show what changed since the last publish
        if: steps.decide.outputs.build == 'true'
        run: |
          if git show origin/live:app/routing/manifest.json > "$RUNNER_TEMP/published.json" 2> /dev/null; then
            git diff --no-index --stat "$RUNNER_TEMP/published.json" app/routing/manifest.json || true
          else
            echo "Nothing published yet."
          fi

      # A new commit on live with main's files and the manifest (never a
      # rewrite of live's history), so Connect Cloud republishes once.
      - name: Publish to the live branch
        if: steps.decide.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -f app/routing/manifest.json
          tree=$(git write-tree)
          parent=""
          if git rev-parse -q --verify origin/live > /dev/null; then parent="-p origin/live"; fi
          commit=$(printf 'Online app: publish main at %s\n\nBuilt-from: %s\n' "${GITHUB_SHA:0:7}" "$GITHUB_SHA" | git commit-tree "$tree" $parent)
          git push origin "$commit:refs/heads/live"
          echo "Published main at $GITHUB_SHA to live as $commit."
