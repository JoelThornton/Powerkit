# The locked CI suite checks the recorded environment. This separate check
# exercises the actual CRAN test branch with current repository dependencies.
name: CRAN readiness
on:
  pull_request:
    paths: ["engine/**", "scripts/local-updates.R", ".github/workflows/cran-readiness.yaml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cran:
    name: CRAN tests (${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: [release, devel]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RENV_ACTIVATE_PROJECT: "FALSE"
      NOT_CRAN: "false"
      _R_CHECK_FORCE_SUGGESTS_: "false"
      TESTTHAT_CPUS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: engine
          dependencies: '"hard"'
          upgrade: 'TRUE'
          extra-packages: any::rcmdcheck, any::testthat
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: engine
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"warning"'
