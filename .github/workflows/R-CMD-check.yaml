# R CMD check on the engine package, on every push.
# High-replication validation tests are skipped here (they run nightly; see
# nightly-validation.yaml).
name: R-CMD-check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # CI installs packages from engine/DESCRIPTION; keep the repo-root
      # renv project (for local development) out of the way.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: engine
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: engine
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true
