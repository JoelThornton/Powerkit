# R CMD check on the engine package, on every push.
# High-replication validation tests are skipped here (they run nightly; see
# nightly-validation.yaml).
#
# Packages come from renv.lock (the versions the validation runs used), not
# the latest CRAN releases, so a new backend release can't change results
# in CI until renv.lock is updated in its own PR (docs/decisions.md,
# 17 October 2026). They are installed in the CI image (ci-image.yaml),
# with the R version renv.lock records.
name: R-CMD-check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/ci-image.yaml
    permissions:
      contents: read
      packages: write

  R-CMD-check:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RENV_ACTIVATE_PROJECT: "FALSE"
      # Runs the engine tests that call skip_on_cran().
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Package versions
        run: Rscript -e 'cat("R", format(getRversion()), "| Spower", format(packageVersion("Spower")), "\n")'

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: engine
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true
