# Publishes site/ (powerkit's landing page, guide and sitemap) to GitHub
# Pages, at https://joelthornton.github.io/Powerkit/.
#
# These are the pages search engines index. They are static files, so a
# crawler or a passing visitor costs nothing; the app itself, which starts
# an R process on a host paid for by the hour, asks crawlers to stay away
# (app/routing/www/robots.txt). Once, in the repository's Settings > Pages,
# "Source" must be set to "GitHub Actions" (docs/hosting-options.md).
name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
