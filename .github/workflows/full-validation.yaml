# Full validation, one chunk per run, on demand; also called by the
# scheduled validation (nightly-validation.yaml), once per chunk. Runs scripts/run-validation.R --only <chunk> --cores 4 on
# GitHub's standard Linux runner (4 cores, about 16 GB of memory; free for
# public repositories), with the package versions in renv.lock, and uploads
# validation-results/ (summary.txt and each test's .rds and .log) as an
# artifact. How to start it and download the results: docs/validation-log.md,
# "Running the full validation on GitHub".
#
# The mediation chunks (process_4, process_4_binary, process_6, process_7,
# process_14) have a
# few long tests, so they run one test at a time with all 4 cores
# (--cores-per-test 4): each simulation's replications are split into
# batches (simulate_in_chunks()) and the batches spread over the cores. The
# other chunks run 4 tests at a time on one core each.
#
# Time: GitHub stops a job after 6 hours (timeout-minutes: 360). The run
# step stops at 5 h 30 m, so the results finished by then are still
# uploaded (the summary lists unfinished tests as NOT RUN). Estimates on
# 4 cores, from one-core timings on the maintainer's laptop (1,000 Monte
# Carlo draws; a runner core may be slower, so allow up to about twice
# these; the job runs in the CI image (ci-image.yaml), so no time goes on
# installing packages):
#   basic, interactions   minutes
#   anova                 about 2.5 hours (23 simulated tests of about 9
#                         minutes each, 4 at a time; the one-way
#                         within, larger mixed and two-factor tests are
#                         estimated, not yet timed)
#   process_4             about 3.5 hours on a runner (7 tests; a direct-call
#                         test took 44 minutes on 30 October 2026)
#   process_4_binary      about 2 hours (4 tests: independent, direct and
#                         Type I checks of a yes/no X)
#   process_6             about 1 hour (3 simulations, about 0.4 s each)
#   mediation_crosscheck  about 1.5 hours (4 tests at a time, one core
#                         each; the longest is a powerkit simulation of
#                         10,000 replications at about 0.4 s each; an
#                         estimate, not yet measured)
#   mediation_crosscheck_parallel, mediation_crosscheck_serial
#                         30 to 60 minutes each (2 tests, 2 cores each;
#                         an estimate from a local smoke test)
#   process_7, process_14 about 3 hours each (3 simulations at about
#                         1.4 s each). The closest to the limit: if the
#                         runner is twice as slow as the laptop, they
#                         might not finish in 6 hours.
#   whole_study           about 2 to 3 hours (3 tests at a time; the
#                         longest is a whole-study simulation and a
#                         mediation simulation of 10,000 replications at
#                         about 0.6 s each; an estimate)
# Required-n tests (now skipped until their published values are filled
# in) run several simulations each and will make the chunks longer.
name: full-validation

on:
  workflow_call:
    inputs:
      chunk:
        description: "Validation chunk, or several separated by commas"
        required: true
        type: string
      name:
        description: "Name for the job and its artifact (default: the chunk)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      chunk:
        description: "Validation chunk to run"
        required: true
        type: choice
        options:
          - anova
          - interactions
          - three_way
          - basic
          - variances
          - manova
          - rank
          - bayes
          - meta
          - process_4
          - process_4_binary
          - process_6
          - process_7
          - process_14
          - modmed_parallel
          - mediation_crosscheck
          - mediation_crosscheck_parallel
          - mediation_crosscheck_serial
          - logistic
          - ordinal
          - logistic_factorial
          - poisson
          - contrast
          - ancova
          - two_correlations
          - generic
          - equivalence
          - trend
          - precision
          - whole_study
          - cluster
          - multisite
          - sem_fit
          - sem_latent
          - mixed_model

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/ci-image.yaml
    permissions:
      contents: read
      packages: write

  validation:
    name: validation (${{ inputs.name || inputs.chunk }})
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CHUNK: ${{ inputs.chunk }}
      RENV_ACTIVATE_PROJECT: "FALSE"
      # Cores per test, set here for the whole job so every step has it:
      # 4 for the mediation chunks (process_*); 2 for the parallel and
      # serial cross-checks (2 tests each, so both run at once); 1 for the
      # others.
      PER_TEST: ${{ startsWith(inputs.chunk, 'process_') && '4' || (startsWith(inputs.chunk, 'mediation_crosscheck_') && '2' || '1') }}
    steps:
      - uses: actions/checkout@v4

      # Stops here, before the long run, if a package doesn't load.
      - name: Check that the packages load
        run: |
          Rscript -e 'pkgload::load_all("engine", quiet = TRUE, helpers = FALSE)' \
                  -e 'for (p in c("power4mome", "manymome", "igraph", "lavaan", "Spower", "Superpower", "InteractionPoweR", "pwrss", "simsem", "testthat", "processx")) loadNamespace(p)' \
                  -e 'cat("All packages load.\n")'

      # Steps without an `if` run only if every earlier step succeeded, so
      # the chunk doesn't start if installing or loading packages failed.
      - name: Run the ${{ inputs.chunk }} chunk
        id: run
        timeout-minutes: 330
        run: Rscript scripts/run-validation.R --only "$CHUNK" --cores 4 --cores-per-test "$PER_TEST"

      # Runs if the chunk ran, even if it failed or hit the time limit, so
      # the summary covers the results saved so far; skipped if the chunk
      # never started (then there is nothing to summarise).
      - name: Write the summary of saved results
        if: always() && steps.run.outcome != 'skipped'
        run: Rscript scripts/run-validation.R --only "$CHUNK" --cores 4 --cores-per-test "$PER_TEST" --summary

      - name: Upload validation-results
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ inputs.name || inputs.chunk }}-run-${{ github.run_number }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 30
