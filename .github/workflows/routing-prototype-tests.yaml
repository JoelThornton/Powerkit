# Tests for the routing prototype (app/routing/), on every pull request and
# push. Packages come from renv.lock, as in R-CMD-check.yaml, so the app is
# tested with the versions recorded there. See docs/routing-prototype.md.
name: routing-prototype-tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      # System libraries the packages in renv.lock need (see
      # full-validation.yaml).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      # Restores the package versions in renv.lock (cached between runs).
      - uses: r-lib/actions/setup-renv@v2

      # The input screens check specs with the engine's validate_spec()
      # (read-only). Install the engine into the renv library so those
      # tests run here instead of skipping.
      - name: Install the engine
        run: Rscript -e 'utils::install.packages("engine", repos = NULL, type = "source", lib = .libPaths()[1])' -e 'cat("powerkit", format(packageVersion("powerkit")), "installed\n")'

      # Runs from the repository root, so its .Rprofile activates renv.
      # POWERKIT_APP_TESTS_NEED_ENGINE makes the engine tests fail, not
      # skip, if the engine can't be loaded.
      - name: Run the routing prototype's tests
        env:
          POWERKIT_APP_TESTS_NEED_ENGINE: "true"
        shell: Rscript {0}
        run: |
          testthat::test_dir("app/routing/tests/testthat", stop_on_failure = TRUE)
