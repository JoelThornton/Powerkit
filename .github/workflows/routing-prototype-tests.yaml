# Tests for the routing prototype (app/routing/), on every pull request and
# on pushes to main (a pull request's own pushes are covered by its
# pull_request runs, so they aren't tested twice). A pull request that
# changes only documentation runs only the tests that read it. The job runs in the CI
# image (ci-image.yaml): R and the package versions in renv.lock are
# already installed, so the app is tested with the versions recorded there. See docs/routing-prototype.md.
name: routing-prototype-tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run it
# replaces; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Whether a pull request changes only documentation: files under docs/
  # and Markdown files at the top of the repository (README.md, CLAUDE.md).
  # Then only the app tests that read those files run (docs-tests below),
  # in place of the whole suite and the browser tests, since nothing the
  # app runs has changed. Pushes to main and manual runs always run
  # everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does this pull request change only documentation?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          docs_only=false
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)"
            if [ -n "$base" ]; then
              changed="$(git diff --name-only "$base" HEAD)"
              if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(docs/.*|[^/]+\.md)$'; then
                docs_only=true
              fi
            fi
          fi
          echo "Documentation only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  image:
    uses: ./.github/workflows/ci-image.yaml
    permissions:
      contents: read
      packages: write

  browser-tests:
    needs: [changes, image]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RENV_ACTIVATE_PROJECT: "FALSE"
      NOT_CRAN: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/routing/walkthroughs/package-lock.json
      - name: Install the engine and locked browser test tools
        run: |
          R CMD INSTALL engine
          npm ci --ignore-scripts --no-audit --no-fund --prefix app/routing/walkthroughs
          node app/routing/walkthroughs/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check calculations, files, precision, cancellation and navigation in Chromium
        run: node app/routing/walkthroughs/node_modules/playwright/cli.js test --config app/routing/walkthroughs/playwright.config.js
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-regression-report
          path: |
            app/routing/walkthroughs/playwright-report/
            app/routing/walkthroughs/test-results/
          retention-days: 7

  # Two jobs side by side: test-results.R, which runs calculations and the
  # exported scripts and takes about two thirds of the time, and every
  # other test file. Together they are the whole suite.
  app-tests:
    needs: [changes, image]
    if: needs.changes.outputs.docs_only != 'true'
    name: app-tests (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: results
            invert: "FALSE"
          - part: the rest
            invert: "TRUE"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # The packages are in the image's site library, so the repository's
      # .Rprofile doesn't need to activate renv.
      RENV_ACTIVATE_PROJECT: "FALSE"
      # The tests that run a calculation (the app's result equals the
      # engine's, the downloaded script reproduces it) call skip_on_cran();
      # this makes them run.
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v5

      # The input screens check specs with the engine's validate_spec()
      # (read-only). Install the engine so those tests run here instead of
      # skipping.
      - name: Install the engine
        run: Rscript -e 'utils::install.packages("engine", repos = NULL, type = "source", lib = .libPaths()[1])' -e 'cat("powerkit", format(packageVersion("powerkit")), "installed\n")'

      # POWERKIT_APP_TESTS_NEED_ENGINE makes the engine tests fail, not
      # skip, if the engine can't be loaded.
      - name: Run the routing prototype's tests
        env:
          POWERKIT_APP_TESTS_NEED_ENGINE: "true"
        shell: Rscript {0}
        run: |
          testthat::test_dir("app/routing/tests/testthat", filter = "^results$",
            invert = ${{ matrix.invert }}, stop_on_failure = TRUE)

  # For a documentation-only pull request: the app tests that read docs/
  # or the top-level Markdown files (the docs-match checks, the queue and
  # status checks in repo consistency, the maintainer decisions, the
  # routing audit's misroutes and the wording rules).
  docs-tests:
    needs: [changes, image]
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      RENV_ACTIVATE_PROJECT: "FALSE"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install the engine
        run: Rscript -e 'utils::install.packages("engine", repos = NULL, type = "source", lib = .libPaths()[1])'
      - name: Run the app tests that read the documentation
        env:
          POWERKIT_APP_TESTS_NEED_ENGINE: "true"
        shell: Rscript {0}
        run: |
          testthat::test_dir("app/routing/tests/testthat",
            filter = "^(docs-match|repo-consistency|maintainer-decisions|misroutes|wording)$",
            stop_on_failure = TRUE)

  app-review-gate:
    if: ${{ always() }}
    needs: [changes, image, app-tests, browser-tests, docs-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v5
      - name: Verify gate failure and skip handling
        run: python3 scripts/test-required-checks.py
      - name: Require successful prerequisite jobs
        env:
          CHECK_KIND: app
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/required-checks.py
