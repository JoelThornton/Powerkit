# Nightly validation: the unit tests plus the fast subset of the
# high-replication validation tests (POWERKIT_FULL_VALIDATION=true):
# basic tests (Spower) and regression interactions (InteractionPoweR),
# which take minutes. Scheduled runs use the default branch.
#
# The 2x2 ANOVA, mediation and moderated-mediation validation tests are
# not run here: together they take more than a day of CPU time at 10,000
# replications. They are run on demand, before merges and releases, on the
# maintainer's machine with scripts/run-validation.R (docs/decisions.md,
# phase 3 maintainer decisions).
#
# Validation tests for designs whose backend isn't built yet are skipped
# with a clear message, so a red run means a real problem.
#
# Packages come from renv.lock, as in R-CMD-check.yaml: the job runs in the
# CI image (ci-image.yaml), where they are already installed.
name: nightly-validation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/ci-image.yaml
    permissions:
      contents: read
      packages: write

  full-validation:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      POWERKIT_FULL_VALIDATION: "true"
      # Spread simulation replications over the runner's 4 cores.
      POWERKIT_CORES: "4"
      RENV_ACTIVATE_PROJECT: "FALSE"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4

      # xml2, for the JUnit report below, is in the CI image (it isn't a
      # project dependency, so renv.lock doesn't carry it).
      - name: Run unit tests and the fast validation subset
        shell: Rscript {0}
        run: |
          options(warn = 1)
          # test_local() runs with the working directory set to
          # engine/tests/testthat, so the report's path has to be absolute:
          # a relative one is resolved there, and write_xml() then fails at
          # the end of the run, after every test has already run.
          report <- file.path(getwd(), "engine", "validation-results.xml")
          reporter <- testthat::MultiReporter$new(list(
            testthat::ProgressReporter$new(show_praise = FALSE),
            testthat::JunitReporter$new(file = report)
          ))
          # Every test file except the slow validation files (matched
          # against the file's path, so the pattern is not anchored).
          testthat::test_local(
            "engine", filter = "validation-(anova|mediation|modmed)", invert = TRUE,
            reporter = reporter, stop_on_failure = TRUE
          )

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: engine/validation-results.xml
          if-no-files-found: ignore
