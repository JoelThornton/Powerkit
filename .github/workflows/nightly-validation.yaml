# Nightly full validation: runs every test, including the high-replication
# validation tests (tests/testthat/test-validation-*.R), by setting
# POWERKIT_FULL_VALIDATION=true. Scheduled runs use the default branch.
#
# Until every design has a backend (build phase 3), the validation tests for
# designs without one fail by design, with "isn't available yet".
name: nightly-validation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      POWERKIT_FULL_VALIDATION: "true"
      # Spread simulation replications over the runner's 4 cores.
      POWERKIT_CORES: "4"
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: engine
          extra-packages: any::devtools
          needs: check

      - name: Run full test suite
        working-directory: engine
        shell: Rscript {0}
        run: |
          options(warn = 1)
          reporter <- testthat::MultiReporter$new(list(
            testthat::ProgressReporter$new(show_praise = FALSE),
            testthat::JunitReporter$new(file = "validation-results.xml")
          ))
          devtools::test(reporter = reporter, stop_on_failure = TRUE)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: engine/validation-results.xml
          if-no-files-found: ignore
