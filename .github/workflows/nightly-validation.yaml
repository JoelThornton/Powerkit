# Nightly validation: the unit tests plus the fast subset of the
# high-replication validation tests (POWERKIT_FULL_VALIDATION=true):
# basic tests (Spower) and regression interactions (InteractionPoweR),
# which take minutes. Scheduled runs use the default branch.
#
# The 2x2 ANOVA, mediation and moderated-mediation validation tests are
# not run here: together they take more than a day of CPU time at 10,000
# replications. They are run on demand, before merges and releases, on the
# maintainer's machine with scripts/run-validation.R (docs/decisions.md,
# phase 3 maintainer decisions).
#
# Validation tests for designs whose backend isn't built yet are skipped
# with a clear message, so a red run means a real problem.
#
# Packages come from renv.lock, as in R-CMD-check.yaml.
name: nightly-validation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      POWERKIT_FULL_VALIDATION: "true"
      # Spread simulation replications over the runner's 4 cores.
      POWERKIT_CORES: "4"
    steps:
      - uses: actions/checkout@v4

      # System libraries the packages in renv.lock need (see
      # full-validation.yaml).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      # Restores the package versions in renv.lock (cached between runs).
      - uses: r-lib/actions/setup-renv@v2

      # Runs from the repository root, so its .Rprofile activates renv.
      - name: Run unit tests and the fast validation subset
        shell: Rscript {0}
        run: |
          options(warn = 1)
          reporter <- testthat::MultiReporter$new(list(
            testthat::ProgressReporter$new(show_praise = FALSE),
            testthat::JunitReporter$new(file = "engine/validation-results.xml")
          ))
          # Every test file except the slow validation files (matched
          # against the file's path, so the pattern is not anchored).
          testthat::test_local(
            "engine", filter = "validation-(anova|mediation|modmed)", invert = TRUE,
            reporter = reporter, stop_on_failure = TRUE
          )

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: engine/validation-results.xml
          if-no-files-found: ignore
