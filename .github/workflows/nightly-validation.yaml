# Scheduled validation of the high-replication validation tests
# (POWERKIT_FULL_VALIDATION=true), on GitHub's runners, with the package
# versions in renv.lock (the CI image, ci-image.yaml):
#   * every night that main changed in the last day: the short chunks, and
#     each long chunk whose tests, backend or shared code changed;
#   * every Sunday: every chunk, whatever changed.
# scripts/validation-plan.R decides which chunks run. Each runs as its own
# job through full-validation.yaml (one job for all the short chunks), so
# the long chunks run side by side, and each job uploads its
# validation-results/ as an artifact. Unit tests are not repeated here:
# R-CMD-check runs them on every push.
#
# The maintainer still runs scripts/run-validation.R locally when they
# want results on their own machine, and before a release; the weekly run
# is the regular complete check (docs/decisions.md).
name: nightly-validation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Run every chunk (otherwise: chunks for the last day's changes)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/ci-image.yaml
    permissions:
      contents: read
      packages: write

  plan:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RENV_ACTIVATE_PROJECT: "FALSE"
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose the chunks
        id: plan
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$ALL" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            matrix=$(Rscript scripts/validation-plan.R --all)
          else
            since=$(git rev-list -1 --before="24 hours ago" HEAD)
            if [ -z "$since" ]; then
              matrix=$(Rscript scripts/validation-plan.R --all)
            else
              matrix=$(git diff --name-only "$since" HEAD | Rscript scripts/validation-plan.R)
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Chunks to run: $matrix"

  validation:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/full-validation.yaml
    with:
      chunk: ${{ matrix.only }}
      name: ${{ matrix.name }}
    permissions:
      contents: read
      packages: write
