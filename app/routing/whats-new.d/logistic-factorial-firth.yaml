entries:
  - date: "2026-11-22"
    title: "Factorial logistic regression: Firth's test, and you choose the test"
    text: "The card for two crossed factors with a yes/no outcome now offers Firth's test, which suits studies with few 'yes' or few 'no' answers in some groups. Nothing is chosen for you: pick the test you will report, Firth's, the likelihood-ratio or the Wald test, and the power is for that test."
