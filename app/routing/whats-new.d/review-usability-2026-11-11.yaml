entries:
  - date: "2026-11-11"
    title: "Save and export without writing a reason first"
    text: "The project file, the R script and the write-up are available as soon as there is a result. Explaining why you chose the effect size is still asked for and still belongs in a good plan, but leaving it empty no longer blocks you: the write-up then says that no justification for the effect size was recorded."
  - date: "2026-11-11"
    title: "The button that runs the analysis is called Calculate"
    text: "The button on every input screen was labelled “Check my answers”. It is now “Calculate”, and “Feedback on this screen” at the top of every page opens the feedback form."
  - date: "2026-11-11"
    title: "Welch's t-test shows what your study can and cannot tell you"
    text: "The default two-group test (Welch's) now has the same panels after a result as the classical t-test: the power for other effect sizes and the sample size other effects would need."
  - date: "2026-11-11"
    title: "Percentages typed as whole numbers are caught"
    text: "Typing 80 where powerkit expects 0.8 (power, a proportion, a confidence level) now gets a message that says how to enter it."
  - date: "2026-11-11"
    title: "One-way ANOVA: an effect size with Welch's test is caught at once"
    text: "Entering partial eta-squared or Cohen's f while the test version was Welch's ANOVA (the starting choice) failed only after a wait of about half a minute. The input screen now says straight away that an effect size plans the classical ANOVA, and how to keep Welch's version by giving group means and SDs."
  - date: "2026-11-11"
    title: "Precision planning for one group and for paired data works with assurance"
    text: "Planning the width of a confidence interval for one group or for the same people measured twice failed on its starting settings. It now runs."
  - date: "2026-11-11"
    title: "You can say your effect size is a rule of thumb"
    text: "The source of the effect size now includes “A convention or rule of thumb (such as Cohen's small, medium or large)”. Powerkit records it as that in the result and write-up, and notes that a convention is not evidence about your effect. Before, the only way to get a number with a conventional effect was to call it the smallest effect that would matter."
  - date: "2026-11-11"
    title: "The smallest detectable effect no longer asks where your effect size comes from"
    text: "When you ask for the smallest effect your sample could detect, you enter no effect size, so the source question can stay empty."
  - date: "2026-11-11"
    title: "Regression and mixed ANOVA results tidied"
    text: "A test of an R-squared increase no longer carries the heading for the single-coefficient t test, and notices that a package prints about its own code are no longer shown as notes on your result."
  - date: "2026-11-11"
    title: "Your study plan stays with you"
    text: "Once you add an analysis to your study plan, “Your study plan” appears at the top of every page, so the plan is one click away wherever you go. The plan is also kept in your browser: reloading the page, losing the connection or coming back later brings it back. Removing an analysis or starting a new plan now asks first."
  - date: "2026-11-11"
    title: "Changing only your wording no longer runs the calculation again"
    text: "If you edit your reasoning or a reason, or confirm that your reasoning still applies, and the numbers are the same as a result already worked out in this visit, powerkit shows that result at once with the new wording instead of calculating again. Going back to earlier numbers is instant too."
  - date: "2026-11-11"
    title: "Run times are stated for the online version"
    text: "The time a calculation “usually takes” was measured on a recent computer. The online version now says that it shares a small server and can take several times longer."
  - date: "2026-11-11"
    title: "Two proportions: a warning when the counts are small"
    text: "When a group is expected to hold fewer than about five people with (or without) the outcome, the z test's formula is unreliable. The result now says so and points to Fisher's exact test, which the same screen offers."
