entries:
  - date: "2026-11-22"
    title: "Info buttons no longer cover a box's question"
    text: >-
      With explanations off, a box's info button now sits beside its
      first line, so a long question wraps around it instead of running
      under it. The note about the test you chose opens from the same
      button as the box's other explanations, instead of having a second
      button of its own, and a box's button only appears when there is
      something in view for it to open.
  - date: "2026-11-22"
    title: "One line for an unknown effect size"
    text: >-
      Above the effect size, "Unknown effect size" and "I don't know my
      effect size" were two separate links side by side. They are now one
      line: the question, then a link that finds the smallest effect your
      study could detect.
