entries:
  - date: "2026-11-28"
    title: "Write-ups describe methods, not other programs"
    text: >-
      The methods paragraphs and downloads now say what each choice is,
      for example that the covariate was treated as measured, instead of
      comparing it with another program. The input screens and analysis
      cards no longer add "as in G*Power" to choices that work the same
      way; another program is named only where its answer would differ.
