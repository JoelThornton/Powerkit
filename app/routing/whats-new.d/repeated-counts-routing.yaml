entries:
  - date: "2026-11-08"
    title: "Counts and ratings measured twice now reach a card"
    text: >-
      A count or a single rating item measured twice or more on the same
      people no longer ends at "No matching design": the questions now lead
      to a card that names the analysis and the tools that plan it, or, for
      a relationship, to the card for relationships measured within people.
