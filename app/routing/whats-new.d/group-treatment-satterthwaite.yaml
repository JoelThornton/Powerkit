entries:
  - date: 2026-11-22
    title: "Group treatment trials: more accurate power with few groups"
    text: "When people are randomised one by one and only one condition is delivered in groups, Powerkit now uses the usual (Welch-Satterthwaite) degrees of freedom for the test with a score outcome. powertools' formula, which Powerkit used before, gave too little power when there are few groups, up to about 12 percentage points with 4 to 6 groups, so it asked for more groups than a trial needs. With 30 or more groups the answers barely change. The results screen says so. Separate simulations now also check the clustered designs' power."
