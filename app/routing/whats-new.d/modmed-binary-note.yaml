entries:
  - date: "2026-11-16"
    title: "A corrected check on moderated mediation with a yes/no X"
    text: "Its notes now give the false-positive rate from 20,000 simulated studies: 5.4% at a 5% significance level, a slight excess (5.2% when the interval comes from separate regressions, as in PROCESS) that changes power by well under a point. The earlier figure of about 6.7% came from fewer studies."
