entries:
  - date: "2026-11-20"
    title: Corrected answers in several calculations
    text: >
      A study plan's joint power now keeps the direction of each effect, so
      two related outcomes expected to move in opposite directions are no
      longer treated as moving the same way; an outcome with no expected
      effect is kept, and a one-sided test of an effect in the other
      direction is explained instead of miscounted.
  - date: "2026-11-20"
    title: Exact sizes for unequal groups and intervals for rare outcomes
    text: >
      Comparing two correlations, or two proportions with the z test, with
      unequal groups now scores the groups exactly as they are split, where
      one person could be added to the first group before; the z test also
      gives an answer when the two proportions are equal. The exact
      (Clopper-Pearson) interval for a proportion no longer reaches 1 when
      one success is expected, and a Wald interval plan starts where at
      least 5 are expected in each outcome.
  - date: "2026-11-20"
    title: Smallest sample sizes found where power dips
    text: >
      The Bayes factor test of two proportions now finds the smallest sample
      size when the chance of strong evidence goes up and down as the sample
      grows. Mixed models with conditions between participants search in
      totals that split equally between the conditions, and the R script for
      a trial that assigns whole sites searches in pairs of sites, as the
      app does.
