entries:
  - date: "2026-11-22"
    title: "Tidier folded sections and links"
    text: >-
      Sections that fold open now share one small arrow that turns as they
      open, and only links to other pages are underlined. At the foot of
      each input screen, the assumptions, Settings and guess rows sit
      together in one box, with Settings still showing its choices. An
      info button that opened onto an empty grey box is gone, and a
      field's explanation no longer says the same thing twice.
