entries:
  - date: "2026-11-16"
    title: "Plan a replication from Tools, and see every analysis on About"
    text: "Tools has a Replication planner again, first under For planning; it starts a replication plan. On About, \"What it can plan\" opens the coloured list of every analysis Powerkit calculates, and the capability table now has one row per analysis with the tests it offers. Searching it for a test such as ANOVA lists those analyses first, and the full table downloads as a spreadsheet. After you send feedback, the button says Sent and a green box confirms it."
