entries:
  - date: "2026-11-16"
    title: "Long calculations can carry on in your study plan"
    text: "When a calculation takes a while, you can keep it running in your study plan and do something else in Powerkit. The plan shows its progress and adds the result when it finishes. Keep the browser tab open: closing it stops the run. Repeated-measures designs with unequal correlations now say how long they usually take."
