entries:
  - date: "2026-11-28"
    title: "Plan carefully from one published F"
    text: >-
      On the ANOVA screens, when your effect is one earlier study's F,
      Powerkit now asks how to plan from it. BUCSS can correct the F for
      publication bias and uncertainty and show the sample size you'd
      need beside the one from the F as published. Or safeguard power can
      plan with the lower end of the interval around it, as on the t
      tests.
