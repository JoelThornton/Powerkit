entries:
  - date: "2026-11-11"
    title: "A clearer start screen"
    text: "The start screen now says what powerkit does before it asks how you want to start, and gives the three ways in more room. Opening a saved or shared project, Bayes mode and running powerkit on your own computer sit in one quiet row underneath, each a click away, and the step bar appears once you have chosen a way to start."
