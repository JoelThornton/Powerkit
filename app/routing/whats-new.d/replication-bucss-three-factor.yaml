entries:
  - date: "2026-11-19"
    title: Replication plans for three-factor ANOVAs
    text: >
      A replication of an ANOVA with three factors can now be planned: give
      the third factor's levels, choose the effect the replication tests
      (a main effect, a two-way interaction or the three-way interaction)
      and enter the original's F. The sample size allows for publication
      bias and the uncertainty of the original's estimate, as for a
      two-factor ANOVA. A mixed design asks how many of its factors are
      between-subjects.
