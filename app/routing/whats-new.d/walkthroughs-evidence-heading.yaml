entries:
  - date: "2026-11-21"
    title: Rank tests found by name, and a clearer evidence heading
    text: >
      Searching for Wilcoxon's signed-rank test, Spearman's or Kendall's
      correlation now finds the cards that offer them (one group against a
      fixed value, the same people twice, and two scores related). The
      checks shown under each result are headed "Evidence for this analysis
      method": they were recorded for the method and its options, usually
      at other values than yours, not for your exact sample size, effect or
      alpha.
