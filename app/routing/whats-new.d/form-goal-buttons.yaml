entries:
  - date: "2026-11-12"
    title: "Choosing your goal is one click"
    text: "On the input screen, what you want to find out (sample size, power, the smallest detectable effect and others) and the test's direction are now buttons rather than drop-down menus. The bar at the bottom names the answers still needed, the effect-size boxes look like the rest of the form, and the settings line is shorter."
