entries:
  - date: "2026-11-08"
    title: "Two proportions from an odds ratio or a risk ratio"
    text: >-
      The two-proportions screen now takes a published odds ratio or risk
      ratio with group 1's proportion, and works out group 2's proportion
      for you. The result and the methods paragraph show the ratio, both
      proportions and how the conversion was done.
