entries:
  - date: "2026-11-23"
    title: "Clearer help on the input screen"
    text: >-
      "How these tests differ", in the box where you choose your test, now
      explains each test it offers. "What each goal gives you" opens in one
      click and says what sample size, power and the smallest detectable
      effect each work out. Clicking "Still needed" now marks every
      question still to answer. The two-sided test comes first, marked as
      the usual one, but you still choose. Help with published or missing
      numbers is now in the effect size section.
