entries:
  - date: "2026-11-19"
    title: Replications with a more or less reliable measure
    text: >
      If a replication of two groups or one group uses a different outcome
      measure, give its reliability and the original measure's under "How
      the replication differs". A less reliable measure shows a smaller
      effect, so the plan expects a smaller effect and asks for more
      people, and the write-up says so, with its source.
