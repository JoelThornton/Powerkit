entries:
  - date: "2026-11-17"
    title: "Cochran's Q has a card of its own"
    text: "Searching for Cochran's Q now finds a card with that name, under yes/no and categories, for the same people giving a yes/no answer in three or more conditions. You give each condition's chance of yes and how much people differ; power and the number of people you need both run here."
