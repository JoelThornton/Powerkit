entries:
  - date: "2026-11-12"
    title: "The replication planner gives a number first"
    text: "In the replication planner (Labs), you can get the sample size straight after describing the original study. The result starts with one sentence: how many people you need for a significant result again if the effect is as large as reported, and if it is smaller, as published effects often are. The other goals follow below."
