entries:
  - date: "2026-11-08"
    title: "Two groups: Welch's t-test by default"
    text: >-
      The two-group t-test now plans for Welch's t-test unless you choose
      Student's. Welch's test stays accurate when the groups' spreads
      differ and needs the same number of people when they don't. Its
      answer now comes from a formula rather than a simulation, so it is
      instant and exact, and it now offers the smallest detectable effect
      and a justified significance level too.
