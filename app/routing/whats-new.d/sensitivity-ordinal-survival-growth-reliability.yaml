entries:
  - date: "2026-11-17"
    title: "The smallest effect you could detect, on five more analyses"
    text: "Two groups on an ordinal outcome, the log-rank test and a Cox regression, growth curves, and the ICC, Cronbach's alpha and kappa now offer \"the smallest effect I'd have a good chance of finding\", and the effect can be left empty. For reliability the answer is the lowest value your sample could show is above the one you name. When the smallest detectable effect is the goal, the methods paragraph no longer calls the values you entered \"the effect size\"."
