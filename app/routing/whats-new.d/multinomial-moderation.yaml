entries:
  - date: "2026-11-17"
    title: "Moderation of an outcome with three or more unordered answers"
    text: "The card for moderation or mediation with a yes/no, count or categorical outcome now plans moderation when the outcome is one of three or more unordered answers, such as which of three services people choose. You give the share choosing each answer, and for each answer but the first, the odds ratios and how much X's odds ratio changes with W. Powerkit tests all the interaction terms together by default, or one answer's if you choose. Power and the sample size both run in the app; the sample size takes a minute or two."
