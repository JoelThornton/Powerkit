entries:
  - date: "2026-11-16"
    title: "Fixes before colleague testing"
    text: "Simple mediation's quick estimate calculates again (it said \"not wired in yet\"). Two proportions with unequal groups can find the smallest detectable effect. Ordered categories in three or more groups, tested with a Wald test, no longer overstate power. Choosing eta-squared or Cohen's f on the one-way ANOVA switches to the classical F test, and Cohen's f can be entered before choosing a goal. An effect from a pilot or a previous study no longer needs a sentence before you can calculate: the write-up says no adjustment was recorded. Bayes factor results and write-ups speak of your evidence threshold rather than \"strong evidence\". Cards open on what the analysis does, with how far its checks have got under \"More about this analysis\". Plan my whole study says its validation is in progress, as other cards do. Smaller wording fixes in the write-up, Labs and the prediction model result."
