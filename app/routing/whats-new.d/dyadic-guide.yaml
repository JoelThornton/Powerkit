entries:
  - date: "2026-11-17"
    title: "The card for other pair designs points to the ones Powerkit plans"
    text: "The card for data that come in pairs now tells you which card to use: actor and partner effects on a score have their own card, conditions given to whole pairs are a cluster trial with groups of two, and pairs you matched yourself are a paired comparison. It says plainly what isn't covered yet: actor and partner effects on a yes/no, count or ordered outcome, and a condition given to one member of each pair."
