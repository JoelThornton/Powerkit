entries:
  - date: "2026-11-22"
    title: "You choose the test, and whether to correct"
    text: "Where two tests answer the same question and neither is clearly better, the input screen no longer picks one for you: the Wald or likelihood-ratio test and the degrees of freedom on the mixed-model cards, and the test on the multinomial, interaction and item-bias cards. The usual one is marked. Pairwise comparisons ask whether to adjust, recommending Holm's method if you do, and a whole study with two or more main analyses asks what your claim needs. The mediation cards ask which analysis you will run, and simple mediation no longer opens on the quick estimate."
