entries:
  - date: "2026-11-22"
    title: "You choose the test, and whether to correct"
    text: "Where two tests answer the same question and neither is clearly better, the input screen no longer picks one for you: on the mixed-model cards (the Wald or likelihood-ratio test for a yes/no outcome; Satterthwaite's or Kenward and Roger's degrees of freedom), the multinomial and interaction cards (the test of the whole outcome or of one category) and the item-bias card. Choose the one you will run; the usual one is marked. Pairwise comparisons ask whether to adjust for the number of comparisons, with Holm's method recommended if you do, and planning a whole study with two or more main analyses asks what your claim needs instead of starting at no correction. The mediation cards ask which analysis you will run (PROCESS's ordinary regression with a bootstrap is marked as the usual one), and simple mediation no longer opens on the quick estimate, which is still there as a rough first look."
