entries:
  - date: "2026-11-21"
    title: "Repeated measurements: the design finder asks what the change is"
    text: >
      For people measured many times, the design finder now asks whether
      two groups change at different rates or one group changes over time,
      and offers two scores measured together on each occasion (for
      example sleep and mood each day). Mediation with the same people
      measured more than once says plainly that the indirect effect isn't
      calculated, and which paths and timing it would need.
