entries:
  - date: "2026-11-12"
    title: "Finding your analysis takes fewer clicks"
    text: "In \"Help me choose\", the question about how many things you varied now also asks how many groups, so a two-group or three-group comparison is found one screen sooner. \"Test a prediction\" is the first and largest choice on the aim screen. In \"I know my analysis\", the groups sit in two columns, and the search finds the names you may know a test by, such as Cohen's f, f squared, mixed ANOVA or chi-square. The mediation analyses say \"mediator\" rather than \"go-between\"."
