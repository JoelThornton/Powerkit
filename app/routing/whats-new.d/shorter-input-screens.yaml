entries:
  - date: "2026-11-11"
    title: "Shorter input screens"
    text: "The input screens say less before you type. The help for power, the significance level and the direction of the test is a few sentences each; notes about how a box starts are gone unless a number is filled in for you; and two things most plans leave alone (unequal spreads between groups, and an effect that differs from study to study) sit under one closed line each. The two-group screen shows a little over half the words it did. On an analysis's page, the other test versions are folded too."
