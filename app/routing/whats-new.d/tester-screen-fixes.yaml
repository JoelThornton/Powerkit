entries:
  - date: "2026-11-16"
    title: "Small fixes to the steps, the effect section and the search"
    text: "The progress steps no longer stay on Find your analysis on a study plan's page. The effect section has one question for people unsure of their effect, and each What these terms mean link names its terms. Searching the analyses finds moderation by simple slopes, puts the best match first, and says what to search for when the words are only power or G*Power."
