entries:
  - date: "2026-11-08"
    title: "Labs: a replication planner"
    text: >-
      A new Labs tool for planning a replication of a published finding.
      Enter the original study's effect and sample size, and see the
      sample size for each goal a replication can have: a significant
      result, agreement with the original, Bayes factors, small
      telescopes, or showing the effect is too small to matter. Each is
      shown three ways: taking the original's effect at face value, with
      its uncertainty, and shrunk towards zero, with an option for effects
      that vary between studies. Record how the replication differs from
      the original, and download a plan with an R script. It works in
      sections you can come back to, and opens from the pre-replication
      notes or from "Replicate a published finding" on the start screen.
