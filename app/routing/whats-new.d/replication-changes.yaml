entries:
  - date: "2026-11-18"
    title: "Replication plans: replications that change something"
    text: >-
      A replication plan now asks what your replication keeps. An extension's added analyses are planned on their own cards
      and kept in the plan apart from the original's. A conceptual replication can be planned from the shrunk belief with more
      variation between studies, at the press of a button. A study that doesn't test the original comparison is sent to an
      ordinary study plan. The plan also asks for the checks that show a changed study still tests the same thing, and explains
      why the original's card and the Goals can give different sample sizes.
