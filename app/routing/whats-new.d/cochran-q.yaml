entries:
  - date: "2026-11-16"
    title: "Cochran's Q: yes/no answers in three or more conditions"
    text: "Powerkit now plans Cochran's Q, for the same people giving a yes/no answer once in each of three or more conditions, such as whether each person attends after no reminder, a text and a call. Choose a yes/no outcome measured once in each condition on the card for the same people measured more than once. Power and the number of people you need both run in the app, and the design finder takes you there."
