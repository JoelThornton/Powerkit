entries:
  - date: "2026-11-20"
    title: Shorter labels on study plans, the whole-study screen and the variation tool
    text: >
      Labels no longer carry a bracketed explanation or a symbol standing in
      for a word: "Significance level" replaces "Significance level (alpha)"
      everywhere (the help says it is also called alpha), "Total participants
      analysed" drops "(N)", and notes such as "separate them with commas" or
      "the same seed gives the same result" now sit beside the box instead
      of inside its label.
