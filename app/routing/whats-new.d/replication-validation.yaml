entries:
  - date: "2026-11-17"
    title: "Replication plans: how far they have been checked"
    text: "A replication plan's result and write-up now say its validation is in progress. Each goal's chance has been checked against a separate simulation of the method, and the usual significance goal and small telescopes against t-tests on simulated people; the check against published examples is still to come."
