entries:
  - date: "2026-11-20"
    title: Searching by a test's own name, and power near a target
    text: >
      "I know my analysis" now finds the structural equation modelling card
      by RMSEA and its fit tests, the repeated-measures ANOVAs by Greenhouse-
      Geisser and Huynh-Feldt, and the cards that offer the likelihood-ratio
      or Wald test by those names. When nothing matches, a link clears the
      search and shows every analysis again. The main power figure now shows
      a decimal when a whole percentage would hide which side of 80%, 90% or
      95% the power falls: 79.5% and 80.1% had both shown as 80%.
