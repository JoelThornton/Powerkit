entries:
  - date: "2026-11-21"
    title: Clearer labels and notes on several cards
    text: >
      Comparing two correlations from the same people now says which one is
      the value under no difference, because the order changes the answer.
      The two-group converter asks for a pooled t. Validating a prediction
      model says that the calibration slope you expect doesn't change the
      sample size. The agreement card says each limit is tested at half
      your significance level. The cross-lagged panel card says measurement
      error can push a cross-lagged effect either way, and simulated
      designs whose model sometimes fails to fit now say how many simulated
      studies could be analysed. Precision results from presize say the
      width holds at the values you assumed, not on average.
