entries:
  - date: "2026-11-17"
    title: "Rank tests shown beside the t-test or ANOVA"
    text: "When you plan a Wilcoxon, Mann-Whitney, Kruskal-Wallis or Friedman test, the result also gives the answer for the usual t-test or ANOVA, assuming normal scores, and says why they differ: a rank test loses a little power with normal scores and can gain it with skewed or heavy-tailed ones, while Friedman's test loses more. When you plan the t-test or ANOVA, one line asks whether you might analyse with a rank test instead, and if so to choose it now rather than after looking at the data."
