entries:
  - date: "2026-11-15"
    title: "Tidier replication plans and study plans"
    text: "Each study plan on the Study plans page can now be deleted from its own row, and its description saves as you leave the box. In a replication plan, the pre-replication notes show one question per part (the paper's own questions are in the help), the references are listed once at the foot, and the Bayes factor goals use the same evidence threshold wording as the cards. The replication's significance level and chance of success now start empty, with buttons for the usual values, and variation between studies starts at Small, since assuming none makes a replication look easier than it is."
