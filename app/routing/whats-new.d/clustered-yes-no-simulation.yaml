entries:
  - date: "2026-11-15"
    title: "Clustered yes/no outcomes can be simulated"
    text: "For a cluster-randomised or multisite trial with a yes/no outcome, you can now choose a simulation of the trial analysed with a mixed-effects logistic regression (glmer()) instead of powertools' formula. The formula stays the default and is instant, but it adds an unexplained safety margin that asks for about a sixth more groups; the simulation plans without it, and takes about two minutes for power at one size."
