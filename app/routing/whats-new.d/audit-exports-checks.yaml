entries:
  - date: "2026-11-20"
    title: Scripts and checks that match the app
    text: >
      The R script for a correlation of exactly 0 tested one-sided now runs.
      For yes/no answers with one pair of conditions tested by the
      likelihood ratio, the method and the script now say and do that, not
      a Wald test. The repeated-measures correlation shows a negative
      critical value for a lower-tail test. Ordered categories with a very
      small share in one category no longer fail their translation check.
