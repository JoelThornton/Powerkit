entries:
  - date: "2026-11-16"
    title: "One name for each thing you save"
    text: "\"Plan\" now only means a study plan: several analyses of one study, kept together. One calculation is an analysis, saved with \"Save analysis\" as an analysis file (files saved as project files open as before). The first tab is \"Power and sample size\", the start option is \"Plan a whole study\", the PDF for one analysis is its Report, and both open buttons say \"Open a saved file\". A replication plan is labelled as a kind of study plan. The list under \"I know my analysis\" links to the methods map, and the footer points to what Powerkit can and can't do."
  - date: "2026-11-16"
    title: "A calmer top row: Study plans, Tools and About"
    text: "Study plans is now a tab, next to Power and sample size, and still shows how many plans you have and whether some aren't saved to a file. Labs is called Tools, without the \"experimental\" label, in two groups: for planning and for learning. Updates are now at the end of About, with the latest changes open and the rest folded, and About lists the analyses in two lines with a link to the full list. Feedback has one button, at the top."
  - date: "2026-11-16"
    title: "One Share button that shares what you have open"
    text: "Share, at the top, now shares what is on the screen: on a result, the analysis with its result; on an input screen, your answers so far; on a study plan, the plan; anywhere else, the page. Its tooltip says which. The separate \"Copy a link\" buttons are gone, and \"Copy my answers\" is now \"Copy answers as text\". Under a result, \"Keep this result\" holds every way to come back to it, with Add to my study plan first, and the downloads are under \"Write it up\"."
