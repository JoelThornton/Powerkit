entries:
  - date: "2026-11-13"
    title: "Plan my whole study keeps its plan in a study plan"
    text: "\"Plan my whole study\" now keeps your plan in a study plan of its own, called \"Whole-study plan\" with the date until you rename it (or in the plan you were adding to). Each analysis you calculate from it goes in with its role, primary or secondary, and the plan's page shows the last whole-study simulation and \"Open the guided plan\" to carry on. \"Save this plan\" saves the whole study plan. Plans saved from \"Plan my whole study\" before this change still open, as a new study plan."
