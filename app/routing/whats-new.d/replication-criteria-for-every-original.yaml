entries:
  - date: "2026-11-19"
    title: Replication plans fit every kind of original study
    text: >
      Whether the original reported a p-value, a Bayes factor, a posterior or
      both, the replication plan now suggests criteria that fit it, greys out
      the ones it can't use, and always reports a criterion that could show
      the effect is absent, with its chance planned in advance. When that
      needs the smallest effect that would matter, the planner asks for it
      before running. The chance at a sample size you could recruit is now
      shown with the result, and the write-up states the evidence threshold
      in words.
      For a conceptual replication of an ANOVA effect with one degree of
      freedom, "Plan it this way" now really sets the shrunk belief and more
      variation between studies.
      If you plan to find out whether the effect is there or not, the plan
      now warns when its sample size gives a null result too little chance
      of showing the effect is absent, and says how many people that needs.
      If your replication adds a changed version of the original condition,
      to test whether the effect disappears in it, the planner now explains
      how to plan the comparison and why it needs about four times as many
      people.
