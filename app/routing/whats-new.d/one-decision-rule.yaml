entries:
  - date: "2026-11-21"
    title: "Study plans and planning documents state the same decision as the write-up"
    text: >-
      A study plan's design table and target, and an analysis's planning document,
      now name the test you chose and what counts as success, as the methods
      paragraph does. A non-inferiority test is no longer described as a two-sided
      equivalence test, validating a prediction model is no longer called developing
      one, the one-proportion z test is named as chosen, the test of not-close fit
      says a significant result shows close fit, and factor recovery, profile
      selection and precision plans no longer mention a significance test.
