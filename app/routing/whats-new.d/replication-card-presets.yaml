entries:
  - date: "2026-11-17"
    title: "Replication plans: numbered steps, and the original's card filled in from the plan"
    text: >-
      A replication plan's sections are now numbered steps, with a button to the next one under each.
      You choose the original study's analysis from the searchable list (its paper usually names it), or answer
      questions about the study if you're not sure. Its card then starts on the sample size, with the plan's
      significance level and chance of success, and, for the t-tests and the correlation, the original's effect,
      so you enter them once.
