entries:
  - date: "2026-11-17"
    title: "A fairer warning for moderated mediation with a yes/no X"
    text: "The result's note now gives the false-positive rate from Powerkit's largest check, 5.38% at a 5% significance level, instead of an earlier, smaller check's 6.7%. The test is still slightly liberal, so the power shown may be a little high."
