entries:
  - date: "2026-11-14"
    title: "Replication plans"
    text: "Planning a replication now has a plan of its own: choose \"New replication plan\" on the Study plans page. It keeps the pre-replication notes, the original study, the sample size for each goal a replication can have, how your replication differs and one write-up, saved and shared like any study plan. Find the original study's design with the usual questions, and its analysis is planned on its own card, with the effect labelled as the original's, and kept in the plan. These tools were in Labs before; replication plans saved there still open."
