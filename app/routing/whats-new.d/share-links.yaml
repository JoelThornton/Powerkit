entries:
  - date: "2026-11-13"
    title: "Share a plan with a link"
    text: "Next to every save button there is now \"Copy a link\". The link opens the same project, study plan or unfinished answers on any computer, so you can email it to yourself or send it to a supervisor or co-author. Your answers travel inside the link itself: powerkit stores nothing and needs no account. Anyone with the link can open the plan, so share it as you would the file. A very large plan is too long for a link; save the file instead."
