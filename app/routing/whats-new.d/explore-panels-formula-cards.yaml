entries:
  - date: "2026-11-16"
    title: "Try a different effect on more cards"
    text: "The panels \"If the effect were different\" and \"What if the true effect is smaller?\" now appear on multiple, logistic and count regression, the ANOVAs entered as partial eta-squared, moderated regression entered as the R-squared change, one and two proportions and two correlations, not only the basic tests. For an odds or rate ratio, a weaker effect means one closer to 1."
