entries:
  - date: "2026-11-17"
    title: "The smallest effect you could detect, for meta-analyses and structural equation models"
    text: "A meta-analysis of the average effect can now give the smallest average effect its number of studies could detect. A structural equation model can give the smallest misfit (RMSEA) its sample would detect, the largest RMSEA it could show to fit closely, or the smallest factor correlation or latent slope it could detect. The methods paragraph for a model-fit test now names the test of close or not-close fit when that is the one you chose."
