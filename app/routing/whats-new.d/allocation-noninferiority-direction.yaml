entries:
  - date: "2026-11-11"
    title: "Unequal group sizes no longer inflate the sample size"
    text: "Typing the size of group 2 relative to group 1 as a rounded decimal, such as 0.67, made powerkit look only at very large steps in the total and return too many people (167 where about 133 are needed). It now plans the simplest whole split that rounds to what you typed (2 to 3 for 0.67) and says so on the result. If you planned with a decimal ratio before, run the plan again."
  - date: "2026-11-11"
    title: "Non-inferiority t-tests: sample sizes corrected"
    text: "Non-inferiority tests of means (one sample, the same people twice, two groups) returned about two people too few. They are now planned as the ordinary one-sided t-test against the margin that researchers run, and agree with G*Power's approach. If you planned one before, run it again."
  - date: "2026-11-11"
    title: "A clearer message when no sample size can work"
    text: "When a one-sided test points away from the effect you entered, powerkit now says that no sample size reaches the target power and asks you to check the direction, instead of suggesting a larger sample might."
