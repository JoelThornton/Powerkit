entries:
  - date: "2026-11-17"
    title: "Choose the version of McNemar's test, and test two variances without assuming normal scores"
    text: "McNemar's test now asks which test you will run: the exact test, as before, or the chi-square test with the continuity correction (R's default) or without it (jamovi's). The test of two variances now also offers Levene's test and the Brown-Forsythe test, which don't assume normal scores; for those you choose the shape of the scores, because it changes their power."
