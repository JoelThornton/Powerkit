entries:
  - date: "2026-11-19"
    title: Clearer replication plan pages
    text: >
      With "Show explanations" on, a replication plan's guidance is shown
      in full without info buttons; with it off, the guidance sits behind
      an info button beside the heading or question it is about, rather
      than on a line of its own. The two ways to get the sample size now
      sit in their own panel, apart from the questions, and the choices'
      descriptions are no longer in bold. On every input screen, a
      section's info button now sits beside its heading.
