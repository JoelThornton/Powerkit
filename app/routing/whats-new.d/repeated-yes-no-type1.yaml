entries:
  - date: "2026-11-21"
    title: "Repeated yes/no answers: a warning when the test finds too many false differences"
    text: >-
      When the same people answer yes or no several times (the card for the same people
      measured more than once), Powerkit now also checks how often the test would find a
      difference that isn't there, at your sample size. When one answer is rare, this test
      can find one in 7% to 9% of studies instead of 5%. If it does in your design, the result,
      the write-up and the planning document say so, with the rate, and suggest more answers
      from each person.
