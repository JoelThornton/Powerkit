entries:
  - date: 2026-11-22
    title: "Moderated mediation: what the second-stage interaction means"
    text: "The interaction path MW -> Y now says which number it is: the coefficient of the product of the standardised M and W, as the regression of Y reports it. A separate simulation now also checks the power of the cards with W on the mediator-to-outcome link and with two mediators."
