entries:
  - date: "2026-11-21"
    title: "Write-ups keep your words as written and give the power reached"
    text: >-
      Your reasons, quoted in the methods and ethics paragraphs, are no longer
      changed when Powerkit rewords its units (a quoted "140 participants" stays as
      you wrote it). The ethics paragraph gives the power your sample size actually
      reaches beside the target, says when a chance is for one of several tests,
      names what a meta-analysis tests, and leaves it to you to say how you weighed
      participants' time against precision. A calculation from a finished study's own
      result (observed power) is described as retrospective.
