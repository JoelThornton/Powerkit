entries:
  - date: "2026-11-17"
    title: "The values screen reads the same with explanations on or off"
    text: "Questions and box headings now have the same wording whether explanations are on or off; turning explanations off only folds the help text away. A line under \"Your effect size, and where it comes from\" says which boxes the effect size goes in, for example \"The expected group means\" and \"The SD\" for a one-way ANOVA. Box headings no longer start with \"Effect size:\", which was wrong for boxes such as an SD."
