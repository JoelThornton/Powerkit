entries:
  - date: "2026-11-22"
    title: "The design finder keeps several outcomes; SEM help drops a number"
    text: >-
      In Help me choose, several outcome scores related to predictors together
      now have their own answer, which says Powerkit can't plan that yet and
      what to do if each outcome is a claim of its own. The regression card
      says how to plan a curved relationship. The SEM screens no longer call
      0.7 a typical loading: they say where to find a value. The evidence
      panel says once when no check is recorded.
