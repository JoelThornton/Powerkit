entries:
  - date: "2026-11-22"
    title: "Questions about your study start unanswered"
    text: "Questions that describe your study, such as which effect you test, the kind of outcome or who is assigned to the conditions, no longer start with an answer chosen for you, so clicking through can't plan a different study from yours. Confidence levels, the factor analysis's congruence target and the correlations between factors or predictors start empty, with the usual value one click away. Planning a whole study asks for your variables, significance level and target power. The replication planner and the Tools page ask for their settings too; the planner's quick answer still fills in the usual ones."
