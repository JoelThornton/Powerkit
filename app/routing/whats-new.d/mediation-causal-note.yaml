entries:
  - date: "2026-11-20"
    title: Mediation cards say what a causal reading assumes
    text: >
      Every mediation card, and the methods paragraph for a mediation plan,
      now says that the power is for the indirect effect as a statistical
      path, and that reading it as X changing Y through the mediator also
      needs the mediator measured between X and Y and no unmeasured common
      cause of the mediator and the outcome, which randomising X doesn't
      give. For the natural indirect effect, a causal quantity, it names the
      assumptions the estimate needs.
