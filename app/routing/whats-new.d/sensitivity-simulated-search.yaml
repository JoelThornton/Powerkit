entries:
  - date: "2026-11-17"
    title: "The smallest effect you could detect, on three simulated analyses"
    text: "Two paired variances, a trend in proportions across ordered groups and a comparison of d' between conditions now offer \"the smallest effect I'd have a good chance of finding\". Powerkit simulates power at several effect sizes and reads off where it reaches your target, with an interval for the simulation's uncertainty. The result names the measure, such as the variance ratio or the difference in d'."
