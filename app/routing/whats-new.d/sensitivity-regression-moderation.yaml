entries:
  - date: "2026-11-17"
    title: "The smallest effect you could detect, for moderation and categorical outcomes"
    text: "Moderation of a yes/no, count or categorical outcome, an outcome in three or more unordered categories, moderated regression with a yes/no predictor or moderator, and the three-way interaction now offer \"the smallest effect I'd have a good chance of finding\". The answer is the interaction's odds or rate ratio, the odds ratio for a category, the interaction's correlation with the outcome, or the three-way coefficient. Mediation on the moderation card doesn't offer it yet."
