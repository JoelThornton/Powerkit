entries:
  - date: "2026-11-19"
    title: Replications with unequal groups
    text: >
      The replication planner can plan a replication of two groups with
      unequal group sizes, such as twice as many people in the new
      condition. Give the ratio under Goals; the plan, its write-up, the
      number to recruit and the R script give each group's size. Equal
      groups need the fewest people: twice as many in one group needs
      about an eighth more people in total.
