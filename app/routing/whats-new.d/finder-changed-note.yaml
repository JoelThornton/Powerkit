entries:
  - date: "2026-11-21"
    title: "The input screen says when you change something the design finder set"
    text: >-
      When the design finder opens an input screen, it lists the fields it set from
      your answers, such as the type of outcome. If you then change one of them, the
      list now says so straight away, showing what your answers gave and what the
      screen says now, so you can check the screen still describes your study.
