entries:
  - date: "2026-11-08"
    title: "Methods paragraphs that let a reader redo the plan"
    text: >-
      The methods paragraph now gives every value a reader needs to repeat
      the calculation: the contrast weights for a planned contrast, the
      value to beat and the number of ratings or items for reliability and
      agreement, and the occasions and starting-level spread for growth
      curves. The question about yes/no outcomes now asks "What are you
      comparing?", with shorter answers, and About names the "Discard my
      draft" button for deleting saved answers on a shared computer.
