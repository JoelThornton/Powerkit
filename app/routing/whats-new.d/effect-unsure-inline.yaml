entries:
  - date: "2026-11-22"
    title: "The smallest detectable effect is a link in the sentence"
    text: >-
      Above the effect size, the words "the smallest effect your study
      could detect" are now the link themselves, so there's no separate
      link below the sentence. The folds that opened with a circled
      question mark now open with the same arrow as every other fold.
