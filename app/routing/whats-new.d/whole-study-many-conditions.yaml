entries:
  - date: "2026-11-21"
    title: "Plan a whole study with three or more conditions per person"
    text: "Plan a whole study now covers studies where everyone takes part in three or more conditions: one factor (a repeated-measures ANOVA), crossed with groups (a mixed ANOVA), or two factors that everyone takes every combination of. Before, these studies were sent to Help me choose and planned one analysis at a time."
