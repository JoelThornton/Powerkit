entries:
  - date: "2026-11-20"
    title: Shorter labels on the input screens
    text: >
      Long labels on the input screens, mostly the boxes for means,
      proportions, correlations and SDs, now say what the number is in a few
      words. How to enter it (the order, commas, whether it is optional) is in
      the help under the box, which shows with explanations on.
