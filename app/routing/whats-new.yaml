# "What's new" tab: changes people using the app would notice, in plain
# words, newest first. Add an entry with every PR that changes what users
# see (engine/NEWS.md keeps the developer notes). Rules, checked by
# tests/testthat/test-whats-new.R: a date (YYYY-MM-DD), a short title and a
# sentence or two of text; newest first; no internal codes such as E5 or
# "Departure 6"; name the analysis instead.
entries:
  - date: "2026-10-27"
    title: "Text fixes: results, the analysis list and mediation"
    text: >-
      The plain-words line under a result no longer rounds 95% power up to
      "10 in 10 studies"; it now says "95 in 100", and fits equivalence
      tests. The analysis list and the methods paragraph no longer label
      mediation by PROCESS model numbers, and a few out-of-date or garbled
      lines are corrected.
  - date: "2026-10-27"
    title: "Power for studies where people are randomised within groups"
    text: >-
      The "People nested in groups" card now also covers studies where every
      class, clinic or team has people in both conditions, such as pupils
      randomised within each school. You say how much the effect is likely
      to vary from group to group, and the result shows how the grouping
      changes the number of people you need.
  - date: "2026-10-27"
    title: "Power for studies where whole groups get the condition"
    text: >-
      If whole classes, clinics or teams are assigned to a condition, the
      card "People nested in groups" now calculates power, the number of
      groups you need, or the smallest effect you could detect. You enter
      how many people are in each group and how alike people in the same
      group are, and the result shows how much the grouping costs compared
      with a study of separate people.
  - date: "2026-10-27"
    title: "Whole-study simulation: find your sample size on your computer"
    text: >-
      The whole-study simulation now runs a quick look in the app, and
      gives you an R script for the full run on your own computer. The
      script can find the sample size you need for the power you choose,
      for all of your main analyses together, or work out the power at
      your N more precisely. It is still experimental.
  - date: "2026-10-27"
    title: "A simpler whole-study plan"
    text: >-
      When powerkit can simulate your whole study, your plan now starts
      with it: describe the study once and see every analysis's power. The
      separate calculations are still there, folded underneath, and the
      plan page is shorter. Mediation cards now lead with the analysis's
      own name; the PROCESS model number is a note for people who use
      PROCESS.
  - date: "2026-10-27"
    title: "Experimental: simulate your whole study at once"
    text: >-
      On "Plan my whole study", you can now describe your study once and
      have every planned analysis run on the same simulated studies. You
      see each analysis's power, the chance that all of your main analyses
      succeed together, and whether the numbers you entered for separate
      analyses describe the same study. It is experimental and waiting for
      a statistician's check, so use it to explore, not to report.
  - date: "2026-10-27"
    title: "Show that a difference is too small to matter"
    text: >-
      You can now plan an equivalence test: the two one-sided tests (TOST)
      that show a difference lies inside bounds you set, rather than just
      failing to find it. It works for two groups, the same people measured
      twice, or one mean against a fixed value, with the bound and the
      expected difference as Cohen's d or in your measure's own units.
  - date: "2026-10-27"
    title: "Six more analyses checked against published examples"
    text: >-
      Planned contrasts, logistic regression, the tests from a
      noncentrality parameter, comparing two correlations in the same
      people, and the two tests of how spread out scores are now give the
      same answers as the published G*Power examples, so their cards now
      say "Validated". Nothing about the calculations changed.
  - date: "2026-10-27"
    title: "Safeguard power for an effect size from one study"
    text: >-
      If your effect size comes from one earlier study or a pilot, you can
      now plan with a safer, smaller value: the lower end of a confidence
      interval around that study's estimate. Give the earlier study's sample
      size and powerkit works it out, so your study keeps its power if the
      true effect is smaller. Available for the t-tests and the correlation.
  - date: "2026-10-27"
    title: "A map of the methods, in Labs"
    text: >-
      Labs has a new map of every analysis powerkit knows about, drawn
      as a cosmos: each thing a study can want to show is a star, with its
      analyses as planets around it. Fly about by dragging and zooming,
      search, filter down the side by outcome, how often people are
      measured and whether powerkit calculates it, and click a planet to
      see how to get there and read about it. A switch shows the tests'
      usual names instead of plain words.
  - date: "2026-10-27"
    title: "Share a page by link"
    text: >-
      Press "Share this page" at the top right to copy a link that opens
      straight on the page you're looking at, such as the pre-replication
      notes in Labs, ready to paste into an email or message.
  - date: "2026-10-27"
    title: "See how much the answer depends on the effect"
    text: >-
      On the result for a t-test or a correlation, you can now enter a
      smaller and a larger effect you would still find plausible. powerkit
      draws power for those and your plan's effect on one chart, and says
      how many participants each would need, so you can see how much
      rides on being right about the effect.
  - date: "2026-10-27"
    title: "Give your effect in your measure's own units"
    text: >-
      For the one-sample, two-group and paired t-tests you can now enter
      the effect as you think of it: say 4.5 against 3.8 on a 1 to 7 scale,
      with an SD of 1.2. powerkit works out Cohen's d for you and shows it
      on the result. If you ask for the smallest effect you could detect,
      it is also given in your measure's units.
  - date: "2026-10-26"
    title: "Easier to read on large screens, and the result comes into view"
    text: >-
      On large screens the text is now a little bigger, so you shouldn't
      need to zoom in, and zooming in no longer makes the page scroll
      sideways. After "Check my answers", the page moves to your result.
      The result screen is reordered: your answer and notes on reading it,
      then exploring, then saving and the write-up, with how it was
      calculated last. The short write-up for your paper is shorter, and
      its longer versions are folded away until you open them.
  - date: "2026-10-26"
    title: "Your whole study's sample size"
    text: >-
      In "Plan my whole study", each sample size you work out from the plan
      now appears on it, and the plan gives the sample size your study
      needs: the largest of your main analyses, with that analysis named.
      Until you have done them all, it shows the largest so far and which
      are still to do.
  - date: "2026-10-26"
    title: "Type shared numbers once"
    text: >-
      When two analyses on your plan ask for the same number, such as the
      path from X to the mediator, you type it once: it is filled in when
      you open the other analysis, so both describe the same study. You can
      still change it there.
  - date: "2026-10-26"
    title: "Hypotheses about how much scores vary"
    text: >-
      Some hypotheses are about spread, not averages: that reaction times
      become more consistent with practice, say, or that one group's
      answers vary more than another's. powerkit can now plan for these,
      for one group against a fixed value or for two groups. Choose "That
      scores are more spread out (or more consistent)" on the first
      question. Power for these tests is simulated, so the answer can
      differ from G*Power's by a participant or two.
  - date: "2026-10-26"
    title: "Comparing two correlations in the same people"
    text: >-
      powerkit can now work out the sample size or power for comparing two
      correlations measured in the same people: for example, whether
      wellbeing is more strongly related to self-control than to grit, or
      whether the link between stress and sleep is stronger at 16 than at
      14. Find it under "A relationship between two things you measure".
  - date: "2026-10-26"
    title: "Planned comparisons among three or more groups"
    text: >-
      If your hypothesis is about a specific comparison, such as both kinds
      of feedback beating no feedback, or scores rising steadily with the
      dose, powerkit can now work out the sample size or power for that
      comparison itself, rather than for "any difference among the
      groups". You give the group means and a weight for each group that
      says which comparison you mean.
  - date: "2026-10-26"
    title: "Poisson regression: predicting a count"
    text: >-
      powerkit can now work out the sample size or power when you predict a
      count, such as how many times someone visits a clinic in a year, from
      a score or a yes/no group. You enter the rate ratio, the starting
      rate and how long people are followed. It assumes the counts vary as
      much as their average; counts that vary more need a negative binomial
      model, which powerkit doesn't do yet.
  - date: "2026-10-26"
    title: "Logistic regression: predicting a yes/no outcome"
    text: >-
      powerkit can now work out the sample size or power for a logistic
      regression, where one predictor (a score, or a yes/no group) predicts
      a yes/no outcome such as whether someone seeks help. You enter the
      odds ratio and how common "yes" is to start with; if your model has
      other predictors, you say how much they overlap with this one. Until
      today this card said powerkit couldn't do it.
  - date: "2026-10-26"
    title: "A simpler first screen"
    text: >-
      The first screen now asks just one thing: how you want to start. The
      next screen asks what your study is trying to do. Whether your sample
      size is fixed, and whether your conclusion rests on several tests,
      are now asked on the screen where you enter your numbers; most
      studies rest on one test, so that setting starts there.
  - date: "2026-10-26"
    title: "A cleaner, simpler look"
    text: >-
      The app has a new look. "Back" and "Start again" are at the top of
      every screen, and the next step (such as "Enter your values" or "Check
      my answers") stays in view at the bottom of the window. Choices are
      cards, the starting questions fit on one screen, results come in
      clear sections with the details folded away, and there is less
      technical text to wade through.
  - date: "2026-10-26"
    title: "Calculate from your whole-study plan"
    text: >-
      In "Plan my whole study", each analysis on your plan that powerkit can
      calculate now has an "Enter your values" button. If you have several
      main analyses, the input screen already knows how they combine and how
      many there are, and "Back to my plan" takes you back to the plan.
  - date: "2026-10-26"
    title: "powerkit has a version number"
    text: >-
      The About page now says which version of powerkit you are using, and
      so does every result and every R script you download, so a sample
      size you quote in a paper can be traced back to the version that
      worked it out. This is 0.4; version 1.0 will be the first proper
      release, once the numbers are fully checked.
  - date: "2026-10-26"
    title: "Straight to the list of analyses"
    text: >-
      If you already know which analysis you want, "I know my analysis" no
      longer makes you answer the four screening questions first: one
      button shows every analysis powerkit knows about, as a menu. Some of
      them won't suit your design and nothing checks that for you, so each
      analysis's card still says what its test assumes; the four questions
      are there on the list if you would rather have it narrowed down.
  - date: "2026-10-22"
    title: "The browser's Back button works"
    text: >-
      Your browser's Back and Forward buttons now move between powerkit's
      screens, instead of leaving the site. What you typed on the input
      screen is still there when you come forward again.
  - date: "2026-10-22"
    title: "Help when you're not sure of your effect size"
    text: >-
      The effect-size section now explains, in plain words, the ways to a
      number you can defend, starting from the smallest difference that
      would matter in your measure's own units. If you don't know what to
      expect, one button sets powerkit to show the smallest effect your
      sample could detect instead.
  - date: "2026-10-22"
    title: "Labs: choose a tool, and keep your work"
    text: >-
      Labs now opens on a list of tools. When you go from your
      pre-replication notes to planning the replication's sample size,
      powerkit asks before replacing a plan you've started, copies your
      notes' words into the reason for your effect size, and gives you a
      link back to the notes, which are kept.
  - date: "2026-10-22"
    title: "Clearer boxes and problems where they are"
    text: >-
      The boxes on the input screen have shorter names, with a line of help
      underneath, and definitions open when you ask for them. When
      something needs fixing, the message now appears right under the box
      as well as in the list at the bottom.
  - date: "2026-10-22"
    title: "See where you are"
    text: >-
      Four steps across the top show where you are: your study, finding
      your design, your numbers and the result. Analysis cards are shorter:
      the details of what you'd enter and which package calculates it are
      under "More about this analysis".
  - date: "2026-10-22"
    title: "A shorter input screen"
    text: >-
      The screen where you enter your values now starts with what you want
      to find out, and only shows the boxes that goal needs. Your effect
      size and where it comes from sit together, and settings you rarely
      change are folded into one line you can open.
  - date: "2026-10-22"
    title: "Rank-based tests, observed power and other tools"
    text: >-
      Cards for t-tests, correlations and one-way ANOVA now say that their
      figure only approximates a rank-based test such as Mann-Whitney. You
      can choose your finished study's own result as the effect size, with
      a warning about observed power. Cards for designs powerkit doesn't
      cover yet name established tools you can use instead.
  - date: "2026-10-22"
    title: "Long calculations take turns"
    text: >-
      Interactions in regression and mediation take a while to calculate,
      and everyone using powerkit online shares one server. If several
      people start one at the same moment, you may be asked to try again
      in a minute or two. Quick calculations aren't affected.
  - date: "2026-10-22"
    title: "A Feedback tab"
    text: >-
      Tell us about a problem, ask a question or suggest something from the
      new Feedback tab, or from "Something doesn't fit?" on any card. It
      adds where you are in powerkit for you and shows the whole message
      first. Click Send; no account is needed, and you can leave an email
      if you'd like a reply.
  - date: "2026-10-22"
    title: "Fewer notes for the developers"
    text: >-
      The grey "Undecided" boxes and the tab of open questions were notes
      for powerkit's developers. They are gone from the screens you see.
  - date: "2026-10-22"
    title: "Clearer labels"
    text: >-
      The banner at the top now names the analyses that calculate in plain
      words. In "Plan my whole study", the combined sample size and the
      consistency check are marked "Coming soon"; until then, use the
      largest sample size from your analyses' cards.
  - date: "2026-10-20"
    title: "Labs: pre-replication notes"
    text: >-
      A new, experimental Labs tab. Its first tool helps you think before
      replicating a finding: three questions from a recent paper on
      pre-replication, answered in your own words, plus the smallest effect
      the original study could detect. Nothing is required or scored, and
      deciding a finding isn't worth replicating counts as a good outcome.
  - date: "2026-10-20"
    title: "Generic t, F, chi-square and z tests"
    text: >-
      If you have already worked out your test's noncentrality parameter, as
      with G*Power's generic tests, choose "Generic t, F, chi-square and z
      tests" under "I know my analysis". You get the power for that
      noncentrality, or the noncentrality you'd need; there is no sample
      size, because the noncentrality already reflects it.
  - date: "2026-10-19"
    title: "Asked whether your hypothesis predicts a direction"
    text: >-
      For tests that can be one-sided, the input screen now starts by asking
      whether your hypothesis predicts a direction, instead of filling in a
      two-sided test for you.
  - date: "2026-10-19"
    title: "Planning for a claim that needs every test to be significant"
    text: >-
      If your claim needs all of several tests to be significant, powerkit
      now asks how many and plans each test at a higher power, so that all
      of them together reach the power you chose. Where it says no
      correction is needed for separate claims, it now notes that not
      everyone agrees.
  - date: "2026-10-19"
    title: "Check a plan someone shared with you"
    text: >-
      Supervisors, reviewers and colleagues can open a saved plan from the
      start screen and see what it assumes, what it found and which
      questions are worth asking, such as a missing reason for the effect
      size or no allowance for drop-out. It doesn't change the file or give
      a pass or fail.
  - date: "2026-10-19"
    title: "A plain-words version of the write-up for ethics applications"
    text: >-
      Under the write-up there is now a third box that explains, in words an
      ethics panel can follow, why you plan this many participants: the
      effect you planned for and why, and the chance of finding or missing
      it. It describes the plan; it doesn't judge whether the study is
      ethical.
  - date: "2026-10-19"
    title: "A reason is asked for if you change the significance level or test direction"
    text: >-
      The significance level (.05) and a two-sided test stay filled in. If you
      change either, a box asks why. It's optional, and what you write goes
      into the write-up.
  - date: "2026-10-19"
    title: "Two new analyses: goodness of fit, and comparing two correlations"
    text: >-
      You can now plan a chi-square goodness-of-fit test (one group's answers
      across several categories, compared with expected proportions) and a
      comparison of the same correlation in two separate groups. Neither has
      been checked against G*Power yet; their cards say so.
  - date: "2026-10-19"
    title: "\"Guess first\": write down your guess before you see the answer"
    text: >-
      At the end of each input screen you can write down the sample size or
      power you expect. The result screen then shows your guess next to the
      answer. It's a learning aid only: the guess isn't saved in your plan
      and nothing is collected.
  - date: "2026-10-19"
    title: "More analyses can find the smallest effect you could detect"
    text: >-
      If you can't justify an effect size, or your sample size is fixed, the
      app can now find the smallest effect you could detect for two
      proportions, the chi-square test and interactions in regression. For
      interactions it uses a quick formula, which the result screen labels.
  - date: "2026-10-19"
    title: "The app asks whether your reasoning still applies"
    text: >-
      If you change the effect size after explaining why you chose it, the
      result screen asks whether your reasoning still applies, rather than
      quietly keeping a reason written for a different number.
  - date: "2026-10-19"
    title: "Fisher's exact test and one-way ANCOVA"
    text: >-
      Comparing two proportions now offers Fisher's exact test for small
      samples, and one-way ANCOVA (group means adjusted for covariates)
      calculates in the app.
  - date: "2026-10-18"
    title: "A methods paragraph you can copy"
    text: >-
      The result screen now writes a short and a full methods paragraph for
      your power analysis, with the citations to use, ready to paste into a
      preregistration, ethics application or paper.
  - date: "2026-10-18"
    title: "One-way ANOVA, regression, one proportion and McNemar's test"
    text: >-
      These four analyses now calculate in the app. Welch's t-test can also be
      calculated by formula as well as by simulation.
  - date: "2026-10-18"
    title: "A clearer start, and a clearer result screen"
    text: >-
      The first screen now asks about your situation (including a sample
      size that's already fixed), your aim and the claim you want to make.
      The effect-size screen asks where your effect size comes from, with a
      way through if you can't justify one. The result screen gives a plain
      reading of the answer and shows 80% and 95% power side by side.
  - date: "2026-10-18"
    title: "The app is online"
    text: >-
      You can use powerkit in a web browser, without installing R. It updates
      itself each time a change is approved.
  - date: "2026-10-18"
    title: "Save your plan and reopen it later"
    text: >-
      You can save an analysis to a file, reopen it in the app, and rerun it
      to get the same result.
  - date: "2026-10-18"
    title: "Mediation and moderated mediation"
    text: >-
      Mediation models give a quick rough preview of power in the app, then
      either run the full analysis here (it takes several minutes) or give
      you an R script to run on your own computer.
  - date: "2026-10-18"
    title: "Dropout: how many to recruit"
    text: >-
      If you expect some participants to drop out, the result shows both the
      number you need to analyse and the number to recruit.
  - date: "2026-10-17"
    title: "The first working prototype"
    text: >-
      The design finder, the cards and the input screens for the t-tests, the
      correlation, two proportions, the chi-square test, 2 x 2 designs and
      interactions in regression.
