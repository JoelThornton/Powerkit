# The Updates tab (once "What's new"): changes people using the app would notice, in plain
# words, newest first. Add an entry with every PR that changes what users
# see (engine/NEWS.md keeps the developer notes). Rules, checked by
# tests/testthat/test-whats-new.R: a date (YYYY-MM-DD), a short title and a
# sentence or two of text; newest first; no internal codes such as E5 or
# "Departure 6"; name the analysis instead.
entries:
  - date: "2026-11-01"
    title: "A Bayes factor test for two groups' proportions"
    text: >-
      The card for two groups' proportions now offers a Bayes factor test,
      with the same Bayes factor and default prior as JASP's Bayesian
      contingency tables. It shows the chance of strong evidence, and what
      the study would show if the groups didn't differ.
  - date: "2026-11-01"
    title: "Meta-analysis: moderators that are scores, and heterogeneity"
    text: >-
      The meta-analysis card can now plan a meta-regression, whether the
      effect changes with a score measured on each study such as its
      participants' mean age, and the test of whether the studies' effects
      differ at all.
  - date: "2026-11-01"
    title: "Meta-analyses where studies give several results"
    text: >-
      The meta-analysis card can now plan for studies that each report
      several effect sizes, such as several outcomes or time points,
      allowing for how alike the results from one study are.
  - date: "2026-11-01"
    title: "Whole-study simulation: more designs measured twice"
    text: >-
      When each person is measured twice, the experimental whole-study
      simulation now handles two mediators (side by side or in a chain)
      and moderated mediation where the moderator changes one link, with
      every analysis adjusting for the first measurement.
  - date: "2026-11-01"
    title: "Clearer questions and analysis cards"
    text: >-
      Each question in "Help me choose" now says which number it is, keeps
      "None of these fit" apart from the answers, and can be answered with
      the number keys. Your answers so far show the question each one
      answered. An analysis card now says at a glance how it calculates,
      which package does it and how far its checks are, lists what you'll
      need before you start, and gathers its other versions in one box.
  - date: "2026-11-01"
    title: "Faster screens"
    text: >-
      Moving from one screen to the next, such as opening the list of
      analyses or an input screen, is quicker: the app now keeps the parts
      of a screen it has already built instead of building them again on
      every click.
  - date: "2026-11-01"
    title: "A predictor that changes from trial to trial"
    text: >-
      The card for participants responding to many items now also plans
      studies where the predictor is measured on each trial, such as how
      long a picture is shown, so it varies within items as well as
      between them.
  - date: "2026-11-01"
    title: "Predictors at all three levels"
    text: >-
      The card for people in groups with predictors at each level can now
      take groups within larger groups, such as classes within schools,
      with a predictor measured on each school and its interaction with
      the predictor measured on each person.
  - date: "2026-11-01"
    title: "How many items or stimuli?"
    text: >-
      The card for participants responding to many items in two conditions
      can now find the number of items you need for the participants you
      will have, rather than the number of participants for a set of items.
  - date: "2026-11-01"
    title: "Precise estimates for more kinds of result"
    text: >-
      Planning for a narrow confidence interval now also covers a
      difference between two groups' means in the outcome's own units, an
      odds ratio, an intraclass correlation (agreement between raters) and
      one predictor's coefficient in a multiple regression.
  - date: "2026-11-01"
    title: "Yes or no outcomes for people in groups"
    text: >-
      The two-level card (people in groups, with a predictor on each person
      and one on each group) and the three-level card (pupils in classes in
      schools) now also plan studies where the outcome is yes or no, such as
      passed or not, as a logistic mixed model.
  - date: "2026-11-01"
    title: "A Bayes factor test for a correlation"
    text: >-
      The correlation card now offers a Bayes factor test of Pearson's r,
      with the same Bayes factor and default prior as JASP's Bayesian
      correlation. It shows the chance of strong evidence, and what the
      study would show if there were no correlation.
  - date: "2026-11-01"
    title: "A clearer About page, and Updates"
    text: >-
      The About page now says in three steps how powerkit works, shows
      every analysis that calculates grouped by family (click one to plan
      it), and folds each package's citation under "How to cite". The
      "What's new" tab is now Updates, next to Feedback: a timeline of the
      changes, each opening to say more, with Full details showing them
      all, a search box, and the changes since you last looked marked New.
      Every tab now sits in the same place, and the blue bar spans the
      whole window.
  - date: "2026-11-01"
    title: "A Bayes factor test for one proportion"
    text: >-
      The card for one proportion (for example, guessing right more often
      than chance) now offers a Bayes factor test as well as the exact
      binomial test, with the same prior as JASP's Bayesian binomial test.
      It shows the chance of strong evidence, and what the study would show
      if there were no effect.
  - date: "2026-11-01"
    title: "A new methods map"
    text: >-
      The methods map in Labs now opens full screen. Find a study like
      yours and it moves to the middle, with the simpler designs that lead
      to it on one side and the ways to change it on the other, each saying
      what changes. It shows which test each analysis uses, and "Plan this
      study" takes you straight to it.
  - date: "2026-11-01"
    title: "A clearer result"
    text: >-
      The result now starts with the answer in large type, with what it
      assumes beside it. Below it, "How sure can you be?" shows how the
      answer changes if the effect is smaller or larger, and the write-up
      comes with a Copy button.
  - date: "2026-11-01"
    title: "Bayes factors checked as the data come in"
    text: >-
      The Bayesian planning tool in Labs now plans sequential studies,
      which compute the Bayes factor as the data come in and stop as soon
      as the evidence is strong either way, or at the largest sample size
      you can afford. It shows how often the study stops each way, how
      large it usually is when it stops, and how that compares with
      testing once at the end. When you give your uncertainty about the
      effect, the tool and the Bayes factor cards now call the result the
      study's assurance: its chance of success given what you believe.
  - date: "2026-11-01"
    title: "Items that differ on a score, such as word frequency"
    text: >-
      A new card plans studies where each participant responds to many
      items that differ on something measured on each item, such as how
      often a word is used, with a score or a yes/no answer on each trial.
  - date: "2026-11-01"
    title: "Three levels: pupils in classes in schools"
    text: >-
      A new card plans studies with groups inside larger groups, such as
      pupils in classes in schools, with the conditions given to whole
      schools, to classes within each school or to pupils within each
      class. "Help me choose" asks whether your groups are part of larger
      groups.
  - date: "2026-11-01"
    title: "A tidier input screen that says what's left"
    text: >-
      The screen where you enter your numbers is easier to read, and the bar
      at the bottom now counts the answers still needed. Click it to jump to
      the next empty one.
  - date: "2026-11-01"
    title: "An easier list of analyses"
    text: >-
      "I know my analysis" has a bigger search box that counts the matches
      as you type, one-click shortcuts to common analyses, and tidier groups
      with labels for analyses that don't run yet. Going back from a card
      now returns you to the same place in the list.
  - date: "2026-11-01"
    title: "Correct or not on each trial"
    text: >-
      The cards for participants responding to many items or stimuli now
      plan studies with a yes/no answer on each trial, such as correct or
      not, as a logistic mixed model; and the card for three or more
      conditions also plans studies where each participant is in one of
      the conditions.
  - date: "2026-11-01"
    title: "Couples and other pairs: actor and partner effects"
    text: >-
      A new card plans studies of pairs of people, such as couples, where
      each person's score (for example, stress) can affect their own
      outcome and their partner's: the actor-partner interdependence
      model, for pairs whose members can be told apart (a woman and a man)
      or not (two friends), and the chance that the actor and partner
      effects both come out significant in the same study.
  - date: "2026-11-01"
    title: "Simulated data sets for more designs"
    text: >-
      The made-up practice data set you can download with a result is now
      there for multiple regression, regression with other predictors,
      ANCOVA with two factors, the trend test for proportions, multisite
      and group trials with a yes/no outcome or a baseline score, and
      precision planning. Where the plan leaves something open, a note
      says what the data set assumes.
  - date: "2026-11-01"
    title: "Plan for a precise estimate"
    text: >-
      A new analysis plans the sample size for how narrow a confidence
      interval you want, rather than for power: for Cohen's d between two
      groups, paired scores, a standardised mean, a correlation or a
      proportion. You can also see how wide the interval would be at a
      sample size you have, and for d ask for a chance that it is narrow
      enough.
  - date: "2026-11-01"
    title: "Bayesian planning in Labs"
    text: >-
      A new Labs tool for a Bayes factor t-test: choose the prior the Bayes
      factor will use and, separately, what you believe about the effect,
      and see how often a study of the size you set would give strong
      evidence for an effect, strong evidence for no effect, or neither,
      both if your belief is right and if there is no effect.
  - date: "2026-11-01"
    title: "Different SDs and correlations in mixed and two-factor repeated-measures designs"
    text: >-
      The 2 x 2 mixed ANOVA, the larger mixed ANOVA (for example group by
      three timepoints) and the two-factor within-participants ANOVA can
      now take a different SD in each cell and a different correlation
      for each pair of measurements, with a Greenhouse-Geisser or
      Huynh-Feldt correction where it applies.
  - date: "2026-11-01"
    title: "Meta-analysis: do kinds of study differ?"
    text: >-
      The meta-analysis card can now plan a subgroup analysis: whether the
      effect differs between kinds of study, such as lab and online
      studies, as well as the test of the average effect.
  - date: "2026-11-01"
    title: "Trend tests for groups in a set order"
    text: >-
      Two new analyses for three or more groups in an order, such as doses
      or age bands: the Jonckheere-Terpstra test, for a steady rise or fall
      in scores, and the Cochran-Armitage test, for a rising or falling
      proportion of "yes". Both can be one- or two-sided, with equal or
      unequal groups, and the design finder leads to them.
  - date: "2026-10-31"
    title: "The power visualiser shows a correlation too"
    text: >-
      In Labs, the power visualiser now also draws power for a
      correlation: move the number of participants and the correlation,
      and see how the two curves pull apart, with the smallest correlation
      that would be significant.
  - date: "2026-10-31"
    title: "Choose a significance level by weighing the two mistakes"
    text: >-
      The one-sample, paired and two-group t-tests and the correlation
      have a new goal: instead of always using 5%, find the significance
      level that best balances a false positive against a missed effect,
      for the sample size you have. You say how much worse a false
      positive would be; the result shows the level, the power at it and
      the power at 5% for comparison.
  - date: "2026-10-31"
    title: "Many items per person in three or more conditions"
    text: >-
      A new card plans studies where each participant responds to many
      items or stimuli in three or more conditions, such as happy, angry and
      neutral faces, with every participant in every condition or each in
      one of them: either whether the conditions differ at all, or one pair
      of conditions, adjusted for the number of pairs.
  - date: "2026-10-31"
    title: "Minimum-effect tests, and a point-biserial r for two groups"
    text: >-
      The one-sample, paired and two-group t-test cards have a new test
      version, the minimum-effect test: it plans to show an effect is
      larger than your smallest effect of interest, not only that it isn't
      zero. The two-group card also takes the effect as a point-biserial
      correlation, as G*Power's point-biserial model does.
  - date: "2026-10-31"
    title: "Many items per person, with the conditions given to different people"
    text: >-
      The card for participants responding to many items or stimuli now
      also plans studies where each participant is in one of the two
      conditions, for example one group rating emotional words and another
      neutral words.
  - date: "2026-10-31"
    title: "MANOVA with two factors"
    text: >-
      The MANOVA card now plans a study with two factors crossed, such as
      condition by delivery, compared on several outcomes at once: either
      factor's effect, or their interaction.
  - date: "2026-10-31"
    title: "Whole-study simulation for before-and-after studies"
    text: >-
      "Plan my whole study" now simulates studies where each person is
      measured twice, for example before and after a programme. Every
      analysis compares the second measurement after adjusting for the
      first, as an ANCOVA does, so a group comparison can be planned
      together with a moderation or a mediation. Still experimental.
  - date: "2026-10-31"
    title: "Saved results open straight away; more tests calculated exactly"
    text: >-
      Opening a saved project now shows its result as it was saved, without
      running it again, so a long simulation doesn't have to be repeated;
      a button runs it again to check. Projects saved before this version
      still run when opened. The tests of one or two variances, and
      Hotelling's T-squared (one group's several outcomes compared with
      fixed values, or a MANOVA of two groups), are now calculated exactly,
      as G*Power does, instead of simulated, so they answer straight away.
  - date: "2026-10-31"
    title: "Fixes, and clearer names"
    text: >-
      Repeated-measures and mixed ANOVA with three or more conditions now
      give the right answer from a published partial eta-squared (before,
      power was too low). MANOVA, and 2 x 2 designs with unequal groups,
      now work for every goal. Long simulations show a progress bar. The
      meta-analysis card talks about studies, not participants. The search
      finds more test names, such as Mann-Whitney, Kruskal-Wallis and post
      hoc. The Labs tools have plain names: Methods map, Power visualiser
      and Effect size converter.
  - date: "2026-10-31"
    title: "Multilevel models with predictors at both levels"
    text: >-
      For people within groups (pupils in classes, patients in clinics),
      powerkit now simulates power for a predictor measured on each person,
      one measured on each group, and whether the person-level effect
      depends on the group-level one. "Help me choose" asks one new
      question to tell this apart from a cluster-randomised trial. Not yet
      checked by a statistician.
  - date: "2026-10-31"
    title: "Whole-study simulation with two groups"
    text: >-
      "Plan my whole study" can now simulate a study whose main predictor is
      two groups or conditions: the comparison of the groups together with
      a moderation or a mediation on the same people, with the chance that
      all of them come out significant together. Still experimental.
  - date: "2026-10-31"
    title: "Show or hide explanations"
    text: >-
      Turn "Explanations" off at the top of the page to see the technical
      names first (one-way repeated-measures ANOVA, rather than its plain
      description) and hide the explanations of terms. The help under each
      question, and warnings and notes that change what you should do,
      stay. Your browser remembers the setting.
  - date: "2026-10-31"
    title: "Find your analysis faster"
    text: >-
      "I know my analysis" now goes straight to a list of every analysis,
      grouped by family (t-tests, ANOVA, regression, mediation and so on),
      with a search box at the top. Open a group, or type a few words such
      as "repeated measures" or "logistic". The screening questions are
      still there under "Help me choose".
  - date: "2026-10-31"
    title: "Meta-analysis: the Hartung-Knapp test"
    text: >-
      The meta-analysis card now plans for the Hartung-Knapp test under the
      random-effects model, which keeps false positives closer to the
      significance level than the z test, especially with few studies. It
      gives a more cautious number of studies; the z test is still one
      click away.
  - date: "2026-10-31"
    title: "Planning a meta-analysis"
    text: >-
      A new card plans a meta-analysis: how many studies you need, or the
      power you can expect, to detect the average effect, under the
      fixed-effect or random-effects model. Choose "Combine studies others
      have done" when the design finder asks what your study is trying to
      do.
  - date: "2026-10-31"
    title: "Cohen's w for the chi-square tests"
    text: >-
      The chi-square test of independence and the goodness-of-fit test now
      accept Cohen's w, as G*Power does, instead of a table of proportions,
      for when w is the number an earlier paper gives.
  - date: "2026-10-31"
    title: "Partial eta-squared for ANCOVA and three-factor designs"
    text: >-
      The ANCOVA card and the three-factor card (when every factor is
      between participants) now accept the partial eta-squared of the
      effect, as G*Power does, so you no longer need adjusted means or the
      covariates' R-squared from an earlier paper. A published F converts
      into it.
  - date: "2026-10-31"
    title: "Repeated measures that don't vary equally"
    text: >-
      The one-way repeated-measures card can now take a different SD for
      each condition and a different correlation for each pair, with a
      Greenhouse-Geisser or Huynh-Feldt correction if you will report one.
  - date: "2026-10-31"
    title: "A picture of power, in Labs"
    text: >-
      Labs has a new tool for seeing what power is: move the sample size
      and the effect for a two-group t-test, and watch the two t
      distributions, the power and the smallest effect that would be
      significant change.
  - date: "2026-10-31"
    title: "More simulated data sets"
    text: >-
      The simulated data set download now covers MANOVA, one group's several
      outcomes against fixed values, and the one-way ANCOVA, where one
      covariate stands for all of yours; the page says so beside the download.
  - date: "2026-10-31"
    title: "Friedman's test, and rank correlations for skewed data"
    text: >-
      The one-way repeated-measures card now calculates Friedman's test,
      the rank-based version, for normal, skewed or heavy-tailed scores.
      Spearman's and Kendall's correlations can now be planned for skewed or
      heavy-tailed scores too, where they have their advantage.
  - date: "2026-10-31"
    title: "Pairwise comparisons after an ANOVA"
    text: >-
      If you will analyse a study with three or more groups or conditions
      by comparing pairs of them, the one-way ANOVA cards can now give the
      power of the pair you care about, with the comparisons adjusted for
      their number by Holm's or Bonferroni's method.
  - date: "2026-10-31"
    title: "One group's several outcomes against fixed values"
    text: >-
      You can now plan a study that compares one group with fixed values,
      such as published norms, on several outcomes at once (a one-sample
      Hotelling's T-squared test). Give each outcome's expected mean, the
      value it is compared with, the SDs and how strongly the outcomes are
      correlated.
  - date: "2026-10-31"
    title: "A published t converted more exactly"
    text: >-
      When you enter an effect as a published t or F, powerkit now turns it
      into Cohen's d from the study's sample size rather than its degrees of
      freedom, as the usual formula does, and can take the two group sizes
      when they differ. With small or uneven groups the effect size can
      change noticeably, so check any plan made on 30 October with a
      converted t or F.
  - date: "2026-10-31"
    title: "Saved simulations reopen with the same answer"
    text: >-
      A saved plan whose power was simulated now reproduces exactly on
      another computer, whatever number of processor cores it has.
  - date: "2026-10-30"
    title: "MANOVA and Hotelling's T-squared"
    text: >-
      You can now plan a study that compares two or more groups on several
      outcomes at once (a one-way MANOVA, or Hotelling's T-squared for two
      groups). Give each group's expected means, the outcomes' SDs and how
      strongly the outcomes are correlated.
  - date: "2026-10-30"
    title: "The chance that every outcome is significant"
    text: >-
      When your study plan compares the same randomised groups on several
      outcomes, it can now tell you the chance that all of them are
      significant in the same study, given how strongly the outcomes are
      correlated. It is lower than each outcome's own power.
  - date: "2026-10-30"
    title: "Latent profile and latent class analysis"
    text: >-
      Planning to find types or profiles of people? A new card explains
      what decides whether a study can find them, from published
      simulation studies: how far apart the profiles are matters more than
      the sample size. powerkit can't calculate this, and the card says how
      to simulate your own model.
  - date: "2026-10-30"
    title: "A study plan for several analyses"
    text: >-
      After any result, you can add the analysis to your study plan, then
      find the next one with "Help me choose". The plan lists every
      analysis with its sample size, names the largest, and saves as one
      file you can open again from the start screen.
  - date: "2026-10-30"
    title: "Example values for participants and items"
    text: >-
      The mixed model for participants responding to many items now shows
      example values beside each of its inputs, from a published
      response-time study, with the source named. Few papers report these
      numbers, so they give you a starting point; your own task's values are
      better where you have them.
  - date: "2026-10-30"
    title: "Moderation from the R-squared change"
    text: >-
      For an interaction between two scores, you can now give the R-squared
      the interaction adds, as papers usually report it and as G*Power asks
      for it, instead of correlations. The result says how this compares
      with the correlation route.
  - date: "2026-10-30"
    title: "Repeated-measures ANOVA from an effect size"
    text: >-
      For a repeated-measures or mixed ANOVA, you can now give the effect as
      partial eta-squared. Because a published value and a G*Power-style
      effect size are different numbers for the same study, powerkit asks
      which one you have, so the sample size comes out right either way.
  - date: "2026-10-30"
    title: "Labs: plan from a published result"
    text: >-
      A new Labs tool takes an effect as a paper reported it, such as
      t(58) = 2.5, an F or an odds ratio, and shows it as the effect size a
      power analysis uses, with a safeguard value to plan with instead,
      because published effects tend to be too large.
  - date: "2026-10-30"
    title: "ANOVA from an effect size, as in G*Power"
    text: >-
      For a one-way or factorial ANOVA with different people in each group,
      you can now give the effect as partial eta-squared, or as a published
      F with its two degrees of freedom, instead of guessing the group
      means. powerkit works out power the way G*Power does and says which
      package did it.
  - date: "2026-10-30"
    title: "Use a published t, F, r or odds ratio"
    text: >-
      On the one-sample, paired and two-group t-tests and the correlation,
      you can now enter an effect the way a paper reported it, such as
      t(58) = 2.5 or an odds ratio, instead of working out Cohen's d or r
      yourself. powerkit converts it, shows the result and the function
      that did it, and puts the conversion in the write-up.
  - date: "2026-10-30"
    title: "Many trials or stimuli per person"
    text: >-
      If each participant responds to many items, such as words, faces or
      trials, in two conditions, powerkit now works out power with a mixed
      model that lets both participants and items vary. Give the difference
      you expect and how much participants and items vary, in your outcome's
      own units.
  - date: "2026-10-29"
    title: "Mediation with an experimental condition"
    text: >-
      If X is a condition or two groups, such as self-affirmation or control,
      powerkit now works out power for its indirect effect through one or
      more mediators. You can give the share of people in each group, and the
      result shows the difference between the groups in the mediator that
      your path means.
  - date: "2026-10-29"
    title: "Moderation with a condition or two groups"
    text: >-
      If your predictor is a condition, such as training or a waitlist, and
      you want to know whether its effect depends on a score such as trait
      anxiety, powerkit now works out power and sample size for the
      interaction, and shows the difference between the groups that your
      correlation implies.
  - date: "2026-10-29"
    title: "Simulated data sets for contrasts, regressions and cluster trials"
    text: >-
      The simulated data set to write your analysis code with is now also
      available for planned contrasts, logistic and Poisson regression with
      one predictor, and cluster-randomised and group therapy trials with a
      score outcome (with a column numbering the groups).
  - date: "2026-10-29"
    title: "Simulated data sets for more designs"
    text: >-
      The simulated data set you can download to write your analysis code
      before collecting data now covers the rank tests, equivalence and
      non-inferiority tests, one proportion, goodness of fit, comparisons of
      correlations, ordinal outcomes and two factors with a yes/no outcome.
  - date: "2026-10-29"
    title: "A 2 x 2 design with groups of different sizes"
    text: >-
      If your four groups won't be the same size, for example a clinical
      sample half the size of a community sample, powerkit now works out
      power and sample size for either factor or their interaction: give each
      group's expected size, or their ratio.
  - date: "2026-10-29"
    title: "Technical details for checking a result"
    text: >-
      Under "How it was calculated", a folded section now gives the test's
      degrees of freedom, critical value and noncentrality parameter, as the
      R package reported them, so you can check a result against G*Power or
      your own R code. For a simulated sample size, the result now also
      gives the power reached at that size, with its interval.
  - date: "2026-10-29"
    title: "Two factors with a yes/no outcome"
    text: >-
      If you cross two factors, such as the frame of a message and who
      delivers it, and your outcome is yes or no, powerkit now works out
      power and sample size for either factor or their interaction: give the
      proportion of 'yes' you expect in each combination.
  - date: "2026-10-29"
    title: "Outcomes in ordered categories"
    text: >-
      If your outcome is a single rating item or a severity grade that you
      want to analyse as ordered categories rather than as a score, powerkit
      now works out power and sample size for comparing two groups: give the
      share of one group in each category and the odds ratio you expect.
  - date: "2026-10-29"
    title: "Moderated mediation with two mediators"
    text: >-
      If your moderator changes a process with two mediators side by side,
      for example autonomy changing how workload leads to exhaustion and to
      cynicism, powerkit now works out power for the index of moderated
      mediation through the mediator you choose, with W on the first or the
      second link.
  - date: "2026-10-29"
    title: "Three-way interactions"
    text: >-
      If you expect an interaction between two scores to change with a third
      (for example, whether social support buffers stress differently at
      different ages), powerkit now works out power and sample size for the
      three-way interaction, with measurement error allowed for.
  - date: "2026-10-29"
    title: "A simulated data set to write your analysis code"
    text: >-
      For most designs, the results screen now offers a made-up data set of
      the planned size as a CSV file, drawn from the population you
      entered, so you can write and check your analysis code in R, SPSS,
      JASP, jamovi or Python before the real data arrive. Every row is
      marked as simulated; it is not evidence and not a pilot.
  - date: "2026-10-29"
    title: "Rank correlations, and spread in the same people"
    text: >-
      The correlation screen now offers Spearman's rho and Kendall's tau as
      test versions, simulated. And if you want to show that the same
      people's scores became more (or less) consistent, for example
      reaction times after training, the design finder now leads to a new
      card for that: the Pitman-Morgan test.
  - date: "2026-10-29"
    title: "Non-inferiority, and invariance over time"
    text: >-
      Want to show a new approach is no worse than the usual one? The
      equivalence screen now plans non-inferiority studies: set the margin,
      say whether higher or lower scores are better, and powerkit works out
      the sample size for two groups, the same people twice, one mean or
      two proportions. The invariance screen also checks whether a
      questionnaire measures the same thing on two occasions, not only in
      two groups.
  - date: "2026-10-29"
    title: "Welch's ANOVA, more equivalence tests, and the MANOVA approach"
    text: >-
      Three or more groups that vary by different amounts? On the one-way
      ANOVA screen, choose Welch's F and give each group's SD. The
      equivalence screen now also covers a correlation and two groups'
      proportions. And for repeated measures with three or more
      conditions, the result also gives the power of the MANOVA approach,
      which doesn't assume sphericity.
  - date: "2026-10-29"
    title: "Measurement invariance, factor correlations and latent paths"
    text: >-
      The latent variables screen now does more than model fit. Choose what
      you want to test: whether a questionnaire measures the same thing in
      two groups (metric or scalar invariance), whether two factors are
      correlated, or whether latent variables predict another. You describe
      the items and their loadings, and powerkit works out the sample size
      or power with semPower.
  - date: "2026-10-29"
    title: "Names are optional"
    text: >-
      You no longer have to name your groups, conditions and outcome before
      calculating. Leave a name empty and powerkit uses a neutral one, such
      as "Group 1" or "Outcome", shown greyed in the box; type your own to
      make the result and the write-up read naturally.
  - date: "2026-10-29"
    title: "Clearer help when something is missing"
    text: >-
      If you run powerkit on your own computer and its calculation engine
      isn't installed, the input screen now tells you how to get it rather
      than only that it is missing. When your effect size comes from a
      previous study and you kept it as published, the screen now asks you
      to say why, so the write-up records it.
  - date: "2026-10-28"
    title: "Planning a Bayes factor t-test"
    text: >-
      Testing with a Bayes factor instead of a p-value? On the one-sample,
      paired and two-group t-test screens, choose the Bayes factor t-test
      as the test version. powerkit works out the chance that your study
      finds strong evidence for the effect (a Bayes factor past the
      threshold you set), and what the same study would show if there were
      no effect.
  - date: "2026-10-28"
    title: "Three-factor ANOVA"
    text: >-
      powerkit now calculates designs with three factors crossed, such as
      group by time by task difficulty, with any mix of factors that have
      different people at each level and factors everyone is measured in.
      Power the three-way interaction, a two-way interaction or one
      factor's main effect. In the design finder, answer "Three, crossed"
      to how many things you varied.
  - date: "2026-10-28"
    title: "Rank-based tests: Wilcoxon, Mann-Whitney and Kruskal-Wallis"
    text: >-
      Planning a rank-based test instead of a t-test or one-way ANOVA? On
      those screens, choose the Wilcoxon signed-rank test, the
      Mann-Whitney test or the Kruskal-Wallis test as the test version, and
      say what shape you expect the scores to have (bell-shaped, skewed or
      with more extreme scores). powerkit simulates the rank test itself,
      so the answer reflects that shape.
  - date: "2026-10-28"
    title: "ANCOVA with two factors"
    text: >-
      The ANCOVA card now also covers two factors crossed, such as
      condition by delivery, adjusting for a covariate like the before
      score. Choose "By two factors crossed" and power either factor or the
      interaction.
  - date: "2026-10-28"
    title: "Two-factor designs with the same people in every condition, and larger designs with different people"
    text: >-
      powerkit now calculates two-factor ANOVAs where everyone takes part
      in every combination of the factors, such as cue by delay in a
      reaction-time task, from 2 x 2 upwards. It also calculates two-factor
      designs larger than 2 x 2 with different people in every group, such
      as feedback by three levels of task difficulty. Choose either factor
      or the interaction to power.
  - date: "2026-10-28"
    title: "Adjusting for a pre-test in grouped studies"
    text: >-
      The "People nested in groups" card can now allow for a baseline
      score, such as a pre-test, that the analysis will adjust for. Say how
      much of the differences between people, and between the groups'
      averages, it explains; adjusting for a good baseline usually means
      you need fewer groups.
  - date: "2026-10-28"
    title: "Power when only one condition is delivered in groups"
    text: >-
      The "People nested in groups" card now covers studies where people
      are randomised one by one but one condition is delivered in groups,
      such as group therapy compared with individual treatment. Choose it
      under "Who is assigned to the conditions"; it works for a score or a
      yes/no outcome.
  - date: "2026-10-28"
    title: "Opens faster"
    text: >-
      powerkit's first page appears sooner when the app has been idle,
      because it no longer loads every calculation package before showing
      the start screen; each one now loads when a calculation needs it.
  - date: "2026-10-28"
    title: "Yes/no outcomes for people nested in groups"
    text: >-
      The "People nested in groups" card now works for a yes/no outcome
      too, such as passing a test or attending a session. Give the share
      of "yes" you expect in each condition and how much the groups
      differ, and powerkit works out the sample size or the power, for
      groups assigned whole or for people randomised within each group.
  - date: "2026-10-28"
    title: "Power for group by time with three or more timepoints"
    text: >-
      powerkit now calculates the mixed ANOVA beyond 2 x 2: groups of
      different people, each measured at three or more timepoints or in
      several conditions, such as a trial with before, after and follow-up.
      You choose the effect you care about, usually whether the change over
      time differs between groups, and the design finder takes you there
      when one factor is different people and the other is measured in
      everyone.
  - date: "2026-10-28"
    title: "Fewer words on the screens"
    text: >-
      The design finder asks only once whether you want to show there's no
      meaningful effect. Cards and input screens repeat themselves less,
      and other tools such as G*Power are mentioned only where they would
      give you a different answer.
  - date: "2026-10-28"
    title: "Power for the same people in three or more conditions"
    text: >-
      powerkit now calculates the repeated-measures ANOVA with one factor,
      for studies where everyone takes part in three or more conditions or
      is measured at three or more timepoints. You enter the mean in each
      condition, the SD and how strongly people's scores in two conditions
      are related, and the design finder takes you there when you say the
      same people are in every condition.
  - date: "2026-10-27"
    title: "Text fixes: results, the analysis list and mediation"
    text: >-
      The plain-words line under a result no longer rounds 95% power up to
      "10 in 10 studies"; it now says "95 in 100", and fits equivalence
      tests. The analysis list and the methods paragraph no longer label
      mediation by PROCESS model numbers, and a few out-of-date or garbled
      lines are corrected.
  - date: "2026-10-27"
    title: "Sample size for a CFA or structural equation model"
    text: >-
      The card "Check that a model or questionnaire structure fits" now
      calculates. Enter how many items and factors your confirmatory factor
      analysis has (or your model's degrees of freedom) and how much misfit
      you would want to notice, and powerkit works out the sample size or
      the power for the test of model fit. The result explains that this is
      the power to show a model is wrong.
  - date: "2026-10-27"
    title: "Power for studies where people are randomised within groups"
    text: >-
      The "People nested in groups" card now also covers studies where every
      class, clinic or team has people in both conditions, such as pupils
      randomised within each school. You say how much the effect is likely
      to vary from group to group, and the result shows how the grouping
      changes the number of people you need.
  - date: "2026-10-27"
    title: "Power for studies where whole groups get the condition"
    text: >-
      If whole classes, clinics or teams are assigned to a condition, the
      card "People nested in groups" now calculates power, the number of
      groups you need, or the smallest effect you could detect. You enter
      how many people are in each group and how alike people in the same
      group are, and the result shows how much the grouping costs compared
      with a study of separate people.
  - date: "2026-10-27"
    title: "Whole-study simulation: find your sample size on your computer"
    text: >-
      The whole-study simulation now runs a quick look in the app, and
      gives you an R script for the full run on your own computer. The
      script can find the sample size you need for the power you choose,
      for all of your main analyses together, or work out the power at
      your N more precisely. It is still experimental.
  - date: "2026-10-27"
    title: "A simpler whole-study plan"
    text: >-
      When powerkit can simulate your whole study, your plan now starts
      with it: describe the study once and see every analysis's power. The
      separate calculations are still there, folded underneath, and the
      plan page is shorter. Mediation cards now lead with the analysis's
      own name; the PROCESS model number is a note for people who use
      PROCESS.
  - date: "2026-10-27"
    title: "Experimental: simulate your whole study at once"
    text: >-
      On "Plan my whole study", you can now describe your study once and
      have every planned analysis run on the same simulated studies. You
      see each analysis's power, the chance that all of your main analyses
      succeed together, and whether the numbers you entered for separate
      analyses describe the same study. It is experimental and waiting for
      a statistician's check, so use it to explore, not to report.
  - date: "2026-10-27"
    title: "Show that a difference is too small to matter"
    text: >-
      You can now plan an equivalence test: the two one-sided tests (TOST)
      that show a difference lies inside bounds you set, rather than just
      failing to find it. It works for two groups, the same people measured
      twice, or one mean against a fixed value, with the bound and the
      expected difference as Cohen's d or in your measure's own units.
  - date: "2026-10-27"
    title: "Six more analyses checked against published examples"
    text: >-
      Planned contrasts, logistic regression, the tests from a
      noncentrality parameter, comparing two correlations in the same
      people, and the two tests of how spread out scores are now give the
      same answers as the published G*Power examples, so their cards now
      say "Validated". Nothing about the calculations changed.
  - date: "2026-10-27"
    title: "Safeguard power for an effect size from one study"
    text: >-
      If your effect size comes from one earlier study or a pilot, you can
      now plan with a safer, smaller value: the lower end of a confidence
      interval around that study's estimate. Give the earlier study's sample
      size and powerkit works it out, so your study keeps its power if the
      true effect is smaller. Available for the t-tests and the correlation.
  - date: "2026-10-27"
    title: "A map of the methods, in Labs"
    text: >-
      Labs has a new map of every analysis powerkit knows about, drawn
      as a cosmos: each thing a study can want to show is a star, with its
      analyses as planets around it. Fly about by dragging and zooming,
      search, filter down the side by outcome, how often people are
      measured and whether powerkit calculates it, and click a planet to
      see how to get there and read about it. A switch shows the tests'
      usual names instead of plain words.
  - date: "2026-10-27"
    title: "Share a page by link"
    text: >-
      Press "Share this page" at the top right to copy a link that opens
      straight on the page you're looking at, such as the pre-replication
      notes in Labs, ready to paste into an email or message.
  - date: "2026-10-27"
    title: "See how much the answer depends on the effect"
    text: >-
      On the result for a t-test or a correlation, you can now enter a
      smaller and a larger effect you would still find plausible. powerkit
      draws power for those and your plan's effect on one chart, and says
      how many participants each would need, so you can see how much
      rides on being right about the effect.
  - date: "2026-10-27"
    title: "Give your effect in your measure's own units"
    text: >-
      For the one-sample, two-group and paired t-tests you can now enter
      the effect as you think of it: say 4.5 against 3.8 on a 1 to 7 scale,
      with an SD of 1.2. powerkit works out Cohen's d for you and shows it
      on the result. If you ask for the smallest effect you could detect,
      it is also given in your measure's units.
  - date: "2026-10-26"
    title: "Easier to read on large screens, and the result comes into view"
    text: >-
      On large screens the text is now a little bigger, so you shouldn't
      need to zoom in, and zooming in no longer makes the page scroll
      sideways. After "Check my answers", the page moves to your result.
      The result screen is reordered: your answer and notes on reading it,
      then exploring, then saving and the write-up, with how it was
      calculated last. The short write-up for your paper is shorter, and
      its longer versions are folded away until you open them.
  - date: "2026-10-26"
    title: "Your whole study's sample size"
    text: >-
      In "Plan my whole study", each sample size you work out from the plan
      now appears on it, and the plan gives the sample size your study
      needs: the largest of your main analyses, with that analysis named.
      Until you have done them all, it shows the largest so far and which
      are still to do.
  - date: "2026-10-26"
    title: "Type shared numbers once"
    text: >-
      When two analyses on your plan ask for the same number, such as the
      path from X to the mediator, you type it once: it is filled in when
      you open the other analysis, so both describe the same study. You can
      still change it there.
  - date: "2026-10-26"
    title: "Hypotheses about how much scores vary"
    text: >-
      Some hypotheses are about spread, not averages: that reaction times
      become more consistent with practice, say, or that one group's
      answers vary more than another's. powerkit can now plan for these,
      for one group against a fixed value or for two groups. Choose "That
      scores are more spread out (or more consistent)" on the first
      question. Power for these tests is simulated, so the answer can
      differ from G*Power's by a participant or two.
  - date: "2026-10-26"
    title: "Comparing two correlations in the same people"
    text: >-
      powerkit can now work out the sample size or power for comparing two
      correlations measured in the same people: for example, whether
      wellbeing is more strongly related to self-control than to grit, or
      whether the link between stress and sleep is stronger at 16 than at
      14. Find it under "A relationship between two things you measure".
  - date: "2026-10-26"
    title: "Planned comparisons among three or more groups"
    text: >-
      If your hypothesis is about a specific comparison, such as both kinds
      of feedback beating no feedback, or scores rising steadily with the
      dose, powerkit can now work out the sample size or power for that
      comparison itself, rather than for "any difference among the
      groups". You give the group means and a weight for each group that
      says which comparison you mean.
  - date: "2026-10-26"
    title: "Poisson regression: predicting a count"
    text: >-
      powerkit can now work out the sample size or power when you predict a
      count, such as how many times someone visits a clinic in a year, from
      a score or a yes/no group. You enter the rate ratio, the starting
      rate and how long people are followed. It assumes the counts vary as
      much as their average; counts that vary more need a negative binomial
      model, which powerkit doesn't do yet.
  - date: "2026-10-26"
    title: "Logistic regression: predicting a yes/no outcome"
    text: >-
      powerkit can now work out the sample size or power for a logistic
      regression, where one predictor (a score, or a yes/no group) predicts
      a yes/no outcome such as whether someone seeks help. You enter the
      odds ratio and how common "yes" is to start with; if your model has
      other predictors, you say how much they overlap with this one. Until
      today this card said powerkit couldn't do it.
  - date: "2026-10-26"
    title: "A simpler first screen"
    text: >-
      The first screen now asks just one thing: how you want to start. The
      next screen asks what your study is trying to do. Whether your sample
      size is fixed, and whether your conclusion rests on several tests,
      are now asked on the screen where you enter your numbers; most
      studies rest on one test, so that setting starts there.
  - date: "2026-10-26"
    title: "A cleaner, simpler look"
    text: >-
      The app has a new look. "Back" and "Start again" are at the top of
      every screen, and the next step (such as "Enter your values" or "Check
      my answers") stays in view at the bottom of the window. Choices are
      cards, the starting questions fit on one screen, results come in
      clear sections with the details folded away, and there is less
      technical text to wade through.
  - date: "2026-10-26"
    title: "Calculate from your whole-study plan"
    text: >-
      In "Plan my whole study", each analysis on your plan that powerkit can
      calculate now has an "Enter your values" button. If you have several
      main analyses, the input screen already knows how they combine and how
      many there are, and "Back to my plan" takes you back to the plan.
  - date: "2026-10-26"
    title: "powerkit has a version number"
    text: >-
      The About page now says which version of powerkit you are using, and
      so does every result and every R script you download, so a sample
      size you quote in a paper can be traced back to the version that
      worked it out. This is 0.4; version 1.0 will be the first proper
      release, once the numbers are fully checked.
  - date: "2026-10-26"
    title: "Straight to the list of analyses"
    text: >-
      If you already know which analysis you want, "I know my analysis" no
      longer makes you answer the four screening questions first: one
      button shows every analysis powerkit knows about, as a menu. Some of
      them won't suit your design and nothing checks that for you, so each
      analysis's card still says what its test assumes; the four questions
      are there on the list if you would rather have it narrowed down.
  - date: "2026-10-22"
    title: "The browser's Back button works"
    text: >-
      Your browser's Back and Forward buttons now move between powerkit's
      screens, instead of leaving the site. What you typed on the input
      screen is still there when you come forward again.
  - date: "2026-10-22"
    title: "Help when you're not sure of your effect size"
    text: >-
      The effect-size section now explains, in plain words, the ways to a
      number you can defend, starting from the smallest difference that
      would matter in your measure's own units. If you don't know what to
      expect, one button sets powerkit to show the smallest effect your
      sample could detect instead.
  - date: "2026-10-22"
    title: "Labs: choose a tool, and keep your work"
    text: >-
      Labs now opens on a list of tools. When you go from your
      pre-replication notes to planning the replication's sample size,
      powerkit asks before replacing a plan you've started, copies your
      notes' words into the reason for your effect size, and gives you a
      link back to the notes, which are kept.
  - date: "2026-10-22"
    title: "Clearer boxes and problems where they are"
    text: >-
      The boxes on the input screen have shorter names, with a line of help
      underneath, and definitions open when you ask for them. When
      something needs fixing, the message now appears right under the box
      as well as in the list at the bottom.
  - date: "2026-10-22"
    title: "See where you are"
    text: >-
      Four steps across the top show where you are: your study, finding
      your design, your numbers and the result. Analysis cards are shorter:
      the details of what you'd enter and which package calculates it are
      under "More about this analysis".
  - date: "2026-10-22"
    title: "A shorter input screen"
    text: >-
      The screen where you enter your values now starts with what you want
      to find out, and only shows the boxes that goal needs. Your effect
      size and where it comes from sit together, and settings you rarely
      change are folded into one line you can open.
  - date: "2026-10-22"
    title: "Rank-based tests, observed power and other tools"
    text: >-
      Cards for t-tests, correlations and one-way ANOVA now say that their
      figure only approximates a rank-based test such as Mann-Whitney. You
      can choose your finished study's own result as the effect size, with
      a warning about observed power. Cards for designs powerkit doesn't
      cover yet name established tools you can use instead.
  - date: "2026-10-22"
    title: "Long calculations take turns"
    text: >-
      Interactions in regression and mediation take a while to calculate,
      and everyone using powerkit online shares one server. If several
      people start one at the same moment, you may be asked to try again
      in a minute or two. Quick calculations aren't affected.
  - date: "2026-10-22"
    title: "A Feedback tab"
    text: >-
      Tell us about a problem, ask a question or suggest something from the
      new Feedback tab, or from "Something doesn't fit?" on any card. It
      adds where you are in powerkit for you and shows the whole message
      first. Click Send; no account is needed, and you can leave an email
      if you'd like a reply.
  - date: "2026-10-22"
    title: "Fewer notes for the developers"
    text: >-
      The grey "Undecided" boxes and the tab of open questions were notes
      for powerkit's developers. They are gone from the screens you see.
  - date: "2026-10-22"
    title: "Clearer labels"
    text: >-
      The banner at the top now names the analyses that calculate in plain
      words. In "Plan my whole study", the combined sample size and the
      consistency check are marked "Coming soon"; until then, use the
      largest sample size from your analyses' cards.
  - date: "2026-10-20"
    title: "Labs: pre-replication notes"
    text: >-
      A new, experimental Labs tab. Its first tool helps you think before
      replicating a finding: three questions from a recent paper on
      pre-replication, answered in your own words, plus the smallest effect
      the original study could detect. Nothing is required or scored, and
      deciding a finding isn't worth replicating counts as a good outcome.
  - date: "2026-10-20"
    title: "Generic t, F, chi-square and z tests"
    text: >-
      If you have already worked out your test's noncentrality parameter, as
      with G*Power's generic tests, choose "Generic t, F, chi-square and z
      tests" under "I know my analysis". You get the power for that
      noncentrality, or the noncentrality you'd need; there is no sample
      size, because the noncentrality already reflects it.
  - date: "2026-10-19"
    title: "Asked whether your hypothesis predicts a direction"
    text: >-
      For tests that can be one-sided, the input screen now starts by asking
      whether your hypothesis predicts a direction, instead of filling in a
      two-sided test for you.
  - date: "2026-10-19"
    title: "Planning for a claim that needs every test to be significant"
    text: >-
      If your claim needs all of several tests to be significant, powerkit
      now asks how many and plans each test at a higher power, so that all
      of them together reach the power you chose. Where it says no
      correction is needed for separate claims, it now notes that not
      everyone agrees.
  - date: "2026-10-19"
    title: "Check a plan someone shared with you"
    text: >-
      Supervisors, reviewers and colleagues can open a saved plan from the
      start screen and see what it assumes, what it found and which
      questions are worth asking, such as a missing reason for the effect
      size or no allowance for drop-out. It doesn't change the file or give
      a pass or fail.
  - date: "2026-10-19"
    title: "A plain-words version of the write-up for ethics applications"
    text: >-
      Under the write-up there is now a third box that explains, in words an
      ethics panel can follow, why you plan this many participants: the
      effect you planned for and why, and the chance of finding or missing
      it. It describes the plan; it doesn't judge whether the study is
      ethical.
  - date: "2026-10-19"
    title: "A reason is asked for if you change the significance level or test direction"
    text: >-
      The significance level (.05) and a two-sided test stay filled in. If you
      change either, a box asks why. It's optional, and what you write goes
      into the write-up.
  - date: "2026-10-19"
    title: "Two new analyses: goodness of fit, and comparing two correlations"
    text: >-
      You can now plan a chi-square goodness-of-fit test (one group's answers
      across several categories, compared with expected proportions) and a
      comparison of the same correlation in two separate groups. Neither has
      been checked against G*Power yet; their cards say so.
  - date: "2026-10-19"
    title: "\"Guess first\": write down your guess before you see the answer"
    text: >-
      At the end of each input screen you can write down the sample size or
      power you expect. The result screen then shows your guess next to the
      answer. It's a learning aid only: the guess isn't saved in your plan
      and nothing is collected.
  - date: "2026-10-19"
    title: "More analyses can find the smallest effect you could detect"
    text: >-
      If you can't justify an effect size, or your sample size is fixed, the
      app can now find the smallest effect you could detect for two
      proportions, the chi-square test and interactions in regression. For
      interactions it uses a quick formula, which the result screen labels.
  - date: "2026-10-19"
    title: "The app asks whether your reasoning still applies"
    text: >-
      If you change the effect size after explaining why you chose it, the
      result screen asks whether your reasoning still applies, rather than
      quietly keeping a reason written for a different number.
  - date: "2026-10-19"
    title: "Fisher's exact test and one-way ANCOVA"
    text: >-
      Comparing two proportions now offers Fisher's exact test for small
      samples, and one-way ANCOVA (group means adjusted for covariates)
      calculates in the app.
  - date: "2026-10-18"
    title: "A methods paragraph you can copy"
    text: >-
      The result screen now writes a short and a full methods paragraph for
      your power analysis, with the citations to use, ready to paste into a
      preregistration, ethics application or paper.
  - date: "2026-10-18"
    title: "One-way ANOVA, regression, one proportion and McNemar's test"
    text: >-
      These four analyses now calculate in the app. Welch's t-test can also be
      calculated by formula as well as by simulation.
  - date: "2026-10-18"
    title: "A clearer start, and a clearer result screen"
    text: >-
      The first screen now asks about your situation (including a sample
      size that's already fixed), your aim and the claim you want to make.
      The effect-size screen asks where your effect size comes from, with a
      way through if you can't justify one. The result screen gives a plain
      reading of the answer and shows 80% and 95% power side by side.
  - date: "2026-10-18"
    title: "The app is online"
    text: >-
      You can use powerkit in a web browser, without installing R. It updates
      itself each time a change is approved.
  - date: "2026-10-18"
    title: "Save your plan and reopen it later"
    text: >-
      You can save an analysis to a file, reopen it in the app, and rerun it
      to get the same result.
  - date: "2026-10-18"
    title: "Mediation and moderated mediation"
    text: >-
      Mediation models give a quick rough preview of power in the app, then
      either run the full analysis here (it takes several minutes) or give
      you an R script to run on your own computer.
  - date: "2026-10-18"
    title: "Dropout: how many to recruit"
    text: >-
      If you expect some participants to drop out, the result shows both the
      number you need to analyse and the number to recruit.
  - date: "2026-10-17"
    title: "The first working prototype"
    text: >-
      The design finder, the cards and the input screens for the t-tests, the
      correlation, two proportions, the chi-square test, 2 x 2 designs and
      interactions in regression.
