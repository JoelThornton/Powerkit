# The methods map (Labs): what each analysis is, beyond the design finder's
# questions. R/map.R reads this file with tree.yaml; a test checks that
# every analysis on the map has a test here and that every relation joins
# two analyses that exist.
#
# `tests`: the kind of test (or other basis for a decision) each analysis
# usually reports, with a plain explanation shown on the map. These are
# textbook classifications, listed for the statistician's review with the
# rest of the methods; they cite nothing.
# `endpoints`: each analysis's test, by the id in `tests`.
# `relations`: how analyses relate, from the simpler to the more general
# (or to a variant); `label` completes "<from> ... <to>" in plain words.

tests:
  t:
    label: "t test"
    colour: "#5cc8ff"
    text: "Compares a difference (or a slope) with how much it would vary by chance, using the t distribution."
  F:
    label: "F test"
    colour: "#ff7eb6"
    text: "Compares the variation explained by a model (differences among groups, or predictors) with the variation left over, using the F distribution. With one numerator degree of freedom it is a t test squared."
  chi2:
    label: "Chi-square test"
    colour: "#ffd166"
    text: "Compares counts, or a model's misfit, with what would be expected by chance, using the chi-square distribution."
  z:
    label: "z test"
    colour: "#4fe0b6"
    text: "Compares an estimate with its standard error on the normal distribution: common for proportions and for comparing correlations."
  rank:
    label: "Rank test"
    colour: "#c792ea"
    text: "Works on the ranks of the scores rather than the scores themselves, so it needs fewer assumptions about their shape."
  model:
    label: "Test in a fitted model"
    colour: "#9be15d"
    text: "A coefficient's test (Wald z or t) or a likelihood-ratio test in a model such as logistic, multilevel or survival regression."
  ci:
    label: "Confidence interval"
    colour: "#ff9f68"
    text: "Decides from whether a confidence interval excludes zero (mediation's indirect effects, by Monte Carlo or bootstrap), or plans for how narrow the interval will be."
  bayes:
    label: "Bayes factor"
    colour: "#f78fb3"
    text: "Weighs how much more likely the data are under one hypothesis than another, instead of a p-value."
  any:
    label: "Any of these"
    colour: "#b0c4de"
    text: "A general tool for any test that has a known distribution."
  other:
    label: "Other"
    colour: "#9aa7c7"
    text: "Decided by comparing models (for example, how many classes or profiles fit best) rather than by a single test."

