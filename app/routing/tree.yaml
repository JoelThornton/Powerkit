    card_points:
      - "Each participant responds to many items (words, faces, trials) in two conditions, and both participants and items vary: for example, response times to emotional and neutral words. The conditions can be within participants (everyone responds in both) or between them (half the participants in each)."
      - "You give the difference between conditions and how much participants and items vary, in the outcome's own units; the number of items is fixed and powerkit finds the number of participants."
      - "The model has random intercepts for participants and items, a random condition effect for participants when everyone responds in both conditions, and one for items when every item appears in both; items can be in one condition each or in both."
      - "With a yes/no answer on each trial (correct or not), you give each condition's chance of 'yes' for a typical participant and item, with the SDs on the log-odds scale; powerkit fits a logistic mixed model (glmer) and tests with the Wald test glmer reports or, if you choose, the likelihood-ratio test."
      - "Simulated with simr, testing the condition with Satterthwaite's t test rather than simr's default z test, an approximation that treats the t statistic as normal. Power at a given number of participants runs here; the number you need comes as an R script, because each sample size takes minutes."
