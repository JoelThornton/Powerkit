    validation: {file: test-validation-irt.R, note: "Gives irtpwr's own DIF preset's power where that works, in the engine's tests, and agrees with multigroup models (mirt) fitted to simulated studies and compared by their likelihood ratio, for a change in difficulty and in discrimination, testing both of the item's parameters or only the one that differs (within 0.04); the test keeps its Type I error at alpha. Not yet checked against a published example."}
    card_points:
      - "Tests whether some items of a test or questionnaire with yes/no (or right/wrong) answers work differently in two groups, such as two language versions, for people of the same ability: differential item functioning (DIF) in a two-parameter logistic (2PL) item response theory model."
      - "You give each item's discrimination and difficulty, from an earlier calibration or a published one, and for each item with DIF how much harder it is in the second group (uniform DIF) and, if you expect it, how much its discrimination changes (non-uniform DIF)."
      - "By default the test frees both of each DIF item's parameters between the groups, the usual likelihood-ratio test of DIF (2 df per item); irtpwr's own preset frees only the parameters that differ, which is more powerful when only the difficulty changes, and is a choice on the next screen."
      - "Calculated by irtpwr's analytical method, for two groups of equal size whose abilities have the same normal distribution, with the other items as anchors. Polytomous (rating-scale) items and groups that differ in ability are not covered yet."
