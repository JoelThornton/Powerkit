  E43:
    doc_name: "Time-to-event (survival) outcome: the log-rank test and Cox regression"
    technical_name: "Survival analysis"
    plain_name: "An outcome that is the time until something happens"
    search_words: "survival time to event time-to-event log-rank logrank cox proportional hazards hazard ratio relapse dropout censored kaplan-meier"
    template: "survival / log_rank, cox_predictor"
    backend: "Hmisc: cpower() for the log-rank test (exponential times, recruitment and follow-up); powerSurvEpi: powerEpiCont.default() for a measured score in a Cox regression (Hsieh and Lavori's formula)"
