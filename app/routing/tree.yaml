    validation: {file: test-validation-anova-three.R, note: "Matches Superpower's ANOVA_exact() called directly in the engine's tests, for all three main effects, the two-way interactions and the three-way interaction. Not yet in the full validation run, and not yet checked against G*Power or a published example."}
    card_points:
