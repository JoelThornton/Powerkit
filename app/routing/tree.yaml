    status: runs_validation_in_progress
    validation: {file: test-validation-signal-detection.R, note: "Agrees with a simulation written separately, drawing every trial as an evidence value against the person's criterion, for paired and two-group designs, one- and two-sided, and near ceiling. Not yet checked against a published example."}
    card_points:
      - "Compares how well people tell a signal from noise (sensitivity, d') in two conditions done by the same people, or in two groups: for example, recognition memory after deep and after shallow encoding, from each person's hits and false alarms."
      - "Each person's d' is estimated as researchers usually do, with the log-linear correction for perfect scores (Hautus, 1995), and the two conditions are compared with a t-test. The number of trials matters: few trials make each person's d' noisy, and near-perfect performance compresses it."
      - "You give the average d' in each condition, the numbers of signal and noise trials, how much people differ, and for the same people in both conditions, how strongly their d' correlates. Simulated, so a run takes a few seconds."
      - "Assumes the equal-variance signal detection model with yes/no responses. Rating-scale (confidence) designs, unequal-variance models and fitting d' in a hierarchical model are not covered yet."
