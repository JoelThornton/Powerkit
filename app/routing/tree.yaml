    tier: v2
    alternatives: ["a Cox regression of the group with other predictors", "a comparison of restricted mean survival times", "a parametric survival model, such as a Weibull model"]
    inputs: ["What you want to test", "Two groups: who has had the event by a given time, and how long people are followed", "A measured score: its hazard ratio, and how many people have the event"]
  E69:
    doc_name: "Reliability and agreement: the ICC, Cronbach's alpha and kappa"
    technical_name: "Reliability and agreement"
    plain_name: "How reliable a measure is, or how well raters agree"
    search_words: "reliability agreement interrater inter-rater icc intraclass correlation cronbach alpha internal consistency kappa cohen fleiss raters test-retest"
    template: "reliability / icc, cronbach_alpha, kappa"
    backend: "ICC.Sample.Size: calculateIccPower() for the ICC; statpsych: size.test.cronbach() for Cronbach's alpha (Bonett and Wright's test); kappaSize: PowerBinary(), Power3Cats(), Power4Cats(), Power5Cats() for kappa"
    method: "Formula (no simulation)"
    status: runs_validation_in_progress
