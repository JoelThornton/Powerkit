  E34:
    doc_name: "Multilevel or cluster design (cluster-randomised or multisite trial)"
    plain_name: "People nested in groups (classes, teams, clinics)"
    search_words: "multilevel mixed model mixed effects hlm hierarchical linear model nested clustered cluster randomised trial intraclass correlation icc"
    template: "cluster_trial / cluster_randomised, multisite, group_treatment"
    backend: "powertools: crt.parallel.cont() and multisite.cont() for a score (the t test of the difference between conditions, by formula, with the design effect); crt.parallel.bin() and multisite.bin() for a yes/no outcome (the z test of the log odds ratio); irgtt.cont() and irgtt.bin() when only one condition is delivered in groups"
    method: "Formula (no simulation)"
    status: runs_validation_in_progress
    validation: {file: test-validation-cluster-randomised.R, note: "Matches powertools called directly, and the textbook design-effect calculation done with a second package, in the engine's tests, for all three designs and both outcomes. Not yet checked against a published worked example in the validation run."}
    card_points:
      - "Calculates three designs where a score or a yes/no outcome is compared between two conditions, for a score optionally adjusting for a baseline such as a pre-test. In a cluster-randomised trial, whole groups (for example, classes or clinics) are assigned to a condition, the same number of groups in each. In a multisite trial, people are assigned within each group, half to each condition. In a group treatment trial, people are assigned one by one and one condition is delivered in groups (for example, group therapy compared with individual treatment), with the same number of people in each condition."
      - "People in the same group tend to be alike, so each person adds less information than in a study of separate people. The intraclass correlation (ICC) says how alike they are, and the result shows how much the grouping costs (or, in a multisite trial, often saves). powerkit works this out with the standard design-effect formula, an approximation, not by fitting a multilevel model. For a yes/no outcome with whole groups assigned or people randomised within groups, powertools' formula (also an approximation) asks how much the groups differ on the log-odds scale instead of an ICC."
      - "Not calculated here yet: groups of unequal numbers in each condition, a count outcome, an equivalence test, for a yes/no outcome the smallest detectable effect or groups of different sizes, a group treatment trial with unequal numbers or SDs in the two conditions, covariates other than one baseline score, and models with predictors measured at both levels (for those, mlmpower or simr)."
    inputs: ["How the conditions are assigned, the outcome, and their names", "The effect: Cohen's d (the difference between conditions, over the outcome's total SD)", "How alike people in the same group are (the intraclass correlation), and how much the effect varies between groups", "A baseline score, such as a pre-test (optional)", "Yes/no outcome: the proportion of 'yes' in each condition", "Yes/no outcome: how much the groups differ", "How many people in each group (the cluster size), and how much that varies"]
    tier: v2
    alternatives: ["a multilevel (mixed) model with the group as a random effect", "an analysis of the group means"]
