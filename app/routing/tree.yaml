# powerkit routing: the single source of truth for the app's routes,
# questions and end points.
#
# Built from docs/decision-tree.md (structure, end points, judgement calls,
# open questions) and docs/design-finder.md (card wording). Everything here
# is a proposal for the maintainer to confirm (decision-tree.md, top).
#
# app/routing/tests/testthat/test-docs-match.R checks that the end points
# and question IDs here match decision-tree.md, so the two can't drift
# apart. If you change one, change the other.
#
# Routing only: nothing in this file is used to calculate anything.

version: 1
source_docs:
  decision_tree: docs/decision-tree.md
  design_finder: docs/design-finder.md
  coverage: docs/coverage.md

links:
  validation_log: https://github.com/JoelThornton/Powerkit/blob/main/docs/validation-log.md
  coverage: https://github.com/JoelThornton/Powerkit/blob/main/docs/coverage.md
  decision_tree: https://github.com/JoelThornton/Powerkit/blob/main/docs/decision-tree.md
  tests_folder: https://github.com/JoelThornton/Powerkit/tree/main/engine/tests/testthat

banner: "Prototype: shows which analysis you need; it doesn't calculate anything yet."

# ---------------------------------------------------------------------------
# Settings: undecided judgement calls and open questions
# (decision-tree.md sections 3 and 5). `value: null` means undecided: the app
# shows a labelled placeholder wherever the setting applies. To record a
# decision, set `value` to one of the option keys; the app then shows the
# decision instead of the placeholder. No code changes are needed.
# `shown_at` lists screens (route ids, node ids, endpoint ids, "card",
# "plan", "start") where the placeholder appears.
# ---------------------------------------------------------------------------
settings:
  - key: observed_power
    ref: "Judgement call 3.1; open question 5"
    question: "If the effect size comes from the study's own result (observed power), should the form block it, warn about it, or allow it?"
    options: {block: "Block it", warn: "Warn and allow", allow: "Allow without comment"}
    value: null
    shown_at: [card]
  - key: effect_size_benchmarks
    ref: "Judgement call 3.2; open question 5"
    question: "Should small / medium / large benchmarks be shown, even as context? Should bias-corrected planning (e.g. BUCSS) be offered?"
    options: {hide: "Don't show benchmarks", context: "Show as context only, never as defaults", bucss: "Show as context, and offer bias-corrected planning"}
    value: null
    shown_at: [card]
  - key: one_sided_tests
    ref: "Judgement call 3.3; open question 5"
    question: "Should a one-sided test require a preregistration note? Should one-sided tests be offered for more designs than the basic tests?"
    options: {as_now: "Basic tests only, no note required", note: "Basic tests only, preregistration note required", wider: "More designs, preregistration note required"}
    value: null
    shown_at: [card]
  - key: simple_effects_target
    ref: "Judgement call 3.4; open question 5"
    question: "Should simple effects become a target alongside the interaction?"
    options: {"no": "No: the interaction only", "yes": "Yes: offer simple effects as a target"}
    value: null
    shown_at: [f5_between, f5_mixed]
  - key: several_hypotheses
    ref: "Judgement call 3.5; open question 5"
    question: "Should single-analysis routes ask whether the study tests several hypotheses?"
    options: {"no": "No", ask: "Yes: ask, and point to the guided route"}
    value: null
    shown_at: [card]
  - key: alpha_power_defaults
    ref: "Judgement call 3.6; open question 5"
    question: "Which defaults, if any, should alpha and target power have?"
    options: {none: "Blank: the user enters both", conventional: "Pre-filled .05 and .80", conventional_reason: "Pre-filled .05 and .80, with a required reason if changed or kept", rr: "Pre-filled .05 and .90"}
    value: null
    shown_at: [card]
  - key: chi_square_gof
    ref: "Judgement call 3.7; open question 5"
    question: "Chi-square goodness-of-fit (one categorical variable against expected proportions) has no answer in the tree. E6 is a test of independence only. Should goodness-of-fit go to E6 once the spec has a goodness-of-fit form, or get its own card?"
    options: {extend_e6: "Extend E6 (spec change; Spower's p_chisq.test() takes a probability vector), with the card explaining the degrees of freedom", own_card: "Its own card: not in powerkit yet, use Spower's p_chisq.test()"}
    value: null
    shown_at: [E6, E25]
  - key: rank_based_tests
    ref: "Judgement call 3.8; open question 5"
    question: "Rank-based tests (Mann-Whitney, Wilcoxon, Kruskal-Wallis, Friedman, rank correlation) reach the parametric end points. How should powerkit handle them?"
    options: {efficiency: "Adjust the t-test calculation by an efficiency factor for an assumed distribution (G*Power's approach), recorded as the convention", simulate: "Simulate the rank test (Spower's p_wilcox.test(), p_kruskal.test()) from an assumed distribution", label: "Give the parametric figure and say plainly that it only approximates the rank-based test", honest: "Honest cards for rank-based tests until one of the above is built"}
    value: null
    shown_at: [E1, E2, E3, E4, E18]
  - key: fisher_exact
    ref: "Judgement call 3.9; open question 5"
    question: "Fisher's exact test reaches the large-sample tests (E5, E6), which can be quite wrong with small expected counts. What should powerkit do?"
    options: {exact: "Offer the exact test (Spower's p_prop.test(exact = TRUE)) as a test version", warn: "Warn that the figure isn't reliable for small expected counts", both: "Both"}
    value: null
    shown_at: [E5, E6]
  - key: starting_point
    ref: "Open question 1"
    question: "Start from the hypothesis (as here), or also offer G*Power's design-based order (parameter class, then design)?"
    options: {hypothesis: "Hypothesis first (as here)", both: "Also offer the design-based order"}
    value: null
    shown_at: [start]
  - key: analysis_types
    ref: "Open question 2"
    question: "Offer only required N / power at a given N / smallest detectable effect? Show compromise and criterion as coming later? Show sensitivity greyed out or hidden where the engine can't do it yet?"
    options: {greyed: "Three types; sensitivity greyed out where unavailable", hidden: "Three types; sensitivity hidden where unavailable", five: "Also list compromise and criterion as coming later"}
    value: null
    shown_at: [card]
  - key: closing_order
    ref: "Open question 3"
    question: "Ask 'what do you want to find out?' after the design (G*Power's order, as here) or first (PAMLj's order)?"
    options: {after: "After the design", first: "First"}
    value: null
    shown_at: [start]
  - key: unstored_answers
    ref: "Open question 4"
    question: "Where should answers the spec can't store go (rating analysed as a score; randomised or not; why ANCOVA or the mixed interaction; expected interaction shape; manipulated or measured)?"
    options: {new_field: "A new spec field (schema change)", notes: "effect_justification.notes", app_only: "Keep them in the app only"}
    value: null
    shown_at: [o5a, pp2, me1, mm1]
  - key: pp1_f6_stored
    ref: "Open question 4 (PP1 and F6)"
    question: "PP1 (were people randomised?) and F6 (the expected interaction shape) don't change the end point. Should their answers be stored with the study (for the write-up and the shape check), or only shown on screen?"
    options: {store: "Store them (needs a place in the spec; see open question 4)", screen_only: "Show them on screen only", drop: "Don't ask them until there is somewhere to store them"}
    value: null
    shown_at: [pp1, f6_between, f6_mixed]
  - key: not_in_spec_wording
    ref: "Open question 6"
    question: "Confirm the wording that points users to another tool, and the rule that powerkit never routes to a simpler stand-in test."
    options: {proposed: "Use the proposed wording (below)"}
    value: null
    proposed_text: "powerkit doesn't cover {analysis} yet. {package} does: see the link. powerkit can't check results from other tools."
    shown_at: [card]
  - key: r_script_for_uncovered
    ref: "Open question 7"
    question: "For designs powerkit doesn't run, should the full-model builder generate a script (e.g. power4mome or Spower) that the user runs themselves, without powerkit's validation?"
    options: {"no": "No", "yes": "Yes, clearly labelled as not validated by powerkit"}
    value: null
    shown_at: [card]
  - key: bayes_entry
    ref: "Open question 8"
    question: "Where do Bayes factors enter the tree? Now: the Bayes factor end point (E-bayes) is reachable only from 'I know my analysis', and every card lists 'p-values or Bayes factors?' among the questions asked next."
    options: {start: "Ask 'p-values or Bayes factors?' on the start screen", after_goal: "Ask it after Q1, before the design questions", closing: "Ask it with the closing questions on each card", shortcut: "Shortcut list only (as now)"}
    value: null
    shown_at: [start]
  - key: parallel_mediators_max
    ref: "Open question 10"
    question: "Allow three or more parallel mediators before that validation exists (validated with two)?"
    options: {two: "Two only until validated", up_to_nine: "Up to nine, as the spec allows"}
    value: null
    shown_at: [me3, E11]
  - key: guided_route
    ref: "Open question 11"
    question: "Add the guided 'plan my whole study' route? (Its study file would be a schema change.)"
    options: {"yes": "Yes", "no": "No"}
    value: null
    hides_guided_route_when: "no"
    shown_at: [start, plan]
  - key: consistency_approach
    ref: "Open question 12"
    question: "Per-hypothesis forms with a consistency check, whole-study simulation from one model, or both?"
    options: {per_hypothesis: "Per hypothesis, with a consistency check", whole_study: "Whole-study simulation", both: "Both"}
    value: null
    shown_at: [plan]
  - key: guided_covariates
    ref: "Open question 15"
    question: "In the guided route, a covariate changes only the comparison of conditions (to ANCOVA, or multiple regression for a score X). Should covariates also enter the moderation and mediation analyses? (No template has covariates yet.)"
    options: {ignore: "No: comparison only (as now), saying so on the plan", include: "Yes, once the templates support covariates", ask: "Ask per analysis whether the covariate is included"}
    value: null
    shown_at: [plan]
  - key: guided_scope
    ref: "Open question 14"
    question: "What does the guided route do with repeated measures, many stimuli or nested data? Now: the screening questions stop nested data, stimuli and measurements over time before the guided route; three or more conditions per person are sent to 'Help me choose'."
    options: {send_to_tree: "Send users to 'Help me choose' (as now)", extend: "Extend the guided route to cover these designs", say_up_front: "Say on the start screen that the guided route is for single-session, between-person studies"}
    value: null
    shown_at: [guided_variables]
  - key: screening_wording
    ref: "Open question 16"
    question: "Final wording of the screening questions (S1-S4 and T1). The wording here is a draft."
    options: {as_drafted: "Keep the draft wording", revised: "Revised wording (edit the questions in tree.yaml and decision-tree.md)"}
    value: null
    shown_at: [s1, s2, s3, t1, s4]
  - key: segmented_growth_shared
    ref: "Open question 17"
    question: "Should segmented regression / interrupted time series (E45) and growth curves (E35) share one end point? Now: two cards, chosen at T1."
    options: {separate: "Keep two end points", shared: "Merge them into one 'many measurements over time' card"}
    value: null
    shown_at: [t1, E35, E45]
  - key: name_other_tools
    ref: "Open question 18"
    question: "Should 'not covered' cards name other established tools (e.g. simr, G*Power's logistic and Poisson routines)? Now: generic cards say only 'Established tools exist for this design; powerkit hasn't checked them.' Cards built from coverage.md still list its tools."
    options: {name: "Name the tools, as coverage.md does", neutral: "Neutral sentence only, on every 'not covered' card"}
    value: null
    shown_at: [E43, E44, E46, E47]
  - key: other_analyses_note
    ref: "Open question 20"
    question: "Show a note on covered cards that other defensible analyses exist for the design (listed per card, e.g. Student's vs Welch's t), and that they can need different sample sizes? The drafts are in docs/routing-audit.md, 'Other defensible analyses'. Off while undecided."
    options: {show: "Show the note on covered cards", hide: "Don't show it"}
    value: null
    shown_at: []
  - key: effect_size_inputs
    ref: "Input screens (17 October 2026); judgement call 3.2"
    question: "On the input screens, effect sizes, SDs and correlations start empty and must be filled in, with a justification. Should they instead offer suggested values (for example conventional benchmarks) that the user can change?"
    options: {empty_required: "Start empty and required, with a justification (as now)", suggested: "Offer suggested values the user can change, still with a justification"}
    value: null
    shown_at: [form]
  - key: covariates_per_analysis
    ref: "Open question 13"
    question: "Should the app ask, for each analysis, which covariates it includes? (The spec can't hold covariates for any design yet.)"
    options: {"yes": "Yes, ask per analysis", "no": "No"}
    value: null
    shown_at: [plan]

# ---------------------------------------------------------------------------
# Start screen: the three routes (decision-tree.md 2.1 and 4.1).
# ---------------------------------------------------------------------------
# Every route starts with the screening questions (`screening_start`). The
# screening's "Detect an effect" answer has `next: continue`, which leads to
# the route's `after_screening`: a node id, "list" (the end-point list) or
# "guided" (the guided route's variables screen).
routes:
  doc_id: S0
  question: "How do you want to start?"
  screening_start: s1
  screening_note: "First, four questions check that your design is one powerkit can advise on. No test is suggested until then."
  options:
    - id: known
      label: "I know my analysis"
      help: "Pick it from a list, as in G*Power's or PAMLj's menus (after four screening questions)."
      after_screening: list
    - id: choose
      label: "Help me choose"
      help: "Answer a few questions about your study, one per screen."
      after_screening: q1
    - id: guided
      label: "Plan my whole study"
      help: "For studies with several analyses on the same data: describe the variables once, tick the analyses, and get a plan."
      after_screening: guided

# ---------------------------------------------------------------------------
# Questions: one node per screen. `doc_id` is the question's ID in
# decision-tree.md, section 2.2. Each option's `next` is another node id or
# an end point id (E...). Wording follows design-finder.md.
#
# Screening answers that later questions depend on are kept as context:
# - an option's `sets` records one (outcome: score | yesno; times: once |
#   twice | many_conditions);
# - an option's `when` shows it only for matching context;
# - a node with `branch_on` is never shown: it routes on the context
#   (`routes`), because the screening has already answered it.
# Every shown question also offers the safety net (`safety_net`, below),
# added by the app.
# ---------------------------------------------------------------------------
nodes:
  # Screening (decision-tree.md 2.2, S1-S4): asked first in every route,
  # before any test is suggested. Wording is a draft (open question 16).
  s1:
    doc_id: S1
    text: "What kind of outcome will you measure?"
    help: "The outcome is what you measure to see whether your hypothesis holds."
    options:
      - {label: "A score or scale", next: s2, sets: {outcome: score}, help: "e.g. a questionnaire mean, a reaction time, words recalled."}
      - {label: "Yes/no, or one of several categories", next: s2, sets: {outcome: yesno}, help: "e.g. passed or failed; chose option A, B or C."}
      - {label: "A count", next: E28, help: "How many times something happened, with no fixed maximum."}
      - {label: "Ordered categories (e.g. a single rating item)", next: o5a, help: "e.g. one item rated from 'strongly disagree' to 'strongly agree'."}
      - {label: "The time until something happens", next: E43, help: "e.g. days until relapse, or whether and when people drop out."}
  o5a:
    doc_id: O5a
    text: "How will you analyse this rating?"
    help: "Researchers disagree about this, so we ask rather than choose for you. Your answer is stated in the write-up."
    refs: "decision D1"
    options:
      - {label: "As a score (for example, comparing mean ratings)", next: s2, sets: {outcome: score}, help: "This treats the rating as an interval scale, which is debated."}
      - {label: "As ordered categories", next: E29}
  s2:
    doc_id: S2
    text: "How are the data grouped?"
    options:
      - {label: "Independent people", next: s3, help: "Each person's data are separate from everyone else's. If your data come from one person or one unit (for example, a school's monthly averages), choose this too."}
      - {label: "People within groups", next: E34, help: "e.g. pupils in classes or patients in clinics, including designs where whole groups were assigned to conditions."}
      - {label: "Pairs", next: E44, help: "e.g. couples, or a parent and child, whose scores are related."}
      - {label: "Many trials or stimuli per person", next: E33, help: "e.g. each person rates 40 faces or completes 200 trials."}
  s3:
    doc_id: S3
    text: "How many times is each person measured on the outcome?"
    options:
      - {label: "Once", next: s4, sets: {times: once}}
      - {label: "Twice", next: s4, sets: {times: twice}, help: "e.g. once before and once after, or once in each of two conditions."}
      - {label: "Many times", next: t1, help: "Three or more measurements: in different conditions, or over time."}
  t1:
    doc_id: T1
    text: "What are the repeated measurements?"
    options:
      - {label: "The same people in three or more conditions", next: s4, sets: {times: many_conditions}, help: "e.g. everyone completes three tasks, or every cell of a 2 x 2 design."}
      - {label: "Measurements over time, to see whether a trend changes at a known point", next: E45, help: "e.g. weekly scores before and after a policy change (segmented regression, interrupted time series)."}
      - {label: "Measurements over time, to see how people change", next: E35, help: "e.g. growth curves, diary or experience-sampling studies, panel waves."}
  s4:
    doc_id: S4
    text: "What's your goal?"
    options:
      - {label: "Detect an effect", next: continue, help: "Show that a difference, relationship or effect exists."}
      - {label: "Show there's no meaningful effect", next: E36, help: "Equivalence or non-inferiority: the effect is smaller than a bound you set."}
      - {label: "Estimate an effect precisely", next: E46, help: "Plan for a target confidence-interval width rather than for power."}

  q1:
    doc_id: Q1
    text: "What do you want your study to show?"
    help: "Pick the sentence closest to your main hypothesis. You can change it later."
    options:
      - {label: "A difference between groups or conditions", next: q2_diff, help: "e.g. students who sleep eight hours recall more words than students who sleep five."}
      - {label: "A relationship between two things you measure", next: q2_rel, help: "e.g. daily screen time is related to loneliness."}
      - {label: "That an effect depends on something else (moderation)", next: q2_mod, help: "e.g. daily stress harms sleep less for people with more social support."}
      - {label: "That an effect works through something else (mediation)", next: q2_med, help: "e.g. a self-affirmation task reduces defensiveness, which makes people more willing to change."}
      - {label: "Both: it works through something, and part of that depends on something else", next: q2_modmed, help: "Moderated mediation."}
      - {label: "That an effect is absent, or too small to matter", next: E36}
      - {label: "That a model fits: a questionnaire structure, or a model with latent variables (SEM)", next: E37}

  # A difference ------------------------------------------------------------
  q2_diff:
    doc_id: Q2
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: f1, yesno: q3_cat}
  f1:
    doc_id: F1
    text: "How many things did you vary or compare?"
    help: "Each thing you vary is called a factor (for example 'condition' or 'time')."
    options:
      - {label: "One", next: f2}
      - {label: "Two, crossed (every combination appears)", next: f3}
      - {label: "Three or more", next: E21}
  f2:
    doc_id: F2
    text: "How many groups or conditions?"
    options:
      - {label: "One group, compared with a fixed value", next: E1, when: {times: once}}
      - {label: "Two, with different people in each", next: E2, when: {times: once}}
      - {label: "Two, with the same people in both (or one group measured twice)", next: E3, when: {times: twice}}
      - {label: "Three or more", next: f2a, when: {times: [once, many_conditions]}}
  f2a:
    doc_id: F2a
    text: "What does your hypothesis say about the groups?"
    help: "Researchers disagree about whether to power the overall test or a specific comparison, so we ask."
    refs: "decision D8"
    options:
      - {label: "A specific comparison (e.g. both feedback conditions beat no feedback)", next: E19}
      - {label: "Any difference among the groups", next: E18}
  f3:
    doc_id: F3
    text: "Does each factor have exactly two levels?"
    options:
      - {label: "Yes: 2 x 2", next: f4}
      - {label: "No: at least one factor has three or more", next: E21}
  f4:
    doc_id: F4
    text: "For each factor: did different people get each level, or did everyone get both?"
    options:
      - {label: "Both factors: different people", next: f4a_between, when: {times: once}}
      - {label: "One factor different people, the other everyone got both", next: f4a_mixed, when: {times: twice}}
      - {label: "Both factors: everyone got both", next: E20, when: {times: many_conditions}}
  f4a_between:
    doc_id: F4a
    text: "Will the groups be equal in size?"
    help: "Whether every combination will have the same number of people."
    refs: "decisions D5, N1-N3"
    options:
      - {label: "Yes: the same number in every group", next: f5_between}
      - {label: "No: the groups will differ in size", next: E22}
  f5_between:
    doc_id: F5
    text: "Which result matters most for your study?"
    help: "Power is calculated for one effect. Choose the one your main hypothesis is about."
    options:
      - {label: "The effect of factor A, averaged over factor B", next: E7}
      - {label: "The effect of factor B, averaged over factor A", next: E7}
      - {label: "Whether the effect of one depends on the other (the interaction)", next: f6_between}
  f6_between:
    doc_id: F6
    text: "Which picture matches your prediction?"
    help: "The shape is recorded only; you enter the means on the form."
    refs: "decision D6"
    options:
      - {label: "The lines cross (the effect reverses)", next: E7}
      - {label: "One effect shrinks", next: E7}
      - {label: "One effect disappears", next: E7}
  f4a_mixed:
    doc_id: F4a
    text: "Will the groups be equal in size?"
    options:
      - {label: "Yes: the same number in every group", next: f4b}
      - {label: "No: the groups will differ in size", next: E22}
  f4b:
    doc_id: F4b
    text: "Is the within-participants factor a 'before and after' measurement?"
    options:
      - {label: "Yes: before and after", next: pp1}
      - {label: "No: another within-participants condition", next: f5_mixed}
  pp1:
    doc_id: PP1
    text: "Were people randomly assigned to the groups?"
    help: "Decision D2."
    options:
      - {label: "Yes, randomly assigned", next: pp2, help: "With randomised groups, ANCOVA is usually more powerful than the mixed interaction."}
      - {label: "No, the groups already existed or chose themselves", next: pp2, help: "Without random assignment, the two analyses can answer different questions (Lord's paradox). Neither is right by default."}
  pp2:
    doc_id: PP2
    text: "Which analysis do you plan to use?"
    help: "Researchers disagree about this, so we ask rather than choose for you."
    options:
      - {label: "ANCOVA: the after score, adjusting for the before score", next: E23}
      - {label: "The 2 x 2 mixed ANOVA interaction (group x time)", next: f6_mixed}
  f5_mixed:
    doc_id: F5
    text: "Which result matters most for your study?"
    options:
      - {label: "The effect of the between-participants factor", next: E8}
      - {label: "The effect of the within-participants factor", next: E8}
      - {label: "Whether the effect of one depends on the other (the interaction)", next: f6_mixed}
  f6_mixed:
    doc_id: F6
    text: "Which picture matches your prediction?"
    options:
      - {label: "The lines cross (the effect reverses)", next: E8}
      - {label: "One effect shrinks", next: E8}
      - {label: "One effect disappears", next: E8}
  q3_cat:
    doc_id: Q3
    text: "Who gives the data?"
    options:
      - {label: "Different people, two groups, yes/no outcome", next: E5, when: {times: once}}
      - {label: "Different people, outcome in categories", next: E6, when: {times: once}}
      - {label: "One group, compared with a fixed proportion", next: E25, when: {times: once}}
      - {label: "Two or more factors (e.g. a 2 x 2 design), yes/no outcome", next: E47, when: {times: once}}
      - {label: "The same people in every condition", next: E26, when: {times: [twice, many_conditions]}}

  # A relationship ----------------------------------------------------------
  q2_rel:
    doc_id: Q2
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: q3_rel, yesno: q2_rel_cat}
  q2_rel_cat:
    doc_id: Q2
    text: "Which kind of categorical outcome?"
    options:
      - {label: "Yes/no", next: E27}
      - {label: "One of several categories (and the other variable is categories too)", next: E6}
  q3_rel:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: r1, twice: E41, many_conditions: E41}
  r1:
    doc_id: R1
    text: "What is the other variable like?"
    options:
      - {label: "A score or scale", next: E4}
      - {label: "Groups or categories (that makes it a difference between groups)", next: f1}
      - {label: "Several predictors at once, or controlling for other variables", next: E24}

  # Moderation --------------------------------------------------------------
  q2_mod:
    doc_id: Q2
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: q3_mod, yesno: E32}
  q3_mod:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: mo1, twice: E41, many_conditions: E41}
  mo1:
    doc_id: MO1
    text: "What is your main predictor (X)?"
    options:
      - {label: "Two conditions you assigned, or two groups that already exist", next: mo2_xbin}
      - {label: "A measured score", next: mo2_xscore}
      - {label: "Three or more conditions or groups", next: E30}
  mo2_xbin:
    doc_id: MO2
    text: "What does the effect depend on (the moderator, W)?"
    options:
      - {label: "Two conditions or two groups (a 2 x 2 design)", next: f4}
      - {label: "A measured score", next: E15}
      - {label: "Three or more groups", next: E30}
  mo2_xscore:
    doc_id: MO2
    text: "What does the effect depend on (the moderator, W)?"
    options:
      - {label: "Two conditions or two groups", next: E15}
      - {label: "A measured score", next: mo3}
      - {label: "Three or more groups", next: E30}
  mo3:
    doc_id: MO3
    text: "Does a third variable change the interaction again?"
    options:
      - {label: "No", next: E9}
      - {label: "Yes (a three-way interaction)", next: E31}

  # Mediation ---------------------------------------------------------------
  q2_med:
    doc_id: Q2
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: q3_med, yesno: E32}
  q3_med:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: me1, twice: E41, many_conditions: E41}
  me1:
    doc_id: ME1
    text: "What is the cause (X)?"
    help: "The M -> Y path is not randomised, even when X is manipulated."
    refs: "decision D9"
    options:
      - {label: "Two conditions you assigned, or two groups", next: me4_xbin}
      - {label: "A measured score", next: me4}
      - {label: "Three or more conditions or groups", next: E42}
  me4_xbin:
    doc_id: ME4
    text: "Are your mediators scores?"
    options:
      - {label: "Yes", next: me2_xbin}
      - {label: "No, at least one is yes/no or a category", next: E39}
  me2_xbin:
    doc_id: ME2
    text: "How many go-betweens (mediators)?"
    options:
      - {label: "One", next: E16}
      - {label: "Two or more", next: me3_xbin}
  me3_xbin:
    doc_id: ME3
    text: "How do the mediators connect?"
    help: "With a yes/no X, both arrangements are coming soon."
    refs: "phase 3b"
    options:
      - {label: "Side by side: X affects each one separately", next: E16}
      - {label: "In a chain: X affects the first, which affects the next", next: E16}
  me4:
    doc_id: ME4
    text: "Are your mediators scores?"
    options:
      - {label: "Yes", next: me2}
      - {label: "No, at least one is yes/no or a category", next: E39}
  me2:
    doc_id: ME2
    text: "How many go-betweens (mediators)?"
    options:
      - {label: "One", next: E10}
      - {label: "Two or more", next: me3}
  me3:
    doc_id: ME3
    text: "How do the mediators connect?"
    options:
      - {label: "Side by side: X affects each one separately", next: E11}
      - {label: "In a chain: X affects the first, which affects the next", next: E12}

  # Moderated mediation -----------------------------------------------------
  q2_modmed:
    doc_id: Q2
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: q3_modmed, yesno: E32}
  q3_modmed:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: mm1, twice: E41, many_conditions: E41}
  mm1:
    doc_id: MM1
    text: "What is the cause (X)?"
    options:
      - {label: "Conditions you assigned, or two groups", next: E17}
      - {label: "A measured score", next: mm2}
  mm2:
    doc_id: MM2
    text: "What does part of the process depend on (the moderator, W)?"
    options:
      - {label: "Two groups or conditions", next: E17}
      - {label: "A measured score", next: mm3}
  mm3:
    doc_id: MM3
    text: "How many mediators?"
    options:
      - {label: "One", next: mm4}
      - {label: "Two or more", next: E40}
  mm4:
    doc_id: MM4
    text: "Which link depends on W?"
    options:
      - {label: "The link from X to the mediator", next: E13}
      - {label: "The link from the mediator to the outcome", next: E14}
      - {label: "Both links, or X to the mediator and the direct link", next: E38}

# ---------------------------------------------------------------------------
# Closing questions: shown on every end-point card as "what you'd be asked
# next" (decision-tree.md 2.2, "Every design" rows; chart F).
# `setting` names the undecided setting(s) shown, as a compact labelled
# placeholder, next to that question on the card.
# ---------------------------------------------------------------------------
# Closing questions (decision-tree.md, table 2.2, "Every design" rows).
# Each card shows only the questions whose `applies_to` names it ("all" for
# every card that runs or is coming soon), following table 2.2's "Engine can
# use it?" column. decision-tree.md, "Closing questions by card", has the
# same table; a test keeps them in step. `card_notes` gives a card-specific
# note in place of `note`.
closing_questions:
  # Not E15 (a yes/no X or W): misclassification in a 0/1 variable is a
  # different problem from unreliable scores (maintainer decision,
  # 16 October 2026; docs/decisions.md).
  - {doc_id: Q-rel, text: "Do you know how reliable your measures are? (optional)", applies_to: [E9]}
  - {doc_id: Q-dir, text: "Does your hypothesis predict a direction?", setting: one_sided_tests, applies_to: [E1, E2, E3, E4, E5]}
  - doc_id: Q-test
    text: "Which version of the test?"
    applies_to: [E2, E7, E8]
    card_notes: {E2: "Student's or Welch's t-test.", E7: "Exact dataset (no repeated simulation) or repeated simulation.", E8: "Exact dataset (no repeated simulation) or repeated simulation."}
  - doc_id: Q-goal
    text: "What do you want to find out: the sample size you need, the power at a given N (for an effect size you plan for), or the smallest effect you could detect at a given N?"
    note: "The smallest detectable effect isn't available for this design yet. Observed power (from the study's own result) is not offered."
    card_notes: {E7: "All three are available for this design. Observed power (from the study's own result) is not offered.", E8: "All three are available for this design. Observed power (from the study's own result) is not offered."}
    setting: [analysis_types, observed_power]
    applies_to: all
  - {doc_id: Q-alpha, text: "Which significance level (alpha)?", setting: alpha_power_defaults, applies_to: all}
  - {doc_id: Q-power, text: "What power do you want?", applies_to: all}
  - {doc_id: Q-effect, text: "What effect do you expect, and where does that number come from?", setting: effect_size_benchmarks, applies_to: all}
  - {doc_id: Q-attr, text: "How many participants do you expect to lose?", applies_to: all}
  - {doc_id: Q-multi, text: "Does your study test more than one hypothesis that this power analysis should cover?", setting: several_hypotheses, applies_to: all}
  - {doc_id: Q-bayes, text: "Will you test your hypothesis with p-values or with Bayes factors?", setting: bayes_entry, applies_to: all}

# Added by the app to every question, in every route (and to the end-point
# list): leads to a card saying powerkit can't advise on the design yet.
safety_net:
  label: "None of these fit / I'm not sure"
  endpoint: E-unsure
  # Shown on the safety-net card: what to write down for a statistician,
  # filled in from the user's screening answers (the nodes named in each
  # item; "not answered yet" when the user hasn't reached that question).
  prepare:
    intro: "Before you meet a statistician, write down these points. Your answers so far are filled in."
    items:
      - {label: "What kind of outcome you will measure", nodes: [s1, o5a]}
      - {label: "How the data are grouped", nodes: [s2]}
      - {label: "How many times each person (or unit) is measured", nodes: [s3, t1]}
      - {label: "Your goal", nodes: [s4]}
    not_answered: "not answered yet"
    stopped_at: "Where nothing fitted"
    also: ["Your hypothesis, in one sentence", "The effect you expect, and where that number comes from", "How many participants you could realistically recruit", "How you plan to analyse the data, if you know"]

# Shown on generic "not covered" cards that have `established_tools: true`.
# Whether such cards should name the tools is open question 18.
established_tools_text: "Established tools exist for this design; powerkit hasn't checked them."

# Shown on cards for end points with `no_ready_made_tool`.
# Draft note for covered cards; {alternatives} is the card's list. Shown
# only when other_analyses_note is "show".
other_analyses_text: "Other defensible analyses exist for this design (e.g. {alternatives}), and they can need different sample sizes. Power the analysis you plan to run."

no_ready_made_tool_text: "No ready-made tool. Your options are a custom simulation in R (for example with Spower, where you write the data-generating and analysis code yourself) or advice from a statistician."

# The effect-size justification prompt on every card (spec field
# effect_justification; build guide section 4).
justification_prompt:
  text: "Where does your effect size come from? powerkit asks for a justification and never uses a 'medium effect' default."
  types:
    smallest_effect_of_interest: "The smallest effect that would matter (smallest effect size of interest)"
    meta_analysis: "A meta-analysis"
    prior_study: "A previous study (you'll be asked how you adjusted it, e.g. for publication bias)"
    pilot_study: "A pilot study (you'll see a warning: pilot estimates are very imprecise)"

# ---------------------------------------------------------------------------
# End points (decision-tree.md, table 2.3). `doc_name` is copied exactly
# from the table; `plain_name` is what the card shows.
# status: runs_validated | runs_validation_in_progress | coming_soon | not_in_powerkit
#   To mark an end point validated once its full run is recorded in
#   docs/validation-log.md: change `status: runs_validation_in_progress` to
#   `status: runs_validated`, update `validation: note`, and change the
#   "Validated?" cell of decision-tree.md table 2.3 to start with "Yes"
#   (test-docs-match.R checks the two agree).
# no_ready_made_tool: true when no tool offers this analysis, or names the
#   part of the end point that has none (e.g. "Cochran's Q"). The card then
#   shows the text in `no_ready_made_tool_text` (above).
# status_text: replaces no_ready_made_tool_text on that card only (E45).
# five_tools: "not covered" when none of the five tools powerkit builds on
#   covers the end point (the card says so).
# generic: true for one card per category of design powerkit doesn't
#   cover, where it is unclear which specific end point applies. The card
#   shows `card_text` (and `established_tools_text` if
#   `established_tools: true`) instead of a package list.
# card_points: extra points listed on the card.
# alternatives: other analyses that could be defended for the same question
#   (covered end points). The card note that lists them is shown only when
#   the setting other_analyses_note is "show" (open question 20).
# never_screened_out: true for end points the end-point list shows whatever
#   the screening answers (Bayes factors: open question 8).
# from_coverage: false when the card's tool line isn't taken from
#   docs/coverage.md (the card then doesn't say it is).
# tier: MVP | v2 | later | none (the table's tier text starts with this; none for the safety net).
# ---------------------------------------------------------------------------
endpoints:
  E1:
    doc_name: "One-sample t-test"
    plain_name: "Compare one group's average with a fixed value"
    template: "basic_test / one_sample_t"
    backend: "Spower: Spower() with p_t.test()"
    method: Simulation
    inputs: ["Your outcome's name", "Cohen's d: (expected mean minus the fixed value) / SD"]
    status: runs_validated
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. No published example has been checked for this design yet."}
    tier: MVP
    alternatives: ["the one-sample Wilcoxon signed-rank test", "the sign test"]
  E2:
    doc_name: "Independent-samples t-test (Student's; Welch's as an option)"
    plain_name: "Compare two separate groups on a score"
    template: "basic_test / independent_t"
    backend: "Spower: Spower() with p_t.test()"
    method: Simulation
    inputs: ["Names of the two groups and the outcome", "Cohen's d: (group 2 minus group 1) / pooled SD", "The size of group 2 relative to group 1 (1 = equal)", "Student's or Welch's test"]
    status: runs_validated
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["Student's or Welch's t-test", "the Mann-Whitney test", "a permutation test"]
  E3:
    doc_name: "Paired-samples t-test"
    plain_name: "Compare the same people in two conditions (or before and after)"
    template: "basic_test / paired_t"
    backend: "Spower: Spower() with p_t.test(type = 'paired')"
    method: Simulation
    inputs: ["Names of the two conditions and the outcome", "d_z: mean of the differences (second minus first) / SD of the differences"]
    status: runs_validated
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["the Wilcoxon signed-rank test", "the sign test"]
  E4:
    doc_name: "Pearson correlation"
    plain_name: "Test whether two scores are related"
    template: "basic_test / correlation"
    backend: "Spower: Spower() with p_r()"
    method: Simulation
    inputs: ["Names of the two variables", "The expected correlation r"]
    status: runs_validated
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["Pearson's, Spearman's or Kendall's correlation"]
  E5:
    doc_name: "Test of two proportions (z test)"
    plain_name: "Compare two groups on a yes/no outcome"
    template: "basic_test / two_proportions"
    backend: "Spower: Spower() with p_prop.test() (no continuity correction)"
    refs: "Departure 5 (docs/conventions.md)"
    method: Simulation
    inputs: ["Names of the groups and the outcome", "The expected proportion of 'yes' in each group", "The size of group 2 relative to group 1"]
    status: runs_validated
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["the z test with or without a continuity correction", "Fisher's exact test", "logistic regression"]
  E6:
    doc_name: "Chi-square test of independence"
    plain_name: "Test whether two sets of categories are related"
    template: "basic_test / chi_square_independence"
    backend: "Spower: Spower() with p_chisq.test()"
    method: Simulation
    inputs: ["The categories of each variable", "The expected proportion of people in each combination (adding up to 1)"]
    status: runs_validated
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. No published example has been checked for this design yet."}
    tier: MVP
    alternatives: ["the chi-square test with or without a continuity correction (2 x 2 tables)", "Fisher's exact test", "a likelihood-ratio (G) test"]
  E7:
    doc_name: "2 x 2 between-participants ANOVA (main effect or interaction)"
    plain_name: "Two factors crossed, different people in each of the four groups"
    template: "factorial_anova / 2x2_between"
    backend: "Superpower: ANOVA_exact() (ANOVA_power() if simulation is chosen)"
    method: "Exact dataset (no repeated simulation)"
    inputs: ["Names of the two factors, their levels and the outcome", "The four expected cell means (raw or in SD units)", "The SD (one, or one per cell)", "Which effect: factor A, factor B or the interaction"]
    status: runs_validated
    validation: {file: test-validation-anova-2x2-between.R, note: "Full validation run passed. Smallest detectable effect is available for this design."}
    tier: MVP
    alternatives: ["tests of the simple effects", "a planned contrast"]
  E8:
    doc_name: "2 x 2 mixed ANOVA (incl. group × time)"
    plain_name: "One factor between people, one within (including group x time)"
    template: "factorial_anova / 2x2_mixed"
    backend: "Superpower: ANOVA_exact()"
    refs: "Departure 2 (ANOVA_exact(), not ANOVA_exact2(); docs/conventions.md)"
    method: "Exact dataset (no repeated simulation)"
    inputs: ["Names of the factors, their levels and the outcome", "The four expected cell means", "The SD", "The correlation between the two repeated measurements", "Which effect: between factor, within factor or the interaction"]
    status: runs_validated
    validation: {file: test-validation-anova-2x2-mixed.R, note: "Full validation run passed. Smallest detectable effect is available for this design."}
    tier: MVP
    alternatives: ["for a before-and-after design, ANCOVA on the after score adjusting for the before score", "for a before-and-after design, a t-test on change scores", "a mixed model"]
  E9:
    doc_name: "Moderated regression (continuous × continuous)"
    plain_name: "Does the effect of one score depend on another score?"
    template: "regression_interaction / two_way"
    backend: "InteractionPoweR: power_interaction() (power_interaction_r2() only brackets N)"
    method: Simulation
    inputs: ["Correlations: X with Y, W with Y, the interaction XW with Y, and X with W", "Optional: reliability of X, W and Y"]
    status: runs_validated
    validation: {file: test-validation-regression-interaction.R, note: "Full validation run passed on 16 October 2026. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["a latent-variable interaction model that allows for measurement error"]
  E10:
    doc_name: "Simple mediation (PROCESS model 4)"
    plain_name: "X affects Y through one go-between (M)"
    template: "mediation / process_4 (mediator M)"
    backend: "power4mome: power4test() with test_indirect_effect(), Monte Carlo CI"
    method: Simulation
    inputs: ["Standardised paths X -> M, M -> Y and X -> Y", "Number of Monte Carlo draws per CI (optional)"]
    status: runs_validated
    validation: {file: test-validation-mediation-simple.R, note: "Full validation run passed on 16 October 2026. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["a bootstrap confidence interval", "the joint-significance test", "the Sobel test"]
  E11:
    doc_name: "Parallel mediation (PROCESS model 4)"
    plain_name: "X affects Y through several go-betweens side by side"
    template: "mediation / process_4 (mediators M1, M2, ...)"
    backend: "power4mome: power4test() with test_indirect_effect()"
    method: Simulation
    inputs: ["Standardised paths for each mediator", "Correlations between the mediators' residuals", "Which indirect path the hypothesis is about"]
    status: runs_validated
    validation: {file: test-validation-mediation-parallel.R, note: "Full validation run passed on 16 October 2026, with two mediators; three or more not yet tested. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["a bootstrap confidence interval", "the joint-significance test", "testing each specific indirect effect or the total indirect effect"]
  E12:
    doc_name: "Serial mediation (PROCESS model 6)"
    plain_name: "X affects Y through a chain of go-betweens"
    template: "mediation / process_6 (M1 to M4)"
    backend: "power4mome: power4test() with test_indirect_effect()"
    method: Simulation
    inputs: ["Standardised paths, every forward path", "Which indirect path the hypothesis is about"]
    status: runs_validated
    validation: {file: test-validation-mediation-serial.R, note: "Full validation run passed on 15 October 2026, with two mediators; three or more not yet tested. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["a bootstrap confidence interval", "the joint-significance test", "testing the full serial path or each shorter path"]
  E13:
    doc_name: "First-stage moderated mediation (PROCESS model 7), index of moderated mediation"
    plain_name: "Mediation where W changes the X -> M link"
    template: "moderated_mediation / process_7"
    backend: "power4mome: power4test() with test_index_of_mome()"
    method: Simulation
    inputs: ["Standardised paths, including the interaction XW -> M"]
    status: runs_validated
    validation: {file: test-validation-modmed-process7.R, note: "Full validation run passed on 17 October 2026 (the rerun after the power4mome seeding fix). A check against a published example is still to come."}
    refs: "PR #20 (power4mome seeding fix); docs/validation-log.md"
    tier: MVP
    alternatives: ["conditional indirect effects at chosen values of W"]
  E14:
    doc_name: "Second-stage moderated mediation (PROCESS model 14)"
    plain_name: "Mediation where W changes the M -> Y link"
    template: "moderated_mediation / process_14"
    backend: "power4mome: power4test() with test_index_of_mome()"
    method: Simulation
    inputs: ["Standardised paths, including the interaction MW -> Y"]
    status: runs_validated
    validation: {file: test-validation-modmed-process14.R, note: "Full validation run passed on 17 October 2026 (the rerun after the power4mome seeding fix). A check against a published example is still to come."}
    refs: "PR #20 (power4mome seeding fix); docs/validation-log.md"
    tier: MVP
    alternatives: ["conditional indirect effects at chosen values of W"]
  E15:
    doc_name: "Moderated regression with a yes/no X or W"
    plain_name: "Does an effect depend on a moderator, when X or W is two groups?"
    template: "regression_interaction / two_way (X or W yes/no)"
    backend: "InteractionPoweR: power_interaction() with k.x1 / k.x2 = 2 (planned)"
    method: Simulation
    inputs: ["Fully standardised correlations", "Groups are always 50/50 for interactions (InteractionPoweR has no unequal split)"]
    status: coming_soon
    coming_soon_note: "Planned next: a yes/no X or W."
    refs: "phase 3b (build guide, section 8)"
    tier: MVP
    alternatives: ["a latent-variable interaction model that allows for measurement error"]
  E16:
    doc_name: "Mediation with a yes/no X"
    plain_name: "Mediation where X is two conditions or two groups"
    template: "mediation / process_4 or process_6 (X yes/no)"
    backend: "power4mome: power4test() with x_fun = rbinary_rs() (planned)"
    method: Simulation
    inputs: ["Fully standardised paths", "The group split (50/50 by default)"]
    status: coming_soon
    coming_soon_note: "Planned next: a yes/no X or W."
    refs: "phase 3b (build guide, section 8)"
    tier: MVP
    alternatives: ["a bootstrap confidence interval", "the joint-significance test", "the Sobel test"]
  E17:
    doc_name: "Moderated mediation with a yes/no X or W"
    plain_name: "Moderated mediation where X or W is two groups"
    template: "moderated_mediation / process_7 or process_14 (X or W yes/no)"
    backend: "power4mome: power4test() with rbinary_rs() (planned)"
    method: Simulation
    inputs: ["Fully standardised paths", "A yes/no X or W must be uncorrelated with the other predictors (fits a randomised condition)"]
    status: coming_soon
    coming_soon_note: "Planned next: a yes/no X or W."
    refs: "phase 3b (build guide, section 8)"
    tier: MVP
    alternatives: ["conditional indirect effects for each group"]
  E18:
    doc_name: "One-way ANOVA (different people) or repeated-measures ANOVA (same people), omnibus"
    plain_name: "Any difference among three or more groups or conditions"
    status: not_in_powerkit
    inputs: ["The expected group means", "The SD", "For the same people: the correlations between conditions"]
    packages:
      - {name: Superpower, url: "https://cran.r-project.org/package=Superpower", what: "Factorial ANOVA power from means, SDs and correlations (between, within and mixed designs, up to three factors)."}
    tier: v2
  E19:
    doc_name: "Planned contrast"
    plain_name: "A specific comparison among three or more groups"
    status: not_in_powerkit
    inputs: ["Contrast weights", "The expected group means and SD"]
    packages:
      - {name: Superpower, url: "https://cran.r-project.org/package=Superpower", what: "Power for emmeans contrasts (pairwise, custom, simple effects) in factorial designs."}
      - {name: pwranova, url: "https://cran.r-project.org/package=pwranova", what: "Analytic power for planned contrasts in between- or within-factor ANOVA (pwrcontrast())."}
    tier: v2
  E20:
    doc_name: "2 x 2 within-participants ANOVA"
    plain_name: "Two factors crossed, everyone in all four conditions"
    status: not_in_powerkit
    inputs: ["The four expected means", "The SD", "The correlations between the repeated measures"]
    packages:
      - {name: Superpower, url: "https://cran.r-project.org/package=Superpower", what: "Factorial ANOVA power from means, SDs and correlations, including within-participants designs (\"2w*2w\")."}
    tier: v2
  E21:
    doc_name: "Larger factorial ANOVA (2 x 3, 3 x 3, 2 x 2 x 2, ...)"
    plain_name: "Factorial designs bigger than 2 x 2"
    status: not_in_powerkit
    inputs: ["The expected cell means", "SDs and correlations"]
    packages:
      - {name: Superpower, url: "https://cran.r-project.org/package=Superpower", what: "Factorial ANOVA up to three factors, 2 to 99 levels each, any mix of between and within."}
      - {name: pwranova, url: "https://cran.r-project.org/package=pwranova", what: "Analytic power for any number of between and within factors (default cap six), from partial eta-squared or Cohen's f."}
    tier: v2
  E22:
    doc_name: "2 x 2 ANOVA with unequal group sizes"
    plain_name: "A 2 x 2 design where the groups differ in size"
    status: not_in_powerkit
    inputs: ["The four expected cell means and SD", "The size of each group"]
    packages:
      - {name: Superpower, url: "https://cran.r-project.org/package=Superpower", what: "Documents unequal group sizes for ANOVA_power() only: ANOVA_design() help, argument n (\"If unequal n is entered then the design can only be passed onto ANOVA_power\"), and NEWS for 0.0.3. ANOVA_power() stops for designs with a within factor, so this covers the 2 x 2 between design, not the mixed one. The intro vignette still calls unequal sizes a planned future option. powerkit hasn't validated this use."}
    refs: "decision N3; docs/conventions.md, 'Superpower and unequal group sizes'"
    tier: v2
  E23:
    doc_name: "ANCOVA (incl. pre–post with a baseline covariate)"
    plain_name: "Compare groups adjusting for a covariate (e.g. the before score)"
    status: not_in_powerkit
    inputs: ["The expected (adjusted) group means and SD", "How much the covariate explains (R-squared), or its correlation with the outcome"]
    packages:
      - {name: Superpower, url: "https://cran.r-project.org/package=Superpower", what: "Analytic ANCOVA power from cell means, SD and the covariates' R-squared (ANCOVA_analytic(), power_oneway_ancova())."}
      - {name: pwrss, url: "https://cran.r-project.org/package=pwrss", what: "Analytic power for ANCOVA (Keppel and Shieh methods) and many other common tests."}
    tier: v2
  E24:
    doc_name: "Multiple regression (R² or one coefficient)"
    plain_name: "Several predictors at once, or one predictor controlling for others"
    status: not_in_powerkit
    inputs: ["R-squared, or the R-squared change for the predictor(s) of interest", "Number of predictors"]
    packages:
      - {name: Spower, url: "https://cran.r-project.org/package=Spower", what: "Simulation power for R-squared and R-squared change (p_lm.R2()) and any linear hypothesis in a regression (p_glm())."}
      - {name: pwrss, url: "https://cran.r-project.org/package=pwrss", what: "Analytic power for regression coefficients and R-squared."}
    tier: v2
  E25:
    doc_name: "One proportion against a fixed value"
    plain_name: "Compare one group's proportion with a fixed value"
    status: not_in_powerkit
    inputs: ["The expected proportion", "The fixed value"]
    packages:
      - {name: Spower, url: "https://cran.r-project.org/package=Spower", what: "Simulation power for one proportion against a constant (p_prop.test(), binomial test)."}
    tier: v2
  E26:
    doc_name: "McNemar's test (same people, yes/no); Cochran's Q"
    plain_name: "The same people, a yes/no outcome in each condition"
    status: not_in_powerkit
    no_ready_made_tool: "Cochran's Q"
    inputs: ["The expected discordant proportions"]
    packages:
      - {name: Spower, url: "https://cran.r-project.org/package=Spower", what: "Simulation power for McNemar's test (p_mcnemar.test())."}
    tier: v2
  E27:
    doc_name: "Logistic regression (yes/no outcome)"
    plain_name: "Predict a yes/no outcome"
    status: not_in_powerkit
    inputs: ["Odds ratio or regression coefficients"]
    packages:
      - {name: Spower, url: "https://cran.r-project.org/package=Spower", what: "Simulation power for generalised linear models with fixed predictors, including logistic (p_glm(family = binomial()))."}
      - {name: pwrss, url: "https://cran.r-project.org/package=pwrss", what: "Analytic power for logistic regression."}
    tier: v2
  E28:
    doc_name: "Count outcome (Poisson or negative binomial)"
    plain_name: "An outcome that counts how often something happened"
    status: not_in_powerkit
    inputs: ["The expected rate ratio"]
    packages:
      - {name: Spower, url: "https://cran.r-project.org/package=Spower", what: "Simulation power for Poisson regression (p_glm(family = poisson()))."}
      - {name: pwrss, url: "https://cran.r-project.org/package=pwrss", what: "Analytic power for Poisson regression."}
    tier: v2
  E29:
    doc_name: "Ordinal outcome (ordered categories)"
    plain_name: "An outcome in ordered categories (e.g. a single Likert item analysed as ordinal)"
    status: not_in_powerkit
    inputs: ["The expected proportion in each category", "The odds ratio between groups"]
    packages:
      - {name: Hmisc, url: "https://cran.r-project.org/package=Hmisc", what: "popower() and posamsize(): power and sample size for comparing two groups on an ordinal outcome (proportional odds)."}
      - {name: powertools, url: "https://cran.r-project.org/package=powertools", what: "propodds(): power for proportional-odds comparisons."}
    tier: v2
  E30:
    doc_name: "Moderator with three or more groups"
    plain_name: "Moderation where X or W has three or more groups"
    status: not_in_powerkit
    no_ready_made_tool: true
    inputs: ["Depends on the model you write"]
    packages:
      - {name: Spower, url: "https://cran.r-project.org/package=Spower", what: "For a custom simulation: a general Monte Carlo power engine where you write the data-generating and analysis code yourself."}
    tier: later
  E31:
    doc_name: "Three-way interaction"
    plain_name: "Does an interaction itself depend on a third variable?"
    status: not_in_powerkit
    inputs: ["Correlations among x1, x2, x3, their products and y", "Optional reliabilities"]
    packages:
      - {name: InteractionPoweR, url: "https://cran.r-project.org/package=InteractionPoweR", what: "power_interaction_3way_r2(): analytic power for three-way interactions, with reliabilities."}
    tier: v2
  E32:
    doc_name: "Moderation or mediation with a yes/no, count or categorical outcome"
    plain_name: "Moderation or mediation when the outcome isn't a score"
    status: not_in_powerkit
    no_ready_made_tool: true
    inputs: ["Depends on the model you write"]
    packages:
      - {name: Spower, url: "https://cran.r-project.org/package=Spower", what: "For a custom simulation: a general Monte Carlo power engine where you write the data-generating and analysis code yourself."}
    tier: later
  E33:
    doc_name: "Crossed participants and stimuli"
    plain_name: "Each person responds to many items or stimuli"
    status: not_in_powerkit
    inputs: ["Fixed effects", "Variance components for participants and stimuli"]
    packages:
      - {name: simr, url: "https://cran.r-project.org/package=simr", what: "Simulation power for (generalised) linear mixed models fitted with lme4, including models built without pilot data (makeLmer())."}
      - {name: mixpower, url: "https://cran.r-project.org/package=mixpower", what: "Design-first simulation power for linear and generalised linear mixed models (newer, released 2026)."}
    tier: v2
  E34:
    doc_name: "Multilevel or cluster design"
    plain_name: "People nested in groups (classes, teams, clinics)"
    status: not_in_powerkit
    inputs: ["Intraclass correlation (ICC)", "Cluster size", "The expected effect"]
    packages:
      - {name: mlmpower, url: "https://cran.r-project.org/package=mlmpower", what: "Power for multilevel models specified by variance explained, with within- and between-cluster effects and random slopes."}
      - {name: PAMLj, url: "https://pamlj.github.io/", what: "jamovi module with power for mixed models (search over the number of clusters or cluster size)."}
    tier: v2
  E35:
    doc_name: "Longitudinal: three or more occasions (growth curves, cross-lagged panels, experience sampling)"
    plain_name: "The same people measured three or more times"
    status: not_in_powerkit
    inputs: ["Depends on the model"]
    packages:
      - {name: longpower, url: "https://cran.r-project.org/package=longpower", what: "Power for longitudinal mixed models, GLS and GEE."}
      - {name: powRICLPM, url: "https://cran.r-project.org/package=powRICLPM", what: "Simulation power for random-intercept cross-lagged panel models."}
      - {name: PowerAnalysisIL, url: "https://github.com/ginettelafit/PowerAnalysisIL", what: "Shiny app for intensive longitudinal (experience sampling) designs."}
    tier: later
  E36:
    doc_name: "Equivalence test (TOST) or minimum-effect test"
    plain_name: "Show that an effect is absent or too small to matter (equivalence, or non-inferiority)"
    status: not_in_powerkit
    inputs: ["Equivalence bounds", "The expected effect"]
    packages:
      - {name: TOSTER, url: "https://cran.r-project.org/package=TOSTER", what: "Power for equivalence tests (TOST) for t-tests, correlations, proportions and F tests."}
    tier: v2
  E37:
    doc_name: "CFA, SEM model fit, measurement invariance"
    plain_name: "Check that a model or questionnaire structure fits"
    status: not_in_powerkit
    inputs: ["RMSEA or model parameters"]
    packages:
      - {name: semPower, url: "https://cran.r-project.org/package=semPower", what: "A priori, post hoc and compromise power for SEM, including CFA, measurement invariance and RMSEA-based fit."}
    # Maintainer decision on flag F7 (16 October 2026): IRT users reach this
    # card through Q1's "a questionnaire structure" answer.
    card_points: ["This card is about confirmatory factor analysis (CFA) and structural equation models (SEM). Item response theory (IRT) designs aren't covered."]
    tier: later
  E38:
    doc_name: "PROCESS models 8, 58, 59"
    plain_name: "Moderated mediation where W changes both links, or the direct link too"
    status: not_in_powerkit
    inputs: ["Standardised paths"]
    packages:
      - {name: power4mome, url: "https://cran.r-project.org/package=power4mome", what: "Power for any mediation or moderated mediation model written in lavaan syntax (no ready-made template for these models)."}
    tier: v2
  E39:
    doc_name: "Mediation with a yes/no or categorical mediator"
    plain_name: "Mediation when a mediator isn't a score"
    status: not_in_powerkit
    no_ready_made_tool: true
    inputs: ["Depends on the model you write"]
    packages:
      - {name: Spower, url: "https://cran.r-project.org/package=Spower", what: "For a custom simulation: a general Monte Carlo power engine where you write the data-generating and analysis code yourself."}
    tier: later
  E40:
    doc_name: "Moderated mediation with two or more mediators"
    plain_name: "Moderated mediation with several mediators"
    status: not_in_powerkit
    inputs: ["Standardised paths"]
    packages:
      - {name: power4mome, url: "https://cran.r-project.org/package=power4mome", what: "Power for any moderated mediation model written in lavaan syntax (no ready-made template)."}
    tier: later
  E41:
    doc_name: "Within-person, repeated-measures or multilevel correlation, moderation or mediation"
    plain_name: "Relationships measured within people, or in nested data"
    status: not_in_powerkit
    inputs: ["Depends on the model"]
    packages:
      - {name: mlmpower, url: "https://cran.r-project.org/package=mlmpower", what: "Power for multilevel models (moderation, cross-level effects). No tool found for within-person mediation."}
      - {name: simr, url: "https://cran.r-project.org/package=simr", what: "Simulation power for mixed models fitted with lme4."}
    tier: later
  E42:
    doc_name: "Mediation with a condition of three or more groups (multi-category X)"
    plain_name: "Mediation where X has three or more conditions or groups"
    status: not_in_powerkit
    five_tools: not covered
    no_ready_made_tool: true
    inputs: ["Depends on the model you write (relative indirect effects for each comparison with a reference group)"]
    packages:
      - {name: Spower, url: "https://cran.r-project.org/package=Spower", what: "For a custom simulation: a general Monte Carlo power engine where you write the data-generating and analysis code yourself."}
    tier: later
  E43:
    doc_name: "Time-to-event (survival) outcome"
    plain_name: "An outcome that is the time until something happens"
    status: not_in_powerkit
    generic: true
    established_tools: true
    card_text: "powerkit doesn't cover outcomes that are the time until something happens (survival or time-to-event analysis), where some people may not reach the event before the study ends."
    tier: later
  E44:
    doc_name: "Paired or dyadic data (pairs of people whose scores are related)"
    plain_name: "Data that come in pairs, such as couples or a parent and child"
    status: not_in_powerkit
    generic: true
    established_tools: true
    card_text: "powerkit doesn't cover data from pairs of people whose scores are related (dyadic data), such as couples or a parent and child. Treating the two members as independent people can overstate or understate power, depending on whether the predictor varies between dyads (for example, couples assigned to different conditions) or within dyads (for example, each partner's own stress), so dyadic methods are needed."
    tier: later
  E45:
    doc_name: "Many measurements over time: segmented regression or interrupted time series"
    plain_name: "A trend over time that may change at a known point"
    status: not_in_powerkit
    no_ready_made_tool: true
    # Shown instead of no_ready_made_tool_text (maintainer decision, 17 October
    # 2026): a package for the known-breakpoint case was released in 2026.
    # Naming it on the card waits for open question 18; see card-sources.md.
    status_text: "A recently released package addresses the known-breakpoint case; powerkit hasn't checked it."
    from_coverage: false
    card_points:
      - "With a known breakpoint (for example, the date an intervention started), the change in slope can be treated as an added predictor in a regression (a segmented regression)."
      - "With a breakpoint that is estimated from the data, a custom simulation is needed."
      - "Autocorrelation makes standard power calculations wrong: too optimistic when it's positive, too pessimistic when it's negative."
      - "A before/after comparison of means (a t-test) asks a different question: whether the average level differs, not whether the trend changes."
    inputs: ["Depends on the model you write: the number and spacing of measurements, the breakpoint, the expected change in level and slope, and the autocorrelation"]
    packages:
      - {name: Spower, url: "https://cran.r-project.org/package=Spower", what: "For a custom simulation: a general Monte Carlo power engine where you write the data-generating and analysis code yourself."}
    tier: later
  E46:
    doc_name: "Precision planning (a target confidence-interval width)"
    plain_name: "Estimate an effect precisely (plan for a confidence-interval width)"
    status: not_in_powerkit
    generic: true
    established_tools: true
    card_text: "Planning a sample size for a target confidence-interval width is a different calculation from power. powerkit doesn't do it yet."
    tier: later
  E47:
    doc_name: "Yes/no outcome with two or more crossed factors (factorial logistic regression)"
    plain_name: "Two or more factors crossed, with a yes/no outcome"
    status: not_in_powerkit
    generic: true
    established_tools: true
    card_text: "powerkit doesn't cover designs with two or more crossed factors and a yes/no outcome yet (for example, whether people book a flu jab after a gain or loss message from a doctor or a friend)."
    tier: later
  E-unsure:
    doc_name: "No matching design (safety net)"
    plain_name: "None of these fit, or I'm not sure"
    status: not_in_powerkit
    generic: true
    card_heading: "powerkit can't advise on this design yet."
    card_text: "We suggest discussing it with a statistician."
    tier: none
  E-bayes:
    never_screened_out: true
    doc_name: "Bayes factor design (any design)"
    plain_name: "Plan a study analysed with Bayes factors"
    status: not_in_powerkit
    inputs: ["Prior and expected effect"]
    packages:
      - {name: bfpwr, url: "https://cran.r-project.org/package=bfpwr", what: "Analytic power and sample size for z-test, t-test and normal-moment-prior Bayes factors."}
      - {name: BFDA, url: "https://github.com/nicebread/BFDA", what: "Bayes factor design analysis by simulation, fixed-N and sequential (GitHub, not on CRAN)."}
    tier: later

# ---------------------------------------------------------------------------
# "Plan my whole study" (decision-tree.md 4.1). Variables are defined once;
# each analysis the user ticks is routed to an end point by its `rules`
# (first matching rule wins). `when` keys refer to the variable answers
# below; a list means "any of these". A rule may `ask` a follow-up
# question (the same question the tree would ask) before choosing.
# ---------------------------------------------------------------------------
guided:
  intro: "Describe your study's variables once. Then tick the analyses you plan and mark which ones the study must be powered for."
  scope_note: "This route covers different people, each measured once, or measured twice (before and after, or in two conditions). The screening questions have already checked this."
  # Screening answers the guided rules can use (they are added to the
  # variable answers as `times`).
  context: {times: [once, twice]}
  many_conditions_note: "The guided route covers people measured once, or before and after. For three or more conditions per person, continue in 'Help me choose', which keeps your screening answers."
  variables:
    - id: x
      label: "Main predictor (X)"
      options: {cond2: "A condition with two groups (or two existing groups)", within2: "The same people in two conditions, or before and after", cond3: "A condition with three or more groups", score: "A measured score", notsure: "None of these fit / I'm not sure"}
      # Options shown only for some screening answers.
      option_when: {within2: {times: twice}}
    - id: outcome
      label: "Outcome (Y)"
      screen_key: outcome
      # Which options each screening answer allows (plus the safety net).
      screen_map: {score: [score], yesno: [yesno, categories]}
      options: {score: "A score or scale", yesno: "Yes/no", categories: "One of several categories", count: "A count", ordinal: "Ordered categories", notsure: "None of these fit / I'm not sure"}
    - id: mediators
      label: "Mediators (go-betweens)"
      options: {none: "None", one: "One (a score)", several: "Two or more (scores)", notscore: "At least one that isn't a score", notsure: "None of these fit / I'm not sure"}
    - id: moderator
      label: "Moderator (W)"
      options: {none: "None", score: "A measured score", two: "Two groups or conditions", three: "Three or more groups", notsure: "None of these fit / I'm not sure"}
    - id: covariate
      label: "Covariates"
      options: {none: "None", baseline: "A baseline (before) measure of the outcome", other: "Other covariates", notsure: "None of these fit / I'm not sure"}
      # A baseline is a second measurement of the outcome, so it needs S3 "Twice".
      option_when: {baseline: {times: twice}}
  analyses:
    - id: compare
      label: "The effect of X on the outcome"
      rules:
        - {when: {x: within2, outcome: score}, endpoint: E3}
        - {when: {x: within2, outcome: [yesno, categories]}, endpoint: E26}
        - {when: {x: [cond2, cond3], outcome: [yesno, categories], times: twice}, endpoint: E-unsure}
        - {when: {x: cond3, times: twice, outcome: score}, endpoint: E21}
        - {when: {x: score, times: twice, covariate: none}, endpoint: E41}
        - {when: {outcome: categories, x: [cond2, cond3]}, endpoint: E6}
        - {when: {outcome: categories, x: score}, endpoint: E-unsure}
        - {when: {outcome: yesno, x: cond2}, endpoint: E5}
        - {when: {outcome: yesno}, endpoint: E27}
        - {when: {outcome: count}, endpoint: E28}
        - {when: {outcome: ordinal}, endpoint: E29}
        - when: {x: cond2, covariate: baseline}
          ask:
            doc_id: PP2
            text: "With a baseline measure: which analysis do you plan to use?"
            options:
              - {label: "ANCOVA: the outcome adjusting for the baseline", endpoint: E23}
              - {label: "The 2 x 2 mixed ANOVA interaction (group x time)", endpoint: E8}
        - when: {x: cond2, times: twice}
          ask:
            doc_id: PP2
            text: "Each group is measured twice: which analysis do you plan to use?"
            options:
              - {label: "ANCOVA: the second measurement adjusting for the first", endpoint: E23}
              - {label: "The 2 x 2 mixed ANOVA interaction (group x time)", endpoint: E8}
        - {when: {x: cond2, covariate: other}, endpoint: E23}
        - {when: {x: cond2}, endpoint: E2}
        - {when: {x: cond3}, endpoint: E18}
        - {when: {x: score, covariate: [baseline, other]}, endpoint: E24}
        - {when: {x: score}, endpoint: E4}
    - id: moderation
      label: "Whether the effect of X depends on the moderator (X x W)"
      requires: {moderator: [score, two, three]}
      rules:
        - {when: {times: twice}, endpoint: E41}
        - {when: {x: within2}, endpoint: E41}
        - {when: {outcome: yesno, x: cond2, moderator: two}, endpoint: E47}
        - {when: {outcome: [yesno, categories, count, ordinal]}, endpoint: E32}
        - {when: {moderator: three}, endpoint: E30}
        - {when: {x: cond3}, endpoint: E30}
        - {when: {x: cond2, moderator: two}, endpoint: E7}
        - {when: {x: cond2, moderator: score}, endpoint: E15}
        - {when: {x: score, moderator: two}, endpoint: E15}
        - {when: {x: score, moderator: score}, endpoint: E9}
    - id: mediation
      label: "Whether X affects the outcome through the mediator(s)"
      requires: {mediators: [one, several, notscore]}
      rules:
        - {when: {times: twice}, endpoint: E41}
        - {when: {x: within2}, endpoint: E41}
        - {when: {outcome: [yesno, categories, count, ordinal]}, endpoint: E32}
        - {when: {mediators: notscore}, endpoint: E39}
        - {when: {x: cond3}, endpoint: E42}
        - {when: {x: cond2}, endpoint: E16}
        - {when: {x: score, mediators: one}, endpoint: E10}
        - when: {x: score, mediators: several}
          ask:
            doc_id: ME3
            text: "How do the mediators connect?"
            options:
              - {label: "Side by side: X affects each one separately", endpoint: E11}
              - {label: "In a chain: X affects the first, which affects the next", endpoint: E12}
    - id: modmed
      label: "Whether the mediation depends on the moderator (moderated mediation)"
      requires: {mediators: [one, several, notscore], moderator: [score, two, three]}
      rules:
        - {when: {times: twice}, endpoint: E41}
        - {when: {x: within2}, endpoint: E41}
        - {when: {outcome: [yesno, categories, count, ordinal]}, endpoint: E32}
        - {when: {mediators: notscore}, endpoint: E39}
        - {when: {mediators: several}, endpoint: E40}
        - when: {x: cond3}
          unmapped: "Moderated mediation with a condition of three or more groups has no end point in decision-tree.md."
          package: {name: power4mome, url: "https://cran.r-project.org/package=power4mome", what: "Power for any moderated mediation model written in lavaan syntax (no ready-made template)."}
        - {when: {moderator: three}, endpoint: E40}
        - {when: {x: cond2}, endpoint: E17}
        - {when: {moderator: two}, endpoint: E17}
        - when: {x: score, moderator: score, mediators: one}
          ask:
            doc_id: MM4
            text: "Which link depends on the moderator?"
            options:
              - {label: "The link from X to the mediator", endpoint: E13}
              - {label: "The link from the mediator to the outcome", endpoint: E14}
              - {label: "Both links, or X to the mediator and the direct link", endpoint: E38}
  combination_rules:
    - id: each
      label: "Each analysis stands alone"
      note: "Each analysis is a separate claim, tested at its own alpha. No correction."
    - id: all
      label: "All must be significant for the claim"
      note: "No alpha correction is needed (intersection-union principle). The combined N gives each test its target power on its own; joint power is lower."
    - id: any
      label: "Any one significant result supports the claim"
      note: "This inflates the false-positive rate, so it needs an alpha correction (e.g. Bonferroni: alpha / k for k primary analyses), which raises the required N."
  placeholders:
    combined_n: "Combined N for the primary analyses: calculated here once the engine is connected. It will be the largest required N among the primary analyses that run, with the analysis that drives it named."
    consistency: "Consistency check: values will be compared here once the engine is connected."
  # Relationships that several analyses share, for the consistency check
  # (decision-tree.md 4.2). The plan lists the ticked analyses that share each.
  shared_relationships:
    - id: x_y
      label: "the effect of X on the outcome"
      in: [compare, moderation, mediation]
      note: "In mediation this is the total effect (indirect plus direct)."
    - id: x_m
      label: "the effect of X on the mediator"
      in: [mediation, modmed]

# ---------------------------------------------------------------------------
# Glossary: a one-line plain-English hint for each technical term in the
# cards' "What you would enter" lists, shown beside the input. `pattern` is
# a case-insensitive (Perl) regular expression that finds the term. Hints
# say what a term means; they never say what value to choose (where effect
# sizes come from is an open judgement call, 3.2). docs/glossary.md lists
# the same terms; a test keeps the two in step.
# ---------------------------------------------------------------------------
glossary:
  - {term: "Cohen's d", pattern: "Cohen's d", hint: "A difference between two averages, measured in standard deviations: 0.5 means the averages are half a standard deviation apart."}
  - {term: "d_z", pattern: "\\bd_z\\b", hint: "The average change within people (for example, after minus before), divided by how much that change varies from person to person."}
  - {term: "SD (standard deviation)", pattern: "\\bSDs?\\b", hint: "How spread out the scores are around their average."}
  - {term: "pooled SD", pattern: "pooled SD", hint: "The two groups' standard deviations combined into one, weighted by the groups' sizes."}
  - {term: "SD units", pattern: "SD units", hint: "Differences expressed in standard deviations rather than in the outcome's own units (raw)."}
  - {term: "Student's or Welch's test", pattern: "Student's or Welch's", hint: "Two versions of the t-test: Student's assumes the two groups' scores are equally spread out; Welch's doesn't."}
  - {term: "correlation (r)", pattern: "(?<!intraclass )\\bcorrelations?\\b", hint: "A number from -1 to 1 for how closely two measures go up and down together; 0 means no straight-line relationship."}
  - {term: "repeated measurements", pattern: "repeated[- ]measure(ment)?s|between conditions", hint: "The same people measured more than once (for example, before and after, or in each condition); their scores on different occasions usually go together."}
  - {term: "cell means", pattern: "cell means|four expected means", hint: "The expected average in each combination of the factors, such as praise with a hard task (each combination is a 'cell')."}
  - {term: "factor and levels", pattern: "(?<!Bayes )\\bfactors?\\b", hint: "A factor is something you vary or compare (for example, feedback); its levels are its versions (for example, praise and none)."}
  - {term: "between factor and within factor", pattern: "between factor|within factor", hint: "A between factor has different people at each level; a within factor has the same people at every level."}
  - {term: "interaction", pattern: "\\binteractions?\\b", hint: "Whether the effect of one factor or variable depends on the level of another."}
  - {term: "reliability", pattern: "\\breliabilit(y|ies)\\b", hint: "How consistently a measure gives the same result; 1 means no measurement error."}
  - {term: "standardised paths", pattern: "standardised paths|fully standardised", hint: "The strength of each arrow in the model (for example, X to M), expressed in standard deviations so that arrows between differently scaled measures can be compared."}
  - {term: "Monte Carlo draws per CI", pattern: "Monte Carlo draws", hint: "How many random draws are used to build each confidence interval for the indirect effect; more draws give a more stable interval."}
  - {term: "residuals", pattern: "residuals", hint: "The part of each mediator that X doesn't explain; their correlation says how much the mediators overlap beyond X."}
  - {term: "indirect path", pattern: "indirect (path|effect)", hint: "The route from X to the outcome through a mediator (X to M to Y)."}
  - {term: "contrast weights", pattern: "contrast weights", hint: "Numbers that say which groups a specific comparison sets against which (for example, 1, 1 and -2 compare the first two groups together with the third)."}
  - {term: "adjusted group means", pattern: "adjusted", hint: "Group averages after taking the covariate into account."}
  - {term: "covariate", pattern: "covariate", hint: "A variable measured alongside the outcome (for example, a before score) that the analysis takes into account."}
  - {term: "R-squared", pattern: "R-squared", hint: "The share of the differences in the outcome that the predictors explain, from 0 to 1."}
  - {term: "R-squared change", pattern: "R-squared change", hint: "How much R-squared goes up when the predictor or predictors of interest are added."}
  - {term: "discordant proportions", pattern: "discordant", hint: "Among people measured twice, the share who change from yes to no and the share who change from no to yes."}
  - {term: "odds ratio", pattern: "odds ratio", hint: "How many times higher the odds of 'yes' (the chance of yes divided by the chance of no) are in one group than in another; 1 means no difference."}
  - {term: "regression coefficients", pattern: "regression coefficients", hint: "How much the outcome is expected to change for a one-unit change in a predictor."}
  - {term: "rate ratio", pattern: "rate ratio", hint: "How many times higher the average count is in one group than in another; 1 means no difference."}
  - {term: "product terms", pattern: "products", hint: "Two predictors multiplied together (for example, x1 times x2), which is how a regression represents an interaction."}
  - {term: "fixed effects", pattern: "fixed effects", hint: "The effects you're testing (for example, of a condition), taken to be the same for everyone."}
  - {term: "variance components", pattern: "variance components", hint: "How much scores vary because some participants, and some stimuli, score higher or lower than others overall."}
  - {term: "intraclass correlation (ICC)", pattern: "intraclass correlation|\\bICC\\b", hint: "How similar people in the same group (for example, the same class) are, compared with people in different groups, from 0 to 1."}
  - {term: "cluster size", pattern: "cluster size", hint: "How many people there are in each group (for example, pupils per class)."}
  - {term: "equivalence bounds", pattern: "equivalence bounds", hint: "The smallest difference you would care about, in each direction; a difference inside them counts as negligible."}
  - {term: "RMSEA", pattern: "\\bRMSEA\\b", hint: "A number summarising how far a model's predictions are from the data, allowing for the model's complexity; smaller means a closer fit."}
  - {term: "relative indirect effects", pattern: "relative indirect effects", hint: "With three or more groups, the indirect effect for each group compared with one chosen reference group."}
  - {term: "breakpoint", pattern: "breakpoint", hint: "The point in time at which the trend may change (for example, when an intervention started)."}
  - {term: "level and slope", pattern: "level and slope", hint: "The level is how high the trend is; the slope is how fast it rises or falls."}
  - {term: "autocorrelation", pattern: "autocorrelation", hint: "How much each measurement depends on the ones just before it."}
  - {term: "mediator", pattern: "\\bmediators?('s|s')?\\b", hint: "A variable through which X affects the outcome (a go-between)."}
  - {term: "predictor", pattern: "\\bpredictors?\\b", hint: "A variable used to explain or predict the outcome."}
  - {term: "confidence interval (CI)", pattern: "\\bCI\\b", hint: "A range of plausible values for an effect, estimated from the data."}
  - {term: "model parameters", pattern: "model parameters", hint: "The numbers that define a model, such as the strength of each path."}
  - {term: "prior", pattern: "\\bprior\\b", hint: "The range of effect sizes you consider plausible before seeing the data, written as a distribution."}
  # Terms in the cards' standard names and backend lines (16 October 2026).
  # Sources: docs/card-sources.md.
  - {term: "omnibus test", pattern: "\\bomnibus\\b", hint: "A single overall test of whether there are any differences among all the groups or conditions at once; it doesn't say which ones differ."}
  - {term: "ANOVA", pattern: "\\bANOVA\\b", hint: "Analysis of variance: a test of whether the average outcome differs across the levels of one or more factors."}
  - {term: "main effect", pattern: "\\bmain effects?\\b", hint: "The effect of one factor averaged over the levels of the other factor or factors."}
  - {term: "between-participants and within-participants", pattern: "\\b(?:between|within)-participants\\b", hint: "Between-participants means different people take part at each level of a factor; within-participants means the same people take part at every level."}
  - {term: "mixed design", pattern: "\\bmixed(?= ANOVA)", hint: "A design with at least one factor that compares different people (between-participants) and at least one that measures the same people repeatedly (within-participants), such as group × time."}
  - {term: "ANCOVA", pattern: "\\bANCOVA\\b", hint: "Analysis of covariance: an ANOVA that also takes into account one or more continuous measured variables (covariates), such as a baseline score."}
  - {term: "planned contrast", pattern: "\\bplanned contrasts?\\b", hint: "One specific comparison of group averages (for example, the average of groups 1 and 2 against group 3), planned in advance rather than chosen after seeing the results."}
  - {term: "z test (two proportions)", pattern: "\\bz test\\b", hint: "A test of whether the share of 'yes' differs between two groups, based on the normal (bell-curve) approximation to the counts."}
  - {term: "continuity correction", pattern: "\\bcontinuity correction\\b", hint: "A slight adjustment to the normal approximation for counts that moves the observed difference toward zero before testing."}
  - {term: "chi-square test of independence", pattern: "\\bchi-square test of independence\\b", hint: "A test of whether two categorical variables (for example, group and a yes/no answer) are related, using a table of counts."}
  - {term: "McNemar's test", pattern: "\\bMcNemar'?s test\\b", hint: "A test of whether the share of 'yes' answers differs between two yes/no measurements on the same people (or on matched pairs)."}
  - {term: "Cochran's Q", pattern: "\\bCochran'?s Q\\b", hint: "An extension of McNemar's test to three or more yes/no measurements on the same people."}
  - {term: "logistic regression", pattern: "\\blogistic regression\\b", hint: "A regression for a yes/no outcome: it models the log of the odds of 'yes' from the predictors."}
  - {term: "Poisson or negative binomial", pattern: "\\bPoisson\\b|\\bnegative binomial\\b", hint: "Regressions for count outcomes (how many times something happens); Poisson assumes the counts vary as much as their average, while negative binomial allows them to vary more than that."}
  - {term: "ordinal outcome", pattern: "\\bordinal\\b", hint: "An outcome whose categories have a natural order (for example, never, sometimes, often) but where the steps between neighbouring categories need not be equal."}
  - {term: "PROCESS model number", pattern: "\\bPROCESS models? [0-9]+(?:, [0-9]+)*", hint: "PROCESS is Andrew Hayes's tool for mediation and moderation analysis; each model number picks one set arrangement of predictor, mediators and moderators, as numbered in Appendix A of Hayes's book (model 4 is mediation)."}
  - {term: "index of moderated mediation", pattern: "\\bindex of moderated mediation\\b", hint: "How much the indirect effect (X to mediator to outcome) changes when the moderator goes up by one unit."}
  - {term: "Monte Carlo CI", pattern: "\\bMonte Carlo(?= CI\\b)", hint: "A confidence interval built by simulating many sets of the model's estimates from their estimated uncertainty, computing the effect for each set, and keeping the middle 95% of the results."}
  - {term: "ANOVA_exact() (exact)", pattern: "\\bANOVA_exact\\(\\)", hint: "Superpower's quick method: it builds one data set whose means, standard deviations and correlations exactly match the ones you enter, analyses it once, and works out power from that result instead of simulating many data sets."}
  - {term: "simulation (ANOVA_power())", pattern: "(?<!repeated )\\bsimulation\\b", hint: "Estimating power by generating many random data sets from the design and counting how often the test comes out significant."}
  - {term: "brackets N (power_interaction_r2())", pattern: "\\bpower_interaction_r2\\(\\) only brackets N\\b", hint: "InteractionPoweR's power_interaction_r2() is a quick formula-based power calculation; powerkit uses it only to narrow down the range of sample sizes to search, and the reported power comes from the simulation in power_interaction()."}
  - {term: "k.x1 / k.x2 = 2", pattern: "\\bk\\.x1 / k\\.x2 = 2\\b", hint: "Settings that tell InteractionPoweR's simulation to give x1 or x2 only two possible values, so it becomes a yes/no variable."}
  - {term: "rbinary_rs() (x_fun)", pattern: "(?:\\bx_fun = )?\\brbinary_rs\\(\\)", hint: "Tells power4mome to generate X as a yes/no variable (0 or 1, with a chosen chance of 1) instead of from a normal distribution; the 0/1 values are then rescaled to a chosen mean and standard deviation."}
  - {term: "multilevel or cluster design", pattern: "\\bmultilevel\\b|\\bcluster design\\b", hint: "A design in which people are grouped (for example, pupils within classes, or patients within doctors), so people in the same group tend to be more alike than people in different groups."}
  - {term: "growth curves", pattern: "\\bgrowth curves?\\b", hint: "Models of how each person's scores change over repeated occasions (their trajectory, for example a straight line up or down), and of the average trajectory across people."}
  - {term: "cross-lagged panel", pattern: "\\bcross-lagged panels?\\b", hint: "A model for two measures (X and Y) recorded at several time points that estimates how each one predicts the other at the next time point, alongside how stable each is over time."}
  - {term: "experience sampling", pattern: "\\bexperience sampling\\b", hint: "An intensive longitudinal design in which participants answer a questionnaire each time they are prompted (a 'beep'), several times within a day."}
  - {term: "CFA", pattern: "\\bCFA\\b", hint: "Confirmatory factor analysis: a model in which answers to many questionnaire items are explained by fewer underlying, unobserved traits (factors) that you specify."}
  - {term: "SEM and model fit", pattern: "\\bSEM model fit\\b|\\bSEM\\b", hint: "Structural equation modelling: a family of models that combines regressions among variables with unobserved (latent) variables measured by several items; model fit is how closely the relationships the model implies match those in the data."}
  - {term: "measurement invariance", pattern: "\\bmeasurement invariance\\b", hint: "Whether a questionnaire measures the same underlying trait in the same way in different groups (or on different occasions), checked by requiring parts of the measurement model, such as item loadings, to be equal across them."}
  - {term: "equivalence test (TOST)", pattern: "\\bequivalence test(?: \\(TOST\\))?|\\bTOST\\b", hint: "A test that aims to show there is no meaningful effect: two one-sided tests (TOST) check that the effect lies above the lower equivalence bound and below the upper one."}
  - {term: "minimum-effect test", pattern: "\\bminimum-effect test\\b|\\bminimal effects? test(?:ing)?\\b", hint: "The reverse of an equivalence test: it aims to show that an effect goes beyond a chosen minimal threshold."}
  - {term: "precision planning", pattern: "\\bprecision planning\\b", hint: "Choosing the sample size so that the confidence interval around the estimate is expected to come out no wider than a target width."}
  - {term: "Bayes factor", pattern: "\\bBayes factors?\\b", hint: "A ratio that says how strongly the data support one hypothesis compared with a competing one (often 'no effect'), used instead of a p-value."}

