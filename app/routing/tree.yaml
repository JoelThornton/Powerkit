    card_points:
      - "Three questions about a measure: whether raters, or the same people on two occasions, give similar scores (the intraclass correlation, ICC); whether a scale's items are consistent (Cronbach's alpha); and whether raters choose the same category (kappa)."
      - "Each tests the value against one you name, such as an ICC above 0.6 or an alpha above 0.7, not against zero: showing only that agreement beats chance is rarely the question."
      - "The ICC is for a one-way random-effects model, with the same number of ratings for every person. Cronbach's alpha uses Bonett and Wright's test. Kappa takes 2 to 6 raters and 2 to 5 categories, and is two-sided."
      - "To plan for a precise estimate of an ICC rather than a test, use the precision card. Not calculated here yet: McDonald's omega, Krippendorff's alpha, and ICCs for two-way models."
