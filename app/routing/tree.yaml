  E58:
    doc_name: "Latent profile or latent class analysis (how many types of people, and who belongs to which)"
    technical_name: "Latent profile and latent class analysis"
    plain_name: "Finding types or profiles of people (latent profile or latent class analysis)"
    search_words: "latent profile analysis lpa latent class analysis lca mixture model clusters types subgroups profiles class enumeration bic mclust person-centred"
    template: "mixture / lpa"
    backend: "Spower: powerkit's experiment around mclust (latent profile models with equal variances and local independence, fitted with 1 to k + 1 profiles, the BIC choosing among them), simulated"
    method: "Simulation"
    status: runs_validation_in_progress
    validation: {file: test-validation-lpa.R, note: "Agrees with the same model fitted by an expectation-maximisation algorithm written separately, with the BIC computed by hand, in three cases from a clear to a hard enumeration. Not yet checked against a published simulation table."}
    card_points:
      - "The question here is not a significance test: it is whether your sample can find the right number of profiles (class enumeration). powerkit simulates studies from the profiles you expect, fits latent profile models with 1 up to one more than that number of profiles (mclust), and counts how often the BIC chooses the right number: the study's chance of finding it."
      - "Separation between profiles matters more than sample size. In Tein, Coxe and Cham's (2013) simulations, no sample size up to 1,000 reliably found the right number of profiles when profiles differed by a small or medium amount on each indicator (Cohen's d of .2 or .5); at d = .8, it took at least 500 people and 10 or more indicators; at d = 1.5, 250 people were enough for most criteria."
      - "As a working range, Nylund-Gibson and Choi (2018) suggest that about 300 to 1,000 people is where the usual criteria work adequately; the median sample in published latent profile studies was 377 in Tein and colleagues' review and 494 in Spurk and colleagues' (2020). A small profile needs more people: with a class of 5% of 200 people, its estimates were poor (Nylund, Asparouhov and Muthén, 2007)."
      - "powerkit uses the BIC, which did best with the bootstrap likelihood ratio test in these simulations (Nylund, Asparouhov and Muthén, 2007; Tein, Coxe and Cham, 2013); the bootstrap test is too slow to simulate here. Entropy describes how cleanly people are classified but is not a way to choose the number of profiles."
      - "Assumes score indicators, profiles that are equally far apart on every indicator, the same spread within each profile and indicators unrelated within a profile (the usual latent profile model). Yes/no indicators (latent class analysis) and other shapes are not covered yet."
    inputs: ["The scores the profiles are formed from", "The profiles you expect"]
    tier: v2
    alternatives: ["the bootstrap likelihood ratio test, which needs many model fits per study (Mplus's Monte Carlo facility, or tidyLPA)", "a cluster analysis, such as k-means, which doesn't model profiles statistically"]
  E74:
    doc_name: "Random-intercept cross-lagged panel model (RI-CLPM)"
    technical_name: "Random-intercept cross-lagged panel model (RI-CLPM)"
    plain_name: "Whether two scores measured over time predict each other's later changes, within people"
    search_words: "cross-lagged panel model riclpm ri-clpm random intercept cross lagged clpm longitudinal panel waves reciprocal effects within-person lagged effects autoregressive hamaker sem"
    template: "panel / riclpm"
    backend: "Spower: powerkit's experiment around powRICLPM's powRICLPM() (each study simulated and the model fitted by lavaan's maximum likelihood; the lagged effect's Wald z test), simulated"
    method: "Simulation"
    status: runs_validation_in_progress
    validation: {file: test-validation-riclpm.R, note: "Agrees with a simulation written separately (data drawn in base R, the model written out in lavaan syntax) in three cases, with no allowance beyond Monte Carlo error. Not yet checked against a published example."}
    card_points:
      - "Two scores, X and Y, measured on the same people at three or more waves. The random-intercept cross-lagged panel model (Hamaker, Kuiper and Grasman, 2015) separates each person's stable level on each score from their ups and downs around it, and asks whether a person's X being higher than usual predicts their Y being higher than usual at the next wave (the cross-lagged effect), and the other way round."
      - "You give the lagged effects within people (standardised), how much of each score is stable between people, and how X and Y go together. powRICLPM (Mulder, 2023) simulates studies like yours and fits the model, and powerkit counts how often the effect you test is significant."
      - "Small lagged effects need many people. A quick preview runs here; the full run of power takes a couple of minutes, and a required sample size comes as an R script to run on your computer."
      - "Not covered yet: more than two scores, measurement error estimated in the model (the STARTS model), and the traditional cross-lagged panel model without random intercepts, which mixes stable differences between people with within-person effects."
    inputs: ["The two scores and the waves", "The effect you want to test", "The lagged effects within people (standardised)", "How people differ, and how X and Y go together"]
    tier: v2
    alternatives: ["the traditional cross-lagged panel model, which doesn't separate stable differences between people", "a growth-curve model of each score, if the question is about trajectories rather than lagged effects", "a dynamic structural equation model, for intensive longitudinal data with many occasions"]
  E73:
    doc_name: "Exploratory factor analysis (EFA): recovering the factors"
    technical_name: "Exploratory factor analysis (EFA)"
    plain_name: "Whether an exploratory factor analysis will recover the factors you expect"
    search_words: "exploratory factor analysis efa factor loadings communality factor structure questionnaire scale development principal axis minres oblimin promax congruence tucker sample size subjects per item"
    template: "factor_analysis / efa"
    backend: "Spower: powerkit's experiment around psych's fa() (minimum residual, oblimin rotation), every factor's loadings recovered with Tucker's congruence at the level asked, simulated"
    method: "Simulation"
    status: runs_validation_in_progress
    validation: {file: test-validation-efa.R, note: "Agrees with fits by base R's factanal() (maximum likelihood) on data drawn separately, with congruence and matching computed separately, within 0.03 in three cases. Not yet checked against a published table."}
    card_points:
      - "An exploratory factor analysis has no significance test to power: the question is whether your sample is large enough to recover the factors' loadings. powerkit simulates studies from the factor structure you expect, fits the factor analysis researchers usually run (psych's fa(), minimum residual with oblimin rotation), and counts how often every factor's loadings match the true ones (Tucker's congruence of at least .95 by default)."
      - "The sample size needed depends on how strongly the items measure their factors (the communalities, the loadings squared) and how many items each factor has, not on a fixed ratio of people to items (MacCallum, Widaman, Zhang and Hong, 1999): strong loadings and four or more items per factor can need few people; weak loadings need many."
      - "Assumes each item loads on one factor (simple structure) with the same loading, and that you fit the right number of factors. Choosing the number of factors (parallel analysis, for example) and cross-loadings are not covered yet."
    inputs: ["The questionnaire and its factors", "How strongly the items measure their factors", "What counts as recovering the factors"]
    tier: v2
    alternatives: ["a confirmatory factor analysis, when you know which item belongs to which factor (the latent-variable card)", "principal components analysis, which summarises the items rather than modelling factors"]
  E71:
    doc_name: "Differential item functioning (DIF) in a 2PL IRT model, two groups"
