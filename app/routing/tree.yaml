# powerkit routing: the single source of truth for the app's routes,
# questions and end points.
#
# Built from docs/decision-tree.md (structure, end points, judgement calls,
# open questions) and docs/design-finder.md (card wording). Everything here
# is a proposal for the maintainer to confirm (decision-tree.md, top).
#
# app/routing/tests/testthat/test-docs-match.R checks that the end points
# and question IDs here match decision-tree.md, so the two can't drift
# apart. If you change one, change the other.
#
# Routing only: nothing in this file is used to calculate anything.

version: 1
source_docs:
  decision_tree: docs/decision-tree.md
  design_finder: docs/design-finder.md
  coverage: docs/coverage.md

links:
  validation_log: https://github.com/JoelThornton/Powerkit/blob/main/docs/validation-log.md
  coverage: https://github.com/JoelThornton/Powerkit/blob/main/docs/coverage.md
  decision_tree: https://github.com/JoelThornton/Powerkit/blob/main/docs/decision-tree.md
  tests_folder: https://github.com/JoelThornton/Powerkit/tree/main/engine/tests/testthat

# The Feedback tab (R/feedback.R): where messages go. Send stores a message
# in the feedback database (a Supabase project; the key is its publishable
# key, which is meant to be public: it can only call
# send_powerkit_feedback(), never read the messages). The tab also offers a
# GitHub issue and copying the message. An email button appears when an
# address is set here or in POWERKIT_FEEDBACK_EMAIL. The database settings
# can also come from POWERKIT_FEEDBACK_URL and POWERKIT_FEEDBACK_KEY.
feedback:
  database_url: https://tberlvceqqspgwlfzisy.supabase.co
  database_key: sb_publishable_MWscSX55HngqhhwXVJ337w_WczvUbz9
  issues_url: https://github.com/JoelThornton/Powerkit/issues/new
  email: null

banner: "Prototype, still being checked. Most common analyses calculate here: t-tests, correlations, ANOVA (between, repeated measures and mixed), ANCOVA, regression, proportions and chi-square tests, rank tests, equivalence tests, MANOVA, multilevel and cluster designs, SEM and planned meta-analyses. Mediation and moderated mediation give a quick look here and an R script for the full run on your computer. The cards for the rest point to tools that do them."

# ---------------------------------------------------------------------------
# Settings: undecided judgement calls and open questions
# (decision-tree.md sections 3 and 5). `value: null` means undecided: the app
# shows a labelled placeholder wherever the setting applies. To record a
# decision, set `value` to one of the option keys; the app then shows the
# decision instead of the placeholder. No code changes are needed.
# `shown_at` lists screens (route ids, node ids, endpoint ids, "card",
# "plan", "start") where the placeholder appears.
# ---------------------------------------------------------------------------
settings:
  - key: observed_power
    ref: "Judgement call 3.1; open question 5"
    question: "If the effect size comes from the study's own result (observed power), should the form block it, warn about it, or allow it?"
    options: {block: "Block it", warn: "Warn and allow", allow: "Allow without comment"}
    value: warn
    shown_at: [card]
  - key: effect_size_benchmarks
    ref: "Judgement call 3.2; open question 5"
    question: "Should small / medium / large benchmarks be shown, even as context? Should bias-corrected planning (e.g. BUCSS) be offered?"
    options: {hide: "Don't show benchmarks", context: "Show as context only, never as defaults", bucss: "Show as context, and offer bias-corrected planning"}
    # Decided 8 November 2026: no small/medium/large labels anywhere in the
    # help; bias-corrected planning stays a separate question.
    value: hide
    shown_at: [card]
  - key: one_sided_tests
    ref: "Judgement call 3.3; open question 5"
    question: "Should a one-sided test require a preregistration note? Should one-sided tests be offered for more designs than the basic tests?"
    options: {as_now: "Basic tests only, no note required", note: "Basic tests only, preregistration note required", wider: "More designs, preregistration note required", as_built: "The basic tests; the input screen asks first whether the hypothesis predicts a direction, and a one-sided test needs a reason, which goes into the write-up (as built)"}
    value: as_built
    shown_at: [card]
  - key: simple_effects_target
    ref: "Judgement call 3.4; open question 5"
    question: "Should simple effects become a target alongside the interaction?"
    options: {"no": "No: the interaction only", "yes": "Yes: offer simple effects as a target"}
    value: null
    shown_at: [f5_between, f5_mixed]
  - key: several_hypotheses
    ref: "Judgement call 3.5; open question 5"
    question: "Should single-analysis routes ask whether the study tests several hypotheses?"
    options: {"no": "No", ask: "Yes: ask, and point to the guided route"}
    value: ask
    shown_at: [card]
  - key: alpha_power_defaults
    ref: "Judgement call 3.6; open question 5"
    question: "Which defaults, if any, should alpha and target power have?"
    options: {none: "Blank: the user enters both", conventional: "Pre-filled .05 and .80", conventional_reason: "Pre-filled .05 and .80, with a required reason if changed or kept", rr: "Pre-filled .05 and .90", as_built: "Alpha pre-filled at .05, with a reason asked if it is changed; target power shown at .80 and .95 side by side, with the N each needs (as built)"}
    value: as_built
    shown_at: [card]
  - key: chi_square_gof
    ref: "Judgement call 3.7; open question 5"
    question: "Chi-square goodness-of-fit (one categorical variable against expected proportions) has no answer in the tree. E6 is a test of independence only. Should goodness-of-fit go to E6 once the spec has a goodness-of-fit form, or get its own card?"
    options: {extend_e6: "Extend E6 (spec change; Spower's p_chisq.test() takes a probability vector), with the card explaining the degrees of freedom", own_card: "Its own card (E48, on pwrss's power.chisq.gof())"}
    value: own_card
    shown_at: [E6, E48]
  - key: rank_based_tests
    ref: "Judgement call 3.8; open question 5"
    question: "Rank-based tests (Mann-Whitney, Wilcoxon, Kruskal-Wallis, Friedman, rank correlation) reach the parametric end points. How should powerkit handle them?"
    options: {efficiency: "Adjust the t-test calculation by an efficiency factor for an assumed distribution (G*Power's approach), recorded as the convention", simulate: "Simulate the rank test (Spower's p_wilcox.test(), p_kruskal.test()) from an assumed distribution", label: "Give the parametric figure and say plainly that it only approximates the rank-based test", honest: "Honest cards for rank-based tests until one of the above is built"}
    value: label
    shown_at: [E1, E2, E3, E4, E18]
  - key: fisher_exact
    ref: "Judgement call 3.9; open question 5"
    question: "Fisher's exact test reaches the large-sample tests (E5, E6), which can be quite wrong with small expected counts. What should powerkit do?"
    options: {exact: "Offer the exact test (Spower's p_prop.test(exact = TRUE)) as a test version", warn: "Warn that the figure isn't reliable for small expected counts", both: "Both"}
    value: exact
    shown_at: [E5, E6]
  - key: starting_point
    ref: "Open question 1"
    question: "Start from the hypothesis (as here), or also offer G*Power's design-based order (parameter class, then design)?"
    options: {hypothesis: "Hypothesis first (as here)", both: "Also offer the design-based order"}
    value: null
    shown_at: [start]
  - key: analysis_types
    ref: "Open question 2"
    question: "Offer only required N / power at a given N / smallest detectable effect? Show compromise and criterion as coming later? Show sensitivity greyed out or hidden where the engine can't do it yet?"
    options: {greyed: "Three types; sensitivity greyed out where unavailable", hidden: "Three types; sensitivity hidden where unavailable", five: "Also list compromise and criterion as coming later"}
    value: null
    shown_at: [card]
  - key: closing_order
    ref: "Open question 3"
    question: "Ask 'what do you want to find out?' after the design (G*Power's order, as here) or first (PAMLj's order)?"
    options: {after: "After the design", first: "First"}
    value: first
    shown_at: [start]
  - key: unstored_answers
    ref: "Open question 4"
    question: "Where should answers the spec can't store go (rating analysed as a score; randomised or not; why ANCOVA or the mixed interaction; expected interaction shape; manipulated or measured)?"
    options: {new_field: "A new spec field (schema change)", notes: "effect_justification.notes", app_only: "Keep them in the app only"}
    value: null
    shown_at: [o5a, pp2, me1, mm1]
  - key: pp1_f6_stored
    ref: "Open question 4 (PP1 and F6)"
    question: "PP1 (were people randomised?) and F6 (the expected interaction shape) don't change the end point. Should their answers be stored with the study (for the write-up and the shape check), or only shown on screen?"
    options: {store: "Store them (needs a place in the spec; see open question 4)", screen_only: "Show them on screen only", drop: "Don't ask them until there is somewhere to store them"}
    value: null
    shown_at: [pp1, f6_between, f6_mixed]
  - key: not_in_spec_wording
    ref: "Open question 6"
    question: "Confirm the wording that points users to another tool, and the rule that powerkit never routes to a simpler stand-in test."
    options: {proposed: "Use the proposed wording (below)"}
    value: proposed
    proposed_text: "powerkit doesn't cover {analysis} yet. {package} does: see the link. powerkit can't check results from other tools."
    shown_at: [card]
  - key: r_script_for_uncovered
    ref: "Open question 7"
    question: "For designs powerkit doesn't run, should the full-model builder generate a script (e.g. power4mome or Spower) that the user runs themselves, without powerkit's validation?"
    options: {"no": "No", "yes": "Yes, clearly labelled as not validated by powerkit"}
    value: null
    shown_at: [card]
  - key: bayes_entry
    ref: "Open question 8"
    question: "Where do Bayes factors enter the tree? Now: the Bayes factor end point (E-bayes) is reachable only from 'I know my analysis', and every card lists 'p-values or Bayes factors?' among the questions asked next."
    options: {start: "Ask 'p-values or Bayes factors?' on the start screen", after_goal: "Ask it after Q1, before the design questions", closing: "Ask it with the closing questions on each card", shortcut: "Shortcut list only (as now)"}
    value: shortcut
    shown_at: [start]
  - key: parallel_mediators_max
    ref: "Open question 10"
    question: "Allow three or more parallel mediators before that validation exists (validated with two)?"
    options: {two: "Two only until validated", up_to_nine: "Up to nine, as the spec allows"}
    value: two
    shown_at: [me3, E11]
  - key: guided_route
    ref: "Open question 11"
    question: "Add the guided 'plan my whole study' route? (Its study file would be a schema change.)"
    options: {"yes": "Yes", "no": "No"}
    value: "yes"
    hides_guided_route_when: "no"
    shown_at: [start, plan]
  - key: consistency_approach
    ref: "Open question 12"
    question: "Per-hypothesis forms with a consistency check, whole-study simulation from one model, or both?"
    options: {per_hypothesis: "Per hypothesis, with a consistency check", whole_study: "Whole-study simulation", both: "Both"}
    value: both
    shown_at: [plan]
  - key: guided_covariates
    ref: "Open question 15"
    question: "In the guided route, a covariate changes only the comparison of conditions (to ANCOVA, or multiple regression for a score X). Should covariates also enter the moderation and mediation analyses? (No template has covariates yet.)"
    options: {ignore: "No: comparison only (as now), saying so on the plan", include: "Yes, once the templates support covariates", ask: "Ask per analysis whether the covariate is included"}
    value: null
    shown_at: [plan]
  - key: guided_scope
    ref: "Open question 14"
    question: "What does the guided route do with repeated measures, many stimuli or nested data? Now: the screening questions stop nested data, stimuli and measurements over time before the guided route; three or more conditions per person are sent to 'Help me choose'."
    options: {send_to_tree: "Send users to 'Help me choose' (as now)", extend: "Extend the guided route to cover these designs", say_up_front: "Say on the start screen that the guided route is for single-session, between-person studies"}
    value: null
    shown_at: [guided_variables]
  - key: screening_wording
    ref: "Open question 16"
    question: "Final wording of the screening questions (S1-S4 and T1). The wording here is a draft."
    options: {as_drafted: "Keep the draft wording", revised: "Revised wording (edit the questions in tree.yaml and decision-tree.md)"}
    value: null
    shown_at: [s1, s2, s3, t1]
  - key: segmented_growth_shared
    ref: "Open question 17"
    question: "Should segmented regression / interrupted time series (E45) and growth curves (E35) share one end point? Now: two cards, chosen at T1."
    options: {separate: "Keep two end points", shared: "Merge them into one 'many measurements over time' card"}
    value: null
    shown_at: [t1, E35, E45]
  - key: name_other_tools
    ref: "Open question 18"
    question: "Should 'not covered' cards name other established tools (e.g. simr, G*Power's logistic and Poisson routines)? Now: generic cards say only 'Established tools exist for this design; powerkit hasn't checked them.' Cards built from coverage.md still list its tools."
    options: {name: "Name the tools, as coverage.md does", neutral: "Neutral sentence only, on every 'not covered' card"}
    value: name
    shown_at: [E43, E65, E46]
  - key: other_analyses_note
    ref: "Open question 20"
    question: "Show a note on covered cards that other defensible analyses exist for the design (listed per card, e.g. Student's vs Welch's t), and that they can need different sample sizes? The drafts are in docs/routing-audit.md, 'Other defensible analyses'. Off while undecided."
    options: {show: "Show the note on covered cards", hide: "Don't show it"}
    value: null
    shown_at: []
  - key: effect_size_inputs
    ref: "Input screens (17 October 2026); judgement call 3.2"
    question: "On the input screens, effect sizes, SDs and correlations start empty and must be filled in, with a justification. Should they instead offer suggested values (for example conventional benchmarks) that the user can change?"
    options: {empty_required: "Start empty and required, with a justification (as now)", suggested: "Offer suggested values the user can change, still with a justification"}
    value: empty_required
    shown_at: [form]
  - key: result_wording
    ref: "Result screen (phase 5, part 1, 17 October 2026); judgement-calls.md B11"
    question: "How should results be worded? The draft gives the number in a sentence (for example 'You need 206 participants in total (103 per group) for 80% power to detect the effect you entered'), plus a fixed line that this is planned power, not 'observed power' from a finished study. Keep, or change the wording?"
    options: {draft: "Keep the draft wording, including the 'not observed power' line", shorter: "A shorter number-first wording", other: "Other wording (say which)"}
    value: draft
    shown_at: [result]
  - key: n_rounding
    ref: "Result screen (phase 5, part 1); judgement-calls.md B12"
    question: "How is the required N rounded and reported? Now: the engine gives the smallest total N, in steps that keep groups whole (for example even totals for two equal groups, multiples of 4 for a 2 x 2 between design), and the screen adds the size per group. Report total, per group, or both?"
    options: {both: "Total and per group (as now)", total: "Total only", per_group: "Per group first, total second"}
    value: both
    shown_at: [result]
  - key: power_curve
    ref: "Result screen (phase 5, part 1); judgement-calls.md B13"
    question: "Should the result screen show a power curve (power against N)? Now: no curve; the number only. The engine already returns the simulated points for a sample-size search."
    options: {"no": "No curve (as now)", table: "A table of the computed points", plot: "A plot of power against N"}
    value: plot
    shown_at: [result]
  - key: calculation_seed
    ref: "Result screen (phase 5, part 1); judgement-calls.md B15"
    question: "Which seed does a calculation use? Decided 17 October 2026: a fixed default seed (1), shown on the input and result screens, changeable by the user, and recorded in the result and its R script, so the same answers always give the same result."
    options: {random: "A new random seed each time, recorded", fixed: "A fixed default seed, shown and changeable, recorded (as now)", ask: "Ask the user, with a default"}
    value: fixed
    shown_at: [result]
  - key: covariates_per_analysis
    ref: "Open question 13"
    question: "Should the app ask, for each analysis, which covariates it includes? (The spec can't hold covariates for any design yet.)"
    options: {"yes": "Yes, ask per analysis", "no": "No"}
    value: null
    shown_at: [plan]

# ---------------------------------------------------------------------------
# Start screen: the three routes (decision-tree.md 2.1 and 4.1).
# ---------------------------------------------------------------------------
# Every route starts with the screening questions (`screening_start`). The
# screening's last question leads to `continue` (S4, answered by the aim),
# which leads to the route's `after_screening`: a node id, "list" (the end-point list) or
# "guided" (the guided route's variables screen).
# ---------------------------------------------------------------------------
# Screen A: the aim, asked after "How do you want to start?" and before the
# screening (the new design, docs/decisions.md, 18 October 2026; one
# question per screen since 26 October 2026). Estimation and equivalence go
# to their cards. The other two questions screen A asked are on the input
# screen, where they are used: whether the sample size is fixed (shown with
# the goals that take a sample size) and how several tests are handled
# (the claim, under Settings; R/forms.R).
# ---------------------------------------------------------------------------
start_questions:
  - id: aim
    question: "What is your study trying to do?"
    options:
      predict: {label: "Test a prediction", help: "For example, that a training improves memory scores."}
      replicate: {label: "Replicate a published finding", help: "Plan a replication: the sample size for each goal it can have, how it differs from the original, and a write-up. Opens the replication planner in Labs.", labs: replication}
      meta: {label: "Combine studies others have done (a meta-analysis)", help: "For a systematic review you are planning, before the studies are found.", next: E61}
      estimate: {label: "Estimate how big something is", help: "Plan the sample size for a confidence interval of a chosen width, or see its width at a given sample size. The next screen lets you choose what to estimate.", next: E46}
      reliability: {label: "Show that a measure is reliable, or that raters agree", help: "For example, that two raters' scores agree (an ICC), that a scale's items hang together (Cronbach's alpha), or that raters choose the same category (kappa).", next: E69}
      equivalence: {label: "Show there's no meaningful effect", help: "Equivalence testing: the effect is smaller than a bound you set.", sets: {goal: equivalence}}

routes:
  doc_id: S0
  question: "How do you want to start?"
  title: "Plan the sample size for your study"
  lead: "Describe your design and enter what you know about the effect. Powerkit gives the sample size, power or precision, with a methods paragraph and an R script that reproduces the answer."
  tester_note: "Powerkit is a prototype. If you are trying it out, plan a study the way you usually would, plan it again here, and use \u201cFeedback on this screen\u201d at the top of any page to say what differed, took longer or was unclear."
  screening_start: s1
  screening_note: "First, four questions check that your design is one powerkit can advise on. No test is suggested until then."
  # "I know my analysis" can skip the screening and see every analysis. The
  # questions then become a filter the user can apply afterwards.
  skip_screening:
    label: "Skip the questions and show every analysis"
    help: "You get the whole list. Some analyses won't suit your design, and nothing checks that: each card still says what its test assumes."
    note: "Showing all %d analyses, with nothing screened out. Some won't suit your design; each card says what its test assumes and what it needs."
    filter_label: "Answer the four screening questions instead, to see only what fits"
  options:
    - id: known
      label: "I know my analysis"
      help: "Search a list of every analysis."
      after_screening: list
    - id: choose
      label: "Help me choose"
      help: "A few questions about your study find it for you."
      tag: "Not sure? Start here"
      after_screening: q1
    - id: guided
      label: "Plan my whole study"
      help: "Several analyses on the same data, planned together."
      after_screening: guided

# ---------------------------------------------------------------------------
# Questions: one node per screen. `doc_id` is the question's ID in
# decision-tree.md, section 2.2. Each option's `next` is another node id or
# an end point id (E...). Wording follows design-finder.md.
#
# Screening answers that later questions depend on are kept as context:
# - an option's `sets` records one (outcome: score | yesno; times: once |
#   twice | many_conditions; grouping: independent | clusters);
# - an option's `when` shows it only for matching context;
# - a node with `branch_on` is never shown: it routes on the context
#   (`routes`), because the screening has already answered it.
# Every shown question also offers the safety net (`safety_net`, below),
# added by the app.
# ---------------------------------------------------------------------------
nodes:
  # Screening (decision-tree.md 2.2, S1-S4): asked first in every route,
  # before any test is suggested. Wording is a draft (open question 16).
  s1:
    doc_id: S1
    text: "What kind of outcome will you measure?"
    help: "The outcome is what you measure to see whether your hypothesis holds."
    options:
      - {label: "A score or scale", next: s2, sets: {outcome: score}, help: "e.g. a questionnaire mean, a reaction time, words recalled."}
      - {label: "Yes/no, or one of several categories", next: s2, sets: {outcome: yesno}, help: "e.g. passed or failed; chose option A, B or C."}
      - {label: "A count", next: s2, sets: {outcome: count}, help: "How many times something happened, with no fixed maximum."}
      - {label: "Ordered categories (e.g. a single rating item)", next: o5a, help: "e.g. one item rated from 'strongly disagree' to 'strongly agree'."}
      - {label: "The time until something happens", next: E43, help: "e.g. days until relapse, or whether and when people drop out."}
  o5a:
    doc_id: O5a
    text: "How will you analyse this rating?"
    help: "Researchers disagree about this, so we ask rather than choose for you. Your answer is stated in the write-up."
    refs: "decision D1"
    options:
      - {label: "As a score (for example, comparing mean ratings)", next: s2, sets: {outcome: score}, help: "This treats the rating as an interval scale, which is debated."}
      - {label: "As ordered categories", next: s2, sets: {outcome: ordinal}}
  s2:
    doc_id: S2
    text: "How are the data grouped?"
    options:
      - {label: "Independent people", next: s3, sets: {grouping: independent}, help: "Each person's data are separate from everyone else's. If your data come from one person or one unit (for example, a school's monthly averages), choose this too."}
      - {label: "People within groups", next: s4, sets: {grouping: clusters}, help: "e.g. pupils in classes or patients in clinics, including designs where whole groups were assigned to conditions."}
      - {label: "Pairs", next: d1, help: "e.g. couples, or a parent and child, whose scores are related."}
      - {label: "Many trials or stimuli per person", next: s2_trials, help: "e.g. each person rates 40 faces or completes 200 trials."}
  # Pairs (1 November 2026): actor and partner effects (E44), conditions
  # given to whole pairs (a cluster trial with groups of two, E34), or
  # another dyadic design (E65).
  d1:
    doc_id: D1
    text: "What does your main hypothesis involve?"
    options:
      - {label: "Something measured on each member, and how it relates to their own and their partner's outcome", next: E44, when: {outcome: score}, help: "e.g. each partner's daily stress and both partners' relationship satisfaction."}
      - {label: "Something measured on each member, and how it relates to their own and their partner's outcome", next: E65, when: {outcome: [yesno, count, ordinal]}}
      - {label: "Conditions given to whole pairs", next: E34, help: "e.g. couples randomised to a programme or a waiting list: a cluster-randomised trial with groups of two."}
      - {label: "Something else, such as a condition given to one member of each pair", next: E65}
  s2_trials:
    doc_id: S2a
    text: "What does your main hypothesis compare?"
    help: "powerkit calculates two or more conditions with a score or a yes/no answer on each trial, every participant responding in all of them or each in one."
    options:
      - {label: "Two conditions, and each person responds in both", next: E33, when: {outcome: [score, yesno]}, help: "e.g. emotional and neutral words, each person reading both kinds."}
      - {label: "Two conditions, and each person responds in both", next: E41, when: {outcome: [count, ordinal]}}
      - {label: "Two conditions, and each person is in one of them", next: E33, when: {outcome: [score, yesno]}, help: "e.g. one group reads emotional words and another neutral words, each person rating many words."}
      - {label: "Two conditions, and each person is in one of them", next: E41, when: {outcome: [count, ordinal]}}
      - {label: "Three or more conditions, and each person responds in all of them", next: E63, when: {outcome: [score, yesno]}, help: "e.g. happy, angry and neutral faces, each person seeing all three kinds."}
      - {label: "Three or more conditions, and each person responds in all of them", next: E41, when: {outcome: [count, ordinal]}}
      - {label: "Three or more conditions, and each person is in one of them", next: E63, when: {outcome: [score, yesno]}, help: "e.g. three groups, each rating a different kind of face."}
      - {label: "Three or more conditions, and each person is in one of them", next: E41, when: {outcome: [count, ordinal]}}
      - {label: "A score measured on each item, and how it relates to the response", next: E67, when: {outcome: [score, yesno]}, help: "e.g. how a word's frequency relates to how fast people read it."}
      - {label: "A score measured on each item, and how it relates to the response", next: E41, when: {outcome: [count, ordinal]}}
      - {label: "Something else", next: E41}
  s3:
    doc_id: S3
    text: "How many times is each person measured on the outcome?"
    options:
      - {label: "Once", next: s4, sets: {times: once}}
      - {label: "Twice", next: s4, sets: {times: twice}, help: "e.g. once before and once after, or once in each of two conditions."}
      - {label: "Many times", next: t1, help: "Three or more measurements: in different conditions, or over time."}
  t1:
    doc_id: T1
    text: "What are the repeated measurements?"
    options:
      - {label: "The same people in three or more conditions", next: s4, sets: {times: many_conditions}, help: "e.g. everyone completes three tasks, every cell of a 2 x 2 design, or a trial's groups measured before, after and at follow-up."}
      - {label: "Measurements over time, to see whether a trend changes at a known point", next: E45, help: "e.g. weekly scores before and after a policy change (segmented regression, interrupted time series)."}
      - {label: "Measurements over time, to see how people change", next: E35, help: "e.g. growth curves, diary or experience-sampling studies, panel waves."}
      - {label: "Two scores measured over time, to see whether each predicts later changes in the other", next: E74, help: "e.g. whether stress at one wave predicts sleep problems at the next, within people (a cross-lagged panel model)."}
  s4:
    doc_id: S4
    # The goal (detect, equivalence, estimate) is asked once, on the aim
    # screen before the screening; equivalence and estimation leave from
    # there. A study that detects an effect continues, unless people are in
    # groups (the multilevel card).
    text: "What's your goal? (answered by the aim)"
    branch_on: goal
    default: detect
    routes: {detect: s4_detect, equivalence: s4_equivalence}
  s4_detect:
    doc_id: S4
    text: "How are the data grouped? (answered by S2)"
    branch_on: grouping
    routes: {independent: continue, clusters: s4_clusters_outcome}
  # E62 takes a score outcome; other outcomes go straight to E34, which
  # also covers yes/no outcomes.
  s4_clusters_outcome:
    doc_id: S4
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: c1, yesno: E34, count: E34, ordinal: E34}
  # People within groups (31 October 2026): conditions given to groups or to
  # people in them (E34), or relationships with predictors measured on the
  # people and on the groups (E62).
  c1:
    doc_id: C1
    text: "What does your main hypothesis involve?"
    options:
      - {label: "Conditions or treatments given to whole groups, or to people within the groups", next: c2, help: "e.g. classes randomised to a new programme, or a trial run at several clinics."}
      - {label: "Something measured on each person, or on each group, and how it relates to the outcome", next: E62, help: "e.g. pupils' homework time and their teacher's experience predicting maths scores."}
  # Groups within larger groups (1 November 2026): three levels (E68).
  c2:
    doc_id: C2
    text: "Are the groups themselves part of larger groups that matter for the design?"
    options:
      - {label: "No: one level of groups (for example, classes, or clinics)", next: E34}
      - {label: "Yes: groups within larger groups (for example, classes within schools, or therapists within clinics)", next: E68, help: "e.g. schools randomised to a programme, with pupils in several classes in each school."}
  # Equivalence for grouped data goes to the grouped card, which says it
  # isn't covered yet: the equivalence card assumes separate people.
  s4_equivalence:
    doc_id: S4
    text: "How are the data grouped? (answered by S2)"
    branch_on: grouping
    routes: {independent: E36, clusters: E34}

  q1:
    doc_id: Q1
    text: "What do you want your study to show?"
    help: "Pick the sentence closest to your main hypothesis. You can change it later."
    options:
      - {label: "A difference between groups or conditions", next: q2_diff, help: "e.g. students who sleep eight hours recall more words than students who sleep five."}
      - {label: "A relationship between two things you measure", next: q2_rel, help: "e.g. daily screen time is related to loneliness."}
      - {label: "That an effect depends on something else (moderation)", next: q2_mod, help: "e.g. daily stress harms sleep less for people with more social support."}
      - {label: "That an effect works through something else (mediation)", next: q2_med, help: "e.g. a self-affirmation task reduces defensiveness, which makes people more willing to change."}
      - {label: "Both: it works through something, and part of that depends on something else", next: q2_modmed, help: "Moderated mediation."}
      - {label: "Something else: the spread of scores, a questionnaire's structure or fit, item bias, signal detection, or types of people", next: q1_more,
         help: "Spread of scores (variance tests), structural equation models, differential item functioning, signal detection (d'), exploratory factor analysis and latent profiles."}
  q1_more:
    doc_id: Q1b
    text: "Which of these is closest to what you want to show?"
    help: "Less common aims, each with its own analysis."
    options:
      - {label: "That scores are more spread out (or more consistent) in one group than another, or than a fixed value", next: v1_by_times,
         when: {outcome: score, times: [once, twice]}, help: "e.g. reaction times are more consistent after training. This is about how much scores vary, not their average."}
      - {label: "Something about latent variables: that a model or questionnaire structure fits, that a questionnaire measures the same in two groups, or a path between factors (SEM)", next: E37}
      - {label: "That a test's items work the same way in two groups (differential item functioning, in item response theory)", next: E71, help: "e.g. whether the items of a reading test are equally hard in its English and Spanish versions, for people of the same ability."}
      - {label: "That people tell a signal from noise better in one condition or group than another (sensitivity, d', in signal detection)", next: E72, help: "e.g. recognition memory is better after deep than after shallow encoding, measured as d' from hits and false alarms."}
      - {label: "That a questionnaire's items form the factors you expect, found by exploratory factor analysis", next: E73, help: "e.g. that 15 wellbeing items form three factors, without fixing in advance which item belongs to which."}
      - {label: "That people fall into distinct types or profiles", next: E58, help: "e.g. finding groups of students with different patterns of motivation (latent profile or latent class analysis)."}

  # A difference ------------------------------------------------------------
  q2_diff:
    doc_id: Q2
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: f1, yesno: q3_cat_by_times, count: q3_count, ordinal: q3_ord}
  f1:
    doc_id: F1
    text: "How many things did you vary or compare?"
    help: "Each thing you vary is called a factor (for example 'condition' or 'time')."
    options:
      - {label: "One", next: f2_by_times}
      - {label: "Two, each with exactly two levels (a 2 x 2 design)", next: f4,
         help: "Crossed: every combination appears, for example two conditions for both younger and older people."}
      - {label: "Two, crossed, at least one with three or more levels", next: f3a_by_times,
         help: "For example two groups each measured at three timepoints."}
      - {label: "Three, crossed (every combination appears)", next: E56}
      - {label: "Four or more", next: E-unsure}
  # Questions with one possible answer for the screening's "times" are
  # skipped: these automatic nodes go straight on.
  f2_by_times:
    doc_id: F2
    text: "How many groups or conditions? (answered by S3 when the people are measured twice)"
    branch_on: times
    routes: {once: f2, twice: E3, many_conditions: f2a}
  f2:
    doc_id: F2
    text: "How many groups or conditions?"
    options:
      - {label: "One group, compared with a fixed value", next: E1, when: {times: once}}
      - {label: "Two, with different people in each", next: E2, when: {times: once}}
      - {label: "Three or more", next: f2a, when: {times: [once, many_conditions]}}
      - {label: "One group, its several outcomes compared with fixed values at once", next: E60, when: {times: once},
         help: "e.g. a clinic sample's anxiety, depression and stress compared with the scales' published norms together (one-sample Hotelling's T-squared)."}
      - {label: "Two or more, compared on several outcomes at once", next: E59, when: {times: once},
         help: "e.g. three therapy groups compared on anxiety, depression and stress together (MANOVA; Hotelling's T-squared for two groups)."}
  f2a:
    doc_id: F2a
    text: "What does your hypothesis say about the groups?"
    help: "Researchers disagree about whether to power the overall test or a specific comparison, so we ask."
    refs: "decision D8"
    options:
      - {label: "A specific comparison (e.g. both feedback conditions beat no feedback)", next: E19}
      - {label: "Any difference among the groups", next: E18, when: {times: once}}
      - {label: "A steady rise or fall across groups in a set order (e.g. doses, age bands)", next: E64, when: {times: once},
         help: "Tested on ranks (the Jonckheere-Terpstra test). For a planned trend in the means, such as a linear contrast, choose a specific comparison instead."}
      - {label: "Any difference among the conditions", next: E54, when: {times: many_conditions}}
  f3a_by_times:
    doc_id: F3a
    text: "For each factor: did different people get each level? (answered by S3 unless people did three or more conditions)"
    branch_on: times
    routes: {once: E21, twice: E55, many_conditions: f3a}
  f3a:
    doc_id: F3a
    text: "For each factor: did different people get each level, or did everyone get every level?"
    help: "For example, two groups each measured at three timepoints: the groups are different people, and everyone gets every timepoint."
    options:
      - {label: "One factor different people, the other everyone got every level", next: E55, when: {times: [twice, many_conditions]}}
      - {label: "Both factors: different people", next: E21, when: {times: once}}
      - {label: "Both factors: everyone got every level", next: E20, when: {times: many_conditions}}
  f4:
    doc_id: F4
    text: "For each factor: did different people get each level, or did everyone get both? (answered by S3)"
    help: "Measured once: different people in every group. Twice: one factor between people, the other within. Three or more conditions: everyone got every combination."
    branch_on: times
    routes: {once: f4a_between, twice: f4b, many_conditions: E20}
  f4a_between:
    doc_id: F4a
    text: "Will the groups be equal in size?"
    help: "Whether every combination will have the same number of people."
    refs: "decisions D5, N1-N3"
    options:
      - {label: "Yes: the same number in every group", next: f5_between}
      - {label: "No: the groups will differ in size", next: E22}
  f5_between:
    doc_id: F5
    text: "Which result matters most for your study?"
    help: "Power is calculated for one effect. Choose the one your main hypothesis is about."
    options:
      - {label: "The effect of factor A, averaged over factor B", next: E7}
      - {label: "The effect of factor B, averaged over factor A", next: E7}
      - {label: "Whether the effect of one depends on the other (the interaction)", next: f6_between}
  f6_between:
    doc_id: F6
    text: "Which picture matches your prediction?"
    help: "The shape is recorded only; you enter the means on the form."
    refs: "decision D6"
    options:
      - {label: "The lines cross (the effect reverses)", next: E7}
      - {label: "One effect shrinks", next: E7}
      - {label: "One effect disappears", next: E7}
  f4b:
    doc_id: F4b
    text: "Is the within-participants factor a 'before and after' measurement?"
    help: "The groups may be the same size or differ: the cards take either (the mixed ANOVA simulates groups of different sizes; the ANCOVA calculates them by formula). You enter the sizes on the card."
    options:
      - {label: "Yes: before and after", next: pp1}
      - {label: "No: another within-participants condition", next: f5_mixed}
  pp1:
    doc_id: PP1
    text: "Were people randomly assigned to the groups?"
    help: "This decides whether to compare the after scores adjusting for the before scores (ANCOVA) or to test the group by time interaction."
    options:
      - {label: "Yes, randomly assigned", next: pp2_random}
      - {label: "No, the groups already existed or chose themselves", next: pp2, help: "Without random assignment, the two analyses can answer different questions (Lord's paradox). Neither is right by default."}
  pp2_random:
    doc_id: PP2
    text: "Which analysis do you plan to use?"
    help: "With randomised groups, ANCOVA is the recommended analysis: it has more power than the mixed interaction and is unbiased, because randomisation makes the groups equal at baseline on average. The group x time interaction stays available if you have to use it."
    options:
      - {label: "ANCOVA: the after score, adjusting for the before score (recommended)", next: E23}
      - {label: "The 2 x 2 mixed ANOVA interaction (group x time)", next: f6_mixed}
  pp2:
    doc_id: PP2
    text: "Which analysis do you plan to use?"
    help: "Without random assignment the two analyses can answer different questions (Lord's paradox), so we ask rather than choose for you."
    options:
      - {label: "ANCOVA: the after score, adjusting for the before score", next: E23}
      - {label: "The 2 x 2 mixed ANOVA interaction (group x time)", next: f6_mixed}
  f5_mixed:
    doc_id: F5
    text: "Which result matters most for your study?"
    options:
      - {label: "The effect of the between-participants factor", next: E8}
      - {label: "The effect of the within-participants factor", next: E8}
      - {label: "Whether the effect of one depends on the other (the interaction)", next: f6_mixed}
  f6_mixed:
    doc_id: F6
    text: "Which picture matches your prediction?"
    options:
      - {label: "The lines cross (the effect reverses)", next: E8}
      - {label: "One effect shrinks", next: E8}
      - {label: "One effect disappears", next: E8}
  q3_cat_by_times:
    doc_id: Q3
    text: "What are you comparing? (answered by S3 when the same people are measured more than once)"
    branch_on: times
    routes: {once: q3_cat, twice: E26, many_conditions: E26}
  q3_cat:
    doc_id: Q3
    text: "What are you comparing?"
    options:
      - {label: "Two groups", next: E5, when: {times: once}}
      - {label: "Groups, with an outcome in categories (not just yes/no)", next: E6, when: {times: once}}
      - {label: "Three or more groups in a set order (for example, doses): a trend", next: E66, when: {times: once},
         help: "e.g. whether the proportion who recover rises with the number of weekly sessions (the Cochran-Armitage trend test)."}
      - {label: "One group against a known proportion", next: E25, when: {times: once}}
      - {label: "One group's categories against expected proportions", next: E48, when: {times: once}}
      - {label: "Two or more factors (for example, a 2 x 2 design)", next: E47, when: {times: once}}
      - {label: "The same people in every condition", next: E26, when: {times: [twice, many_conditions]}}

  # How much scores vary -----------------------------------------------------
  v1_by_times:
    doc_id: V1
    text: "Whose spread of scores are you comparing? (answered by S3 when the same people are measured twice)"
    branch_on: times
    routes: {once: v1, twice: E57}
  v1:
    doc_id: V1
    text: "Whose spread of scores are you comparing?"
    options:
      - {label: "One group's, against a fixed value (for example, a published norm)", next: E52, when: {times: once}}
      - {label: "Two groups', with different people in each", next: E53, when: {times: once}}
      - {label: "The same people's, measured twice (before and after, or in two conditions)", next: E57, when: {times: twice}}

  # A count outcome: Poisson regression (E28) when each person is measured
  # once; a difference in counts measured more than once on the same people
  # needs a generalised mixed model, which powerkit doesn't calculate yet
  # (E75, which names the tools that do).
  q3_count:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: E28, twice: E75, many_conditions: E75}

  # An outcome in ordered categories, analysed as ordinal: two groups of
  # different people, each measured once (E29, whose card says it compares
  # two groups only); repeated ordinal measurements need a cumulative link
  # mixed model, which powerkit doesn't calculate yet (E75).
  q3_ord:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: E29, twice: E75, many_conditions: E75}

  # A relationship ----------------------------------------------------------
  q2_rel:
    doc_id: Q2
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: q3_rel, yesno: q3_rel_cat, count: q3_rel_count, ordinal: q3_rel_ord}
  # A relationship measured within people (the same people measured twice
  # or more) is a within-person relationship whatever the outcome, as for a
  # score (q3_rel): E41. Measured once, a yes/no or categorical outcome goes
  # on to its regressions and a count to Poisson regression (E28). An
  # ordinal outcome measured once has no card for a measured predictor:
  # E29 compares two groups only, which is a difference, so the safety net.
  q3_rel_cat:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: q2_rel_cat, twice: E41, many_conditions: E41}
  q3_rel_count:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: E28, twice: E41, many_conditions: E41}
  q3_rel_ord:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: E-unsure, twice: E41, many_conditions: E41}
  q2_rel_cat:
    doc_id: Q2
    text: "Which kind of categorical outcome?"
    options:
      - {label: "Yes/no", next: E27}
      - {label: "One of several categories, predicted by a score (or controlling for other variables)", next: E70}
      - {label: "One of several categories (and the other variable is categories too)", next: E6}
  q3_rel:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: r1, twice: E41, many_conditions: E41}
  r1:
    doc_id: R1
    text: "What is the other variable like?"
    options:
      - {label: "A score or scale", next: E4}
      - {label: "A score, and the question is whether the relationship differs between two separate groups", next: E49}
      - {label: "Scores, and the question is whether one correlation is stronger than another in the same people", next: E51}
      - {label: "Groups or categories (that makes it a difference between groups)", next: f1}
      - {label: "Several predictors at once, or controlling for other variables", next: E24}

  # Moderation --------------------------------------------------------------
  q2_mod:
    doc_id: Q2
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: q3_mod, yesno: E32, count: E32, ordinal: E32}
  q3_mod:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: mo1, twice: mo_within, many_conditions: mo_within}
  # Measured more than once, "depends on" is often a factorial experiment
  # (group x condition, group x time), or a moderated treatment effect in
  # a before/after trial; only relationships measured within people need a
  # multilevel model.
  mo_within:
    doc_id: MO0
    text: "What are the two things whose combination matters?"
    help: "X is the predictor whose effect depends on something; W is what it depends on (the moderator)."
    options:
      - {label: "Both are groups or conditions (for example, the emotion effect is bigger in the clinical group, or the treatment group improves more over time)", next: f1,
         help: "A factorial design: the interaction in a mixed or repeated-measures ANOVA."}
      - {label: "A treatment or group, and a measured score, with the outcome measured before and after", next: E24, when: {times: twice},
         help: "e.g. the treatment works better for people with more social support. Tested as the X x W product in a regression on the after score that adjusts for the before score."}
      - {label: "Things measured within each person (for example, daily stress and sleep in a diary study)", next: E41}
  mo1:
    doc_id: MO1
    text: "What is your main predictor (X)?"
    options:
      - {label: "Two conditions you assigned, or two groups that already exist", next: mo2_xbin}
      - {label: "A measured score", next: mo2_xscore}
      - {label: "Three or more conditions or groups", next: E30}
  mo2_xbin:
    doc_id: MO2
    text: "What does the effect depend on (the moderator, W)?"
    options:
      - {label: "Two conditions or two groups (a 2 x 2 design)", next: f4}
      - {label: "A measured score", next: E15}
      - {label: "Three or more groups", next: E30}
  mo2_xscore:
    doc_id: MO2
    text: "What does the effect depend on (the moderator, W)?"
    options:
      - {label: "Two conditions or two groups", next: E15}
      - {label: "A measured score", next: mo3}
      - {label: "Three or more groups", next: E30}
  mo3:
    doc_id: MO3
    text: "Does a third variable change the interaction again?"
    options:
      - {label: "No", next: E9}
      - {label: "Yes (a three-way interaction)", next: E31}

  # Mediation ---------------------------------------------------------------
  q2_med:
    doc_id: Q2
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: q3_med, yesno: E32, count: E32, ordinal: E32}
  q3_med:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: me1, twice: E41, many_conditions: E41}
  me1:
    doc_id: ME1
    text: "What is the cause (X)?"
    help: "Even when you assign X, the go-between (mediator) isn't assigned, so its effect on the outcome is observational."
    refs: "decision D9"
    options:
      - {label: "Two conditions you assigned, or two groups", next: me4_xbin}
      - {label: "A measured score", next: me4}
      - {label: "Three or more conditions or groups", next: E42}
  me4_xbin:
    doc_id: ME4
    text: "Is each go-between (mediator) a score?"
    options:
      - {label: "Yes", next: me2_xbin}
      - {label: "No, at least one is yes/no or a category", next: E39}
  me2_xbin:
    doc_id: ME2
    text: "How many go-betweens (mediators)?"
    options:
      - {label: "One", next: E16}
      - {label: "Two or more", next: me3_xbin}
  me3_xbin:
    doc_id: ME3
    text: "How do the mediators connect?"
    help: "On the next screen, choose two groups or conditions for X."
    refs: "phase 3b decisions, 29 October 2026"
    options:
      - {label: "Side by side: X affects each one separately", next: E11}
      - {label: "In a chain: X affects the first, which affects the next", next: E12}
  me4:
    doc_id: ME4
    text: "Is each go-between (mediator) a score?"
    options:
      - {label: "Yes", next: me2}
      - {label: "No, at least one is yes/no or a category", next: E39}
  me2:
    doc_id: ME2
    text: "How many go-betweens (mediators)?"
    options:
      - {label: "One", next: E10}
      - {label: "Two or more", next: me3}
  me3:
    doc_id: ME3
    text: "How do the mediators connect?"
    options:
      - {label: "Side by side: X affects each one separately", next: E11}
      - {label: "In a chain: X affects the first, which affects the next", next: E12}

  # Moderated mediation -----------------------------------------------------
  q2_modmed:
    doc_id: Q2
    text: "What is your outcome like? (answered by S1)"
    branch_on: outcome
    routes: {score: q3_modmed, yesno: E32, count: E32, ordinal: E32}
  q3_modmed:
    doc_id: Q3
    text: "Who gives the data? (answered by S3)"
    branch_on: times
    routes: {once: mm1, twice: E41, many_conditions: E41}
  mm1:
    doc_id: MM1
    text: "What is the cause (X)?"
    options:
      - {label: "Conditions you assigned, or two groups", next: E17}
      - {label: "A measured score", next: mm2}
  mm2:
    doc_id: MM2
    text: "What does part of the process depend on (the moderator, W)?"
    options:
      - {label: "Two groups or conditions", next: E17}
      - {label: "A measured score", next: mm3}
  mm3:
    doc_id: MM3
    text: "How many mediators?"
    options:
      - {label: "One", next: mm4}
      - {label: "Two or more", next: E40}
  mm4:
    doc_id: MM4
    text: "Which link depends on W?"
    options:
      - {label: "The link from X to the mediator", next: E13}
      - {label: "The link from the mediator to the outcome", next: E14}
      - {label: "Both links, or X to the mediator and the direct link", next: E38}

# ---------------------------------------------------------------------------
# Closing questions: shown on every end-point card as "what you'd be asked
# next" (decision-tree.md 2.2, "Every design" rows; chart F).
# `setting` names the undecided setting(s) shown, as a compact labelled
# placeholder, next to that question on the card.
# ---------------------------------------------------------------------------
# Closing questions (decision-tree.md, table 2.2, "Every design" rows).
# Each card shows only the questions whose `applies_to` names it ("all" for
# every card that runs or is coming soon), following table 2.2's "Engine can
# use it?" column. decision-tree.md, "Closing questions by card", has the
# same table; a test keeps them in step. `card_notes` gives a card-specific
# note in place of `note`.
closing_questions:
  # E15 (a yes/no X or W) asks for the score's reliability only:
  # misclassification in a 0/1 variable is a different problem from
  # unreliable scores (maintainer decisions, 16 and 29 October 2026;
  # docs/decisions.md).
  - {doc_id: Q-rel, text: "Do you know how reliable your measures are? (optional)", applies_to: [E9, E31, E15]}
  - {doc_id: Q-dir, text: "Which directions will your statistical decision test?", setting: one_sided_tests, applies_to: [E1, E2, E3, E4, E5, E25, E26, E27, E28, E32, E34, E35, E49, E50, E51, E52, E53, E57, E61, E64, E66, E74]}
  - doc_id: Q-test
    text: "Which version of the test?"
    applies_to: [E2, E5, E7, E8, E18, E20, E21, E54, E55, E56]
    card_notes: {E2: "Student's or Welch's t-test.", E5: "The z test or Fisher's exact test.", E18: "Exact dataset (no repeated simulation) or repeated simulation.", E54: "Exact dataset (no repeated simulation) or repeated simulation.", E55: "Exact dataset (no repeated simulation) or repeated simulation.", E56: "Exact dataset (no repeated simulation) or repeated simulation.", E20: "Exact dataset (no repeated simulation) or repeated simulation.", E21: "Exact dataset (no repeated simulation) or repeated simulation.", E7: "Exact dataset (no repeated simulation) or repeated simulation.", E8: "Exact dataset (no repeated simulation) or repeated simulation."}
  - doc_id: Q-goal
    text: "What do you want to find out: the sample size you need, the power at a given N (for an effect size you plan for), or the smallest effect you could detect at a given N?"
    note: "The smallest detectable effect isn't available for this design yet. Observed power (from a finished study's own result) can be calculated as power at a given N, with a warning."
    card_notes: {E46: "The sample size for a confidence-interval width, or the width at a given sample size; no power.", E50: "The power for a noncentrality, or the noncentrality needed for a target power; there is no sample size, because the noncentrality already reflects it.", E7: "All three are available for this design. Observed power (from a finished study's own result) can be calculated as power at a given N, with a warning.", E8: "All three are available for this design. Observed power (from a finished study's own result) can be calculated as power at a given N, with a warning."}
    setting: [analysis_types, observed_power]
    applies_to: all
  - {doc_id: Q-alpha, text: "Which significance level (alpha)?", setting: alpha_power_defaults, applies_to: all, not_for: [E46, E58, E73]}
  - {doc_id: Q-power, text: "What power do you want?", applies_to: all, not_for: [E46]}
  - {doc_id: Q-effect, text: "What effect do you expect, and where does that number come from?", setting: effect_size_benchmarks, applies_to: all}
  - {doc_id: Q-attr, text: "How many participants do you expect to lose?", applies_to: all, not_for: [E50, E61, E45]}
  - {doc_id: Q-multi, text: "Does your study test more than one hypothesis that this power analysis should cover?", setting: several_hypotheses, applies_to: all, not_for: [E46]}
  - {doc_id: Q-bayes, text: "Will you test your hypothesis with p-values or with Bayes factors?", setting: bayes_entry, applies_to: all, not_for: [E46, E58, E73]}

# Added by the app to every question, in every route (and to the end-point
# list): leads to a card saying powerkit can't advise on the design yet.
safety_net:
  label: "None of these fit / I'm not sure"
  endpoint: E-unsure
  # Shown on the safety-net card: what to write down for a statistician,
  # filled in from the user's screening answers (the nodes named in each
  # item; "not answered yet" when the user hasn't reached that question).
  prepare:
    intro: "Before you meet a statistician, write down these points. Your answers so far are filled in."
    items:
      - {label: "What kind of outcome you will measure", nodes: [s1, o5a]}
      - {label: "How the data are grouped", nodes: [s2]}
      - {label: "How many times each person (or unit) is measured", nodes: [s3, t1]}
    not_answered: "not answered yet"
    stopped_at: "Where nothing fitted"
    also: ["Your hypothesis, in one sentence", "The effect you expect, and where that number comes from", "How many participants you could realistically recruit", "How you plan to analyse the data, if you know"]

# Shown on generic "not covered" cards that have `established_tools: true`.
# Whether such cards should name the tools is open question 18.
# Named instead of established_tools_text when setting name_other_tools is
# `name` (decided 22 October 2026) and the end point lists `tools`.
named_tools_text: "Established tools for this design (powerkit hasn't checked them):"
established_tools_text: "Established tools exist for this design; powerkit hasn't checked them."

# Shown on cards for end points with `no_ready_made_tool`.
# Draft note for covered cards; {alternatives} is the card's list. Shown
# only when other_analyses_note is "show".
# Rank-based tests reaching the parametric cards (judgement call 3.8,
# decided 22 October 2026: setting rank_based_tests, `label`). Shown on the
# cards whose end point has a `rank_test`. Where powerkit simulates the
# rank test itself (`rank_test_simulated: true`, from 28 October 2026),
# rank_test_simulated_text replaces it.
rank_test_text: "Planning {rank_test} instead? The figure here is for the parametric test, and only approximates the rank-based one: how closely depends on how your data are distributed, and powerkit hasn't checked it."
rank_test_simulated_text: "Planning {rank_test} instead? Choose it as the test version on the next screen: powerkit simulates the rank test itself, for the shape of scores you expect (normal, skewed or heavy-tailed)."
# On the cards with a Bayes factor version (`bayes_test: true`: the
# t-tests, one proportion and the correlation).
bayes_test_text: "Testing with a Bayes factor instead of a p-value? Choose the Bayes factor test as the test version on the next screen: powerkit works out the chance that the study finds strong evidence, without repeated simulation (bfpwr uses an approximation for t-tests, which can differ at small samples; BayesFactor supplies the Bayes factor for the correlation and two proportions, with JASP's default priors)."
other_analyses_text: "Other defensible analyses exist for this design (e.g. {alternatives}), and they can need different sample sizes. Power the analysis you plan to run."

no_ready_made_tool_text: "No ready-made tool. Your options are a custom simulation in R (for example with Spower, where you write the data-generating and analysis code yourself) or advice from a statistician."

# The effect-size justification prompt on every card (spec field
# effect_justification; build guide section 4).
justification_prompt:
  text: "Where does your effect size come from? powerkit asks for a justification and never uses a 'medium effect' default."
  types:
    smallest_effect_of_interest: "The smallest effect that would matter (smallest effect size of interest)"
    meta_analysis: "A meta-analysis"
    prior_study: "A previous study (you'll be asked how you adjusted it, e.g. for publication bias)"
    pilot_study: "A pilot study (you'll see a warning: pilot estimates are very imprecise)"

# ---------------------------------------------------------------------------
# End points (decision-tree.md, table 2.3). `doc_name` is copied exactly
# from the table; `plain_name` is what the card shows. `search_words`
# (optional): other names people search for, found by the search box of
# "I know my analysis" along with the names and any rank test.
# status: runs_validated | runs_validation_in_progress | coming_soon | not_in_powerkit
#   To mark an end point validated once its full run is recorded in
#   docs/validation-log.md: change `status: runs_validation_in_progress` to
#   `status: runs_validated`, update `validation: note`, and change the
#   "Validated?" cell of decision-tree.md table 2.3 to start with "Yes"
#   (test-docs-match.R checks the two agree).
# no_ready_made_tool: true when no tool offers this analysis, or names the
#   part of the end point that has none (e.g. "Cochran's Q"). The card then
#   shows the text in `no_ready_made_tool_text` (above).
# status_text: replaces no_ready_made_tool_text on that card only (E45).
# five_tools: "not covered" when none of the five tools powerkit builds on
#   covers the end point (the card says so).
# generic: true for one card per category of design powerkit doesn't
#   cover, where it is unclear which specific end point applies. The card
#   shows `card_text` (and `established_tools_text` if
#   `established_tools: true`) instead of a package list.
# card_points: extra points listed on the card.
# alternatives: other analyses that could be defended for the same question
#   (covered end points). The card note that lists them is shown only when
#   the setting other_analyses_note is "show" (open question 20).
# never_screened_out: true for end points the end-point list shows whatever
#   the screening answers (Bayes factors: open question 8).
# from_coverage: false when the card's tool line isn't taken from
#   docs/coverage.md (the card then doesn't say it is).
# tier: MVP | v2 | later | none (the table's tier text starts with this; none for the safety net).
# ---------------------------------------------------------------------------
endpoints:
  E1:
    rank_test: "the Wilcoxon signed-rank test"
    rank_test_simulated: true
    bayes_test: true
    doc_name: "One-sample t-test"
    technical_name: "One-sample t-test"
    plain_name: "Compare one group's average with a fixed value"
    search_words: "one sample t test cohen's d effect size sequential bayes factor optional stopping"
    card_points:
      - "Planning to stop collecting data once the evidence is clear? Choose the Bayes factor t-test: its result offers a sequential plan (check as you go, with a maximum sample size)."
    template: "basic_test / one_sample_t"
    backend: "pwr: pwr.t.test() (Spower simulation if you choose it); Spower's p_wilcox.test() for the Wilcoxon signed-rank test; bfpwr's powertbf01() for the Bayes factor t-test; pwrss's power.t.student() with a margin for the minimum-effect test"
    method: "Formula (no simulation); simulation for the Wilcoxon signed-rank test"
    inputs: ["Your outcome's name", "The effect: Cohen's d, or the means and SD in your measure's own units", "The t-test, the Wilcoxon signed-rank test, a Bayes factor t-test or a minimum-effect test"]
    status: runs_validated
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. No published example has been checked for this design yet."}
    tier: MVP
    alternatives: ["the one-sample Wilcoxon signed-rank test", "the sign test"]
  E2:
    rank_test: "the Mann-Whitney test"
    rank_test_simulated: true
    bayes_test: true
    doc_name: "Independent-samples t-test (Welch's by default; Student's as an option)"
    technical_name: "Independent-samples t-test"
    plain_name: "Compare two separate groups on a score"
    search_words: "two sample t test unpaired welch student between-subjects between subjects independent groups cohen's d effect size mann-whitney wilcoxon rank-sum rank sum sequential bayes factor optional stopping"
    card_points:
      - "Planning to stop collecting data once the evidence is clear? Choose the Bayes factor t-test: its result offers a sequential plan (check as you go, with a maximum sample size)."
    template: "basic_test / independent_t"
    backend: "pwrss / pwr: power.t.welch() for Welch's test without between-study variation; pwr with the documented adjustment when variation is included (Welch requires equal group sizes and SDs for this route); pwr's pwr.t.test() or pwr.t2n.test() for Student's test (pooled SD); Spower simulation if chosen; Spower's p_wilcox.test() for the Mann-Whitney test; Spower with brunnermunzel's brunnermunzel.test() for the Brunner-Munzel test; bfpwr's powertbf01() for the Bayes factor t-test; pwrss's power.t.student() with a margin for the minimum-effect test"
    method: "Formula (no simulation)"
    inputs: ["Names of the two groups and the outcome", "The effect: a standardised mean difference, raw means and SDs, or a point-biserial correlation", "The size of group 2 relative to group 1 (1 = equal)", "Student's or Welch's t-test, the Mann-Whitney or Brunner-Munzel test, a Bayes factor t-test or a minimum-effect test"]
    status: runs_validated
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["Student's or Welch's t-test", "the Mann-Whitney test", "the Brunner-Munzel test, if the groups may differ in spread", "a permutation test"]
  E3:
    rank_test: "the Wilcoxon signed-rank test"
    rank_test_simulated: true
    bayes_test: true
    doc_name: "Paired-samples t-test"
    technical_name: "Paired-samples t-test"
    plain_name: "Compare the same people in two conditions (or before and after)"
    search_words: "dependent t test within subjects within-subjects before after pre post repeated measures cohen's d_z effect size crossover cross-over ab/ba counterbalanced counterbalancing sequential bayes factor optional stopping"
    card_points:
      - "For a crossover (AB/BA), use this card only if the planned analysis is an ordinary paired comparison with no period, sequence or carry-over terms. It does not plan an adjusted crossover analysis or establish that ignoring those effects is reasonable. A dedicated crossover model remains planned."
      - "Planning to stop collecting data once the evidence is clear? Choose the Bayes factor t-test: its result offers a sequential plan (check as you go, with a maximum sample size)."
    template: "basic_test / paired_t"
    backend: "pwr: pwr.t.test(type = 'paired') (Spower simulation if you choose it); Spower's p_wilcox.test(type = 'paired') for the Wilcoxon signed-rank test; bfpwr's powertbf01() for the Bayes factor t-test; pwrss's power.t.student() with a margin for the minimum-effect test"
    method: "Formula (no simulation); simulation for the Wilcoxon signed-rank test"
    inputs: ["Names of the two conditions and the outcome", "The effect: d_z, or the means and SD in your measure's own units", "The t-test, the Wilcoxon signed-rank test, a Bayes factor t-test or a minimum-effect test"]
    status: runs_validated
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["the Wilcoxon signed-rank test", "the sign test"]
  E4:
    rank_test: "Spearman's or Kendall's rank correlation"
    rank_test_simulated: true
    rank_test_simulated_text: "Planning {rank_test} instead? Choose it as the test version on the next screen: powerkit simulates the rank test itself, on scores of the shape you choose (normal, skewed or heavy-tailed) with the correlation you enter."
    doc_name: "Pearson correlation"
    technical_name: "Pearson correlation"
    plain_name: "Test whether two scores are related"
    search_words: "pearson r association"
    template: "basic_test / correlation"
    backend: "pwrss: power.exact.onecor(), the exact distribution of r, as G*Power (pwr's pwr.r.test(), Fisher's z, or Spower simulation if you choose it); Spower's p_r(method = \"spearman\" or \"kendall\") for the rank correlations; BayesFactor's correlationBF() for the Bayes factor test (JASP's Bayes factor), with SuppDists for the distribution of r"
    refs: "Departure 15, Known differences 11 and 12 (docs/conventions.md)"
    method: "Formula (no simulation)"
    inputs: ["Names of the two variables", "The expected correlation r", "Pearson's r, Spearman's rho, Kendall's tau or a Bayes factor test"]
    status: runs_validated
    bayes_test: true
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["Pearson's, Spearman's or Kendall's correlation"]
  E5:
    doc_name: "Test of two proportions (z test; Fisher's exact test as an option)"
    technical_name: "Two independent proportions"
    plain_name: "Compare two groups on a yes/no outcome"
    search_words: "two proportions fisher exact continuity corrected yates"
    template: "basic_test / two_proportions"
    backend: "base R's power.prop.test() for equal groups and pwrss for unequal groups, by the z test as in G*Power with no continuity correction (pwr's Cohen's h or Spower simulation if you choose them); Fisher's exact test if you choose it: pwrss's power.exact.fisher(); the Bayes factor test if you choose it: BayesFactor's contingencyTableBF() (JASP's default contingency table Bayes factor), summed exactly over every possible table"
    refs: "Departures 5, 9, 11 and 15, Known difference 13 (docs/conventions.md)"
    method: "Formula (no simulation)"
    inputs: ["Names of the groups and the outcome", "The expected proportion of 'yes' in each group", "The size of group 2 relative to group 1", "The z test, Fisher's exact test or a Bayes factor test"]
    status: runs_validated
    bayes_test: true
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed with the z test, which matches G*Power to seven decimals; unequal groups (pwrss) match G*Power to seven decimals in the examples checked. No published example has been checked for this design yet."}
    card_points:
      - "Continuity-corrected versions are available for two proportions and 2 by 2 tables. These are simulated and remain in validation; choose the version and sampling plan you will use in your analysis."
      - "Fisher's exact test, an option, is in validation: it matches pwrss called directly in the engine's tests, but hasn't yet been checked against G*Power or a published example."
      - "The Bayes factor test, an option, is in validation: it matches BayesFactor's contingencyTableBF() table by table and simulated studies in powerkit's checks, but hasn't yet been checked against a published example."
    tier: MVP
    alternatives: ["the z test with or without a continuity correction", "Fisher's exact test", "logistic regression"]
  E6:
    doc_name: "Chi-square test of independence"
    technical_name: "Chi-square test of independence"
    plain_name: "Test whether two sets of categories are related"
    search_words: "crosstab contingency table continuity corrected yates"
    template: "basic_test / chi_square_independence"
    backend: "pwr: pwr.chisq.test() (Spower simulation if you choose it); BayesFactor's contingencyTableBF() for the Bayes factor, simulated with Spower"
    method: "Formula (no simulation); simulation for the Bayes factor"
    inputs: ["The categories of each variable", "The expected proportion of people in each combination (adding up to 1), or Cohen's w", "The chi-square test or a Bayes factor"]
    card_points:
      - "Continuity-corrected versions are available for two proportions and 2 by 2 tables. These are simulated and remain in validation; choose the version and sampling plan you will use in your analysis."
      - "Will you analyse the table with a Bayes factor, as in JASP's Bayesian contingency tables? Choose it as the test version: powerkit simulates the chance of strong evidence, with JASP's default sampling plan and prior."
    status: runs_validated
    validation: {file: test-validation-basic-tests.R, note: "Full validation run passed. No published example has been checked for this design yet."}
    tier: MVP
    alternatives: ["the chi-square test with or without a continuity correction (2 x 2 tables)", "Fisher's exact test", "a likelihood-ratio (G) test"]
  E7:
    rank_test: "the aligned rank transform"
    rank_test_simulated: true
    doc_name: "2 x 2 between-participants ANOVA (main effect or interaction)"
    technical_name: "2 × 2 between-subjects ANOVA"
    plain_name: "Two factors crossed, different people in each of the four groups"
    search_words: "factorial two way anova between-subjects between subjects 2x2"
    template: "factorial_anova / 2x2_between"
    backend: "Superpower: ANOVA_exact() (ANOVA_power() if simulation is chosen); Spower with ARTool's art() and artlm() for the aligned rank transform"
    method: "Exact dataset (no repeated simulation)"
    inputs: ["Names of the two factors, their levels and the outcome", "The four expected cell means (raw or in SD units)", "The SD (one, or one per cell)", "Which effect: factor A, factor B or the interaction", "The F test, the aligned rank transform or a Bayes factor"]
    status: runs_validated
    validation: {file: test-validation-anova-2x2-between.R, note: "Full validation run passed. Smallest detectable effect is available for this design."}
    tier: MVP
    alternatives: ["tests of the simple effects", "a planned contrast", "the aligned rank transform, if you analyse ranks"]
  E8:
    rank_test: "the aligned rank transform"
    rank_test_simulated: true
    doc_name: "2 x 2 mixed ANOVA (incl. group × time)"
    technical_name: "2 × 2 mixed ANOVA"
    plain_name: "One factor between people, one within (including group x time)"
    search_words: "repeated measures split plot group by time pre post two way anova mixed design between within 2x2 crossover counterbalanced"
    card_points:
      - "Unequal groups are simulated (Spower, with afex fitting each ANOVA); equal groups are calculated exactly."
      - "A crossover analysis may need period, sequence and carry-over assumptions. This card plans the specified mixed ANOVA; it is not a separately validated crossover analysis. Do not replace an adjusted crossover model with the ordinary paired-test card."
    template: "factorial_anova / 2x2_mixed"
    backend: "Superpower: ANOVA_exact(); for unequal groups, a Spower simulation analysed with afex's aov_car(); Spower with ARTool's art() and artlm() for the aligned rank transform"
    refs: "Departure 2 (ANOVA_exact(), not ANOVA_exact2(); docs/conventions.md)"
    method: "Exact dataset (no repeated simulation)"
    inputs: ["Names of the factors, their levels and the outcome", "The four expected cell means", "The SD", "The correlation between the two repeated measurements", "Which effect: between factor, within factor or the interaction", "The F test, the aligned rank transform or a Bayes factor", "The size of each group"]
    status: runs_validated
    validation: {file: test-validation-anova-2x2-mixed.R, note: "Full validation run passed. Smallest detectable effect is available for this design."}
    tier: MVP
    alternatives: ["for a before-and-after design, ANCOVA on the after score adjusting for the before score", "for a before-and-after design, a t-test on change scores", "a mixed model", "the aligned rank transform, if you analyse ranks (a choice on the next screen)"]
  E9:
    doc_name: "Moderated regression (continuous × continuous)"
    technical_name: "Moderated regression"
    plain_name: "Does the effect of one score depend on another score?"
    template: "regression_interaction / two_way"
    backend: "InteractionPoweR: power_interaction() (power_interaction_r2() only brackets N)"
    method: Simulation
    inputs: ["The interaction's size: the R-squared it adds, or the correlations of X, W and the interaction XW with Y", "Optional: reliability of X, W and Y"]
    status: runs_validated
    validation: {file: test-validation-regression-interaction.R, note: "Full validation run passed on 16 October 2026. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["a latent-variable interaction model that allows for measurement error"]
  E10:
    doc_name: "Simple mediation (PROCESS model 4)"
    technical_name: "Simple mediation"
    plain_name: "X affects Y through one go-between (M)"
    template: "mediation / process_4 (mediator M)"
    backend: "power4mome: power4test() with test_indirect_effect(), Monte Carlo CI"
    method: Simulation
    inputs: ["Standardised paths X -> M, M -> Y and X -> Y"]
    status: runs_validated
    validation: {file: test-validation-mediation-simple.R, note: "Full validation run passed on 16 October 2026. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["a bootstrap confidence interval", "the joint-significance test", "the Sobel test"]
  E11:
    doc_name: "Parallel mediation (PROCESS model 4)"
    technical_name: "Parallel mediation"
    plain_name: "X affects Y through several go-betweens side by side"
    template: "mediation / process_4 (mediators M1, M2, ...)"
    backend: "power4mome: power4test() with test_indirect_effect()"
    method: Simulation
    inputs: ["Whether X is a score or two groups or conditions", "Standardised paths for each mediator", "Correlations between the mediators' residuals", "Which indirect path the hypothesis is about"]
    status: runs_validated
    validation: {file: test-validation-mediation-parallel.R, note: "Full validation run passed on 16 October 2026, with two mediators; three or more not yet tested. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["a bootstrap confidence interval", "the joint-significance test", "testing each specific indirect effect or the total indirect effect"]
  E12:
    doc_name: "Serial mediation (PROCESS model 6)"
    technical_name: "Serial mediation"
    plain_name: "X affects Y through a chain of go-betweens"
    template: "mediation / process_6 (M1 to M4)"
    backend: "power4mome: power4test() with test_indirect_effect()"
    method: Simulation
    inputs: ["Whether X is a score or two groups or conditions", "Standardised paths, every forward path", "Which indirect path the hypothesis is about"]
    status: runs_validated
    validation: {file: test-validation-mediation-serial.R, note: "Full validation run passed on 15 October 2026, with two mediators; three or more not yet tested. A check against a published example is still to come."}
    tier: MVP
    alternatives: ["a bootstrap confidence interval", "the joint-significance test", "testing the full serial path or each shorter path"]
  E13:
    doc_name: "First-stage moderated mediation (PROCESS model 7), index of moderated mediation"
    technical_name: "First-stage moderated mediation"
    plain_name: "Mediation where W changes the X -> M link"
    template: "moderated_mediation / process_7"
    backend: "power4mome: power4test() with test_index_of_mome()"
    method: Simulation
    inputs: ["Standardised paths, including the interaction XW -> M"]
    status: runs_validated
    validation: {file: test-validation-modmed-process7.R, note: "Full validation run passed on 17 October 2026 (the rerun after the power4mome seeding fix). A check against a published example is still to come."}
    refs: "PR #20 (power4mome seeding fix); docs/validation-log.md"
    tier: MVP
    alternatives: ["conditional indirect effects at chosen values of W"]
  E14:
    doc_name: "Second-stage moderated mediation (PROCESS model 14)"
    technical_name: "Second-stage moderated mediation"
    plain_name: "Mediation where W changes the M -> Y link"
    template: "moderated_mediation / process_14"
    backend: "power4mome: power4test() with test_index_of_mome()"
    method: Simulation
    inputs: ["Standardised paths, including the interaction MW -> Y"]
    status: runs_validated
    validation: {file: test-validation-modmed-process14.R, note: "Full validation run passed on 17 October 2026 (the rerun after the power4mome seeding fix). A check against a published example is still to come."}
    refs: "PR #20 (power4mome seeding fix); docs/validation-log.md"
    tier: MVP
    alternatives: ["conditional indirect effects at chosen values of W"]
  E15:
    doc_name: "Moderated regression with a yes/no X or W"
    technical_name: "Moderated regression: binary predictor"
    plain_name: "Does an effect depend on a moderator, when X or W is two groups?"
    template: "regression_interaction / two_way (X or W yes/no)"
    backend: "InteractionPoweR: power_interaction() with k.x1 / k.x2 = 2 (simulation)"
    method: Simulation
    status: runs_validation_in_progress
    validation: {file: test-validation-interaction-binary.R, note: "Agrees with InteractionPoweR called directly and with an independent simulation, and keeps the Type I error at alpha, in the engine's tests. Not yet checked against a published example."}
    card_points:
      - "One of X and W is two groups or conditions, such as a training or waitlist condition, and the other is a score: for example, whether training helps wellbeing more for people higher in trait anxiety."
