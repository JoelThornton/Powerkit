    validation: {file: test-backend-toster.R, note: "Matches TOSTER called directly in the engine's tests, agrees with a large-sample approximation written out in base R, and keeps the chance of wrongly claiming equivalence at or below alpha. Not yet checked against a published example."}
    card_points:
      - "Two one-sided tests (TOST): powerkit works out the chance of showing that the true difference lies inside the equivalence bounds, minus and plus the smallest difference that would matter."
      - "powerkit calculates this for two groups of different people, the same people measured twice, one mean against a fixed value, a correlation, or two groups' proportions, with the same bound on each side."
      - "Non-inferiority, a bound on one side only, is here too: whether a new condition is no worse than the comparison by more than a margin you set, for two groups, the same people twice, one mean or two proportions (pwrss, one-sided test against the margin)."
      - "Not yet in powerkit: minimum-effect tests."
    inputs: ["What you are comparing, and the names", "The equivalence bound and the difference you expect: Cohen's d (d_z for the same people measured twice), or in your measure's own units", "For two groups: the size of group 2 relative to group 1 (1 = equal)", "For a correlation or two proportions: the equivalence bound and the value you expect", "For non-inferiority: the margin, which direction is better, and the difference you expect"]
