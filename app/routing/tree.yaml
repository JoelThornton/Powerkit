    alternatives: ["a confidence interval for the reliability, planned for its width", "McDonald's omega instead of Cronbach's alpha", "Krippendorff's alpha instead of kappa"]
    inputs: ["What you want to show", "The ICC: the value you expect, the value to beat, and the number of ratings", "Cronbach's alpha: the value you expect, the value to beat, and the number of items", "Kappa: the categories, the raters, and the kappa you expect"]
  E44:
    doc_name: "Dyadic data: actor and partner effects (the actor-partner interdependence model)"
