    status: runs_validation_in_progress
    validation: {file: test-validation-survival.R, note: "Matches Hmisc's cpower() and powerSurvEpi's powerEpiCont.default() called directly, power and required N, in the engine's tests, and agrees with simulated log-rank tests and Cox models (within 0.02, the allowance for these large-sample formulas). Not yet checked against published worked examples."}
    card_points:
      - "Two questions about the time until something happens, such as relapse, dropout or disengagement, where some people may not reach the event before the study ends: whether two groups differ in how soon it happens (the log-rank test), and whether a measured score predicts how soon (a Cox regression)."
      - "Power depends on how many events you observe, not on how many people take part. A rare event, or a short follow-up, needs many more people."
      - "For two groups you give the proportion of each who have had the event by a given time, how long recruitment takes and how long people are followed; powerkit assumes the event's rate stays the same over time in each group (exponential times), as Hmisc's cpower() does. For a score you give its hazard ratio per SD and the proportion who will have the event."
