    backend: "TOSTER: power_t_TOST() (the two one-sided tests, exact formula); power_z_cor() for a correlation and power_twoprop() for two proportions (two one-sided z tests); pwrss's power.t.student() and power.z.twoprops() with a margin for non-inferiority (one-sided)"
