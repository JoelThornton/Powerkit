  E-bayes:
    never_screened_out: true
    doc_name: "Bayes factor design (any design)"
    technical_name: "Bayes factor design"
    plain_name: "Plan a study analysed with Bayes factors"
    status: not_in_powerkit
    guide: bayes
    search_words: "Bayes Bayesian Bayes factor BF10 JASP prior"
    card_points:
      - "A Bayes factor says how strongly the data support an effect over no effect, or no effect over an effect. Unlike a p-value, it can give strong evidence that there is no effect. Planning a study for a Bayes factor means finding the sample size that gives a good chance of strong evidence either way."
