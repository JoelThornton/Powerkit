      - "Power is for one effect: the groups' difference, the change over time or conditions, or the interaction (whether the change differs between groups), which is usually the hypothesis in a trial."
      - "Equal or unequal group sizes (unequal groups are simulated). One SD and one correlation for every pair of timepoints or conditions, so that sphericity holds; or an SD for each cell and a correlation for each pair, with the F tests then corrected for sphericity (Greenhouse-Geisser unless you choose otherwise) and the MANOVA approach shown beside it."
    inputs: ["Names of the two factors, their levels and the outcome", "The expected cell means", "The SD", "The correlation between any two timepoints or conditions", "Which effect", "The F test, the aligned rank transform or a Bayes factor", "The size of each group"]
