    status: not_in_powerkit
    generic: true
    established_tools: true
    card_text: "powerkit doesn't cover data from pairs of people whose scores are related (dyadic data), such as couples or a parent and child. Treating the two members as independent people can overstate or understate power, depending on whether the predictor varies between dyads (for example, couples assigned to different conditions) or within dyads (for example, each partner's own stress), so dyadic methods are needed."
    tier: later
  E45:
    doc_name: "Many measurements over time: segmented regression or interrupted time series"
    technical_name: "Interrupted time series"
    plain_name: "A trend over time that may change at a known point"
    search_words: "interrupted time series its segmented regression breakpoint intervention policy change level change slope change trend autocorrelation monthly weekly series before after gls ar1"
    template: "time_series / its"
    backend: "Spower: powerkit's experiment around PITS's simulate_its_data() (the series) and nlme's gls() with AR(1) errors (REML by default; PITS's own maximum-likelihood test, fit_its_model(), on request), simulated"
    method: "Simulation"
    status: runs_validation_in_progress
    validation: {file: test-validation-its.R, note: "Agrees with series drawn and fitted separately (base R and gls() by REML) and, for PITS's own test, with PITS's calculate_power(), with no allowance beyond Monte Carlo error. Not yet checked against a published table."}
    card_points:
      - "One series of equally spaced measurements (for example monthly admissions) with an intervention at a known point. powerkit simulates series like yours with PITS and fits the segmented regression with autocorrelated (AR(1)) errors: an immediate change in level, a change in the trend after the intervention, or both together."
      - "A change is judged against the trend before the intervention, so the number of points before it limits how precisely the change can be measured: past a point, adding points after the intervention barely raises the power."
      - "Autocorrelation makes standard power calculations wrong: too optimistic when it's positive, too pessimistic when it's negative."
      - "In short series these tests find changes that aren't there more often than alpha. powerkit fits the series by REML, which does so less than PITS's own maximum-likelihood test (offered as an option), and shows the rate for the series you plan beside the power."
