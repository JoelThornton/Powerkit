    validation: {file: test-backend-formula-tests.R, note: "Matches pwrss called directly and pwr's pwr.chisq.test() in the engine's tests. Not yet checked against G*Power or a published example."}
    card_points:
      - "The test has one fewer degree of freedom than the number of categories."
      - "Without fixed proportions to compare with, powerkit compares with equal proportions, as pwrss's probs.to.w() does."
    inputs: ["The categories of the variable", "The expected proportion in each category, and the fixed proportions they are compared with, or Cohen's w"]
    tier: v2
    alternatives: ["an exact multinomial test", "a likelihood-ratio (G) test"]
  E49:
    doc_name: "Two independent correlations"
    plain_name: "Compare a correlation between two separate groups"
    template: "basic_test / two_correlations"
    backend: "pwrss: power.z.twocors() (Fisher's z test, by formula)"
    method: "Formula (no simulation)"
    status: runs_validation_in_progress
    validation: {file: test-backend-formula-tests.R, note: "Matches pwrss called directly in the engine's tests. Not yet checked against G*Power or a published example."}
    card_points:
      - "Both groups measure the same two variables; the test compares the correlation between them in one group with that in the other."
      - "For two correlations in the same people (for example, X with Y and X with Z), use the card for two dependent correlations."
    inputs: ["Names of the two groups and the two variables", "The expected correlation in each group", "The size of group 2 relative to group 1"]
    tier: v2
    alternatives: ["a moderated regression with the group as moderator"]
  E50:
    doc_name: "Generic t, F, chi-square and z tests (from a noncentrality parameter)"
    plain_name: "I already have the noncentrality parameter and degrees of freedom for my test"
    template: "generic_test / t, f, chi_square or z"
    backend: "pwrss: power.t.test(), power.f.test(), power.chisq.test() or power.z.test() (by formula)"
    method: "Formula (no simulation)"
    status: runs_validated
    validation: {file: test-backend-generic.R, note: "Matches four G*Power 3.1 examples (t, F, chi-square and z) in the full validation run of 27 October 2026, and pwrss and base R's noncentral distributions in the engine's tests."}
    card_points:
      - "For people who have worked out their test's noncentrality parameter themselves."
      - "There is no sample size: the noncentrality parameter already reflects it. powerkit gives the power for a noncentrality, or the noncentrality needed for a target power."
      - "Only from \"I know my analysis\": the other routes find a design with its own card."
    inputs: ["The test statistic", "The noncentrality parameter and the degrees of freedom"]
    tier: v2
    alternatives: ["the card for your design, which starts from an effect size and a sample size"]
  E51:
    doc_name: "Two dependent correlations"
    plain_name: "Compare two correlations in the same people"
    template: "basic_test / overlapping_correlations, nonoverlapping_correlations"
    backend: "pwrss: power.z.twocors.steiger() (Steiger's z test, unpooled as in G*Power, by formula)"
    method: "Formula (no simulation)"
    status: runs_validated
    validation: {file: test-backend-formula-tests.R, note: "Matches both G*Power 3.1 manual examples (sample size and power) in the full validation run of 27 October 2026, and pwrss in the engine's tests."}
    card_points:
      - "Compares two correlations measured in the same people: either sharing a variable (is X more strongly related to Y or to Z?) or with no variable in common (is the link between stress and sleep stronger at 16 than at 14?)."
      - "Because the same people give both correlations, you also give the correlations between the other pairs of variables: they decide how much the two compared correlations move together."
    inputs: ["Which two correlations, and the variables' names", "The two correlations you are comparing", "The correlations between the other pairs of variables"]
    tier: v2
    alternatives: ["two independent correlations, if each correlation comes from a different group of people"]
  E52:
    doc_name: "One variance against a fixed value"
    plain_name: "Is one group's spread of scores different from a fixed value?"
    template: "basic_test / one_variance"
    backend: "powerkit's formula with base R's stats::pchisq() (the chi-square test of one variance, as the G*Power 3.1 manual gives it, section 26); Spower's p_var.test() simulates it on request"
    method: "Formula (no simulation)"
    status: runs_validated
    validation: {file: test-backend-variance.R, note: "Gives the G*Power 3.1 manual's one-sided and two-sided examples exactly (N = 81 and 103, and its critical value), and agrees with Spower's simulation of the same test (31 October 2026)."}
    card_points:
      - "Compares how spread out one group's scores are (their variance, the SD squared) with a fixed value, such as a published norm."
      - "Calculated exactly, as G*Power does."
    inputs: ["Your outcome's name", "The expected variance and the fixed value"]
    tier: v2
    alternatives: ["the one-sample t-test, if your hypothesis is about the average rather than the spread"]
  E53:
    doc_name: "Two variances (independent groups)"
    plain_name: "Do two groups differ in how spread out their scores are?"
    template: "basic_test / two_variances"
    backend: "powerkit's formula with base R's stats::pf() (the F test of two variances, as the G*Power 3.1 manual gives it, section 15); Spower's p_var.test() simulates it on request"
    method: "Formula (no simulation)"
    status: runs_validated
    validation: {file: test-backend-variance.R, note: "Gives the G*Power 3.1 manual's example exactly (193 per group, actual power 0.800105, and its critical values), and agrees with Spower's simulation of the same test (31 October 2026)."}
    card_points:
      - "Compares how spread out scores are (their variance, the SD squared) in two groups of different people."
      - "Groups of equal size only, for now."
      - "Calculated exactly, as G*Power does."
    inputs: ["Names of the two groups and the outcome", "The expected variance in each group"]
    tier: v2
    alternatives: ["the independent-samples t-test, if your hypothesis is about the average rather than the spread"]
  E57:
    doc_name: "Two variances in the same people (Pitman-Morgan test)"
    plain_name: "Did the same people's scores become more (or less) spread out?"
    template: "basic_test / paired_variances"
    backend: "Spower: p_r() on the sum and the difference of the paired scores (the Pitman-Morgan test, by simulation)"
    method: "Simulation"
    status: runs_validation_in_progress
    validation: {file: test-backend-paired-variances-rank-cor.R, note: "Matches a direct Spower call, recovers the variances and the correlation in its check run, and keeps the Type I error at alpha in the engine's tests. Not yet checked against a published example."}
    card_points:
      - "Compares how spread out the same people's scores are on two occasions or in two conditions, for example whether reaction times become more consistent after training."
      - "Because the same people give both measurements, the test (Pitman and Morgan's) allows for how strongly the two correlate: you give that correlation too."
      - "The answer is simulated, so it carries a little random error; G*Power has no test for this."
    inputs: ["Names of the two measurements and the outcome", "The expected variance at each measurement, and how strongly the two correlate"]
    tier: v2
    alternatives: ["the paired t-test, if your hypothesis is about the average rather than the spread"]
  E59:
    doc_name: "Several outcomes compared across groups (one-way MANOVA; Hotelling's T-squared for two groups)"
    plain_name: "Do two or more groups differ on several outcomes at once?"
    template: "basic_test / manova"
    backend: "Spower: powerkit's p_manova() experiment, multivariate normal scores analysed with stats::manova() (Pillai's trace), by simulation"
    method: "Simulation"
    status: runs_validation_in_progress
    validation: {file: test-validation-manova.R, note: "With two groups it matches Hotelling's T-squared computed exactly (pwrss); with three it matches a simulation written separately, recovers the means, SDs and correlation in its check run, and keeps the Type I error at alpha. Not yet checked against G*Power's own examples."}
    card_points:
      - "Compares groups on several outcomes together, in one test, for example three therapy groups on anxiety, depression and stress. With two groups this is Hotelling's T-squared."
      - "The test is Pillai's trace, as in G*Power. With two groups every MANOVA statistic gives the same answer."
      - "You give each group's expected mean on each outcome, each outcome's SD, and how strongly the outcomes are correlated. That correlation matters: outcomes that go together carry less separate information."
      - "Why means and not one effect size: the simulation draws scores from a population, so it needs each group's means, the SDs and the correlation. A single effect size, such as Pillai's V from a published MANOVA, doesn't say what those are, and no package powerkit builds on turns one into them."
      - "The answer is simulated, so it carries a little random error. G*Power computes Hotelling's T-squared exactly and Pillai's trace with an approximation."
    inputs: ["The groups and the outcomes", "The expected means on each outcome", "Each outcome's SD, and the correlation between the outcomes"]
    tier: v2
    alternatives: ["a separate ANOVA for each outcome, with the significance level adjusted for the number of outcomes", "a discriminant analysis, if the question is which outcomes separate the groups"]
  E60:
    doc_name: "Several outcomes in one group compared with fixed values (one-sample Hotelling's T-squared)"
    plain_name: "Does one group differ from fixed values on several outcomes at once?"
    template: "basic_test / hotelling_one"
    backend: "Spower: powerkit's p_hotelling_one() experiment, multivariate normal scores whose mean vector is tested against the fixed values (stats::anova() of lm(), Pillai's trace), by simulation"
    method: "Simulation"
    status: runs_validation_in_progress
    validation: {file: test-validation-hotelling-one.R, note: "Matches the exact F test of Hotelling's T-squared (pwrss's generic F test with the Mahalanobis distance), recovers the means, SDs and correlation in its check run, and keeps the Type I error at alpha. Not yet checked against G*Power's own example."}
    card_points:
      - "Compares one group's means on several outcomes with fixed values, such as published norms or scale midpoints, in one test: one-sample Hotelling's T-squared."
      - "You give each outcome's expected mean, the value it is compared with, each outcome's SD, and how strongly the outcomes are correlated."
      - "Why means and not one effect size: the simulation draws scores from a population, so it needs the means, the SDs and the correlation. A single effect size doesn't say what those are."
      - "The answer is simulated, so it carries a little random error. G*Power computes this test exactly."
    inputs: ["The outcomes", "The expected means and the fixed values", "Each outcome's SD, and the correlation between the outcomes"]
    tier: v2
    alternatives: ["a one-sample t-test for each outcome, with the significance level adjusted for the number of outcomes"]
  E61:
    doc_name: "A planned meta-analysis: the test of the average effect"
    plain_name: "Will a meta-analysis of the studies I expect to find detect the average effect?"
    search_words: "meta analysis random effects"
    template: "meta_analysis / mean_effect"
    backend: "Under the random-effects model, the Hartung-Knapp test simulated with Spower and metafor's rma(test = \"knha\") (the default), or metapower's mpower() z test by Jackson and Turner's (2017) method; under the fixed-effect model, mpower()'s z test"
    method: "Simulation (Hartung-Knapp) or formula (z test)"
    status: runs_validation_in_progress
    validation: {file: test-validation-meta-analysis.R, note: "Matches simulated meta-analyses (the fixed-effect and DerSimonian-Laird random-effects z tests) for d and r. Not yet checked against Valentine, Pigott and Rothstein's (2010) worked examples, which are ready to transcribe."}
    card_points:
      - "For a systematic review you are planning: how many studies you need, or the power you can expect, for the meta-analysis to detect the average effect."
      - "You give the average effect (Cohen's d or a correlation), the size of a typical study, and how much the studies' true effects are expected to differ (heterogeneity, as I-squared)."
      - "Under the random-effects model, heterogeneity costs power: Jackson and Turner (2017) found that about five or more studies are needed before a random-effects meta-analysis reasonably consistently has more power than the studies in it."
      - "Under the random-effects model powerkit plans for the Hartung-Knapp test by default, which keeps false positives closer to alpha than the z test (IntHout, Ioannidis & Borm, 2014); it is simulated, so the answer carries a little random error. metapower's z test is one click away."
      - "Every study is taken to be the same size. Not yet: power for the test of heterogeneity (metapower's formula disagrees with simulation) or for moderators."
    inputs: ["The outcome, and whether the studies give Cohen's d or a correlation", "The average effect, the size of a typical study and the heterogeneity (I-squared)", "The fixed-effect or the random-effects model, and the test"]
    tier: v2
    alternatives: ["the power of each included study for a range of effects (study-level power, the metameta package), to judge how informative the studies themselves are"]
  E54:
    rank_test: "Friedman's test"
    rank_test_simulated: true
    doc_name: "One-way repeated-measures ANOVA, omnibus"
    plain_name: "Any difference among three or more conditions, the same people in each"
    search_words: "repeated measures within subjects one way anova friedman pairwise post hoc"
    template: "factorial_anova / oneway_within"
    backend: "Superpower: ANOVA_design(\"kw\") and ANOVA_exact() (ANOVA_power() if simulation is chosen)"
    method: "Exact dataset (no repeated simulation)"
    status: runs_validation_in_progress
    validation: {file: test-validation-anova-oneway-within.R, note: "Matches Superpower's ANOVA_exact() and power_oneway_within() called directly in the engine's tests. Not yet in the full validation run, and not yet checked against G*Power or a published example."}
    card_points:
      - "Everyone takes part in every condition, such as three task difficulties or three timepoints, and the test asks whether the condition means differ at all."
      - "Because the same people give every score, you also give the correlation between people's scores in any two conditions: the higher it is, the fewer people you need."
      - "With one SD for every condition and one correlation for every pair, sphericity holds and no correction is needed. If they differ, give an SD for each condition and a correlation for each pair, and choose a Greenhouse-Geisser or Huynh-Feldt correction if you will report the corrected F test; the MANOVA approach, which doesn't assume sphericity, is shown beside it."
      - "Will you analyse the study by comparing pairs of conditions rather than the F test? Choose pairwise comparisons as the test version: powerkit gives the power of the pair you name (a paired t-test), with the p-values of all the pairs adjusted for their number (Holm's or Bonferroni's method), simulated with Superpower."
    inputs: ["Names of the conditions and the outcome", "The expected mean in each condition", "The SD", "The correlation between any two conditions", "The ANOVA, Friedman's test or pairwise comparisons"]
    tier: v2
    alternatives: ["planned contrasts among the conditions", "the multivariate (MANOVA) approach to repeated measures", "a mixed-effects model"]
  E55:
    doc_name: "Mixed ANOVA beyond 2 x 2 (e.g. group by time with three or more timepoints)"
    plain_name: "Groups of different people, each measured in every condition or at every timepoint"
    search_words: "repeated measures split plot group by time anova"
    template: "factorial_anova / mixed"
    backend: "Superpower: ANOVA_design(\"kb*mw\") and ANOVA_exact() (ANOVA_power() if simulation is chosen)"
    method: "Exact dataset (no repeated simulation)"
    status: runs_validation_in_progress
    validation: {file: test-validation-anova-mixed.R, note: "Matches Superpower's ANOVA_exact() called directly in the engine's tests, for the group effect, the time effect and the interaction. Not yet in the full validation run, and not yet checked against G*Power or a published example."}
    card_points:
      - "One factor is different people (such as therapy or waiting list) and the other is measured in everyone (such as before, after and at follow-up). At least one of them has three or more levels."
      - "Power is for one effect: the groups' difference, the change over time or conditions, or the interaction (whether the change differs between groups), which is usually the hypothesis in a trial."
      - "powerkit assumes equal group sizes, the same SD in every cell and the same correlation between every pair of timepoints or conditions. Then sphericity holds, so the test applies no correction for it (such as Greenhouse-Geisser)."
    inputs: ["Names of the two factors, their levels and the outcome", "The expected cell means", "The SD", "The correlation between any two timepoints or conditions", "Which effect"]
    tier: v2
    alternatives: ["ANCOVA on the last timepoint, adjusting for the first", "planned contrasts, such as a linear trend over time by group", "a mixed-effects model", "the multivariate (MANOVA) approach to repeated measures"]
  E56:
    doc_name: "Three-factor ANOVA (2 x 2 x 2 or larger; any mix of between and within factors)"
    plain_name: "Three factors crossed, such as group by time by task"
    search_words: "repeated measures three way anova factorial"
    template: "factorial_anova / factorial_three"
    backend: "Superpower: ANOVA_design() with three factors (such as \"2b*2w*2w\") and ANOVA_exact() (ANOVA_power() if simulation is chosen)"
    method: "Exact dataset (no repeated simulation)"
    status: runs_validation_in_progress
    validation: {file: test-validation-anova-three.R, note: "Matches Superpower's ANOVA_exact() called directly in the engine's tests, for all three main effects, the two-way interactions and the three-way interaction. Not yet in the full validation run, and not yet checked against G*Power or a published example."}
    card_points:
      - "Three factors crossed, every combination appearing, such as group (training or control) by time (before or after) by task difficulty (easy or hard). Each factor is either different people at each level or measured in everyone."
      - "Power is for one effect: a factor's main effect, a two-way interaction, or the three-way interaction (whether a two-way interaction depends on the third factor)."
      - "powerkit assumes equal group sizes, the same SD in every cell and the same correlation between any two conditions a person is measured in. Then sphericity holds, so the test applies no correction for it (such as Greenhouse-Geisser)."
    inputs: ["Names of the three factors, their levels and the outcome", "Which factors everyone is measured in", "The expected cell means", "The SD", "The correlation between any two conditions a person is measured in", "Which effect"]
    tier: v2
    alternatives: ["planned contrasts, such as the two-way interaction at each level of the third factor", "a mixed-effects model, with trials and items as random effects", "the multivariate (MANOVA) approach to repeated measures"]
  E-unsure:
    doc_name: "No matching design (safety net)"
    plain_name: "None of these fit, or I'm not sure"
    status: not_in_powerkit
    generic: true
    card_heading: "powerkit can't advise on this design yet."
    card_text: "We suggest discussing it with a statistician."
    tier: none
  E-bayes:
    never_screened_out: true
    doc_name: "Bayes factor design (any design)"
    plain_name: "Plan a study analysed with Bayes factors"
    status: not_in_powerkit
    not_in_powerkit_heading: "For other designs, not in powerkit yet: use "
    card_points:
      - "For a one-sample, paired or two-group t-test, powerkit plans this itself: on that design's card, choose the Bayes factor t-test as the test version. It finds the chance that the study gives strong evidence (a Bayes factor past your threshold), with bfpwr."
    inputs: ["Prior and expected effect"]
    packages:
      - {name: bfpwr, url: "https://cran.r-project.org/package=bfpwr", what: "Analytic power and sample size for z-test, t-test and normal-moment-prior Bayes factors; powerkit uses it for the t-tests."}
      - {name: BFDA, url: "https://github.com/nicebread/BFDA", what: "Bayes factor design analysis by simulation, fixed-N and sequential (GitHub, not on CRAN)."}
    tier: later

# ---------------------------------------------------------------------------
# "Plan my whole study" (decision-tree.md 4.1). Variables are defined once;
# each analysis the user ticks is routed to an end point by its `rules`
# (first matching rule wins). `when` keys refer to the variable answers
# below; a list means "any of these". A rule may `ask` a follow-up
# question (the same question the tree would ask) before choosing.
# ---------------------------------------------------------------------------
guided:
  intro: "Describe your study's variables once. Then tick the analyses you plan and mark which ones the study must be powered for."
  scope_note: "This route covers different people, each measured once, or measured twice (before and after, or in two conditions). The screening questions have already checked this."
  # Screening answers the guided rules can use (they are added to the
  # variable answers as `times`).
  context: {times: [once, twice]}
  many_conditions_note: "The guided route covers people measured once, or before and after. For three or more conditions per person, continue in 'Help me choose', which keeps your screening answers."
  variables:
    - id: x
      label: "Main predictor (X)"
      options: {cond2: "A condition with two groups (or two existing groups)", within2: "The same people in two conditions, or before and after", cond3: "A condition with three or more groups", score: "A measured score", notsure: "None of these fit / I'm not sure"}
      # Options shown only for some screening answers.
      option_when: {within2: {times: twice}}
    - id: outcome
      label: "Outcome (Y)"
      screen_key: outcome
      # Which options each screening answer allows (plus the safety net).
      screen_map: {score: [score], yesno: [yesno, categories]}
      options: {score: "A score or scale", yesno: "Yes/no", categories: "One of several categories", count: "A count", ordinal: "Ordered categories", notsure: "None of these fit / I'm not sure"}
    - id: mediators
      label: "Mediators (go-betweens)"
      options: {none: "None", one: "One (a score)", several: "Two or more (scores)", notscore: "At least one that isn't a score", notsure: "None of these fit / I'm not sure"}
    - id: moderator
      label: "Moderator (W)"
      options: {none: "None", score: "A measured score", two: "Two groups or conditions", three: "Three or more groups", notsure: "None of these fit / I'm not sure"}
    - id: covariate
      label: "Covariates"
      options: {none: "None", baseline: "A baseline (before) measure of the outcome", other: "Other covariates", notsure: "None of these fit / I'm not sure"}
      # A baseline is a second measurement of the outcome, so it needs S3 "Twice".
      option_when: {baseline: {times: twice}}
  analyses:
    - id: compare
      label: "The effect of X on the outcome"
      rules:
        - {when: {x: within2, outcome: score}, endpoint: E3}
        - {when: {x: within2, outcome: [yesno, categories]}, endpoint: E26}
        - {when: {x: [cond2, cond3], outcome: [yesno, categories], times: twice}, endpoint: E-unsure}
        - {when: {x: cond3, times: twice, outcome: score}, endpoint: E55}
        - {when: {x: score, times: twice, covariate: none}, endpoint: E41}
        - {when: {outcome: categories, x: [cond2, cond3]}, endpoint: E6}
        - {when: {outcome: categories, x: score}, endpoint: E-unsure}
        - {when: {outcome: yesno, x: cond2}, endpoint: E5}
        - {when: {outcome: yesno}, endpoint: E27}
        - {when: {outcome: count, times: once}, endpoint: E28}
        - {when: {outcome: count}, endpoint: E-unsure}
        - {when: {outcome: ordinal, x: cond2, times: once}, endpoint: E29}
        - {when: {outcome: ordinal}, endpoint: E-unsure}
        - when: {x: cond2, covariate: baseline}
          ask:
            doc_id: PP2
            text: "With a baseline measure: which analysis do you plan to use?"
            options:
              - {label: "ANCOVA: the outcome adjusting for the baseline", endpoint: E23}
              - {label: "The 2 x 2 mixed ANOVA interaction (group x time)", endpoint: E8}
        - when: {x: cond2, times: twice}
          ask:
            doc_id: PP2
            text: "Each group is measured twice: which analysis do you plan to use?"
            options:
              - {label: "ANCOVA: the second measurement adjusting for the first", endpoint: E23}
              - {label: "The 2 x 2 mixed ANOVA interaction (group x time)", endpoint: E8}
        - {when: {x: cond2, covariate: other}, endpoint: E23}
        - {when: {x: cond2}, endpoint: E2}
        - {when: {x: cond3}, endpoint: E18}
        - {when: {x: score, covariate: [baseline, other]}, endpoint: E24}
        - {when: {x: score}, endpoint: E4}
    - id: moderation
      label: "Whether the effect of X depends on the moderator (X x W)"
      requires: {moderator: [score, two, three]}
      rules:
        - {when: {times: twice}, endpoint: E41}
        - {when: {x: within2}, endpoint: E41}
        - {when: {outcome: yesno, x: cond2, moderator: two}, endpoint: E47}
        - {when: {outcome: [yesno, categories, count, ordinal]}, endpoint: E32}
        - {when: {moderator: three}, endpoint: E30}
        - {when: {x: cond3}, endpoint: E30}
        - {when: {x: cond2, moderator: two}, endpoint: E7}
        - {when: {x: cond2, moderator: score}, endpoint: E15}
        - {when: {x: score, moderator: two}, endpoint: E15}
        - {when: {x: score, moderator: score}, endpoint: E9}
    - id: mediation
      label: "Whether X affects the outcome through the mediator(s)"
      requires: {mediators: [one, several, notscore]}
      rules:
        - {when: {times: twice}, endpoint: E41}
        - {when: {x: within2}, endpoint: E41}
        - {when: {outcome: [yesno, categories, count, ordinal]}, endpoint: E32}
        - {when: {mediators: notscore}, endpoint: E39}
        - {when: {x: cond3}, endpoint: E42}
        - {when: {x: cond2, mediators: one}, endpoint: E16}
        - {when: {x: score, mediators: one}, endpoint: E10}
        - when: {x: [score, cond2], mediators: several}
          ask:
            doc_id: ME3
            text: "How do the mediators connect?"
            options:
              - {label: "Side by side: X affects each one separately", endpoint: E11}
              - {label: "In a chain: X affects the first, which affects the next", endpoint: E12}
    - id: modmed
      label: "Whether the mediation depends on the moderator (moderated mediation)"
      requires: {mediators: [one, several, notscore], moderator: [score, two, three]}
      rules:
        - {when: {times: twice}, endpoint: E41}
        - {when: {x: within2}, endpoint: E41}
        - {when: {outcome: [yesno, categories, count, ordinal]}, endpoint: E32}
        - {when: {mediators: notscore}, endpoint: E39}
        - when: {x: cond3}
          unmapped: "Moderated mediation with a condition of three or more groups has no end point in decision-tree.md."
          package: {name: power4mome, url: "https://cran.r-project.org/package=power4mome", what: "Power for any moderated mediation model written in lavaan syntax (no ready-made template)."}
        - when: {moderator: three}
          unmapped: "Moderated mediation with a moderator of three or more groups has no end point in decision-tree.md."
          package: {name: power4mome, url: "https://cran.r-project.org/package=power4mome", what: "Power for any moderated mediation model written in lavaan syntax (no ready-made template)."}
        - {when: {mediators: several}, endpoint: E40}
        - {when: {x: cond2}, endpoint: E17}
        - {when: {moderator: two}, endpoint: E17}
        - when: {x: score, moderator: score, mediators: one}
          ask:
            doc_id: MM4
            text: "Which link depends on the moderator?"
            options:
              - {label: "The link from X to the mediator", endpoint: E13}
              - {label: "The link from the mediator to the outcome", endpoint: E14}
              - {label: "Both links, or X to the mediator and the direct link", endpoint: E38}
  combination_rules:
    - id: each
      label: "Each result is a separate claim"
      note: "Each analysis answers its own question and is tested at the usual significance level (alpha). No adjustment is needed (Rubin, 2021). Not everyone agrees: under the more common error-statistical view of significance testing, an adjustment may be expected when the analyses form a related group, especially if some could go unreported (Mayo, 2018)."
    - id: all
      label: "The claim needs every result to be significant"
      note: "No adjustment to alpha is needed, because the claim only stands if every test succeeds. But the chance that all of them succeed together is lower than each test's power, so each test needs a higher target power (for two tests and 80% together, about 89.4% each)."
    - id: any
      label: "Any one significant result supports the claim"
      note: "Several chances to find an effect raise the risk of a false positive, so it needs an alpha correction: each test uses a stricter alpha, divided by the number of main analyses (the Bonferroni correction). This raises the sample size needed."
  # Relationships that several analyses share, for the consistency check
  # (decision-tree.md 4.2). The plan lists the ticked analyses that share each.
  shared_relationships:
    - id: x_y
      label: "the effect of X on the outcome"
      in: [compare, moderation, mediation]
      note: "In mediation this is the total effect (indirect plus direct)."
    - id: x_m
      label: "the effect of X on the mediator"
      in: [mediation, modmed]
  # Values entered once on the plan (open question 12, decided 26 October
  # 2026: docs/decisions.md). Each is the same input, under the same name,
  # on the input screens listed (end point: field id). A value typed on one
  # analysis's input screen fills the others' when they are opened from the
  # plan; it stays editable there. Only identical inputs are listed: an
  # effect that one form asks for in another way (Cohen's d against cell
  # means, a total effect against a direct path) is not converted.
  shared_values:
    - id: r_x_y
      label: "Correlation of X with the outcome"
      fields: {E4: r, E9: r_X_Y}
    - id: r_x_w
      label: "Correlation of X with the moderator"
      fields: {E9: r_X_W, E13: c_X_W, E14: c_X_W}
    - id: p_x_m
      label: "Path X -> M"
      fields: {E10: p_X_M, E13: p_X_M, E14: p_X_M}
    - id: p_m_y
      label: "Path M -> Y"
      fields: {E10: p_M_Y, E13: p_M_Y, E14: p_M_Y}
    - id: p_x_y
      label: "Path X -> Y (direct)"
      fields: {E10: p_X_Y, E13: p_X_Y, E14: p_X_Y}

# ---------------------------------------------------------------------------
# Glossary: a one-line plain-English hint for each technical term in the
# cards' "What you would enter" lists, shown beside the input. `pattern` is
# a case-insensitive (Perl) regular expression that finds the term. Hints
# say what a term means; they never say what value to choose (where effect
# sizes come from is an open judgement call, 3.2). docs/glossary.md lists
# the same terms; a test keeps the two in step.
# ---------------------------------------------------------------------------
# The families "I know my analysis" groups its list into, in order (the
# maintainer's decision of 31 October 2026, docs/decisions.md): every end
# point but the safety net is in exactly one (a test checks).
analysis_families:
  - {id: means, label: "Comparing averages (t-tests)", endpoints: [E1, E2, E3]}
  - {id: anova, label: "ANOVA and ANCOVA", endpoints: [E18, E54, E7, E8, E22, E21, E20, E55, E56, E19, E23]}
  - {id: correlation, label: "Correlations", endpoints: [E4, E49, E51]}
  - {id: categories, label: "Yes/no, categories and ordered categories", endpoints: [E25, E5, E26, E6, E48, E29]}
  - {id: regression, label: "Regression (scores, yes/no and counts)", endpoints: [E24, E27, E47, E28]}
  - {id: moderation, label: "Moderation (interactions)", endpoints: [E9, E15, E31, E30, E32]}
  - {id: mediation, label: "Mediation and moderated mediation", endpoints: [E10, E11, E12, E16, E39, E42, E13, E14, E40, E17, E38]}
  - {id: multilevel, label: "Multilevel, clustered and longitudinal designs", endpoints: [E33, E34, E41, E35, E45, E44]}
  - {id: latent, label: "Latent variables and questionnaires (SEM, CFA, profiles)", endpoints: [E37, E58]}
  - {id: outcomes, label: "Several outcomes at once (MANOVA)", endpoints: [E59, E60]}
  - {id: spread, label: "Spread of scores (variances)", endpoints: [E52, E53, E57]}
  - {id: equivalence, label: "Showing there's no meaningful effect (equivalence, non-inferiority)", endpoints: [E36]}
  - {id: meta, label: "Meta-analysis", endpoints: [E61]}
  - {id: other, label: "Other: time-to-event, precision, Bayes factors and generic tests", endpoints: [E43, E46, E-bayes, E50]}

glossary:
  - {term: "Cohen's d", pattern: "Cohen's d", hint: "A difference between two averages, measured in standard deviations: 0.5 means the averages are half a standard deviation apart."}
  - {term: "Cohen's w", pattern: "Cohen's w", hint: "How far the proportions are from what you would see with no association (or from the fixed proportions), on one scale: 0 means no difference at all."}
  - {term: "I-squared", pattern: "I-squared", hint: "The share of the variation in the studies' results that comes from real differences between their effects, rather than chance."}
  - {term: "d_z", pattern: "\\bd_z\\b", hint: "The average change within people (for example, after minus before), divided by how much that change varies from person to person."}
  - {term: "SD (standard deviation)", pattern: "\\bSDs?\\b", hint: "How spread out the scores are around their average."}
  - {term: "pooled SD", pattern: "pooled SD", hint: "The two groups' standard deviations combined into one, weighted by the groups' sizes."}
  - {term: "SD units", pattern: "SD units", hint: "Differences expressed in standard deviations rather than in the outcome's own units (raw)."}
  - {term: "Student's or Welch's test", pattern: "Student's or Welch's", hint: "Two versions of the t-test: Student's assumes the two groups' scores are equally spread out; Welch's doesn't."}
  - {term: "correlation (r)", pattern: "(?<!intraclass )\\bcorrelations?\\b", hint: "A number from -1 to 1 for how closely two measures go up and down together; 0 means no straight-line relationship."}
  - {term: "repeated measurements", pattern: "repeated[- ]measure(ment)?s|between conditions", hint: "The same people measured more than once (for example, before and after, or in each condition); their scores on different occasions usually go together."}
  - {term: "cell means", pattern: "cell means|four expected means", hint: "The expected average in each combination of the factors, such as praise with a hard task (each combination is a 'cell')."}
  - {term: "factor and levels", pattern: "(?<!Bayes )\\bfactors?\\b", hint: "A factor is something you vary or compare (for example, feedback); its levels are its versions (for example, praise and none)."}
  - {term: "between factor and within factor", pattern: "between factor|within factor", hint: "A between factor has different people at each level; a within factor has the same people at every level."}
  - {term: "interaction", pattern: "\\binteractions?\\b", hint: "Whether the effect of one factor or variable depends on the level of another."}
  - {term: "reliability", pattern: "\\breliabilit(y|ies)\\b", hint: "How consistently a measure gives the same result; 1 means no measurement error."}
  - {term: "standardised paths", pattern: "standardised paths|fully standardised", hint: "The strength of each arrow in the model (for example, X to M), expressed in standard deviations so that arrows between differently scaled measures can be compared."}
  - {term: "standardised coefficient", pattern: "standardised coefficient", hint: "A regression coefficient with every variable measured in standard deviations: how many SDs the outcome changes when the predictor (here, the three-way product) is one SD higher."}
  - {term: "Monte Carlo draws per CI", pattern: "Monte Carlo draws", hint: "How many random draws are used to build each confidence interval for the indirect effect; more draws give a more stable interval."}
  - {term: "residuals", pattern: "residuals", hint: "The part of each mediator that X doesn't explain; their correlation says how much the mediators overlap beyond X."}
  - {term: "indirect path", pattern: "indirect (path|effect)", hint: "The route from X to the outcome through a mediator (X to M to Y)."}
  - {term: "contrast weights", pattern: "contrast weights", hint: "Numbers that say which groups a specific comparison sets against which (for example, 1, 1 and -2 compare the first two groups together with the third)."}
  - {term: "adjusted group means", pattern: "adjusted", hint: "Group averages after taking the covariate into account."}
  - {term: "covariate", pattern: "covariate", hint: "A variable measured alongside the outcome (for example, a before score) that the analysis takes into account."}
  - {term: "R-squared", pattern: "R-squared", hint: "The share of the differences in the outcome that the predictors explain, from 0 to 1."}
  - {term: "R-squared change", pattern: "R-squared change", hint: "How much R-squared goes up when the predictor or predictors of interest are added."}
  - {term: "discordant proportions", pattern: "discordant", hint: "Among people measured twice, the share who change from yes to no and the share who change from no to yes."}
  - {term: "odds ratio", pattern: "odds ratio", hint: "How many times higher the odds of 'yes' (the chance of yes divided by the chance of no) are in one group than in another; 1 means no difference."}
  - {term: "rate ratio", pattern: "rate ratio", hint: "How many times higher the average count is in one group than in another; 1 means no difference."}
  - {term: "product terms", pattern: "products", hint: "Two predictors multiplied together (for example, x1 times x2), which is how a regression represents an interaction."}
  - {term: "fixed effects", pattern: "fixed effects?", hint: "The effects you're testing (for example, of a condition), taken to be the same for everyone."}
  - {term: "variance", pattern: "\\bvariances?\\b(?! components)", hint: "How spread out the scores are: the SD squared."}
  - {term: "variance components", pattern: "variance components", hint: "How much scores vary because some participants, and some stimuli, score higher or lower than others overall."}
  - {term: "intraclass correlation (ICC)", pattern: "intraclass correlation|\\bICC\\b", hint: "How similar people in the same group (for example, the same class) are, compared with people in different groups, from 0 to 1."}
  - {term: "cluster size", pattern: "cluster size", hint: "How many people there are in each group (for example, pupils per class)."}
  - {term: "equivalence bounds", pattern: "equivalence bounds?", hint: "The smallest difference you would care about, in each direction; a difference inside them counts as negligible."}
  - {term: "RMSEA", pattern: "\\bRMSEA\\b", hint: "A number summarising how far a model's predictions are from the data, allowing for the model's complexity; smaller means a closer fit."}
  - {term: "relative indirect effects", pattern: "relative indirect effects", hint: "With three or more groups, the indirect effect for each group compared with one chosen reference group."}
  - {term: "breakpoint", pattern: "breakpoint", hint: "The point in time at which the trend may change (for example, when an intervention started)."}
  - {term: "level and slope", pattern: "level and slope", hint: "The level is how high the trend is; the slope is how fast it rises or falls."}
  - {term: "autocorrelation", pattern: "autocorrelation", hint: "How much each measurement depends on the ones just before it."}
  - {term: "mediator", pattern: "\\bmediators?('s|s')?\\b", hint: "A variable through which X affects the outcome (a go-between)."}
  - {term: "predictor", pattern: "\\bpredictors?\\b", hint: "A variable used to explain or predict the outcome."}
  - {term: "confidence interval (CI)", pattern: "\\bCI\\b", hint: "A range of plausible values for an effect, estimated from the data."}
  - {term: "prior", pattern: "\\bprior\\b", hint: "The range of effect sizes you consider plausible before seeing the data, written as a distribution."}
  # Terms in the cards' standard names and backend lines (16 October 2026).
  # Sources: docs/card-sources.md.
  - {term: "omnibus test", pattern: "\\bomnibus\\b", hint: "A single overall test of whether there are any differences among all the groups or conditions at once; it doesn't say which ones differ."}
  - {term: "ANOVA", pattern: "\\bANOVA\\b", hint: "Analysis of variance: a test of whether the average outcome differs across the levels of one or more factors."}
  - {term: "main effect", pattern: "\\bmain effects?\\b", hint: "The effect of one factor averaged over the levels of the other factor or factors."}
  - {term: "between-participants and within-participants", pattern: "\\b(?:between|within)-participants\\b", hint: "Between-participants means different people take part at each level of a factor; within-participants means the same people take part at every level."}
  - {term: "mixed design", pattern: "\\bmixed(?= ANOVA)", hint: "A design with at least one factor that compares different people (between-participants) and at least one that measures the same people repeatedly (within-participants), such as group × time."}
  - {term: "ANCOVA", pattern: "\\bANCOVA\\b", hint: "Analysis of covariance: an ANOVA that also takes into account one or more continuous measured variables (covariates), such as a baseline score."}
  - {term: "planned contrast", pattern: "\\bplanned contrasts?\\b", hint: "One specific comparison of group averages (for example, the average of groups 1 and 2 against group 3), planned in advance rather than chosen after seeing the results."}
  - {term: "z test (two proportions)", pattern: "\\bz test\\b", hint: "A test of whether the share of 'yes' differs between two groups, based on the normal (bell-curve) approximation to the counts."}
  - {term: "continuity correction", pattern: "\\bcontinuity correction\\b", hint: "A slight adjustment to the normal approximation for counts that moves the observed difference toward zero before testing."}
  - {term: "chi-square test of independence", pattern: "\\bchi-square test of independence\\b", hint: "A test of whether two categorical variables (for example, group and a yes/no answer) are related, using a table of counts."}
  - {term: "McNemar's test", pattern: "\\bMcNemar'?s test\\b", hint: "A test of whether the share of 'yes' answers differs between two yes/no measurements on the same people (or on matched pairs)."}
  - {term: "Cochran's Q", pattern: "\\bCochran'?s Q\\b", hint: "An extension of McNemar's test to three or more yes/no measurements on the same people."}
  - {term: "logistic regression", pattern: "\\blogistic regression\\b", hint: "A regression for a yes/no outcome: it models the log of the odds of 'yes' from the predictors."}
  - {term: "Poisson or negative binomial", pattern: "\\bPoisson\\b|\\bnegative binomial\\b", hint: "Regressions for count outcomes (how many times something happens); Poisson assumes the counts vary as much as their average, while negative binomial allows them to vary more than that."}
  - {term: "ordinal outcome", pattern: "\\bordinal\\b", hint: "An outcome whose categories have a natural order (for example, never, sometimes, often) but where the steps between neighbouring categories need not be equal."}
  - {term: "PROCESS model number", pattern: "\\bPROCESS models? [0-9]+(?:, [0-9]+)*", hint: "PROCESS is Andrew Hayes's tool for mediation and moderation analysis; each model number picks one set arrangement of predictor, mediators and moderators, as numbered in Appendix A of Hayes's book (model 4 is mediation)."}
  - {term: "index of moderated mediation", pattern: "\\bindex of moderated mediation\\b", hint: "How much the indirect effect (X to mediator to outcome) changes when the moderator goes up by one unit."}
  - {term: "Monte Carlo CI", pattern: "\\bMonte Carlo(?= CI\\b)", hint: "A confidence interval built by simulating many sets of the model's estimates from their estimated uncertainty, computing the effect for each set, and keeping the middle 95% of the results."}
  - {term: "ANOVA_exact() (exact)", pattern: "\\bANOVA_exact\\(\\)", hint: "Superpower's quick method: it builds one data set whose means, standard deviations and correlations exactly match the ones you enter, analyses it once, and works out power from that result instead of simulating many data sets."}
  - {term: "simulation (ANOVA_power())", pattern: "(?<!repeated )\\bsimulation\\b", hint: "Estimating power by generating many random data sets from the design and counting how often the test comes out significant."}
  - {term: "brackets N (power_interaction_r2())", pattern: "\\bpower_interaction_r2\\(\\) only brackets N\\b", hint: "InteractionPoweR's power_interaction_r2() is a quick formula-based power calculation; powerkit uses it only to narrow down the range of sample sizes to search, and the reported power comes from the simulation in power_interaction()."}
  - {term: "k.x1 / k.x2 = 2", pattern: "\\bk\\.x1 / k\\.x2 = 2\\b", hint: "Settings that tell InteractionPoweR's simulation to give x1 or x2 only two possible values, so it becomes a yes/no variable."}
  - {term: "rbinary_rs() (x_fun)", pattern: "(?:\\bx_fun = )?\\brbinary_rs\\(\\)", hint: "Tells power4mome to generate X as a yes/no variable (0 or 1, with a chosen chance of 1) instead of from a normal distribution; the 0/1 values are then rescaled to a chosen mean and standard deviation."}
  - {term: "multilevel or cluster design", pattern: "\\bmultilevel\\b|\\bcluster design\\b", hint: "A design in which people are grouped (for example, pupils within classes, or patients within doctors), so people in the same group tend to be more alike than people in different groups."}
  - {term: "growth curves", pattern: "\\bgrowth curves?\\b", hint: "Models of how each person's scores change over repeated occasions (their trajectory, for example a straight line up or down), and of the average trajectory across people."}
  - {term: "cross-lagged panel", pattern: "\\bcross-lagged panels?\\b", hint: "A model for two measures (X and Y) recorded at several time points that estimates how each one predicts the other at the next time point, alongside how stable each is over time."}
  - {term: "experience sampling", pattern: "\\bexperience sampling\\b", hint: "An intensive longitudinal design in which participants answer a questionnaire each time they are prompted (a 'beep'), several times within a day."}
  - {term: "CFA", pattern: "\\bCFA\\b", hint: "Confirmatory factor analysis: a model in which answers to many questionnaire items are explained by fewer underlying, unobserved traits (factors) that you specify."}
  - {term: "SEM and model fit", pattern: "\\bSEM model fit\\b|\\bSEM\\b", hint: "Structural equation modelling: a family of models that combines regressions among variables with unobserved (latent) variables measured by several items; model fit is how closely the relationships the model implies match those in the data."}
  - {term: "measurement invariance", pattern: "\\bmeasurement invariance\\b", hint: "Whether a questionnaire measures the same underlying trait in the same way in different groups (or on different occasions), checked by requiring parts of the measurement model, such as item loadings, to be equal across them."}
  - {term: "equivalence test (TOST)", pattern: "\\bequivalence test(?: \\(TOST\\))?|\\bTOST\\b", hint: "A test that aims to show there is no meaningful effect: two one-sided tests (TOST) check that the effect lies above the lower equivalence bound and below the upper one."}
  - {term: "precision planning", pattern: "\\bprecision planning\\b", hint: "Choosing the sample size so that the confidence interval around the estimate is expected to come out no wider than a target width."}
  - {term: "Bayes factor", pattern: "\\bBayes factors?\\b", hint: "A ratio that says how strongly the data support one hypothesis compared with a competing one (often 'no effect'), used instead of a p-value."}

