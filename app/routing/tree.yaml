    card_points:
      - "Compares one group's means on several outcomes with fixed values, such as published norms or scale midpoints, in one test: one-sample Hotelling's T-squared."
      - "You give each outcome's expected mean, the value it is compared with, each outcome's SD, and how strongly the outcomes are correlated."
      - "Why means and not one effect size: the power depends on how far the means are from the fixed values once the SDs and the correlation are allowed for, and a single effect size doesn't say what those are."
      - "Calculated exactly, as G*Power does."
    inputs: ["The outcomes", "The expected means and the fixed values", "Each outcome's SD, and the correlation between the outcomes"]
    tier: v2
    alternatives: ["a one-sample t-test for each outcome, with the significance level adjusted for the number of outcomes"]
  E61:
    doc_name: "A planned meta-analysis: the test of the average effect"
    technical_name: "Meta-analysis"
    plain_name: "Will a meta-analysis of the studies I expect to find detect the average effect?"
    search_words: "meta analysis random effects moderator subgroup"
    template: "meta_analysis / mean_effect, subgroups, dependent_effects, meta_regression or heterogeneity"
    backend: "Under the random-effects model, the Hartung-Knapp test simulated with Spower and metafor's rma(test = \"knha\") (the default), or metapower's mpower() z test by Jackson and Turner's (2017) method; under the fixed-effect model, mpower()'s z test"
    method: "Simulation (Hartung-Knapp) or formula (z test)"
    status: runs_validation_in_progress
    validation: {file: test-validation-meta-analysis.R, note: "Matches simulated meta-analyses (the fixed-effect and DerSimonian-Laird random-effects z tests) for d and r. Not yet checked against Valentine, Pigott and Rothstein's (2010) worked examples, which are ready to transcribe."}
    card_points:
      - "For a systematic review you are planning: how many studies you need, or the power you can expect, for the meta-analysis to detect the average effect."
      - "You give the average effect (Cohen's d or a correlation), the size of a typical study, and how much the studies' true effects are expected to differ (heterogeneity, as I-squared)."
      - "Under the random-effects model, heterogeneity costs power: Jackson and Turner (2017) found that about five or more studies are needed before a random-effects meta-analysis reasonably consistently has more power than the studies in it."
      - "Under the random-effects model powerkit plans for the Hartung-Knapp test by default, which keeps false positives closer to alpha than the z test (IntHout, Ioannidis & Borm, 2014); it is simulated, so the answer carries a little random error. metapower's z test is one click away."
      - "It can also test whether the effect differs between kinds of study (a subgroup or moderator analysis, such as lab against online studies), by the between-groups Q test, with the Hartung-Knapp version by default under the random-effects model."
      - "When studies give several effect sizes each (several outcomes or time points), POMADE plans for the robust test of the average effect, allowing for heterogeneity between and within studies and for the correlation of a study's estimates."
      - "It can also plan a meta-regression on a score measured on each study (such as the participants' mean age), and the test of heterogeneity (whether the studies' true effects differ at all), both simulated with metafor."
      - "Every study is taken to be the same size."
    inputs: ["The outcome, and whether the studies give Cohen's d or a correlation", "The average effect, the size of a typical study and the heterogeneity (I-squared)", "The fixed-effect or the random-effects model, and the test"]
    tier: v2
    alternatives: ["the power of each included study for a range of effects (study-level power, the metameta package), to judge how informative the studies themselves are"]
  E54:
    rank_test: "Friedman's test"
