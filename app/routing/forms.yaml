  # One test version of a card that otherwise calculates here: the Bayes
  # factor of a repeated-measures ANOVA effect (about 0.8 s per simulated
  # study; the preview simulates the no-effect side too, so about four
  # minutes). The full analysis is the R script.
  # A test version of a long-run card that is quick enough to run like any
  # other simulated card, required sample size included (R/simulations.R,
  # runs_long()): Cochran's Q on the repeated-measures card, about 0.015 s
  # per simulated study (measured 16 November 2026).
  quick_methods:
    E75: [cochran_q]
  method_routes:
    E54: {method: bayes_factor, full_run: [], preview: {power: 240}, script: {power: "about 40 minutes on one core (an estimate)", sample_size: "several hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}}
    E20: {method: bayes_factor, full_run: [], preview: {power: 240}, script: {power: "about 40 minutes on one core (an estimate)", sample_size: "several hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}}
    E8: {method: bayes_factor, full_run: [], preview: {power: 240}, script: {power: "about 40 minutes on one core (an estimate)", sample_size: "several hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}}
    # The Bland-Altman limits of agreement, simulated (about 0.035 s per
    # simulated study with SimplyAgree's agreement_limit(); a required N
    # took about 4 minutes on one core, measured 14 November 2026). Lu et
    # al.'s approximation is a formula and calculates here.
    # Clustered yes/no outcomes simulated with glmer() (about 0.1 s per
    # simulated study, measured 15 November 2026); powertools' formula
    # calculates here.
    E34: {method: glmer_simulation, full_run: [power], preview: {power: 15}, full: {power: 120}, script: {power: "about 2 minutes on one core", sample_size: "about 15 to 30 minutes on one core (an estimate; 5 to 8 sample sizes are simulated)"}}
    E69: {method: [mover, bland_altman], full_run: [power], preview: {power: 5}, full: {power: 40}, script: {power: "under a minute on one core", sample_size: "about 5 minutes on one core (an estimate; 5 to 8 sample sizes are simulated)"}}
    E55: {method: bayes_factor, full_run: [], preview: {power: 240}, script: {power: "about 40 minutes on one core (an estimate)", sample_size: "several hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}}
    # The three-factor ANOVA's Bayes factor: about 1 s per simulated study
    # between participants and 5 s with repeated measures (anovaBF() fits
    # 18 models), so the preview, which simulates the no-effect side too,
    # takes about 7 to 30 minutes.
    E56: {method: bayes_factor, full_run: [], preview: {power: 1600}, script: {power: "about 20 minutes to 2 hours on one core (an estimate)", sample_size: "several hours on one core, longer with a factor everyone is measured in (an estimate; 5 to 8 sample sizes are simulated)"}}
# Whole-study simulation (experimental; R/whole-study.R, docs/conventions.md
# Departure 13): the choices of how many simulated studies, and the usual
# run time on one core, from seconds per simulated study for each analysis
# (each is fitted to every simulated study) plus a fixed overhead for the
# check run. Measured on the development machine; see docs/status.md.
whole_study:
  # The app runs a quick look; the full run and the sample size search run
  # on the user's computer, from the script (export_whole_study_script()).
  quick_nrep: 200
  full_nrep: 1000
  # A sample size search simulates about this many times the replications
  # of one full run (short bracketing runs, then 7 to 13 sizes of nrep
  # each, then the full run at the n found).
  search_runs: [9, 15]
  target_powers: [0.8, 0.85, 0.9, 0.95]
  seconds_per_replication: {x_y: 0.02, x_m: 0.02, interaction: 0.03, indirect: 0.15, index_of_mome: 0.25, anova_effect: 0.01}
  overhead_seconds: 15
  # A rough power curve in the app (whole_study_curve()), for experiments
  # and regressions only: a mediation's intervals are too slow to run here.
  curve_nrep: 200
  curve_multipliers: [0.5, 0.75, 1, 1.5, 2]

# Departures from the wrapped tool's conventions, shown on the result screen
# (CLAUDE.md). Each condenses its entry in docs/conventions.md, "Departures".
departures:
  "38": "Group treatment trial with a score: Powerkit tests the difference with Welch-Satterthwaite degrees of freedom, the usual ones for comparing the people taking part individually with the groups' means, and what a mixed model's Satterthwaite test gives. powertools' irgtt.cont() uses the same variance but computes the degrees of freedom another way and gets about half as many, so it gives less power when there are few groups: 51% rather than 55% with 10 groups of 8 and 80 people taking part individually (ICC 0.1, d = 0.4), and up to about 12 percentage points less with 4 to 6 groups. With 30 or more groups the two differ by about a point."
  "37": "Bayes factor t-tests with an informed prior (a centre other than 0, or degrees of freedom other than 1): Powerkit works out the chance of evidence exactly from bfpwr's own Bayes factor, because bfpwr's power function, powertbf01(), gives wrong answers for informed priors in small samples. With a prior centred on 0.3 (scale 0.15), an expected effect of 0.4 (SD 0.1) and a threshold of 10, 10 people give a 5.4% chance of strong evidence (5.5% in simulated studies), where powertbf01() gives 0; from about 30 people the two agree within a point or two."
  "35": "A measured score in a Cox regression: Powerkit counts both tails of the two-sided test, so with no effect the power is alpha (5%). powerSurvEpi's formula counts only the tail in the effect's direction, which gives alpha / 2 with no effect and too little with small effects (4.5% against 5.8% for a hazard ratio of 1.05 with 100 people); for effects worth planning for the difference is well under 0.001."
  "36": "The z test of one proportion (R's prop.test()): Powerkit sums the chance of every possible count where prop.test() would be significant, so the power is the test's own, with no approximation. pwrss and the textbook formula use a normal approximation, which can be off by a few percentage points either way: for 20% against 10% at 80% power, 78 people rather than pwrss's 86 without the continuity correction, and 89 rather than 96 with it."
  "34": "Cronbach's alpha: for a two-sided test Powerkit counts both tails of Bonett and Wright's z test, so at the null value the power is alpha (5%). statpsych's sample-size formula counts only the tail in the effect's direction, which gives alpha / 2 there; with an effect worth planning for the other tail adds well under 0.0001, so the sample size is statpsych's."
  "33": "Equivalence of a correlation or of two proportions: Powerkit works out the power of the test TOSTER runs (two one-sided z tests, on Fisher's z for a correlation, with the unpooled standard error for two proportions) with pwrss. TOSTER's own planning functions give different answers: power_z_cor() ignores the expected correlation (for r = 0.1, bounds of 0.2 and 500 people it gives 99.6%, against 73.8%), and power_twoprop() applies the distance to the nearer bound on both sides (0% against 47.5% for 0.5 and 0.55, bounds of 0.1 and 500 per group)."
  "32": "Two variances: Powerkit plans for the Brown-Forsythe test unless you choose Levene's test or the F test. G*Power plans for the F test, which assumes normal scores: with skewed or heavy-tailed scores its chance of a false positive is far above alpha (12% and 43% at alpha .05 with 100 per group), while the Brown-Forsythe test keeps it near 5%. With normal scores the Brown-Forsythe test has a little less power: 46.6% against the F test's 51.8% for variances of 1.5 and 1 and 200 people."
  "29": "The ICC: Powerkit works out the F test's power from its exact distribution (Donner and Eliasziw, 1987), unless you choose ICC.Sample.Size's approximation (Walter, Eliasziw and Donner), which asks for a few more people than needed: for an ICC of 0.8 against 0.6 with 3 raters, one-sided, 80% power needs 26 subjects by the exact power and 27 by the approximation."
  "26": "Repeated measures with SDs or correlations that differ: Powerkit plans for the Greenhouse-Geisser corrected F test unless you choose otherwise; Superpower applies no correction by default. Without sphericity the uncorrected F test gives false positives more often than alpha (6.7% rather than 5% in 40,000 simulated studies with three conditions, SD 100, correlations .8, .5 and .2 and 40 people), so its higher power is not a fair figure. With means 600, 620 and 650 in that example, 40 people give 68.4% power with the correction against 80.5% without, and 80% power needs 52 people rather than 40. That corrected figure comes from Superpower's exact dataset, an approximation; simulated studies of the corrected test, powerkit's default here (Departure 28), gave 71.5%."
  "27": "Bland-Altman limits of agreement: Powerkit simulates the analysis you will run, SimplyAgree's agreement_limit() with MOVER confidence intervals, unless you choose Lu et al.'s (2016) formula, the one SimplyAgree's blandPowerCurve() gives. The formula approximates Bland and Altman's analysis and can be several points off in either direction, and Bland and Altman's intervals are too narrow in small samples (at 30 subjects about 5% of studies wrongly show agreement where 2.5% should), which the MOVER intervals avoid. With a bias of 0.5, an SD of the differences of 2.5 and a margin of 8, the formula gives 80% power at 26 subjects; the MOVER analysis has about 69% there and needs 33."
  "28": "Repeated measures with a sphericity correction and SDs or correlations that differ: Powerkit simulates the corrected F test by default (Superpower's ANOVA_power()), where Superpower's ANOVA_exact() and G*Power scale the test's noncentrality and degrees of freedom by epsilon. That scaling is an approximation that can miss the corrected test's power by a few points either way: with means 600, 620 and 650, SD 100, correlations .8, .5 and .2 and 40 people, 68.4% from the exact dataset against 71.5% in 40,000 simulated studies; in a mixed design with 20 people per group, 23.1% against 21.7%. The exact dataset stays available, as an approximation, and finds the smallest detectable effect."
  "25": "Precision planning: for d, a standardised mean and a regression coefficient, Powerkit plans for a chance (assurance) that the interval is no wider than your target, unless you choose MBESS's default of the expected width. An expected width is an average, so planned only for it, about half of studies get an interval wider than planned; MBESS's assurance sets that chance instead. For a regression coefficient with a width of 0.2, 349 people give that width on average; 373 give it with 80% assurance and 386 with 90%. For d = 0.5 and a width of 0.4, 199 per group against 201 and 202."
  "24": "Correlations that vary between studies (optional): an entered SD on Fisher's z makes the correlation an average across studies, following McShane and Bockenholt (2014). This averages significance across differing true correlations; it is not power at the average correlation and can raise or lower the answer. It does not guarantee power in your particular setting. New plans start without variation; empty or 0 gives the usual calculation. As an illustration, r = .1 with variation SD 0.025 and 80% power needs 904 people against 782 without; r = .3 needs 86 against 85."
  "23": "Effects that vary between studies (optional): an entered SD makes the effect an average across studies, following Kenny and Judd (2019). This averages significance across differing true effects; it is not power at the average effect and can raise or lower the answer. It does not guarantee power in your particular setting. New plans start without variation; empty or 0 gives the usual calculation. As an illustration, d = 0.3 with variation SD 0.05 and 80% power needs 376 people in total against 352 without."
  "22": "One-way ANOVA: Powerkit plans for Welch's F unless you choose the classical F test, as Delacre, Leys, Mora and Lakens (2019) recommend, because Welch's F keeps the chance of a false positive at alpha when the groups' SDs differ and loses little power when they don't; G*Power and Superpower plan for the classical F test. With one SD of 6 and means 10, 11 and 13, 80% power needs about 231 people with Welch's F against 228 with the F test."
  "21": "Two groups: Powerkit plans for Welch's t-test unless you choose Student's, as Delacre, Lakens and Leys (2017) recommend, because Welch's test keeps the chance of a false positive at alpha when the groups' spreads differ; G*Power and pwr plan for Student's. With equal spreads and equal groups the two need the same number of people; with unequal groups Welch's needs a few more: 145 rather than 143 for d = 0.5 and 80% power when group 2 is twice the size of group 1."
  "19": "Moderation of both mediation links: Powerkit calculates residual variances from the full product moments and supplies them directly to power4mome. Its default standardisation can use the mediator's old values in the later product and generate the wrong outcome variance. Impossible combinations of paths are rejected before running."
  "20": "Differential item functioning: the test frees both of each DIF item's parameters (discrimination and difficulty) between the groups, whichever you expect to differ, because that is the test usually run (the omnibus test in mirt's DIF() help) and a power analysis should be for the test you will run. irtpwr's DIF preset tests only the parameters that differ, which is more powerful when only the difficulty changes: for the 8-item example with one item 0.4 harder, 53.6% against 64.1% at 600 people. That test is a choice on the input screen."
  "1": "Required N for a 2 x 2 interaction: Powerkit gives the smallest N at which the exact F test reaches the target power. Sommet et al.'s (2023) z approximation gives slightly smaller numbers: 4 participants fewer (one per cell) in their two published examples."
  "2": "Mixed design: Powerkit uses Superpower's ANOVA_exact(), which reproduces the G*Power values Superpower's vignette reports, not ANOVA_exact2(). The two differ slightly (91.2% vs 90.5% in the vignette's example)."
  "3": "Superpower's exact dataset is built under this run's seed, so the result is identical each time with the same seed. The size of this difference is about 1e-15 in power, with no practical effect."
  "10": "Correlation: you chose pwr's formula, which uses Fisher's z, an approximation. powerkit's default, like G*Power's, is the exact distribution of r. For r = .3 to .5 and N = 20 to 100 the two differ by at most 0.004 in power and 1 participant (85 rather than 84 for r = .3 and 80% power); for a large correlation in a small sample the gap is wider (r = .9 and N = 6: 77.2% by Fisher's z, 81.6% exactly)."
  "11": "Two proportions: the z test as G*Power runs it (pooled variance under the null, no continuity correction, both tails counted), by base R's power.prop.test() with strict = TRUE; it matches G*Power to seven decimals. Its own default, strict = FALSE, counts one tail only: power .2340 rather than .2345 with proportions .10 and .25 and 20 per group. Unequal groups use pwrss's z test, which matches G*Power's power. Both round the groups to whole people at each total, but powerkit's total always reaches the target, so it can be one higher (for 95% power with group 2 twice the size of group 1, 371 rather than G*Power's 370, whose groups of 123 and 247 fall just short of 95%)."
  "12": "Two dependent correlations: Steiger's z test as G*Power computes it, with the null hypothesis's correlation in the formula for how the two correlations vary together; pwrss, the package behind it, uses the average of the two correlations by default. Powerkit reproduces the G*Power manual's two examples (144 and 886 people); pwrss's default would give 139 and 875, about 1 to 4% fewer."
  "13": "Whole-study simulation (experimental): separate power calculations do not establish the chance that several tests all succeed. Here one population model generates each study and the supported analyses use the same data, so their joint success is counted directly. Comparisons with separate calculations cover the recorded cases only; omitted model terms can change what an individual analysis estimates. This is not validation of every study plan."
  "14": "Smallest detectable effect when only one condition is in groups: Powerkit finds the d at which the t test's power reaches the target power, as it finds sample sizes. powertools' own answer for d uses a normal approximation and falls short: at 20 groups of 8 and 160 people treated individually, it gives d = 0.340, which has 79% power rather than 80%; Powerkit gives 0.346."
  "18": "Meta-analysis: under the random-effects model Powerkit plans for the Hartung-Knapp test unless you choose otherwise, because it keeps the chance of a false positive closer to alpha than the z test, especially with few studies (IntHout, Ioannidis & Borm, 2014); metapower plans for the z test. No package has a formula for its power, so it is simulated (metafor's rma(test = \"knha\"), with Spower). It gives less power: for d = 0.15 in ten studies of 40 with I-squared 0.5, about 16.5% against 21.4% with the z test."
  "17": "Pairwise comparisons: Powerkit adjusts the p-values for the number of comparisons by Holm's method unless you choose otherwise; Superpower's ANOVA_power() adjusts none by default. Adjusting costs power: for None against Praise in powerkit's example (means 10, 11 and 13, SD 6, 30 per group), 31.2% with Holm's adjustment, 30.1% with Bonferroni's and 47.8% with none."
  "16": "Mixed model: the condition is tested with Satterthwaite's t test (lmerTest), or Kenward and Roger's (pbkrtest) if you choose it, not simr's default z test, which treats the t statistic as normal and so rejects too often in designs with few participants or items. In powerkit's example (40 items), the z test gives 42.0% power at 40 participants where Satterthwaite's gives 39.6% (27.7% and 25.0% at 20 participants)."
  "15": "Bayes factor t-tests: Powerkit plans for exactly the effect you entered unless you say how unsure you are about it (a design prior SD of 0), as a usual power analysis does. bfpwr's own default spreads the true effect as widely as the analysis prior (SD 0.707), which needs far more people: for d = 0.5 and BF10 of at least 10, 120 per group give 80% with powerkit's default and 67% with bfpwr's, which needs 372 per group."
  "5": "No continuity correction, as in G*Power; Spower applies Yates' correction by default. In an example with proportions .50 and .65 and 170 per group, power is .818 without the correction and .789 with it."
  "6": "Mediation is fitted with lavaan (maximum likelihood), as power4mome does, not by PROCESS's ordinary least squares. The estimates are identical; the standard errors are slightly smaller (at N = 50, 2% for the a path and 3% for b and c'; at N = 200, under 1%)."
  "7": "Parallel mediators: Powerkit lets their residuals correlate, as PROCESS's separate regressions do; lavaan and power4mome fix that correlation at 0 by default. With a residual correlation of 0.4 and N = 200, fixing it at 0 would understate the standard errors of the mediator-to-outcome paths by about 10% and so overstate power."
  "8": "Boos and Zhang's (2000) method is switched off: every simulated sample is tested with its confidence interval. power4mome switches the method on for some numbers of Monte Carlo draws (39, 79, ..., 359). In powerkit's runs this makes no difference to power."

# Departures that leave the answer practically unchanged (no difference,
# or under 0.01 in power, and powerkit matches G*Power) are folded under
# "How it was calculated"; the others stay in view, with a pointer from
# the answer (docs/decisions.md, "Mentioning other tools", 28 October 2026).
# The methods paragraph states every departure.
departures_folded: ["2", "3", "8", "11"]

# Known differences between established tools, shown on the result screen
# (CLAUDE.md). Each condenses its entry in docs/conventions.md, "Known
# differences". They are not departures: powerkit follows one established
# tool, and another gives a different answer.
known_differences:
  "1": "Regression interactions: this route simulates studies with the predictors drawn afresh each time (InteractionPoweR). Formula-based regression planning can give a different answer. A recorded comparison found higher power from InteractionPoweR's formula in the checked cases; it is not a universal error bound or a direct G*Power comparison."
  "1 sensitivity": "Regression interactions: the smallest detectable effect comes from InteractionPoweR's fixed-model formula, not simulation. It is an approximate threshold for the simulated-study route: check power at your proposed effect and sample size by simulation. The recorded formula/simulation comparison does not bound the difference for every setting."
  "2": "One proportion, McNemar's test and Fisher's exact test are exact tests of counts: their power goes up and down as N grows, so a slightly larger N can have a little less power. Powerkit reports the smallest N that reaches the target, as G*Power does; pwrss's own sample-size answer is a little larger (92 rather than 90 for a proportion of .65 against .50, two-sided; 130 rather than 129 for McNemar's test with .25 and .10, G*Power's exact option). Fisher's exact test hasn't been compared with G*Power yet."
  "3": "Logistic regression with other predictors: when this predictor overlaps with the others (R-squared above 0), the G*Power manual's example reports a slightly larger sample size than Powerkit gives for the same inputs (395 against 375 at an R-squared of 0.1). Powerkit applies the adjustment as the manual's formulas describe it; why the example differs hasn't been settled, so G*Power may ask for a few per cent more people. With no overlap (R-squared 0) the two agree."
  "4": "Variance tests (retired 31 October 2026): Powerkit simulated power with Spower's p_var.test() while G*Power computes these tests exactly. Powerkit now computes them exactly too; this note is kept for results saved before then."
  "5": "Rank tests: Powerkit simulates the rank test itself (Spower's p_wilcox.test() or p_kruskal.test()), drawing scores of the shape you chose. G*Power's Wilcoxon and Mann-Whitney tests instead adjust the t-test's answer by an efficiency factor for the shape, so the two can differ; by how much hasn't been measured yet. With normal scores a rank test needs slightly more people than the t-test, and with skewed or heavy-tailed scores it can need fewer."
  "6": "Bayes factor t-tests: bfpwr calculates the chance of evidence at the threshold by formula, treating the effect estimate as normally distributed, which is close in larger samples but gives a little less than simulating the Bayes factor itself (as BFDA does) in small ones: for a one-sample test with d = 0.4 and BF10 of at least 10, 7.6% against about 11% with 20 people, and 28.3% against about 30% with 40."
  "7": "Moderation by its R-squared change uses pwrss's fixed-model regression formula. In the recorded example, power was 59.9% with pwrss versus 58.3% with InteractionPoweR's formula at N = 200 and R-squared change .0225. The correlation route instead simulates studies; these methods need not agree, and this example does not bound the difference."
  "8": "MANOVA with three or more groups: Powerkit simulates power (Spower), because no package it builds on has a formula for it; G*Power computes Pillai's trace with an F approximation. How far G*Power's approximation sits from the simulated power hasn't been measured yet. With two groups both calculate Hotelling's T-squared exactly."
  "10": "Minimum-effect tests (retired 12 November 2026): Powerkit used pwrss's t-test against the smallest effect of interest in SD units, which gives very slightly less power than the test researchers run (a t-test against the margin in the measure's own units, as TOSTER's minimum-effect test does). Powerkit now plans that test; this note is kept for results saved before then."
  "11": "Alpha chosen by weighing the two errors: powerkit's default makes the weighted total of the two errors as small as possible, JustifyAlpha's default. G*Power's compromise power analysis instead makes them equal (beta = q x alpha); choose \"Make the weighted errors equal\", with q as how many times worse a false positive is, for its answer. For d = 0.5 and 64 people, alpha is .184 when minimising and .221 when balancing."
  "9": "Meta-analysis: for a correlation, metapower rounds Fisher's z to two decimals before computing power, so its answer can differ from the exact one by up to about 1.3 points (85.6% against 84.3% for r = 0.25 in five studies of 30). Under the random-effects model it allows for the between-study variance being estimated (Jackson and Turner, 2017), where the formulas in Valentine, Pigott and Rothstein (2010) treat it as known; in their worked example the two give 68% and 68.3%."
  "12": "Bayes factor test of a correlation: powerkit's default prior width is JASP's, 1 (every correlation equally likely beforehand). BayesFactor, the R package that computes the Bayes factor, defaults to a narrower 1/3, which needs fewer people for a moderate correlation: 146 against 162 for r = .3, BF10 of at least 10 and 80%. Set the prior width to 1/3 (0.333) to match BayesFactor; at the same width the two give the same Bayes factor as JASP."
  "14": "Mediation: Powerkit plans for the Monte Carlo confidence interval of the indirect effect, as power4mome does, while PROCESS, the usual software for the analysis, reports a percentile bootstrap interval by default. The two are different tests, so their power can differ a little (powerkit's validation compares them for simple mediation); say in your write-up which interval you will report."
  "15": "ANCOVA: Powerkit uses Shieh's (2020) method (pwrss), which treats the covariate as random, as it is when people come with their own before scores. G*Power treats the covariate as fixed, which gives a little more power and so a slightly smaller sample size: in a three-group example, 87 in G*Power against 90 here."
  "16": "Yes/no outcomes in groups: powertools' formula multiplies the variance of the log odds ratio by 1.2, a safety margin its help pages give no source for, so it asks for more groups than a simulation of the usual mixed-model analysis (glmer() with a random intercept for groups) needs. In a checked example (proportions .30 and .45, groups of 20, SD of the groups' log odds 0.3) it asked for 28 groups where 24 reached 80% in simulation; for people randomised within groups it asked for 22, where the formula without the factor gives 19 and simulation gave 87.6% power at 22. Your answer is on the safe side by about this much. To plan without the factor, choose the simulation under \u201cHow power is worked out\u201d."
  "17": "Three-way interactions: InteractionPoweR's formula treats the predictors as fixed, as G*Power does. Studies with newly sampled predictors have less power, more so than for two-way interactions: in a checked example the formula's 853 people gave about 78% power in simulation rather than 80%, and about 900 were needed. Consider adding about 5% to this sample size."
  "13": "One-sided Bayes factor test of two proportions: JASP estimates the chance that one group's proportion is the higher from 10,000 random draws, so its one-sided Bayes factor varies slightly from run to run (about 0.1% for 20 of 50 against 30 of 50). Powerkit calculates that chance exactly. The two-sided Bayes factor is the same in both."

# The same known differences as one sentence for the methods paragraph
# (docs/conventions.md, "Known differences").
known_differences_methods:
  "1": "Power was estimated by simulation, drawing the predictors afresh in each study. Fixed-model formulas condition on the predictor design and can give a different answer; the recorded comparison of InteractionPoweR methods does not establish a universal difference or direct G*Power agreement."
  "1 sensitivity": "The smallest detectable effect was found with a fixed-model formula. It is an approximation to the simulation route, not a simulation-confirmed target; power at the proposed effect and sample size should be checked by simulation."
  "2": "Because power for an exact test of counts goes up and down as N grows, the sample size reported is the smallest N that reaches the target power, as in G*Power; pwrss's own sample-size answer can be slightly larger."
  "3": "The predictor's overlap with the other predictors was allowed for through its R-squared with them; for this case the G*Power manual's example reports a sample size a few per cent larger than this method gives, a difference that has not yet been resolved."
  "4": "Power was estimated by simulation, so it carries Monte Carlo error, whereas G*Power computes this test exactly."
  "5": "Power for the rank test was estimated by simulating the test itself on scores of the assumed shape, rather than by adjusting the t-test's power for the test's efficiency as G*Power does, so the two can give slightly different sample sizes."
  "6": "The probability of evidence at the threshold was calculated in closed form, which treats the effect estimate as normally distributed; in small samples this gives slightly lower values than simulating the Bayes factor itself."
  "7": "Power was calculated by pwrss's fixed-model formula for an R-squared increase. The correlation route instead simulates studies with newly sampled predictors; numerical agreement between these planning methods is not assumed."
  "8": "Power was estimated by simulation, so it carries Monte Carlo error; G*Power computes Pillai's trace with an F approximation."
  "10": "The minimum-effect test was computed with pwrss's t-test against the smallest effect of interest in SD units; a margin fixed in the outcome's own units, tested with a shifted central t, gives very slightly higher power."
  "11": "The significance level minimised the weighted total of the two errors (JustifyAlpha's default); G*Power's compromise power analysis instead makes the weighted errors equal, which gives a somewhat higher alpha."
  "9": "For a correlation, metapower rounds Fisher's z to two decimals before computing power, which can move power by about a point; under the random-effects model it allows for the between-study variance being estimated (Jackson and Turner, 2017), where Valentine, Pigott and Rothstein (2010) treat it as known."
  "12": "The Bayes factor used a stretched beta prior of width 1 on the correlation, JASP's default; the BayesFactor package's own default, 1/3, gives a somewhat smaller sample size."
  "14": "Power was estimated for a Monte Carlo confidence interval of the indirect effect; the percentile bootstrap interval PROCESS reports by default is a different test, whose power can differ a little."
  "15": "The ANCOVA's power was calculated by Shieh's (2020) method (pwrss's power.f.ancova.shieh()), which treats the covariate as random; G*Power treats it as fixed, which gives slightly more power and a slightly smaller sample size."
  "16": "The number of groups was calculated with powertools' formula, which multiplies the variance of the log odds ratio by 1.2, a factor its documentation does not source; simulating the mixed-model analysis suggests about a sixth fewer groups would give the target power."
  "17": "Power was calculated with InteractionPoweR's fixed-model formula for the R-squared change; simulating studies with newly sampled predictors gave lower power in a checked example (about 78% where the formula gave 80%, needing about 5% more participants)."
  "13": "The one-sided Bayes factor multiplied the two-sided one by the posterior probability of the expected direction over its prior probability, as JASP does, with that probability calculated exactly where JASP estimates it from posterior draws."

# How a replication plan takes each card's original effect (queue item 21;
# decisions.md, 12 November 2026). Every card has one entry:
#   exact      one of the four designs whose goals table has its own rule
#              (two_groups, one_sample, paired, correlation)
#   effect     the focal effect, one number: what it is, and its scale
#              (none: as reported; log: a ratio, planned on the log scale;
#              fisher_z: a correlation)
#   multi_df   a test of several degrees of freedom, with no one-number
#              effect; the text names the focal contrast to plan instead
#   none       why a replication's goals table doesn't fit the card
#   anova      (beside one of the above) an ANOVA card: between, within or
#              mixed. Its F or partial eta-squared is planned with BUCSS
#              under the plan's "An ANOVA effect" design, which a plan
#              opened on the card starts with (queue item 28).
# A replication plan opened on the card starts with it; the researcher can
# change it on the plan's page.
replication_effects:
  E1: {exact: one_sample}
  E2: {exact: two_groups}
  E3: {exact: paired}
  E4: {exact: correlation}
  E76: {effect: "repeated-measures correlation (r)", scale: fisher_z}
  E41: {effect: "the cross-level interaction (how much the within-person slope changes with the moderator)", scale: none}
  E5: {effect: "odds ratio between the two groups", scale: log}
  E6: {multi_df: "for a 2 x 2 table, the odds ratio (card E5 or E27); for a larger table, the one comparison the hypothesis is about"}
  E7: {effect: "the interaction contrast (or the one effect the hypothesis is about), as an estimate with its standard error", scale: none, anova: between}
  E22: {effect: "the interaction contrast (or the one effect the hypothesis is about), as an estimate with its standard error", scale: none, anova: between}
  E8: {effect: "the group by condition interaction (the difference in change between the groups)", scale: none, anova: mixed}
  E9: {effect: "the interaction coefficient (b for X times W)", scale: none}
  E15: {effect: "the interaction coefficient (b for X times W)", scale: none}
  E31: {effect: "the three-way interaction coefficient", scale: none}
  E10: {effect: "the indirect effect (ab)", scale: none}
  E16: {effect: "the indirect effect (ab)", scale: none}
  E42: {effect: "the one relative indirect effect the hypothesis is about", scale: none}
  E39: {effect: "the natural indirect effect", scale: none}
  E33: {effect: "the condition effect (the fixed effect of condition)", scale: none}
  E63: {multi_df: "the difference between the two conditions the hypothesis is about (card E33)"}
  E75: {effect: "the effect of interest as a rate ratio or odds ratio", scale: log}
  E78: {multi_df: "the difference between the two conditions the hypothesis is about (card E26, McNemar's test, for two conditions)"}
  E67: {effect: "the item predictor's coefficient", scale: none}
  E68: {effect: "the coefficient of interest (a fixed effect)", scale: none}
  E43: {effect: "hazard ratio", scale: log}
  E69: {none: "A study of reliability or agreement estimates how consistent a measure is rather than testing an effect, so a replication is planned for the precision of that estimate on this card."}
  E77: {none: "A prediction model's study estimates how well the model predicts rather than testing an effect; checking it in new people is planned on this card, as validating an existing model."}
  E44: {effect: "the actor or partner effect the hypothesis is about", scale: none}
  E62: {effect: "the coefficient of interest (a fixed effect)", scale: none}
  E11: {effect: "the one indirect effect the hypothesis is about", scale: none}
  E12: {effect: "the serial indirect effect", scale: none}
  E13: {effect: "the index of moderated mediation", scale: none}
  E14: {effect: "the index of moderated mediation", scale: none}
  E17: {effect: "the index of moderated mediation", scale: none}
  E38: {effect: "the index of moderated mediation", scale: none}
  E40: {effect: "the index of moderated mediation for the mediator the hypothesis is about", scale: none}
  E18: {multi_df: "the difference between the two groups the hypothesis is about (card E19, a specific comparison)", anova: between}
  E54: {multi_df: "the difference between the two conditions the hypothesis is about (card E3 for two conditions)", anova: within}
  E55: {multi_df: "the one contrast the hypothesis is about, such as the difference in change between two groups (card E8)", anova: mixed}
  E56: {multi_df: "the one contrast the hypothesis is about, such as a 2 x 2 interaction within the design"}
  E20: {multi_df: "the one contrast the hypothesis is about, such as a 2 x 2 interaction within the design", anova: within}
  E21: {multi_df: "the one contrast the hypothesis is about, such as a 2 x 2 interaction within the design (card E7)", anova: between}
  E23: {effect: "the adjusted difference between the two groups (with three or more groups, the one comparison the hypothesis is about)", scale: none}
  E24: {effect: "the coefficient of the predictor the hypothesis is about", scale: none}
  E25: {effect: "the difference between the proportion and the fixed value", scale: none}
  E26: {effect: "the odds ratio from the pairs that changed", scale: log}
  E36: {none: "An equivalence study aims to show an effect is too small to matter; a replication of it is planned on this card, with the same equivalence bounds."}
  E48: {multi_df: "the one proportion the hypothesis is about, against its expected value (card E25)"}
  E29: {effect: "the odds ratio from the ordinal (proportional odds) model", scale: log}
  E47: {effect: "the odds ratio for the effect the hypothesis is about (in a 2 x 2 design, the interaction)", scale: log}
  E49: {effect: "the difference between the two correlations, on Fisher's z scale", scale: none}
  E52: {effect: "the ratio of the group's variance to the fixed value", scale: log}
  E53: {effect: "the ratio of the two groups' variances", scale: log}
  E57: {effect: "the ratio of the variances after and before", scale: log}
  E59: {multi_df: "the one outcome and comparison the hypothesis is about (card E2 for two groups on one outcome)"}
  E60: {multi_df: "the one outcome the hypothesis is about, against its fixed value (card E1)"}
  E61: {none: "A meta-analysis's average effect is checked by the studies that follow, not by one replication, so no replication goals are planned for it."}
  E27: {effect: "the odds ratio of the predictor the hypothesis is about", scale: log}
  E70: {effect: "the odds ratio, for the one category the hypothesis is about", scale: log}
  E71: {none: "Differential item functioning is checked item by item in a new sample on this card; it has no single effect to replicate."}
  E35: {effect: "the difference between the groups' slopes (the group by time coefficient)", scale: none}
  E73: {none: "An exploratory factor analysis has no single effect to replicate; plan the new sample's recovery of the factors on this card."}
  E45: {effect: "the change in level (or in slope) at the known point", scale: none}
  E74: {effect: "the cross-lagged path the hypothesis is about", scale: none}
  E58: {none: "Finding profiles or classes has no single effect to replicate; plan the new sample on this card."}
  E72: {effect: "the difference in d' between the conditions or groups", scale: none}
  E30: {multi_df: "the one comparison the hypothesis is about, such as how the effect differs between two of the groups (card E15)"}
  E32: {effect: "the interaction coefficient, as an odds ratio or rate ratio", scale: log}
  E28: {effect: "the rate ratio of the predictor the hypothesis is about", scale: log}
  E34: {effect: "the coefficient of interest (a fixed effect)", scale: none}
  E37: {effect: "the path or factor correlation the hypothesis is about (standardised)", scale: none}
  E19: {effect: "the contrast's estimate", scale: none}
  E51: {effect: "the difference between the two correlations", scale: none}
  E50: {none: "This card starts from a noncentrality parameter rather than an effect, so a replication's goals are planned on the card for the design it came from."}
  E46: {none: "Planning for a confidence interval's width estimates an effect rather than testing it; a replication is planned for the same precision on this card."}
  E64: {multi_df: "the difference between the two groups the hypothesis is about (card E29 or a rank test on card E2)"}
  E66: {effect: "the odds ratio per step of the ordered groups (the trend's slope)", scale: log}

forms:
  E1:
    methods_name: "a one-sample t-test"
    departures: ["15", "23", "37"]
    known_differences_if_method: {"5": wilcoxon_signed_rank, "6": bayes_factor}
    known_differences: ["5", "6", "11"]
    known_differences_if_goal: {"11": justified_alpha}
    tool: pwr
    sensitivity: true
    justified_alpha: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: one_sample_t,
           variables: {"Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean}}
    groups:
      - input: "Your outcome's name"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The effect: Cohen's d, or the means and SD in your measure's own units"
        fields:
          - {id: effect_units, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {standardised: "As Cohen's d: (expected mean minus the fixed value) / SD", raw: "In my measure's own units: the expected mean, the fixed value and the SD"},
             default: standardised, default_source: "Cohen's d, the effect size pwr.t.test() takes (pwr 1.3-0); Powerkit works it out from the means and SD if you give those"}
          - {id: d, label: "Cohen's d", type: number, path: population.d, effect: true,
             shown_if: {field: effect_units, is_not: raw}}
          - {id: raw_mean, label: "Expected mean", type: number, path: population.raw.mean, effect: true, writeup_label: "expected mean",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_test_value, label: "The fixed value it is compared with", type: number, path: population.raw.test_value, required: true, in_effect_text: true, writeup_label: "fixed value",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_sd, label: "SD: how much people usually vary on the measure", type: number, path: population.raw.sd, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD",
             shown_if: {field: effect_units, is: raw}}
      - input: "The t-test, the Wilcoxon signed-rank test, a Bayes factor t-test or a minimum-effect test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {t_test: "One-sample t-test", wilcoxon_signed_rank: "Wilcoxon signed-rank test (rank-based), simulated", bayes_factor: "Bayes factor t-test (default JZS prior), instead of a p-value", minimum_effect: "Minimum-effect test"},
             default: t_test, default_source: "the t-test pwr's formula covers (pwr.t.test(), pwr 1.3-0)"}
          - {id: score_shape, label: "The shape of the scores", type: select, path: population.score_shape, required: true,
             shown_if: {field: method, is: wilcoxon_signed_rank},
             choices: {normal: "Roughly normal (bell-shaped)", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_wilcox.test(), Spower 0.7)",
             help: "The signed-rank test assumes the scores are symmetric, so a skewed shape isn't offered here. The effect stays the same d: the whole distribution shifts by it."}
          - {id: evidence_threshold, label: "Evidence threshold: the Bayes factor (BF10) the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: method, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), bfpwr's default (powertbf01(k = 1/10), its threshold on BF01, which its help calls Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the effect exists than if it doesn't. Power here is the chance that BF10 reaches this number."}
          - {id: prior_scale, label: "Scale of the analysis prior (by default a Cauchy distribution centred on 0)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0.707, default_source: "bfpwr's default, 1/sqrt(2) (powertbf01(pscale = 1/sqrt(2)), bfpwr 0.1.6)",
             help: "The prior you will use when you analyse the data (the default Bayes factor t-test's JZS prior). Use the same scale as in your analysis plan."}
          - {id: prior_location, label: "Centre of the analysis prior, as an effect size (optional; empty = 0)", type: number, path: target_test.prior_location, optional: true, empty_text: "0", min: -5, max: 5,
             shown_if: {field: method, is: bayes_factor},
             help: "Leave it empty for the default Bayes factor, which centres its prior on no effect. For an informed prior (for example one built from earlier studies), give its centre here and its spread as the scale above, as in your analysis plan."}
          - {id: prior_df, label: "Degrees of freedom of the analysis prior (optional; empty = 1, a Cauchy prior)", type: number, path: target_test.prior_df, optional: true, empty_text: "1", min: 1, max: 1000,
             shown_if: {field: method, is: bayes_factor},
             help: "The prior is a t distribution. 1 is a Cauchy prior with heavy tails, the default; larger values give lighter tails, close to a normal prior from about 30."}
          - {id: effect_sd, label: "How unsure you are about the effect, as an SD (0 = exactly this effect)", type: number, path: population.effect_sd, required: true, min: 0, range_reading: [d, dz],
             shown_if: {field: method, is: bayes_factor},
             default: 0, default_source: "powerkit's default: plan for exactly the effect you entered, as a usual power analysis does (bfpwr's own default spreads it as widely as the analysis prior; docs/conventions.md, Departure 15)",
             help: "Above 0, Powerkit averages over true effects spread around yours (a normal design prior with this SD), which usually needs a larger sample."}
          - {id: margin, label: "Smallest effect of interest, as Cohen's d", type: number, path: population.margin, required: true, min_exclusive: 0, writeup_label: "smallest effect of interest",
             shown_if: [{field: method, is: minimum_effect}, {field: effect_units, is_not: raw}],
             help: "The test shows that the effect is larger than this, not only that it isn't 0. With a one-sided hypothesis it is tested on that side; with a two-sided one, the effect has to be further from 0 than this in either direction. Your expected effect has to be larger than it."}
          - {id: raw_margin, label: "Smallest effect of interest, as a difference in your measure's own units", type: number, path: population.raw.margin, required: true, min_exclusive: 0, writeup_label: "smallest effect of interest",
             shown_if: [{field: method, is: minimum_effect}, {field: effect_units, is: raw}],
             help: "Powerkit divides it by the SD, as for the effect. The test shows that the effect is larger than this, not only that it isn't 0."}

  E2:
    methods_name: "an independent-samples t-test"
    departures: ["21", "15", "23", "37"]
    known_differences_if_method: {"5": mann_whitney, "6": bayes_factor}
    known_differences: ["5", "6", "11"]
    known_differences_if_goal: {"11": justified_alpha}
    tool: pwr
    sensitivity: true
    justified_alpha: true
    sensitivity_without_effect: true
    basic_method: true
    # pwr's formula or Spower's simulation is offered with Student's test;
    # Welch's has its own choice (welch_method, below).
    basic_method_with: student_t
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: independent_t,
           variables: {X: {type: binary}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean_difference}}
    groups:
      - input: "Names of the two groups and the outcome"
        fields:
          - {id: X_label, label: "What the groups are", help: "For example, condition.", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The effect: a standardised mean difference, raw means and SDs, or a point-biserial correlation"
        fields:
          - {id: effect_units, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {standardised: "As a standardised mean difference: group 2 minus group 1, in SD units", raw: "In my measure's own units: each group's mean and the SD information", point_biserial: "As a point-biserial correlation r between group and outcome, as in G*Power's point-biserial model"},
             default: standardised, default_source: "Cohen's d, the effect size pwr.t.test() takes (pwr 1.3-0); Powerkit works it out from the means and SD, or from a point-biserial r, if you give those"}
          - {id: d, label: "Standardised mean difference (d)", writeup_label: "Cohen's d", type: number, path: population.d, effect: true,
             shown_if: [{field: effect_units, is_not: raw}, {field: effect_units, is_not: point_biserial}],
             help: "Group 2's mean minus group 1's, divided by the SD. If the groups' spreads differ, raw means and the two SDs are safer than a published d."}
          - {id: r_pb, label: "Point-biserial r between group and outcome", type: number, path: population.r, effect: true, no_conversion: true,
             min_exclusive: -1, max_exclusive: 1, writeup_label: "point-biserial r",
             shown_if: {field: effect_units, is: point_biserial},
             help: "The correlation between group membership (group 1 counted as 0, group 2 as 1) and the outcome: positive if group 2 scores higher. Powerkit turns it into Cohen's d for the group sizes you plan (d = r / sqrt(p(1 - p)(1 - r squared)), p the share in group 2), which gives the same test as G*Power's point-biserial model. Powerkit treats it as the true effect; a published value tends to be too large."}
          - {id: raw_mean_1, label: "Expected mean, group 1", type: number, path: population.raw.mean_1, effect: true, writeup_label: "group 1 mean",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_mean_2, label: "Expected mean, group 2", type: number, path: population.raw.mean_2, effect: true, writeup_label: "group 2 mean",
             shown_if: {field: effect_units, is: raw}}
          - {id: welch_sd_input, label: "Which SD information do you have?", type: select,
             shown_if: [{field: effect_units, is: raw}, {field: method, is: welch_t}],
             choices: {common: "One common SD for both groups", separate: "An SD for each group"}, default: common,
             default_source: "one common SD, preserving earlier raw-input plans",
             help: "Use the same units as the means. If the spreads are unknown, compare explicit scenarios rather than treating equality as known."}
          - {id: raw_sd, label: "SD: how much people usually vary on the measure within a group", type: number, path: population.raw.sd, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD",
             shown_if: [{field: effect_units, is: raw}, {any: [{field: method, is_not: welch_t}, {field: welch_sd_input, is_not: separate}]}]}
          - {id: raw_sd1, label: "SD in group 1", type: number, path: population.raw.sd1, required: true, min_exclusive: 0,
             in_effect_text: true, writeup_label: "group 1 SD",
             shown_if: [{field: effect_units, is: raw}, {field: method, is: welch_t}, {field: welch_sd_input, is: separate}]}
          - {id: raw_sd2, label: "SD in group 2", type: number, path: population.raw.sd2, required: true, min_exclusive: 0,
             in_effect_text: true, writeup_label: "group 2 SD",
             shown_if: [{field: effect_units, is: raw}, {field: method, is: welch_t}, {field: welch_sd_input, is: separate}]}
      - input: "The size of group 2 relative to group 1 (1 = equal)"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwr.t.test() (pwr 1.3-0) and Spower's default (p_t.test(n2_n1 = 1), Spower 0.7)"}
      - input: "Student's or Welch's t-test, the Mann-Whitney or Brunner-Munzel test, Yuen's trimmed-means test, a Bayes factor t-test or a minimum-effect test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {welch_t: "Welch's t-test", student_t: "Student's t-test", mann_whitney: "Mann-Whitney U test", brunner_munzel: "Brunner-Munzel test", yuen: "Yuen's trimmed-means test (robust t-test)", bayes_factor: "Bayes factor t-test", minimum_effect: "Minimum-effect test"},
             default: welch_t, default_source: "Welch's t-test, as Delacre, Lakens and Leys (2017) recommend by default: it keeps the false-positive rate when the groups' spreads differ and loses almost nothing when they don't. R's t.test() runs it unless told otherwise; G*Power and pwr plan for Student's",
             choice_notes: {bayes_factor: "Uses the default JZS analysis prior and equal groups; the evidence threshold and prior settings below describe the planned Bayesian analysis.", mann_whitney: "Rank-based analysis, simulated; power depends on the score shape you choose.", brunner_munzel: "Rank-based analysis that allows unequal spreads, simulated with your chosen score shape.", yuen: "Compares trimmed means (20% trimmed from each end by default, as in WRS2's yuen()), so a few extreme scores have little pull; allows unequal spreads. Simulated with your chosen score shape.", minimum_effect: "Tests whether the effect exceeds your smallest effect of interest, rather than whether it differs from zero.", welch_t: "Plans for normal scores. If the two groups' spreads differ, say so under \u201cMy groups' spreads differ\u201d below, or give raw means and SDs.", student_t: "Choose Student's test when the analysis must match one fixed in advance: a direct replication of a study that used it, a preregistration that names it, or a comparison that is one part of a larger regression or ANOVA assuming equal spreads (unless that model uses robust standard errors). Reporting Welch's test beside it is good practice. With similar spreads and equal group sizes, their planned sample sizes are often close. Unequal spreads can change the answer even when group sizes are equal."}}
          - {id: welch_sd_ratio, label: "SD of group 2 divided by SD of group 1", type: number, path: population.sd_ratio, required: true, min_exclusive: 0,
             shown_if: [{field: method, is: welch_t}, {field: effect_units, is_not: raw}],
             default: 1, default_source: "equal spreads",
             fold: "My groups' spreads differ (optional)",
             help: "For example, SDs 10 and 15 give 1.5; 1 means equal spreads. With unequal SDs the effect is the mean difference divided by sqrt((SD1 squared + SD2 squared) / 2), not an allocation-weighted pooled SD. Converting a point-biserial correlation or a published test, and safeguard power, need equal SDs: give raw means and SDs for unequal spreads. This is an assumption about the population, not something choosing Welch's test supplies."}
          - {id: score_shape, label: "The shape of the scores in each group", type: select, path: population.score_shape, required: true,
             shown_if: {field: method, is_one_of: [mann_whitney, brunner_munzel, yuen]},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_wilcox.test(), Spower 0.7)",
             help: "Every group has the same shape; the groups differ only by a shift (their means). A rank or trimmed-means test's power depends on this shape; the t-test's figure assumes normal scores. Heavy tails are where trimming gains most."}
          - {id: sd_ratio, label: "SD of group 2 divided by SD of group 1 (1 = equal spread)", type: number, path: population.sd_ratio, required: true, min_exclusive: 0,
             shown_if: {field: method, is_one_of: [brunner_munzel, yuen]},
             default: 1, default_source: "equal spread, the assumption of the Mann-Whitney test and Student's t-test that the Brunner-Munzel and Yuen's tests relax",
             help: "The Brunner-Munzel test and Yuen's test stay valid when the groups differ in spread as well as level. Your effect size is the mean difference divided by the average of the two SDs, sqrt((SD1^2 + SD2^2) / 2)."}
          - {id: trim, label: "Share trimmed from each end of each group (0.2 = 20%)", type: number, path: target_test.trim, required: true, min: 0, max_exclusive: 0.5,
             shown_if: {field: method, is: yuen},
             default: 0.2, default_source: "20% from each end, WRS2's default (yuen(tr = 0.2), WRS2 1.1-7)",
             help: "Use the trimming you will analyse with. 0.2 is the usual choice; 0 is no trimming (Welch's t-test), and more trimming moves towards comparing medians."}
          - {id: evidence_threshold, label: "Evidence threshold: the Bayes factor (BF10) the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: method, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), bfpwr's default (powertbf01(k = 1/10), its threshold on BF01, which its help calls Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the effect exists than if it doesn't. Power here is the chance that BF10 reaches this number."}
          - {id: prior_scale, label: "Scale of the analysis prior (by default a Cauchy distribution centred on 0)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0.707, default_source: "bfpwr's default, 1/sqrt(2) (powertbf01(pscale = 1/sqrt(2)), bfpwr 0.1.6)",
             help: "The prior you will use when you analyse the data (the default Bayes factor t-test's JZS prior). Use the same scale as in your analysis plan."}
          - {id: prior_location, label: "Centre of the analysis prior, as an effect size (optional; empty = 0)", type: number, path: target_test.prior_location, optional: true, empty_text: "0", min: -5, max: 5,
             shown_if: {field: method, is: bayes_factor},
             help: "Leave it empty for the default Bayes factor, which centres its prior on no effect. For an informed prior (for example one built from earlier studies), give its centre here and its spread as the scale above, as in your analysis plan."}
          - {id: prior_df, label: "Degrees of freedom of the analysis prior (optional; empty = 1, a Cauchy prior)", type: number, path: target_test.prior_df, optional: true, empty_text: "1", min: 1, max: 1000,
             shown_if: {field: method, is: bayes_factor},
             help: "The prior is a t distribution. 1 is a Cauchy prior with heavy tails, the default; larger values give lighter tails, close to a normal prior from about 30."}
          - {id: effect_sd, label: "How unsure you are about the effect, as an SD (0 = exactly this effect)", type: number, path: population.effect_sd, required: true, min: 0, range_reading: [d, dz],
             shown_if: {field: method, is: bayes_factor},
             default: 0, default_source: "powerkit's default: plan for exactly the effect you entered, as a usual power analysis does (bfpwr's own default spreads it as widely as the analysis prior; docs/conventions.md, Departure 15)",
             help: "Above 0, Powerkit averages over true effects spread around yours (a normal design prior with this SD), which usually needs a larger sample."}
          - {id: margin, label: "Smallest effect of interest, as Cohen's d", type: number, path: population.margin, required: true, min_exclusive: 0, writeup_label: "smallest effect of interest",
             shown_if: [{field: method, is: minimum_effect}, {field: effect_units, is_not: raw}],
             help: "The test shows that the effect is larger than this, not only that it isn't 0. With a one-sided hypothesis it is tested on that side; with a two-sided one, the effect has to be further from 0 than this in either direction. Your expected effect has to be larger than it."}
          - {id: raw_margin, label: "Smallest effect of interest, as a difference in your measure's own units", type: number, path: population.raw.margin, required: true, min_exclusive: 0, writeup_label: "smallest effect of interest",
             shown_if: [{field: method, is: minimum_effect}, {field: effect_units, is: raw}],
             help: "Powerkit divides it by the SD, as for the effect. The test shows that the effect is larger than this, not only that it isn't 0."}
    method_extra:
      # Welch's t-test: pwrss's formula by default, Spower's simulation on
      # request (8 November 2026).
      - {id: welch_method, label: "How power is worked out", type: select, path: options.method, optional: true,
         shown_if: {field: method, is: welch_t},
         choices: {exact: "Formula (pwrss's power.t.welch()): no simulation noise", simulation: "Simulation (Spower): repeat studies under the specified population"},
         default: exact, default_source: "pwrss's formula for Welch's t-test (power.t.welch(), pwrss 1.3.3), which agrees with a simulation and has no random error (pwr has no Welch formula)"}

  E3:
    scope_note: "Crossover study? This card does not model period, sequence or carry-over effects. Use it only for an ordinary paired analysis when omitting those terms is justified; it does not plan an adjusted crossover analysis."
    methods_name: "a paired-samples t-test"
    departures: ["15", "23", "37"]
    known_differences_if_method: {"5": wilcoxon_signed_rank, "6": bayes_factor}
    known_differences: ["5", "6", "11"]
    known_differences_if_goal: {"11": justified_alpha}
    tool: pwr
    sensitivity: true
    justified_alpha: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: paired_t,
           variables: {X: {type: within_factor}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean_difference}}
    groups:
      - input: "Names of the two conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are", help: "For example, session.", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "First condition", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Second condition", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The effect: d_z, or the means and SD in your measure's own units"
        fields:
          - {id: effect_units, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {standardised: "As d_z: mean of the differences (second minus first) / SD of the differences", raw: "In my measure's own units: the mean in each condition and an SD"},
             default: standardised, default_source: "d_z, the effect size pwr.t.test() takes for a paired test (pwr 1.3-0); Powerkit works it out from the means and SD if you give those"}
          - {id: dz, label: "Effect size d_z (the mean of the differences divided by their SD)", writeup_label: "d_z", type: number, path: population.dz, effect: true,
             shown_if: {field: effect_units, is_not: raw}}
          - {id: raw_mean_1, label: "Expected mean, first condition", type: number, path: population.raw.mean_1, effect: true, writeup_label: "first-condition mean",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_mean_2, label: "Expected mean, second condition", type: number, path: population.raw.mean_2, effect: true, writeup_label: "second-condition mean",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_sd_kind, label: "Which SD you know", type: select,
             choices: {difference: "The SD of people's changes (second minus first)", each: "The SD of the measure, and how strongly the two measurements correlate"},
             default: each, default_source: "the values researchers usually have from earlier studies (the SD of the measure and the test-retest correlation)",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_sd_difference, label: "SD of people's changes (second minus first)", type: number, path: population.raw.sd_difference, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD of the differences",
             shown_if: [{field: effect_units, is: raw}, {field: raw_sd_kind, is: difference}]}
          - {id: raw_sd, label: "SD: how much people usually vary on the measure", type: number, path: population.raw.sd, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD",
             shown_if: [{field: effect_units, is: raw}, {field: raw_sd_kind, is_not: difference}]}
          - {id: raw_r, help: "Use the correlation of the two measurements on the same people, from comparable data. It changes the SD of change scores and hence the answer. If you know the SD of changes, choose that SD option instead: no correlation is then needed. Otherwise compare justified correlation scenarios or save a draft; zero is an assumption, not an unknown value.", label: "Correlation between the two measurements", type: number, path: population.raw.r, required: true, min_exclusive: -1, max_exclusive: 1, in_effect_text: true, writeup_label: "correlation between the measurements",
             shown_if: [{field: effect_units, is: raw}, {field: raw_sd_kind, is_not: difference}]}
      - input: "The t-test, the Wilcoxon signed-rank test, Yuen's trimmed-means test, a Bayes factor t-test or a minimum-effect test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {t_test: "Paired-samples t-test", wilcoxon_signed_rank: "Wilcoxon signed-rank test (rank-based), simulated", yuen: "Yuen's paired trimmed-means test (robust t-test), simulated", bayes_factor: "Bayes factor t-test (default JZS prior), instead of a p-value", minimum_effect: "Minimum-effect test"},
             default: t_test, default_source: "the t-test pwr's formula covers (pwr.t.test(type = 'paired'), pwr 1.3-0)",
             choice_notes: {yuen: "Compares the two measurements' trimmed means (20% trimmed from each end by default, as in WRS2's yuend()), so a few extreme scores have little pull. It trims each measurement separately, so it needs the correlation between them as well as d_z."}}
          - {id: yuen_score_shape, label: "The shape of each measurement's scores", type: select, path: population.score_shape, required: true,
             shown_if: {field: method, is: yuen},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_wilcox.test(), Spower 0.7)",
             help: "Both measurements have this shape; the second is shifted by your d_z. Heavy tails are where trimming gains most over the t-test."}
          - {id: yuen_r, label: "Correlation between the two measurements", type: number, path: population.r, required: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: method, is: yuen},
             help: "Use the correlation of the two measurements on the same people, from comparable data. Yuen's test trims each measurement separately, so its power depends on this correlation as well as on d_z. Compare justified values if you are unsure; there is no neutral default."}
          - {id: trim, label: "Share trimmed from each end of each measurement (0.2 = 20%)", type: number, path: target_test.trim, required: true, min: 0, max_exclusive: 0.5,
             shown_if: {field: method, is: yuen},
             default: 0.2, default_source: "20% from each end, WRS2's default (yuend(tr = 0.2), WRS2 1.1-7)",
             help: "Use the trimming you will analyse with. 0.2 is the usual choice; 0 is no trimming (the paired t-test)."}
          - {id: score_shape, label: "The shape of the changes (second minus first)", type: select, path: population.score_shape, required: true,
             shown_if: {field: method, is: wilcoxon_signed_rank},
             choices: {normal: "Roughly normal (bell-shaped)", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_wilcox.test(), Spower 0.7)",
             help: "The signed-rank test assumes people's changes are symmetric, so a skewed shape isn't offered here. The effect stays the same d_z: the whole distribution of changes shifts by it."}
          - {id: evidence_threshold, label: "Evidence threshold: the Bayes factor (BF10) the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: method, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), bfpwr's default (powertbf01(k = 1/10), its threshold on BF01, which its help calls Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the effect exists than if it doesn't. Power here is the chance that BF10 reaches this number."}
          - {id: prior_scale, label: "Scale of the analysis prior (by default a Cauchy distribution centred on 0)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0.707, default_source: "bfpwr's default, 1/sqrt(2) (powertbf01(pscale = 1/sqrt(2)), bfpwr 0.1.6)",
             help: "The prior you will use when you analyse the data (the default Bayes factor t-test's JZS prior). Use the same scale as in your analysis plan."}
          - {id: prior_location, label: "Centre of the analysis prior, as an effect size (optional; empty = 0)", type: number, path: target_test.prior_location, optional: true, empty_text: "0", min: -5, max: 5,
             shown_if: {field: method, is: bayes_factor},
             help: "Leave it empty for the default Bayes factor, which centres its prior on no effect. For an informed prior (for example one built from earlier studies), give its centre here and its spread as the scale above, as in your analysis plan."}
          - {id: prior_df, label: "Degrees of freedom of the analysis prior (optional; empty = 1, a Cauchy prior)", type: number, path: target_test.prior_df, optional: true, empty_text: "1", min: 1, max: 1000,
             shown_if: {field: method, is: bayes_factor},
             help: "The prior is a t distribution. 1 is a Cauchy prior with heavy tails, the default; larger values give lighter tails, close to a normal prior from about 30."}
          - {id: effect_sd, label: "How unsure you are about the effect, as an SD (0 = exactly this effect)", type: number, path: population.effect_sd, required: true, min: 0, range_reading: [d, dz],
             shown_if: {field: method, is: bayes_factor},
             default: 0, default_source: "powerkit's default: plan for exactly the effect you entered, as a usual power analysis does (bfpwr's own default spreads it as widely as the analysis prior; docs/conventions.md, Departure 15)",
             help: "Above 0, Powerkit averages over true effects spread around yours (a normal design prior with this SD), which usually needs a larger sample."}
          - {id: margin, label: "Smallest effect of interest, as d_z", type: number, path: population.margin, required: true, min_exclusive: 0, writeup_label: "smallest effect of interest",
             shown_if: [{field: method, is: minimum_effect}, {field: effect_units, is_not: raw}],
             help: "The test shows that the effect is larger than this, not only that it isn't 0. With a one-sided hypothesis it is tested on that side; with a two-sided one, the effect has to be further from 0 than this in either direction. Your expected effect has to be larger than it."}
          - {id: raw_margin, label: "Smallest effect of interest, as a difference in your measure's own units", type: number, path: population.raw.margin, required: true, min_exclusive: 0, writeup_label: "smallest effect of interest",
             shown_if: [{field: method, is: minimum_effect}, {field: effect_units, is: raw}],
             help: "Powerkit divides it by the SD of the differences, as for the effect. The test shows that the effect is larger than this, not only that it isn't 0."}

  E4:
    methods_name: "a Pearson correlation"
    departures: ["10", "15", "24"]
    known_differences: ["11", "12"]
    known_differences_if_goal: {"11": justified_alpha}
    known_differences_if_method: {"12": bayes_factor}
    tool: pwr
    sensitivity: true
    justified_alpha: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: correlation,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: correlation, method: pearson}}
    groups:
      - input: "Names of the two variables"
        fields:
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
      - input: "The expected correlation r"
        fields:
          - {id: r, label: "Correlation r", type: number, path: population.r, effect: true, min: -1, max: 1}
      - input: "Pearson's r, Spearman's rho, Kendall's tau or a Bayes factor test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {pearson: "Pearson's r", spearman: "Spearman's rho (rank-based), simulated", kendall: "Kendall's tau (rank-based), simulated", bayes_factor: "Bayes factor test of Pearson's r, instead of a p-value"},
             default: pearson, default_source: "Pearson's r, the correlation G*Power and pwr plan for",
             help: "For Spearman's or Kendall's, enter r above as the Pearson correlation of the scores; Powerkit simulates the rank test on scores of the shape you choose below with that correlation."}
          - {id: score_shape, label: "The shape of both scores", type: select, path: population.score_shape, required: true,
             shown_if: {field: method, is_one_of: [spearman, kendall]},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_r(), Spower 0.7)",
             help: "A rank correlation's advantage over Pearson's r is in skewed or heavy-tailed data. The second score is drawn as r times the first plus another draw of the same shape, so its shape is close to, not exactly, the one chosen."}
          - {id: evidence_threshold, label: "Evidence threshold: the Bayes factor (BF10) the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: method, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the two scores are correlated than if they aren't. Power here is the chance that BF10 reaches this number."}
          - {id: prior_width, label: "Width of the analysis prior", type: number, path: target_test.prior_width, required: true, min_exclusive: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 1, default_source: "JASP's Bayesian correlation ('Stretched beta prior width' 1); BayesFactor's own default is 1/3",
             help: "On the correlation: a stretched beta distribution. The prior you will use when you analyse the data: 1 gives every correlation from -1 to 1 the same weight (JASP's default); smaller values put more weight near 0 (1/3 is BayesFactor's default). Use the same value as in your analysis plan."}
          - {id: r_sd, label: "Uncertainty in the correlation", type: number, path: population.r_sd, required: true, min: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0, default_source: "powerkit's default: plan for exactly the correlation you entered, as a usual power analysis does (docs/conventions.md, Departure 15)",
             help: "As an SD. 0 means exactly this correlation. Above 0, Powerkit averages over correlations spread around yours (a stretched beta design prior with this SD): the average power over your uncertainty."}
    method_extra:
      - {id: correlation_formula, label: "Which formula", type: select, path: options.correlation_formula, optional: true,
         shown_if: [{field: calc_method, is: exact}, {field: method, is: pearson}],
         choices: {exact: "Exact, as in G*Power (the exact distribution of r; pwrss)", fisher_z: "Fisher's z, an approximation (pwr)"},
         default: exact, default_source: "the exact method, G*Power's default for this test (pwrss's power.exact.onecor(), pwrss 1.3.3)"}

  # The repeated-measures correlation (Bakdash and Marusich, 2017): pwrss's
  # exact distribution of r at the effective sample size N(k - 1) + 1.
  E76:
    methods_name: "a repeated-measures correlation"
    tool: pwrss
    sensitivity: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: repeated_measures_correlation,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: correlation, method: rmcorr}}
    groups:
      - input: "Names of the two scores"
        fields:
          - {id: X_label, label: "First score", type: text, path: variables.X.label, required: true}
          - {id: Y_label, label: "Second score", type: text, path: variables.Y.label, required: true}
      - input: "The expected correlation within people, and how many times each person is measured"
        fields:
          - {id: r, writeup_label: "repeated-measures correlation", label: "Correlation within people (r_rm)", type: number, path: population.r, effect: true, min: -1, max: 1,
             help: "How strongly the two scores go together within people, once each person's own average is removed. rmcorr and JASP report it as r_rm. It is often smaller than the correlation between people's averages."}
          - {id: measurements, label: "Times each person is measured on both scores", type: number, path: population.measurements, required: true, min: 2, integer: true,
             help: "For example, 7 for a week of daily diaries. Count only the occasions on which both scores are measured."}

  E5:
    methods_name: "a test of two proportions (z test)"
    departures: ["11", "5", "15"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, group 2's proportion can stay empty if you have no estimate: Powerkit keeps group 1's proportion and finds how far above it group 2's would need to be. A lower value for group 2 looks for a decrease instead."
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: two_proportions,
           variables: {X: {type: binary}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: proportion_difference, method: z_test}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: X_label, label: "What the groups are", help: "For example, condition.", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Yes/no outcome", help: "For example, attended.", type: text, path: variables.Y.label, required: true}
      - input: "The expected proportion of 'yes' in each group"
        fields:
          - {id: p1, label: "Proportion of 'yes' in group 1", help: "Between 0 and 1.", type: number, path: population.p1, effect: true, baseline: true, min: 0, max: 1}
          - {id: p2, label: "Proportion of 'yes' in group 2", help: "Between 0 and 1.", type: number, path: population.p2, effect: true, when_empty: same_as_p1, min: 0, max: 1}
      - input: "The size of group 2 relative to group 1"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwr.2p.test() (pwr 1.3-0) and Spower's default (p_prop.test(n.ratios = rep(1, length(prop))), Spower 0.7)"}
      - input: "The z test, Fisher's exact test or a Bayes factor test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {z_test: "Two-proportion z test (uncorrected)", z_test_corrected: "Two-proportion test (continuity-corrected)", fisher_exact: "Fisher's exact test", bayes_factor: "Bayes factor test"},
             default: z_test, default_source: "the test G*Power and pwr's formulas cover for two independent proportions",
             help: "Choose the test you will actually use to analyse your study. R's prop.test() applies continuity correction by default; that can lower power compared with the uncorrected test.",
             choice_notes: {fisher_exact: "An exact test of two independent proportions, rather than a large-sample z approximation. Group sizes and expected proportions still determine its power.", z_test_corrected: "R's prop.test(correct = TRUE) with fixed group sizes. Powerkit works out its power exactly, over every possible result of the study, so there is no simulation error and the sample size is the smallest that reaches the target. Power and required sample size are supported; to compare effects, run separate fixed-sample power plans. This is not Fisher's exact test, and the correction does not make a sparse-data approximation exact."}}
          - {id: evidence_threshold, label: "Evidence threshold: the Bayes factor (BF10) the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: method, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the groups' proportions differ than if they are the same. Power here is the chance that BF10 reaches this number."}
          - {id: prior_concentration, label: "Prior concentration", type: number, path: target_test.prior_concentration, required: true, min: 1,
             shown_if: {field: method, is: bayes_factor},
             default: 1, default_source: "JASP's Bayesian contingency tables ('Prior concentration' 1, with 'Indep. multinomial, rows fixed') and BayesFactor's contingencyTableBF()",
             help: "The prior you will use when you analyse the data: 1 gives every proportion in each group the same weight (the usual default); larger values expect the groups to be more alike. Use the same value as in your analysis plan."}
          - {id: p_sd, label: "Uncertainty in each group's proportion", type: number, path: population.p_sd, required: true, min: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0, default_source: "powerkit's default: plan for exactly the proportions you entered, as a usual power analysis does (docs/conventions.md, Departure 15)",
             help: "As an SD. 0 means exactly these proportions. Above 0, Powerkit averages over proportions spread around yours in each group (a beta design prior with this SD): the average power over your uncertainty."}
    # Known differences that apply only with one test version.
    known_differences_if_method: {"2": fisher_exact, "13": bayes_factor}
    known_differences: ["2", "13"]
    method_extra:
      - {id: proportions_formula, label: "Which formula", type: select, path: options.proportions_formula, optional: true,
         shown_if: [{field: calc_method, is: exact}, {field: method, is: z_test}],
         choices: {z_test: "z test, as in G*Power (base R's power.prop.test() for equal groups, pwrss for unequal groups)", arcsine: "Cohen's h, the arcsine approximation (pwr)"},
         default: z_test, default_source: "G*Power's z test for two independent proportions, with its default options"}

  E6:
    sides: false
    methods_name: "a chi-square test of independence"
    departures: ["5"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, the table can stay empty if you have no estimate: Powerkit then finds the smallest association (Cohen's w) for your numbers of categories."
    basic_method: true
    directional: false
    base: {spec_version: "0.1", design: basic_test, template: chi_square_independence,
           variables: {X: {type: categorical}, "Y": {type: categorical}}, population: {metric: proportion},
           target_test: {effect: association, method: pearson_chi_square}}
    groups:
      - input: "The categories of each variable"
        fields:
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "Its categories, separated by commas", type: levels, path: variables.X.levels, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
          - {id: Y_levels, label: "Its categories, separated by commas", type: levels, path: variables.Y.levels, required: true}
      - input: "The expected proportion of people in each combination (adding up to 1), or Cohen's w"
        fields:
          - {id: chisq_metric, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {proportion: "As a table of proportions", w: "As an effect size: Cohen's w, as in G*Power"},
             default: proportion, default_source: "the proportions, from which pwr's ES.w2() works out Cohen's w (pwr 1.3-0); pwr.chisq.test() itself takes w"}
          - {id: probabilities, label: "Proportion in each cell", text_layout: "one line per category of the first variable, one number per category of the second, separated by commas", help: "One line per category of the first variable, with one number per category of the second, separated by commas.", type: table, path: population.probabilities, effect: true, when_empty: no_association,
             alternative: {field: chisq_metric, value: w, label: "Give Cohen's w instead"},
             shown_if: {field: chisq_metric, is_not: w}}
          - {id: w, label: "Cohen's w", writeup_label: "Cohen's w", type: number, path: population.w, effect: true, min_exclusive: 0,
             help: "Cohen's w for the association, as G*Power takes it. The degrees of freedom come from the numbers of categories. Powerkit treats it as the true effect; a published value tends to be too large.",
             shown_if: {field: chisq_metric, is: w}}
      - input: "The chi-square test or a Bayes factor"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {pearson_chi_square: "Pearson's chi-square test (uncorrected)", pearson_chi_square_corrected: "Pearson's chi-square test (continuity-corrected)", bayes_factor: "Bayes factor test (a contingency table Bayes factor), instead of a p-value, simulated"},
             default: pearson_chi_square, default_source: "Pearson's chi-square test, which pwr computes (pwr.chisq.test(), pwr 1.3-0) as G*Power does",
             help: "Choose the test in your analysis plan. R's chisq.test() uses continuity correction by default for 2 by 2 tables only. The corrected and Bayes factor versions need the table of proportions, not Cohen's w.",
             choice_notes: {pearson_chi_square_corrected: "Needs a 2 by 2 table of population proportions. R's chisq.test(correct = TRUE) with a fixed total sample size; row and column totals vary. Powerkit works out its power exactly, over every possible table. If group sizes are fixed, use the two-proportions design instead. Supports power and required sample size; to compare effects, run separate fixed-sample power plans. Sparse counts can still make this approximate test unsuitable."}}
          - {id: evidence_threshold, label: "Evidence threshold: the Bayes factor (BF10) the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: method, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the two variables are associated than if they aren't. Power here is the chance that BF10 reaches this number."}
          - {id: sampling_plan, label: "Sampling plan of the analysis", type: select, path: target_test.sampling_plan, required: true,
             shown_if: {field: method, is: bayes_factor},
             choices: {rows_fixed: "Independent multinomial, rows fixed: the number in each category of the first variable is set in advance", columns_fixed: "Independent multinomial, columns fixed: the number in each category of the second variable is set in advance",
                       joint_multinomial: "Joint multinomial: only the total is set in advance", poisson: "Poisson: not even the total is set in advance"},
             default: rows_fixed, default_source: "JASP's Bayesian contingency tables ('Indep. multinomial, rows fixed')",
             help: "The sampling plan you will choose when you analyse the data in JASP, and how the data are collected. With the rows (or columns) fixed, powerkit simulates studies whose group sizes are set in advance: each row's (or column's) share of the table above, times the total, in whole people. Otherwise each simulated study has the total you enter, divided among the cells by chance."}
          - {id: prior_concentration, label: "Prior concentration", type: number, path: target_test.prior_concentration, required: true, min: 1,
             shown_if: {field: method, is: bayes_factor},
             default: 1, default_source: "JASP's Bayesian contingency tables ('Prior concentration' 1) and BayesFactor's contingencyTableBF()",
             help: "The prior you will use when you analyse the data: 1 is the usual default; larger values expect the categories to be more alike. Use the same value as in your analysis plan."}

  E7:
    sides: false
    methods_name: "a 2 × 2 between-participants ANOVA"
    departures: ["1", "3"]
    tool: Superpower
    directional: false
    sensitivity: true
    base: {spec_version: "0.1", design: factorial_anova, template: 2x2_between,
           variables: {A: {type: between_factor}, B: {type: between_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "Factor A", type: text, path: variables.A.label, required: true}
          - {id: A_level1, label: "Factor A, level 1", type: text, path: variables.A.levels.1, required: true}
          - {id: A_level2, label: "Factor A, level 2", type: text, path: variables.A.levels.2, required: true}
          - {id: B_label, label: "Factor B", type: text, path: variables.B.label, required: true}
          - {id: B_level1, label: "Factor B, level 1", type: text, path: variables.B.levels.1, required: true}
          - {id: B_level2, label: "Factor B, level 2", type: text, path: variables.B.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The four expected cell means (raw or in SD units)"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: m11, label: "Mean: A level 1, B level 1", type: number, path: population.means.1.1, effect: true}
          - {id: m12, label: "Mean: A level 1, B level 2", type: number, path: population.means.1.2, effect: true}
          - {id: m21, label: "Mean: A level 2, B level 1", type: number, path: population.means.2.1, effect: true}
          - {id: m22, label: "Mean: A level 2, B level 2", type: number, path: population.means.2.2, effect: true}
      - input: "The SD (one, or one per cell)"
        fields:
          # The spec's population > sd is one number or a 2 x 2 array of
          # positive numbers (rows = levels of A), as validate_spec() accepts.
          - {id: sd_mode, label: "One SD, or one per cell", type: select, required: true,
             choices: {one: "One SD for all four cells", per_cell: "A different SD in each cell"},
             default: one, default_source: "the simpler choice; choose one per cell if you expect the spreads to differ"}
          - {id: sd, label: "SD (one value for all four cells)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is_not: per_cell}}
          - {id: sd11, label: "SD: A level 1, B level 1", type: number, path: population.sd.1.1, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd12, label: "SD: A level 1, B level 2", type: number, path: population.sd.1.2, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd21, label: "SD: A level 2, B level 1", type: number, path: population.sd.2.1, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd22, label: "SD: A level 2, B level 2", type: number, path: population.sd.2.2, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
      - input: "Which effect: factor A, factor B or the interaction"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {main_effect_A: "Factor A", main_effect_B: "Factor B", interaction: "The interaction"}}
      - input: "The F test, the aligned rank transform or a Bayes factor"
        fields:
          - {id: test_version, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {anova_f: "ANOVA (F test)", aligned_rank_transform: "Aligned rank transform ANOVA (rank-based), simulated", bayes_factor: "Bayes factor of the effect (an inclusion Bayes factor), instead of a p-value, simulated"},
             default: anova_f, default_source: "the F test Superpower computes (Superpower 0.2.4.1), as G*Power does"}
          - {id: score_shape, label: "The shape of the scores in each cell", type: select, path: population.score_shape, required: true,
             shown_if: {field: test_version, is: aligned_rank_transform},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, as Spower's rank-test experiments default to (Spower 0.7)",
             help: "Every cell has the same shape, with its own mean and SD. A rank test's power depends on this shape; the ANOVA's figure assumes normal scores."}
          - {id: evidence_threshold, label: "Evidence threshold: the inclusion Bayes factor the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: test_version, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)"}
          - {id: prior_scale, label: "Scale of the analysis prior on the effects (r scale, a Cauchy distribution)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: test_version, is: bayes_factor},
             default: 0.5, default_source: "BayesFactor's 'medium' r scale for fixed effects, 0.5, which JASP uses (jaspAnova's AdditionalOptions.qml)"}
          - {id: inclusion, label: "How the effect's Bayes factor is averaged over the models", type: select, path: target_test.inclusion, required: true,
             shown_if: {field: test_version, is: bayes_factor},
             choices: {all_models: "Across all models", matched_models: "Across matched models (only models with and without the effect that otherwise match)"},
             default: all_models, default_source: "across all models with equal prior probabilities, the default of JASP's Effects table (jaspAnova's DefaultOptions.qml)",
             help: "The inclusion Bayes factor compares the models that include the effect with those that don't. JASP gives it across all models by default; across matched models is the comparison some researchers prefer for interactions."}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         shown_if: {field: test_version, is: anova_f},
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for the 2 x 2 designs (design spec, options > method)"}

