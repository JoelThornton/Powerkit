# Input screens for the end points powerkit runs (E1-E14).
#
# Routing prototype, phase 5 groundwork: a screen collects the values listed
# under "What you would enter" on the card, builds a design spec and checks
# it with the engine's validate_spec(). Nothing is calculated.
#
# Each form has `groups`, one per line of the card's "What you would enter"
# (`input` is that line, copied from tree.yaml; a test checks they match),
# plus the shared closing fields (goal, alpha, power, direction, effect-size
# justification, attrition) that R/forms.R adds.
#
# Field keys:
#   id       input id (prefixed "f_" in the app)
#   label    the field's own label
#   type     text | number | select | levels (comma-separated names) |
#            table (rows of comma-separated numbers)
#   path     where the value goes in the spec ("a.b.c"; levels.1 = first level)
#   effect   true for population values (effect sizes, SDs, correlations):
#            they start empty and are required (setting effect_size_inputs)
#   required true if the screen can't build a spec without it
#   optional true if it may be left empty (then the engine's default applies)
#   default  a starting value for a non-effect field, with default_source
#            saying whose default it is
#   min, max limits checked by the screen before the engine sees the spec
#   shown_if {field: <id>, is: <value>} or {field: <id>, is_not: <value>}:
#            the field is shown, checked and put in the spec only when the
#            other field's choice matches (E7's per-cell SDs)

# Defaults of the tool each end point wraps, read from the installed
# packages' function signatures on 17 October 2026.
tool_defaults:
  pwr:
    alpha: 0.05
    alpha_source: "pwr's default (pwr.t.test(sig.level = 0.05), pwr 1.3-0)"
    power_source: "pwr has no default target power (pwr.t.test(power = NULL)); enter one"
    alternative_source: "pwr's default (two-sided: pwr.t.test(alternative = \"two.sided\"), pwr 1.3-0)"
  Spower:
    alpha: 0.05
    alpha_source: "Spower's default (Spower(sig.level = 0.05), Spower 0.7)"
    power_source: "Spower has no default target power (Spower(power = NA)); enter one"
    alternative_source: "Spower's default (two-sided: two.tailed = TRUE, alternative = NULL, Spower 0.7)"
  Superpower:
    alpha: 0.05
    alpha_source: "Superpower's default (Superpower_options(\"alpha_level\") is 0.05, Superpower 0.2.4.1)"
    power_source: "Superpower reports power and has no default target power; enter one"
  InteractionPoweR:
    alpha: 0.05
    alpha_source: "InteractionPoweR's default (power_interaction(alpha = 0.05), InteractionPoweR 0.2.4)"
    power_source: "InteractionPoweR has no default target power (power_estimate() needs power_target); enter one"
  power4mome:
    alpha: 0.05
    alpha_source: "power4mome's default (95% confidence intervals: n_region_from_power(ci_level = 0.95), power4mome 0.2.1)"
    power: 0.8
    power_source: "power4mome's default (n_region_from_power(target_power = 0.8), power4mome 0.2.1)"

# The seed a calculation uses unless the user changes it (judgement-calls.md
# B15): fixed, so the same answers always give the same result. It is shown
# on the input screen and the result screen, recorded in the result and
# written into the exported R script.
default_seed: 1

# How E1-E6 are calculated (docs/decisions.md, 17 October 2026): pwr's
# formula by default; Spower simulation if the user expects their data
# won't meet the test's assumptions. Welch's t-test (E2) has no pwr formula,
# so it is always simulated and the choice isn't shown.
# A form's `method_extra` fields are shown with this choice (E5: the z test,
# as in G*Power, or pwr's Cohen's h; Departure 11).
basic_method_field: {id: calc_method, label: "How power is worked out", type: select, path: options.method, optional: true,
  choices: {exact: "Formula (pwr; base R or pwrss for two proportions): assumes the test's assumptions hold", simulation: "Simulation (Spower): if you expect your data won't meet the test's assumptions"},
  default: exact, default_source: "powerkit's default for basic tests (docs/decisions.md, 17 October 2026)"}

# End points whose calculation runs on the input screen (phase 5). E1-E8
# run in seconds on one core (measured 17 October 2026 with the example
# values and 1,000 replications: 1 to 19 seconds, the longest a
# correlation's sample size). E9 runs in the background with a progress bar
# and a Cancel button (below). E10-E14 are not wired: they wait for the
# maintainer's decision on docs/phase5-simulations.md.
calculates: [E1, E2, E3, E4, E5, E6, E7, E8, E9]

# End points that run in a separate R process, with an estimated progress
# bar and a Cancel button: the usual run time in seconds for each goal,
# measured with the example values and 1,000 replications on one core
# (docs/phase5-simulations.md, table 1). The bar is estimated from these.
background:
  E9: {power: 5, sample_size: 80}

# Departures from the wrapped tool's conventions, shown on the result screen
# (CLAUDE.md). Each condenses its entry in docs/conventions.md, "Departures".
departures:
  "1": "Required N for a 2 x 2 interaction: powerkit gives the smallest N at which the exact F test reaches the target power. Sommet et al.'s (2023) z approximation gives slightly smaller numbers: 4 participants fewer (one per cell) in their two published examples."
  "2": "Mixed design: powerkit uses Superpower's ANOVA_exact(), which reproduces the G*Power values Superpower's vignette reports, not ANOVA_exact2(). The two differ slightly (91.2% vs 90.5% in the vignette's example)."
  "3": "Superpower's exact dataset is built under this run's seed, so the result is identical each time with the same seed. The size of this difference is about 1e-15 in power, with no practical effect."
  "9": "Calculated with a formula (pwr's, or base R's power.prop.test() for two proportions), not Spower's simulation (powerkit's earlier default): exact for the t-tests and the chi-square test, and approximate for a correlation (Fisher's z) and two proportions (a normal approximation), with no simulation noise. In the examples checked, the two differ by less than 0.01 in power, within the simulation's own noise."
  "10": "Correlation: pwr's formula uses Fisher's z, an approximation; G*Power uses the exact distribution of r. For r = .3 to .5 and N = 20 to 100 they differ by at most 0.004 in power, and the required N by at most 1 participant (85 rather than 84 for r = .3 and 80% power)."
  "11": "Two proportions: the z test as G*Power runs it (pooled variance under the null, no continuity correction, both tails counted), by base R's power.prop.test() with strict = TRUE; it matches G*Power to seven decimals. Its own default, strict = FALSE, counts one tail only: power .2340 rather than .2345 with proportions .10 and .25 and 20 per group. Unequal groups use pwrss's z test, which matches G*Power's power; powerkit keeps the groups in the exact ratio you give, so its required N can be a few higher (for 95% power with group 2 twice the size of group 1, 372 rather than G*Power's 370, whose groups of 123 and 247 fall just short of 95%)."
  "5": "No continuity correction, as in G*Power; Spower applies Yates' correction by default. In an example with proportions .50 and .65 and 170 per group, power is .818 without the correction and .789 with it."

forms:
  E1:
    departures: ["9"]
    tool: pwr
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: one_sample_t,
           variables: {"Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean, method: t_test}}
    groups:
      - input: "Your outcome's name"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "Cohen's d: (expected mean minus the fixed value) / SD"
        fields:
          - {id: d, label: "Cohen's d", type: number, path: population.d, effect: true}

  E2:
    departures: ["9"]
    tool: pwr
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: independent_t,
           variables: {X: {type: binary}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean_difference}}
    groups:
      - input: "Names of the two groups and the outcome"
        fields:
          - {id: X_label, label: "What the groups are (for example, condition)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "Cohen's d: (group 2 minus group 1) / pooled SD"
        fields:
          - {id: d, label: "Cohen's d", type: number, path: population.d, effect: true}
      - input: "The size of group 2 relative to group 1 (1 = equal)"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwr.t.test() (pwr 1.3-0) and Spower's default (p_t.test(n2_n1 = 1), Spower 0.7)"}
      - input: "Student's or Welch's test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {student_t: "Student's t-test (equal spread assumed)", welch_t: "Welch's t-test (equal spread not assumed)"},
             default: student_t, default_source: "the t-test pwr's formula covers (pwr.t.test(), pwr 1.3-0), and Spower's default (p_t.test(var.equal = TRUE), Spower 0.7)"}

  E3:
    departures: ["9"]
    tool: pwr
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: paired_t,
           variables: {X: {type: within_factor}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean_difference, method: t_test}}
    groups:
      - input: "Names of the two conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are (for example, session)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "First condition", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Second condition", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "d_z: mean of the differences (second minus first) / SD of the differences"
        fields:
          - {id: dz, label: "d_z", type: number, path: population.dz, effect: true}

  E4:
    departures: ["9", "10"]
    tool: pwr
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: correlation,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: correlation, method: pearson}}
    groups:
      - input: "Names of the two variables"
        fields:
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
      - input: "The expected correlation r"
        fields:
          - {id: r, label: "Correlation r", type: number, path: population.r, effect: true, min: -1, max: 1}

  E5:
    departures: ["9", "11", "5"]
    tool: pwr
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: two_proportions,
           variables: {X: {type: binary}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: proportion_difference, method: z_test}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: X_label, label: "What the groups are (for example, condition)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Yes/no outcome (for example, attended)", type: text, path: variables.Y.label, required: true}
      - input: "The expected proportion of 'yes' in each group"
        fields:
          - {id: p1, label: "Proportion of 'yes' in group 1 (0 to 1)", type: number, path: population.p1, effect: true, min: 0, max: 1}
          - {id: p2, label: "Proportion of 'yes' in group 2 (0 to 1)", type: number, path: population.p2, effect: true, min: 0, max: 1}
      - input: "The size of group 2 relative to group 1"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwr.2p.test() (pwr 1.3-0) and Spower's default (p_prop.test(n.ratios = rep(1, length(prop))), Spower 0.7)"}
    method_extra:
      - {id: proportions_formula, label: "Which formula", type: select, path: options.proportions_formula, optional: true,
         shown_if: {field: calc_method, is: exact},
         choices: {z_test: "z test, as in G*Power (base R's power.prop.test() for equal groups, pwrss for unequal groups)", arcsine: "Cohen's h, the arcsine approximation (pwr)"},
         default: z_test, default_source: "G*Power's z test for two independent proportions, default options (maintainer's decision, docs/decisions.md, 17 October 2026)"}

  E6:
    departures: ["9", "5"]
    tool: pwr
    basic_method: true
    directional: false
    base: {spec_version: "0.1", design: basic_test, template: chi_square_independence,
           variables: {X: {type: categorical}, "Y": {type: categorical}}, population: {metric: proportion},
           target_test: {effect: association, method: pearson_chi_square}}
    groups:
      - input: "The categories of each variable"
        fields:
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "Its categories, separated by commas", type: levels, path: variables.X.levels, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
          - {id: Y_levels, label: "Its categories, separated by commas", type: levels, path: variables.Y.levels, required: true}
      - input: "The expected proportion of people in each combination (adding up to 1)"
        fields:
          - {id: probabilities, label: "Proportions: one line per category of the first variable, one number per category of the second, separated by commas", type: table, path: population.probabilities, effect: true}

  E7:
    departures: ["1", "3"]
    tool: Superpower
    directional: false
    sensitivity: true
    base: {spec_version: "0.1", design: factorial_anova, template: 2x2_between,
           variables: {A: {type: between_factor}, B: {type: between_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "Factor A", type: text, path: variables.A.label, required: true}
          - {id: A_level1, label: "Factor A, level 1", type: text, path: variables.A.levels.1, required: true}
          - {id: A_level2, label: "Factor A, level 2", type: text, path: variables.A.levels.2, required: true}
          - {id: B_label, label: "Factor B", type: text, path: variables.B.label, required: true}
          - {id: B_level1, label: "Factor B, level 1", type: text, path: variables.B.levels.1, required: true}
          - {id: B_level2, label: "Factor B, level 2", type: text, path: variables.B.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The four expected cell means (raw or in SD units)"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: m11, label: "Mean: A level 1, B level 1", type: number, path: population.means.1.1, effect: true}
          - {id: m12, label: "Mean: A level 1, B level 2", type: number, path: population.means.1.2, effect: true}
          - {id: m21, label: "Mean: A level 2, B level 1", type: number, path: population.means.2.1, effect: true}
          - {id: m22, label: "Mean: A level 2, B level 2", type: number, path: population.means.2.2, effect: true}
      - input: "The SD (one, or one per cell)"
        fields:
          # The spec's population > sd is one number or a 2 x 2 array of
          # positive numbers (rows = levels of A), as validate_spec() accepts.
          - {id: sd_mode, label: "One SD, or one per cell", type: select, required: true,
             choices: {one: "One SD for all four cells", per_cell: "A different SD in each cell"},
             default: one, default_source: "the simpler choice; the design spec accepts either"}
          - {id: sd, label: "SD (one value for all four cells)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is_not: per_cell}}
          - {id: sd11, label: "SD: A level 1, B level 1", type: number, path: population.sd.1.1, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd12, label: "SD: A level 1, B level 2", type: number, path: population.sd.1.2, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd21, label: "SD: A level 2, B level 1", type: number, path: population.sd.2.1, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd22, label: "SD: A level 2, B level 2", type: number, path: population.sd.2.2, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
      - input: "Which effect: factor A, factor B or the interaction"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {main_effect_A: "Factor A", main_effect_B: "Factor B", interaction: "The interaction"}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for the 2 x 2 designs (design spec, options > method)"}

  E8:
    departures: ["2", "3"]
    tool: Superpower
    directional: false
    sensitivity: true
    base: {spec_version: "0.1", design: factorial_anova, template: 2x2_mixed,
           variables: {A: {type: between_factor}, B: {type: within_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "Between factor (for example, group)", type: text, path: variables.A.label, required: true}
          - {id: A_level1, label: "Between factor, level 1", type: text, path: variables.A.levels.1, required: true}
          - {id: A_level2, label: "Between factor, level 2", type: text, path: variables.A.levels.2, required: true}
          - {id: B_label, label: "Within factor (for example, time)", type: text, path: variables.B.label, required: true}
          - {id: B_level1, label: "Within factor, level 1", type: text, path: variables.B.levels.1, required: true}
          - {id: B_level2, label: "Within factor, level 2", type: text, path: variables.B.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The four expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: m11, label: "Mean: between level 1, within level 1", type: number, path: population.means.1.1, effect: true}
          - {id: m12, label: "Mean: between level 1, within level 2", type: number, path: population.means.1.2, effect: true}
          - {id: m21, label: "Mean: between level 2, within level 1", type: number, path: population.means.2.1, effect: true}
          - {id: m22, label: "Mean: between level 2, within level 2", type: number, path: population.means.2.2, effect: true}
      - input: "The SD"
        fields:
          - {id: sd, label: "SD (one value for all four cells)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The correlation between the two repeated measurements"
        fields:
          - {id: r, label: "Correlation between the two measurements", type: number, path: population.r, effect: true, min: -1, max: 1}
      - input: "Which effect: between factor, within factor or the interaction"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {main_effect_A: "The between factor", main_effect_B: "The within factor", interaction: "The interaction"}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for the 2 x 2 designs (design spec, options > method)"}

  E9:
    tool: InteractionPoweR
    directional: false
    base: {spec_version: "0.1", design: regression_interaction, template: two_way,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: interaction, method: ols_t}}
    names: [X, W, "Y"]
    groups:
      - input: "Correlations: X with Y, W with Y, the interaction XW with Y, and X with W"
        fields:
          - {id: r_X_Y, label: "Correlation of X with Y", type: number, path: population.r_X_Y, effect: true, min: -1, max: 1}
          - {id: r_W_Y, label: "Correlation of W with Y", type: number, path: population.r_W_Y, effect: true, min: -1, max: 1}
          - {id: r_XW_Y, label: "Correlation of the interaction XW with Y", type: number, path: population.r_XW_Y, effect: true, min: -1, max: 1}
          - {id: r_X_W, label: "Correlation of X with W", type: number, path: population.r_X_W, effect: true, min: -1, max: 1}
      - input: "Optional: reliability of X, W and Y"
        fields:
          - {id: rel_X, label: "Reliability of X (optional; empty = perfectly reliable)", type: number, path: variables.X.reliability, optional: true, min_exclusive: 0, max: 1}
          - {id: rel_W, label: "Reliability of W (optional; empty = perfectly reliable)", type: number, path: variables.W.reliability, optional: true, min_exclusive: 0, max: 1}
          - {id: rel_Y, label: "Reliability of Y (optional; empty = perfectly reliable)", type: number, path: variables.Y.reliability, optional: true, min_exclusive: 0, max: 1}

  E10:
    tool: power4mome
    directional: false
    base: {spec_version: "0.1", design: mediation, template: process_4,
           variables: {X: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, path: "X->M->Y", method: monte_carlo_ci}}
    names: [X, M, "Y"]
    groups:
      - input: "Standardised paths X -> M, M -> Y and X -> Y"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
      - input: "Number of Monte Carlo draws per CI (optional)"
        fields:
          - {id: ci_draws, label: "Monte Carlo draws per CI (optional; empty = 1,000, power4mome's default for q_power_mediation())", type: number, path: options.ci_draws, optional: true, min: 100, max: 100000, integer: true}

  E11:
    tool: power4mome
    directional: false
    mediators: parallel
    base: {spec_version: "0.1", design: mediation, template: process_4,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, method: monte_carlo_ci}}
    names: [X, "Y"]
    # Generated by R/forms.R for the chosen number of mediators: the paths
    # for each mediator, the residual correlations and the target path.
    groups:
      - input: "Standardised paths for each mediator"
        generated: parallel_paths
      - input: "Correlations between the mediators' residuals"
        generated: residual_correlations
      - input: "Which indirect path the hypothesis is about"
        generated: target_path

  E12:
    tool: power4mome
