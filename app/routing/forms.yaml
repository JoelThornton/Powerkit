    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "First factor", help: "For example, cue.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The first factor's levels, separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "Second factor", help: "For example, delay.", type: text, path: variables.B.label, required: true}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "cell means", text_layout: "one line per group, with one number per outcome, separated by commas", label: "Means in each cell", help: "One line per level of the first factor, with one number per level of the second, separated by commas.", type: table, path: population.means, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "level of the first factor", cols_name: "level of the second factor"}
      - input: "The SD"
        fields:
          - {id: spread, label: "Are the SD and the correlation the same in every combination?", type: select, required: true,
             choices: {same: "Yes: one SD, and one correlation for every pair of combinations", differ: "No: an SD for each combination and a correlation for each pair"},
             default: same, default_source: "one SD and one correlation, as Superpower's examples and G*Power's repeated-measures analysis take them",
             help: "When they differ, sphericity can fail, so Powerkit plans for the Greenhouse-Geisser corrected F test unless you choose otherwise below. Compare the MANOVA approach shown with the result."}
          - {id: sd, writeup_label: "SD", label: "SD (the same in every combination; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: spread, is_not: differ}}
          - {id: sds, writeup_label: "cell SDs", label: "SDs in each cell", text_layout: "one line per level of the first factor, with one number per level of the second, separated by commas (in the means' units)", help: "One line per level of the first factor, with one number per level of the second, separated by commas, in the means' units.", type: table, path: population.sd, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "level of the first factor", cols_name: "level of the second factor", shown_if: {field: spread, is: differ}}
      - input: "The correlation between any two conditions"
        fields:
          - {id: r, writeup_label: "correlation between conditions", label: "Correlation between combinations", help: "Between people's scores in any two combinations of the factors. The same for every pair.", type: number, path: population.r, effect: true, min: -1, max: 1,
             shown_if: {field: spread, is_not: differ}}
          - {id: rs, writeup_label: "correlations between combinations", label: "Correlations between the combinations", type: numbers, path: population.r, effect: true,
             shown_if: {field: spread, is: differ},
             help: "One for each pair of combinations, separated by commas, in the order: first level of the first factor with each level of the second, then the second level, and so on. For a 2 x 2 design the combinations are A1 B1, A1 B2, A2 B1, A2 B2, and the six pairs come in the order (1, 2), (1, 3), (1, 4), (2, 3), (2, 4), (3, 4)."}
          - {id: correction, label: "Sphericity correction of the F tests", type: select, path: target_test.correction, required: true,
             shown_if: [{field: spread, is: differ}, {field: test_version, is_not: aligned_rank_transform}],
             choices: {none: "None", GG: "Greenhouse-Geisser", HF: "Huynh-Feldt"},
             default: GG, default_source: "powerkit's choice: once the SDs or correlations differ, the uncorrected F test gives false positives more often than alpha, and the Greenhouse-Geisser correction is what researchers usually report (Superpower's own default is no correction)",
             choice_notes: {none: "The uncorrected F test is only valid if sphericity holds. With the SDs and correlations you describe it need not, and the test can then give false positives more often than alpha."}}
      - input: "Which effect"
