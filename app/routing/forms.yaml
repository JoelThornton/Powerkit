         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)",
         shown_if: [{field: test_version, is: anova_f}, {any: [{field: spread, is_not: differ}, {field: correction, is: none}]}]}
      # A corrected F test whose SDs or correlations differ: simulated by
      # default, because Superpower's exact data set scales the test by
      # epsilon, an approximation (Departure 28, 14 November 2026). Hidden
      # for the smallest detectable effect, which the engine finds with the
      # exact data set (sensitivity_method).
      - {id: gg_method, label: "How power is worked out", type: select, path: options.method, required: true,
         shown_if: [{field: test_version, is: anova_f}, {field: spread, is: differ}, {field: correction, is_not: none}, {field: goal, is_not: sensitivity}, {field: goal, is_not: sensitivity_curve}],
         choices: {simulation: "Repeated simulation of the corrected test (recommended)", exact: "Exact dataset, with the correction applied to its degrees of freedom: an approximation"},
         default: simulation, default_source: "powerkit's choice for a corrected test without sphericity (Departure 28): the exact dataset scales the test by epsilon, which missed simulated power by up to about 3 points in either direction",
         help: "With a sphericity correction and SDs or correlations that differ, only simulated studies give the corrected test's power itself. The exact dataset is instant but approximate.",
         choice_notes: {exact: "This approximation can be a few points too high or too low. Check the sample size by simulation before relying on it."}}

  # Two-factor ANOVA, both factors between participants, beyond 2 x 2
  # (28 October 2026): equal cells, one SD. No smallest detectable effect
  # yet.
  E21:
    sensitivity: true
    sides: false
    methods_name: "a two-factor between-participants ANOVA"
    departures: ["3"]
    tool: Superpower
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: factorial_between,
           variables: {A: {type: between_factor}, B: {type: between_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "First factor", help: "For example, feedback.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The first factor's levels, separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "Second factor", help: "For example, task difficulty.", type: text, path: variables.B.label, required: true}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "cell means", text_layout: "one line per group, with one number per outcome, separated by commas", label: "Means in each cell", help: "One line per level of the first factor, with one number per level of the second, separated by commas.", type: table, path: population.means, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "level of the first factor", cols_name: "level of the second factor"}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every cell; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "Which effect"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction: "The interaction: does one factor's effect depend on the other?", main_effect_A: "The first factor, averaged over the second", main_effect_B: "The second factor, averaged over the first"}}
      - input: "The F test, the aligned rank transform or a Bayes factor"
        fields:
          - {id: test_version, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {anova_f: "ANOVA (F test)", aligned_rank_transform: "Aligned rank transform ANOVA (rank-based), simulated", bayes_factor: "Bayes factor of the effect (an inclusion Bayes factor), instead of a p-value, simulated"},
             default: anova_f, default_source: "the F test Superpower computes (Superpower 0.2.4.1), as G*Power does"}
          - {id: score_shape, label: "The shape of the scores in each cell", type: select, path: population.score_shape, required: true,
             shown_if: {field: test_version, is: aligned_rank_transform},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, as Spower's rank-test experiments default to (Spower 0.7)",
             help: "Every cell has the same shape, with its own mean and SD. A rank test's power depends on this shape; the ANOVA's figure assumes normal scores."}
          - {id: evidence_threshold, label: "Evidence threshold: the inclusion Bayes factor the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: test_version, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)"}
          - {id: prior_scale, label: "Scale of the analysis prior on the effects (r scale, a Cauchy distribution)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: test_version, is: bayes_factor},
             default: 0.5, default_source: "BayesFactor's 'medium' r scale for fixed effects, 0.5, which JASP uses (jaspAnova's AdditionalOptions.qml)"}
          - {id: inclusion, label: "How the effect's Bayes factor is averaged over the models", type: select, path: target_test.inclusion, required: true,
             shown_if: {field: test_version, is: bayes_factor},
             choices: {all_models: "Across all models", matched_models: "Across matched models (only models with and without the effect that otherwise match)"},
             default: all_models, default_source: "across all models with equal prior probabilities, the default of JASP's Effects table (jaspAnova's DefaultOptions.qml)",
             help: "The inclusion Bayes factor compares the models that include the effect with those that don't. JASP gives it across all models by default; across matched models is the comparison some researchers prefer for interactions."}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         shown_if: {field: test_version, is: anova_f},
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}

  E23:
    sides: false
    methods_name: "an ANCOVA (Shieh's method)"
    tool: pwrss
    sensitivity: true
    sensitivity_shown_if: {field: test_version, is_not: bayes_factor}
    known_differences: ["15"]
    known_differences_if_method: {"15": ancova_f}
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_ancova,
           variables: {A: {type: between_factor}, "Y": {type: continuous}},
           target_test: {effect: main_effect_A, method: ancova_f}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          # Two crossed factors (28 October 2026): the template follows the
          # choice, and the second factor's fields, the table of cell means
          # and the effect appear only for it.
          - {id: factors, label: "How the groups are formed", type: select, path: template, required: true,
             choices: {oneway_ancova: "By one factor (for example, three conditions)",
                       factorial_ancova: "By two factors crossed, different people in every combination (for example, condition by delivery)"},
             default: oneway_ancova, default_source: "one factor, the usual ANCOVA",
             sets: {oneway_ancova: [{path: target_test.effect, value: main_effect_A}],
                    factorial_ancova: [{path: variables.B.type, value: between_factor}]}}
          - {id: A_label, label: "What the groups are", help: "For example, condition.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (two or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "The second factor", help: "For example, delivery.", type: text, path: variables.B.label, required: true,
             shown_if: {field: factors, is: factorial_ancova}}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true,
             shown_if: {field: factors, is: factorial_ancova}}
          - {id: Y_label, label: "Outcome", help: "For example, the after score.", type: text, path: variables.Y.label, required: true}
      - input: "The expected (adjusted) group means and SD"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "adjusted group means", label: "Adjusted means for each group", help: "Means adjusted for the covariates: one for each group, in the same order, separated by commas.", type: numbers, per_levels: A_levels, path: population.means, effect: true,
             shown_if: {field: factors, is_not: factorial_ancova}}
          - {id: cell_means, writeup_label: "adjusted cell means", label: "Adjusted means in each cell", text_layout: "one line per level of the first factor, with one number per level of the second, separated by commas", help: "Means adjusted for the covariates: one line per level of the first factor, with one number per level of the second, separated by commas.", type: table, path: population.means, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "level of the first factor", cols_name: "level of the second factor",
             shown_if: {field: factors, is: factorial_ancova}}
          - {id: sd, writeup_label: "SD", label: "SD of the outcome within groups", help: "Before adjusting. The same in every group; 1 if the means are in SD units.", type: number, path: population.sd, effect: true, min_exclusive: 0}
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction: "The interaction: does one factor's effect depend on the other?", main_effect_A: "The first factor, averaged over the second", main_effect_B: "The second factor, averaged over the first"},
             shown_if: {field: factors, is: factorial_ancova}}
      - input: "How much the covariate explains (R-squared), or its correlation with the outcome"
        fields:
          - {id: r2_covariates, writeup_label: "R-squared of the covariates", help: "The share of the outcome's variance the covariates explain. For one covariate, its correlation with the outcome, squared.", label: "R-squared of the covariates", type: number, path: population.r2_covariates, effect: true, min: 0, max_exclusive: 1}
          - {id: covariates, label: "Number of covariates", type: number, path: population.covariates, required: true, min: 1, integer: true,
             default: 1, default_source: "one covariate, such as the before score"}
          # Measured or fixed covariates (17 November 2026): the researcher
          # says which; neither is preselected (docs/decisions.md).
          - {id: covariate_model, label: "How the covariates come about", type: select, path: target_test.covariate_model, required: true,
             shown_if: [{field: test_version, is: ancova_f}, {field: metric, is_not: eta_squared}],
             choices: {random: "Measured on each person (for example, a before score or age)",
                       fixed: "Set by the design (for example, doses or times chosen in advance)"},
             help: "This changes how the covariates' spread enters the plan. Most covariates are measured, so they differ from one sample to the next.",
             choice_notes: {random: "Powerkit uses Shieh's (2020) method, which allows for measured covariates varying from sample to sample. G*Power treats covariates as fixed, so it gives a little more power and a slightly smaller sample.",
                            fixed: "The covariates' values are chosen in advance and would be the same in a repeat of the study, as G*Power assumes. For a measured covariate this gives slightly too much power."}}
      # The Bayes factor ANCOVA (15 November 2026): the effect's inclusion
      # Bayes factor, as JASP's Bayesian ANCOVA gives it, simulated with
      # BayesFactor's generalTestBF().
      - input: "The ANCOVA's F test or a Bayes factor"
        fields:
          - {id: test_version, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {ancova_f: "ANCOVA (F test)", bayes_factor: "Bayes factor of the effect (an inclusion Bayes factor), instead of a p-value, simulated"},
             default: ancova_f, default_source: "the ANCOVA's F test, the test G*Power's ANCOVA calculates; how the covariates come about is asked above",
             choice_notes: {bayes_factor: "Power becomes the chance that the effect's inclusion Bayes factor reaches the threshold you choose below, adjusting for the covariates. Simulated, with equal groups."}}
          - {id: evidence_threshold, label: "Evidence threshold: the inclusion Bayes factor the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: test_version, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)"}
          - {id: prior_scale, label: "Scale of the analysis prior", help: "The r scale of a Cauchy distribution on the group effects.", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: test_version, is: bayes_factor},
             default: 0.5, default_source: "JASP's Bayesian ANCOVA, 'r scale fixed effects' 0.5 (jaspAnova's AdditionalOptions.qml)"}
          - {id: prior_scale_covariates, label: "Scale of the prior on covariate slopes", help: "The r scale of a Cauchy distribution.", type: number, path: target_test.prior_scale_covariates, required: true, min_exclusive: 0,
             shown_if: {field: test_version, is: bayes_factor},
             default: 0.354, default_source: "JASP's Bayesian ANCOVA, 'r scale covariates' 0.354 (jaspAnova's AdditionalOptions.qml), BayesFactor's 'medium' scale for continuous predictors (sqrt(2)/4)"}
          - {id: inclusion, label: "How the effect's Bayes factor is averaged over the models", type: select, path: target_test.inclusion, required: true,
             shown_if: {field: test_version, is: bayes_factor},
             choices: {all_models: "Across all models", matched_models: "Across matched models (only models with and without the effect that otherwise match)"},
             default: all_models, default_source: "across all models with equal prior probabilities, the default of JASP's Effects table (jaspAnova's DefaultOptions.qml)",
             help: "The inclusion Bayes factor compares the models that include the effect with those that don't, including the models with and without each covariate. JASP gives it across all models by default; across matched models is the comparison some researchers prefer for interactions."}

  E24:
    sides: false
    methods_name: "a multiple regression F test"
    tool: pwrss
    sensitivity: true
    sensitivity_shown_if: {any: [[{field: question, is: r2_increase}, {field: r2c_test, is_not: bayes_factor}], [{field: question, is: r2_zero}, {field: r2_test, is: f_test}], [{field: question, is: single_coefficient}, {field: coef_test, is: f_test}]]}
    directional: false
    base: {spec_version: "0.1", design: multiple_regression,
           variables: {"Y": {type: continuous}}, population: {metric: r_squared},
           target_test: {method: f_test}}
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, this can stay empty: Powerkit works out the smallest R-squared (or increase) your sample could detect."
    effect_waits_for: question
    groups:
      - input: "Your outcome's name and what you want to test"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
          - {id: question, label: "What you want to test", type: select, path: template, required: true,
             choices: {r2_zero: "Whether the predictors together explain anything (R-squared against 0)",
                       r2_increase: "Whether some predictors add to the others (R-squared increase)",
                       single_coefficient: "Whether one predictor's coefficient differs from 0, controlling for the others"},
             sets: {r2_zero: [{path: target_test.effect, value: r_squared}],
                    r2_increase: [{path: target_test.effect, value: r_squared_change}],
                    single_coefficient: [{path: target_test.effect, value: coefficient}, {path: variables.X.type, value: continuous}]}}
          - {id: X_label, label: "The predictor you are testing", type: text, path: variables.X.label, required: true,
             shown_if: {field: question, is: single_coefficient}}
          # The Bayes factor for R-squared (14 November 2026): BayesFactor's
          # linearReg.R2stat(), the JZS Bayes factor of JASP's Bayesian
          # linear regression, exact from the noncentral F.
          - {id: r2_test, label: "Test version", type: select, path: target_test.method, required: true,
             shown_if: {field: question, is: r2_zero},
             choices: {f_test: "The F test of R-squared (G*Power's R-squared deviation from zero)",
                       bayes_factor: "Bayes factor (JZS prior on the coefficients), instead of a p-value"},
             default: f_test, default_source: "the F test, the test G*Power and pwrss's power.f.regression() compute",
             choice_notes: {bayes_factor: "Power becomes the chance that the Bayes factor for the model with all the predictors, against the model with none, reaches the threshold you choose below. Worked out exactly, with no simulation."}}
          # The Bayes factor for an increase or one coefficient (17 November
          # 2026): the full model against the model without the tested
          # predictors, simulated from the two R-squared values
          # (backend-bayesfactor-r2change.R).
          - {id: r2c_test, label: "Test version", type: select, path: target_test.method, required: true,
             shown_if: {field: question, is: r2_increase},
             choices: {f_test: "The F test of the increase (G*Power's R-squared increase)",
                       bayes_factor: "Bayes factor (JZS prior on the coefficients), instead of a p-value"},
             default: f_test, default_source: "the F test, the test G*Power and pwrss's power.f.regression() compute",
             choice_notes: {bayes_factor: "Power becomes the chance that the Bayes factor for the model with all the predictors, against the model without the ones you are testing, reaches the threshold you choose below (what BayesFactor's regressionBF() reports for that comparison). Simulated from the two R-squared values."}}
          - {id: evidence_threshold, label: "Evidence threshold: the Bayes factor (BF10) the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {any: [[{field: question, is: r2_zero}, {field: r2_test, is: bayes_factor}], [{field: question, is: r2_increase}, {field: r2c_test, is: bayes_factor}], [{field: question, is: single_coefficient}, {field: coef_test, is: bayes_factor}]]},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are under the model with the predictors you are testing than under the model without them (for R-squared against 0, without any). Power here is the chance that BF10 reaches this number."}
          - {id: prior_scale, label: "Scale of the analysis prior", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {any: [[{field: question, is: r2_zero}, {field: r2_test, is: bayes_factor}], [{field: question, is: r2_increase}, {field: r2c_test, is: bayes_factor}], [{field: question, is: single_coefficient}, {field: coef_test, is: bayes_factor}]]},
             default: 0.354, default_source: "JASP's Bayesian linear regression (JZS prior, 'r scale' 0.354), the same as BayesFactor's 'medium' scale for continuous predictors (regressionBF(rscaleCont = 'medium'), sqrt(2)/4; BayesFactor 0.9.12-4.8)",
             help: "The r scale of a Cauchy distribution on the standardised coefficients. The prior you will use when you analyse the data. 0.354 is the usual default; use the same value as in your analysis plan."}
      - input: "R-squared, the R-squared change, or the predictor's partial R-squared"
        fields:
          # Cohen's f-squared, G*Power's input (12 November 2026): the engine
          # converts it (effectsize's f2_to_eta2()) into the R-squared the
          # question takes, so the R-squared boxes give way to it.
          - {id: r2_given, label: "How you'll give the effect", type: select, optional: true, default: r2,
             choices: {r2: "As R-squared", f2: "As Cohen's f-squared, as in G*Power"},
             sets: {f2: [{path: effect_justification.conversion.from, value: f2}]},
             shown_if: [{field: question, is_one_of: [r2_zero, r2_increase, single_coefficient]}, {field: goal, is_one_of: [power, sample_size]}]}
          - {id: f2, writeup_label: "Cohen's f²", label: "Cohen's f-squared", type: number, path: effect_justification.conversion.value, conversion: true, required: true, min_exclusive: 0,
             shown_if: [{field: question, is_one_of: [r2_zero, r2_increase, single_coefficient]}, {field: goal, is_one_of: [power, sample_size]}, {field: r2_given, is: f2}],
             help: "As G*Power asks for it: R² / (1 − R²) against 0; for one predictor or a set, the R-squared it adds over 1 minus the R-squared with all the predictors. Powerkit turns it into R-squared (with the effectsize package) and shows the result. For a set, give the R-squared without the tested predictors below too (0 if there are none)."}
          - {id: r2, writeup_label: "R²", label: "R-squared of the model", help: "Between 0 and 1.", type: number, path: population.r2, effect: true, min: 0, max_exclusive: 1,
             shown_if: [{field: question, is: r2_zero}, {any: [[{field: r2_given, is_not: f2}], [{field: goal, is_one_of: [sensitivity, sensitivity_curve, ""]}]]}]}
          - {id: r2_full, writeup_label: "R² with all predictors", label: "R-squared with all the predictors", help: "Between 0 and 1.", type: number, path: population.r2_full, effect: true, when_empty: same_as_r2_reduced, min: 0, max_exclusive: 1,
             shown_if: [{field: question, is: r2_increase}, {any: [[{field: r2_given, is_not: f2}], [{field: goal, is_one_of: [sensitivity, sensitivity_curve, ""]}]]}]}
          - {id: r2_reduced, writeup_label: "R² without the tested predictors", label: "R-squared without the tested predictors", type: number, path: population.r2_reduced, effect: true, min: 0, max_exclusive: 1,
             shown_if: {any: [[{field: question, is: r2_increase}], [{field: question, is: single_coefficient}, {field: coef_test, is: bayes_factor}]]},
             help: "Without the predictors you are testing (0 to 1; 0 if there are no others). For one coefficient's Bayes factor, the R-squared of the outcome on the other predictors: the Bayes factor depends on both models' R-squared, not only the partial R-squared."}
          - {id: partial_r2, writeup_label: "partial R²", label: "Partial R-squared of the predictor", type: number, path: population.partial_r2, effect: true, min: 0, max_exclusive: 1,
             shown_if: [{field: question, is: single_coefficient}, {any: [[{field: r2_given, is_not: f2}], [{field: goal, is_one_of: [sensitivity, sensitivity_curve, ""]}]]}],
             help: "The share of the outcome's variance left over by the other predictors that this one explains: its squared partial correlation. From R-squared with and without it, (R² with − R² without) / (1 − R² without). G*Power asks for Cohen's f², which is partial R² / (1 − partial R²). Between 0 and 1."}
      - input: "Number of predictors"
        fields:
          - {id: predictors, label: "Number of predictors", type: number, path: population.predictors, required: true, min: 1, integer: true,
             shown_if: {field: question, is: r2_zero}}
          - {id: predictors_total, label: "Number of predictors in the full model", type: number, path: population.predictors_total, required: true, min: 1, integer: true,
             shown_if: {field: question, is_one_of: [r2_increase, single_coefficient]}}
          - {id: predictors_tested, label: "How many of them you are testing", type: number, path: population.predictors_tested, required: true, min: 1, integer: true,
             shown_if: {field: question, is: r2_increase}}
      - input: "How the predictor's coefficient is tested, and the spread and shape of the errors"
        fields:
          - {id: coef_test, label: "How the coefficient is tested", type: select, path: target_test.method, required: true,
             shown_if: {field: question, is: single_coefficient},
             choices: {f_test: "The usual t test (G*Power's single regression coefficient)",
                       ols_hc3: "The t test with HC3 robust standard errors, simulated",
                       ols_hc4: "The t test with HC4 robust standard errors, simulated",
                       quantile_regression: "Quantile regression (the median or another quantile instead of the mean), simulated",
                       bayes_factor: "Bayes factor (JZS prior on the coefficients), instead of a p-value"},
             default: f_test, default_source: "the usual t test, the test G*Power and pwrss's power.f.regression() compute",
             choice_notes: {bayes_factor: "Power becomes the chance that the Bayes factor for the model with all the predictors, against the model without this one, reaches the threshold you choose. It needs the R-squared without this predictor too. Simulated from the two R-squared values."},
             help: "The usual test assumes the outcome spreads out as much at every value of the predictor. Robust (HC3 or HC4) standard errors keep the test honest when the spread changes; HC4 is the safer of the two when a few people have extreme predictor values. Quantile regression tests a quantile of the outcome, such as the median, and is less affected by extreme outcome values."}
          - {id: variance_ratio, label: "Change in the spread", type: number, path: population.variance_ratio, required: true, min_exclusive: 0,
             shown_if: [{field: question, is: single_coefficient}, {field: coef_test, is_one_of: [ols_hc3, ols_hc4, quantile_regression]}],
             default: 1, default_source: "the same spread everywhere, as the usual test assumes (the design spec's default)",
             help: "The error variance 1 SD above the predictor's mean over that 1 SD below. 1 means no change. From earlier data: the variance of the residuals among people about 1 SD above the predictor's mean, divided by their variance about 1 SD below. 2 means the outcome is twice as variable at the high end. Below 1 means it is less variable."}
          - {id: error_shape, label: "Shape of the errors", type: select, path: population.error_shape, required: true,
             shown_if: [{field: question, is: single_coefficient}, {field: coef_test, is_one_of: [ols_hc3, ols_hc4, quantile_regression]}],
             choices: {normal: "Normal", skewed: "Skewed (a long tail on one side)", heavy_tailed: "Heavy-tailed (more extreme values than normal)"},
             default: normal, default_source: "normal errors, as the usual test assumes (the design spec's default)"}
          - {id: quantile, label: "The quantile of the outcome you test (0.5 = the median)", type: number, path: population.quantile, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{field: question, is: single_coefficient}, {field: coef_test, is: quantile_regression}],
             default: 0.5, default_source: "the median, quantreg's default (rq(tau = 0.5), quantreg 6.1)"}
  E25:
    methods_name: "an exact binomial test of one proportion"
    tool: pwrss
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_shown_if: {field: method, is_not: bayes_factor}
    sensitivity_note: "For the smallest effect you could detect, the expected proportion can stay empty if you have no estimate: Powerkit keeps the fixed value and finds how far above it the proportion would need to be. A value below the fixed one looks for a decrease instead."
    departures: ["15", "36"]
    known_differences: ["2"]
    known_differences_if_method: {"2": [exact_binomial, binom_test, z_test, z_test_corrected]}
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: one_proportion,
           variables: {"Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: proportion_vs_constant, method: exact_binomial}}
    groups:
      - input: "Your outcome's name"
        fields:
          - {id: Y_label, label: "Yes/no outcome", help: "For example, guessed correctly.", type: text, path: variables.Y.label, required: true}
      - input: "The expected proportion"
        fields:
          - {id: p, when_empty: same_as, same_as: p0, writeup_label: "expected proportion of 'yes'", label: "Expected proportion of 'yes'", help: "Between 0 and 1.", type: number, path: population.p, effect: true, min_exclusive: 0, max_exclusive: 1}
      - input: "The fixed value"
        fields:
          - {id: p0, label: "The fixed proportion to compare with", help: "From 0 to 1, for example 0.5 for chance with two options.", type: number, path: population.p0, required: true, min_exclusive: 0, max_exclusive: 1}
      - input: "The test: exact binomial, z test, or a Bayes factor test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {exact_binomial: "Exact binomial test, alpha / 2 in each tail", binom_test: "Exact binomial test, p-value as R's binom.test() gives it", z_test: "z test of one proportion, without continuity correction (R's prop.test(correct = FALSE))", z_test_corrected: "z test of one proportion, with continuity correction (R's prop.test(), its default)", bayes_factor: "Bayes factor test (beta prior on the proportion), instead of a p-value"},
             default: exact_binomial, default_source: "the exact binomial test pwrss computes (power.exact.oneprop(), pwrss 1.3.3), with alpha / 2 in each tail when two-sided",
             help: "Two-sided, exact binomial tests differ in how they find the p-value. With alpha / 2 in each tail (as pwrss computes it), each tail is tested at half the level. R's binom.test() adds up every count no more likely than the one observed, so its two tails needn't hold half each, and it often needs fewer people (83 against 94 for 20% against 10% at 80% power). One-sided, those two are the same test. The z test (a chi-square test against the fixed value) is the usual test in many software packages; R's prop.test() applies the continuity correction unless told not to, and the correction needs more people (89 against 78 here). Choose the one you will run."}
          - {id: evidence_threshold, label: "Evidence threshold: the Bayes factor (BF10) the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: method, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), bfpwr's default (pbinbf01(k = 1/10), its threshold on BF01, which its help calls Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the proportion differs from the fixed value than if it doesn't. Power here is the chance that BF10 reaches this number."}
          - {id: prior_a, label: "Analysis prior Beta(a, b): a", type: number, path: target_test.prior_a, required: true, min_exclusive: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 1, default_source: "JASP's Bayesian binomial test and bfpwr (binbf01(a = 1)): with b = 1, a uniform prior",
             help: "The prior you will use when you analyse the data: Beta(1, 1) gives every proportion the same weight. Use the same values as in your analysis plan."}
          - {id: prior_b, label: "Analysis prior Beta(a, b): b", type: number, path: target_test.prior_b, required: true, min_exclusive: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 1, default_source: "JASP's Bayesian binomial test and bfpwr (binbf01(b = 1))"}
          - {id: one_sided_null, label: "What a one-sided Bayes factor compares", type: select, path: target_test.one_sided_null, required: true,
             shown_if: [{field: method, is: bayes_factor}, {field: alternative, is_not: two_sided}],
             choices: {point: "The fixed value exactly, against one side (JASP's one-sided test)", directional: "At or below the fixed value, against above it (or the reverse; bfpwr's directional test)"},
             default: point, default_source: "JASP's Bayesian binomial test with a one-sided hypothesis",
             help: "JASP compares 'the proportion is exactly the fixed value' with 'it is higher' (or lower). The other version compares the two sides with each other, so evidence for no effect means evidence that the proportion is not higher."}
          - {id: p_sd, label: "Uncertainty in the proportion", type: number, path: population.p_sd, required: true, min: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0, default_source: "powerkit's default: plan for exactly the proportion you entered, as a usual power analysis does (docs/conventions.md, Departure 15)",
             help: "As an SD. 0 means exactly this proportion. Above 0, Powerkit averages over proportions spread around yours (a beta design prior with this SD): the average power over your uncertainty."}

  E26:
    methods_name: "an exact McNemar's test"
    tool: pwrss
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, the second proportion can stay empty if you have no estimate: Powerkit keeps the proportion who change only in the first condition and finds how many more would need to change only in the second. A smaller value looks for the opposite direction instead."
    # Known Difference 2 is about the exact test only.
    known_differences_if_method: {"2": mcnemar_exact}
    known_differences: ["2"]
    directional: true
    # Only the exact test has a one-sided version.
    direction_shown_if: [{field: method, is: mcnemar_exact}]
    base: {spec_version: "0.1", design: basic_test, template: mcnemar,
           variables: {X: {type: within_factor}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: paired_proportion_difference, method: mcnemar_exact}}
    groups:
      - input: "Names of the two conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are", help: "For example, session.", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "First condition", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Second condition", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Yes/no outcome", help: "For example, passed.", type: text, path: variables.Y.label, required: true}
      - input: "The expected discordant proportions"
        fields:
          - {id: p_first_only, baseline: true, writeup_label: "proportion 'yes' in the first condition only", label: "Proportion of people who say 'yes' in the first condition only", help: "Between 0 and 1.", type: number, path: population.p_first_only, effect: true, min: 0, max: 1}
          - {id: p_second_only, when_empty: same_as, same_as: p_first_only, writeup_label: "proportion 'yes' in the second condition only", label: "Proportion of people who say 'yes' in the second condition only", help: "Between 0 and 1.", type: number, path: population.p_second_only, effect: true, min: 0, max: 1}
      - input: "McNemar's exact test or the chi-square test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {mcnemar_exact: "McNemar's exact test", mcnemar_chisq: "McNemar's chi-square test (uncorrected)", mcnemar_chisq_corrected: "McNemar's chi-square test (continuity-corrected)"},
             default: mcnemar_exact, default_source: "the exact test G*Power's McNemar test computes, pwrss's exact power (power.exact.mcnemar(method = \"exact\"), pwrss 1.3.3)",
             help: "Choose the test you will actually use to analyse your study. R's mcnemar.test() applies the continuity correction by default; jamovi reports the uncorrected chi-square test by default; SPSS reports the exact test. The chi-square tests are two-sided.",
             choice_notes: {mcnemar_exact: "The binomial test of the pairs that changed. It never rejects a true null more often than alpha, so it can need a few more pairs than the chi-square test.", mcnemar_chisq: "The chi-square test without the correction, as jamovi reports it by default and R's mcnemar.test(correct = FALSE) runs it. Powerkit simulates its power with Spower.", mcnemar_chisq_corrected: "R's mcnemar.test() with its default continuity correction, which lowers power compared with the uncorrected test. Powerkit simulates its power with Spower."}}


  E36:
    # Equivalence tests: two one-sided tests (TOST) by TOSTER's exact
    # formula. One screen for the three comparisons TOSTER's power_t_TOST()
    # covers, and for a correlation and two proportions (TOSTER's z tests,
    # planned with pwrss: Departure 33); the comparison sets the template.
    methods_name: "an equivalence test (two one-sided tests, TOST)"
    departures: ["33"]
    sensitivity: true
    sides: false
    tool: TOSTER
    directional: false
    base: {spec_version: "0.1", design: equivalence_test,
           variables: {"Y": {type: continuous}}, population: {metric: standardised},
           target_test: {method: tost}}
    groups:
      - input: "What you are comparing, and the names"
        fields:
          - {id: comparison, label: "What you are comparing", type: select, path: template, required: true,
             choices: {tost_independent: "Two groups of different people",
                       tost_paired: "The same people measured twice (or in two conditions)",
                       tost_one_sample: "One group's mean against a fixed value",
                       tost_correlation: "A correlation between two things you measure",
                       tost_two_proportions: "Two groups' proportions (a yes/no outcome)",
                       noninf_independent: "Non-inferiority (no worse than, one direction): two groups of different people",
                       noninf_paired: "Non-inferiority: the same people in two conditions",
                       noninf_one_sample: "Non-inferiority: one group's mean against a reference value",
                       noninf_two_proportions: "Non-inferiority: two groups' proportions (a yes/no outcome)"},
             sets: {tost_independent: [{path: variables.X.type, value: binary}, {path: target_test.effect, value: mean_difference}],
                    tost_paired: [{path: variables.X.type, value: within_factor}, {path: target_test.effect, value: mean_difference}],
                    tost_one_sample: [{path: target_test.effect, value: mean}],
                    tost_correlation: [{path: variables.X.type, value: continuous}, {path: population.metric, value: r}, {path: target_test.effect, value: correlation}],
                    tost_two_proportions: [{path: variables.X.type, value: binary}, {path: variables.Y.type, value: binary}, {path: population.metric, value: proportion}, {path: target_test.effect, value: proportion_difference}],
                    noninf_independent: [{path: variables.X.type, value: binary}, {path: population.metric, value: standardised}, {path: target_test.effect, value: mean_difference}, {path: target_test.method, value: non_inferiority}],
                    noninf_paired: [{path: variables.X.type, value: within_factor}, {path: population.metric, value: standardised}, {path: target_test.effect, value: mean_difference}, {path: target_test.method, value: non_inferiority}],
                    noninf_one_sample: [{path: population.metric, value: standardised}, {path: target_test.effect, value: mean}, {path: target_test.method, value: non_inferiority}],
                    noninf_two_proportions: [{path: variables.X.type, value: binary}, {path: variables.Y.type, value: binary}, {path: population.metric, value: proportion}, {path: target_test.effect, value: proportion_difference}, {path: target_test.method, value: non_inferiority}]}}
          - {id: X_label, label: "What the groups or conditions are", help: "For example, condition.", type: text, path: variables.X.label, required: true,
             shown_if: {field: comparison, is_one_of: [tost_independent, tost_paired, tost_two_proportions, noninf_independent, noninf_paired, noninf_two_proportions]}}
          - {id: X_level1, label: "First group or condition", type: text, path: variables.X.levels.1, required: true,
             shown_if: {field: comparison, is_one_of: [tost_independent, tost_paired, tost_two_proportions, noninf_independent, noninf_paired, noninf_two_proportions]}}
          - {id: X_level2, label: "Second group or condition", type: text, path: variables.X.levels.2, required: true,
             shown_if: {field: comparison, is_one_of: [tost_independent, tost_paired, tost_two_proportions, noninf_independent, noninf_paired, noninf_two_proportions]}}
          - {id: cor_X_label, label: "First variable", type: text, path: variables.X.label, required: true,
             shown_if: {field: comparison, is: tost_correlation}}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true,
             shown_if: {field: comparison, is_not: tost_correlation}}
          - {id: cor_Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true,
             shown_if: {field: comparison, is: tost_correlation}}
      - input: "The equivalence bound and the difference you expect: Cohen's d (d_z for the same people measured twice), or in your measure's own units"
        shown_if: {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}
        note: "The bound is the smallest difference that would matter: a true difference between minus and plus the bound counts as too small to matter. The expected difference is what you think the true difference is; 0 (no difference at all) is the most optimistic case, and the closer it is to the bound, the more people you need."
        fields:
          - {id: effect_units, label: "How you'll give the bound and the difference", type: select, path: population.metric,
             choices: {standardised: "As Cohen's d (d_z for the same people measured twice)", raw: "In my measure's own units: the bound, the expected means and the SD"},
             default: standardised, default_source: "standardised units, which TOSTER's power_t_TOST() takes with sd = 1 (TOSTER 0.8.6); Powerkit works them out from the means and SD if you give those",
             shown_if: {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}}
          - {id: bound, label: "Equivalence bound", help: "More than 0.", type: number, path: population.bound, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "equivalence bound (±)",
             shown_if: [{field: goal, is_not: sensitivity}, {field: effect_units, is_not: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}]}
          - {id: d, label: "Expected true difference, as Cohen's d (0 = no difference)", type: number, path: population.d, effect: true, writeup_label: "expected Cohen's d",
             shown_if: [{field: effect_units, is_not: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is_not: tost_paired}]}
          - {id: dz, label: "Expected true difference, as d_z (0 = no difference)", type: number, path: population.dz, effect: true, writeup_label: "expected d_z",
             shown_if: [{field: effect_units, is_not: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_paired}]}
          - {id: raw_bound, label: "Equivalence bound, in your measure's units", help: "More than 0.", type: number, path: population.raw.bound, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "equivalence bound (±)",
             shown_if: [{field: goal, is_not: sensitivity}, {field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}]}
          - {id: raw_mean, label: "Expected mean", type: number, path: population.raw.mean, effect: true, writeup_label: "expected mean",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_one_sample}]}
          - {id: raw_test_value, label: "The fixed value it is compared with", type: number, path: population.raw.test_value, required: true, in_effect_text: true, writeup_label: "fixed value",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_one_sample}]}
          - {id: raw_mean_1, label: "Expected mean, first group or condition", type: number, path: population.raw.mean_1, effect: true, writeup_label: "first mean",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is_not: tost_one_sample}]}
          - {id: raw_mean_2, label: "Expected mean, second group or condition", type: number, path: population.raw.mean_2, effect: true, writeup_label: "second mean",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is_not: tost_one_sample}]}
          - {id: raw_sd, label: "SD: how much people usually vary on the measure (within a group)", type: number, path: population.raw.sd, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is_not: tost_paired}]}
          - {id: raw_sd_kind, label: "Which SD you know", type: select,
             choices: {difference: "The SD of people's changes (second minus first)", each: "The SD of the measure, and how strongly the two measurements correlate"},
             default: each, default_source: "the values researchers usually have from earlier studies (the SD of the measure and the test-retest correlation)",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_paired}]}
          - {id: raw_sd_difference, label: "SD of people's changes (second minus first)", type: number, path: population.raw.sd_difference, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD of the differences",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_paired}, {field: raw_sd_kind, is: difference}]}
          - {id: raw_sd_paired, label: "SD: how much people usually vary on the measure", type: number, path: population.raw.sd, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_paired}, {field: raw_sd_kind, is_not: difference}]}
          - {id: raw_r, label: "Correlation between the two measurements", type: number, path: population.raw.r, required: true, min_exclusive: -1, max_exclusive: 1, in_effect_text: true, writeup_label: "correlation between the measurements",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_paired}, {field: raw_sd_kind, is_not: difference}]}
      - input: "For two groups: the size of group 2 relative to group 1 (1 = equal)"
        shown_if: {field: comparison, is: tost_independent}
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in TOSTER's power_t_TOST() (one n for both groups, TOSTER 0.8.6)",
             shown_if: {field: comparison, is: tost_independent}}
      - input: "For a correlation or two proportions: the equivalence bound and the value you expect"
        shown_if: {field: comparison, is_one_of: [tost_correlation, tost_two_proportions]}
        note: "The bound is the smallest difference that would matter; the expected value is what you think the truth is. The closer it is to the bound, the more people you need."
        fields:
          - {id: cor_bound, label: "Equivalence bound, as a correlation", type: number, path: population.bound, required: true, min_exclusive: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "equivalence bound (±r)",
             shown_if: [{field: comparison, is: tost_correlation}, {field: goal, is_not: sensitivity}], help: "For example 0.2: a correlation between -0.2 and 0.2 counts as too small to matter. Between 0 and 1."}
          - {id: cor_r, label: "Expected true correlation (0 = none)", type: number, path: population.r, effect: true, min_exclusive: -1, max_exclusive: 1, writeup_label: "expected correlation",
             shown_if: {field: comparison, is: tost_correlation}}
          - {id: prop_bound, label: "Equivalence bound, as a difference in proportions", type: number, path: population.bound, required: true, min_exclusive: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "equivalence bound (±)",
             shown_if: [{field: comparison, is: tost_two_proportions}, {field: goal, is_not: sensitivity}], help: "For example 0.1: a difference of less than 10 percentage points either way counts as too small to matter. Between 0 and 1."}
          - {id: p1, label: "Expected proportion, first group", help: "Between 0 and 1.", type: number, path: population.p1, required: true, min_exclusive: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "first group's proportion",
             shown_if: {field: comparison, is: tost_two_proportions}}
          - {id: p2, label: "Expected proportion, second group", type: number, path: population.p2, effect: true, min_exclusive: 0, max_exclusive: 1, writeup_label: "second group's proportion",
             shown_if: {field: comparison, is: tost_two_proportions}, help: "Equal groups: TOSTER plans for the same number of people in each. Between 0 and 1."}
      - input: "For non-inferiority: the margin, which direction is better, and the difference you expect"
        shown_if: {field: comparison, is_one_of: [noninf_independent, noninf_paired, noninf_one_sample, noninf_two_proportions]}
        note: "The margin is the largest difference in the wrong direction that would still be acceptable: the new condition counts as no worse if it is worse by less than this. Group 2 (the second condition) is the new one."
        fields:
          - {id: better, label: "Which values of the outcome are better", type: select, path: population.better, required: true,
             shown_if: {field: comparison, is_one_of: [noninf_independent, noninf_paired, noninf_one_sample, noninf_two_proportions]},
             choices: {higher: "Higher values are better (for example wellbeing, recovery)", lower: "Lower values are better (for example symptoms, relapse)"}}
          - {id: ni_margin, label: "Non-inferiority margin, as Cohen's d (d_z for the same people; more than 0)", type: number, path: population.margin, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "non-inferiority margin",
             shown_if: {field: comparison, is_one_of: [noninf_independent, noninf_paired, noninf_one_sample]}}
          - {id: ni_d, label: "Expected true difference, as Cohen's d (0 = no difference)", type: number, path: population.d, effect: true, writeup_label: "expected Cohen's d",
             shown_if: {field: comparison, is_one_of: [noninf_independent, noninf_one_sample]},
             help: "Group 2 minus group 1 (or the mean minus the reference value), over the SD. It must be better than minus the margin."}
          - {id: ni_dz, label: "Expected true difference, as d_z (0 = no difference)", type: number, path: population.dz, effect: true, writeup_label: "expected d_z",
             shown_if: {field: comparison, is: noninf_paired}}
          - {id: ni_prop_margin, label: "Non-inferiority margin, as a difference in proportions", type: number, path: population.margin, required: true, min_exclusive: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "non-inferiority margin",
             shown_if: {field: comparison, is: noninf_two_proportions}, help: "For example 0.1: a proportion up to 10 percentage points worse counts as no worse. Between 0 and 1."}
          - {id: ni_p1, label: "Expected proportion, group 1 (the comparison)", type: number, path: population.p1, required: true, min_exclusive: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "group 1's proportion",
             shown_if: {field: comparison, is: noninf_two_proportions}}
          - {id: ni_p2, label: "Expected proportion, group 2 (the new condition)", type: number, path: population.p2, effect: true, min_exclusive: 0, max_exclusive: 1, writeup_label: "group 2's proportion",
             shown_if: {field: comparison, is: noninf_two_proportions}}
          - {id: ni_allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, pwrss's default (n.ratio = 1, pwrss 0.3.1)",
             shown_if: {field: comparison, is_one_of: [noninf_independent, noninf_two_proportions]}}

  E48:
    sides: false
    methods_name: "a chi-square goodness-of-fit test"
    tool: pwrss
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, Cohen's w can stay empty: the answer is the smallest w for your number of categories, whatever proportions you expect."
    directional: false
    base: {spec_version: "0.1", design: basic_test, template: chi_square_gof,
           variables: {"Y": {type: categorical}}, population: {metric: proportion},
           target_test: {effect: goodness_of_fit, method: pearson_chi_square}}
    groups:
      - input: "The categories of the variable"
        fields:
          - {id: Y_label, label: "Variable", help: "For example, preferred study method.", type: text, path: variables.Y.label, required: true}
          - {id: Y_levels, label: "Its categories, separated by commas", type: levels, path: variables.Y.levels, required: true}
      - input: "The expected proportion in each category, and the fixed proportions they are compared with, or Cohen's w"
        fields:
          - {id: chisq_metric, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {proportion: "As proportions", w: "As an effect size: Cohen's w, as in G*Power"},
             default: proportion, default_source: "the proportions, from which pwrss's probs.to.w() works out Cohen's w (pwrss 1.3.3); power.chisq.gof() itself takes w"}
          - {id: probabilities, baseline: true, writeup_label: "expected proportions", label: "Expected proportions", help: "One for each category, in the same order, separated by commas, adding up to 1.", type: numbers, per_levels: Y_levels, path: population.probabilities, effect: true,
             shown_if: {field: chisq_metric, is_not: w}}
          - {id: null_probabilities, writeup_label: "proportions under the null hypothesis", label: "Proportions under the null hypothesis", help: "Fixed proportions to compare with, in the same order as the categories. Optional: equal proportions if left empty.", type: numbers, per_levels: Y_levels, path: population.null_probabilities, optional: true,
             shown_if: {field: chisq_metric, is_not: w}}
          - {id: w, label: "Cohen's w", writeup_label: "Cohen's w", type: number, path: population.w, effect: true, min_exclusive: 0,
             help: "Cohen's w for the departure from the fixed proportions, as G*Power takes it. The degrees of freedom are the number of categories minus 1. Powerkit treats it as the true effect; a published value tends to be too large.",
             shown_if: {field: chisq_metric, is: w}}

  E29:
    methods_name: "a proportional-odds comparison of two groups on an ordinal outcome"
    tool: powertools
    sensitivity: true
    directional: false
    base: {spec_version: "0.1", design: ordinal_regression, template: ordinal_two_groups,
           variables: {X: {type: binary}, "Y": {type: categorical}}, population: {metric: proportion},
           target_test: {effect: odds_ratio, method: proportional_odds}}
    groups:
      - input: "Names of the groups, the outcome and its categories in order"
        fields:
          - {id: X_label, label: "What the groups are", help: "For example, condition.", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", help: "For example, symptom severity.", type: text, path: variables.Y.label, required: true}
          - {id: Y_levels, label: "Its categories in order, lowest first, separated by commas", type: levels, path: variables.Y.levels, required: true}
      - input: "The share of group 1 in each category, and the odds ratio"
        fields:
          - {id: probabilities, writeup_label: "shares of group 1 in each category", label: "Share of group 1 in each category", help: "One for each category, in the same order, separated by commas, adding up to 1.", type: numbers, per_levels: Y_levels, path: population.probabilities, effect: true}
          - {id: odds_ratio, optional_for: [sensitivity], when_empty: one, label: "Odds ratio, group 2 against group 1", type: number, path: population.odds_ratio, effect: true, min_exclusive: 0,
             help: "How many times higher the odds of a higher category are in group 2 than in group 1. Below 1 if group 2 tends to be in lower categories. When group 1's shares are uneven, power depends on the direction: a shift towards the categories with few people spreads the answers out and gives more power than the same odds ratio the other way."}
      - input: "The size of group 2 relative to group 1 (1 = equal)"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in powertools' propodds(n.ratio = 1) (powertools 1.0.0)"}

  E47:
    methods_name: "a factorial logistic regression (the test of one effect)"
    tool: Spower
    sensitivity: true
    directional: false
    base: {spec_version: "0.1", design: logistic_regression, template: factorial,
           variables: {A: {type: between_factor}, B: {type: between_factor}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {method: wald_chi_square}}
    groups:
      - input: "Names of the two factors, their levels and the yes/no outcome"
        fields:
          - {id: A_label, label: "First factor", help: "For example, message frame.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The first factor's levels, separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "Second factor", help: "For example, messenger.", type: text, path: variables.B.label, required: true}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true}
          - {id: Y_label, label: "Yes/no outcome", help: "For example, booked a flu jab.", type: text, path: variables.Y.label, required: true}
      - input: "The expected proportion of 'yes' in each combination"
        fields:
          - {id: probabilities, writeup_label: "proportions of 'yes' in each cell", label: "Proportion of 'yes' in each cell", text_layout: "one line per level of the first factor, with one number per level of the second, separated by commas", help: "From 0 to 1: one line per level of the first factor, with one number per level of the second, separated by commas.", type: table, path: population.probabilities, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "level of the first factor", cols_name: "level of the second factor"}
      - input: "Which effect"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction: "The interaction: does one factor's effect depend on the other?", main_effect_A: "The first factor, averaged over the second", main_effect_B: "The second factor, averaged over the first"}}
          - {id: factorial_test, label: "Test", type: select, path: target_test.method, required: true,
             choices: {firth_likelihood_ratio: "Firth's penalised likelihood-ratio test (logistf's logistftest())", likelihood_ratio: "Likelihood-ratio test (comparing the model with and without the effect, as car's Anova(type = 3, test.statistic = 'LR') reports it)", wald_chi_square: "Wald test (of the effect's coefficients, as the model summary and car's linearHypothesis() report it)"},
             default_source: "Not filled in for you: choose the test you will run (for reference: Spower's p_glm() runs the Wald test, Spower 0.7)",
             help: "All three test the same effect; choose the one you will report. Firth's test suits few 'yes' (or few 'no') answers in some combinations, or one where everyone answers the same way: it kept false positives near the significance level there, where the likelihood-ratio test ran a little above it and the Wald test lost power. The likelihood-ratio test is what R's model comparison reports, and the Wald test what the coefficient table shows. With many answers of each kind in every combination the three agree."}

  E49:
    methods_name: "a test of two independent correlations (Fisher's z)"
    tool: pwrss
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, group 2's correlation can stay empty if you have no estimate: Powerkit keeps group 1's correlation and finds how far above it group 2's would need to be. A lower value looks for a smaller correlation in group 2 instead."
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: two_correlations,
           variables: {G: {type: binary}, X: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: correlation_difference, method: fisher_z}}
    groups:
      - input: "Names of the two groups and the two variables"
        fields:
          - {id: G_label, label: "What the groups are", help: "For example, sample.", type: text, path: variables.G.label, required: true}
          - {id: G_level1, label: "Group 1", type: text, path: variables.G.levels.1, required: true}
          - {id: G_level2, label: "Group 2", type: text, path: variables.G.levels.2, required: true}
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
      - input: "The expected correlation in each group"
        fields:
          - {id: r1, baseline: true, writeup_label: "correlation in group 1", label: "Correlation r in group 1", type: number, path: population.r1, effect: true, min_exclusive: -1, max_exclusive: 1}
          - {id: r2, when_empty: same_as, same_as: r1, writeup_label: "correlation in group 2", label: "Correlation r in group 2", type: number, path: population.r2, effect: true, min_exclusive: -1, max_exclusive: 1}
      - input: "The size of group 2 relative to group 1"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwrss's power.z.twocors() (n.ratio = 1)"}

  # Variance tests: the chi-square and F distributions, as G*Power computes
  # them (engine, backend-variance.R; Known difference 4 no longer applies).
  # Variances, not SDs, because the spec holds variances; the help says how
  # to get one from an SD. Two groups are equal in size on this screen.
  E52:
    methods_name: "a chi-square test of one variance"
    sensitivity: true
    sensitivity_without_effect: true
    tool: formula
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: one_variance,
           variables: {"Y": {type: continuous}}, population: {metric: variance},
           target_test: {effect: variance_ratio, method: chi_square_var}}
    groups:
      - input: "Your outcome's name"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected variance and the fixed value"
        fields:
          - {id: var, when_empty: same_as, same_as: var0, writeup_label: "expected variance", label: "Expected variance (the SD squared)", type: number, path: population.var, effect: true, min_exclusive: 0,
             help: "For example, an SD of 1.2 is a variance of 1.44."}
          - {id: var0, label: "The fixed variance you compare it with", type: number, path: population.var0, required: true, min_exclusive: 0,
             help: "For example, the variance of a published norm. A one-sided test predicting 'positive' says your group's variance is the larger."}

  E53:
    methods_name: "an F test of two variances"
    departures: ["32"]
    sensitivity: true
    sensitivity_without_effect: true
    tool: formula
    directional: true
    # Only the F test has a one-sided version.
    direction_shown_if: [{field: method, is: f_var}]
    base: {spec_version: "0.1", design: basic_test, template: two_variances,
           variables: {G: {type: binary}, "Y": {type: continuous}}, population: {metric: variance},
           target_test: {effect: variance_ratio, method: f_var}}
    groups:
      - input: "Names of the two groups and the outcome"
        fields:
          - {id: G_label, label: "What the groups are", help: "For example, training.", type: text, path: variables.G.label, required: true}
          - {id: G_level1, label: "Group 1", type: text, path: variables.G.levels.1, required: true}
          - {id: G_level2, label: "Group 2", type: text, path: variables.G.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected variance in each group"
        fields:
          - {id: var1, when_empty: same_as, same_as: var2, writeup_label: "variance in group 1", label: "Variance in group 1 (the SD squared)", type: number, path: population.var1, effect: true, min_exclusive: 0,
             help: "For example, an SD of 1.2 is a variance of 1.44. A one-sided test predicting 'positive' says group 1's variance is the larger."}
          - {id: var2, baseline: true, writeup_label: "variance in group 2", label: "Variance in group 2 (the SD squared)", type: number, path: population.var2, effect: true, min_exclusive: 0}
      - input: "The F test, Levene's test or the Brown-Forsythe test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {f_var: "F test of two variances", levene: "Levene's test (deviations from the means)", brown_forsythe: "Brown-Forsythe test (deviations from the medians)"},
             default: brown_forsythe, default_source: "the Brown-Forsythe test, car::leveneTest()'s default, because it keeps the false-positive rate at alpha whatever the scores' shape (Departure 32); G*Power plans for the F test",
             help: "Choose the test you will actually use to analyse your study. The F test assumes normal scores, and with skewed or heavy-tailed scores it finds differences that aren't there. Levene's test is what SPSS reports; the Brown-Forsythe version is the default of R's car::leveneTest() and is the safer of the two with skewed or heavy-tailed scores. Only the F test can be one-sided.",
             choice_notes: {f_var: "Powerkit works out its power exactly, as G*Power does, for normal scores.", levene: "An ANOVA of each person's distance from their group's mean (car::leveneTest(center = mean)). Powerkit simulates its power with Spower, on scores of the shape you choose.", brown_forsythe: "As Levene's test, with distances from each group's median (car::leveneTest(center = median), car's default). Powerkit simulates its power with Spower, on scores of the shape you choose."}}
          - {id: score_shape, label: "The shape of the scores in each group", type: select, path: population.score_shape, required: true,
             shown_if: {field: method, is_one_of: [levene, brown_forsythe]},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, the F test's assumption and Spower's default for variance tests (gen_var.test(), Spower 0.7)",
             help: "Both groups have the same shape; they differ only in spread (their variances). These tests' power depends on the shape: heavy tails make the groups' spreads harder to tell apart."}

  # Two variances in the same people (the Pitman-Morgan test), simulated
  # with Spower's p_r() on the sum and the difference of the paired scores.
  E57:
    methods_name: "the Pitman-Morgan test of two paired variances"
    tool: Spower
    sensitivity: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: paired_variances,
           variables: {X: {type: within_factor}, "Y": {type: continuous}}, population: {metric: variance},
           target_test: {effect: variance_ratio, method: pitman_morgan}}
    groups:
      - input: "Names of the two measurements and the outcome"
        fields:
          - {id: X_label, label: "What the measurements are", help: "For example, session.", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "First measurement", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Second measurement", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected variance at each measurement, and how strongly the two correlate"
        fields:
          - {id: var1, optional_for: [sensitivity], when_empty: same_as, same_as: var2, writeup_label: "variance at the first measurement", label: "Variance at the first measurement (the SD squared)", type: number, path: population.var1, effect: true, min_exclusive: 0,
             help: "For example, an SD of 50 ms is a variance of 2500. A one-sided test predicting 'positive' says the first measurement's variance is the larger."}
          - {id: var2, writeup_label: "variance at the second measurement", label: "Variance at the second measurement (the SD squared)", type: number, path: population.var2, effect: true, baseline: true, min_exclusive: 0}
          - {id: pm_r, writeup_label: "correlation between the measurements", label: "Correlation between the two measurements", type: number, path: population.r, required: true, min_exclusive: -1, max_exclusive: 1, in_effect_text: true,
             help: "How strongly people's scores at the two measurements go together, for example a test-retest correlation of 0.6."}

  # One-way MANOVA (Pillai's trace; Hotelling's T-squared with two groups),
  # simulated with Spower. The outcomes are named in one field; R/forms.R
  # (build_spec()) makes one variable of each, Y1 to Yp.
  E59:
    methods_name: "a MANOVA (Pillai's trace; with two groups, Hotelling's T-squared)"
    sensitivity: true
    # Two groups by their means (Hotelling's T-squared) or any groups by
    # Pillai's V are exact; three or more groups by their means are
    # simulated and have no sensitivity analysis yet.
    sensitivity_shown_if: {field: manova_test, is: pillai_trace}
    tool: Spower
    directional: false
    known_differences: ["8"]
    # Two groups are calculated exactly (Hotelling's T-squared), as G*Power
    # does, so Known difference 8 is about three or more groups.
    known_differences_if_groups_above: {"8": 2}
    # Pillai's V is computed by G*Power's own formula (Faul et al., 2007),
    # so Known difference 8 is about the means route only.
    known_differences_if_metric: {"8": raw}
    outcomes: Y_labels
    base: {spec_version: "0.1", design: basic_test, template: manova,
           variables: {A: {type: between_factor}}, population: {metric: raw},
           target_test: {effect: main_effect_A, method: pillai_trace}}
    groups:
      - input: "The groups and the outcomes"
        fields:
          - {id: manova_factors, label: "How the groups are formed", type: select, required: true,
             choices: {one: "By one factor (for example, three conditions)", two: "By two factors crossed, different people in every combination (for example, condition by delivery)"},
             default: one, default_source: "one factor, the usual MANOVA",
             sets: {one: [{path: target_test.effect, value: main_effect_A}], two: [{path: variables.B.type, value: between_factor}]}}
          - {id: A_label, label: "What the groups are", help: "For example, condition.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (two or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "The second factor", help: "For example, delivery.", type: text, path: variables.B.label, required: true,
             shown_if: {field: manova_factors, is: two}}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true,
             shown_if: {field: manova_factors, is: two}}
          - {id: manova_effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction: "The interaction: does the first factor's effect depend on the second?", main_effect_A: "The first factor", main_effect_B: "The second factor"},
             default: interaction, default_source: "the interaction, usually the question a two-factor design is built for",
             shown_if: {field: manova_factors, is: two}}
          - {id: Y_labels, label: "The outcomes (two to nine), separated by commas", type: levels, required: true,
             help: "The scores compared together, for example anxiety, depression, stress."}
      - input: "The expected means on each outcome, or Pillai's V"
        fields:
          - {id: manova_metric, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {raw: "As each group's mean on each outcome", pillai_v: "As an effect size: Pillai's V, as in G*Power"},
             default: raw, default_source: "the means, from which Powerkit works out the test; Pillai's V is G*Power's single effect size for a MANOVA (Faul et al., 2007)",
             help: "Means show which outcomes you expect the groups to differ on, and can be justified from earlier studies or from the differences that would matter. Pillai's V is one number for the whole pattern, so it hides which differences it assumes."}
          - {id: pillai_v, label: "Pillai's V of the effect you test", writeup_label: "Pillai's V", type: number, path: population.pillai_v, effect: true, min_exclusive: 0,
             help: "Pillai's trace, as G*Power's MANOVA tests take it: between 0 and the smaller of the number of outcomes and the number of groups minus 1 (for an interaction, its degrees of freedom). Powerkit treats it as the true effect, as G*Power does; a published V is that study's estimate and tends to be too large. Power is by the formula of Faul et al. (2007), as in G*Power; the outcomes' SDs and correlation aren't needed.",
             shown_if: {field: manova_metric, is: pillai_v}}
          - {id: means, writeup_label: "group means", text_layout: "one line per group, with one number per outcome, separated by commas", label: "Means: one line per group, with one number per outcome, separated by commas", type: table, path: population.means, effect: true,
             rows_from: A_levels, cols_from: Y_labels, rows_name: "group", cols_name: "outcome",
             alternative: {field: manova_metric, value: pillai_v, label: "Give Pillai's V instead"},
             shown_if: [{field: manova_factors, is_not: two}, {field: manova_metric, is_not: pillai_v}]}
          - {id: cell_means, writeup_label: "group means", label: "Means in each cell", text_layout: "one line per combination of the two factors (the first factor's levels slowest: first with first, first with second, ...), with one number per outcome", help: "One line per combination of the two factors (the first factor's levels slowest: first with first, first with second, and so on), with one number per outcome.", type: table, path: population.means, effect: true,
             rows_from: [A_levels, B_levels], cols_from: Y_labels, rows_name: "combination", cols_name: "outcome",
             alternative: {field: manova_metric, value: pillai_v, label: "Give Pillai's V instead"},
             shown_if: [{field: manova_factors, is: two}, {field: manova_metric, is_not: pillai_v}]}
      - input: "Each outcome's SD, and the correlation between the outcomes"
        fields:
          - {id: sds, writeup_label: "outcome SDs", label: "SDs: one for each outcome, in the same order, separated by commas", type: numbers, per_levels: Y_labels, path: population.sds, effect: true,
             help: "Within a group, in the means' units; the same in every group.", shown_if: {field: manova_metric, is_not: pillai_v}}
          - {id: manova_r, writeup_label: "correlation between the outcomes", label: "Correlation between outcomes", type: number, path: population.r, required: true, min_exclusive: -1, max_exclusive: 1, in_effect_text: true,
             help: "Between any two outcomes within a group. The same for every pair. How strongly people's scores on two outcomes go together, for example 0.5 for related questionnaires.", shown_if: {field: manova_metric, is_not: pillai_v}}
      - input: "MANOVA or PERMANOVA"
        fields:
          - {id: manova_test, label: "Test", type: select, path: target_test.method, required: true,
             choices: {pillai_trace: "MANOVA (Pillai's trace; with two groups, Hotelling's T-squared)", permanova: "PERMANOVA (a permutation test on distances between people), simulated"},
             default: pillai_trace, default_source: "the MANOVA test of Pillai's trace, as G*Power computes it",
             help: "PERMANOVA (vegan's adonis2()) compares the groups' average distances on the standardised outcomes with a permutation test, so it doesn't assume normal scores. It can also react to groups that differ in spread rather than in their means."}
          - {id: score_shape, label: "The shape of the scores", type: select, path: population.score_shape, required: true,
             shown_if: {field: manova_test, is: permanova},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, as Spower's rank-test experiments default to (Spower 0.7)",
             help: "Every outcome has this shape. With a shape other than normal, each person's scores share a common level, so the correlation between outcomes must be at least 0."}

  # One-sample Hotelling's T-squared: one group's outcomes against fixed
  # values (scale norms, midpoints), computed exactly by its noncentral F
  # distribution (Anderson, 2003, section 5.4; engine backend-hotelling.R).
  # The outcomes are named in one field, as for E59, which makes one
  # variable of each, Y1 to Yp.
  E60:
    methods_name: "a one-sample Hotelling's T-squared test"
    sensitivity: true
    tool: formula
    directional: false
    outcomes: Y_labels
    base: {spec_version: "0.1", design: basic_test, template: hotelling_one,
           population: {metric: raw},
           target_test: {effect: mean_vector, method: hotelling_t2}}
    groups:
      - input: "The outcomes"
        fields:
          - {id: Y_labels, label: "The outcomes (two to nine), separated by commas", type: levels, required: true,
             help: "The scores compared together, for example anxiety, depression, stress."}
      - input: "The expected means and the fixed values"
        fields:
          - {id: means, writeup_label: "expected means", label: "Expected means", help: "One for each outcome, in the same order, separated by commas.", type: numbers, per_levels: Y_labels, path: population.means, effect: true}
          - {id: mu0, writeup_label: "fixed values", label: "The fixed values to compare with", type: numbers, per_levels: Y_labels, path: population.mu0, effect: true,
             help: "One for each outcome, in the same order. For example each scale's published norm or its midpoint, in the same units as the means."}
      - input: "Each outcome's SD, and the correlation between the outcomes"
        fields:
          - {id: sds, writeup_label: "outcome SDs", label: "SDs: one for each outcome, in the same order, separated by commas", type: numbers, per_levels: Y_labels, path: population.sds, effect: true}
          - {id: manova_r, writeup_label: "correlation between the outcomes", label: "Correlation between any two outcomes (the same for every pair)", type: number, path: population.r, required: true, min_exclusive: -1, max_exclusive: 1, in_effect_text: true,
             help: "How strongly people's scores on two outcomes go together, for example 0.5 for related questionnaires."}

  # A planned meta-analysis (metapower's mpower()): the test of the
  # average effect, with n the number of studies.
  E61:
    methods_name: "a meta-analysis"
    tool: metapower
    directional: true
    meta: true
    sensitivity: true
    # The average effect only; the other questions have no sensitivity
    # analysis yet.
    sensitivity_shown_if: {field: meta_question, is: mean_effect}
    departures: ["18"]
    known_differences: ["9"]
    base: {spec_version: "0.1", design: meta_analysis, template: mean_effect,
           variables: {"Y": {type: continuous}},
           target_test: {effect: mean_effect, method: z_test}}
    groups:
      - input: "The outcome, and whether the studies give Cohen's d or a correlation"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
          - {id: meta_question, label: "What the meta-analysis tests", type: select, path: template, required: true,
             choices: {mean_effect: "The average effect", subgroups: "Whether the effect differs between kinds of study (a subgroup or moderator analysis, e.g. lab against online)",
                       dependent_effects: "The average effect, when studies give several effects each (several outcomes or time points)",
                       meta_regression: "Whether the effect changes with a score measured on each study (a meta-regression, e.g. the studies' mean age)",
                       heterogeneity: "Whether the studies' true effects differ at all (the test of heterogeneity, Cochran's Q)"},
             sets: {subgroups: [{path: target_test.effect, value: moderator}, {path: target_test.method, value: q_test}],
                    dependent_effects: [{path: target_test.method, value: rve_t}],
                    meta_regression: [{path: target_test.effect, value: moderator_slope}],
                    heterogeneity: [{path: target_test.effect, value: heterogeneity}, {path: target_test.method, value: q_test}]},
             default: mean_effect, default_source: "the average effect, a meta-analysis's main question"}
          - {id: meta_metric, label: "The effect size the studies give", type: select, path: population.metric, required: true,
             choices: {d: "Cohen's d: two groups compared in each study", r: "A correlation r"}, default: d,
             default_source: "Cohen's d, the first effect size metapower's mpower() takes (metapower 0.2.2)"}
      - input: "The average effect, the size of a typical study and the heterogeneity (I-squared)"
        fields:
          - {id: meta_effects, writeup_label: "average effects of the kinds of study", label: "Average effect in each kind of study", help: "Separated by commas, for example lab then online: 0.2, 0.5. The studies are split equally between the kinds.", type: numbers, path: population.effects, effect: true,
             shown_if: {field: meta_question, is: subgroups}}
          - {id: meta_effect, optional_for: [sensitivity], writeup_label: "average effect", label: "The average effect the meta-analysis should detect", type: number, path: population.effect, effect: true,
             shown_if: {field: meta_question, is_one_of: [mean_effect, dependent_effects, meta_regression, heterogeneity]},
             help: "As Cohen's d, or as r. The smallest average effect that would matter, or one from an earlier review, reduced for publication bias."}
          - {id: meta_slope, writeup_label: "change in the effect per SD of the moderator", label: "Change in the effect per SD of the moderator", type: number, path: population.slope, effect: true,
             shown_if: {field: meta_question, is: meta_regression},
             help: "On the effect's scale: Fisher's z for a correlation (0.15 in z is about 0.15 in r for small correlations), d or the log ratio otherwise. For example 0.15: studies one SD older on average have an effect 0.15 larger. The average effect above is at the moderator's mean."}
          - {id: study_size, label: "Participants in a typical study (both groups together for d)", type: number, path: population.study_size, required: true, min: 4, integer: true, in_effect_text: true, writeup_label: "participants per study",
             help: "Every study is taken to be this size; metapower splits it into two equal groups for d."}
          - {id: i2, label: "Heterogeneity, as I-squared", type: number, path: population.i2, required: true, min: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "I-squared",
             shown_if: {field: meta_question, is_not: dependent_effects},
             help: "The share of the variation between the studies' effects that isn't chance. Valentine, Pigott and Rothstein (2010), following Higgins and colleagues, describe 0.25, 0.5 and 0.75 as small, moderate and large degrees of heterogeneity. From 0 to below 1."}
          - {id: effects_per_study, label: "Effect sizes each study gives (the same in every study)", type: number, path: population.effects_per_study, required: true, min: 2, integer: true, in_effect_text: true, writeup_label: "effect sizes per study",
             shown_if: {field: meta_question, is: dependent_effects}}
          - {id: meta_tau, writeup_label: "SD between studies (tau)", label: "Heterogeneity between studies (tau)", type: number, path: population.tau, effect: true, min: 0,
             shown_if: {field: meta_question, is: dependent_effects},
             help: "The SD of the studies' average true effects. On the effect's own scale (Fisher's z for r). 0.1 for d is modest heterogeneity."}
          - {id: meta_omega, writeup_label: "SD within studies (omega)", label: "SD of the true effects within a study (omega: heterogeneity within studies)", type: number, path: population.omega, effect: true, min: 0,
             shown_if: {field: meta_question, is: dependent_effects}}
          - {id: meta_rho, writeup_label: "correlation of a study's sampling errors", label: "Correlation between sampling errors", type: number, path: population.rho, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: meta_question, is: dependent_effects},
             help: "Between a study's effect sizes' sampling errors (0 to just under 1). How alike the estimates from the same participants are, for example 0.6 for outcomes measured on the same people. POMADE's authors suggest trying several values when it isn't known."}
      - input: "The fixed-effect or the random-effects model, and the test"
        fields:
          - {id: meta_model, label: "Model", type: select, path: target_test.model, required: true,
             choices: {random: "Random effects: the studies' true effects differ", fixed: "Fixed effect: every study estimates the same effect"},
             shown_if: {field: meta_question, is_one_of: [mean_effect, subgroups]},
             default: random, default_source: "powerkit's choice: the random-effects model, which allows for the studies' true effects differing (metapower reports both)"}
          - {id: meta_test, label: "Test of the average effect", type: select, path: target_test.test, required: true,
             choices: {hartung_knapp: "Hartung-Knapp (recommended; simulated)", z: "z test (metapower's formula)"}, default: hartung_knapp,
             default_source: "powerkit's choice (Departure 18): the Hartung-Knapp test keeps false positives closer to alpha, especially with few studies (IntHout, Ioannidis & Borm, 2014)",
             help: "Plan with the test you will run. The z test is what metapower and many older meta-analyses use; it is too often significant when there are few studies.",
             shown_if: [{field: meta_model, is: random}, {field: meta_question, is_one_of: [mean_effect, subgroups]}]}
          - {id: meta_reg_test, label: "Test of the moderator's slope", type: select, path: target_test.test, required: true,
             choices: {hartung_knapp: "Hartung-Knapp", z: "z test"}, default: hartung_knapp,
             default_source: "powerkit's choice (Departure 18), as for the average effect: the Hartung-Knapp test keeps false positives closer to alpha with few studies",
             shown_if: {field: meta_question, is: meta_regression}}

  # Logistic regression, one predictor (pwrss's Wald z test): a score X is
  # taken as standardised, so its odds ratio is per SD; a yes/no X compares
  # its second group with the first. Other predictors enter only through
  # X's R-squared with them (docs/conventions.md, Known difference 3).
  E27:
    methods_name: "a logistic regression (the Wald z test of one predictor)"
    tool: pwrss
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, the odds ratio can stay empty if you have no estimate: Powerkit keeps the proportion of 'yes' at the starting point and finds the smallest odds ratio above 1 your sample could detect. An odds ratio below 1 looks for a decrease instead."
    directional: true
    known_differences: ["3"]
    known_differences_if_above_zero: {"3": r2_other_predictors}
    base: {spec_version: "0.1", design: logistic_regression, template: single_predictor,
           variables: {X: {}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: odds_ratio},
           target_test: {effect: odds_ratio, method: wald_z}}
    groups:
      - input: "Your outcome, your predictor and what kind of predictor it is"
        fields:
          - {id: Y_label, label: "Yes/no outcome", help: "For example, sought help.", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "Predictor", type: text, path: variables.X.label, required: true}
          - {id: X_type, label: "What kind of predictor", type: select, path: variables.X.type, required: true,
             choices: {continuous: "A score (for example, a questionnaire total)", binary: "A yes/no group (for example, treatment or control)"}}
          - {id: X_level1, label: "First group (the comparison group)", type: text, path: variables.X.levels.1, required: true,
             shown_if: {field: X_type, is: binary}}
          - {id: X_level2, label: "Second group", type: text, path: variables.X.levels.2, required: true,
             shown_if: {field: X_type, is: binary}}
      - input: "The odds ratio and the proportion of 'yes' at the starting point"
        fields:
          - {id: odds_ratio, when_empty: one, writeup_label: "odds ratio", label: "Odds ratio", type: number, path: population.odds_ratio, effect: true, min_exclusive: 0,
             help: "For a score: how many times the odds of 'yes' change for each standard deviation higher on the predictor. For a group: the odds of 'yes' in the second group divided by the odds in the first. 1 means no effect."}
          - {id: base_prob, baseline: true, writeup_label: "proportion of 'yes' at the starting point", label: "Proportion of 'yes' at the starting point", type: number, path: population.base_prob, effect: true, min_exclusive: 0, max_exclusive: 1,
             help: "For a score: the proportion at the predictor's average. For a group: the proportion in the first group. Between 0 and 1."}
          - {id: x_prob, label: "Proportion of people in the second group", help: "Between 0 and 1.", type: number, path: population.x_prob, required: true, min_exclusive: 0, max_exclusive: 1,
             default: 0.5, default_source: "equal groups, powerkit's default (the design spec's population > x_prob)",
             shown_if: {field: X_type, is: binary}}
      - input: "How much the other predictors overlap with this one"
        fields:
          - {id: r2_other, label: "R-squared on the other predictors", type: number, path: population.r2_other_predictors, required: true, min: 0, max_exclusive: 1,
             default: 0, default_source: "no other predictors, powerkit's default (the design spec's population > r2_other_predictors)",
             help: "Of this predictor on the other predictors (0 to 1; 0 if there are no others). How much of this predictor the other predictors in your model explain. Their own effects on the outcome aren't needed."}

  # Multinomial logistic regression, one predictor (Spower simulation of
  # powerkit's experiment around nnet's multinom()): an outcome in three or
  # more unordered categories, the first the reference. The effect is the
  # share in each category at two points (X's mean and 1 SD above, or the
  # two groups), or each category's odds ratio against the first, as papers
  # report it. Other predictors enter only through X's R-squared with them.
  E70:
    methods_name: "a multinomial logistic regression, simulated"
    sensitivity: true
    tool: Spower
    directional: false
    base: {spec_version: "0.1", design: logistic_regression, template: multinomial,
           variables: {X: {}, "Y": {type: categorical}}, population: {metric: proportion},
           target_test: {effect: odds_ratios}}
    groups:
      - input: "Your outcome and its categories, your predictor and what kind of predictor it is"
        fields:
          - {id: Y_label, label: "Outcome", help: "For example, where help was first sought.", type: text, path: variables.Y.label, required: true}
          - {id: Y_levels, label: "The outcome's categories", type: levels, path: variables.Y.levels, required: true,
             help: "Separated by commas: three or more. The first is the one the others are compared with. Put first the category that makes the natural comparison, such as the most common choice or the usual one: the odds ratios and the test of one category compare each other category with it."}
          - {id: X_label, label: "Predictor", type: text, path: variables.X.label, required: true}
          - {id: X_type, label: "What kind of predictor", type: select, path: variables.X.type, required: true,
             choices: {continuous: "A score (for example, a questionnaire total)", binary: "A yes/no group (for example, treatment or control)"}}
          - {id: X_level1, label: "First group (the comparison group)", type: text, path: variables.X.levels.1, required: true,
             shown_if: {field: X_type, is: binary}}
          - {id: X_level2, label: "Second group", type: text, path: variables.X.levels.2, required: true,
             shown_if: {field: X_type, is: binary}}
      - input: "The share of people in each category, and the effect"
        fields:
          - {id: probabilities, writeup_label: "share in each category at the starting point", label: "Share in each category at the start", type: numbers, per_levels: Y_levels, path: population.probabilities, effect: true, min_exclusive: 0, max_exclusive: 1,
             help: "One for each category, in the same order, separated by commas, adding up to 1. For a score: the shares among people at the predictor's average. For a group: the shares in the first group."}
          - {id: effect_as, label: "How you'll give the effect", type: select, required: true,
             choices: {shares: "The shares at a second point (one SD higher on the score, or in the second group)", odds_ratios: "Odds ratios, as a multinomial logistic regression reports them"},
             default: shares, default_source: "shares, which need no reference category to read"}
          - {id: probabilities_second, writeup_label: "share in each category at the second point", label: "Share in each category one SD higher", type: numbers, per_levels: Y_levels, path: population.probabilities_second, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: effect_as, is: shares},
             help: "Or in the second group. One for each category, in the same order, adding up to 1. The same shares as at the starting point would mean no effect."}
          - {id: odds_ratios, writeup_label: "odds ratios against the first category", label: "Odds ratio for each category", type: numbers, path: population.odds_ratios, effect: true, min_exclusive: 0,
             shown_if: {field: effect_as, is: odds_ratios},
             help: "One for each category except the first, in the same order, separated by commas. For each category, how many times the odds of being in it rather than the first category change per SD of the score, or in the second group against the first (SPSS calls them Exp(B); some papers call them relative risk ratios). 1 means no effect."}
          - {id: x_prob, label: "Proportion of people in the second group", help: "Between 0 and 1.", type: number, path: population.x_prob, required: true, min_exclusive: 0, max_exclusive: 1,
             default: 0.5, default_source: "equal groups, powerkit's default (the design spec's population > x_prob)",
             shown_if: {field: X_type, is: binary}}
      - input: "Which test"
        fields:
          - {id: multinomial_test, label: "Which test", type: select, path: target_test.method, required: true,
             choices: {likelihood_ratio: "Whether the predictor relates to the outcome at all (the likelihood-ratio test, every category together)", wald_z: "Whether one category's odds against the first change (the Wald z test of one coefficient)"},
             default: likelihood_ratio, default_source: "the likelihood-ratio test of the predictor, the test SPSS's 'Likelihood Ratio Tests' table and car's Anova() report for it",
             help: "The likelihood-ratio test asks whether the predictor matters for the outcome as a whole. If your hypothesis is about one category in particular (for example, more people choosing online search over a doctor), the test of that category is the one to power."}
          - {id: category, label: "The category compared with the first", type: text, path: target_test.category, required: true,
             shown_if: {field: multinomial_test, is: wald_z}}
      - input: "How much the other predictors overlap with this one"
        fields:
          - {id: r2_other, label: "R-squared on the other predictors", type: number, path: population.r2_other_predictors, required: true, min: 0, max_exclusive: 1,
             default: 0, default_source: "no other predictors, powerkit's default (the design spec's population > r2_other_predictors)",
             help: "Of this predictor on the other predictors (0 to 1; 0 if there are no others). How much of this predictor the other predictors in your model explain. Their own effects on the outcome aren't needed."}

  # Differential item functioning in a 2PL IRT model (irtpwr's analytical
  # method with its DIF preset; Zimmer and Debelak, 2023): two
  # groups of equal size with standard normal abilities; items entered as
  # discrimination and difficulty; the DIF items' parameters freed between
  # the groups (both by default, or only those that differ).
  E71:
    methods_name: "a test of differential item functioning in a two-parameter logistic IRT model (irtpwr's analytical method)"
    tool: irtpwr
    directional: false
    departures: ["20"]
    base: {spec_version: "0.1", design: irt, template: dif,
           variables: {G: {type: binary}, "Y": {type: continuous}}, population: {metric: irt_2pl},
           target_test: {effect: dif}}
    groups:
      - input: "Your groups and the test"
        fields:
          - {id: G_label, label: "What the groups are", help: "For example, language version.", type: text, path: variables.G.label, required: true}
          - {id: G_level1, label: "Reference group (the one the item parameters come from)", type: text, path: variables.G.levels.1, required: true}
          - {id: G_level2, label: "Focal group", type: text, path: variables.G.levels.2, required: true}
          - {id: Y_label, label: "The test or questionnaire", help: "For example, reading test.", type: text, path: variables.Y.label, required: true}
      - input: "Each item's discrimination and difficulty"
        fields:
          - {id: irt_a, writeup_label: "item discriminations", label: "Each item's discrimination (a)", type: numbers, path: population.a, effect: true, min_exclusive: 0,
             help: "The 2PL slope, in the items' order, separated by commas (3 to 40 items). From an earlier calibration of the test, or a published one. Discriminations around 1 are typical; above 2 is high. Use the logistic metric (without the 1.7 scaling constant)."}
          - {id: irt_b, writeup_label: "item difficulties", label: "Each item's difficulty (b)", type: numbers, path: population.b, effect: true,
             help: "The ability at which half answer 'yes' or correctly, in the same order as the items. On the scale of the reference group's ability, which has mean 0 and SD 1. If your software reports intercepts d instead, the difficulty is -d / a."}
      - input: "The items with DIF and how they differ"
        fields:
          - {id: dif_items, writeup_label: "items with DIF", label: "Which items have DIF", type: numbers, path: population.dif_items, effect: true, min: 1, integer: true,
             help: "Their numbers in the list above, separated by commas (1 for the first). The other items are anchors: assumed to work the same way in both groups."}
          - {id: b_shift, writeup_label: "change in difficulty in the focal group", label: "Difficulty shift for each DIF item", type: numbers, path: population.b_shift, effect: true,
             help: "In the same order as the DIF items: how much harder the item is in the focal group (its difficulty there minus in the reference group). 0 for none. Uniform DIF. For example 0.4: the item is as hard for focal-group members as for reference-group members 0.4 SD lower in ability. Negative if easier."}
          - {id: a_change, writeup_label: "change in discrimination in the focal group", label: "Discrimination change for each DIF item", type: numbers, path: population.a_change, optional: true,
             help: "In the same order as the DIF items: its discrimination in the focal group minus in the reference group. Optional: 0 for each if left empty. Non-uniform DIF: the item separates people of different ability more, or less, in the focal group."}
      - input: "Which test"
        fields:
          - {id: free_parameters, label: "Which of each DIF item's parameters the test frees between the groups", type: select, path: target_test.free_parameters, required: true,
             choices: {both: "Both its discrimination and its difficulty (the usual likelihood-ratio DIF test, 2 df per item)", differing: "Only those that differ above (irtpwr's own choice; 1 df when only the difficulty changes)"},
             default: both, default_source: "both parameters, the omnibus likelihood-ratio DIF test (mirt's DIF() help: which.par = c('a1', 'd'), with 1-df tests as follow-ups); irtpwr's preset frees only those that differ (docs/conventions.md)",
             help: "Plan for the test you will run. Freeing only the difficulty is more powerful when only the difficulty changes, but misses a change in discrimination you didn't expect."}
          - {id: irt_stat, label: "Test statistic", type: select, path: target_test.method, required: true,
             choices: {likelihood_ratio: "Likelihood ratio (the usual choice)", wald: "Wald", score: "Score (Lagrange multiplier)", gradient: "Gradient"},
             default: likelihood_ratio, default_source: "the likelihood-ratio test of the nested multigroup models, the DIF test researchers usually report",
             help: "All four test the same hypothesis and differ little in power in large samples."}

  # Growth curves (longpower's diggle.linear.power(), Diggle et al., 2002):
  # two groups, three or more occasions, random intercept and slope; with
  # drop-out or unequal groups, hu.mackey.thomas.linear.power() (Hu, Mackey
  # and Thomas, 2021).
  E35:
    methods_name: "a growth-curve comparison of two groups' rates of change (Diggle and colleagues' formula for a linear mixed model)"
    tool: longpower
    sensitivity: true
    directional: true
    base: {spec_version: "0.1", design: mixed_model, template: growth_curve,
           variables: {G: {type: binary}, "Y": {type: continuous}}, population: {metric: raw},
           target_test: {effect: slope_difference, method: z_test}}
    groups:
      - input: "Your groups, the outcome and the occasions"
        fields:
          - {id: G_label, label: "What the groups are", help: "For example, condition.", type: text, path: variables.G.label, required: true}
          - {id: G_level1, label: "Group 1", type: text, path: variables.G.levels.1, required: true}
          - {id: G_level2, label: "Group 2", type: text, path: variables.G.levels.2, required: true}
          - {id: Y_label, label: "Outcome", help: "For example, stress score.", type: text, path: variables.Y.label, required: true}
          - {id: times, in_effect_text: true, writeup_label: "occasions", label: "The occasions' times", type: numbers, path: population.times, required: true,
             help: "Separated by commas: three or more, for example 0, 1, 2, 3 for monthly measurements. In the units the rates of change are per: with monthly measurements in months, the rate of change is per month."}
      - input: "The difference in rates of change"
        fields:
          - {id: slope_difference, optional_for: [sensitivity], writeup_label: "difference in rates of change", label: "Difference in the rate of change", type: number, path: population.slope_difference, effect: true,
             help: "Group 2's average rate of change minus group 1's, per unit of time, in the outcome's units. For example -1: the outcome falls one point more per month in group 2 than in group 1."}
      - input: "How much people vary"
        fields:
          - {id: sd_slope, writeup_label: "SD of people's rates of change", label: "SD of people's own rates of change (the random slope SD), per unit of time", type: number, path: population.sd_slope, effect: true, min: 0}
          - {id: sd_residual, writeup_label: "residual SD", label: "SD of each person's scores around their own line (the residual SD)", type: number, path: population.sd_residual, effect: true, min_exclusive: 0}
          - {id: sd_intercept, in_effect_text: true, writeup_label: "SD of people's starting levels", label: "SD of starting levels", help: "The random intercept SD, at the first occasion.", type: number, path: population.sd_intercept, required: true, min: 0,
             default: 0, default_source: "0, powerkit's default; with complete data the starting levels' spread doesn't change the test of the slopes unless they correlate with the rates of change"}
          - {id: r_intercept_slope, in_effect_text: true, writeup_label: "correlation of starting levels and rates of change", label: "Correlation between people's starting levels and rates of change", type: number, path: population.r_intercept_slope, required: true, min: -1, max: 1,
             default: 0, default_source: "0, powerkit's default (population > r_intercept_slope)"}
      - input: "Drop-out and the groups' sizes"
        fields:
          - {id: growth_dropout, label: "Does anyone drop out before the last occasion?", type: select, required: true,
             choices: {none: "No: everyone is measured at every occasion", some: "Yes: some people leave along the way"},
             default: none, default_source: "complete data, as Diggle and colleagues' formula assumes",
             help: "With drop-out or unequal groups, Powerkit uses Hu, Mackey and Thomas's formula (longpower), which keeps everyone's measurements up to the one they leave after. It assumes both groups start at the same level, as in a randomised trial."}
          - {id: retention, in_effect_text: true, writeup_label: "share still in the study at each occasion", label: "Share still in the study at each occasion", type: numbers, path: population.retention, required: true,
             shown_if: {field: growth_dropout, is: some},
             help: "One per occasion, in the same order. The first is 1, for example 1, 0.9, 0.85, 0.8. The same in both groups. Someone who leaves misses every later occasion. Don't also allow for drop-out under recruitment below: this already does."}
          - {id: allocation_ratio, label: "Size of group 2 relative to group 1 (1 = equal groups)", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as Diggle and colleagues' formula assumes"}

  # Exploratory factor analysis (Spower simulation of powerkit's experiment
  # around psych's fa()): the chance every factor's loadings are recovered.
  E73:
    methods_name: "an exploratory factor analysis (psych's fa(): minimum residual, oblimin rotation), recovery of the loadings judged by Tucker's congruence, simulated"
    sensitivity: true
    tool: Spower
    directional: false
    no_alpha: true
    power_label: "Target chance of recovering every factor"
    power_help: "As a proportion, for example 0.8: the share of studies like yours in which every factor's loadings are recovered."
    base: {spec_version: "0.1", design: factor_analysis, template: efa,
           variables: {"Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: recovery, method: congruence}}
    groups:
      - input: "The questionnaire and its factors"
        fields:
          - {id: Y_label, label: "The questionnaire or set of items", help: "For example, a wellbeing scale.", type: text, path: variables.Y.label, required: true}
          - {id: factors, label: "Number of factors you expect", type: number, path: population.factors, required: true, min: 1, max: 6, integer: true}
          - {id: items_per_factor, label: "Number of items for each factor", type: number, path: population.items_per_factor, required: true, min: 3, max: 20, integer: true,
             help: "More items per factor make each factor better defined (overdetermined) and easier to recover."}
      - input: "How strongly the items measure their factors"
        fields:
          - {id: loading, optional_for: [sensitivity], when_empty: omit, writeup_label: "standardised loading", label: "Each item's standardised loading on its factor", type: number, path: population.loading, effect: true, min_exclusive: 0, max_exclusive: 1,
             help: "Its square is the item's communality, the share of its variance its factor explains. Loadings around 0.4 are weak, 0.6 moderate, 0.8 strong. Take them from earlier studies of the same or similar items."}
          - {id: factor_correlation, label: "Correlation between the factors", type: number, path: population.factor_correlation, required: true, min: 0, max: 0.9,
             default: 0, default_source: "uncorrelated factors, powerkit's default"}
      - input: "What counts as recovering the factors"
        fields:
          - {id: congruence, label: "Tucker's congruence each factor's loadings must reach with the true ones", type: number, path: target_test.congruence, required: true, min: 0.8, max: 0.999,
             default: 0.95, default_source: "0.95, the level at which Lorenzo-Seva and ten Berge (2006) treat two factors as virtually equal",
             help: "1 is a perfect match. Lower values, such as 0.90, accept a rougher recovery."}

  # Interrupted time series (Spower around PITS's simulated series and
  # nlme's gls(), REML by default; the maintainer's decision of 6 November
  # 2026): n is the number of time points after the intervention.
  E45:
    methods_name: "a segmented regression of the interrupted time series with AR(1) errors, fitted by generalised least squares (nlme's gls(), REML), simulated with PITS's series"
    tool: Spower
    sensitivity: true
    directional: false
    no_attrition: true
    base: {spec_version: "0.1", design: time_series, template: its,
           variables: {"Y": {type: continuous}}, population: {metric: raw},
           target_test: {alternative: two_sided}}
    groups:
      - input: "The outcome, and the series before the breakpoint"
        fields:
          - {id: Y_label, label: "Outcome", help: "For example, monthly admissions.", type: text, path: variables.Y.label, required: true}
          - {id: n_pre, label: "Number of time points before the intervention", type: number, path: population.n_pre, required: true, min: 3, max: 500, integer: true,
             help: "Equally spaced measurements, for example 24 months. A change is judged against the trend before the intervention, so these points limit how precisely it can be measured, however long the series runs after it."}
          - {id: baseline, label: "The outcome's average at the start of the series", type: number, path: population.baseline, required: true,
             help: "In the outcome's own units. It doesn't change the power; it keeps the simulated series on a realistic scale."}
          - {id: pre_trend, label: "Trend per time point before the intervention", type: number, path: population.pre_trend, required: true,
             default: 0, default_source: "a flat series before the intervention, PITS's default (simulate_its_data(pre_trend = 0))"}
      - input: "The change you want to detect, in level and slope"
        fields:
          - {id: its_effect, label: "Which change", type: select, path: target_test.effect, required: true,
             choices: {level: "An immediate change in level at the intervention", slope: "A change in the trend after the intervention", both: "Either: the level and the trend tested together"}}
          - {id: level_change, optional_for: [sensitivity], writeup_label: "change in level", label: "Immediate change in level, in the outcome's units", type: number, path: population.level_change, effect: true,
             help: "The step at the intervention: negative for a fall. Leave 0 if you expect only a change in trend."}
          - {id: slope_change, optional_for: [sensitivity], writeup_label: "change in trend", label: "Change in the trend per time point after the intervention", type: number, path: population.slope_change, effect: true,
             help: "How much steeper (or, negative, flatter) the line becomes after the intervention, per time point. Leave 0 if you expect only a step."}
      - input: "How noisy the series is, and its autocorrelation"
        fields:
          - {id: sigma, label: "SD of the points around the line, in the outcome's units", type: number, path: population.sigma, required: true, min_exclusive: 0,
             help: "From the series before the intervention: the SD of its points around their trend."}
          - {id: rho, label: "Autocorrelation from one time point to the next", type: number, path: population.rho, required: true, min: 0, max_exclusive: 1,
             help: "How much a point above the line tends to be followed by another above it (AR(1)). From the series before the intervention. Positive autocorrelation lowers power, and in short series it also makes the test find changes that aren't there more often. From 0 to below 1."}
      - input: "The analysis"
        fields:
          - {id: its_method, label: "How the series is fitted", type: select, path: target_test.method, required: true,
             choices: {gls_reml: "Generalised least squares with AR(1) errors, by REML", gls_ml: "The same model by maximum likelihood, as PITS's own test"},
             default: gls_reml, default_source: "REML, powerkit's choice: PITS's maximum-likelihood test finds changes that aren't there more often in short series (docs/decisions.md, 6 November 2026)",
             help: "Either way, the result also shows how often the test would find a change that isn't there, in a series of the length planned."}
  # Random-intercept cross-lagged panel model (Spower around powRICLPM,
  # which simulates each study and fits the model with lavaan): power for
  # one lagged effect, by preview, full run or R script (`simulations`).
  E74:
    methods_name: "a random-intercept cross-lagged panel model (Hamaker, Kuiper and Grasman, 2015) fitted by maximum likelihood in lavaan, the lagged effect tested by its Wald z test, simulated with powRICLPM"
    tool: Spower
    directional: true
    base: {spec_version: "0.1", design: panel, template: riclpm,
           variables: {"X": {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {method: wald_z}}
    groups:
      - input: "The two scores and the waves"
        fields:
          - {id: X_label, label: "X, the first score", help: "For example, stress.", type: text, path: variables.X.label, required: true}
          - {id: Y_label, label: "Y, the second score", help: "For example, sleep problems.", type: text, path: variables.Y.label, required: true}
          - {id: waves, label: "Number of waves (measurement occasions)", type: number, path: population.waves, required: true, min: 3, max: 15, integer: true,
             help: "The model needs at least three. More waves give each lagged effect more information."}
      - input: "The effect you want to test"
        fields:
          - {id: riclpm_effect, label: "Which lagged effect", type: select, path: target_test.effect, required: true,
             choices: {cross_lagged_xy: "X's effect on Y at the next wave (cross-lagged)", cross_lagged_yx: "Y's effect on X at the next wave (cross-lagged)",
                       autoregressive_x: "X's effect on X at the next wave (autoregressive)", autoregressive_y: "Y's effect on Y at the next wave (autoregressive)"}}
          - {id: constraints, label: "Are the lagged effects the same at every wave?", type: select, path: population.constraints, required: true,
             choices: {none: "Not assumed: each wave's effects are estimated freely, and the effect from the first wave to the second is tested", lagged: "Yes: the lagged effects are held equal over time"},
             default: none, default_source: "estimated freely, powRICLPM's default (powRICLPM(constraints = 'none'))",
             help: "Holding them equal pools every wave's information into one estimate, which gives more power, but is right only if the effects really don't change over time."}
      - input: "The lagged effects within people (standardised)"
        fields:
          - {id: cross_lagged_xy, writeup_label: "cross-lagged effect of X on Y", label: "X's effect on Y at the next wave", type: number, path: population.cross_lagged_xy, effect: true, min_exclusive: -1, max_exclusive: 1,
             help: "Standardised, within people: how many SDs a person's Y moves above their own usual level when their X was 1 SD above theirs at the wave before, holding their Y then constant. Take it from earlier panel studies that separated stable differences between people (a random-intercept model), not from ordinary cross-lagged panel models."}
          - {id: cross_lagged_yx, writeup_label: "cross-lagged effect of Y on X", label: "Y's effect on X at the next wave", type: number, path: population.cross_lagged_yx, effect: true, min_exclusive: -1, max_exclusive: 1}
          - {id: autoregressive_x, writeup_label: "autoregressive effect of X", label: "X's effect on X at the next wave (its stability within people)", type: number, path: population.autoregressive_x, required: true, min_exclusive: -1, max_exclusive: 1}
          - {id: autoregressive_y, writeup_label: "autoregressive effect of Y", label: "Y's effect on Y at the next wave", type: number, path: population.autoregressive_y, required: true, min_exclusive: -1, max_exclusive: 1}
      - input: "How people differ, and how X and Y go together"
        fields:
          - {id: icc, label: "Share of each score's variance that is stable between people", type: number, path: population.icc, required: true, min: 0.05, max: 0.95,
             help: "The random intercept's share: 0.5 means half of the differences in a score are people's stable levels and half are ups and downs around them. From earlier waves of data: the intraclass correlation of the repeated scores. Between 0.05 and 0.95."}
          - {id: ri_correlation, label: "Correlation between people's stable levels of X and Y", type: number, path: population.ri_correlation, required: true, min_exclusive: -1, max_exclusive: 1}
          - {id: within_correlation, label: "Correlation between X and Y at the same wave, within people", type: number, path: population.within_correlation, required: true, min_exclusive: -1, max_exclusive: 1,
             help: "How a person's ups and downs in X and Y go together at the same wave. powRICLPM keeps it the same at every wave."}
          - {id: reliability_known, label: "Measurement error in the scores", type: select, required: true,
             choices: {known: "Enter the measures' reliability (recommended)", perfect: "Assume no measurement error (power will be optimistic)"},
             sets: {perfect: [{path: population.reliability, value: 1}]},
             default_source: "Not filled in for you, because almost no measure is perfectly reliable (for reference: powRICLPM assumes no measurement error, powRICLPM(reliability = 1))",
             help: "Real scores contain measurement error, which lowers power and biases the lagged effects: the stability paths look smaller, and a cross-lagged path can be pushed either way. Most published scales report a reliability (alpha or omega); use the value from samples like yours."}
          - {id: reliability, label: "Each score's reliability", type: number, path: population.reliability, required: true, min: 0.5, max: 1,
             shown_if: {field: reliability_known, is: known},
             help: "For example the measure's alpha or omega in samples like yours. Below 1, measurement error is added to the simulated scores, and the model, which doesn't separate it out, is fitted as usual: power falls, and the lagged effects are biased (the stability paths downwards, a cross-lagged path in either direction)."}

  # Latent profile analysis (Spower simulation of powerkit's experiment
  # around mclust): the chance the BIC finds the right number of profiles.
  E58:
    methods_name: "a latent profile analysis (mclust's models with equal variances and local independence, the number of profiles chosen by the BIC), simulated"
    sensitivity: true
    tool: Spower
    directional: false
    no_alpha: true
    power_label: "Target chance of finding the right number of profiles"
    power_help: "As a proportion, for example 0.8: the share of studies like yours in which the BIC chooses the number of profiles you expect."
    base: {spec_version: "0.1", design: mixture, template: lpa,
           variables: {"Y": {type: continuous}}, population: {metric: sd_units},
           target_test: {effect: profiles, method: bic}}
    groups:
      - input: "The scores the profiles are formed from"
        fields:
          - {id: Y_label, label: "What the indicators measure", help: "For example, motivation subscales.", type: text, path: variables.Y.label, required: true}
          - {id: indicators, label: "Number of indicators (scores)", type: number, path: population.indicators, required: true, min: 2, max: 30, integer: true}
      - input: "The profiles you expect"
        fields:
          - {id: profiles, label: "Number of profiles", type: number, path: population.profiles, required: true, min: 2, max: 6, integer: true}
          - {id: separation, optional_for: [sensitivity], when_empty: omit, writeup_label: "separation between neighbouring profiles", label: "Separation between neighbouring profiles", type: number, path: population.separation, effect: true, min: 0, max: 5,
             help: "On each indicator, in SD units (Cohen's d). Each profile is this far above the one before it on every indicator, in SDs within a profile, as in Tein, Coxe and Cham's simulations. 0.5 is hard to find, 0.8 moderate, 1.5 clear."}
          - {id: profile_sizes, label: "Will the profiles be about the same size?", type: select, required: true,
             choices: {equal: "Yes, about equal", unequal: "No: give each profile's share"},
             default: equal, default_source: "equal profiles, powerkit's default"}
          - {id: shares, writeup_label: "each profile's share", label: "Each profile's share of the population", type: numbers, path: population.shares, required: true,
             shown_if: {field: profile_sizes, is: unequal},
             help: "In order, adding up to 1, for example 0.5, 0.3, 0.2. A small profile is harder to find: with 5% of 200 people, its estimates were poor in Nylund, Asparouhov and Muthén's (2007) simulations."}

  # Signal detection: d' in two conditions or groups (Spower simulation of
  # powerkit's experiment: hits and false alarms, d' with the log-linear
  # correction, a t-test).
  E72:
    methods_name: "a comparison of sensitivity (d') between two conditions, each person's d' from their hits and false alarms (signal detection theory), simulated"
    tool: Spower
    sensitivity: true
    directional: true
    base: {spec_version: "0.1", design: signal_detection, template: dprime,
           variables: {"Y": {type: continuous}}, population: {metric: dprime},
           target_test: {effect: dprime_difference, method: t_test}}
    groups:
      - input: "Your conditions and the task"
        fields:
          - {id: G_type, label: "Who does each condition?", type: select, path: variables.G.type, required: true,
             choices: {within_factor: "The same people do both conditions", binary: "Two groups of different people, one condition each"}}
          - {id: G_label, label: "What the conditions are", help: "For example, encoding task.", type: text, path: variables.G.label, required: true}
          - {id: G_level1, label: "Condition 1", type: text, path: variables.G.levels.1, required: true}
          - {id: G_level2, label: "Condition 2", type: text, path: variables.G.levels.2, required: true}
          - {id: Y_label, label: "The task", help: "For example, recognition memory.", type: text, path: variables.Y.label, required: true}
      - input: "Sensitivity (d') in each condition"
        fields:
          - {id: d1, writeup_label: "average d' in condition 1", label: "Average d' in condition 1", type: number, path: population.dprime.1, effect: true, baseline: true, min: -5, max: 6,
             help: "d' describes sensitivity in signal-detection units; 0 means no separation. Its practical meaning depends on the task. Take it from comparable studies rather than choosing a conventional magnitude label."}
          - {id: d2, optional_for: [sensitivity], when_empty: same_as, same_as: d1, writeup_label: "average d' in condition 2", label: "Average d' in condition 2", type: number, path: population.dprime.2, effect: true, min: -5, max: 6,
             help: "The test is of condition 2 minus condition 1."}
      - input: "Trials and how people vary"
        fields:
          - {id: trials_signal, label: "Signal trials per person in each condition", help: "For example, old items.", type: number, path: population.trials_signal, required: true, min: 1, max: 5000, integer: true}
          - {id: trials_noise, label: "Noise trials per person in each condition", help: "For example, new items.", type: number, path: population.trials_noise, required: true, min: 1, max: 5000, integer: true}
          - {id: sd_dprime, writeup_label: "SD of people's d'", label: "SD of people's true d' around the average", type: number, path: population.sd_dprime, effect: true, min: 0, max: 5,
             help: "How much people differ in sensitivity, apart from the noise of a limited number of trials. Earlier studies' SD of d' includes that noise, so it is a little larger than this."}
          - {id: r_dprime, writeup_label: "correlation of a person's d' in the two conditions", label: "Correlation between a person's true d' in the two conditions", type: number, path: population.r_dprime, effect: true, min: -1, max: 1,
             shown_if: {field: G_type, is: within_factor},
             help: "People who are good in one condition tend to be good in the other: a higher correlation gives more power."}
          - {id: criterion, label: "Average response bias", help: "The criterion c: 0 for none, positive for a tendency to say no.", type: number, path: population.criterion, required: true, min: -3, max: 3,
             default: 0, default_source: "no bias, the unbiased observer of signal detection theory"}
          - {id: sd_criterion, label: "SD of people's response bias", type: number, path: population.sd_criterion, required: true, min: 0, max: 3,
             default: 0, default_source: "everyone with the same bias, powerkit's default"}

  # Moderation by a factor with three or more groups (Spower simulation of
  # powerkit's experiment around lm()): the correlation of X and Y in each
  # group, optional group means; the F test of the X x group terms.
  E30:
    methods_name: "a regression with a score by group interaction (the F test of the interaction terms), simulated"
    sensitivity: true
    tool: Spower
    directional: false
    base: {spec_version: "0.1", design: regression_interaction, template: group_moderator,
           variables: {X: {type: continuous}, A: {type: between_factor}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: interaction, method: f_test}}
    groups:
      - input: "Your outcome, the score X and the groups"
        fields:
          - {id: Y_label, label: "Outcome", help: "For example, sleep quality.", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "The score whose relationship may differ (X)", type: text, path: variables.X.label, required: true}
          - {id: A_label, label: "What the groups are", help: "For example, age group.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (three or more), separated by commas", type: levels, path: variables.A.levels, required: true}
      - input: "The correlation between X and the outcome in each group"
        fields:
          - {id: r_xy, writeup_label: "correlation of X and the outcome in each group", label: "Correlation of X and the outcome per group", type: numbers, per_levels: A_levels, path: population.r_xy, effect: true, min_exclusive: -1, max_exclusive: 1,
             help: "In each group, in the same order, separated by commas. The same correlation in every group means no moderation. The test asks whether the slopes differ, so how much they differ drives the power."}
          - {id: means, writeup_label: "group means (SD units)", label: "The outcome's mean in each group", type: numbers, per_levels: A_levels, path: population.means, optional: true,
             help: "In SD units. Optional: 0 in each if left empty. Differences between the groups' means don't change the test of the slopes."}
      - input: "The size of each group"
        fields:
          - {id: group_sizes, label: "Will the groups be the same size?", type: select, required: true,
             choices: {equal: "Yes, equal groups", unequal: "No: give their relative sizes"},
             default: equal, default_source: "equal groups, powerkit's default"}
          - {id: group_ratio, writeup_label: "relative group sizes", label: "Relative group sizes: one whole number for each group, in the same order", type: numbers, per_levels: A_levels, path: options.group_ratio, required: true, min: 1, integer: true,
             shown_if: {field: group_sizes, is: unequal}}

  # Moderation with a yes/no or count outcome (Spower simulation of
  # powerkit's experiment around glm() or MASS::glm.nb()): X and W each a
  # score (standardised) or a yes/no group coded 0 and 1; the interaction as
  # a ratio of odds ratios or of rate ratios.
  E32:
    methods_name: "a regression with an interaction (logistic for a yes/no outcome, Poisson or negative binomial for a count; the Wald z test of the X x W coefficient), simulated"
    tool: Spower
    sensitivity: true
    sensitivity_shown_if: {field: analysis, is: moderation}
    directional: true
    direction_shown_if: [{field: analysis, is_not: mediation}, {field: Y_kind, is_not: categories}]
    base: {spec_version: "0.1", design: logistic_regression, template: interaction,
           variables: {X: {}, W: {}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: odds_ratio},
           target_test: {effect: interaction, method: wald_z}}
    groups:
      - input: "Your outcome, X and W, and what kind of variable each is"
        fields:
          - {id: analysis, label: "Which question", type: select, required: true,
             choices: {moderation: "Moderation: does X's effect on the outcome depend on another variable (W)?", mediation: "Mediation: does X affect the outcome through a mediator, a score (M)?"},
             sets: {mediation: [{path: design, value: mediation}, {path: template, value: binary_or_count_outcome},
                                {path: target_test.effect, value: indirect_effect}, {path: target_test.method, value: delta_method},
                                {path: target_test.path, value: "X->M->Y"}, {path: variables.W, value: null},
                                {path: variables.M.type, value: continuous}]},
             default: moderation, default_source: "moderation, this card's first design"}
          - {id: Y_kind, label: "The outcome is", type: select, required: true,
             choices: {binary: "Yes or no (for example, sought counselling)", count: "A count (0, 1, 2, ..., for example drinking days in a month)",
                       categories: "One of three or more unordered categories (for example, where help was first sought)"},
             choices_shown_if: {categories: [{field: analysis, is_not: mediation}]},
             sets: {count: [{path: design, value: poisson_regression, shown_if: {field: analysis, is_not: mediation}}, {path: population.metric, value: rate_ratio},
                            {path: variables.Y.type, value: count}, {path: variables.Y.levels, value: null}],
                    categories: [{path: template, value: multinomial_interaction}, {path: variables.Y.type, value: categorical},
                                 {path: variables.Y.levels, value: null}]},
             default: binary, default_source: "a yes/no outcome, this card's first design",
             help: "With unordered categories, Powerkit fits a multinomial logistic regression (nnet's multinom()): each category is compared with the first, and the test is whether the X x W terms improve the model. Mediation of such an outcome isn't calculated yet."}
          - {id: Y_levels, label: "The outcome's categories", type: levels, path: variables.Y.levels, required: true,
             shown_if: [{field: Y_kind, is: categories}, {field: analysis, is_not: mediation}],
             help: "Separated by commas: three or more. The first is the one the others are compared with. Put first the category that makes the natural comparison, such as the most common or the usual choice: each odds ratio compares another category with it."}
          - {id: Y_label, label: "Outcome", help: "For example, sought counselling, or drinking days in a month.", type: text, path: variables.Y.label, required: true}
          - {id: count_model, label: "How spread out the counts are", type: select, path: target_test.method, required: true,
             choices: {wald_z: "As a Poisson distribution allows (the variance equals the mean)", negative_binomial: "More spread out than that (negative binomial)"},
             shown_if: [{field: Y_kind, is: count}, {field: analysis, is_not: mediation}],
             help: "Not chosen for you: pick the one your earlier data support. Counts of behaviour usually vary more than their mean (some people have many, many have none). If they do, choose negative binomial: a Poisson model then gives too much power."}
          - {id: med_count_model, label: "How spread out the counts are", type: select, path: population.count_model, required: true,
             choices: {poisson: "As a Poisson distribution allows (the variance equals the mean)", negative_binomial: "More spread out than that (negative binomial)"},
             shown_if: [{field: Y_kind, is: count}, {field: analysis, is: mediation}],
             help: "Not chosen for you: pick the one your earlier data support. Counts of behaviour usually vary more than their mean (some people have many, many have none). If they do, choose negative binomial: a Poisson model then gives too much power."}
          - {id: X_label, label: "Main predictor (X)", type: text, path: variables.X.label, required: true}
          - {id: X_type, label: "What kind of variable X is", type: select, path: variables.X.type, required: true,
             choices: {continuous: "A score", binary: "A yes/no group (for example, treatment or control)"}}
          - {id: X_level1, label: "First group of X (the comparison group)", type: text, path: variables.X.levels.1, required: true, shown_if: {field: X_type, is: binary}}
          - {id: X_level2, label: "Second group of X", type: text, path: variables.X.levels.2, required: true, shown_if: {field: X_type, is: binary}}
          - {id: M_label, label: "Mediator (M), a score", type: text, path: variables.M.label, required: true, shown_if: {field: analysis, is: mediation}}
          - {id: W_label, label: "Moderator (W)", type: text, path: variables.W.label, required: true, shown_if: {field: analysis, is_not: mediation}}
          - {id: W_type, label: "What kind of variable W is", type: select, path: variables.W.type, required: true,
             choices: {continuous: "A score", binary: "A yes/no group"}, shown_if: {field: analysis, is_not: mediation}}
          - {id: W_level1, label: "First group of W", type: text, path: variables.W.levels.1, required: true, shown_if: [{field: W_type, is: binary}, {field: analysis, is_not: mediation}]}
          - {id: W_level2, label: "Second group of W", type: text, path: variables.W.levels.2, required: true, shown_if: [{field: W_type, is: binary}, {field: analysis, is_not: mediation}]}
      - input: "The starting point and the effects: odds ratios for a yes/no outcome, rate ratios for a count"
        fields:
          - {id: base_prob, writeup_label: "proportion of 'yes' at the starting point", label: "Proportion of 'yes' at baseline", help: "With X and W at their averages, or in their first groups (0 to 1).", type: number, path: population.base_prob, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{field: Y_kind, is_not: count}, {field: Y_kind, is_not: categories}, {field: analysis, is_not: mediation}]}
          - {id: odds_ratio_x, writeup_label: "odds ratio for X", label: "Odds ratio for X, with W at its average or in its first group", type: number, path: population.odds_ratio_x, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is_not: count}, {field: Y_kind, is_not: categories}, {field: analysis, is_not: mediation}],
             help: "Per SD of X for a score, or X's second group against its first."}
          - {id: odds_ratio_w, writeup_label: "odds ratio for W", label: "Odds ratio for W, with X at its average or in its first group", type: number, path: population.odds_ratio_w, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is_not: count}, {field: Y_kind, is_not: categories}, {field: analysis, is_not: mediation}]}
          - {id: odds_ratio_xw, optional_for: [sensitivity], when_empty: one, writeup_label: "interaction (ratio of odds ratios)", label: "X-by-W interaction (odds ratio)", type: number, path: population.odds_ratio_xw, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is_not: count}, {field: Y_kind, is_not: categories}, {field: analysis, is_not: mediation}],
             help: "How many times X's odds ratio is multiplied per SD of W (or in W's second group). 1 means no moderation. For example 1.25: X's odds ratio is a quarter larger for each SD of W. It is the exponent of the X x W coefficient a logistic regression reports."}
          - {id: cat_probabilities, writeup_label: "share in each category at the starting point", label: "Share in each category at the baseline", help: "With X and W at their averages, or in their first groups. One for each category, in the same order, separated by commas, adding up to 1.", type: numbers, per_levels: Y_levels, path: population.probabilities, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{field: Y_kind, is: categories}, {field: analysis, is_not: mediation}]}
          - {id: cat_odds_ratios_x, writeup_label: "odds ratios for X against the first category", label: "X's odds ratio for each category", type: numbers, path: population.odds_ratios_x, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: categories}, {field: analysis, is_not: mediation}],
             help: "With W at its average or in its first group: one for each category except the first, in the same order. For each category, how many times the odds of being in it rather than the first category change per SD of X (a score) or in X's second group (SPSS calls them Exp(B)). 1 means no effect."}
          - {id: cat_odds_ratios_w, writeup_label: "odds ratios for W against the first category", label: "W's odds ratio for each category", help: "With X at its average or in its first group: one for each category except the first.", type: numbers, path: population.odds_ratios_w, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: categories}, {field: analysis, is_not: mediation}]}
          - {id: cat_odds_ratios_xw, writeup_label: "interaction for each category (ratio of odds ratios)", label: "X-by-W interaction for each category", type: numbers, path: population.odds_ratios_xw, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: categories}, {field: analysis, is_not: mediation}],
             help: "For each category except the first: how many times X's odds ratio is multiplied per SD of W (or in W's second group). 1 means X's effect on that category doesn't depend on W. For example 0.6, 0.9: X's odds ratio for the second category against the first shrinks by 40% per SD of W, and for the third by 10%. They are the exponents of the X x W coefficients a multinomial logistic regression reports."}
          - {id: base_rate, writeup_label: "mean count at the starting point", label: "Mean count with X and W at their averages, or in their first groups", type: number, path: population.base_rate, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: count}, {field: analysis, is_not: mediation}]}
          - {id: rate_ratio_x, writeup_label: "rate ratio for X", label: "Rate ratio for X, with W at its average or in its first group", type: number, path: population.rate_ratio_x, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: count}, {field: analysis, is_not: mediation}],
             help: "How many times the mean count is multiplied per SD of X for a score, or in X's second group against its first: 0.8 is a fifth fewer."}
          - {id: rate_ratio_w, writeup_label: "rate ratio for W", label: "Rate ratio for W, with X at its average or in its first group", type: number, path: population.rate_ratio_w, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: count}, {field: analysis, is_not: mediation}]}
          - {id: rate_ratio_xw, optional_for: [sensitivity], when_empty: one, writeup_label: "interaction (ratio of rate ratios)", label: "X-by-W interaction (rate ratio)", type: number, path: population.rate_ratio_xw, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: count}, {field: analysis, is_not: mediation}],
             help: "How many times X's rate ratio is multiplied per SD of W (or in W's second group). 1 means no moderation. For example 0.85: X's rate ratio is 15% smaller for each SD of W. It is the exponent of the X x W coefficient a Poisson or negative binomial regression reports."}
          - {id: dispersion, writeup_label: "the counts' overdispersion", label: "Overdispersion (k)", type: number, path: population.dispersion, required: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: count}, {field: count_model, is: negative_binomial}, {field: analysis, is_not: mediation}],
             help: "A count's variance is its mean plus k times its mean squared. 0.5 is common for counts of behaviour. From a pilot or a published count model: k = (variance - mean) / mean^2, or 1 / theta from R's glm.nb()."}
          - {id: med_a, writeup_label: "X's effect on the mediator", label: "X's effect on the mediator (path a)", help: "In the mediator's SD: the second group against the first, or per SD of a score, like Cohen's d.", type: number, path: population.a, effect: true,
             shown_if: {field: analysis, is: mediation}}
          - {id: med_y_baseline, writeup_label: "the chance of the outcome in the comparison group", label: "Chance of 'yes' on the outcome at baseline", help: "In the first group (or at X's average), with the mediator at that group's average, from 0 to 1.", type: number, path: population.y_baseline, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{field: Y_kind, is_not: count}, {field: analysis, is: mediation}]}
          - {id: med_b_or, writeup_label: "the odds ratio of the outcome for the mediator", label: "Mediator's odds ratio on the outcome (path b)", help: "The odds ratio of the outcome being 'yes' per SD of the mediator, at the same X.", type: number, path: population.b_odds_ratio, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is_not: count}, {field: analysis, is: mediation}]}
          - {id: med_direct_or, writeup_label: "the direct odds ratio of X", label: "X's direct odds ratio on the outcome", help: "Holding the mediator. Optional: empty means 1, no direct effect.", type: number, path: population.direct_odds_ratio, optional: true, empty_text: "1", min_exclusive: 0,
             shown_if: [{field: Y_kind, is_not: count}, {field: analysis, is: mediation}]}
          - {id: med_base_rate, writeup_label: "the mean count in the comparison group", label: "Mean count at baseline", help: "In the first group (or at X's average), with the mediator at that group's average.", type: number, path: population.base_rate, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: count}, {field: analysis, is: mediation}]}
          - {id: med_b_rr, writeup_label: "the rate ratio of the outcome for the mediator", label: "Mediator's rate ratio on the count (path b)", help: "Per SD of the mediator, at the same X. 0.8 is a fifth fewer.", type: number, path: population.b_rate_ratio, effect: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: count}, {field: analysis, is: mediation}]}
          - {id: med_direct_rr, writeup_label: "the direct rate ratio of X", label: "X's direct rate ratio on the count", help: "Holding the mediator. Optional: empty means 1, no direct effect.", type: number, path: population.direct_rate_ratio, optional: true, empty_text: "1", min_exclusive: 0,
             shown_if: [{field: Y_kind, is: count}, {field: analysis, is: mediation}]}
          - {id: med_dispersion, writeup_label: "the counts' overdispersion", label: "Overdispersion (k)", type: number, path: population.dispersion, required: true, min_exclusive: 0,
             shown_if: [{field: Y_kind, is: count}, {field: med_count_model, is: negative_binomial}, {field: analysis, is: mediation}],
             help: "A count's variance is its mean plus k times its mean squared. 0.5 is common for counts of behaviour. From a pilot or a published count model: k = (variance - mean) / mean^2, or 1 / theta from R's glm.nb()."}
      - input: "How X and W relate"
        fields:
          - {id: cat_test, label: "Which test (an outcome in categories)", type: select, path: target_test.method, required: true,
             shown_if: [{field: Y_kind, is: categories}, {field: analysis, is_not: mediation}],
             choices: {likelihood_ratio: "Whether X's effect depends on W for the outcome as a whole (the likelihood-ratio test of the X x W terms, every category together)", wald_z: "Whether it does for one category against the first (the Wald z test of one X x W coefficient)"},
             default: likelihood_ratio, default_source: "the likelihood-ratio test of the X x W terms, as for multinomial logistic regression of one predictor (the test SPSS's 'Likelihood Ratio Tests' table reports)",
             help: "The likelihood-ratio test asks whether W changes X's effect on the outcome at all. If your hypothesis is about one category in particular, the test of that category is the one to power."}
          - {id: cat_category, label: "The category compared with the first", type: text, path: target_test.category, required: true,
             shown_if: [{field: Y_kind, is: categories}, {field: cat_test, is: wald_z}, {field: analysis, is_not: mediation}]}
          - {id: x_prob, label: "Proportion of people in X's second group", help: "Between 0 and 1.", type: number, path: population.x_prob, required: true, min_exclusive: 0, max_exclusive: 1,
             default: 0.5, default_source: "equal groups, powerkit's default (the design spec's population > x_prob)", shown_if: [{field: X_type, is: binary}, {field: analysis, is_not: mediation}]}
          - {id: w_prob, label: "Proportion of people in W's second group", help: "Between 0 and 1.", type: number, path: population.w_prob, required: true, min_exclusive: 0, max_exclusive: 1,
             default: 0.5, default_source: "equal groups, powerkit's default (population > w_prob)", shown_if: [{field: W_type, is: binary}, {field: analysis, is_not: mediation}]}
          - {id: r_xw, label: "Correlation between X and W (two scores only)", type: number, path: population.r_xw, required: true, min_exclusive: -1, max_exclusive: 1,
             default: 0, default_source: "uncorrelated, powerkit's default (population > r_xw)",
             shown_if: [{field: X_type, is: continuous}, {field: W_type, is: continuous}, {field: analysis, is_not: mediation}]}

  # Poisson regression, one predictor (pwrss's Wald z test): a score X is
  # taken as standardised, so its rate ratio is per SD; a yes/no X compares
  # its second group with the first. Events are counted over a mean
  # exposure; other predictors enter only through X's R-squared with them.
  E28:
    methods_name: "a Poisson regression (the Wald z test of one predictor)"
    tool: pwrss
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_shown_if: {field: count_model, is: wald_z}
    sensitivity_note: "For the smallest effect you could detect with the Poisson model, the rate ratio can stay empty if you have no estimate: Powerkit keeps the base rate and finds the smallest rate ratio above 1 your sample could detect. A rate ratio below 1 looks for a decrease instead."
    directional: true
    base: {spec_version: "0.1", design: poisson_regression, template: single_predictor_count,
           variables: {X: {}, "Y": {type: count}}, population: {metric: rate_ratio},
           target_test: {effect: rate_ratio, method: wald_z}}
    groups:
      - input: "Your outcome, your predictor and what kind of predictor it is"
        fields:
          - {id: Y_label, label: "Count outcome", help: "For example, clinic visits in a year.", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "Predictor", type: text, path: variables.X.label, required: true}
          - {id: X_type, label: "What kind of predictor", type: select, path: variables.X.type, required: true,
             choices: {continuous: "A score (for example, a questionnaire total)", binary: "A yes/no group (for example, treatment or control)"}}
          - {id: X_level1, label: "First group (the comparison group)", type: text, path: variables.X.levels.1, required: true,
             shown_if: {field: X_type, is: binary}}
          - {id: X_level2, label: "Second group", type: text, path: variables.X.levels.2, required: true,
             shown_if: {field: X_type, is: binary}}
      - input: "The rate ratio, the starting rate and the time over which events are counted"
        fields:
          - {id: rate_ratio, when_empty: one, writeup_label: "rate ratio", label: "Rate ratio", type: number, path: population.rate_ratio, effect: true, min_exclusive: 0,
             help: "For a score: how many times the rate of events changes for each standard deviation higher on the predictor. For a group: the rate in the second group divided by the rate in the first. 1 means no effect."}
          - {id: base_rate, baseline: true, writeup_label: "starting rate of events", label: "Starting rate: events per unit of time", type: number, path: population.base_rate, effect: true, min_exclusive: 0,
             help: "For a score: the expected count per unit of time at the predictor's average. For a group: in the first group."}
          - {id: mean_exposure, label: "Average time each person is followed, in those units", type: number, path: population.mean_exposure, required: true, min_exclusive: 0,
             default: 1, default_source: "one unit, so the starting rate is the expected count per person: powerkit's and pwrss's default (power.z.poisson(mean.exposure = 1))",
             help: "For example, with a rate per month and a year of follow-up, 12."}
          - {id: x_prob, label: "Proportion of people in the second group", help: "Between 0 and 1.", type: number, path: population.x_prob, required: true, min_exclusive: 0, max_exclusive: 1,
             default: 0.5, default_source: "equal groups, powerkit's default (the design spec's population > x_prob)",
             shown_if: {field: X_type, is: binary}}
      - input: "Poisson, negative binomial or zero-inflated regression"
        fields:
          - {id: count_model, label: "Model for the counts", type: select, path: target_test.method, required: true,
             choices: {wald_z: "Poisson regression (the counts vary as much as their average)", negative_binomial: "Negative binomial regression (the counts vary more than that), simulated",
                       zero_inflated_poisson: "Zero-inflated Poisson regression (extra zeros from people who could not have had an event), simulated",
                       zero_inflated_negative_binomial: "Zero-inflated negative binomial regression (extra zeros, and counts that vary more than their average), simulated"},
             default: wald_z, default_source: "Poisson regression, the test G*Power and pwrss's power.z.poisson() compute",
             help: "Counts of events often vary more between people than a Poisson distribution allows (some people have many, most few). If your earlier data show a variance well above the mean, choose negative binomial regression. If some people could not have had any event at all (for example, people who never drink, when you count drinks), the zero-inflated models add a share of extra zeros."}
          - {id: dispersion, label: "Overdispersion k (variance = mean + k × mean²)", type: number, path: population.dispersion, required: true, min_exclusive: 0,
             shown_if: {field: count_model, is_one_of: [negative_binomial, zero_inflated_negative_binomial]},
             help: "From earlier data: k = (variance - mean) / mean². 0 would be Poisson; 0.5 or 1 is common for counts such as visits or symptoms. In MASS's glm.nb() and pscl's zeroinfl() output it is 1 / theta."}
          - {id: zero_prob, baseline: true, writeup_label: "share of extra zeros", label: "Share of extra zeros at the starting point", type: number, path: population.zero_prob, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: count_model, is_one_of: [zero_inflated_poisson, zero_inflated_negative_binomial]},
             help: "The share of people who could not have had an event, on top of the zeros among everyone else (for a score, at its average; for a group, in the first group). The rate and the rate ratio above describe everyone else. In pscl's zeroinfl() output, plogis() of the zero model's intercept. Between 0 and 1."}
          - {id: zero_odds_ratio, writeup_label: "odds ratio for being an extra zero", label: "Odds ratio for being an extra zero", type: number, path: population.zero_odds_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "the predictor doesn't change the share of extra zeros, powerkit's default (population > zero_odds_ratio)",
             shown_if: {field: count_model, is_one_of: [zero_inflated_poisson, zero_inflated_negative_binomial]},
             help: "How many times the odds of being an extra zero change per SD of the score, or in the second group against the first. 1 means the predictor doesn't change it."}
          - {id: count_part, label: "Which part to test", type: select, path: target_test.effect, required: true,
             choices: {rate_ratio: "The count part: does the predictor change the rate, among those who could have an event?", zero_odds_ratio: "The zero part: does the predictor change the share of extra zeros?", rate_and_zero: "Both parts together (a likelihood-ratio test, two-sided)"},
             default: rate_ratio, default_source: "the count part, the rate ratio the card asks for first",
             shown_if: {field: count_model, is_one_of: [zero_inflated_poisson, zero_inflated_negative_binomial]},
             help: "Both parts include the predictor, as pscl's zeroinfl() does by default; this chooses which test the power is for. With negative binomial counts the zero part's Wald test is conservative (about 4% false positives at alpha .05 in powerkit's checks), so its power is too."}
      - input: "How much the other predictors overlap with this one"
        fields:
          - {id: r2_other, label: "R-squared on the other predictors", type: number, path: population.r2_other_predictors, required: true, min: 0, max_exclusive: 1,
             default: 0, default_source: "no other predictors, powerkit's default (the design spec's population > r2_other_predictors)",
             help: "Of this predictor on the other predictors (0 to 1; 0 if there are no others). How much of this predictor the other predictors in your model explain. Their own effects on the outcome aren't needed."}

  # Cluster-randomised trial (powertools' crt.parallel.cont()): whole
  # groups assigned to two conditions, the same number in each; d over the
  # outcome's total SD; one ICC for both conditions; no covariates. The
  # total N is a whole number of groups (forms.R checks it via the engine).
  E34:
    # Three clustered designs on one screen; how the conditions are assigned
    # sets the template, and the outcome sets the function: powertools'
    # crt.parallel.cont(), multisite.cont() or irgtt.cont() for a score,
    # crt.parallel.bin(), multisite.bin() or irgtt.bin() for a yes/no
    # outcome.
    methods_name: "a clustered design (the test of the difference between conditions, allowing for the grouping)"
    tool: powertools
    departures: ["14", "38"]
    known_differences: ["16"]
    known_differences_if_metric: {"16": proportion}
    known_differences_if_template: {"16": [cluster_randomised, multisite]}
    known_differences_if_method: {"16": logistic_mixed}
    sensitivity: true
    sensitivity_without_effect: true
    directional: true
    base: {spec_version: "0.1", design: cluster_trial,
           variables: {X: {type: binary}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean_difference}}
    groups:
      - input: "How the conditions are assigned, the outcome, and their names"
        fields:
          - {id: assignment, label: "Who is assigned to the conditions", type: select, path: template, required: true,
             choices: {cluster_randomised: "Whole groups: everyone in a group gets the same condition (a cluster-randomised trial)",
                       multisite: "People within each group: every group has people in both conditions, half in each (a multisite trial)",
                       group_treatment: "People one by one, and condition 2 is delivered in groups (for example, group therapy compared with individual treatment)"},
             sets: {cluster_randomised: [{path: target_test.method, value: cluster_t}],
                    multisite: [{path: target_test.method, value: multisite_t}],
                    group_treatment: [{path: target_test.method, value: cluster_t}]}}
          - {id: outcome_type, label: "What kind of outcome", type: select, path: population.metric, required: true,
             choices: {standardised: "A score (for example, a questionnaire total)",
                       proportion: "Yes/no (for example, passed or failed)"},
             default: standardised, default_source: "a score outcome, the design Powerkit covered first",
             sets: {proportion: [{path: variables.Y.type, value: binary},
                                 {path: target_test.effect, value: odds_ratio, shown_if: {field: assignment, is_not: group_treatment}},
                                 {path: target_test.method, value: logistic_mixed, shown_if: {field: assignment, is_not: group_treatment}},
                                 {path: target_test.effect, value: proportion_difference, shown_if: {field: assignment, is: group_treatment}},
                                 {path: target_test.method, value: z_test, shown_if: {field: assignment, is: group_treatment}}]}}
          - {id: X_label, label: "What the conditions are", help: "For example, programme.", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Condition 1", help: "For example, usual lessons.", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Condition 2", type: text, path: variables.X.levels.2, required: true,
             help: "When only one condition is delivered in groups, make it condition 2. For example, the new programme."}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The effect: Cohen's d (the difference between conditions, over the outcome's total SD)"
        shown_if: {field: outcome_type, is: standardised}
        fields:
          - {id: d, label: "Cohen's d: (condition 2 minus condition 1) / the outcome's total SD", type: number, path: population.d, effect: true,
             shown_if: {field: outcome_type, is: standardised},
             help: "The total SD is how much people vary on the outcome across everyone, not only within one group."}
      - input: "How alike people in the same group are (the intraclass correlation), and how much the effect varies between groups"
        shown_if: {field: outcome_type, is: standardised}
        fields:
          - {id: icc, writeup_label: "intraclass correlation", label: "Intraclass correlation (ICC, 0 to 1)", type: number, path: population.icc, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: outcome_type, is: standardised},
             help: "The share of the outcome's variation that lies between groups rather than within them (when only condition 2 is in groups, within that condition). 0 means people in the same group are no more alike than strangers. Take it from earlier studies with similar groups and outcomes, and try a higher value too: the answer depends on it a lot."}
          - {id: icc_effect, writeup_label: "intraclass correlation of the effect", label: "Variation in the effect between groups", type: number, path: population.icc_effect, effect: true, min: 0, max_exclusive: 1,
             shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is: multisite}],
             help: "As a share of the outcome's variation (0 to 1). 0 means the conditions differ by the same amount in every group. Larger values mean the effect is bigger in some groups than others, which costs power. It is usually much smaller than the ICC above; if you have no estimate, try 0 and a small value such as 0.01. This share is not the effect's SD: it is the part of the outcome's variance that comes from the effect varying, which is a quarter of the effect's variance, as powertools defines it. If you think of the effect as varying with an SD of s (in SD units of the outcome) across groups, enter (s / 2) squared: an SD of 0.2 is 0.01, and an SD of 0.4 is 0.04."}
      - input: "A baseline score, such as a pre-test (optional)"
        shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is_not: group_treatment}]
        fields:
          - {id: adjust_baseline, label: "Will the analysis adjust for a baseline score?", type: select, required: true,
             shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is_not: group_treatment}],
             choices: {"no": "No", "yes": "Yes (for example, the same measure taken before the study)"},
             default: "no", default_source: "no covariates, powertools' default (ncov = 0, Rsq = 0)"}
          - {id: baseline_within, writeup_label: "share of the variance within groups explained by the baseline score", label: "Baseline R-squared within groups", type: number, path: population.baseline_r2_within, required: true, min: 0, max_exclusive: 1,
             shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is_not: group_treatment}, {field: adjust_baseline, is: "yes"}],
             help: "How much of the differences between people in the same group the baseline explains (0 to below 1). If you know the correlation between the baseline and the outcome, square it: a correlation of 0.6 gives 0.36. Take it from earlier studies with the same measure; a guess that is too high overstates power."}
          - {id: baseline_between, writeup_label: "share of the variance between groups' averages explained by the baseline score", label: "Baseline R-squared between groups", type: number, path: population.baseline_r2_between, min: 0, max_exclusive: 1, copy_if_empty: baseline_within,
             shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is: cluster_randomised}, {field: adjust_baseline, is: "yes"}],
             help: "How much of the differences between the groups' averages the baseline explains (0 to below 1). A group's average baseline often predicts its average outcome better than one person's baseline predicts theirs, so this can be higher than the value above. If you leave it empty, Powerkit uses the same value as above, and the result says so."}
      - input: "Yes/no outcome: the proportion of 'yes' in each condition"
        shown_if: {field: outcome_type, is: proportion}
        fields:
          - {id: p1, writeup_label: "proportion in condition 1", label: "Proportion of 'yes' in condition 1", help: "Between 0 and 1.", type: number, path: population.p1, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: outcome_type, is: proportion}}
          - {id: p2, writeup_label: "proportion in condition 2", label: "Proportion of 'yes' in condition 2", help: "Between 0 and 1.", type: number, path: population.p2, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: outcome_type, is: proportion}}
      - input: "Yes/no outcome: how much the groups differ"
        shown_if: {field: outcome_type, is: proportion}
        fields:
          - {id: sigma_u_groups, writeup_label: "SD of the groups' log odds", label: "How much the groups' proportions differ: the SD of their log odds", type: number, path: population.sigma_u, effect: true, min_exclusive: 0,
             shown_if: [{field: outcome_type, is: proportion}, {field: assignment, is: cluster_randomised}],
             help: "The groups' own rates of 'yes' vary around the average. On the log-odds scale, an SD of 0.3 means that, with 30% 'yes' on average, about 95% of groups would lie between roughly 19% and 44%. The R script prints powertools' table of these ranges for your proportions (crt.varexplore()), to check your value is plausible. Above 0."}
          - {id: sigma_u_effect, writeup_label: "SD of the effect across groups (log odds ratio)", label: "Variation in the effect between groups", type: number, path: population.sigma_u, effect: true, min_exclusive: 0,
             shown_if: [{field: outcome_type, is: proportion}, {field: assignment, is: multisite}],
             help: "The SD of the log odds ratio (above 0). Larger values mean the effect is bigger in some groups than others, which costs power. An SD of 0.3 means about 95% of groups' odds ratios would lie within a factor of about 1.8 either side of the average. The R script prints powertools' table of these ranges (ms.varexplore()). powertools needs a value above 0; if you expect the same effect everywhere, use a small one such as 0.1."}
          - {id: icc_grouped, writeup_label: "intraclass correlation", label: "Intraclass correlation in condition 2's groups (ICC, 0 to 1)", type: number, path: population.icc, effect: true, min: 0, max_exclusive: 1,
             shown_if: [{field: outcome_type, is: proportion}, {field: assignment, is: group_treatment}],
             help: "The share of the outcome's variation within condition 2 that lies between its groups. 0 means people in the same group are no more alike than strangers. Take it from earlier studies with similar groups, and try a higher value too."}
      # powertools' formula by default; a glmer() simulation of the same
      # trial, without the formula's factor 1.2, on request (Known
      # difference 16; decisions.md, 15 November 2026).
      - input: "Yes/no outcome: how power is worked out"
        shown_if: [{field: outcome_type, is: proportion}, {field: assignment, is_not: group_treatment}]
        fields:
          - {id: cluster_bin_method, label: "How power is worked out", type: select, path: target_test.method, required: true,
             shown_if: [{field: outcome_type, is: proportion}, {field: assignment, is_not: group_treatment}],
             choices: {logistic_mixed: "powertools' formula (crt.parallel.bin() or multisite.bin())", glmer_simulation: "Simulated studies analysed with glmer(), the mixed-effects logistic regression"},
             default: logistic_mixed, default_source: "powertools' formula, the published method for this design (crt.parallel.bin() and multisite.bin(), powertools 1.0.0); it is instant, and it is what other researchers' plans for this design usually cite",
             choice_notes: {logistic_mixed: "Instant. The formula multiplies its variance by 1.2, a factor its help pages give no source for, so it asks for about a sixth more groups than the simulation: for the example, 28 groups rather than 24.",
                            glmer_simulation: "Simulates the trial and fits the model you will run (lme4's glmer(), Wald z test), without the formula's factor. Slower: power at one size takes about two minutes here, and a sample size runs in the R script. Use it when groups are expensive and you want to check the formula's answer."}}
      - input: "How many people in each group (the cluster size), and how much that varies"
        fields:
          - {id: cluster_size, writeup_label: "participants per group", label: "People analysed in each group", type: number, path: population.cluster_size, required: true, min: 2,
             shown_if: {field: assignment, is_not: group_treatment},
             help: "Both conditions together; the average, if sizes vary. For example, pupils per class. The total number of participants is then a whole number of groups (with whole groups assigned, the same number of groups in each condition)."}
          - {id: cluster_size_grouped, writeup_label: "participants per group", label: "People analysed in each group of condition 2", type: number, path: population.cluster_size, required: true, min: 2, integer: true,
             shown_if: {field: assignment, is: group_treatment},
             help: "For example, members of each therapy group. Condition 1 gets as many people in all as condition 2, taking part individually."}
          - {id: cluster_size_sd, label: "How much group sizes vary: their SD (0 if all the same size)", type: number, path: population.cluster_size_sd, required: true, min: 0,
             shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is_not: group_treatment}],
             default: 0, default_source: "groups of equal size, powertools' default (crt.parallel.cont(m.sd = 0) and multisite.cont(m.sd = 0), powertools 1.0.0)"}

  # Structural equation model fit (semPower's semPower.postHoc() with an
  # RMSEA): the chi-square test of exact fit, power to reject a model whose
  # population misfit is the RMSEA given. The model is a CFA (items and
  # factors; the engine counts its df) or any model given by its df.
  E37:
    methods_name: "the chi-square test of exact model fit (power to reject a model whose misfit is the RMSEA given)"
    tool: semPower
    sensitivity: true
    sensitivity_shown_if: {field: question, is_one_of: [model_fit, factor_correlation, latent_regression]}
    directional: false
    sides: false
    base: {spec_version: "0.1", design: sem, variables: {}, population: {}, target_test: {}}
    groups:
      - input: "What you want to test"
        fields:
          - {id: question, label: "What you want to test", type: select, path: template, required: true,
             choices: {model_fit: "Whether the model fits (the test of exact, close or not-close fit, by RMSEA)",
                       invariance: "Whether a questionnaire measures the same thing in different groups or on different occasions (measurement invariance)",
                       factor_correlation: "Whether two factors are correlated",
                       latent_regression: "Whether latent variables predict another (a path in a structural model)"},
             sets: {model_fit: [{path: population.metric, value: rmsea}, {path: target_test.effect, value: model_fit}],
                    invariance: [{path: population.metric, value: invariance}, {path: target_test.effect, value: invariance}, {path: target_test.method, value: chi_square_difference}],
                    factor_correlation: [{path: population.metric, value: factor_correlation}, {path: target_test.effect, value: factor_correlation}, {path: target_test.method, value: chi_square_difference}],
                    latent_regression: [{path: population.metric, value: standardised_slopes}, {path: target_test.effect, value: latent_slope}, {path: target_test.method, value: chi_square_difference}]}}
      - input: "Model fit: the number of items and factors (for a CFA), or the model's degrees of freedom"
        shown_if: {field: question, is: model_fit}
        fields:
          - {id: model_kind, label: "What kind of model", type: select, required: true,
             shown_if: {field: question, is: model_fit},
             choices: {cfa: "A confirmatory factor analysis (CFA): items, each measuring one factor",
                       df: "Another model: I know its degrees of freedom"}}
          - {id: indicators, writeup_label: "items", label: "Number of items (observed variables)", type: number, path: population.indicators, required: true, min: 3, max: 100, integer: true,
             shown_if: [{field: question, is: model_fit}, {field: model_kind, is: cfa}],
             help: "For example, 12 questionnaire items. Up to 100 here, since counting a larger model's degrees of freedom takes semPower minutes; for more, choose \u201cAnother model\u201d and enter the degrees of freedom lavaan reports."}
          - {id: factors, writeup_label: "factors", label: "Number of factors", type: number, path: population.factors, required: true, min: 1, integer: true,
             shown_if: [{field: question, is: model_fit}, {field: model_kind, is: cfa}],
             help: "The factors are allowed to correlate, and each item measures one factor. Powerkit counts the model's degrees of freedom from these."}
          - {id: df, writeup_label: "degrees of freedom", label: "The model's degrees of freedom", type: number, path: population.df, required: true, min: 1, integer: true,
             shown_if: [{field: question, is: model_fit}, {field: model_kind, is: df}],
             help: "lavaan, Mplus and other SEM software report this when they fit the model (in lavaan, fitMeasures(fit, \"df\")). You can fit it to made-up data to get the number."}
      - input: "Model fit: the test, and the model's RMSEA in the population"
        shown_if: {field: question, is: model_fit}
        fields:
          - {id: fit_test, label: "What you want the test of fit to do", type: select, path: target_test.method, required: true,
             shown_if: {field: question, is: model_fit},
             choices: {chi_square_not_close_fit: "Show that the model fits well enough: the test of not-close fit (MacCallum and colleagues), where a significant result supports the model",
                       chi_square_close_fit: "Detect a model that fits worse than a small RMSEA: the test of close fit (MacCallum and colleagues)",
                       chi_square_exact_fit: "Detect any misfit at all: the chi-square test of exact fit that SEM software reports"},
             default_source: "Not filled in for you, because the tests answer opposite questions (for reference: semPower computes only the test of exact fit)",
             help: "Power for exact or close fit is the chance of rejecting your model, so planning for it gives the sample size that makes a small misfit most likely to be detected. To gather evidence that a questionnaire's structure holds, plan for not-close fit (MacCallum, Browne and Sugawara, 1996). If what matters is a factor correlation or a path, plan for that instead (the other questions on this card)."}
          - {id: rmsea, optional_for: [sensitivity], when_empty: omit, writeup_label: "RMSEA", label: "The model's RMSEA in the population", type: number, path: population.rmsea, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: model_fit},
             help: "For exact or close fit: how wrong the model would have to be for you to want the test to notice (0 would be a model that fits exactly; larger values are worse fit). Choose it from the misfit that would matter for how you will use the model, not from a habitual cut-off. For not-close fit: how well you expect the model to fit, below the null value (for example 0.01 or 0.02). Values near the null value need many more people."}
          - {id: rmsea_null, writeup_label: "RMSEA of the null hypothesis", label: "RMSEA that separates close from not-close fit", type: number, path: population.rmsea_null, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{field: question, is: model_fit}, {field: fit_test, is_one_of: [chi_square_close_fit, chi_square_not_close_fit]}],
             default: 0.05, default_source: "0.05, the null value commonly used for these tests (for example in semTools' findRMSEApower() help, rmsea0 = .05)"}
      - input: "Measurement invariance: the groups or occasions, the items and their loadings, and how the last group or occasion differs"
        shown_if: {field: question, is: invariance}
        fields:
          - {id: over, label: "Across what", type: select, path: population.over, required: true,
             shown_if: {field: question, is: invariance},
             choices: {groups: "Groups of different people", occasions: "The same people on several occasions (longitudinal)"},
             default: groups, default_source: "groups, as in semPower.powerMI() (semPower.powerLI() for occasions, semPower 2.2.0)"}
          - {id: mi_groups, writeup_label: "groups", label: "Number of groups", type: number, path: population.n_groups, required: true, min: 2, max: 10, integer: true,
             default: 2, default_source: "two groups, as in semPower.powerMI()'s examples (semPower 2.2.0)",
             shown_if: [{field: question, is: invariance}, {field: over, is_not: occasions}],
             help: "With three or more groups, they are taken to be the same size."}
          - {id: mi_occasions, writeup_label: "occasions", label: "Number of occasions", type: number, path: population.n_occasions, required: true, min: 2, max: 10, integer: true,
             default: 2, default_source: "two occasions, as in semPower.powerLI()'s examples (semPower 2.2.0)",
             shown_if: [{field: question, is: invariance}, {field: over, is: occasions}]}
          - {id: mi_factors, writeup_label: "factors", label: "Number of factors the questionnaire measures", type: number, path: population.factors, required: true, min: 1, max: 5, integer: true,
             default: 1, default_source: "one factor, as in semPower.powerMI()'s examples (semPower 2.2.0)",
             shown_if: {field: question, is: invariance},
             help: "Each factor has its own items, the same number for each. Invariance is tested for all the factors together."}
          - {id: mi_factor_correlation, writeup_label: "correlation between the factors", label: "Correlation between the factors", type: number, path: population.factor_correlation, optional: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: question, is: invariance},
             help: "Leave it empty with one factor. With several, the correlation between any two of them, for example 0.3. Two or more factors only."}
          - {id: level, label: "What you want to test", type: select, path: population.level, required: true,
             shown_if: {field: question, is: invariance},
             choices: {metric: "Metric invariance: do the items load equally everywhere?",
                       scalar: "Scalar invariance: do the items have the same intercepts (so means can be compared)?"}}
          - {id: mi_indicators, writeup_label: "items", label: "Number of items measuring each factor", type: number, path: population.indicators, required: true, min: 3, integer: true,
             shown_if: {field: question, is: invariance}}
          - {id: mi_loading, writeup_label: "loading", label: "Standardised loading of the items", type: number, path: population.loading, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: invariance},
             help: "Take it from a published factor analysis of the same or similar items. A loading runs from 0 to 1; its square is the share of an item's variance its factor explains. Lower loadings need more people. Every item has this loading in every group and on every occasion, apart from the items that differ in the last one."}
          - {id: noninvariant, writeup_label: "items that differ", label: "Number of items that differ in the last group", type: number, path: population.noninvariant, required: true, min: 1, integer: true,
             shown_if: {field: question, is: invariance},
             help: "How many of the first factor's items differ in the last group (or on the last occasion). At least one item must be the same everywhere. The other groups or occasions, and the other factors, are invariant."}
          - {id: loading_group2, writeup_label: "loading in the last group", label: "Their standardised loading in the last group (or on the last occasion)", type: number, path: population.loading_group2, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{field: question, is: invariance}, {field: level, is: metric}],
             help: "The smallest difference worth detecting: for example 0.5 where the others' is 0.7."}
          - {id: intercept_difference, writeup_label: "intercept shift", label: "Intercept shift in the last group", type: number, path: population.intercept_difference, effect: true,
             shown_if: [{field: question, is: invariance}, {field: level, is: scalar}],
             help: "How far the intercepts are shifted in the last group (or on the last occasion), in item SDs. The smallest shift worth detecting, for example 0.3 (higher in the last group) or -0.3 (lower)."}
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1 (two groups only)", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in semPower's examples (semPower.powerMI(), semPower 2.2.0)",
             shown_if: [{field: question, is: invariance}, {field: over, is_not: occasions}],
             help: "Leave it at 1 with three or more groups: they are taken to be the same size."}
          - {id: stability, writeup_label: "correlation between occasions", label: "Correlation of a factor between any two occasions", type: number, path: population.stability, required: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: [{field: question, is: invariance}, {field: over, is: occasions}],
             help: "How stable people's standing on the factor is from one occasion to the next, for example 0.6."}
      - input: "Two factors: the items and loading of each, and their correlation"
        shown_if: {field: question, is: factor_correlation}
        fields:
          - {id: fc_items1, writeup_label: "items on factor 1", label: "Items measuring factor 1", type: number, path: population.indicators.1, required: true, min: 2, integer: true,
             shown_if: {field: question, is: factor_correlation}}
          - {id: fc_items2, writeup_label: "items on factor 2", label: "Items measuring factor 2", type: number, path: population.indicators.2, required: true, min: 2, integer: true,
             shown_if: {field: question, is: factor_correlation}}
          - {id: fc_loading1, writeup_label: "loading on factor 1", label: "Standardised loading of factor 1's items", type: number, path: population.loadings.1, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: factor_correlation}, help: "Take it from a published factor analysis of the same or similar items. A loading runs from 0 to 1; its square is the share of an item's variance its factor explains. Lower loadings need more people."}
          - {id: fc_loading2, writeup_label: "loading on factor 2", label: "Standardised loading of factor 2's items", type: number, path: population.loadings.2, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: factor_correlation}}
          - {id: fc_r, writeup_label: "correlation", label: "Correlation between the factors", type: number, path: population.r, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: question, is: factor_correlation},
             help: "The correlation between the factors themselves (free of measurement error), not between their sum scores."}
      - input: "Latent regression: the slopes, the predictors' correlation, and the items"
        shown_if: {field: question, is: latent_regression}
        fields:
          - {id: slopes, writeup_label: "standardised slopes", label: "Standardised slope of each latent predictor, separated by commas", type: numbers, path: population.slopes, effect: true,
             shown_if: {field: question, is: latent_regression},
             help: "One to five predictors, for example 0.2, 0.3. The first is the one tested unless you choose another below."}
          - {id: tested, label: "Which slope is tested (1 = the first)", type: number, path: population.tested, required: true, min: 1, max: 5, integer: true,
             default: 1, default_source: "the first predictor, as in semPower.powerRegression() (nullWhich = 1, semPower 2.2.0)",
             shown_if: {field: question, is: latent_regression}}
          - {id: predictor_correlation, writeup_label: "correlation between the predictors", label: "Correlation between the predictors", type: number, path: population.predictor_correlation, required: true, min_exclusive: -1, max_exclusive: 1,
             default: 0, default_source: "uncorrelated predictors, as in semPower.powerRegression() (corXX = NULL, semPower 2.2.0)",
             shown_if: {field: question, is: latent_regression}}
          - {id: lr_indicators, writeup_label: "items per factor", label: "Items measuring each factor", type: number, path: population.indicators, required: true, min: 2, integer: true,
             shown_if: {field: question, is: latent_regression}, help: "The same for the outcome and every predictor."}
          - {id: lr_loading, writeup_label: "loading", label: "Standardised loading of every item", type: number, path: population.loading, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: latent_regression}, help: "Take it from a published factor analysis of the same or similar items. A loading runs from 0 to 1; its square is the share of an item's variance its factor explains. Lower loadings need more people."}

  # Planned contrast (the t test of one weighted combination of the group
  # means, power.t.contrasts()'s noncentral t with k.covariates = 0, run
  # through pwrss's power.t.test() so the alpha and a one-sided test are
  # honoured: docs/conventions.md). Equal groups.
  E19:
    methods_name: "a planned contrast (a t test of a weighted combination of the group means)"
    tool: pwrss
    sensitivity: true
    directional: true
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_contrast,
           variables: {A: {type: between_factor}, "Y": {type: continuous}},
           target_test: {effect: contrast, method: contrast_t}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: A_label, label: "What the groups are", help: "For example, condition.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (three or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected group means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "group means", label: "Means: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every group; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The contrast weights"
        fields:
          - {id: weights, in_effect_text: true, writeup_label: "contrast weights", label: "Weights: one for each group, in the same order, adding up to 0", type: numbers, per_levels: A_levels, path: target_test.weights, required: true,
             help: "For example, with groups None, Neutral and Praise, -2, 1, 1 compares no feedback with both kinds of feedback; with four doses, -3, -1, 1, 3 tests a straight-line trend. Only the pattern matters, not the size of the numbers."}

  # Two dependent correlations (pwrss's Steiger z test, unpooled as in
  # G*Power: Departure 12). The first choice picks the template; the
  # variables' types follow from it (`sets`). A one-sided test runs in the
  # direction of the second correlation minus the first.
  E51:
    methods_name: "Steiger's z test of two dependent correlations"
    sensitivity: true
    sensitivity_without_effect: true
    tool: pwrss
    directional: true
    departures: ["12"]
    base: {spec_version: "0.1", design: basic_test, population: {metric: correlation},
           target_test: {effect: correlation_difference, method: steiger_z}}
    groups:
      - input: "Which two correlations, and the variables' names"
        fields:
          - {id: comparison, label: "Which two correlations", type: select, path: template, required: true,
             choices: {overlapping_correlations: "Two that share a variable: X with Y, against X with Z",
                       nonoverlapping_correlations: "Two with no variable in common: X1 with Y1, against X2 with Y2 (for example, the same two measures at two ages)"},
             sets: {overlapping_correlations: [{path: variables.X.type, value: continuous}, {path: variables.Y.type, value: continuous}, {path: variables.Z.type, value: continuous}],
                    nonoverlapping_correlations: [{path: variables.X1.type, value: continuous}, {path: variables.Y1.type, value: continuous},
                                                  {path: variables.X2.type, value: continuous}, {path: variables.Y2.type, value: continuous}]}}
          - {id: X_label, label: "X, the shared variable", type: text, path: variables.X.label, required: true, shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: Y_label, label: "Y", type: text, path: variables.Y.label, required: true, shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: Z_label, label: "Z", type: text, path: variables.Z.label, required: true, shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: X1_label, label: "X1", type: text, path: variables.X1.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: Y1_label, label: "Y1", type: text, path: variables.Y1.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: X2_label, label: "X2", type: text, path: variables.X2.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: Y2_label, label: "Y2", type: text, path: variables.Y2.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
      - input: "The two correlations you are comparing"
        fields:
          - {id: r_X_Y, baseline: true, writeup_label: "correlation under no difference (X with Y)", label: "X with Y, the value under no difference", type: number, path: population.r_X_Y, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: overlapping_correlations}, help: "With no difference, both correlations would take this value, which sets the test's spread under the null (G*Power's H0 correlation; pwrss's unpooled method). The order matters: entering the two the other way round changes the sample size."}
          - {id: r_X_Z, when_empty: same_as, same_as: r_X_Y, writeup_label: "expected correlation (X with Z)", label: "X with Z, the value you expect", type: number, path: population.r_X_Z, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: r_X1_Y1, baseline: true, writeup_label: "correlation under no difference (X1 with Y1)", label: "X1 with Y1, the value under no difference", type: number, path: population.r_X1_Y1, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}, help: "With no difference, both correlations would take this value, which sets the test's spread under the null (G*Power's H0 correlation; pwrss's unpooled method). The order matters: entering the two the other way round changes the sample size."}
          - {id: r_X2_Y2, when_empty: same_as, same_as: r_X1_Y1, writeup_label: "expected correlation (X2 with Y2)", label: "X2 with Y2, the value you expect", type: number, path: population.r_X2_Y2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
      - input: "The correlations between the other pairs of variables"
        fields:
          - {id: r_Y_Z, baseline: true, writeup_label: "correlation of Y with Z", label: "Y with Z", type: number, path: population.r_Y_Z, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: overlapping_correlations},
             help: "The higher this is, the more the two compared correlations move together, and the fewer people you need."}
          - {id: r_X1_X2, baseline: true, writeup_label: "correlation of X1 with X2", label: "X1 with X2", type: number, path: population.r_X1_X2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_Y1_Y2, baseline: true, writeup_label: "correlation of Y1 with Y2", label: "Y1 with Y2", type: number, path: population.r_Y1_Y2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_X1_Y2, baseline: true, writeup_label: "correlation of X1 with Y2", label: "X1 with Y2", type: number, path: population.r_X1_Y2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_Y1_X2, baseline: true, writeup_label: "correlation of Y1 with X2", label: "Y1 with X2", type: number, path: population.r_Y1_X2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}

  # Generic tests (G*Power's "Generic" tests): no sample size, because the
  # noncentrality already reflects it. Goals: the power for a noncentrality,
  # or the noncentrality needed for a target power (R/forms.R,
  # closing_groups()). Only t and z have a direction.
  E50:
    generic: true
    sides: false
    methods_name: "a generic test from a noncentrality parameter"
    tool: pwrss
    directional: true
    direction_shown_if: [{field: generic_test, is_not: f}, {field: generic_test, is_not: chi_square}]
    base: {spec_version: "0.1", design: generic_test, template: t, variables: {},
           population: {metric: noncentrality}, target_test: {effect: noncentrality, method: t_test}}
    groups:
      - input: "The test statistic"
        fields:
          - {id: generic_test, label: "Which test statistic", type: select, path: template, required: true,
             choices: {t: "t", f: "F", chi_square: "Chi-square", z: "z (standard deviation 1)"},
             default: t, default_source: "powerkit's first choice; pick the statistic your analysis reports",
             sets: {t: [{path: target_test.method, value: t_test}], f: [{path: target_test.method, value: f_test}],
                    chi_square: [{path: target_test.method, value: chi_square_test}], z: [{path: target_test.method, value: z_test}]}}
      - input: "The noncentrality parameter and the degrees of freedom"
        fields:
          - {id: ncp, writeup_label: "noncentrality parameter", label: "Noncentrality parameter", help: "For z, the mean of the z statistic if the effect is real. Needed for power.", type: number, path: population.ncp, effect: true, optional_for: [sensitivity]}
          - {id: df, label: "Degrees of freedom", type: number, path: population.df, required: true, min_exclusive: 0,
             shown_if: [{field: generic_test, is_not: f}, {field: generic_test, is_not: z}]}
          - {id: df1, label: "Numerator degrees of freedom", type: number, path: population.df1, required: true, min_exclusive: 0,
             shown_if: {field: generic_test, is: f}}
          - {id: df2, label: "Denominator degrees of freedom", type: number, path: population.df2, required: true, min_exclusive: 0,
             shown_if: {field: generic_test, is: f}}

  # Precision planning (1 November 2026): the sample size for a target
  # confidence-interval width, or the width at a given sample size, not
  # power. Cohen's d, a standardised mean and d_z by MBESS (ss.aipe.smd(),
  # ss.aipe.sm()); a correlation and a proportion by presize (prec_cor(),
  # prec_prop()). The engine's design "precision".
  E46:
    methods_name: "a confidence interval"
    tool: precision
    precision: true
    departures: ["25"]
    base: {spec_version: "0.1", design: precision, template: two_groups, variables: {},
           target_test: {effect: confidence_interval}}
    groups:
      - input: "What you want to estimate"
        fields:
          - {id: estimate, label: "What will the confidence interval be for?", type: select, path: template, required: true,
             choices: {two_groups: "A difference between two groups, as Cohen's d", paired: "A change or difference within the same people, as d_z (pairs of scores)",
                       one_group: "One group's mean against a fixed value, in SDs", correlation: "A correlation", proportion: "A proportion (for example, how many people report burnout)",
                       mean_difference: "A difference between two groups' means, in the outcome's own units", odds_ratio: "An odds ratio between two groups (a yes/no outcome)",
                       icc: "An intraclass correlation (agreement between raters, or test-retest)", regression_coefficient: "One predictor's standardised coefficient in a multiple regression"},
             default: two_groups, default_source: "powerkit's first choice; pick the estimate your study reports",
             sets: {two_groups: [{path: variables.X.type, value: binary}, {path: variables.Y.type, value: continuous}, {path: population.metric, value: standardised}, {path: target_test.method, value: noncentral_t}],
                    paired: [{path: variables.X.type, value: within_factor}, {path: variables.Y.type, value: continuous}, {path: population.metric, value: standardised}, {path: target_test.method, value: noncentral_t}],
                    one_group: [{path: variables.Y.type, value: continuous}, {path: population.metric, value: standardised}, {path: target_test.method, value: noncentral_t}],
                    correlation: [{path: variables.X.type, value: continuous}, {path: variables.Y.type, value: continuous}, {path: population.metric, value: correlation}],
                    proportion: [{path: variables.Y.type, value: binary}, {path: variables.Y.levels, value: ["No", "Yes"]}, {path: population.metric, value: proportion}],
                    mean_difference: [{path: variables.X.type, value: binary}, {path: variables.Y.type, value: continuous}, {path: population.metric, value: raw}, {path: target_test.method, value: t}],
                    odds_ratio: [{path: variables.X.type, value: binary}, {path: variables.Y.type, value: binary}, {path: variables.Y.levels, value: ["No", "Yes"]}, {path: population.metric, value: probability}],
                    icc: [{path: variables.Y.type, value: continuous}, {path: population.metric, value: standardised}, {path: target_test.method, value: approximate}],
                    regression_coefficient: [{path: variables.X.type, value: continuous}, {path: variables.Y.type, value: continuous}, {path: population.metric, value: standardised}, {path: target_test.method, value: t}]}}
      - input: "Names"
        fields:
          - {id: X_label, label: "What the groups are", help: "For example, condition.", type: text, path: variables.X.label, required: true, shown_if: {field: estimate, is_one_of: [two_groups, mean_difference, odds_ratio]}}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true, shown_if: {field: estimate, is_one_of: [two_groups, mean_difference, odds_ratio]}}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true, shown_if: {field: estimate, is_one_of: [two_groups, mean_difference, odds_ratio]}}
          - {id: T_label, label: "What the two measurements are", help: "For example, time.", type: text, path: variables.X.label, required: true, shown_if: {field: estimate, is: paired}}
          - {id: T_level1, label: "First measurement", type: text, path: variables.X.levels.1, required: true, shown_if: {field: estimate, is: paired}}
          - {id: T_level2, label: "Second measurement", type: text, path: variables.X.levels.2, required: true, shown_if: {field: estimate, is: paired}}
          - {id: C_label, label: "First variable", type: text, path: variables.X.label, required: true, shown_if: {field: estimate, is: correlation}}
          - {id: P_label, label: "The predictor (X)", type: text, path: variables.X.label, required: true, shown_if: {field: estimate, is: regression_coefficient}}
          - {id: Y_label, label: "The outcome", help: "For a correlation, the second variable; for a proportion, what is counted.", type: text, path: variables.Y.label, required: true}
      - input: "The value you expect"
        fields:
          - {id: d, writeup_label: "expected d", label: "The Cohen's d you expect (group 2 minus group 1, in SDs)", type: number, path: population.d, effect: true,
             shown_if: {field: estimate, is: two_groups}, help: "The interval's width depends a little on it; if unsure, a larger value gives a slightly larger sample size."}
          - {id: dz, writeup_label: "expected d_z", label: "Expected d_z", help: "The mean difference divided by the SD of the differences.", type: number, path: population.dz, effect: true,
             shown_if: {field: estimate, is: paired}}
          - {id: sm, writeup_label: "expected standardised mean", label: "The standardised mean you expect: (mean minus the fixed value) / SD", type: number, path: population.d, effect: true,
             shown_if: {field: estimate, is: one_group}}
          - {id: r, writeup_label: "expected correlation", label: "The correlation you expect", type: number, path: population.r, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: estimate, is: correlation}, help: "Intervals are narrower for larger correlations, so a smaller guess is the cautious one."}
          - {id: p, writeup_label: "expected proportion", label: "The proportion you expect", type: number, path: population.p, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: estimate, is: proportion}, help: "Intervals are widest at 0.5, so 0.5 is the cautious guess if you have none. For example 0.3 for 30%."}
          - {id: mean_difference, writeup_label: "expected mean difference", label: "Expected difference between the means", help: "Group 2 minus group 1, in the outcome's units.", type: number, path: population.difference, effect: true,
             shown_if: {field: estimate, is: mean_difference}}
          - {id: mean_sd, writeup_label: "SD within each group", label: "The outcome's SD within each group (the same in both)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: estimate, is: mean_difference}}
          - {id: or_p1, writeup_label: "expected proportion in group 1", label: "The proportion of 'yes' you expect in group 1", type: number, path: population.p1, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: estimate, is: odds_ratio}}
          - {id: or_p2, writeup_label: "expected proportion in group 2", label: "Expected proportion of 'yes' in group 2", help: "The odds ratio is group 2's odds over group 1's.", type: number, path: population.p2, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: estimate, is: odds_ratio}}
          - {id: icc, writeup_label: "expected ICC", label: "The ICC you expect", type: number, path: population.icc, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: estimate, is: icc}}
          - {id: icc_raters, in_effect_text: true, writeup_label: "ratings of each person", label: "Ratings of each person (raters, or occasions)", type: number, path: population.raters, required: true, min: 2, integer: true,
             shown_if: {field: estimate, is: icc}}
          - {id: reg_b, writeup_label: "expected standardised coefficient", label: "The standardised coefficient you expect for X", type: number, path: population.b, effect: true,
             shown_if: {field: estimate, is: regression_coefficient}}
          - {id: reg_r2, writeup_label: "R-squared of the full model", label: "R-squared of the full model, all predictors", help: "Between 0 and 1.", type: number, path: population.r2, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: estimate, is: regression_coefficient}}
          - {id: reg_r2_predictor, writeup_label: "R-squared of X on the other predictors", label: "R-squared of X on the other predictors (0 if none, or uncorrelated)", type: number, path: population.r2_predictor, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: estimate, is: regression_coefficient}}
          - {id: reg_predictors, label: "Predictors in the model, X included", type: number, path: population.predictors, required: true, min: 1, integer: true,
             shown_if: {field: estimate, is: regression_coefficient}}
      - input: "The kind of interval"
        fields:
          - {id: r_method, label: "Which correlation", type: select, path: target_test.method, required: true, shown_if: {field: estimate, is: correlation},
             choices: {pearson: "Pearson's r", spearman: "Spearman's rho", kendall: "Kendall's tau"}, default: pearson, default_source: "presize's default (prec_cor(method = \"pearson\"), presize 0.3.11)"}
          - {id: p_method, label: "Which interval for the proportion", type: select, path: target_test.method, required: true, shown_if: {field: estimate, is: proportion},
             choices: {wilson: "Wilson's interval", agresti_coull: "Agresti-Coull", exact: "Exact (Clopper-Pearson)", wald: "Wald (the textbook formula)"},
             default: wilson, default_source: "presize's default (prec_prop(method = \"wilson\"), presize 0.3.11)",
             help: "presize's help suggests Wilson's interval for fewer than 40 people and Agresti-Coull for more, and offers the Wald interval only because it is widely used."}
          - {id: or_method, label: "Which interval for the odds ratio", type: select, path: target_test.method, required: true, shown_if: {field: estimate, is: odds_ratio},
             choices: {indip_smooth: "Independence-smoothed logit (presize's default)", gart: "Gart's adjusted logit", woolf: "Woolf's logit"},
             default: indip_smooth, default_source: "presize's default (prec_or(), presize 0.3.11)"}

  # Prediction model development (15 November 2026): the minimum sample
  # size for developing a multivariable prediction model, by the criteria of
  # Riley and colleagues, from pmsampsize's pmsampsize(). No power: the
  # answer is the largest of the criteria's sample sizes. The engine's
  # design "prediction_model", goal type "criteria".
  E77:
    methods_name: "the minimum sample size for developing or validating a prediction model (the criteria of Riley and colleagues)"
    tool: pmsampsize
    criteria: true
    base: {spec_version: "0.1", design: prediction_model, template: development, variables: {},
           target_test: {effect: development_criteria, method: riley_criteria}, options: {method: exact}}
    groups:
      - input: "The outcome the model predicts"
        fields:
          - {id: purpose, label: "Are you developing a new model, or validating an existing one?", type: select, path: template, required: true,
             choices: {development: "Developing a new model: estimating its predictor effects from this study's data",
                       validation: "Validating an existing model: testing how well a published or already developed model predicts in new people"},
             default: development, default_source: "powerkit's first choice; pick what your study will do",
             sets: {validation: [{path: variables.Y.type, value: binary}]},
             help: "Validating an existing model (external validation) is planned for a yes/no outcome, with pmvalsampsize; developing a new one, for any of the three kinds of outcome, with pmsampsize."}
          - {id: outcome, label: "What kind of outcome does the model predict?", type: select, path: variables.Y.type, required: true,
             choices: {binary: "Yes or no (for example, whether someone relapses within a year): a logistic model",
                       continuous: "A score (for example, a depression score): a linear model",
                       time_to_event: "The time until an event (for example, time to relapse, with some people not followed up to it): a Cox model"},
             default: binary, default_source: "powerkit's first choice; pick the kind of outcome your model predicts",
             shown_if: {field: purpose, is: development},
             sets: {continuous: [{path: population.metric, value: r2}]}}
          - {id: Y_label, label: "The outcome", help: "For example, relapse within a year.", type: text, path: variables.Y.label, required: true}
          - {id: parameters, writeup_label: "candidate predictor parameters", label: "Number of candidate predictor parameters", type: number, path: population.parameters, required: true, min: 1, integer: true,
             shown_if: {field: purpose, is: development},
             help: "Every parameter the model could estimate, counted before any selection: a predictor with k categories counts k - 1, and a curve (a spline or a squared term) counts each of its terms. Count all the candidates, not only the ones you expect to keep."}
      - input: "How well you expect the model to perform"
        fields:
          - {id: bin_metric, label: "How you know how well a model like this performs", type: select, path: population.metric, required: true,
             shown_if: [{field: purpose, is: development}, {field: outcome, is: binary}],
             choices: {c_statistic: "A C-statistic (area under the ROC curve) reported for a similar model",
                       cox_snell_r2: "A Cox-Snell R-squared reported for a similar model",
                       nagelkerke_r2: "A Nagelkerke R-squared reported for a similar model"},
             default: c_statistic, default_source: "the measure papers most often report for a model of a yes/no outcome",
             help: "pmsampsize needs the model's Cox-Snell R-squared; a C-statistic or a Nagelkerke R-squared is converted to it with the outcome's proportion."}
          - {id: surv_metric, label: "How you know how well a model like this performs", type: select, path: population.metric, required: true,
             shown_if: [{field: purpose, is: development}, {field: outcome, is: time_to_event}],
             choices: {cox_snell_r2: "A Cox-Snell R-squared reported for a similar model", nagelkerke_r2: "A Nagelkerke R-squared reported for a similar model"},
             default: cox_snell_r2, default_source: "the measure pmsampsize works with for a time-to-event outcome"}
          - {id: c_statistic, writeup_label: "anticipated C-statistic", label: "The C-statistic you expect", type: number, path: population.c_statistic, effect: true, min_exclusive: 0.5, max_exclusive: 1,
             shown_if: [{any: [[{field: purpose, is: development}, {field: outcome, is: binary}, {field: bin_metric, is: c_statistic}], [{field: purpose, is: validation}]]}],
             help: "For a new model, ideally one corrected for optimism, from a previous model of the same outcome in a similar population; for an existing model, the C-statistic you expect it to reach in the new population. A lower value is the cautious choice: it gives a larger sample size. Between 0.5 and 1."}
          - {id: cox_snell_r2, writeup_label: "anticipated Cox-Snell R-squared", label: "The Cox-Snell R-squared you expect", type: number, path: population.cox_snell_r2, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{field: purpose, is: development}, {any: [[{field: outcome, is: binary}, {field: bin_metric, is: cox_snell_r2}], [{field: outcome, is: time_to_event}, {field: surv_metric, is: cox_snell_r2}]]}],
             help: "Ideally the adjusted (optimism-corrected) value from a previous model. A smaller value is the cautious choice. Between 0 and 1."}
          - {id: nagelkerke_r2, writeup_label: "anticipated Nagelkerke R-squared", label: "The Nagelkerke R-squared you expect", help: "Between 0 and 1.", type: number, path: population.nagelkerke_r2, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{field: purpose, is: development}, {any: [[{field: outcome, is: binary}, {field: bin_metric, is: nagelkerke_r2}], [{field: outcome, is: time_to_event}, {field: surv_metric, is: nagelkerke_r2}]]}]}
          - {id: r2, writeup_label: "anticipated R-squared", label: "The R-squared you expect", type: number, path: population.r2, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{field: purpose, is: development}, {field: outcome, is: continuous}],
             help: "The adjusted R-squared of a previous model of the same outcome, or the R-squared it reached when tested in new data. A smaller value is the cautious choice. Between 0 and 1."}
      - input: "The outcome in the population"
        fields:
          - {id: prevalence, writeup_label: "proportion with the outcome", label: "The proportion you expect to have the outcome", help: "For example 0.2 for 20%.", type: number, path: population.prevalence, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{any: [[{field: purpose, is: development}, {field: outcome, is: binary}], [{field: purpose, is: validation}]]}]}
          - {id: mean, writeup_label: "mean outcome", label: "The outcome's mean in the population", type: number, path: population.mean, required: true,
             shown_if: [{field: purpose, is: development}, {field: outcome, is: continuous}]}
          - {id: sd, writeup_label: "outcome SD", label: "The outcome's SD in the population", type: number, path: population.sd, required: true, min_exclusive: 0,
             shown_if: [{field: purpose, is: development}, {field: outcome, is: continuous}]}
          - {id: rate, writeup_label: "event rate", label: "Overall event rate", help: "Events per person per unit of time, for example 0.065 a year.", type: number, path: population.rate, required: true, min_exclusive: 0,
             shown_if: [{field: purpose, is: development}, {field: outcome, is: time_to_event}]}
          - {id: timepoint, writeup_label: "time point", label: "The time point to predict for", help: "In the same unit as the rate, for example 2 years.", type: number, path: population.timepoint, required: true, min_exclusive: 0,
             shown_if: [{field: purpose, is: development}, {field: outcome, is: time_to_event}]}
          - {id: mean_follow_up, writeup_label: "mean follow-up", label: "The mean follow-up you expect (in the same unit)", type: number, path: population.mean_follow_up, required: true, min_exclusive: 0,
             shown_if: [{field: purpose, is: development}, {field: outcome, is: time_to_event}]}

      - input: "The existing model's predictions in the new population"
        shown_if: {field: purpose, is: validation}
        fields:
          - {id: lp_distribution, label: "How you know the spread of the model's predictions", type: select, path: population.lp_distribution, required: true,
             shown_if: {field: purpose, is: validation},
             choices: {normal: "The mean and SD of its linear predictor (the predicted log-odds), for example from the development paper",
                       beta: "A beta distribution of its predicted risks, given by its two shape parameters"},
             default: normal, default_source: "the form Riley et al. (2021) use in their example; pick the one you can fill in",
             help: "pmvalsampsize simulates the model's predictions from this to work out how precisely the calibration slope will be estimated."}
          - {id: lp_mean, writeup_label: "mean of the linear predictor", label: "Mean of the linear predictor (log-odds)", type: number, path: population.lp_mean, required: true,
             shown_if: [{field: purpose, is: validation}, {field: lp_distribution, is: normal}],
             help: "Negative when the outcome is uncommon: a mean of -1.4 is a typical predicted risk of about 20%."}
          - {id: lp_sd, writeup_label: "SD of the linear predictor", label: "SD of the linear predictor", type: number, path: population.lp_sd, required: true, min_exclusive: 0,
             shown_if: [{field: purpose, is: validation}, {field: lp_distribution, is: normal}]}
          - {id: beta_a, writeup_label: "first shape parameter", label: "First shape parameter of the predicted risks' beta distribution", type: number, path: population.beta_a, required: true, min_exclusive: 0,
             shown_if: [{field: purpose, is: validation}, {field: lp_distribution, is: beta}]}
          - {id: beta_b, writeup_label: "second shape parameter", label: "Second shape parameter of the predicted risks' beta distribution", type: number, path: population.beta_b, required: true, min_exclusive: 0,
             shown_if: [{field: purpose, is: validation}, {field: lp_distribution, is: beta}]}
          - {id: oe, writeup_label: "anticipated O/E ratio", label: "Expected observed/expected ratio", help: "Optional: 1 if left empty, meaning the model is well calibrated in the large.", type: number, path: population.oe, optional: true, min_exclusive: 0,
             shown_if: {field: purpose, is: validation}}
          - {id: calibration_slope, writeup_label: "anticipated calibration slope", label: "The calibration slope you expect", help: "1 if left empty. pmvalsampsize reports it with the result, but works out the slope's precision for a well-calibrated model, so this value doesn't change the sample size.", type: number, path: population.calibration_slope, optional: true, min_exclusive: 0,
             shown_if: {field: purpose, is: validation}}
          - {id: threshold, writeup_label: "risk threshold", label: "Risk threshold for decisions", type: number, path: population.threshold, optional: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: purpose, is: validation},
             help: "Optional: gives a precise net benefit too, for example 0.1. The predicted risk above which people would be treated or referred. Leave it empty to plan for calibration and discrimination only."}
          - {id: sensitivity, writeup_label: "sensitivity at the threshold", label: "The sensitivity you expect at that threshold (optional)", type: number, path: population.sensitivity, optional: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: purpose, is: validation},
             help: "Give both sensitivity and specificity, or neither: pmvalsampsize then estimates them from the model's predictions."}
          - {id: specificity, writeup_label: "specificity at the threshold", label: "The specificity you expect at that threshold (optional)", type: number, path: population.specificity, optional: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: purpose, is: validation}}
  # Trend tests (1 November 2026), simulated with Spower by powerkit's own
  # experiments: the Jonckheere-Terpstra test of a trend in scores across
  # groups in order (PMCMRplus's jonckheereTest()), on the one-way
  # between-participants template, and the Cochran-Armitage test of a trend
  # in proportions (stats::prop.trend.test()).
  E64:
    methods_name: "a Jonckheere-Terpstra test of a trend across groups in order"
    tool: Spower
    sensitivity: true
    directional: true
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_between,
           variables: {A: {type: between_factor}, "Y": {type: continuous}},
           target_test: {effect: main_effect_A, method: jonckheere_terpstra}}
    groups:
      - input: "Names of the groups, in order, and the outcome"
        fields:
          - {id: A_label, label: "What the groups are", help: "For example, dose.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (three or more), in their order, separated by commas", type: levels, path: variables.A.levels, required: true,
             help: "The order matters: the test looks for scores that rise (or fall) from the first group to the last. A one-sided test predicting a positive effect says they rise."}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected group means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "group means", label: "Means: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every group; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The shape of the scores"
        fields:
          - {id: score_shape, label: "The shape of the scores in each group", type: select, path: population.score_shape, required: true,
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, as Spower's rank tests draw by default (p_kruskal.test(), Spower 0.7)",
             help: "Every group has the same shape; the groups differ only by a shift (their means). A rank test's power depends on this shape."}
      - input: "The relative size of each group"
        fields:
          - {id: group_ratio, writeup_label: "relative group sizes", label: "Relative group sizes", type: numbers, per_levels: A_levels, path: options.group_ratio, optional: true,
             help: "One whole number for each group, in the same order. Optional: equal groups if left empty. For example 1, 1, 2 puts twice as many people in the last group. The total sample size is split in this ratio."}

  E66:
    methods_name: "a Cochran-Armitage test of a trend in proportions"
    tool: Spower
    sensitivity: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: proportion_trend,
           variables: {X: {type: categorical}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: trend, method: cochran_armitage}}
    groups:
      - input: "Names of the groups, in order, and the outcome"
        fields:
          - {id: X_label, label: "What the groups are", help: "For example, dose.", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "The groups' names (three or more), in their order, separated by commas", type: levels, path: variables.X.levels, required: true,
             help: "The order matters: the test looks for a proportion that rises (or falls) from the first group to the last. A one-sided test predicting a positive effect says it rises with the scores."}
          - {id: Y_label, label: "Yes/no outcome", help: "For example, recovered.", type: text, path: variables.Y.label, required: true}
      - input: "The expected proportion of 'yes' in each group"
        fields:
          - {id: proportions, in_effect_text: true, writeup_label: "proportions", label: "Proportion of 'yes' in each group", help: "From 0 to 1, one for each group, in the same order, separated by commas.", type: numbers, per_levels: X_levels, path: population.proportions, effect: true}
      - input: "Each group's score in the trend"
        fields:
          - {id: scores, writeup_label: "scores", label: "Score for each group", type: numbers, per_levels: X_levels, path: population.scores, optional: true,
             help: "One for each group, in the same order. Optional: 1, 2, 3, ... if left empty. The values the trend runs along, such as the doses (0, 10, 20, 40). Equally spaced scores suit groups one step apart."}
      - input: "The relative size of each group"
        fields:
          - {id: group_ratio, writeup_label: "relative group sizes", label: "Relative group sizes", type: numbers, per_levels: X_levels, path: options.group_ratio, optional: true,
             help: "One whole number for each group, in the same order. Optional: equal groups if left empty. For example 2, 1, 1, 2 puts twice as many people in the first and last groups. The total sample size is split in this ratio."}
