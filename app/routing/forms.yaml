# Input screens for the end points powerkit runs (E1-E14).
#
# Routing prototype, phase 5 groundwork: a screen collects the values listed
# under "What you would enter" on the card, builds a design spec and checks
# it with the engine's validate_spec(). Nothing is calculated.
#
# Each form has `groups`, one per line of the card's "What you would enter"
# (`input` is that line, copied from tree.yaml; a test checks they match),
# plus the shared closing fields (goal, alpha, power, direction, effect-size
# justification, attrition) that R/forms.R adds.
#
# Field keys:
#   id       input id (prefixed "f_" in the app)
#   label    the field's own label
#   type     text | number | select | levels (comma-separated names) |
#            numbers (comma-separated numbers on one line; with per_levels,
#            one per name in that levels field) |
#            table (rows of comma-separated numbers)
#   path     where the value goes in the spec ("a.b.c"; levels.1 = first level)
#   effect   true for population values (effect sizes, SDs, correlations):
#            they start empty and are required (setting effect_size_inputs)
#   required true if the screen can't build a spec without it
#   optional true if it may be left empty (then the engine's default applies)
#   default  a starting value for a non-effect field, with default_source
#            saying whose default it is
#   min, max limits checked by the screen before the engine sees the spec
#   shown_if {field: <id>, is: <value>} or {field: <id>, is_not: <value>}:
#            the field is shown, checked and put in the spec only when the
#            other field's choice matches (E7's per-cell SDs)
#   sets     for a select: {choice: [{path, value}]}, further spec values
#            that follow from the choice (E24's question sets the effect)

# Defaults of the tool each end point wraps, read from the installed
# packages' function signatures on 17 October 2026.
tool_defaults:
  pwr:
    alpha: 0.05
    alpha_source: "pwr's default (pwr.t.test(sig.level = 0.05), pwr 1.3-0)"
    power_source: "pwr has no default target power (pwr.t.test(power = NULL)); enter one"
    alternative_source: "pwr's default (two-sided: pwr.t.test(alternative = \"two.sided\"), pwr 1.3-0)"
  Spower:
    alpha: 0.05
    alpha_source: "Spower's default (Spower(sig.level = 0.05), Spower 0.7)"
    power_source: "Spower has no default target power (Spower(power = NA)); enter one"
    alternative_source: "Spower's default (two-sided: two.tailed = TRUE, alternative = NULL, Spower 0.7)"
  Superpower:
    alpha: 0.05
    alpha_source: "Superpower's default (Superpower_options(\"alpha_level\") is 0.05, Superpower 0.2.4.1)"
    power_source: "Superpower reports power and has no default target power; enter one"
  InteractionPoweR:
    alpha: 0.05
    alpha_source: "InteractionPoweR's default (power_interaction(alpha = 0.05), InteractionPoweR 0.2.4)"
    power_source: "InteractionPoweR has no default target power (power_estimate() needs power_target); enter one"
  pwrss:
    alpha: 0.05
    alpha_source: "pwrss's default (power.f.regression(alpha = 0.05), power.exact.oneprop(alpha = 0.05), power.exact.mcnemar(alpha = 0.05), pwrss 1.3.3)"
    power_source: "pwrss has no default target power (power = NULL); enter one"
    alternative_source: "pwrss's default (two-sided: alternative = \"two.sided\", pwrss 1.3.3)"
  simr:
    alpha: 0.05
    alpha_source: "simr's default (powerSim(alpha = 0.05), simr 1.0.11)"
    power_source: "simr reports power and has no default target power; enter one"
  TOSTER:
    alpha: 0.05
    alpha_source: "TOSTER's default for each one-sided test (t_TOST(alpha = 0.05), TOSTER 0.8.6; power_t_TOST() has none)"
    power_source: "TOSTER has no default target power (power_t_TOST(power = NULL)); enter one"
  powertools:
    alpha: 0.05
    alpha_source: "powertools' default (crt.parallel.cont(alpha = 0.05), powertools 1.0.0)"
    power_source: "powertools has no default target power (crt.parallel.cont(power = NULL)); enter one"
    alternative_source: "powertools' default (two-sided: crt.parallel.cont(sides = 2), powertools 1.0.0)"
  semPower:
    alpha: 0.05
    alpha_source: "the usual 5% level; semPower has no default (semPower.postHoc(alpha) must be given, semPower 2.2.0)"
    power_source: "semPower has no default target power (semPower.aPriori(power = NULL)); enter one"
  metapower:
    alpha: 0.05
    alpha_source: "metapower's default (mpower(p = 0.05), metapower 0.2.2)"
    power_source: "metapower reports power and has no default target power; enter one"
    alternative_source: "metapower's default (two-sided: mpower(test_type = \"two-tailed\"), metapower 0.2.2)"
  formula:
    alpha: 0.05
    alpha_source: "the usual 5% level, as in the G*Power 3.1 manual's examples; powerkit's formulas have no default of their own"
    power_source: "enter a target power: the formula has no default"
    alternative_source: "two-sided, as R's var.test() is by default (alternative = \"two.sided\")"
  power4mome:
    alpha: 0.05
    alpha_source: "power4mome's default (95% confidence intervals: n_region_from_power(ci_level = 0.95), power4mome 0.2.1)"
    power: 0.8
    power_source: "power4mome's default (n_region_from_power(target_power = 0.8), power4mome 0.2.1)"

# The seed a calculation uses unless the user changes it (judgement-calls.md
# B15): fixed, so the same answers always give the same result. It is shown
# on the input screen and the result screen, recorded in the result and
# written into the exported R script.
default_seed: 1

# How E1-E6 are calculated (docs/decisions.md, 17 October 2026): pwr's
# formula by default; Spower simulation if the user expects their data
# won't meet the test's assumptions. Welch's t-test (E2) has no pwr formula:
# it is simulated by default, with pwrss's formula on request (E2's
# welch_method).
# A form's `method_extra` fields are shown with this choice (E5: the z test,
# as in G*Power, or pwr's Cohen's h; Departure 11).
basic_method_field: {id: calc_method, label: "How power is worked out", type: select, path: options.method, optional: true,
  choices: {exact: "Formula (pwr; base R or pwrss for two proportions): assumes the test's assumptions hold", simulation: "Simulation (Spower): if you expect your data won't meet the test's assumptions"},
  default: exact, default_source: "powerkit's default for basic tests (docs/decisions.md, 17 October 2026)"}

# Designs the engine can compute that the app can't reach yet: a missing
# card and input screen, not a missing calculation. The queue to clear them
# is in docs/adding-a-test.md. test-repo-consistency.R refuses an engine
# template that is neither named by a card nor listed here, so a design
# can't go quietly unreachable again; delete an entry when its card and
# input screen land.
engine_only: {}  # none waiting at the moment

# End points whose calculation runs on the input screen (phase 5). E1-E8
# run in seconds on one core (measured 17 October 2026 with the example
# values and 1,000 replications: 1 to 19 seconds, the longest a
# correlation's sample size). E9 runs in the background with a progress bar
# and a Cancel button (below). E10-E14 run as set under `simulations`.
calculates: [E1, E2, E3, E4, E5, E6, E7, E8, E9, E18, E19, E20, E21, E23, E24, E25, E26, E27, E28, E34, E36, E37, E48, E49, E50, E51, E52, E53, E54, E55, E56, E57, E31, E29, E47, E22, E15, E59, E60, E61]

# End points that run in a separate R process, with an estimated progress
# bar and a Cancel button: the usual run time in seconds for each goal,
# measured with the example values and 1,000 replications on one core
# (docs/phase5-simulations.md, table 1). The bar is estimated from these.
background:
  E9: {power: 5, sample_size: 80, sensitivity: 2}
  E15: {power: 5, sample_size: 80}
  E59: {power: 4, sample_size: 30}
  E60: {power: 4, sample_size: 30}
# At most this many background calculations (E9 and E10-E14's preview and
# full run) at once, across everyone using the app; others are asked to try
# again shortly (R/results.R, background_limit()). Two suits a server with
# two cores; POWERKIT_BACKGROUND_LIMIT overrides it.
background_limit: 2

# Mediation and moderated mediation (E10-E14; the maintainer's decision of
# 17 October 2026, docs/phase5-simulations.md and docs/decisions.md):
# for power, first a rough preview with `preview_nrep` replications, in a
# separate R process, shown as a range (a required N has no preview: with
# 100 replications per sample size the search is too slow and too noisy;
# only goals listed under `preview` get one); then, for the goals under
# `full_run`, the full
# analysis at the app's defaults in a separate process with a progress bar
# and Cancel; for every other goal, an R script to run the full analysis
# on the user's own computer. `preview` and `full` are the usual run times
# in seconds on one core (the bar is estimated from them); `script` is the
# expected run time in words. Measured or estimated as noted in
# docs/phase5-simulations.md.
simulations:
  preview_nrep: 100
  endpoints:
    E10:
      full_run: [power]
      preview: {power: 50}
      full: {power: 734}
      script: {sample_size: "about 1 to 3 hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E16:
      full_run: [power]
      preview: {power: 50}
      full: {power: 734}
      script: {sample_size: "about 1 to 3 hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E33:
      full_run: [power]
      preview: {power: 35}
      full: {power: 350}
      script: {sample_size: "about 30 minutes to 2 hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E62:
      full_run: [power]
      preview: {power: 30}
      full: {power: 300}
      script: {sample_size: "about 30 minutes to 2 hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E11:
      full_run: [power]
      preview: {power: 50}
      full: {power: 780}
      script: {sample_size: "about 1 to 3 hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E12:
      full_run: [power]
      preview: {power: 60}
      full: {power: 890}
      script: {sample_size: "about 1 to 3 hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E13:
      full_run: []
      preview: {power: 165}
      script: {power: "about 25 minutes on one core (an estimate)", sample_size: "several hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E14:
      full_run: []
      preview: {power: 170}
      script: {power: "about 25 minutes on one core (an estimate)", sample_size: "several hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E40:
      full_run: []
      preview: {power: 200}
      script: {power: "about 30 minutes on one core (an estimate: two mediators take a little longer than one)", sample_size: "several hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}

# Whole-study simulation (experimental; R/whole-study.R, docs/conventions.md
# Departure 13): the choices of how many simulated studies, and the usual
# run time on one core, from seconds per simulated study for each analysis
# (each is fitted to every simulated study) plus a fixed overhead for the
# check run. Measured on the development machine; see docs/status.md.
whole_study:
  # The app runs a quick look; the full run and the sample size search run
  # on the user's computer, from the script (export_whole_study_script()).
  quick_nrep: 200
  full_nrep: 1000
  # A sample size search simulates about this many times the replications
  # of one full run (short bracketing runs, then 7 to 13 sizes of nrep
  # each, then the full run at the n found).
  search_runs: [9, 15]
  target_powers: [0.8, 0.85, 0.9, 0.95]
  seconds_per_replication: {x_y: 0.02, interaction: 0.03, indirect: 0.6, index_of_mome: 1.6}
  overhead_seconds: 15

# Departures from the wrapped tool's conventions, shown on the result screen
# (CLAUDE.md). Each condenses its entry in docs/conventions.md, "Departures".
departures:
  "1": "Required N for a 2 x 2 interaction: powerkit gives the smallest N at which the exact F test reaches the target power. Sommet et al.'s (2023) z approximation gives slightly smaller numbers: 4 participants fewer (one per cell) in their two published examples."
  "2": "Mixed design: powerkit uses Superpower's ANOVA_exact(), which reproduces the G*Power values Superpower's vignette reports, not ANOVA_exact2(). The two differ slightly (91.2% vs 90.5% in the vignette's example)."
  "3": "Superpower's exact dataset is built under this run's seed, so the result is identical each time with the same seed. The size of this difference is about 1e-15 in power, with no practical effect."
  "9": "Calculated with a formula (pwr's, or base R's power.prop.test() for two proportions), not Spower's simulation (powerkit's earlier default): exact for the t-tests and the chi-square test, and approximate for a correlation (Fisher's z) and two proportions (a normal approximation), with no simulation noise. In the examples checked, the two differ by less than 0.01 in power, within the simulation's own noise."
  "10": "Correlation: pwr's formula uses Fisher's z, an approximation; G*Power uses the exact distribution of r. For r = .3 to .5 and N = 20 to 100 they differ by at most 0.004 in power, and the required N by at most 1 participant (85 rather than 84 for r = .3 and 80% power)."
  "11": "Two proportions: the z test as G*Power runs it (pooled variance under the null, no continuity correction, both tails counted), by base R's power.prop.test() with strict = TRUE; it matches G*Power to seven decimals. Its own default, strict = FALSE, counts one tail only: power .2340 rather than .2345 with proportions .10 and .25 and 20 per group. Unequal groups use pwrss's z test, which matches G*Power's power; powerkit keeps the groups in the exact ratio you give, so its required N can be a few higher (for 95% power with group 2 twice the size of group 1, 372 rather than G*Power's 370, whose groups of 123 and 247 fall just short of 95%)."
  "12": "Two dependent correlations: Steiger's z test as G*Power computes it, with the null hypothesis's correlation in the formula for how the two correlations vary together; pwrss, the package behind it, uses the average of the two correlations by default. powerkit reproduces the G*Power manual's two examples (144 and 886 people); pwrss's default would give 139 and 875, about 1 to 4% fewer."
  "13": "Whole-study simulation (experimental): the established tools calculate each analysis on its own, from its own inputs, and the chance that several analyses all succeed has to be worked out from their separate powers, as if they were unrelated. Here one population model generates every simulated study and each analysis is fitted to the same data, so the analyses' inputs can't contradict each other and the joint chance is counted directly. Each analysis's own power agrees with its separate calculation from the values the population implies, within simulation error in powerkit's checks; where the population has a term an analysis leaves out (for example, an interaction when testing the correlation of X and Y), the simulation includes its effect and the separate calculation doesn't."
  "14": "Smallest detectable effect when only one condition is in groups: powerkit finds the d at which powertools' power formula (irgtt.cont(), a t test) reaches the target power, as it finds sample sizes. powertools' own answer for d uses a normal approximation and falls short: at 20 groups of 8 and 160 people treated individually, it gives d = 0.340, which has 77% power rather than 80%; powerkit gives 0.352."
  "18": "Meta-analysis: under the random-effects model powerkit plans for the Hartung-Knapp test unless you choose otherwise, because it keeps the chance of a false positive closer to alpha than the z test, especially with few studies (IntHout, Ioannidis & Borm, 2014); metapower plans for the z test. No package has a formula for its power, so it is simulated (metafor's rma(test = \"knha\"), with Spower). It gives less power: for d = 0.15 in ten studies of 40 with I-squared 0.5, about 16.5% against 21.4% with the z test."
  "17": "Pairwise comparisons: powerkit adjusts the p-values for the number of comparisons by Holm's method unless you choose otherwise; Superpower's ANOVA_power() adjusts none by default. Adjusting costs power: for None against Praise in powerkit's example (means 10, 11 and 13, SD 6, 30 per group), 31.2% with Holm's adjustment, 30.1% with Bonferroni's and 47.8% with none."
  "16": "Mixed model: the condition is tested with Satterthwaite's t test (lmerTest), not simr's default z test, which treats the t statistic as normal and so rejects too often in designs with few participants or items. In powerkit's example (40 items), the z test gives 42.0% power at 40 participants where Satterthwaite's gives 39.6% (27.7% and 25.0% at 20 participants)."
  "15": "Bayes factor t-tests: powerkit plans for exactly the effect you entered unless you say how unsure you are about it (a design prior SD of 0), as a usual power analysis does. bfpwr's own default spreads the true effect as widely as the analysis prior (SD 0.707), which needs far more people: for d = 0.5 and BF10 of at least 10, 120 per group give 80% with powerkit's default and 67% with bfpwr's, which needs 372 per group."
  "5": "No continuity correction, as in G*Power; Spower applies Yates' correction by default. In an example with proportions .50 and .65 and 170 per group, power is .818 without the correction and .789 with it."
  "6": "Mediation is fitted with lavaan (maximum likelihood), as power4mome does, not by PROCESS's ordinary least squares. The estimates are identical; the standard errors are slightly smaller (at N = 50, 2% for the a path and 3% for b and c'; at N = 200, under 1%)."
  "7": "Parallel mediators: powerkit lets their residuals correlate, as PROCESS's separate regressions do; lavaan and power4mome fix that correlation at 0 by default. With a residual correlation of 0.4 and N = 200, fixing it at 0 would understate the standard errors of the mediator-to-outcome paths by about 10% and so overstate power."
  "8": "Boos and Zhang's (2000) method is switched off: every simulated sample is tested with its confidence interval. power4mome switches the method on for some numbers of Monte Carlo draws (39, 79, ..., 359). In powerkit's runs this makes no difference to power."

# Departures that leave the answer practically unchanged (no difference,
# or under 0.01 in power, and powerkit matches G*Power) are folded under
# "How it was calculated"; the others stay in view, with a pointer from
# the answer (docs/decisions.md, "Mentioning other tools", 28 October 2026).
# The methods paragraph states every departure.
departures_folded: ["2", "3", "8", "9", "11"]

# Known differences between established tools, shown on the result screen
# (CLAUDE.md). Each condenses its entry in docs/conventions.md, "Known
# differences". They are not departures: powerkit follows one established
# tool, and another gives a different answer.
known_differences:
  "1": "Regression interactions: powerkit simulates power, drawing the predictors afresh in each sample (InteractionPoweR's power_interaction()). Fixed-model calculations, such as G*Power's and InteractionPoweR's power_interaction_r2(), give slightly higher power: up to about 1.4 points, so the N here may be about 3% larger than G*Power's."
  "1 sensitivity": "Regression interactions: the smallest detectable effect comes from InteractionPoweR's fixed-model formula, power_interaction_r2(), as G*Power's would, not from simulation. Fixed-model power is slightly higher than simulated power (up to about 1.4 points), so the smallest effect you could detect may be slightly larger than shown. Sample size and power for this design are simulated."
  "2": "One proportion, McNemar's test and Fisher's exact test are exact tests of counts: their power goes up and down as N grows, so a slightly larger N can have a little less power. powerkit reports the smallest N that reaches the target, as G*Power does; pwrss's own sample-size answer is a little larger (92 rather than 90 for a proportion of .65 against .50, two-sided; 130 rather than 129 for McNemar's test with .25 and .10, G*Power's exact option). Fisher's exact test hasn't been compared with G*Power yet."
  "3": "Logistic regression with other predictors: when this predictor overlaps with the others (R-squared above 0), the G*Power manual's example reports a slightly larger sample size than powerkit gives for the same inputs (395 against 375 at an R-squared of 0.1). powerkit applies the adjustment as the manual's formulas describe it; why the example differs hasn't been settled, so G*Power may ask for a few per cent more people. With no overlap (R-squared 0) the two agree."
  "4": "Variance tests (retired 31 October 2026): powerkit simulated power with Spower's p_var.test() while G*Power computes these tests exactly. powerkit now computes them exactly too; this note is kept for results saved before then."
  "5": "Rank tests: powerkit simulates the rank test itself (Spower's p_wilcox.test() or p_kruskal.test()), drawing scores of the shape you chose. G*Power's Wilcoxon and Mann-Whitney tests instead adjust the t-test's answer by an efficiency factor for the shape, so the two can differ; by how much hasn't been measured yet. With normal scores a rank test needs slightly more people than the t-test, and with skewed or heavy-tailed scores it can need fewer."
  "6": "Bayes factor t-tests: bfpwr calculates the chance of strong evidence by formula, treating the effect estimate as normally distributed, which is close in larger samples but gives a little less than simulating the Bayes factor itself (as BFDA does) in small ones: for a one-sample test with d = 0.4 and BF10 of at least 10, 7.6% against about 11% with 20 people, and 28.3% against about 30% with 40."
  "7": "Moderation by its R-squared change: power comes from the fixed-model formula G*Power uses for an R-squared increase (pwrss). InteractionPoweR's own formula gives slightly less (it divides by 1 minus the R-squared without the interaction, and uses N - 3): 58.3% against 59.9% at N = 200 for an R-squared change of .0225. Giving the correlations instead runs powerkit's simulation, slightly lower again."
  "8": "MANOVA with three or more groups: powerkit simulates power (Spower), because no package it builds on has a formula for it; G*Power computes Pillai's trace with an F approximation. How far G*Power's approximation sits from the simulated power hasn't been measured yet. With two groups both calculate Hotelling's T-squared exactly."
  "9": "Meta-analysis: for a correlation, metapower rounds Fisher's z to two decimals before computing power, so its answer can differ from the exact one by up to about 1.3 points (85.6% against 84.3% for r = 0.25 in five studies of 30). Under the random-effects model it allows for the between-study variance being estimated (Jackson and Turner, 2017), where the formulas in Valentine, Pigott and Rothstein (2010) treat it as known; in their worked example the two give 68% and 68.3%."

# The same known differences as one sentence for the methods paragraph
# (docs/conventions.md, "Known differences").
known_differences_methods:
  "1": "Power was estimated by simulation, with the predictors drawn afresh in each simulated sample; fixed-model calculations such as G*Power's, which treat the predictors as fixed, give slightly higher power for interactions, so this sample size may be a few participants larger than G*Power's."
  "1 sensitivity": "The smallest detectable effect was found with a fixed-model formula, which treats the predictors as fixed; for interactions this gives slightly higher power than simulation with the predictors drawn afresh in each sample, so the smallest detectable effect may be slightly larger than reported."
  "2": "Because power for an exact test of counts goes up and down as N grows, the sample size reported is the smallest N that reaches the target power, as in G*Power; pwrss's own sample-size answer can be slightly larger."
  "3": "The predictor's overlap with the other predictors was allowed for through its R-squared with them; for this case the G*Power manual's example reports a sample size a few per cent larger than this method gives, a difference that has not yet been resolved."
  "4": "Power was estimated by simulation, so it carries Monte Carlo error, whereas G*Power computes this test exactly."
  "5": "Power for the rank test was estimated by simulating the test itself on scores of the assumed shape, rather than by adjusting the t-test's power for the test's efficiency as G*Power does, so the two can give slightly different sample sizes."
  "6": "The probability of strong evidence was calculated in closed form, which treats the effect estimate as normally distributed; in small samples this gives slightly lower values than simulating the Bayes factor itself."
  "7": "Power was calculated by the fixed-model formula for an R-squared increase, as in G*Power; InteractionPoweR's formula, and simulation with the predictors drawn afresh in each sample, give slightly lower power for the same interaction."
  "8": "Power was estimated by simulation, so it carries Monte Carlo error; G*Power computes Pillai's trace with an F approximation."
  "9": "For a correlation, metapower rounds Fisher's z to two decimals before computing power, which can move power by about a point; under the random-effects model it allows for the between-study variance being estimated (Jackson and Turner, 2017), where Valentine, Pigott and Rothstein (2010) treat it as known."

forms:
  E1:
    methods_name: "a one-sample t-test"
    departures: ["9", "15"]
    known_differences_if_method: {"5": wilcoxon_signed_rank, "6": bayes_factor}
    known_differences: ["5", "6"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: one_sample_t,
           variables: {"Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean}}
    groups:
      - input: "Your outcome's name"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The effect: Cohen's d, or the means and SD in your measure's own units"
        fields:
          - {id: effect_units, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {standardised: "As Cohen's d: (expected mean minus the fixed value) / SD", raw: "In my measure's own units: the expected mean, the fixed value and the SD"},
             default: standardised, default_source: "Cohen's d, the effect size pwr.t.test() takes (pwr 1.3-0); powerkit works it out from the means and SD if you give those"}
          - {id: d, label: "Cohen's d", type: number, path: population.d, effect: true,
             shown_if: {field: effect_units, is_not: raw}}
          - {id: raw_mean, label: "Expected mean", type: number, path: population.raw.mean, effect: true, writeup_label: "expected mean",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_test_value, label: "The fixed value it is compared with", type: number, path: population.raw.test_value, required: true, in_effect_text: true, writeup_label: "fixed value",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_sd, label: "SD: how much people usually vary on the measure", type: number, path: population.raw.sd, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD",
             shown_if: {field: effect_units, is: raw}}
      - input: "The t-test, the Wilcoxon signed-rank test or a Bayes factor t-test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {t_test: "One-sample t-test", wilcoxon_signed_rank: "Wilcoxon signed-rank test (rank-based), simulated", bayes_factor: "Bayes factor t-test (default JZS prior), instead of a p-value"},
             default: t_test, default_source: "the t-test pwr's formula covers (pwr.t.test(), pwr 1.3-0)"}
          - {id: score_shape, label: "The shape of the scores", type: select, path: population.score_shape, required: true,
             shown_if: {field: method, is: wilcoxon_signed_rank},
             choices: {normal: "Roughly normal (bell-shaped)", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_wilcox.test(), Spower 0.7)",
             help: "The signed-rank test assumes the scores are symmetric, so a skewed shape isn't offered here. The effect stays the same d: the whole distribution shifts by it."}
          - {id: evidence_threshold, label: "Strong evidence: the Bayes factor (BF10) you want the study to reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: method, is: bayes_factor},
             default: 10, default_source: "bfpwr's default (powertbf01(k = 1/10), its threshold on BF01, which its help calls Jeffreys' threshold for strong evidence; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the effect exists than if it doesn't. Power here is the chance that BF10 reaches this number."}
          - {id: prior_scale, label: "Scale of the analysis prior (a Cauchy distribution centred on 0)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0.707, default_source: "bfpwr's default, 1/sqrt(2) (powertbf01(pscale = 1/sqrt(2)), bfpwr 0.1.6)",
             help: "The prior you will use when you analyse the data (the default Bayes factor t-test's JZS prior). Use the same scale as in your analysis plan."}
          - {id: effect_sd, label: "How unsure you are about the effect, as an SD (0 = exactly this effect)", type: number, path: population.effect_sd, required: true, min: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0, default_source: "powerkit's default: plan for exactly the effect you entered, as a usual power analysis does (bfpwr's own default spreads it as widely as the analysis prior; docs/conventions.md, Departure 15)",
             help: "Above 0, powerkit averages over true effects spread around yours (a normal design prior with this SD), which usually needs a larger sample."}

  E2:
    methods_name: "an independent-samples t-test"
    departures: ["9", "15"]
    known_differences_if_method: {"5": mann_whitney, "6": bayes_factor}
    known_differences: ["5", "6"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: independent_t,
           variables: {X: {type: binary}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean_difference}}
    groups:
      - input: "Names of the two groups and the outcome"
        fields:
          - {id: X_label, label: "What the groups are (for example, condition)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The effect: Cohen's d (group 2 minus group 1, over the pooled SD), or the means and SD in your measure's own units"
        fields:
          - {id: effect_units, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {standardised: "As Cohen's d: (group 2 minus group 1) / pooled SD", raw: "In my measure's own units: each group's mean and the SD"},
             default: standardised, default_source: "Cohen's d, the effect size pwr.t.test() takes (pwr 1.3-0); powerkit works it out from the means and SD if you give those"}
          - {id: d, label: "Cohen's d", type: number, path: population.d, effect: true,
             shown_if: {field: effect_units, is_not: raw}}
          - {id: raw_mean_1, label: "Expected mean, group 1", type: number, path: population.raw.mean_1, effect: true, writeup_label: "group 1 mean",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_mean_2, label: "Expected mean, group 2", type: number, path: population.raw.mean_2, effect: true, writeup_label: "group 2 mean",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_sd, label: "SD: how much people usually vary on the measure within a group", type: number, path: population.raw.sd, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD",
             shown_if: {field: effect_units, is: raw}}
      - input: "The size of group 2 relative to group 1 (1 = equal)"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwr.t.test() (pwr 1.3-0) and Spower's default (p_t.test(n2_n1 = 1), Spower 0.7)"}
      - input: "Student's or Welch's t-test, the Mann-Whitney test, or a Bayes factor t-test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {student_t: "Student's t-test (equal spread assumed)", welch_t: "Welch's t-test (equal spread not assumed)", mann_whitney: "Mann-Whitney test (rank-based), simulated", bayes_factor: "Bayes factor t-test (default JZS prior, equal groups), instead of a p-value"},
             default: student_t, default_source: "the t-test pwr's formula covers (pwr.t.test(), pwr 1.3-0), and Spower's default (p_t.test(var.equal = TRUE), Spower 0.7)"}
          - {id: score_shape, label: "The shape of the scores in each group", type: select, path: population.score_shape, required: true,
             shown_if: {field: method, is: mann_whitney},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_wilcox.test(), Spower 0.7)",
             help: "Every group has the same shape; the groups differ only by a shift (their means). A rank test's power depends on this shape; the parametric test's figure assumes normal scores."}
          - {id: evidence_threshold, label: "Strong evidence: the Bayes factor (BF10) you want the study to reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: method, is: bayes_factor},
             default: 10, default_source: "bfpwr's default (powertbf01(k = 1/10), its threshold on BF01, which its help calls Jeffreys' threshold for strong evidence; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the effect exists than if it doesn't. Power here is the chance that BF10 reaches this number."}
          - {id: prior_scale, label: "Scale of the analysis prior (a Cauchy distribution centred on 0)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0.707, default_source: "bfpwr's default, 1/sqrt(2) (powertbf01(pscale = 1/sqrt(2)), bfpwr 0.1.6)",
             help: "The prior you will use when you analyse the data (the default Bayes factor t-test's JZS prior). Use the same scale as in your analysis plan."}
          - {id: effect_sd, label: "How unsure you are about the effect, as an SD (0 = exactly this effect)", type: number, path: population.effect_sd, required: true, min: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0, default_source: "powerkit's default: plan for exactly the effect you entered, as a usual power analysis does (bfpwr's own default spreads it as widely as the analysis prior; docs/conventions.md, Departure 15)",
             help: "Above 0, powerkit averages over true effects spread around yours (a normal design prior with this SD), which usually needs a larger sample."}
    method_extra:
      # Welch's t-test: Spower's simulation by default, pwrss's formula on
      # request (engine, wave 2).
      - {id: welch_method, label: "How power is worked out", type: select, path: options.method, optional: true,
         shown_if: {field: method, is: welch_t},
         choices: {simulation: "Simulation (Spower)", exact: "Formula (pwrss's power.t.welch()): faster, no simulation noise"},
         default: simulation, default_source: "powerkit's default for Welch's t-test (Spower's simulation; pwr has no Welch formula)"}

  E3:
    methods_name: "a paired-samples t-test"
    departures: ["9", "15"]
    known_differences_if_method: {"5": wilcoxon_signed_rank, "6": bayes_factor}
    known_differences: ["5", "6"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: paired_t,
           variables: {X: {type: within_factor}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean_difference}}
    groups:
      - input: "Names of the two conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are (for example, session)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "First condition", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Second condition", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The effect: d_z, or the means and SD in your measure's own units"
        fields:
          - {id: effect_units, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {standardised: "As d_z: mean of the differences (second minus first) / SD of the differences", raw: "In my measure's own units: the mean in each condition and an SD"},
             default: standardised, default_source: "d_z, the effect size pwr.t.test() takes for a paired test (pwr 1.3-0); powerkit works it out from the means and SD if you give those"}
          - {id: dz, label: "d_z", type: number, path: population.dz, effect: true,
             shown_if: {field: effect_units, is_not: raw}}
          - {id: raw_mean_1, label: "Expected mean, first condition", type: number, path: population.raw.mean_1, effect: true, writeup_label: "first-condition mean",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_mean_2, label: "Expected mean, second condition", type: number, path: population.raw.mean_2, effect: true, writeup_label: "second-condition mean",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_sd_kind, label: "Which SD you know", type: select,
             choices: {difference: "The SD of people's changes (second minus first)", each: "The SD of the measure, and how strongly the two measurements correlate"},
             default: each, default_source: "the values researchers usually have from earlier studies (the SD of the measure and the test-retest correlation)",
             shown_if: {field: effect_units, is: raw}}
          - {id: raw_sd_difference, label: "SD of people's changes (second minus first)", type: number, path: population.raw.sd_difference, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD of the differences",
             shown_if: [{field: effect_units, is: raw}, {field: raw_sd_kind, is: difference}]}
          - {id: raw_sd, label: "SD: how much people usually vary on the measure", type: number, path: population.raw.sd, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD",
             shown_if: [{field: effect_units, is: raw}, {field: raw_sd_kind, is_not: difference}]}
          - {id: raw_r, label: "Correlation between the two measurements", type: number, path: population.raw.r, required: true, min_exclusive: -1, max_exclusive: 1, in_effect_text: true, writeup_label: "correlation between the measurements",
             shown_if: [{field: effect_units, is: raw}, {field: raw_sd_kind, is_not: difference}]}
      - input: "The t-test, the Wilcoxon signed-rank test or a Bayes factor t-test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {t_test: "Paired-samples t-test", wilcoxon_signed_rank: "Wilcoxon signed-rank test (rank-based), simulated", bayes_factor: "Bayes factor t-test (default JZS prior), instead of a p-value"},
             default: t_test, default_source: "the t-test pwr's formula covers (pwr.t.test(type = 'paired'), pwr 1.3-0)"}
          - {id: score_shape, label: "The shape of the changes (second minus first)", type: select, path: population.score_shape, required: true,
             shown_if: {field: method, is: wilcoxon_signed_rank},
             choices: {normal: "Roughly normal (bell-shaped)", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_wilcox.test(), Spower 0.7)",
             help: "The signed-rank test assumes people's changes are symmetric, so a skewed shape isn't offered here. The effect stays the same d_z: the whole distribution of changes shifts by it."}
          - {id: evidence_threshold, label: "Strong evidence: the Bayes factor (BF10) you want the study to reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: method, is: bayes_factor},
             default: 10, default_source: "bfpwr's default (powertbf01(k = 1/10), its threshold on BF01, which its help calls Jeffreys' threshold for strong evidence; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the effect exists than if it doesn't. Power here is the chance that BF10 reaches this number."}
          - {id: prior_scale, label: "Scale of the analysis prior (a Cauchy distribution centred on 0)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0.707, default_source: "bfpwr's default, 1/sqrt(2) (powertbf01(pscale = 1/sqrt(2)), bfpwr 0.1.6)",
             help: "The prior you will use when you analyse the data (the default Bayes factor t-test's JZS prior). Use the same scale as in your analysis plan."}
          - {id: effect_sd, label: "How unsure you are about the effect, as an SD (0 = exactly this effect)", type: number, path: population.effect_sd, required: true, min: 0,
             shown_if: {field: method, is: bayes_factor},
             default: 0, default_source: "powerkit's default: plan for exactly the effect you entered, as a usual power analysis does (bfpwr's own default spreads it as widely as the analysis prior; docs/conventions.md, Departure 15)",
             help: "Above 0, powerkit averages over true effects spread around yours (a normal design prior with this SD), which usually needs a larger sample."}

  E4:
    methods_name: "a Pearson correlation"
    departures: ["9", "10"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: correlation,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: correlation, method: pearson}}
    groups:
      - input: "Names of the two variables"
        fields:
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
      - input: "The expected correlation r"
        fields:
          - {id: r, label: "Correlation r", type: number, path: population.r, effect: true, min: -1, max: 1}
      - input: "Pearson's r, Spearman's rho or Kendall's tau"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {pearson: "Pearson's r", spearman: "Spearman's rho (rank-based), simulated", kendall: "Kendall's tau (rank-based), simulated"},
             default: pearson, default_source: "Pearson's r, the correlation pwr computes (pwr.r.test(), pwr 1.3-0)",
             help: "For Spearman's or Kendall's, enter r above as the Pearson correlation of the scores; powerkit simulates the rank test on scores of the shape you choose below with that correlation."}
          - {id: score_shape, label: "The shape of both scores", type: select, path: population.score_shape, required: true,
             shown_if: {field: method, is_one_of: [spearman, kendall]},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_r(), Spower 0.7)",
             help: "A rank correlation's advantage over Pearson's r is in skewed or heavy-tailed data. The second score is drawn as r times the first plus another draw of the same shape, so its shape is close to, not exactly, the one chosen."}

  E5:
    methods_name: "a test of two proportions (z test)"
    departures: ["9", "11", "5"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, group 2's proportion can stay empty if you have no estimate: powerkit keeps group 1's proportion and finds how far above it group 2's would need to be. A lower value for group 2 looks for a decrease instead."
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: two_proportions,
           variables: {X: {type: binary}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: proportion_difference, method: z_test}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: X_label, label: "What the groups are (for example, condition)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Yes/no outcome (for example, attended)", type: text, path: variables.Y.label, required: true}
      - input: "The expected proportion of 'yes' in each group"
        fields:
          - {id: p1, label: "Proportion of 'yes' in group 1 (0 to 1)", type: number, path: population.p1, effect: true, baseline: true, min: 0, max: 1}
          - {id: p2, label: "Proportion of 'yes' in group 2 (0 to 1)", type: number, path: population.p2, effect: true, when_empty: same_as_p1, min: 0, max: 1}
      - input: "The size of group 2 relative to group 1"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwr.2p.test() (pwr 1.3-0) and Spower's default (p_prop.test(n.ratios = rep(1, length(prop))), Spower 0.7)"}
      - input: "The z test or Fisher's exact test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {z_test: "The z test (a large-sample test)", fisher_exact: "Fisher's exact test (pwrss's power.exact.fisher()): for small samples or small expected counts"},
             default: z_test, default_source: "the test G*Power and pwr's formulas cover for two independent proportions"}
    # Known differences that apply only with one test version.
    known_differences_if_method: {"2": fisher_exact}
    known_differences: ["2"]
    method_extra:
      - {id: proportions_formula, label: "Which formula", type: select, path: options.proportions_formula, optional: true,
         shown_if: [{field: calc_method, is: exact}, {field: method, is: z_test}],
         choices: {z_test: "z test, as in G*Power (base R's power.prop.test() for equal groups, pwrss for unequal groups)", arcsine: "Cohen's h, the arcsine approximation (pwr)"},
         default: z_test, default_source: "G*Power's z test for two independent proportions, with its default options"}

  E6:
    sides: false
    methods_name: "a chi-square test of independence"
    departures: ["9", "5"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, the table can stay empty if you have no estimate: powerkit then finds the smallest association (Cohen's w) for your numbers of categories."
    basic_method: true
    directional: false
    base: {spec_version: "0.1", design: basic_test, template: chi_square_independence,
           variables: {X: {type: categorical}, "Y": {type: categorical}}, population: {metric: proportion},
           target_test: {effect: association, method: pearson_chi_square}}
    groups:
      - input: "The categories of each variable"
        fields:
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "Its categories, separated by commas", type: levels, path: variables.X.levels, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
          - {id: Y_levels, label: "Its categories, separated by commas", type: levels, path: variables.Y.levels, required: true}
      - input: "The expected proportion of people in each combination (adding up to 1), or Cohen's w"
        fields:
          - {id: chisq_metric, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {proportion: "As a table of proportions", w: "As an effect size: Cohen's w, as in G*Power"},
             default: proportion, default_source: "the proportions, from which pwr's ES.w2() works out Cohen's w (pwr 1.3-0); pwr.chisq.test() itself takes w"}
          - {id: probabilities, label: "Proportions: one line per category of the first variable, one number per category of the second, separated by commas", type: table, path: population.probabilities, effect: true, when_empty: no_association,
             shown_if: {field: chisq_metric, is_not: w}}
          - {id: w, label: "Cohen's w", writeup_label: "Cohen's w", type: number, path: population.w, effect: true, min_exclusive: 0,
             help: "Cohen's w for the association, as G*Power takes it (0.1 small, 0.3 medium, 0.5 large by Cohen's labels). The degrees of freedom come from the numbers of categories. powerkit treats it as the true effect; a published value tends to be too large.",
             shown_if: {field: chisq_metric, is: w}}

  E7:
    sides: false
    methods_name: "a 2 × 2 between-participants ANOVA"
    departures: ["1", "3"]
    tool: Superpower
    directional: false
    sensitivity: true
    base: {spec_version: "0.1", design: factorial_anova, template: 2x2_between,
           variables: {A: {type: between_factor}, B: {type: between_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "Factor A", type: text, path: variables.A.label, required: true}
          - {id: A_level1, label: "Factor A, level 1", type: text, path: variables.A.levels.1, required: true}
          - {id: A_level2, label: "Factor A, level 2", type: text, path: variables.A.levels.2, required: true}
          - {id: B_label, label: "Factor B", type: text, path: variables.B.label, required: true}
          - {id: B_level1, label: "Factor B, level 1", type: text, path: variables.B.levels.1, required: true}
          - {id: B_level2, label: "Factor B, level 2", type: text, path: variables.B.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The four expected cell means (raw or in SD units)"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: m11, label: "Mean: A level 1, B level 1", type: number, path: population.means.1.1, effect: true}
          - {id: m12, label: "Mean: A level 1, B level 2", type: number, path: population.means.1.2, effect: true}
          - {id: m21, label: "Mean: A level 2, B level 1", type: number, path: population.means.2.1, effect: true}
          - {id: m22, label: "Mean: A level 2, B level 2", type: number, path: population.means.2.2, effect: true}
      - input: "The SD (one, or one per cell)"
        fields:
          # The spec's population > sd is one number or a 2 x 2 array of
          # positive numbers (rows = levels of A), as validate_spec() accepts.
          - {id: sd_mode, label: "One SD, or one per cell", type: select, required: true,
             choices: {one: "One SD for all four cells", per_cell: "A different SD in each cell"},
             default: one, default_source: "the simpler choice; the design spec accepts either"}
          - {id: sd, label: "SD (one value for all four cells)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is_not: per_cell}}
          - {id: sd11, label: "SD: A level 1, B level 1", type: number, path: population.sd.1.1, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd12, label: "SD: A level 1, B level 2", type: number, path: population.sd.1.2, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd21, label: "SD: A level 2, B level 1", type: number, path: population.sd.2.1, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd22, label: "SD: A level 2, B level 2", type: number, path: population.sd.2.2, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
      - input: "Which effect: factor A, factor B or the interaction"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {main_effect_A: "Factor A", main_effect_B: "Factor B", interaction: "The interaction"}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for the 2 x 2 designs (design spec, options > method)"}

  E22:
    sides: false
    methods_name: "a 2 × 2 between-participants ANOVA with unequal group sizes (Type III sums of squares, simulated)"
    departures: []
    tool: Superpower
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: 2x2_between,
           variables: {A: {type: between_factor}, B: {type: between_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "Factor A", type: text, path: variables.A.label, required: true}
          - {id: A_level1, label: "Factor A, level 1", type: text, path: variables.A.levels.1, required: true}
          - {id: A_level2, label: "Factor A, level 2", type: text, path: variables.A.levels.2, required: true}
          - {id: B_label, label: "Factor B", type: text, path: variables.B.label, required: true}
          - {id: B_level1, label: "Factor B, level 1", type: text, path: variables.B.levels.1, required: true}
          - {id: B_level2, label: "Factor B, level 2", type: text, path: variables.B.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The four expected cell means (raw or in SD units)"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: m11, label: "Mean: A level 1, B level 1", type: number, path: population.means.1.1, effect: true}
          - {id: m12, label: "Mean: A level 1, B level 2", type: number, path: population.means.1.2, effect: true}
          - {id: m21, label: "Mean: A level 2, B level 1", type: number, path: population.means.2.1, effect: true}
          - {id: m22, label: "Mean: A level 2, B level 2", type: number, path: population.means.2.2, effect: true}
      - input: "The SD (one, or one per cell)"
        fields:
          # The spec's population > sd is one number or a 2 x 2 array of
          # positive numbers (rows = levels of A), as validate_spec() accepts.
          - {id: sd_mode, label: "One SD, or one per cell", type: select, required: true,
             choices: {one: "One SD for all four cells", per_cell: "A different SD in each cell"},
             default: one, default_source: "the simpler choice; the design spec accepts either"}
          - {id: sd, label: "SD (one value for all four cells)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is_not: per_cell}}
          - {id: sd11, label: "SD: A level 1, B level 1", type: number, path: population.sd.1.1, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd12, label: "SD: A level 1, B level 2", type: number, path: population.sd.1.2, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd21, label: "SD: A level 2, B level 1", type: number, path: population.sd.2.1, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd22, label: "SD: A level 2, B level 2", type: number, path: population.sd.2.2, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
      - input: "Which effect: factor A, factor B or the interaction"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {main_effect_A: "Factor A", main_effect_B: "Factor B", interaction: "The interaction"}}
      - input: "The size of each group"
        fields:
          # options > cell_ratio: relative sizes, so expected group sizes
          # (60, 60, 30, 30) work as they are; the total n is split in this
          # ratio.
          - {id: n11, writeup_label: "relative size of A level 1, B level 1", label: "Group size (or ratio): A level 1, B level 1", type: number, path: options.cell_ratio.1.1, required: true, min: 1, integer: true}
          - {id: n12, writeup_label: "relative size of A level 1, B level 2", label: "Group size (or ratio): A level 1, B level 2", type: number, path: options.cell_ratio.1.2, required: true, min: 1, integer: true}
          - {id: n21, writeup_label: "relative size of A level 2, B level 1", label: "Group size (or ratio): A level 2, B level 1", type: number, path: options.cell_ratio.2.1, required: true, min: 1, integer: true}
          - {id: n22, writeup_label: "relative size of A level 2, B level 2", label: "Group size (or ratio): A level 2, B level 2", type: number, path: options.cell_ratio.2.2, required: true, min: 1, integer: true}

  E8:
    sides: false
    methods_name: "a 2 × 2 mixed ANOVA"
    departures: ["2", "3"]
    tool: Superpower
    directional: false
    sensitivity: true
    base: {spec_version: "0.1", design: factorial_anova, template: 2x2_mixed,
           variables: {A: {type: between_factor}, B: {type: within_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "Between factor (for example, group)", type: text, path: variables.A.label, required: true}
          - {id: A_level1, label: "Between factor, level 1", type: text, path: variables.A.levels.1, required: true}
          - {id: A_level2, label: "Between factor, level 2", type: text, path: variables.A.levels.2, required: true}
          - {id: B_label, label: "Within factor (for example, time)", type: text, path: variables.B.label, required: true}
          - {id: B_level1, label: "Within factor, level 1", type: text, path: variables.B.levels.1, required: true}
          - {id: B_level2, label: "Within factor, level 2", type: text, path: variables.B.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The four expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: m11, label: "Mean: between level 1, within level 1", type: number, path: population.means.1.1, effect: true}
          - {id: m12, label: "Mean: between level 1, within level 2", type: number, path: population.means.1.2, effect: true}
          - {id: m21, label: "Mean: between level 2, within level 1", type: number, path: population.means.2.1, effect: true}
          - {id: m22, label: "Mean: between level 2, within level 2", type: number, path: population.means.2.2, effect: true}
      - input: "The SD"
        fields:
          - {id: sd, label: "SD (one value for all four cells)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The correlation between the two repeated measurements"
        fields:
          - {id: r, label: "Correlation between the two measurements", type: number, path: population.r, effect: true, min: -1, max: 1}
      - input: "Which effect: between factor, within factor or the interaction"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {main_effect_A: "The between factor", main_effect_B: "The within factor", interaction: "The interaction"}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for the 2 x 2 designs (design spec, options > method)"}

  E9:
    methods_name: "a moderated regression (continuous × continuous interaction)"
    tool: InteractionPoweR
    known_differences: ["1", "7"]
    # Known difference 1 is the simulation's (correlations); 7 is the
    # R-squared change route's (pwrss's fixed-model formula).
    known_differences_if_metric: {"1": correlation, "7": r2_change}
    # The smallest detectable effect: the interaction's correlation with Y,
    # by InteractionPoweR's fixed-model formula (the engine's
    # interactionpower_sensitivity()); labelled on the result screen.
    sensitivity: true
    directional: false
    base: {spec_version: "0.1", design: regression_interaction, template: two_way,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: interaction, method: ols_t}}
    names: [X, W, "Y"]
    groups:
      - input: "Correlations: X with Y, W with Y, the interaction XW with Y, and X with W"
        fields:
          - {id: interaction_metric, label: "How you'll give the interaction", type: select, path: population.metric,
             choices: {correlation: "As correlations (X, W and the interaction XW with Y, and X with W)", r2_change: "As the R-squared the interaction adds, as in G*Power"},
             default: correlation, default_source: "InteractionPoweR's correlations (power_interaction(), InteractionPoweR 0.2.4); the R-squared change is how papers usually report an interaction"}
          - {id: r_X_Y, label: "Correlation of X with Y", type: number, path: population.r_X_Y, effect: true, min: -1, max: 1, shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: r_W_Y, label: "Correlation of W with Y", type: number, path: population.r_W_Y, effect: true, min: -1, max: 1, shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: r_XW_Y, label: "Correlation of the interaction XW with Y", type: number, path: population.r_XW_Y, effect: true, min: -1, max: 1, shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: r_X_W, label: "Correlation of X with W", type: number, path: population.r_X_W, effect: true, min: -1, max: 1, shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: r2_change, writeup_label: "R-squared change for the interaction", label: "R-squared the interaction adds (its R-squared change)", type: number, path: population.r2_change, effect: true,
             min_exclusive: 0, max_exclusive: 1, shown_if: {field: interaction_metric, is: r2_change},
             help: "The increase in R-squared when the product of X and W is added to a model with X and W. A published value tends to be too large."}
          - {id: r2_main, writeup_label: "R-squared of X and W", label: "R-squared of X and W without the interaction (0 if you don't know)", type: number, path: population.r2_main, in_effect_text: true,
             optional: true, min: 0, max_exclusive: 1, shown_if: {field: interaction_metric, is: r2_change},
             help: "Leaving it at 0 gives a slightly smaller effect size, so a slightly larger sample: the safe side."}
      - input: "Optional: reliability of X, W and Y"
        fields:
          - {id: rel_X, label: "Reliability of X (optional; empty = perfectly reliable)", type: number, path: variables.X.reliability, optional: true, min_exclusive: 0, max: 1,
             shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: rel_W, label: "Reliability of W (optional; empty = perfectly reliable)", type: number, path: variables.W.reliability, optional: true, min_exclusive: 0, max: 1,
             shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: rel_Y, label: "Reliability of Y (optional; empty = perfectly reliable)", type: number, path: variables.Y.reliability, optional: true, min_exclusive: 0, max: 1,
             shown_if: {field: interaction_metric, is_not: r2_change}}

  E15:
    methods_name: "a moderated regression with a yes/no predictor or moderator"
    tool: InteractionPoweR
    known_differences: ["1"]
    directional: false
    base: {spec_version: "0.1", design: regression_interaction, template: two_way,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: interaction, method: ols_t}}
    groups:
      - input: "Which variable is yes/no, and what you call X, W and Y"
        fields:
          # The yes/no variable is split 50/50 (InteractionPoweR's k.x1 or
          # k.x2 = 2; it has no unequal split for interactions).
          - {id: binary_role, label: "Which variable is two groups or conditions?", type: select, required: true,
             choices: {X: "X, the cause or predictor (for example, a training or control condition)", W: "W, the moderator (for example, two groups of people)"},
             sets: {X: [{path: variables.X.type, value: binary}, {path: variables.W.type, value: continuous}],
                    W: [{path: variables.X.type, value: continuous}, {path: variables.W.type, value: binary}]}}
          - {id: X_label, label: "X (the cause or predictor)", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "X's two groups or conditions, separated by a comma", type: levels, path: variables.X.levels, required: true,
             shown_if: {field: binary_role, is: X}}
          - {id: W_label, label: "W (the moderator)", type: text, path: variables.W.label, required: true}
          - {id: W_levels, label: "W's two groups, separated by a comma", type: levels, path: variables.W.levels, required: true,
             shown_if: {field: binary_role, is: W}}
          - {id: Y_label, label: "Y (the outcome)", type: text, path: variables.Y.label, required: true}
      - input: "Correlations: X with Y, W with Y, the interaction XW with Y, and X with W"
        fields:
          - {id: r_X_Y, label: "Correlation of X with Y (for a yes/no X, the point-biserial correlation)", type: number, path: population.r_X_Y, effect: true, min: -1, max: 1}
          - {id: r_W_Y, label: "Correlation of W with Y (for a yes/no W, the point-biserial correlation)", type: number, path: population.r_W_Y, effect: true, min: -1, max: 1}
          - {id: r_XW_Y, label: "Correlation of the interaction XW with Y", type: number, path: population.r_XW_Y, effect: true, min: -1, max: 1}
          - {id: r_X_W, label: "Correlation of X with W (0 when X is a randomised condition)", type: number, path: population.r_X_W, effect: true, min: -1, max: 1}
      - input: "Optional: reliability of the score variable and of Y"
        fields:
          # Not for the yes/no variable: misclassification isn't the same as
          # unreliable scores (decided 16 October 2026; judgement call B8,
          # decided 29 October 2026).
          - {id: rel_X, label: "Reliability of X (optional; empty = perfectly reliable)", type: number, path: variables.X.reliability, optional: true, min_exclusive: 0, max: 1,
             shown_if: {field: binary_role, is: W}}
          - {id: rel_W, label: "Reliability of W (optional; empty = perfectly reliable)", type: number, path: variables.W.reliability, optional: true, min_exclusive: 0, max: 1,
             shown_if: {field: binary_role, is: X}}
          - {id: rel_Y, label: "Reliability of Y (optional; empty = perfectly reliable)", type: number, path: variables.Y.reliability, optional: true, min_exclusive: 0, max: 1}

  E31:
    methods_name: "a three-way regression interaction"
    tool: InteractionPoweR
    directional: false
    base: {spec_version: "0.1", design: regression_interaction, template: three_way,
           variables: {X: {type: continuous}, W: {type: continuous}, Z: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: three_way_interaction, method: ols_t}}
    names: [X, W, Z, "Y"]
    groups:
      - input: "Correlations of X, W, Z and Y, and of the products XW, XZ and WZ with Y"
        fields:
          - {id: r_X_Y, label: "Correlation of X with Y", type: number, path: population.r_X_Y, effect: true, min: -1, max: 1}
          - {id: r_W_Y, label: "Correlation of W with Y", type: number, path: population.r_W_Y, effect: true, min: -1, max: 1}
          - {id: r_Z_Y, label: "Correlation of Z with Y", type: number, path: population.r_Z_Y, effect: true, min: -1, max: 1}
          - {id: r_XW_Y, label: "Correlation of the product XW with Y", type: number, path: population.r_XW_Y, effect: true, min: -1, max: 1}
          - {id: r_XZ_Y, label: "Correlation of the product XZ with Y", type: number, path: population.r_XZ_Y, effect: true, min: -1, max: 1}
          - {id: r_WZ_Y, label: "Correlation of the product WZ with Y", type: number, path: population.r_WZ_Y, effect: true, min: -1, max: 1}
          - {id: r_X_W, label: "Correlation of X with W", type: number, path: population.r_X_W, effect: true, min: -1, max: 1}
          - {id: r_X_Z, label: "Correlation of X with Z", type: number, path: population.r_X_Z, effect: true, min: -1, max: 1}
          - {id: r_W_Z, label: "Correlation of W with Z", type: number, path: population.r_W_Z, effect: true, min: -1, max: 1}
      - input: "The three-way effect (standardised coefficient of XWZ)"
        fields:
          - {id: b_XWZ, label: "Standardised regression coefficient of the three-way product XWZ", type: number, path: population.b_XWZ, effect: true, min_exclusive: -1, max_exclusive: 1,
             help: "How much the XW interaction changes per SD of Z, in SD units of Y: InteractionPoweR's b.x1x2x3. Small three-way effects (around 0.05 to 0.1) need large samples."}
      - input: "Optional: reliability of X, W, Z and Y"
        fields:
          - {id: rel_X, label: "Reliability of X (optional; empty = perfectly reliable)", type: number, path: variables.X.reliability, optional: true, min_exclusive: 0, max: 1}
          - {id: rel_W, label: "Reliability of W (optional; empty = perfectly reliable)", type: number, path: variables.W.reliability, optional: true, min_exclusive: 0, max: 1}
          - {id: rel_Z, label: "Reliability of Z (optional; empty = perfectly reliable)", type: number, path: variables.Z.reliability, optional: true, min_exclusive: 0, max: 1}
          - {id: rel_Y, label: "Reliability of Y (optional; empty = perfectly reliable)", type: number, path: variables.Y.reliability, optional: true, min_exclusive: 0, max: 1}

  E10:
    methods_name: "a simple mediation model"
    tool: power4mome
    departures: ["6", "8"]
    directional: false
    base: {spec_version: "0.1", design: mediation, template: process_4,
           variables: {X: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, path: "X->M->Y", method: monte_carlo_ci}}
    names: [X, M, "Y"]
    groups:
      - input: "Standardised paths X -> M, M -> Y and X -> Y"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
      - input: "Number of Monte Carlo draws per CI (optional)"
        fields:
          - {id: ci_draws, label: "Monte Carlo draws per CI (optional; empty = 1,000, power4mome's default for q_power_mediation())", type: number, path: options.ci_draws, optional: true, empty_text: "1,000 (power4mome's default)", min: 100, max: 100000, integer: true}

  E16:
    methods_name: "a simple mediation model with a yes/no X"
    tool: power4mome
    departures: ["6", "8"]
    directional: false
    base: {spec_version: "0.1", design: mediation, template: process_4,
           variables: {X: {type: binary}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, path: "X->M->Y", method: monte_carlo_ci}}
    names: [X, M, "Y"]
    groups:
      - input: "X's two groups or conditions, and the share in each"
        fields:
          - {id: X_levels, label: "X's two groups or conditions, separated by a comma (first the comparison group)", type: levels, path: variables.X.levels, required: true}
          - {id: x_prob, label: "Share of people in X's second group (0 to 1; empty = 0.5, equal groups)", type: number, path: population.x_prob, optional: true, empty_text: "0.5 (equal groups)", min_exclusive: 0, max_exclusive: 1}
      - input: "Standardised paths X -> M, M -> Y and X -> Y"
        fields:
          - {id: p_X_M, label: "Path X -> M (per SD of X; the result shows the group difference it means)", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
      - input: "Number of Monte Carlo draws per CI (optional)"
        fields:
          - {id: ci_draws, label: "Monte Carlo draws per CI (optional; empty = 1,000, power4mome's default for q_power_mediation())", type: number, path: options.ci_draws, optional: true, empty_text: "1,000 (power4mome's default)", min: 100, max: 100000, integer: true}

  E33:
    methods_name: "a linear mixed model with participants and items as random factors (Satterthwaite t test)"
    tool: simr
    departures: ["16"]
    directional: false
    base: {spec_version: "0.1", design: mixed_model, template: crossed_two_condition,
           variables: {X: {type: within_factor}, "Y": {type: continuous}}, population: {metric: raw},
           target_test: {effect: condition, method: satterthwaite_t}}
    groups:
      - input: "The two conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are (for example, word type)", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "The two conditions, separated by a comma (first the comparison condition)", type: levels, path: variables.X.levels, required: true}
          - {id: Y_label, label: "Outcome (for example, response time in ms)", type: text, path: variables.Y.label, required: true}
      - input: "The difference between conditions (the fixed effect), in the outcome's units"
        fields:
          - {id: difference, label: "Mean in the second condition minus the first", type: number, path: population.difference, effect: true,
             help: "For example, 16 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
      - input: "How much participants and items vary (the variance components)"
        fields:
          - {id: sd_participant, label: "SD of participants' averages (random intercepts)", type: number, path: population.sd_participant, effect: true, min: 0,
             help: "For example, 100 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
          - {id: sd_participant_slope, label: "SD of the condition difference across participants (random slopes)", type: number, path: population.sd_participant_slope, effect: true, min: 0,
             help: "For example, 5.3 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
          - {id: r_participant, label: "Correlation of participants' averages and differences (optional; empty = 0)", type: number, path: population.r_participant, optional: true, empty_text: "0", min: -1, max: 1,
             help: "For example, -0.40 in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
          - {id: sd_item, label: "SD of items' averages (random intercepts)", type: number, path: population.sd_item, effect: true, min: 0,
             help: "For example, 43.6 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
          - {id: sd_residual, label: "Residual SD (trial-to-trial variation)", type: number, path: population.sd_residual, effect: true, min_exclusive: 0,
             help: "For example, 148.8 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
      - input: "The items: how many, and whether each appears in one condition or both"
        fields:
          - {id: items, label: "Number of items", type: number, path: population.items, required: true, min: 4, integer: true}
          - {id: item_design, label: "Items appear", type: select, path: population.item_design, required: true,
             choices: {between: "In one condition each (half the items in each)", within: "In both conditions (every participant sees every item twice)"},
             default: between, default_source: "the design as decided on 30 October 2026 (docs/decisions.md)"}
          - {id: sd_item_slope, label: "SD of the condition difference across items (optional; empty = 0)", type: number, path: population.sd_item_slope, optional: true, empty_text: "0", min: 0,
             shown_if: {field: item_design, is: within},
             help: "For example, 4.5 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}

  # People nested in groups (simr): a person-level X, a group-level W and
  # their cross-level interaction (31 October 2026).
  E62:
    methods_name: "a two-level linear mixed model with a person-level and a group-level predictor (Satterthwaite t test)"
    tool: simr
    departures: ["16"]
    directional: false
    base: {spec_version: "0.1", design: mixed_model, template: two_level,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: raw},
           target_test: {method: satterthwaite_t}}
    groups:
      - input: "The outcome, the person-level predictor and the group-level predictor"
        fields:
          - {id: Y_label, label: "Outcome (for example, maths score)", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "Measured on each person (X; for example, homework time)", type: text, path: variables.X.label, required: true}
          - {id: W_label, label: "Measured on each group (W; for example, teacher experience)", type: text, path: variables.W.label, required: true}
      - input: "Each effect, how much the groups differ, and the residual SD"
        fields:
          - {id: b_X, writeup_label: "X's effect within groups", label: "X's effect within groups: the change in the outcome for one SD more of X than the group's average", type: number, path: population.b_X, effect: true}
          - {id: b_W, writeup_label: "W's effect between groups", label: "W's effect between groups: the change in a group's average for one SD more of W", type: number, path: population.b_W, effect: true}
          - {id: b_XW, writeup_label: "cross-level interaction", label: "The cross-level interaction: how much X's effect changes for one SD more of W", type: number, path: population.b_XW, effect: true}
          - {id: sd_group, writeup_label: "SD of the groups' averages", label: "SD of the groups' averages beyond W (random intercepts)", type: number, path: population.sd_group, effect: true, min: 0,
             help: "In the outcome's units. With a residual SD of 1, an SD of 0.33 means about 10% of the variance lies between groups (an intraclass correlation of 0.1)."}
          - {id: sd_group_slope, writeup_label: "SD of X's effect across groups", label: "SD of X's effect across groups beyond W (random slopes)", type: number, path: population.sd_group_slope, effect: true, min: 0}
          - {id: r_group, label: "Correlation of the groups' averages and X's effects (optional; empty = 0)", type: number, path: population.r_group, optional: true, empty_text: "0", min: -1, max: 1}
          - {id: sd_residual, writeup_label: "residual SD", label: "Residual SD: how much people differ within a group", type: number, path: population.sd_residual, effect: true, min_exclusive: 0}
      - input: "The number of people in each group, and the effect to test"
        fields:
          - {id: cluster_size, label: "People in each group (the same in every group)", type: number, path: population.cluster_size, required: true, min: 2, integer: true}
          - {id: two_level_effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {cross_level_interaction: "The cross-level interaction: does X's effect depend on W?", within_effect: "X's effect within groups", between_effect: "W's effect between groups"},
             default: cross_level_interaction, default_source: "the cross-level interaction, the effect this design is usually planned for"}

  E11:
    methods_name: "a parallel mediation model"
    tool: power4mome
    departures: ["6", "7", "8"]
    directional: false
    mediators: parallel
    base: {spec_version: "0.1", design: mediation, template: process_4,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, method: monte_carlo_ci}}
    names: [X, "Y"]
    # Generated by R/forms.R for the chosen number of mediators: the paths
    # for each mediator, the residual correlations and the target path.
    groups:
      - input: "Whether X is a score or two groups or conditions"
        fields:
          # A yes/no X (E16's decisions, 29 October 2026): power4mome's
          # rbinary_rs() with the share in X's second level; paths from X
          # stay standardised (per SD of X).
          - {id: x_type, label: "X is", type: select, required: true,
             choices: {score: "A score", binary: "Two groups or conditions"},
             default: score, default_source: "the design as most often planned; choose two groups for an experiment",
             sets: {score: [{path: variables.X.type, value: continuous}], binary: [{path: variables.X.type, value: binary}]}}
          - {id: X_levels, label: "X's two groups or conditions, separated by a comma (first the comparison group)", type: levels, path: variables.X.levels, required: true,
             shown_if: {field: x_type, is: binary}}
          - {id: x_prob, label: "Share of people in X's second group (0 to 1; empty = 0.5, equal groups)", type: number, path: population.x_prob, optional: true, empty_text: "0.5 (equal groups)", min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: x_type, is: binary}}
      - input: "Standardised paths for each mediator"
        generated: parallel_paths
      - input: "Correlations between the mediators' residuals"
        generated: residual_correlations
      - input: "Which indirect path the hypothesis is about"
        generated: target_path

  E12:
    methods_name: "a serial mediation model"
    tool: power4mome
    departures: ["6", "8"]
    directional: false
    mediators: serial
    base: {spec_version: "0.1", design: mediation, template: process_6,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, method: monte_carlo_ci}}
    names: [X, "Y"]
    groups:
      - input: "Whether X is a score or two groups or conditions"
        fields:
          # A yes/no X (E16's decisions, 29 October 2026): power4mome's
          # rbinary_rs() with the share in X's second level; paths from X
          # stay standardised (per SD of X).
          - {id: x_type, label: "X is", type: select, required: true,
             choices: {score: "A score", binary: "Two groups or conditions"},
             default: score, default_source: "the design as most often planned; choose two groups for an experiment",
             sets: {score: [{path: variables.X.type, value: continuous}], binary: [{path: variables.X.type, value: binary}]}}
          - {id: X_levels, label: "X's two groups or conditions, separated by a comma (first the comparison group)", type: levels, path: variables.X.levels, required: true,
             shown_if: {field: x_type, is: binary}}
          - {id: x_prob, label: "Share of people in X's second group (0 to 1; empty = 0.5, equal groups)", type: number, path: population.x_prob, optional: true, empty_text: "0.5 (equal groups)", min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: x_type, is: binary}}
      - input: "Standardised paths, every forward path"
        generated: serial_paths
      - input: "Which indirect path the hypothesis is about"
        generated: target_path

  E13:
    methods_name: "a first-stage moderated mediation model (index of moderated mediation)"
    tool: power4mome
    departures: ["6", "8"]
    directional: false
    base: {spec_version: "0.1", design: moderated_mediation, template: process_7,
           variables: {X: {type: continuous}, W: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: index_of_moderated_mediation, method: monte_carlo_ci}}
    names: [X, W, M, "Y"]
    groups:
      - input: "Standardised paths, including the interaction XW -> M"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_W_M, label: "Path W -> M", type: number, path: "population.paths.W->M", effect: true}
          - {id: p_XW_M, label: "Path XW -> M (the interaction)", type: number, path: "population.paths.XW->M", effect: true}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
          - {id: c_X_W, label: "Correlation of X with W (optional; empty = 0, for example when X is randomised)", type: number, path: "population.correlations.X<->W", optional: true, min: -1, max: 1}

  E14:
    methods_name: "a second-stage moderated mediation model"
    tool: power4mome
    departures: ["6", "8"]
    directional: false
    base: {spec_version: "0.1", design: moderated_mediation, template: process_14,
           variables: {X: {type: continuous}, W: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: index_of_moderated_mediation, method: monte_carlo_ci}}
    names: [X, W, M, "Y"]
    groups:
      - input: "Standardised paths, including the interaction MW -> Y"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_W_Y, label: "Path W -> Y", type: number, path: "population.paths.W->Y", effect: true}
          - {id: p_MW_Y, label: "Path MW -> Y (the interaction)", type: number, path: "population.paths.MW->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
          - {id: c_X_W, label: "Correlation of X with W (optional; empty = 0)", type: number, path: "population.correlations.X<->W", optional: true, min: -1, max: 1}

  E40:
    methods_name: "a moderated mediation model with parallel mediators (index of moderated mediation)"
    tool: power4mome
    departures: ["6", "7", "8"]
    directional: false
    mediators: parallel
    base: {spec_version: "0.1", design: moderated_mediation, template: process_7,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: index_of_moderated_mediation, method: monte_carlo_ci}}
    names: [X, W, "Y"]
    groups:
      - input: "Which link W changes"
        fields:
          - {id: stage, label: "Which link depends on W", type: select, path: template, required: true, default: process_7,
             default_source: "the first-stage model (PROCESS model 7), as on the single-mediator cards' first choice",
             choices: {process_7: "The link from X to each mediator (PROCESS model 7)",
                       process_14: "The link from each mediator to the outcome (PROCESS model 14)"}}
      - input: "Standardised paths for each mediator, including the interactions with W"
        generated: modmed_paths
      - input: "Correlations between the mediators' residuals, and of X with W"
        generated: residual_correlations
        fields_after:
          - {id: c_X_W, label: "Correlation of X with W (optional; empty = 0, for example when X is randomised)", type: number, path: "population.correlations.X<->W", optional: true, min: -1, max: 1}
      - input: "Which mediator's index of moderated mediation the hypothesis is about"
        generated: modmed_target

  # Wave 2 (engine PR #51, 18 October 2026): one-way ANOVA, R-squared, one
  # proportion and McNemar. No smallest detectable effect yet: the engine
  # doesn't offer it for these.
  E18:
    sides: false
    methods_name: "a one-way between-subjects ANOVA"
    tool: Superpower
    departures: ["3", "17"]
    known_differences_if_method: {"5": kruskal_wallis}
    known_differences: ["5"]
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_between,
           variables: {A: {type: between_factor}, "Y": {type: continuous}},
           target_test: {effect: main_effect_A}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: A_label, label: "What the groups are (for example, condition)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (three or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected group means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "group means", label: "Means: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every group; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: test_version, is_not: welch_f}}
          - {id: sds, writeup_label: "group SDs", label: "SDs: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.sds, effect: true,
             shown_if: {field: test_version, is: welch_f},
             help: "In the same units as the means. Welch's F doesn't assume the groups vary equally."}
      - input: "The ANOVA, Welch's F, the Kruskal-Wallis test or pairwise comparisons"
        fields:
          - {id: test_version, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {anova_f: "One-way ANOVA (F test)", welch_f: "Welch's F test (the groups' SDs may differ), simulated", kruskal_wallis: "Kruskal-Wallis test (rank-based), simulated",
                       t_test: "Pairwise comparisons between groups (t-tests, adjusted for their number), simulated"},
             sets: {t_test: [{path: target_test.effect, value: pairwise}]},
             default: anova_f, default_source: "the F test Superpower computes (ANOVA_exact(), Superpower 0.2.4.1)"}
          - {id: comparison, label: "The pair you'll compare: two groups' names, separated by a comma", type: levels, path: target_test.comparison, required: true,
             shown_if: {field: test_version, is: t_test},
             help: "The t-test of this pair is the one powered; every pair is still compared, and the adjustment counts them all."}
          - {id: p_adjust, label: "Adjustment for the number of comparisons", type: select, path: target_test.p_adjust, required: true,
             shown_if: {field: test_version, is: t_test},
             choices: {holm: "Holm's method (never less power than Bonferroni's)", bonferroni: "Bonferroni's method", none: "None"},
             default: holm, default_source: "Holm's method, which never has less power than Bonferroni's (powerkit's choice; Superpower's default is no adjustment)"}
          - {id: score_shape, label: "The shape of the scores in each group", type: select, path: population.score_shape, required: true,
             shown_if: {field: test_version, is: kruskal_wallis},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_kruskal.test(), Spower 0.7)",
             help: "Every group has the same shape; the groups differ only by a shift (their means). A rank test's power depends on this shape; the parametric test's figure assumes normal scores."}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         shown_if: {field: test_version, is: anova_f},
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}

  # One-way repeated measures (27 October 2026): one within-participants
  # factor, one SD and one correlation for every pair of conditions, so
  # sphericity holds. No smallest detectable effect yet, as for E18.
  E54:
    sides: false
    methods_name: "a one-way repeated-measures ANOVA"
    tool: Superpower
    departures: ["3", "17"]
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_within,
           variables: {A: {type: within_factor}, "Y": {type: continuous}},
           target_test: {effect: main_effect_A, method: anova_f}}
    groups:
      - input: "Names of the conditions and the outcome"
        fields:
          - {id: A_label, label: "What the conditions are (for example, task difficulty or time)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The conditions' names (three or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected mean in each condition"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "condition means", label: "Means: one for each condition, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true}
      - input: "The SD"
        fields:
          - {id: spread, label: "Are the SD and the correlation the same in every condition?", type: select, required: true,
             choices: {same: "Yes: one SD, and one correlation for every pair of conditions", differ: "No: an SD for each condition and a correlation for each pair"},
             default: same, default_source: "one SD and one correlation, as Superpower's examples and G*Power's repeated-measures analysis take them",
             help: "When they differ, sphericity can fail: choose a correction below if you will report the corrected F test, and compare the MANOVA approach shown with the result."}
          - {id: sd, writeup_label: "SD", label: "SD (the same in every condition; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: spread, is_not: differ}}
          - {id: sds, writeup_label: "SDs", label: "SDs: one for each condition, in the same order, separated by commas (in the means' units)", type: numbers, per_levels: A_levels, path: population.sd, effect: true,
             shown_if: {field: spread, is: differ}}
      - input: "The correlation between any two conditions"
        fields:
          - {id: r, writeup_label: "correlation between conditions", label: "Correlation between people's scores in any two conditions (the same for every pair)", type: number, path: population.r, effect: true, min: -1, max: 1,
             shown_if: {field: spread, is_not: differ}}
          - {id: rs, writeup_label: "correlations between conditions", label: "Correlations: one for each pair of conditions, in the order (1, 2), (1, 3), ..., (2, 3), ..., separated by commas", type: numbers, path: population.r, effect: true,
             shown_if: {field: spread, is: differ},
             help: "With three conditions: first with second, first with third, second with third."}
          - {id: correction, label: "Sphericity correction of the F test", type: select, path: target_test.correction, required: true,
             shown_if: {field: spread, is: differ},
             choices: {none: "None", GG: "Greenhouse-Geisser", HF: "Huynh-Feldt"},
             default: none, default_source: "Superpower's default (ANOVA_exact(), Superpower 0.2.4.1), and G*Power's epsilon of 1"}
      - input: "The ANOVA, Friedman's test or pairwise comparisons"
        fields:
          - {id: test_version, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {anova_f: "One-way repeated-measures ANOVA (F test)", friedman: "Friedman's test (rank-based), simulated",
                       t_test: "Pairwise comparisons between conditions (paired t-tests, adjusted for their number), simulated"},
             sets: {t_test: [{path: target_test.effect, value: pairwise}]},
             default: anova_f, default_source: "the F test Superpower computes (ANOVA_exact(), Superpower 0.2.4.1)"}
          - {id: score_shape, label: "The shape of each person's scores around their own level", type: select, path: population.score_shape, required: true,
             shown_if: {field: test_version, is: friedman},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, as the ANOVA assumes",
             help: "Each score is the condition's mean, the person's own level and a deviation of this shape; the correlation between conditions is the share that is the person's, so it must be at least 0. Conditions differ only by a shift."}
          - {id: comparison, label: "The pair you'll compare: two conditions' names, separated by a comma", type: levels, path: target_test.comparison, required: true,
             shown_if: {field: test_version, is: t_test},
             help: "The t-test of this pair is the one powered; every pair is still compared, and the adjustment counts them all."}
          - {id: p_adjust, label: "Adjustment for the number of comparisons", type: select, path: target_test.p_adjust, required: true,
             shown_if: {field: test_version, is: t_test},
             choices: {holm: "Holm's method (never less power than Bonferroni's)", bonferroni: "Bonferroni's method", none: "None"},
             default: holm, default_source: "Holm's method, which never has less power than Bonferroni's (powerkit's choice; Superpower's default is no adjustment)"}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         shown_if: {field: test_version, is: anova_f},
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}

  # Mixed ANOVA beyond 2 x 2 (28 October 2026): one between factor by one
  # within factor, at least one with three or more levels; one SD and one
  # correlation, so sphericity holds. No smallest detectable effect yet.
  E55:
    sides: false
    methods_name: "a mixed ANOVA (between- by within-participants factor)"
    departures: ["3"]
    tool: Superpower
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: mixed,
           variables: {A: {type: between_factor}, B: {type: within_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "The groups of different people (for example, group)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names, separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "What everyone is measured in (for example, time)", type: text, path: variables.B.label, required: true}
          - {id: B_levels, label: "The timepoints' or conditions' names, separated by commas", type: levels, path: variables.B.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "cell means", label: "Means: one line per group, with one number per timepoint or condition, separated by commas", type: table, path: population.means, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "group", cols_name: "timepoint or condition"}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every cell; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The correlation between any two timepoints or conditions"
        fields:
          - {id: r, writeup_label: "correlation between timepoints or conditions", label: "Correlation between people's scores at any two timepoints or in any two conditions (the same for every pair)", type: number, path: population.r, effect: true, min: -1, max: 1}
      - input: "Which effect"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction: "The interaction: does the change differ between groups?", main_effect_A: "The groups' difference, averaged over time or conditions", main_effect_B: "The change over time or conditions, averaged over groups"}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}


  # Three-factor ANOVA (28 October 2026): three crossed factors, any mix of
  # between and within participants, the between factors listed first. One
  # SD; with a within factor, one correlation between every pair of a
  # participant's cells, so sphericity holds. No smallest detectable effect
  # yet, as for the two-factor designs.
  E56:
    sides: false
    methods_name: "a three-factor ANOVA"
    departures: ["3"]
    tool: Superpower
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: factorial_three,
           variables: {A: {type: between_factor}, B: {type: between_factor}, C: {type: between_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the three factors, their levels and the outcome"
        note: "List any factor with different people at each level first, then the factors everyone is measured in."
        fields:
          - {id: A_label, label: "First factor (for example, group)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The first factor's levels, separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "Second factor (for example, time)", type: text, path: variables.B.label, required: true}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true}
          - {id: C_label, label: "Third factor (for example, task difficulty)", type: text, path: variables.C.label, required: true}
          - {id: C_levels, label: "The third factor's levels, separated by commas", type: levels, path: variables.C.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "Which factors everyone is measured in"
        fields:
          - {id: within, label: "Which factors does everyone take part in at every level?", type: select, required: true,
             choices: {none: "None: different people in every combination",
                       C: "Only the third factor",
                       BC: "The second and third factors",
                       ABC: "All three: everyone takes part in every combination"},
             sets: {C: [{path: variables.C.type, value: within_factor}],
                    BC: [{path: variables.B.type, value: within_factor}, {path: variables.C.type, value: within_factor}],
                    ABC: [{path: variables.A.type, value: within_factor}, {path: variables.B.type, value: within_factor}, {path: variables.C.type, value: within_factor}]}}
      - input: "The expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "cell means", label: "Means: one line for each combination of the first and second factors (first factor's first level with each of the second factor's levels, then its second level, and so on), with one number per level of the third factor, separated by commas", type: table, path: population.means, effect: true,
             rows_from: [A_levels, B_levels], nest_by: B_levels, cols_from: C_levels,
             rows_name: "combination of the first and second factors", cols_name: "level of the third factor"}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every cell; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The correlation between any two conditions a person is measured in"
        fields:
          - {id: r, writeup_label: "correlation between repeated measurements", label: "Correlation between a person's scores in any two conditions (the same for every pair)", type: number, path: population.r, effect: true, min: -1, max: 1,
             shown_if: {field: within, is_not: none}}
      - input: "Which effect"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction_ABC: "The three-way interaction: does the two-way interaction of the first two factors depend on the third?",
                       interaction_AB: "The interaction of the first and second factors, averaged over the third",
                       interaction_AC: "The interaction of the first and third factors, averaged over the second",
                       interaction_BC: "The interaction of the second and third factors, averaged over the first",
                       main_effect_A: "The first factor, averaged over the others",
                       main_effect_B: "The second factor, averaged over the others",
                       main_effect_C: "The third factor, averaged over the others"}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}

  # Two-factor ANOVA, both factors within participants (2 x 2 or larger;
  # 28 October 2026): one SD and one correlation between every pair of
  # cells, so sphericity holds. No smallest detectable effect yet.
  E20:
    sides: false
    methods_name: "a two-factor within-participants ANOVA"
    departures: ["3"]
    tool: Superpower
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: factorial_within,
           variables: {A: {type: within_factor}, B: {type: within_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "First factor (for example, cue)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The first factor's levels, separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "Second factor (for example, delay)", type: text, path: variables.B.label, required: true}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "cell means", label: "Means: one line per level of the first factor, with one number per level of the second, separated by commas", type: table, path: population.means, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "level of the first factor", cols_name: "level of the second factor"}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every combination; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The correlation between any two conditions"
        fields:
          - {id: r, writeup_label: "correlation between conditions", label: "Correlation between people's scores in any two combinations of the factors (the same for every pair)", type: number, path: population.r, effect: true, min: -1, max: 1}
      - input: "Which effect"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction: "The interaction: does one factor's effect depend on the other?", main_effect_A: "The first factor, averaged over the second", main_effect_B: "The second factor, averaged over the first"}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}

  # Two-factor ANOVA, both factors between participants, beyond 2 x 2
  # (28 October 2026): equal cells, one SD. No smallest detectable effect
  # yet.
  E21:
    sides: false
    methods_name: "a two-factor between-participants ANOVA"
    departures: ["3"]
    tool: Superpower
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: factorial_between,
           variables: {A: {type: between_factor}, B: {type: between_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "First factor (for example, feedback)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The first factor's levels, separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "Second factor (for example, task difficulty)", type: text, path: variables.B.label, required: true}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "cell means", label: "Means: one line per level of the first factor, with one number per level of the second, separated by commas", type: table, path: population.means, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "level of the first factor", cols_name: "level of the second factor"}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every cell; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "Which effect"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction: "The interaction: does one factor's effect depend on the other?", main_effect_A: "The first factor, averaged over the second", main_effect_B: "The second factor, averaged over the first"}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}

  E23:
    sides: false
    methods_name: "an ANCOVA (Shieh's method)"
    tool: pwrss
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_ancova,
           variables: {A: {type: between_factor}, "Y": {type: continuous}},
           target_test: {effect: main_effect_A, method: ancova_f}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          # Two crossed factors (28 October 2026): the template follows the
          # choice, and the second factor's fields, the table of cell means
          # and the effect appear only for it.
          - {id: factors, label: "How the groups are formed", type: select, path: template, required: true,
             choices: {oneway_ancova: "By one factor (for example, three conditions)",
                       factorial_ancova: "By two factors crossed, different people in every combination (for example, condition by delivery)"},
             default: oneway_ancova, default_source: "one factor, the usual ANCOVA",
             sets: {oneway_ancova: [{path: target_test.effect, value: main_effect_A}],
                    factorial_ancova: [{path: variables.B.type, value: between_factor}]}}
          - {id: A_label, label: "What the groups are (for example, condition)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (two or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "The second factor (for example, delivery)", type: text, path: variables.B.label, required: true,
             shown_if: {field: factors, is: factorial_ancova}}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true,
             shown_if: {field: factors, is: factorial_ancova}}
          - {id: Y_label, label: "Outcome (for example, the after score)", type: text, path: variables.Y.label, required: true}
      - input: "The expected (adjusted) group means and SD"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "adjusted group means", label: "Means adjusted for the covariates: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true,
             shown_if: {field: factors, is_not: factorial_ancova}}
          - {id: cell_means, writeup_label: "adjusted cell means", label: "Means adjusted for the covariates: one line per level of the first factor, with one number per level of the second, separated by commas", type: table, path: population.means, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "level of the first factor", cols_name: "level of the second factor",
             shown_if: {field: factors, is: factorial_ancova}}
          - {id: sd, writeup_label: "SD", label: "SD of the outcome within each group, before adjusting (the same in every group; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction: "The interaction: does one factor's effect depend on the other?", main_effect_A: "The first factor, averaged over the second", main_effect_B: "The second factor, averaged over the first"},
             shown_if: {field: factors, is: factorial_ancova}}
      - input: "How much the covariate explains (R-squared), or its correlation with the outcome"
        fields:
          - {id: r2_covariates, writeup_label: "R-squared of the covariates", label: "R-squared: the share of the outcome's variance the covariates explain (for one covariate, its correlation with the outcome, squared)", type: number, path: population.r2_covariates, effect: true, min: 0, max_exclusive: 1}
          - {id: covariates, label: "Number of covariates", type: number, path: population.covariates, required: true, min: 1, integer: true,
             default: 1, default_source: "one covariate, such as the before score"}

  E24:
    sides: false
    methods_name: "a multiple regression F test"
    tool: pwrss
    directional: false
    base: {spec_version: "0.1", design: multiple_regression,
           variables: {"Y": {type: continuous}}, population: {metric: r_squared},
           target_test: {method: f_test}}
    groups:
      - input: "Your outcome's name and what you want to test"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
          - {id: question, label: "What you want to test", type: select, path: template, required: true,
             choices: {r2_zero: "Whether the predictors together explain anything (R-squared against 0)",
                       r2_increase: "Whether some predictors add to the others (R-squared increase; for one predictor's coefficient, test 1 predictor)"},
             sets: {r2_zero: [{path: target_test.effect, value: r_squared}],
                    r2_increase: [{path: target_test.effect, value: r_squared_change}]}}
      - input: "R-squared, or the R-squared change for the predictor(s) of interest"
        fields:
          - {id: r2, writeup_label: "R²", label: "R-squared of the model (0 to 1)", type: number, path: population.r2, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: question, is: r2_zero}}
          - {id: r2_full, writeup_label: "R² with all predictors", label: "R-squared with all the predictors (0 to 1)", type: number, path: population.r2_full, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: question, is: r2_increase}}
          - {id: r2_reduced, writeup_label: "R² without the tested predictors", label: "R-squared without the predictors you are testing (0 to 1; 0 if there are no others)", type: number, path: population.r2_reduced, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: question, is: r2_increase}}
      - input: "Number of predictors"
        fields:
          - {id: predictors, label: "Number of predictors", type: number, path: population.predictors, required: true, min: 1, integer: true,
             shown_if: {field: question, is: r2_zero}}
          - {id: predictors_total, label: "Number of predictors in the full model", type: number, path: population.predictors_total, required: true, min: 1, integer: true,
             shown_if: {field: question, is: r2_increase}}
          - {id: predictors_tested, label: "How many of them you are testing", type: number, path: population.predictors_tested, required: true, min: 1, integer: true,
             shown_if: {field: question, is: r2_increase}}

  E25:
    methods_name: "an exact binomial test of one proportion"
    tool: pwrss
    known_differences: ["2"]
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: one_proportion,
           variables: {"Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: proportion_vs_constant, method: exact_binomial}}
    groups:
      - input: "Your outcome's name"
        fields:
          - {id: Y_label, label: "Yes/no outcome (for example, guessed correctly)", type: text, path: variables.Y.label, required: true}
      - input: "The expected proportion"
        fields:
          - {id: p, writeup_label: "expected proportion of 'yes'", label: "Expected proportion of 'yes' (0 to 1)", type: number, path: population.p, effect: true, min_exclusive: 0, max_exclusive: 1}
      - input: "The fixed value"
        fields:
          - {id: p0, label: "The fixed proportion you compare it with (0 to 1; for example 0.5 for chance with two options)", type: number, path: population.p0, required: true, min_exclusive: 0, max_exclusive: 1}

  E26:
    methods_name: "an exact McNemar's test"
    tool: pwrss
    known_differences: ["2"]
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: mcnemar,
           variables: {X: {type: within_factor}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: paired_proportion_difference, method: mcnemar_exact}}
    groups:
      - input: "Names of the two conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are (for example, session)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "First condition", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Second condition", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Yes/no outcome (for example, passed)", type: text, path: variables.Y.label, required: true}
      - input: "The expected discordant proportions"
        fields:
          - {id: p_first_only, writeup_label: "proportion 'yes' in the first condition only", label: "Proportion of people who say 'yes' in the first condition only (0 to 1)", type: number, path: population.p_first_only, effect: true, min: 0, max: 1}
          - {id: p_second_only, writeup_label: "proportion 'yes' in the second condition only", label: "Proportion of people who say 'yes' in the second condition only (0 to 1)", type: number, path: population.p_second_only, effect: true, min: 0, max: 1}


  E36:
    # Equivalence tests: two one-sided tests (TOST) by TOSTER's exact
    # formula. One screen for the three comparisons TOSTER's power_t_TOST()
    # covers, and for a correlation (power_z_cor()) and two proportions
    # (power_twoprop()); the comparison sets the template.
    methods_name: "an equivalence test (two one-sided tests, TOST)"
    sides: false
    tool: TOSTER
    directional: false
    base: {spec_version: "0.1", design: equivalence_test,
           variables: {"Y": {type: continuous}}, population: {metric: standardised},
           target_test: {method: tost}}
    groups:
      - input: "What you are comparing, and the names"
        fields:
          - {id: comparison, label: "What you are comparing", type: select, path: template, required: true,
             choices: {tost_independent: "Two groups of different people",
                       tost_paired: "The same people measured twice (or in two conditions)",
                       tost_one_sample: "One group's mean against a fixed value",
                       tost_correlation: "A correlation between two things you measure",
                       tost_two_proportions: "Two groups' proportions (a yes/no outcome)",
                       noninf_independent: "Non-inferiority (no worse than, one direction): two groups of different people",
                       noninf_paired: "Non-inferiority: the same people in two conditions",
                       noninf_one_sample: "Non-inferiority: one group's mean against a reference value",
                       noninf_two_proportions: "Non-inferiority: two groups' proportions (a yes/no outcome)"},
             sets: {tost_independent: [{path: variables.X.type, value: binary}, {path: target_test.effect, value: mean_difference}],
                    tost_paired: [{path: variables.X.type, value: within_factor}, {path: target_test.effect, value: mean_difference}],
                    tost_one_sample: [{path: target_test.effect, value: mean}],
                    tost_correlation: [{path: variables.X.type, value: continuous}, {path: population.metric, value: r}, {path: target_test.effect, value: correlation}],
                    tost_two_proportions: [{path: variables.X.type, value: binary}, {path: variables.Y.type, value: binary}, {path: population.metric, value: proportion}, {path: target_test.effect, value: proportion_difference}],
                    noninf_independent: [{path: variables.X.type, value: binary}, {path: population.metric, value: standardised}, {path: target_test.effect, value: mean_difference}, {path: target_test.method, value: non_inferiority}],
                    noninf_paired: [{path: variables.X.type, value: within_factor}, {path: population.metric, value: standardised}, {path: target_test.effect, value: mean_difference}, {path: target_test.method, value: non_inferiority}],
                    noninf_one_sample: [{path: population.metric, value: standardised}, {path: target_test.effect, value: mean}, {path: target_test.method, value: non_inferiority}],
                    noninf_two_proportions: [{path: variables.X.type, value: binary}, {path: variables.Y.type, value: binary}, {path: population.metric, value: proportion}, {path: target_test.effect, value: proportion_difference}, {path: target_test.method, value: non_inferiority}]}}
          - {id: X_label, label: "What the groups or conditions are (for example, condition)", type: text, path: variables.X.label, required: true,
             shown_if: {field: comparison, is_one_of: [tost_independent, tost_paired, tost_two_proportions, noninf_independent, noninf_paired, noninf_two_proportions]}}
          - {id: X_level1, label: "First group or condition", type: text, path: variables.X.levels.1, required: true,
             shown_if: {field: comparison, is_one_of: [tost_independent, tost_paired, tost_two_proportions, noninf_independent, noninf_paired, noninf_two_proportions]}}
          - {id: X_level2, label: "Second group or condition", type: text, path: variables.X.levels.2, required: true,
             shown_if: {field: comparison, is_one_of: [tost_independent, tost_paired, tost_two_proportions, noninf_independent, noninf_paired, noninf_two_proportions]}}
          - {id: cor_X_label, label: "First variable", type: text, path: variables.X.label, required: true,
             shown_if: {field: comparison, is: tost_correlation}}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true,
             shown_if: {field: comparison, is_not: tost_correlation}}
          - {id: cor_Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true,
             shown_if: {field: comparison, is: tost_correlation}}
      - input: "The equivalence bound and the difference you expect: Cohen's d (d_z for the same people measured twice), or in your measure's own units"
        shown_if: {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}
        note: "The bound is the smallest difference that would matter: a true difference between minus and plus the bound counts as too small to matter. The expected difference is what you think the true difference is; 0 (no difference at all) is the most optimistic case, and the closer it is to the bound, the more people you need."
        fields:
          - {id: effect_units, label: "How you'll give the bound and the difference", type: select, path: population.metric,
             choices: {standardised: "As Cohen's d (d_z for the same people measured twice)", raw: "In my measure's own units: the bound, the expected means and the SD"},
             default: standardised, default_source: "standardised units, which TOSTER's power_t_TOST() takes with sd = 1 (TOSTER 0.8.6); powerkit works them out from the means and SD if you give those",
             shown_if: {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}}
          - {id: bound, label: "Equivalence bound (more than 0)", type: number, path: population.bound, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "equivalence bound (±)",
             shown_if: [{field: effect_units, is_not: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}]}
          - {id: d, label: "Expected true difference, as Cohen's d (0 = no difference)", type: number, path: population.d, effect: true, writeup_label: "expected Cohen's d",
             shown_if: [{field: effect_units, is_not: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is_not: tost_paired}]}
          - {id: dz, label: "Expected true difference, as d_z (0 = no difference)", type: number, path: population.dz, effect: true, writeup_label: "expected d_z",
             shown_if: [{field: effect_units, is_not: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_paired}]}
          - {id: raw_bound, label: "Equivalence bound, in your measure's units (more than 0)", type: number, path: population.raw.bound, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "equivalence bound (±)",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}]}
          - {id: raw_mean, label: "Expected mean", type: number, path: population.raw.mean, effect: true, writeup_label: "expected mean",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_one_sample}]}
          - {id: raw_test_value, label: "The fixed value it is compared with", type: number, path: population.raw.test_value, required: true, in_effect_text: true, writeup_label: "fixed value",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_one_sample}]}
          - {id: raw_mean_1, label: "Expected mean, first group or condition", type: number, path: population.raw.mean_1, effect: true, writeup_label: "first mean",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is_not: tost_one_sample}]}
          - {id: raw_mean_2, label: "Expected mean, second group or condition", type: number, path: population.raw.mean_2, effect: true, writeup_label: "second mean",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is_not: tost_one_sample}]}
          - {id: raw_sd, label: "SD: how much people usually vary on the measure (within a group)", type: number, path: population.raw.sd, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is_not: tost_paired}]}
          - {id: raw_sd_kind, label: "Which SD you know", type: select,
             choices: {difference: "The SD of people's changes (second minus first)", each: "The SD of the measure, and how strongly the two measurements correlate"},
             default: each, default_source: "the values researchers usually have from earlier studies (the SD of the measure and the test-retest correlation)",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_paired}]}
          - {id: raw_sd_difference, label: "SD of people's changes (second minus first)", type: number, path: population.raw.sd_difference, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD of the differences",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_paired}, {field: raw_sd_kind, is: difference}]}
          - {id: raw_sd_paired, label: "SD: how much people usually vary on the measure", type: number, path: population.raw.sd, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "SD",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_paired}, {field: raw_sd_kind, is_not: difference}]}
          - {id: raw_r, label: "Correlation between the two measurements", type: number, path: population.raw.r, required: true, min_exclusive: -1, max_exclusive: 1, in_effect_text: true, writeup_label: "correlation between the measurements",
             shown_if: [{field: effect_units, is: raw}, {field: comparison, is_one_of: [tost_independent, tost_paired, tost_one_sample]}, {field: comparison, is: tost_paired}, {field: raw_sd_kind, is_not: difference}]}
      - input: "For two groups: the size of group 2 relative to group 1 (1 = equal)"
        shown_if: {field: comparison, is: tost_independent}
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in TOSTER's power_t_TOST() (one n for both groups, TOSTER 0.8.6)",
             shown_if: {field: comparison, is: tost_independent}}
      - input: "For a correlation or two proportions: the equivalence bound and the value you expect"
        shown_if: {field: comparison, is_one_of: [tost_correlation, tost_two_proportions]}
        note: "The bound is the smallest difference that would matter; the expected value is what you think the truth is. The closer it is to the bound, the more people you need."
        fields:
          - {id: cor_bound, label: "Equivalence bound, as a correlation (between 0 and 1)", type: number, path: population.bound, required: true, min_exclusive: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "equivalence bound (±r)",
             shown_if: {field: comparison, is: tost_correlation}, help: "For example 0.2: a correlation between -0.2 and 0.2 counts as too small to matter."}
          - {id: cor_r, label: "Expected true correlation (0 = none)", type: number, path: population.r, effect: true, min_exclusive: -1, max_exclusive: 1, writeup_label: "expected correlation",
             shown_if: {field: comparison, is: tost_correlation}}
          - {id: prop_bound, label: "Equivalence bound, as a difference in proportions (between 0 and 1)", type: number, path: population.bound, required: true, min_exclusive: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "equivalence bound (±)",
             shown_if: {field: comparison, is: tost_two_proportions}, help: "For example 0.1: a difference of less than 10 percentage points either way counts as too small to matter."}
          - {id: p1, label: "Expected proportion, first group (0 to 1)", type: number, path: population.p1, required: true, min_exclusive: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "first group's proportion",
             shown_if: {field: comparison, is: tost_two_proportions}}
          - {id: p2, label: "Expected proportion, second group (0 to 1)", type: number, path: population.p2, effect: true, min_exclusive: 0, max_exclusive: 1, writeup_label: "second group's proportion",
             shown_if: {field: comparison, is: tost_two_proportions}, help: "Equal groups: TOSTER plans for the same number of people in each."}
      - input: "For non-inferiority: the margin, which direction is better, and the difference you expect"
        shown_if: {field: comparison, is_one_of: [noninf_independent, noninf_paired, noninf_one_sample, noninf_two_proportions]}
        note: "The margin is the largest difference in the wrong direction that would still be acceptable: the new condition counts as no worse if it is worse by less than this. Group 2 (the second condition) is the new one."
        fields:
          - {id: better, label: "Which values of the outcome are better", type: select, path: population.better, required: true,
             shown_if: {field: comparison, is_one_of: [noninf_independent, noninf_paired, noninf_one_sample, noninf_two_proportions]},
             choices: {higher: "Higher values are better (for example wellbeing, recovery)", lower: "Lower values are better (for example symptoms, relapse)"}}
          - {id: ni_margin, label: "Non-inferiority margin, as Cohen's d (d_z for the same people; more than 0)", type: number, path: population.margin, required: true, min_exclusive: 0, in_effect_text: true, writeup_label: "non-inferiority margin",
             shown_if: {field: comparison, is_one_of: [noninf_independent, noninf_paired, noninf_one_sample]}}
          - {id: ni_d, label: "Expected true difference, as Cohen's d (0 = no difference)", type: number, path: population.d, effect: true, writeup_label: "expected Cohen's d",
             shown_if: {field: comparison, is_one_of: [noninf_independent, noninf_one_sample]},
             help: "Group 2 minus group 1 (or the mean minus the reference value), over the SD. It must be better than minus the margin."}
          - {id: ni_dz, label: "Expected true difference, as d_z (0 = no difference)", type: number, path: population.dz, effect: true, writeup_label: "expected d_z",
             shown_if: {field: comparison, is: noninf_paired}}
          - {id: ni_prop_margin, label: "Non-inferiority margin, as a difference in proportions (between 0 and 1)", type: number, path: population.margin, required: true, min_exclusive: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "non-inferiority margin",
             shown_if: {field: comparison, is: noninf_two_proportions}, help: "For example 0.1: a proportion up to 10 percentage points worse counts as no worse."}
          - {id: ni_p1, label: "Expected proportion, group 1 (the comparison)", type: number, path: population.p1, required: true, min_exclusive: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "group 1's proportion",
             shown_if: {field: comparison, is: noninf_two_proportions}}
          - {id: ni_p2, label: "Expected proportion, group 2 (the new condition)", type: number, path: population.p2, effect: true, min_exclusive: 0, max_exclusive: 1, writeup_label: "group 2's proportion",
             shown_if: {field: comparison, is: noninf_two_proportions}}
          - {id: ni_allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, pwrss's default (n.ratio = 1, pwrss 0.3.1)",
             shown_if: {field: comparison, is_one_of: [noninf_independent, noninf_two_proportions]}}

  E48:
    sides: false
    methods_name: "a chi-square goodness-of-fit test"
    tool: pwrss
    directional: false
    base: {spec_version: "0.1", design: basic_test, template: chi_square_gof,
           variables: {"Y": {type: categorical}}, population: {metric: proportion},
           target_test: {effect: goodness_of_fit, method: pearson_chi_square}}
    groups:
      - input: "The categories of the variable"
        fields:
          - {id: Y_label, label: "Variable (for example, preferred study method)", type: text, path: variables.Y.label, required: true}
          - {id: Y_levels, label: "Its categories, separated by commas", type: levels, path: variables.Y.levels, required: true}
      - input: "The expected proportion in each category, and the fixed proportions they are compared with, or Cohen's w"
        fields:
          - {id: chisq_metric, label: "How you'll give the effect", type: select, path: population.metric,
             choices: {proportion: "As proportions", w: "As an effect size: Cohen's w, as in G*Power"},
             default: proportion, default_source: "the proportions, from which pwrss's probs.to.w() works out Cohen's w (pwrss 1.3.3); power.chisq.gof() itself takes w"}
          - {id: probabilities, writeup_label: "expected proportions", label: "Expected proportions: one for each category, in the same order, separated by commas (adding up to 1)", type: numbers, per_levels: Y_levels, path: population.probabilities, effect: true,
             shown_if: {field: chisq_metric, is_not: w}}
          - {id: null_probabilities, writeup_label: "proportions under the null hypothesis", label: "Fixed proportions to compare with (the null hypothesis), in the same order (optional; equal proportions if left empty)", type: numbers, per_levels: Y_levels, path: population.null_probabilities, optional: true,
             shown_if: {field: chisq_metric, is_not: w}}
          - {id: w, label: "Cohen's w", writeup_label: "Cohen's w", type: number, path: population.w, effect: true, min_exclusive: 0,
             help: "Cohen's w for the departure from the fixed proportions, as G*Power takes it (0.1 small, 0.3 medium, 0.5 large by Cohen's labels). The degrees of freedom are the number of categories minus 1. powerkit treats it as the true effect; a published value tends to be too large.",
             shown_if: {field: chisq_metric, is: w}}

  E29:
    methods_name: "a proportional-odds comparison of two groups on an ordinal outcome"
    tool: powertools
    directional: false
    base: {spec_version: "0.1", design: ordinal_regression, template: ordinal_two_groups,
           variables: {X: {type: binary}, "Y": {type: categorical}}, population: {metric: proportion},
           target_test: {effect: odds_ratio, method: proportional_odds}}
    groups:
      - input: "Names of the groups, the outcome and its categories in order"
        fields:
          - {id: X_label, label: "What the groups are (for example, condition)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome (for example, symptom severity)", type: text, path: variables.Y.label, required: true}
          - {id: Y_levels, label: "Its categories in order, lowest first, separated by commas", type: levels, path: variables.Y.levels, required: true}
      - input: "The share of group 1 in each category, and the odds ratio"
        fields:
          - {id: probabilities, writeup_label: "shares of group 1 in each category", label: "Share of group 1 in each category: one for each, in the same order, separated by commas (adding up to 1)", type: numbers, per_levels: Y_levels, path: population.probabilities, effect: true}
          - {id: odds_ratio, label: "Odds ratio: how many times higher the odds of a higher category are in group 2 than in group 1", type: number, path: population.odds_ratio, effect: true, min_exclusive: 0,
             help: "Below 1 if group 2 tends to be in lower categories. Power is the same for an odds ratio and its reciprocal (2 and 0.5)."}
      - input: "The size of group 2 relative to group 1 (1 = equal)"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in powertools' propodds(n.ratio = 1) (powertools 1.0.0)"}

  E47:
    methods_name: "a factorial logistic regression (Wald test of one effect)"
    tool: Spower
    directional: false
    base: {spec_version: "0.1", design: logistic_regression, template: factorial,
           variables: {A: {type: between_factor}, B: {type: between_factor}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {method: wald_chi_square}}
    groups:
      - input: "Names of the two factors, their levels and the yes/no outcome"
        fields:
          - {id: A_label, label: "First factor (for example, message frame)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The first factor's levels, separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "Second factor (for example, messenger)", type: text, path: variables.B.label, required: true}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true}
          - {id: Y_label, label: "Yes/no outcome (for example, booked a flu jab)", type: text, path: variables.Y.label, required: true}
      - input: "The expected proportion of 'yes' in each combination"
        fields:
          - {id: probabilities, writeup_label: "proportions of 'yes' in each cell", label: "Proportions of 'yes' (0 to 1): one line per level of the first factor, with one number per level of the second, separated by commas", type: table, path: population.probabilities, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "level of the first factor", cols_name: "level of the second factor"}
      - input: "Which effect"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction: "The interaction: does one factor's effect depend on the other?", main_effect_A: "The first factor, averaged over the second", main_effect_B: "The second factor, averaged over the first"}}

  E49:
    methods_name: "a test of two independent correlations (Fisher's z)"
    tool: pwrss
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: two_correlations,
           variables: {G: {type: binary}, X: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: correlation_difference, method: fisher_z}}
    groups:
      - input: "Names of the two groups and the two variables"
        fields:
          - {id: G_label, label: "What the groups are (for example, sample)", type: text, path: variables.G.label, required: true}
          - {id: G_level1, label: "Group 1", type: text, path: variables.G.levels.1, required: true}
          - {id: G_level2, label: "Group 2", type: text, path: variables.G.levels.2, required: true}
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
      - input: "The expected correlation in each group"
        fields:
          - {id: r1, writeup_label: "correlation in group 1", label: "Correlation r in group 1", type: number, path: population.r1, effect: true, min_exclusive: -1, max_exclusive: 1}
          - {id: r2, writeup_label: "correlation in group 2", label: "Correlation r in group 2", type: number, path: population.r2, effect: true, min_exclusive: -1, max_exclusive: 1}
      - input: "The size of group 2 relative to group 1"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwrss's power.z.twocors() (n.ratio = 1)"}

  # Variance tests: the chi-square and F distributions, as G*Power computes
  # them (engine, backend-variance.R; Known difference 4 no longer applies).
  # Variances, not SDs, because the spec holds variances; the help says how
  # to get one from an SD. Two groups are equal in size on this screen.
  E52:
    methods_name: "a chi-square test of one variance"
    tool: formula
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: one_variance,
           variables: {"Y": {type: continuous}}, population: {metric: variance},
           target_test: {effect: variance_ratio, method: chi_square_var}}
    groups:
      - input: "Your outcome's name"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected variance and the fixed value"
        fields:
          - {id: var, writeup_label: "expected variance", label: "Expected variance (the SD squared)", type: number, path: population.var, effect: true, min_exclusive: 0,
             help: "For example, an SD of 1.2 is a variance of 1.44."}
          - {id: var0, label: "The fixed variance you compare it with", type: number, path: population.var0, required: true, min_exclusive: 0,
             help: "For example, the variance of a published norm. A one-sided test predicting 'positive' says your group's variance is the larger."}

  E53:
    methods_name: "an F test of two variances"
    tool: formula
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: two_variances,
           variables: {G: {type: binary}, "Y": {type: continuous}}, population: {metric: variance},
           target_test: {effect: variance_ratio, method: f_var}}
    groups:
      - input: "Names of the two groups and the outcome"
        fields:
          - {id: G_label, label: "What the groups are (for example, training)", type: text, path: variables.G.label, required: true}
          - {id: G_level1, label: "Group 1", type: text, path: variables.G.levels.1, required: true}
          - {id: G_level2, label: "Group 2", type: text, path: variables.G.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected variance in each group"
        fields:
          - {id: var1, writeup_label: "variance in group 1", label: "Variance in group 1 (the SD squared)", type: number, path: population.var1, effect: true, min_exclusive: 0,
             help: "For example, an SD of 1.2 is a variance of 1.44. A one-sided test predicting 'positive' says group 1's variance is the larger."}
          - {id: var2, writeup_label: "variance in group 2", label: "Variance in group 2 (the SD squared)", type: number, path: population.var2, effect: true, min_exclusive: 0}

  # Two variances in the same people (the Pitman-Morgan test), simulated
  # with Spower's p_r() on the sum and the difference of the paired scores.
  E57:
    methods_name: "the Pitman-Morgan test of two paired variances"
    tool: Spower
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: paired_variances,
           variables: {X: {type: within_factor}, "Y": {type: continuous}}, population: {metric: variance},
           target_test: {effect: variance_ratio, method: pitman_morgan}}
    groups:
      - input: "Names of the two measurements and the outcome"
        fields:
          - {id: X_label, label: "What the measurements are (for example, session)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "First measurement", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Second measurement", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected variance at each measurement, and how strongly the two correlate"
        fields:
          - {id: var1, writeup_label: "variance at the first measurement", label: "Variance at the first measurement (the SD squared)", type: number, path: population.var1, effect: true, min_exclusive: 0,
             help: "For example, an SD of 50 ms is a variance of 2500. A one-sided test predicting 'positive' says the first measurement's variance is the larger."}
          - {id: var2, writeup_label: "variance at the second measurement", label: "Variance at the second measurement (the SD squared)", type: number, path: population.var2, effect: true, min_exclusive: 0}
          - {id: pm_r, writeup_label: "correlation between the measurements", label: "Correlation between the two measurements", type: number, path: population.r, required: true, min_exclusive: -1, max_exclusive: 1, in_effect_text: true,
             help: "How strongly people's scores at the two measurements go together, for example a test-retest correlation of 0.6."}

  # One-way MANOVA (Pillai's trace; Hotelling's T-squared with two groups),
  # simulated with Spower. The outcomes are named in one field; R/forms.R
  # (build_spec()) makes one variable of each, Y1 to Yp.
  E59:
    methods_name: "a one-way MANOVA (Pillai's trace; with two groups, Hotelling's T-squared)"
    tool: Spower
    directional: false
    known_differences: ["8"]
    # Two groups are calculated exactly (Hotelling's T-squared), as G*Power
    # does, so Known difference 8 is about three or more groups.
    known_differences_if_groups_above: {"8": 2}
    outcomes: Y_labels
    base: {spec_version: "0.1", design: basic_test, template: manova,
           variables: {A: {type: between_factor}}, population: {metric: raw},
           target_test: {effect: main_effect_A, method: pillai_trace}}
    groups:
      - input: "The groups and the outcomes"
        fields:
          - {id: A_label, label: "What the groups are (for example, condition)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (two or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: Y_labels, label: "The outcomes (two to nine), separated by commas", type: levels, required: true,
             help: "The scores compared together, for example anxiety, depression, stress."}
      - input: "The expected means on each outcome"
        fields:
          - {id: means, writeup_label: "group means", label: "Means: one line per group, with one number per outcome, separated by commas", type: table, path: population.means, effect: true,
             rows_from: A_levels, cols_from: Y_labels, rows_name: "group", cols_name: "outcome"}
      - input: "Each outcome's SD, and the correlation between the outcomes"
        fields:
          - {id: sds, writeup_label: "outcome SDs", label: "SDs: one for each outcome, in the same order, separated by commas", type: numbers, per_levels: Y_labels, path: population.sds, effect: true,
             help: "Within a group, in the means' units; the same in every group."}
          - {id: manova_r, writeup_label: "correlation between the outcomes", label: "Correlation between any two outcomes within a group (the same for every pair)", type: number, path: population.r, required: true, min_exclusive: -1, max_exclusive: 1, in_effect_text: true,
             help: "How strongly people's scores on two outcomes go together, for example 0.5 for related questionnaires."}

  # One-sample Hotelling's T-squared: one group's outcomes against fixed
  # values (scale norms, midpoints), computed exactly by its noncentral F
  # distribution (Anderson, 2003, section 5.4; engine backend-hotelling.R).
  # The outcomes are named in one field, as for E59, which makes one
  # variable of each, Y1 to Yp.
  E60:
    methods_name: "a one-sample Hotelling's T-squared test"
    tool: formula
    directional: false
    outcomes: Y_labels
    base: {spec_version: "0.1", design: basic_test, template: hotelling_one,
           population: {metric: raw},
           target_test: {effect: mean_vector, method: hotelling_t2}}
    groups:
      - input: "The outcomes"
        fields:
          - {id: Y_labels, label: "The outcomes (two to nine), separated by commas", type: levels, required: true,
             help: "The scores compared together, for example anxiety, depression, stress."}
      - input: "The expected means and the fixed values"
        fields:
          - {id: means, writeup_label: "expected means", label: "Expected means: one for each outcome, in the same order, separated by commas", type: numbers, per_levels: Y_labels, path: population.means, effect: true}
          - {id: mu0, writeup_label: "fixed values", label: "The fixed values they are compared with: one for each outcome, in the same order", type: numbers, per_levels: Y_labels, path: population.mu0, effect: true,
             help: "For example each scale's published norm or its midpoint, in the same units as the means."}
      - input: "Each outcome's SD, and the correlation between the outcomes"
        fields:
          - {id: sds, writeup_label: "outcome SDs", label: "SDs: one for each outcome, in the same order, separated by commas", type: numbers, per_levels: Y_labels, path: population.sds, effect: true}
          - {id: manova_r, writeup_label: "correlation between the outcomes", label: "Correlation between any two outcomes (the same for every pair)", type: number, path: population.r, required: true, min_exclusive: -1, max_exclusive: 1, in_effect_text: true,
             help: "How strongly people's scores on two outcomes go together, for example 0.5 for related questionnaires."}

  # A planned meta-analysis (metapower's mpower()): the test of the
  # average effect, with n the number of studies.
  E61:
    methods_name: "a meta-analysis (the z test of the average effect)"
    tool: metapower
    directional: true
    meta: true
    departures: ["18"]
    known_differences: ["9"]
    base: {spec_version: "0.1", design: meta_analysis, template: mean_effect,
           variables: {"Y": {type: continuous}},
           target_test: {effect: mean_effect, method: z_test}}
    groups:
      - input: "The outcome, and whether the studies give Cohen's d or a correlation"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
          - {id: meta_metric, label: "The effect size the studies give", type: select, path: population.metric, required: true,
             choices: {d: "Cohen's d: two groups compared in each study", r: "A correlation r"}, default: d,
             default_source: "Cohen's d, the first effect size metapower's mpower() takes (metapower 0.2.2)"}
      - input: "The average effect, the size of a typical study and the heterogeneity (I-squared)"
        fields:
          - {id: meta_effect, writeup_label: "average effect", label: "The average effect the meta-analysis should detect", type: number, path: population.effect, effect: true,
             help: "As Cohen's d, or as r. The smallest average effect that would matter, or one from an earlier review, reduced for publication bias."}
          - {id: study_size, label: "Participants in a typical study (both groups together for d)", type: number, path: population.study_size, required: true, min: 4, integer: true, in_effect_text: true, writeup_label: "participants per study",
             help: "Every study is taken to be this size; metapower splits it into two equal groups for d."}
          - {id: i2, label: "Heterogeneity, as I-squared (0 to just under 1)", type: number, path: population.i2, required: true, min: 0, max_exclusive: 1, in_effect_text: true, writeup_label: "I-squared",
             help: "The share of the variation between the studies' effects that isn't chance. Valentine, Pigott and Rothstein (2010), following Higgins and colleagues, describe 0.25, 0.5 and 0.75 as small, moderate and large degrees of heterogeneity."}
      - input: "The fixed-effect or the random-effects model, and the test"
        fields:
          - {id: meta_model, label: "Model", type: select, path: target_test.model, required: true,
             choices: {random: "Random effects: the studies' true effects differ", fixed: "Fixed effect: every study estimates the same effect"},
             default: random, default_source: "powerkit's choice: the random-effects model, which allows for the studies' true effects differing (metapower reports both)"}
          - {id: meta_test, label: "Test of the average effect", type: select, path: target_test.test, required: true,
             choices: {hartung_knapp: "Hartung-Knapp (recommended; simulated)", z: "z test (metapower's formula)"}, default: hartung_knapp,
             default_source: "powerkit's choice (Departure 18): the Hartung-Knapp test keeps false positives closer to alpha, especially with few studies (IntHout, Ioannidis & Borm, 2014)",
             help: "Plan with the test you will run. The z test is what metapower and many older meta-analyses use; it is too often significant when there are few studies.",
             shown_if: {field: meta_model, is: random}}

  # Logistic regression, one predictor (pwrss's Wald z test): a score X is
  # taken as standardised, so its odds ratio is per SD; a yes/no X compares
  # its second group with the first. Other predictors enter only through
  # X's R-squared with them (docs/conventions.md, Known difference 3).
  E27:
    methods_name: "a logistic regression (the Wald z test of one predictor)"
    tool: pwrss
    directional: true
    known_differences: ["3"]
    known_differences_if_above_zero: {"3": r2_other_predictors}
    base: {spec_version: "0.1", design: logistic_regression, template: single_predictor,
           variables: {X: {}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: odds_ratio},
           target_test: {effect: odds_ratio, method: wald_z}}
    groups:
      - input: "Your outcome, your predictor and what kind of predictor it is"
        fields:
          - {id: Y_label, label: "Yes/no outcome (for example, sought help)", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "Predictor", type: text, path: variables.X.label, required: true}
          - {id: X_type, label: "What kind of predictor", type: select, path: variables.X.type, required: true,
             choices: {continuous: "A score (for example, a questionnaire total)", binary: "A yes/no group (for example, treatment or control)"}}
          - {id: X_level1, label: "First group (the comparison group)", type: text, path: variables.X.levels.1, required: true,
             shown_if: {field: X_type, is: binary}}
          - {id: X_level2, label: "Second group", type: text, path: variables.X.levels.2, required: true,
             shown_if: {field: X_type, is: binary}}
      - input: "The odds ratio and the proportion of 'yes' at the starting point"
        fields:
          - {id: odds_ratio, writeup_label: "odds ratio", label: "Odds ratio", type: number, path: population.odds_ratio, effect: true, min_exclusive: 0,
             help: "For a score: how many times the odds of 'yes' change for each standard deviation higher on the predictor. For a group: the odds of 'yes' in the second group divided by the odds in the first. 1 means no effect."}
          - {id: base_prob, writeup_label: "proportion of 'yes' at the starting point", label: "Proportion of 'yes' at the starting point (0 to 1)", type: number, path: population.base_prob, effect: true, min_exclusive: 0, max_exclusive: 1,
             help: "For a score: the proportion at the predictor's average. For a group: the proportion in the first group."}
          - {id: x_prob, label: "Proportion of people in the second group (0 to 1)", type: number, path: population.x_prob, required: true, min_exclusive: 0, max_exclusive: 1,
             default: 0.5, default_source: "equal groups, the design spec's default (population > x_prob)",
             shown_if: {field: X_type, is: binary}}
      - input: "How much the other predictors overlap with this one"
        fields:
          - {id: r2_other, label: "R-squared of this predictor on the other predictors (0 to 1; 0 if there are no others)", type: number, path: population.r2_other_predictors, required: true, min: 0, max_exclusive: 1,
             default: 0, default_source: "no other predictors, the design spec's default (population > r2_other_predictors)",
             help: "How much of this predictor the other predictors in your model explain. Their own effects on the outcome aren't needed."}

  # Poisson regression, one predictor (pwrss's Wald z test): a score X is
  # taken as standardised, so its rate ratio is per SD; a yes/no X compares
  # its second group with the first. Events are counted over a mean
  # exposure; other predictors enter only through X's R-squared with them.
  E28:
    methods_name: "a Poisson regression (the Wald z test of one predictor)"
    tool: pwrss
    directional: true
    base: {spec_version: "0.1", design: poisson_regression, template: single_predictor_count,
           variables: {X: {}, "Y": {type: count}}, population: {metric: rate_ratio},
           target_test: {effect: rate_ratio, method: wald_z}}
    groups:
      - input: "Your outcome, your predictor and what kind of predictor it is"
        fields:
          - {id: Y_label, label: "Count outcome (for example, clinic visits in a year)", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "Predictor", type: text, path: variables.X.label, required: true}
          - {id: X_type, label: "What kind of predictor", type: select, path: variables.X.type, required: true,
             choices: {continuous: "A score (for example, a questionnaire total)", binary: "A yes/no group (for example, treatment or control)"}}
          - {id: X_level1, label: "First group (the comparison group)", type: text, path: variables.X.levels.1, required: true,
             shown_if: {field: X_type, is: binary}}
          - {id: X_level2, label: "Second group", type: text, path: variables.X.levels.2, required: true,
             shown_if: {field: X_type, is: binary}}
      - input: "The rate ratio, the starting rate and the time over which events are counted"
        fields:
          - {id: rate_ratio, writeup_label: "rate ratio", label: "Rate ratio", type: number, path: population.rate_ratio, effect: true, min_exclusive: 0,
             help: "For a score: how many times the rate of events changes for each standard deviation higher on the predictor. For a group: the rate in the second group divided by the rate in the first. 1 means no effect."}
          - {id: base_rate, writeup_label: "starting rate of events", label: "Starting rate: events per unit of time", type: number, path: population.base_rate, effect: true, min_exclusive: 0,
             help: "For a score: the expected count per unit of time at the predictor's average. For a group: in the first group."}
          - {id: mean_exposure, label: "Average time each person is followed, in those units", type: number, path: population.mean_exposure, required: true, min_exclusive: 0,
             default: 1, default_source: "one unit, so the starting rate is the expected count per person: the design spec's and pwrss's default (power.z.poisson(mean.exposure = 1))",
             help: "For example, with a rate per month and a year of follow-up, 12."}
          - {id: x_prob, label: "Proportion of people in the second group (0 to 1)", type: number, path: population.x_prob, required: true, min_exclusive: 0, max_exclusive: 1,
             default: 0.5, default_source: "equal groups, the design spec's default (population > x_prob)",
             shown_if: {field: X_type, is: binary}}
      - input: "How much the other predictors overlap with this one"
        fields:
          - {id: r2_other, label: "R-squared of this predictor on the other predictors (0 to 1; 0 if there are no others)", type: number, path: population.r2_other_predictors, required: true, min: 0, max_exclusive: 1,
             default: 0, default_source: "no other predictors, the design spec's default (population > r2_other_predictors)",
             help: "How much of this predictor the other predictors in your model explain. Their own effects on the outcome aren't needed."}

  # Cluster-randomised trial (powertools' crt.parallel.cont()): whole
  # groups assigned to two conditions, the same number in each; d over the
  # outcome's total SD; one ICC for both conditions; no covariates. The
  # total N is a whole number of groups (forms.R checks it via the engine).
  E34:
    # Three clustered designs on one screen; how the conditions are assigned
    # sets the template, and the outcome sets the function: powertools'
    # crt.parallel.cont(), multisite.cont() or irgtt.cont() for a score,
    # crt.parallel.bin(), multisite.bin() or irgtt.bin() for a yes/no
    # outcome.
    methods_name: "a clustered design (the test of the difference between conditions, allowing for the grouping)"
    tool: powertools
    departures: ["14"]
    sensitivity: true
    sensitivity_without_effect: true
    directional: true
    base: {spec_version: "0.1", design: cluster_trial,
           variables: {X: {type: binary}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean_difference}}
    groups:
      - input: "How the conditions are assigned, the outcome, and their names"
        fields:
          - {id: assignment, label: "Who is assigned to the conditions", type: select, path: template, required: true,
             choices: {cluster_randomised: "Whole groups: everyone in a group gets the same condition (a cluster-randomised trial)",
                       multisite: "People within each group: every group has people in both conditions, half in each (a multisite trial)",
                       group_treatment: "People one by one, and condition 2 is delivered in groups (for example, group therapy compared with individual treatment)"},
             sets: {cluster_randomised: [{path: target_test.method, value: cluster_t}],
                    multisite: [{path: target_test.method, value: multisite_t}],
                    group_treatment: [{path: target_test.method, value: cluster_t}]}}
          - {id: outcome_type, label: "What kind of outcome", type: select, path: population.metric, required: true,
             choices: {standardised: "A score (for example, a questionnaire total)",
                       proportion: "Yes/no (for example, passed or failed)"},
             default: standardised, default_source: "a score outcome, the design powerkit covered first",
             sets: {proportion: [{path: variables.Y.type, value: binary},
                                 {path: target_test.effect, value: odds_ratio, shown_if: {field: assignment, is_not: group_treatment}},
                                 {path: target_test.method, value: logistic_mixed, shown_if: {field: assignment, is_not: group_treatment}},
                                 {path: target_test.effect, value: proportion_difference, shown_if: {field: assignment, is: group_treatment}},
                                 {path: target_test.method, value: z_test, shown_if: {field: assignment, is: group_treatment}}]}}
          - {id: X_label, label: "What the conditions are (for example, programme)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Condition 1 (for example, usual lessons)", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Condition 2 (for example, the new programme)", type: text, path: variables.X.levels.2, required: true,
             help: "When only one condition is delivered in groups, make it condition 2."}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The effect: Cohen's d (the difference between conditions, over the outcome's total SD)"
        shown_if: {field: outcome_type, is: standardised}
        fields:
          - {id: d, label: "Cohen's d: (condition 2 minus condition 1) / the outcome's total SD", type: number, path: population.d, effect: true,
             shown_if: {field: outcome_type, is: standardised},
             help: "The total SD is how much people vary on the outcome across everyone, not only within one group."}
      - input: "How alike people in the same group are (the intraclass correlation), and how much the effect varies between groups"
        shown_if: {field: outcome_type, is: standardised}
        fields:
          - {id: icc, writeup_label: "intraclass correlation", label: "Intraclass correlation (ICC, 0 to 1)", type: number, path: population.icc, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: outcome_type, is: standardised},
             help: "The share of the outcome's variation that lies between groups rather than within them (when only condition 2 is in groups, within that condition). 0 means people in the same group are no more alike than strangers. Take it from earlier studies with similar groups and outcomes, and try a higher value too: the answer depends on it a lot."}
          - {id: icc_effect, writeup_label: "intraclass correlation of the effect", label: "How much the effect varies between groups, as a share of the outcome's variation (0 to 1)", type: number, path: population.icc_effect, effect: true, min: 0, max_exclusive: 1,
             shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is: multisite}],
             help: "0 means the conditions differ by the same amount in every group. Larger values mean the effect is bigger in some groups than others, which costs power. It is usually much smaller than the ICC above; if you have no estimate, try 0 and a small value such as 0.01."}
      - input: "A baseline score, such as a pre-test (optional)"
        shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is_not: group_treatment}]
        fields:
          - {id: adjust_baseline, label: "Will the analysis adjust for a baseline score?", type: select, required: true,
             shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is_not: group_treatment}],
             choices: {"no": "No", "yes": "Yes (for example, the same measure taken before the study)"},
             default: "no", default_source: "no covariates, powertools' default (ncov = 0, Rsq = 0)"}
          - {id: baseline_within, writeup_label: "share of the variance within groups explained by the baseline score", label: "How much of the differences between people in the same group the baseline explains (R-squared, 0 to below 1)", type: number, path: population.baseline_r2_within, required: true, min: 0, max_exclusive: 1,
             shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is_not: group_treatment}, {field: adjust_baseline, is: "yes"}],
             help: "If you know the correlation between the baseline and the outcome, square it: a correlation of 0.6 gives 0.36. Take it from earlier studies with the same measure; a guess that is too high overstates power."}
          - {id: baseline_between, writeup_label: "share of the variance between groups' averages explained by the baseline score", label: "How much of the differences between the groups' averages the baseline explains (R-squared, 0 to below 1)", type: number, path: population.baseline_r2_between, min: 0, max_exclusive: 1, copy_if_empty: baseline_within,
             shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is: cluster_randomised}, {field: adjust_baseline, is: "yes"}],
             help: "A group's average baseline often predicts its average outcome better than one person's baseline predicts theirs, so this can be higher than the value above. If you leave it empty, powerkit uses the same value as above, and the result says so."}
      - input: "Yes/no outcome: the proportion of 'yes' in each condition"
        shown_if: {field: outcome_type, is: proportion}
        fields:
          - {id: p1, writeup_label: "proportion in condition 1", label: "Proportion of 'yes' in condition 1 (0 to 1)", type: number, path: population.p1, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: outcome_type, is: proportion}}
          - {id: p2, writeup_label: "proportion in condition 2", label: "Proportion of 'yes' in condition 2 (0 to 1)", type: number, path: population.p2, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: outcome_type, is: proportion}}
      - input: "Yes/no outcome: how much the groups differ"
        shown_if: {field: outcome_type, is: proportion}
        fields:
          - {id: sigma_u_groups, writeup_label: "SD of the groups' log odds", label: "How much the groups' proportions differ: the SD of their log odds (above 0)", type: number, path: population.sigma_u, effect: true, min_exclusive: 0,
             shown_if: [{field: outcome_type, is: proportion}, {field: assignment, is: cluster_randomised}],
             help: "The groups' own rates of 'yes' vary around the average. On the log-odds scale, an SD of 0.3 means that, with 30% 'yes' on average, about 95% of groups would lie between roughly 19% and 44%. The R script prints powertools' table of these ranges for your proportions (crt.varexplore()), to check your value is plausible."}
          - {id: sigma_u_effect, writeup_label: "SD of the effect across groups (log odds ratio)", label: "How much the effect varies between groups: the SD of the log odds ratio (above 0)", type: number, path: population.sigma_u, effect: true, min_exclusive: 0,
             shown_if: [{field: outcome_type, is: proportion}, {field: assignment, is: multisite}],
             help: "Larger values mean the effect is bigger in some groups than others, which costs power. An SD of 0.3 means about 95% of groups' odds ratios would lie within a factor of about 1.8 either side of the average. The R script prints powertools' table of these ranges (ms.varexplore()). powertools needs a value above 0; if you expect the same effect everywhere, use a small one such as 0.1."}
          - {id: icc_grouped, writeup_label: "intraclass correlation", label: "Intraclass correlation in condition 2's groups (ICC, 0 to 1)", type: number, path: population.icc, effect: true, min: 0, max_exclusive: 1,
             shown_if: [{field: outcome_type, is: proportion}, {field: assignment, is: group_treatment}],
             help: "The share of the outcome's variation within condition 2 that lies between its groups. 0 means people in the same group are no more alike than strangers. Take it from earlier studies with similar groups, and try a higher value too."}
      - input: "How many people in each group (the cluster size), and how much that varies"
        fields:
          - {id: cluster_size, writeup_label: "participants per group", label: "People analysed in each group, both conditions together (the average, if sizes vary)", type: number, path: population.cluster_size, required: true, min: 2,
             shown_if: {field: assignment, is_not: group_treatment},
             help: "For example, pupils per class. The total number of participants is then a whole number of groups (with whole groups assigned, the same number of groups in each condition)."}
          - {id: cluster_size_grouped, writeup_label: "participants per group", label: "People analysed in each group of condition 2", type: number, path: population.cluster_size, required: true, min: 2, integer: true,
             shown_if: {field: assignment, is: group_treatment},
             help: "For example, members of each therapy group. Condition 1 gets as many people in all as condition 2, taking part individually."}
          - {id: cluster_size_sd, label: "How much group sizes vary: their SD (0 if all the same size)", type: number, path: population.cluster_size_sd, required: true, min: 0,
             shown_if: [{field: outcome_type, is: standardised}, {field: assignment, is_not: group_treatment}],
             default: 0, default_source: "groups of equal size, powertools' default (crt.parallel.cont(m.sd = 0) and multisite.cont(m.sd = 0), powertools 1.0.0)"}

  # Structural equation model fit (semPower's semPower.postHoc() with an
  # RMSEA): the chi-square test of exact fit, power to reject a model whose
  # population misfit is the RMSEA given. The model is a CFA (items and
  # factors; the engine counts its df) or any model given by its df.
  E37:
    methods_name: "the chi-square test of exact model fit (power to reject a model whose misfit is the RMSEA given)"
    tool: semPower
    directional: false
    sides: false
    base: {spec_version: "0.1", design: sem, variables: {}, population: {}, target_test: {}}
    groups:
      - input: "What you want to test"
        fields:
          - {id: question, label: "What you want to test", type: select, path: template, required: true,
             choices: {model_fit: "Whether the model fits (the test of exact fit, by RMSEA)",
                       invariance: "Whether a questionnaire measures the same thing in two groups (measurement invariance)",
                       factor_correlation: "Whether two factors are correlated",
                       latent_regression: "Whether latent variables predict another (a path in a structural model)"},
             sets: {model_fit: [{path: population.metric, value: rmsea}, {path: target_test.effect, value: model_fit}, {path: target_test.method, value: chi_square_exact_fit}],
                    invariance: [{path: population.metric, value: invariance}, {path: target_test.effect, value: invariance}, {path: target_test.method, value: chi_square_difference}],
                    factor_correlation: [{path: population.metric, value: factor_correlation}, {path: target_test.effect, value: factor_correlation}, {path: target_test.method, value: chi_square_difference}],
                    latent_regression: [{path: population.metric, value: standardised_slopes}, {path: target_test.effect, value: latent_slope}, {path: target_test.method, value: chi_square_difference}]}}
      - input: "Model fit: the number of items and factors (for a CFA), or the model's degrees of freedom"
        shown_if: {field: question, is: model_fit}
        fields:
          - {id: model_kind, label: "What kind of model", type: select, required: true,
             shown_if: {field: question, is: model_fit},
             choices: {cfa: "A confirmatory factor analysis (CFA): items, each measuring one factor",
                       df: "Another model: I know its degrees of freedom"}}
          - {id: indicators, writeup_label: "items", label: "Number of items (observed variables)", type: number, path: population.indicators, required: true, min: 3, integer: true,
             shown_if: [{field: question, is: model_fit}, {field: model_kind, is: cfa}],
             help: "For example, 12 questionnaire items."}
          - {id: factors, writeup_label: "factors", label: "Number of factors", type: number, path: population.factors, required: true, min: 1, integer: true,
             shown_if: [{field: question, is: model_fit}, {field: model_kind, is: cfa}],
             help: "The factors are allowed to correlate, and each item measures one factor. powerkit counts the model's degrees of freedom from these."}
          - {id: df, writeup_label: "degrees of freedom", label: "The model's degrees of freedom", type: number, path: population.df, required: true, min: 1, integer: true,
             shown_if: [{field: question, is: model_fit}, {field: model_kind, is: df}],
             help: "lavaan, Mplus and other SEM software report this when they fit the model (in lavaan, fitMeasures(fit, \"df\")). You can fit it to made-up data to get the number."}
      - input: "Model fit: the misfit to detect, as the model's RMSEA in the population"
        shown_if: {field: question, is: model_fit}
        fields:
          - {id: rmsea, writeup_label: "RMSEA", label: "RMSEA of the misfit to detect", type: number, path: population.rmsea, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: model_fit},
             help: "How wrong the model would have to be for you to want the test to notice. 0 would be a model that fits exactly; larger values are worse fit. Many studies use 0.05. A smaller value needs many more people."}
      - input: "Measurement invariance: the items, their loadings, and how the second group or occasion differs"
        shown_if: {field: question, is: invariance}
        fields:
          - {id: over, label: "Across what", type: select, path: population.over, required: true,
             shown_if: {field: question, is: invariance},
             choices: {groups: "Two groups of different people", occasions: "The same people on two occasions (longitudinal)"},
             default: groups, default_source: "two groups, as in semPower.powerMI() (semPower.powerLI() for occasions, semPower 2.2.0)"}
          - {id: level, label: "What you want to test", type: select, path: population.level, required: true,
             shown_if: {field: question, is: invariance},
             choices: {metric: "Metric invariance: do the items load equally in both groups?",
                       scalar: "Scalar invariance: do the items have the same intercepts (so means can be compared)?"}}
          - {id: mi_indicators, writeup_label: "items", label: "Number of items measuring the factor", type: number, path: population.indicators, required: true, min: 3, integer: true,
             shown_if: {field: question, is: invariance}}
          - {id: mi_loading, writeup_label: "loading", label: "Standardised loading of the items in group 1 (or on the first occasion)", type: number, path: population.loading, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: invariance},
             help: "A typical value for your items, for example 0.7. The items that don't differ have this loading in group 2 (or on the second occasion) too."}
          - {id: noninvariant, writeup_label: "items that differ", label: "How many items differ in group 2 (or on the second occasion)", type: number, path: population.noninvariant, required: true, min: 1, integer: true,
             shown_if: {field: question, is: invariance},
             help: "At least one item must be the same in both groups."}
          - {id: loading_group2, writeup_label: "loading in group 2", label: "Their standardised loading in group 2 (or on the second occasion)", type: number, path: population.loading_group2, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: [{field: question, is: invariance}, {field: level, is: metric}],
             help: "The smallest difference worth detecting: for example 0.5 where group 1's is 0.7."}
          - {id: intercept_difference, writeup_label: "intercept shift", label: "How far their intercepts are shifted in group 2 (or on the second occasion), in item SDs", type: number, path: population.intercept_difference, effect: true,
             shown_if: [{field: question, is: invariance}, {field: level, is: scalar}],
             help: "The smallest shift worth detecting, for example 0.3 (higher in group 2) or -0.3 (lower)."}
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in semPower's examples (semPower.powerMI(), semPower 2.2.0)",
             shown_if: [{field: question, is: invariance}, {field: over, is_not: occasions}]}
          - {id: stability, writeup_label: "correlation between occasions", label: "Correlation of the factor between the two occasions", type: number, path: population.stability, required: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: [{field: question, is: invariance}, {field: over, is: occasions}],
             help: "How stable people's standing on the factor is from one occasion to the next, for example 0.6."}
      - input: "Two factors: the items and loading of each, and their correlation"
        shown_if: {field: question, is: factor_correlation}
        fields:
          - {id: fc_items1, writeup_label: "items on factor 1", label: "Items measuring factor 1", type: number, path: population.indicators.1, required: true, min: 2, integer: true,
             shown_if: {field: question, is: factor_correlation}}
          - {id: fc_items2, writeup_label: "items on factor 2", label: "Items measuring factor 2", type: number, path: population.indicators.2, required: true, min: 2, integer: true,
             shown_if: {field: question, is: factor_correlation}}
          - {id: fc_loading1, writeup_label: "loading on factor 1", label: "Standardised loading of factor 1's items", type: number, path: population.loadings.1, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: factor_correlation}, help: "A typical value, for example 0.6."}
          - {id: fc_loading2, writeup_label: "loading on factor 2", label: "Standardised loading of factor 2's items", type: number, path: population.loadings.2, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: factor_correlation}}
          - {id: fc_r, writeup_label: "correlation", label: "Correlation between the factors", type: number, path: population.r, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: question, is: factor_correlation},
             help: "The correlation between the factors themselves (free of measurement error), not between their sum scores."}
      - input: "Latent regression: the slopes, the predictors' correlation, and the items"
        shown_if: {field: question, is: latent_regression}
        fields:
          - {id: slopes, writeup_label: "standardised slopes", label: "Standardised slope of each latent predictor, separated by commas", type: numbers, path: population.slopes, effect: true,
             shown_if: {field: question, is: latent_regression},
             help: "One to five predictors, for example 0.2, 0.3. The first is the one tested unless you choose another below."}
          - {id: tested, label: "Which slope is tested (1 = the first)", type: number, path: population.tested, required: true, min: 1, max: 5, integer: true,
             default: 1, default_source: "the first predictor, as in semPower.powerRegression() (nullWhich = 1, semPower 2.2.0)",
             shown_if: {field: question, is: latent_regression}}
          - {id: predictor_correlation, writeup_label: "correlation between the predictors", label: "Correlation between the predictors", type: number, path: population.predictor_correlation, required: true, min_exclusive: -1, max_exclusive: 1,
             default: 0, default_source: "uncorrelated predictors, as in semPower.powerRegression() (corXX = NULL, semPower 2.2.0)",
             shown_if: {field: question, is: latent_regression}}
          - {id: lr_indicators, writeup_label: "items per factor", label: "Items measuring each factor", type: number, path: population.indicators, required: true, min: 2, integer: true,
             shown_if: {field: question, is: latent_regression}, help: "The same for the outcome and every predictor."}
          - {id: lr_loading, writeup_label: "loading", label: "Standardised loading of every item", type: number, path: population.loading, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: latent_regression}, help: "A typical value, for example 0.6."}

  # Planned contrast (pwrss's t test of one weighted combination of the
  # group means, k.covariates = 0): equal groups, two-sided only, because
  # power.t.contrasts() has no one-sided option (docs/conventions.md).
  E19:
    methods_name: "a planned contrast (a t test of a weighted combination of the group means)"
    tool: pwrss
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_contrast,
           variables: {A: {type: between_factor}, "Y": {type: continuous}},
           target_test: {effect: contrast, method: contrast_t}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: A_label, label: "What the groups are (for example, condition)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (three or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected group means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "group means", label: "Means: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every group; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The contrast weights"
        fields:
          - {id: weights, writeup_label: "contrast weights", label: "Weights: one for each group, in the same order, adding up to 0", type: numbers, per_levels: A_levels, path: target_test.weights, required: true,
             help: "For example, with groups None, Neutral and Praise, -2, 1, 1 compares no feedback with both kinds of feedback; with four doses, -3, -1, 1, 3 tests a straight-line trend. Only the pattern matters, not the size of the numbers."}

  # Two dependent correlations (pwrss's Steiger z test, unpooled as in
  # G*Power: Departure 12). The first choice picks the template; the
  # variables' types follow from it (`sets`). A one-sided test runs in the
  # direction of the second correlation minus the first.
  E51:
    methods_name: "Steiger's z test of two dependent correlations"
    tool: pwrss
    directional: true
    departures: ["12"]
    base: {spec_version: "0.1", design: basic_test, population: {metric: correlation},
           target_test: {effect: correlation_difference, method: steiger_z}}
    groups:
      - input: "Which two correlations, and the variables' names"
        fields:
          - {id: comparison, label: "Which two correlations", type: select, path: template, required: true,
             choices: {overlapping_correlations: "Two that share a variable: X with Y, against X with Z",
                       nonoverlapping_correlations: "Two with no variable in common: X1 with Y1, against X2 with Y2 (for example, the same two measures at two ages)"},
             sets: {overlapping_correlations: [{path: variables.X.type, value: continuous}, {path: variables.Y.type, value: continuous}, {path: variables.Z.type, value: continuous}],
                    nonoverlapping_correlations: [{path: variables.X1.type, value: continuous}, {path: variables.Y1.type, value: continuous},
                                                  {path: variables.X2.type, value: continuous}, {path: variables.Y2.type, value: continuous}]}}
          - {id: X_label, label: "X, the shared variable", type: text, path: variables.X.label, required: true, shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: Y_label, label: "Y", type: text, path: variables.Y.label, required: true, shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: Z_label, label: "Z", type: text, path: variables.Z.label, required: true, shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: X1_label, label: "X1", type: text, path: variables.X1.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: Y1_label, label: "Y1", type: text, path: variables.Y1.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: X2_label, label: "X2", type: text, path: variables.X2.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: Y2_label, label: "Y2", type: text, path: variables.Y2.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
      - input: "The two correlations you are comparing"
        fields:
          - {id: r_X_Y, writeup_label: "first correlation (X with Y)", label: "First: X with Y", type: number, path: population.r_X_Y, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: r_X_Z, writeup_label: "second correlation (X with Z)", label: "Second: X with Z", type: number, path: population.r_X_Z, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: r_X1_Y1, writeup_label: "first correlation (X1 with Y1)", label: "First: X1 with Y1", type: number, path: population.r_X1_Y1, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_X2_Y2, writeup_label: "second correlation (X2 with Y2)", label: "Second: X2 with Y2", type: number, path: population.r_X2_Y2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
      - input: "The correlations between the other pairs of variables"
        fields:
          - {id: r_Y_Z, writeup_label: "correlation of Y with Z", label: "Y with Z", type: number, path: population.r_Y_Z, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: overlapping_correlations},
             help: "The higher this is, the more the two compared correlations move together, and the fewer people you need."}
          - {id: r_X1_X2, writeup_label: "correlation of X1 with X2", label: "X1 with X2", type: number, path: population.r_X1_X2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_Y1_Y2, writeup_label: "correlation of Y1 with Y2", label: "Y1 with Y2", type: number, path: population.r_Y1_Y2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_X1_Y2, writeup_label: "correlation of X1 with Y2", label: "X1 with Y2", type: number, path: population.r_X1_Y2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_Y1_X2, writeup_label: "correlation of Y1 with X2", label: "Y1 with X2", type: number, path: population.r_Y1_X2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}

  # Generic tests (G*Power's "Generic" tests): no sample size, because the
  # noncentrality already reflects it. Goals: the power for a noncentrality,
  # or the noncentrality needed for a target power (R/forms.R,
  # closing_groups()). Only t and z have a direction.
  E50:
    generic: true
    sides: false
    methods_name: "a generic test from a noncentrality parameter"
    tool: pwrss
    directional: true
    direction_shown_if: [{field: generic_test, is_not: f}, {field: generic_test, is_not: chi_square}]
    base: {spec_version: "0.1", design: generic_test, template: t, variables: {},
           population: {metric: noncentrality}, target_test: {effect: noncentrality, method: t_test}}
    groups:
      - input: "The test statistic"
        fields:
          - {id: generic_test, label: "Which test statistic", type: select, path: template, required: true,
             choices: {t: "t", f: "F", chi_square: "Chi-square", z: "z (standard deviation 1)"},
             default: t, default_source: "powerkit's first choice; pick the statistic your analysis reports",
             sets: {t: [{path: target_test.method, value: t_test}], f: [{path: target_test.method, value: f_test}],
                    chi_square: [{path: target_test.method, value: chi_square_test}], z: [{path: target_test.method, value: z_test}]}}
      - input: "The noncentrality parameter and the degrees of freedom"
        fields:
          - {id: ncp, writeup_label: "noncentrality parameter", label: "Noncentrality parameter (for z, the mean of the z statistic if the effect is real); needed for power", type: number, path: population.ncp, effect: true, optional_for: [sensitivity]}
          - {id: df, label: "Degrees of freedom", type: number, path: population.df, required: true, min_exclusive: 0,
             shown_if: [{field: generic_test, is_not: f}, {field: generic_test, is_not: z}]}
          - {id: df1, label: "Numerator degrees of freedom", type: number, path: population.df1, required: true, min_exclusive: 0,
             shown_if: {field: generic_test, is: f}}
          - {id: df2, label: "Denominator degrees of freedom", type: number, path: population.df2, required: true, min_exclusive: 0,
             shown_if: {field: generic_test, is: f}}
