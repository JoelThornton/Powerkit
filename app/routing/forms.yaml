  E8:
    scope_note: "This plans the specified mixed ANOVA. It is not a separately validated crossover analysis, and does not establish that period, sequence or carry-over effects can be ignored."
    sides: false
    methods_name: "a 2 × 2 mixed ANOVA"
    departures: ["2", "3"]
    tool: Superpower
    directional: false
    sensitivity: true
    base: {spec_version: "0.1", design: factorial_anova, template: 2x2_mixed,
           variables: {A: {type: between_factor}, B: {type: within_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "Between factor", help: "For example, group.", type: text, path: variables.A.label, required: true}
          - {id: A_level1, label: "Between factor, level 1", type: text, path: variables.A.levels.1, required: true}
          - {id: A_level2, label: "Between factor, level 2", type: text, path: variables.A.levels.2, required: true}
          - {id: B_label, label: "Within factor", help: "For example, time.", type: text, path: variables.B.label, required: true}
          - {id: B_level1, label: "Within factor, level 1", type: text, path: variables.B.levels.1, required: true}
          - {id: B_level2, label: "Within factor, level 2", type: text, path: variables.B.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The four expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: m11, label: "Mean: between level 1, within level 1", type: number, path: population.means.1.1, effect: true}
          - {id: m12, label: "Mean: between level 1, within level 2", type: number, path: population.means.1.2, effect: true}
          - {id: m21, label: "Mean: between level 2, within level 1", type: number, path: population.means.2.1, effect: true}
          - {id: m22, label: "Mean: between level 2, within level 2", type: number, path: population.means.2.2, effect: true}
      - input: "The SD"
        fields:
          - {id: spread, label: "Are the SD and correlation the same throughout?", type: select, required: true,
             choices: {same: "Yes: one SD, and one correlation between the two measurements", differ: "No: an SD for each cell and a correlation for each group"},
             default: same, default_source: "one SD and one correlation, as G*Power's repeated-measures analysis and Superpower's examples take them",
             help: "In both groups and at both measurements. Groups whose spread or consistency differs (for example, a treatment that makes people's change more variable) change the power, so give each cell's SD and each group's correlation if you expect them to differ."}
          - {id: sd, label: "SD (one value for all four cells)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: spread, is_not: differ}}
          - {id: s11, writeup_label: "SD, between level 1, within level 1", label: "SD: between level 1, within level 1", type: number, path: population.sd.1.1, effect: true, min_exclusive: 0, shown_if: {field: spread, is: differ}}
          - {id: s12, writeup_label: "SD, between level 1, within level 2", label: "SD: between level 1, within level 2", type: number, path: population.sd.1.2, effect: true, min_exclusive: 0, shown_if: {field: spread, is: differ}}
          - {id: s21, writeup_label: "SD, between level 2, within level 1", label: "SD: between level 2, within level 1", type: number, path: population.sd.2.1, effect: true, min_exclusive: 0, shown_if: {field: spread, is: differ}}
          - {id: s22, writeup_label: "SD, between level 2, within level 2", label: "SD: between level 2, within level 2", type: number, path: population.sd.2.2, effect: true, min_exclusive: 0, shown_if: {field: spread, is: differ}}
      - input: "The correlation between the two repeated measurements"
        fields:
          - {id: r, label: "Correlation between the two measurements", type: number, path: population.r, effect: true, min: -1, max: 1,
             shown_if: {field: spread, is_not: differ}}
          - {id: r1, writeup_label: "correlation between the measurements, between level 1", label: "Correlation between the two measurements: between level 1", type: number, path: population.r.1, effect: true, min: -1, max: 1, shown_if: {field: spread, is: differ}}
          - {id: r2, writeup_label: "correlation between the measurements, between level 2", label: "Correlation between the two measurements: between level 2", type: number, path: population.r.2, effect: true, min: -1, max: 1, shown_if: {field: spread, is: differ}}
      - input: "Which effect: between factor, within factor or the interaction"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {main_effect_A: "The between factor", main_effect_B: "The within factor", interaction: "The interaction"}}
      - input: "The F test, the aligned rank transform or a Bayes factor"
        fields:
          - {id: test_version, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {anova_f: "ANOVA (F test)", aligned_rank_transform: "Aligned rank transform ANOVA (rank-based), simulated", bayes_factor: "Bayes factor of the effect (an inclusion Bayes factor), instead of a p-value, simulated"},
             default: anova_f, default_source: "the F test Superpower computes (Superpower 0.2.4.1), as G*Power does"}
          - {id: evidence_threshold, label: "Evidence threshold: the inclusion Bayes factor the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: test_version, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)"}
          - {id: prior_scale, label: "Scale of the analysis prior on the effects (r scale, a Cauchy distribution)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: test_version, is: bayes_factor},
             default: 0.5, default_source: "BayesFactor's 'medium' r scale for fixed effects, 0.5, which JASP uses (jaspAnova's AdditionalOptions.qml); participants get JASP's r scale for random effects, 1"}
          - {id: inclusion, label: "How the effect's Bayes factor is averaged over the models", type: select, path: target_test.inclusion, required: true,
             shown_if: {field: test_version, is: bayes_factor},
             choices: {all_models: "Across all models", matched_models: "Across matched models (only models with and without the effect that otherwise match)"},
             default: all_models, default_source: "across all models with equal prior probabilities, the default of JASP's Effects table (jaspAnova's DefaultOptions.qml)",
             help: "Simulating this Bayes factor takes about a second per simulated study, so you get a rough preview here and an R script for the full analysis."}
          - {id: score_shape, label: "The shape of the scores in each cell", type: select, path: population.score_shape, required: true,
             shown_if: {field: test_version, is: aligned_rank_transform},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, as Spower's rank-test experiments default to (Spower 0.7)",
             help: "Each person's scores are their own level plus a deviation of this shape, so one correlation holds between any two of their scores (one per group in a 2 x 2 design). A rank test's power depends on this shape; the ANOVA's figure assumes normal scores."}
      - input: "The size of each group"
        fields:
          # options > group_ratio (decided 1 November 2026): unequal groups
          # are simulated with Spower and afex, since Superpower takes equal
          # groups only in a mixed design.
          - {id: group_sizes, label: "Will the two groups be the same size?", type: select, required: true,
             choices: {equal: "Yes, equal groups", unequal: "No: give their relative sizes"},
             default: equal, default_source: "equal groups, as Superpower and G*Power's repeated-measures analysis take them",
             help: "Unequal groups (for example twice as many in treatment as in control) usually lower the power of the group difference and the interaction. Their power is then found by simulation, which takes longer."}
          - {id: g1, writeup_label: "relative size of between level 1", label: "Group size (or ratio): between level 1", type: number, path: options.group_ratio.1, required: true, min: 1, integer: true,
             shown_if: {field: group_sizes, is: unequal}}
          - {id: g2, writeup_label: "relative size of between level 2", label: "Group size (or ratio): between level 2", type: number, path: options.group_ratio.2, required: true, min: 1, integer: true,
             shown_if: {field: group_sizes, is: unequal}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for the 2 x 2 designs (design spec, options > method)",
         shown_if: [{field: group_sizes, is_not: unequal}, {field: test_version, is: anova_f}]}

  E9:
    methods_name: "a moderated regression (continuous × continuous interaction)"
    tool: InteractionPoweR
    known_differences: ["1", "7"]
    # Known difference 1 is the simulation's (correlations); 7 is the
    # R-squared change route's (pwrss's fixed-model formula).
    known_differences_if_metric: {"1": correlation, "7": r2_change}
    # The smallest detectable effect: the interaction's correlation with Y,
    # by InteractionPoweR's fixed-model formula (the engine's
    # interactionpower_sensitivity()); labelled on the result screen.
    sensitivity: true
    directional: false
    base: {spec_version: "0.1", design: regression_interaction, template: two_way,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: interaction, method: ols_t}}
    names: [X, W, "Y"]
    groups:
      - input: "The interaction's size: the R-squared it adds, or the correlations of X, W and the interaction XW with Y"
        fields:
          # What researchers usually have first (8 November 2026): papers
          # and G*Power give the R-squared change; the correlations are
          # InteractionPoweR's inputs, for those who have them.
          - {id: interaction_metric, label: "What do you have for the interaction?", type: select, path: population.metric,
             choices: {r2_change: "The R-squared the interaction adds (its R-squared change), as papers and G*Power report it", correlation: "Correlations of X, W and the interaction XW with Y, and of X with W"},
             default: r2_change, default_source: "the R-squared change, as papers usually report an interaction and G*Power takes it; the correlations are InteractionPoweR's inputs (power_interaction(), InteractionPoweR 0.2.4)",
             help: "These inputs use different planning methods, so their answers can differ.",
             choice_notes: {r2_change: "Uses a fixed-model regression formula, with the interaction's R-squared change and the R-squared without it. It does not simulate newly sampled predictors.", correlation: "Simulates studies with newly sampled predictors. The smallest-detectable-effect goal still uses a formula approximation: check the proposed effect with a fixed-sample power simulation."}}
          - {id: r_X_Y, label: "Correlation of X with Y", type: number, path: population.r_X_Y, effect: true, min: -1, max: 1, shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: r_W_Y, label: "Correlation of W with Y", type: number, path: population.r_W_Y, effect: true, min: -1, max: 1, shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: r_XW_Y, label: "Correlation of the interaction XW with Y", type: number, path: population.r_XW_Y, effect: true, min: -1, max: 1, shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: r_X_W, label: "Correlation of X with W", type: number, path: population.r_X_W, effect: true, min: -1, max: 1, shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: r2_change, writeup_label: "R-squared change for the interaction", label: "R-squared the interaction adds (its R-squared change)", type: number, path: population.r2_change, effect: true,
             min_exclusive: 0, max_exclusive: 1, shown_if: {field: interaction_metric, is: r2_change},
             help: "The increase in R-squared when the product of X and W is added to a model with X and W. A published value tends to be too large."}
          - {id: r2_main, writeup_label: "R-squared of X and W", label: "R-squared of X and W without the interaction", type: number, path: population.r2_main, in_effect_text: true,
             optional: true, min: 0, max_exclusive: 1, shown_if: {field: interaction_metric, is: r2_change},
             help: "Empty means X and W explain none of the outcome before the interaction is added. For the same interaction R-squared change, this can give a larger planned sample than entering a positive value. It does not protect against an overestimated interaction or other wrong assumptions. Empty means 0."}
      - input: "Optional: reliability of X, W and Y"
        fields:
          - {id: rel_X, label: "Reliability of X", help: "Empty means perfectly reliable.", type: number, path: variables.X.reliability, optional: true, min_exclusive: 0, max: 1,
             shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: rel_W, label: "Reliability of W", help: "Empty means perfectly reliable.", type: number, path: variables.W.reliability, optional: true, min_exclusive: 0, max: 1,
             shown_if: {field: interaction_metric, is_not: r2_change}}
          - {id: rel_Y, label: "Reliability of Y", help: "Empty means perfectly reliable.", type: number, path: variables.Y.reliability, optional: true, min_exclusive: 0, max: 1,
             shown_if: {field: interaction_metric, is_not: r2_change}}

  E15:
    methods_name: "a moderated regression with a yes/no predictor or moderator"
    sensitivity: true
    tool: InteractionPoweR
    known_differences: ["1"]
    directional: false
    base: {spec_version: "0.1", design: regression_interaction, template: two_way,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: interaction, method: ols_t}}
    groups:
      - input: "Which variable is yes/no, and what you call X, W and Y"
        fields:
          # The yes/no variable is split 50/50 (InteractionPoweR's k.x1 or
          # k.x2 = 2; it has no unequal split for interactions).
          - {id: binary_role, label: "Which variable is two groups or conditions?", type: select, required: true,
             choices: {X: "X, the cause or predictor (for example, a training or control condition)", W: "W, the moderator (for example, two groups of people)"},
             sets: {X: [{path: variables.X.type, value: binary}, {path: variables.W.type, value: continuous}],
                    W: [{path: variables.X.type, value: continuous}, {path: variables.W.type, value: binary}]}}
          - {id: X_label, label: "X (the cause or predictor)", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "X's two groups or conditions, separated by a comma", type: levels, path: variables.X.levels, required: true,
             shown_if: {field: binary_role, is: X}}
          - {id: W_label, label: "W (the moderator)", type: text, path: variables.W.label, required: true}
          - {id: W_levels, label: "W's two groups, separated by a comma", type: levels, path: variables.W.levels, required: true,
             shown_if: {field: binary_role, is: W}}
          - {id: Y_label, label: "Y (the outcome)", type: text, path: variables.Y.label, required: true}
      - input: "Correlations: X with Y, W with Y, the interaction XW with Y, and X with W"
        fields:
          - {id: r_X_Y, label: "Correlation of X with Y (for a yes/no X, the point-biserial correlation)", type: number, path: population.r_X_Y, effect: true, min: -1, max: 1}
          - {id: r_W_Y, label: "Correlation of W with Y (for a yes/no W, the point-biserial correlation)", type: number, path: population.r_W_Y, effect: true, min: -1, max: 1}
          - {id: r_XW_Y, optional_for: [sensitivity], label: "Correlation of the interaction XW with Y", type: number, path: population.r_XW_Y, effect: true, min: -1, max: 1}
          - {id: r_X_W, label: "Correlation of X with W (0 when X is a randomised condition)", type: number, path: population.r_X_W, effect: true, min: -1, max: 1}
      - input: "Optional: reliability of the score variable and of Y"
        fields:
          # Not for the yes/no variable: misclassification isn't the same as
          # unreliable scores (decided 16 October 2026; judgement call B8,
          # decided 29 October 2026).
          - {id: rel_X, label: "Reliability of X", help: "Empty means perfectly reliable.", type: number, path: variables.X.reliability, optional: true, min_exclusive: 0, max: 1,
             shown_if: {field: binary_role, is: W}}
          - {id: rel_W, label: "Reliability of W", help: "Empty means perfectly reliable.", type: number, path: variables.W.reliability, optional: true, min_exclusive: 0, max: 1,
             shown_if: {field: binary_role, is: X}}
          - {id: rel_Y, label: "Reliability of Y", help: "Empty means perfectly reliable.", type: number, path: variables.Y.reliability, optional: true, min_exclusive: 0, max: 1}

  E31:
    methods_name: "a three-way regression interaction"
    sensitivity: true
    tool: InteractionPoweR
    known_differences: ["17"]
    directional: false
    base: {spec_version: "0.1", design: regression_interaction, template: three_way,
           variables: {X: {type: continuous}, W: {type: continuous}, Z: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: three_way_interaction, method: ols_t}}
    names: [X, W, Z, "Y"]
    groups:
      - input: "Correlations of X, W, Z and Y, and of the products XW, XZ and WZ with Y"
        fields:
          - {id: r_X_Y, label: "Correlation of X with Y", type: number, path: population.r_X_Y, effect: true, min: -1, max: 1}
          - {id: r_W_Y, label: "Correlation of W with Y", type: number, path: population.r_W_Y, effect: true, min: -1, max: 1}
          - {id: r_Z_Y, label: "Correlation of Z with Y", type: number, path: population.r_Z_Y, effect: true, min: -1, max: 1}
          - {id: r_XW_Y, label: "Correlation of the product XW with Y", type: number, path: population.r_XW_Y, effect: true, min: -1, max: 1}
          - {id: r_XZ_Y, label: "Correlation of the product XZ with Y", type: number, path: population.r_XZ_Y, effect: true, min: -1, max: 1}
          - {id: r_WZ_Y, label: "Correlation of the product WZ with Y", type: number, path: population.r_WZ_Y, effect: true, min: -1, max: 1}
          - {id: r_X_W, label: "Correlation of X with W", type: number, path: population.r_X_W, effect: true, min: -1, max: 1}
          - {id: r_X_Z, label: "Correlation of X with Z", type: number, path: population.r_X_Z, effect: true, min: -1, max: 1}
          - {id: r_W_Z, label: "Correlation of W with Z", type: number, path: population.r_W_Z, effect: true, min: -1, max: 1}
      - input: "The three-way effect (coefficient of the product of the standardised X, W and Z)"
        fields:
          - {id: b_XWZ, optional_for: [sensitivity], label: "Coefficient of the product XWZ of standardised X, W and Z", type: number, path: population.b_XWZ, effect: true, min_exclusive: -1, max_exclusive: 1,
             help: "How much the XW interaction changes per SD of Z, in SD units of Y: the coefficient of x*w*z after Y, X, W and Z are each standardised, which is what a regression on standardised scores reports (InteractionPoweR's b.x1x2x3). The product itself is not standardised again, so with correlated X, W and Z this is a little smaller than the product's fully standardised coefficient. Small three-way effects (around 0.05 to 0.1) need large samples."}
      - input: "Optional: reliability of X, W, Z and Y"
        fields:
          - {id: rel_X, label: "Reliability of X", help: "Empty means perfectly reliable.", type: number, path: variables.X.reliability, optional: true, min_exclusive: 0, max: 1}
          - {id: rel_W, label: "Reliability of W", help: "Empty means perfectly reliable.", type: number, path: variables.W.reliability, optional: true, min_exclusive: 0, max: 1}
          - {id: rel_Z, label: "Reliability of Z", help: "Empty means perfectly reliable.", type: number, path: variables.Z.reliability, optional: true, min_exclusive: 0, max: 1}
          - {id: rel_Y, label: "Reliability of Y", help: "Empty means perfectly reliable.", type: number, path: variables.Y.reliability, optional: true, min_exclusive: 0, max: 1}

  E10:
    methods_name: "a simple mediation model"
    sensitivity: true
    tool: power4mome
    departures: ["6", "8"]
    known_differences: ["14"]
    known_differences_if_method: {"14": monte_carlo_ci}
    directional: false
    base: {spec_version: "0.1", design: mediation, template: process_4,
           variables: {X: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, path: "X->M->Y", method: monte_carlo_ci}}
    names: [X, M, "Y"]
    groups:
      - input: "Standardised paths X -> M, M -> Y and X -> Y"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
      # An expert setting: in Settings, not in the card's list of what you need.
      - title: "Monte Carlo draws"
        fields:
          - {id: ci_draws, label: "Monte Carlo draws per interval", help: "Optional: empty means 1,000, power4mome's default for q_power_mediation().", type: number, path: options.ci_draws, optional: true, empty_text: "1,000 (power4mome's default)", min: 100, max: 100000, integer: true}

  E16:
    methods_name: "a simple mediation model with a yes/no X"
    sensitivity: true
    tool: power4mome
    departures: ["6", "8"]
    known_differences: ["14"]
    known_differences_if_method: {"14": monte_carlo_ci}
    directional: false
    base: {spec_version: "0.1", design: mediation, template: process_4,
           variables: {X: {type: binary}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, path: "X->M->Y", method: monte_carlo_ci}}
    names: [X, M, "Y"]
    groups:
      - input: "X's two groups or conditions, and the share in each"
        fields:
          - {id: X_levels, label: "X's two groups or conditions", help: "Separated by a comma, the comparison group first.", type: levels, path: variables.X.levels, required: true}
          - {id: x_prob, label: "Share of people in X's second group (0 to 1; empty = 0.5, equal groups)", type: number, path: population.x_prob, optional: true, empty_text: "0.5 (equal groups)", min_exclusive: 0, max_exclusive: 1}
      - input: "X's effects, and the path M -> Y"
        fields:
          - {id: x_effects, label: "Give X's effects as", type: select, required: true,
             choices: {paths: "Standardised paths, per SD of X (as power4mome takes them)", d: "Cohen's d of the groups: the difference between the groups' means, in standard deviations"},
             default: paths, default_source: "power4mome's own input, the paths per SD of X",
             help: "With Cohen's d, Powerkit finds the paths that give these differences between the groups, from a simulated sample of 100,000 people, and shows them with the result."}
          - {id: d_M, writeup_label: "Cohen's d of the groups on M", help: "How far apart the groups' means on M are, in standard deviations.", label: "Cohen's d of the groups on M", type: number, path: population.group_d.M, effect: true,
             shown_if: {field: x_effects, is: d}}
          - {id: d_Y, writeup_label: "Cohen's d of the groups on Y overall", help: "Through M as well as directly, in standard deviations.", label: "Cohen's d of the groups on Y overall", type: number, path: population.group_d.Y, effect: true,
             shown_if: {field: x_effects, is: d}}
          - {id: p_X_M, label: "Path X -> M (per SD of X; the result shows the group difference it means)", type: number, path: "population.paths.X->M", effect: true,
             shown_if: {field: x_effects, is_not: d}}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true,
             shown_if: {field: x_effects, is_not: d}}
      # An expert setting: in Settings, not in the card's list of what you need.
      - title: "Monte Carlo draws"
        fields:
          - {id: ci_draws, label: "Monte Carlo draws per interval", help: "Optional: empty means 1,000, power4mome's default for q_power_mediation().", type: number, path: options.ci_draws, optional: true, empty_text: "1,000 (power4mome's default)", min: 100, max: 100000, integer: true}

  # Mediation with X in three or more groups (E42): dummy-coded relative
  # indirect effects (Hayes & Preacher, 2014), simulated with Spower,
  # fitted with lavaan, each tested by manymome's Monte Carlo interval.
  E42:
    methods_name: "a mediation model with a multicategorical X (dummy-coded relative indirect effects)"
    tool: Spower
    departures: ["6"]
    known_differences: ["14"]
    directional: false
    base: {spec_version: "0.1", design: mediation, template: multicategorical,
           variables: {X: {type: categorical}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, path: "X->M->Y", method: monte_carlo_ci}}
    names: [X, M, "Y"]
    groups:
      - input: "X's groups or conditions, the first the reference group"
        fields:
          - {id: X_levels, label: "X's groups or conditions", type: levels, path: variables.X.levels, required: true,
             help: "Separated by commas. List first the reference group, such as a control condition, that each other group is compared with. Each group after the first gets a dummy variable, as PROCESS codes a multicategorical X by default, and its own relative indirect effect: its difference from the first group carried through M. The groups are equal in size."}
      - input: "Each group's difference from the first on M, the path M -> Y, and the direct effects"
        fields:
          - {id: mcx_m_differences, writeup_label: "Cohen's d of each group against the first on M", label: "Each group's difference from the first on M", help: "Cohen's d of each group after the first against the first on M, in the same order, separated by commas.", type: numbers, per_later_levels: X_levels, path: population.m_differences, effect: true}
          - {id: mcx_b, writeup_label: "the path M -> Y within groups", label: "Path from M to Y within groups", help: "Standardised: the correlation of M and Y within a group.", type: number, path: population.b, effect: true, min_exclusive: -1, max_exclusive: 1}
          - {id: mcx_direct, writeup_label: "each group's direct effect on Y", label: "Each group's direct effect on Y", help: "Each group's difference from the first on Y, holding M, in Y's within-group SDs, separated by commas. Optional: empty means 0 for every group.", type: numbers, per_later_levels: X_levels, path: population.direct_differences, optional: true, empty_text: "0 for every group"}
          - {id: mcx_group, label: "Group whose indirect effect must be significant", type: text, path: target_test.group, optional: true, empty_text: "every group's (all must be significant)",
             help: "Optional: empty means every group's, all of them. Give the name of one group after the first to plan for its comparison alone. With every group, a study succeeds only when every relative indirect effect is significant, which needs more people."}
      # An expert setting: in Settings, not in the card's list of what you need.
      - title: "Monte Carlo draws"
        fields:
          - {id: ci_draws, label: "Monte Carlo draws per interval", help: "Optional: empty means 1,000, as for the other mediation cards.", type: number, path: options.ci_draws, optional: true, empty_text: "1,000", min: 100, max: 100000, integer: true}

  # Mediation with a yes/no mediator (E39): regression-based causal
  # mediation analysis (Valeri & VanderWeele, 2013) by regmedint, simulated
  # with Spower; the natural indirect effect tested by the delta method.
  E39:
    methods_name: "regression-based causal mediation analysis with a yes/no mediator (the natural indirect effect)"
    tool: Spower
    directional: false
    base: {spec_version: "0.1", design: mediation, template: binary_mediator,
           variables: {M: {type: binary}}, population: {metric: odds_ratio},
           target_test: {effect: indirect_effect, path: "X->M->Y", method: delta_method}}
    names: [X, M, "Y"]
    groups:
      - input: "What X, the mediator and the outcome are"
        fields:
          - {id: binm_x, label: "X is", type: select, path: variables.X.type, required: true,
             choices: {binary: "Two conditions or groups (for example, a reminder or none)", continuous: "A score"},
             default: binary, default_source: "two conditions, the usual design for mediation of an intervention"}
          - {id: X_levels, label: "The two conditions or groups", help: "Separated by commas, the comparison group first. The people are split equally between them.", type: levels, path: variables.X.levels, required: true,
             shown_if: {field: binm_x, is: binary}}
          - {id: binm_m, label: "The mediator is", type: select, path: template, required: true,
             choices: {binary_mediator: "Yes or no (for example, booked an appointment or not)", ordinal_mediator: "Ordered categories (for example, a rating from 'unlikely' to 'certain')"},
             sets: {ordinal_mediator: [{path: variables.M.type, value: categorical}, {path: population.metric, value: latent_response}]},
             default: binary_mediator, default_source: "a yes/no mediator, the card's first version",
             choice_notes: {ordinal_mediator: "The categories are treated as cut from an underlying score, the usual structural equation model for an ordered variable (lavaan, as in Mplus). Powerkit tests the indirect effect through that score."}}
          - {id: M_levels, label: "The mediator's two answers", type: levels, path: variables.M.levels, required: true,
             shown_if: {field: binm_m, is_not: ordinal_mediator},
             help: "Separated by commas: the 'no' first, then the 'yes'. For example: No, Yes, or Did not book, Booked. The paths below are about the second answer."}
          - {id: ordm_levels, label: "The mediator's categories", type: levels, path: variables.M.levels, required: true,
             shown_if: {field: binm_m, is: ordinal_mediator},
             help: "Lowest first, separated by commas (three or more). For example: Unlikely, Unsure, Likely, Certain."}
          - {id: binm_y, label: "The outcome is", type: select, path: variables.Y.type, required: true,
             choices: {continuous: "A score", binary: "Yes or no"},
             default: continuous, default_source: "a score, the usual outcome"}
      - input: "How X changes the mediator, and how the mediator changes the outcome"
        fields:
          - {id: binm_m_baseline, writeup_label: "the chance of the mediator in the comparison group", label: "Chance of 'yes' on the mediator at baseline", help: "In the first group (or at X's average, for a score), from 0 to 1.", type: number, path: population.m_baseline, required: true, min_exclusive: 0, max_exclusive: 1, baseline: true,
             shown_if: {field: binm_m, is_not: ordinal_mediator}}
          - {id: binm_m_or, writeup_label: "the odds ratio of the mediator for X", label: "X's odds ratio on the mediator (path a)", help: "The odds ratio of the mediator being 'yes': the second group against the first, or per SD of a score.", type: number, path: population.m_odds_ratio, effect: true, min_exclusive: 0,
             shown_if: {field: binm_m, is_not: ordinal_mediator}}
          - {id: ordm_m_probabilities, writeup_label: "the share of each mediator category in the comparison group", label: "Share in each mediator category", type: numbers, per_levels: ordm_levels, path: population.m_probabilities, required: true, baseline: true,
             shown_if: {field: binm_m, is: ordinal_mediator},
             help: "In the first group (or at X's average, for a score), in the same order as the categories, separated by commas, adding up to 1. For example, 0.3, 0.3, 0.25, 0.15. From a pilot or an earlier study with the same question, if you can."}
          - {id: ordm_a, writeup_label: "X's effect on the mediator's underlying score", label: "X's effect on the mediator (path a)", type: number, path: population.a, effect: true,
             shown_if: {field: binm_m, is: ordinal_mediator},
             help: "On the mediator's underlying score, in its SD: the second group against the first, or per SD of a score. Like Cohen's d on the score the categories are cut from: 0.4 moves everyone's score up by 0.4 SD, so more people in the second group fall in the higher categories. It is the coefficient an ordered probit regression of the mediator on X estimates."}
          - {id: ordm_b, writeup_label: "the outcome's change per SD of the mediator's underlying score", label: "Mediator's effect on the outcome (path b)", help: "The change in the outcome per SD of the mediator's underlying score, at the same X: in the outcome's SD for a score, on its underlying scale for yes or no.", type: number, path: population.b, effect: true,
             shown_if: {field: binm_m, is: ordinal_mediator}}
          - {id: ordm_direct, writeup_label: "the direct effect of X", label: "X's direct effect on the outcome", help: "Holding the mediator, on the same scale. Optional: empty means 0.", type: number, path: population.direct, optional: true, empty_text: "0",
             shown_if: {field: binm_m, is: ordinal_mediator}}
          - {id: ordm_y_baseline, writeup_label: "the chance of the outcome in the comparison group", label: "Chance of 'yes' on the outcome at baseline", help: "In the first group (or at X's average), for someone at the middle of the mediator's underlying score, from 0 to 1.", type: number, path: population.y_baseline, required: true, min_exclusive: 0, max_exclusive: 1, baseline: true,
             shown_if: [{field: binm_m, is: ordinal_mediator}, {field: binm_y, is: binary}]}
          - {id: binm_b, writeup_label: "the difference in the outcome for the mediator", label: "Mediator's effect on the outcome (path b)", help: "The difference in the outcome between 'yes' and 'no' on the mediator, at the same X, in the outcome's SD, like Cohen's d.", type: number, path: population.b, effect: true,
             shown_if: [{field: binm_m, is_not: ordinal_mediator}, {field: binm_y, is: continuous}]}
          - {id: binm_direct, writeup_label: "the direct effect of X", label: "X's direct effect on the outcome", help: "Holding the mediator, in the outcome's SD. Optional: empty means 0.", type: number, path: population.direct, optional: true, empty_text: "0",
             shown_if: [{field: binm_m, is_not: ordinal_mediator}, {field: binm_y, is: continuous}]}
          - {id: binm_y_baseline, writeup_label: "the chance of the outcome in the comparison group", label: "Chance of 'yes' on the outcome at baseline", help: "In the first group (or at X's average), when the mediator is 'no', from 0 to 1.", type: number, path: population.y_baseline, required: true, min_exclusive: 0, max_exclusive: 1, baseline: true,
             shown_if: [{field: binm_m, is_not: ordinal_mediator}, {field: binm_y, is: binary}]}
          - {id: binm_b_or, writeup_label: "the odds ratio of the outcome for the mediator", label: "Mediator's odds ratio on the outcome (path b)", help: "The odds ratio of the outcome being 'yes' for 'yes' against 'no' on the mediator, at the same X.", type: number, path: population.b_odds_ratio, effect: true, min_exclusive: 0,
             shown_if: [{field: binm_m, is_not: ordinal_mediator}, {field: binm_y, is: binary}]}
          - {id: binm_direct_or, writeup_label: "the direct odds ratio of X", label: "X's direct odds ratio on the outcome", help: "Holding the mediator. Optional: empty means 1, no direct effect.", type: number, path: population.direct_odds_ratio, optional: true, empty_text: "1", min_exclusive: 0,
             shown_if: [{field: binm_m, is_not: ordinal_mediator}, {field: binm_y, is: binary}]}

  E33:
    methods_name: "a linear mixed model with participants and items as random factors (Satterthwaite t test)"
    sensitivity: true
    tool: simr
    departures: ["16"]
    directional: false
    base: {spec_version: "0.1", design: mixed_model, template: crossed_two_condition,
           variables: {X: {type: within_factor}, "Y": {type: continuous}}, population: {metric: raw},
           target_test: {effect: condition, method: satterthwaite_t}}
    groups:
      - input: "The two conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are", help: "For example, word type.", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "The two conditions, separated by a comma (first the comparison condition)", type: levels, path: variables.X.levels, required: true}
          - {id: Y_label, label: "Outcome", help: "For example, response time in ms.", type: text, path: variables.Y.label, required: true}
          - {id: outcome_type, label: "On each trial, the outcome is", type: select, path: variables.Y.type, required: true,
             choices: {continuous: "A score (for example, a response time)", binary: "Yes or no (for example, correct or not)"},
             sets: {binary: [{path: population.metric, value: probability}]},
             default: continuous, default_source: "a score, the commoner outcome",
             help: "With yes or no, Powerkit fits a logistic mixed model (lme4's glmer), and every SD below is on the log-odds scale."}
          - {id: crossed_participants, label: "Each participant takes part in", type: select, path: variables.X.type, required: true,
             choices: {within_factor: "Both conditions", between_factor: "One condition (half the participants in each)"},
             default: within_factor, default_source: "the design this card was built for first (docs/decisions.md, 30 October 2026; one condition each since 31 October 2026)"}
      - input: "The difference between conditions (the fixed effect) in the outcome's units, or each condition's chance of 'yes'"
        fields:
          - {id: difference, label: "Mean in the second condition minus the first", type: number, path: population.difference, effect: true, optional_for: [sensitivity], when_empty: zero,
             shown_if: {field: outcome_type, is: continuous},
             help: "For example, 16 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
          - {id: probabilities, writeup_label: "chance of yes in each condition", label: "Chance of 'yes' in each condition", help: "For a typical participant and item, as proportions in the same order as the conditions, separated by commas, for example 0.75, 0.85.", type: numbers, per_levels: X_levels, path: population.probabilities, effect: true,
             shown_if: {field: outcome_type, is: binary}}
          - {id: binary_test, label: "Test (yes/no outcome)", type: select, path: target_test.method, required: true,
             shown_if: {field: outcome_type, is: binary},
             choices: {wald: "Wald test (the p-value glmer's summary reports)", likelihood_ratio: "Likelihood-ratio test (comparing the model with and without the difference)"},
             default: wald, default_source: "the test glmer's summary reports, simr's default for a predictor with one coefficient",
             help: "lme4's help on p-values (help('pvalues'), lme4 2.0.6) notes that glmer's Wald p-values rest on assumptions about the shape of the log-likelihood and about a chi-squared approximation; the likelihood-ratio test is its model comparison. Running both shows how much the choice matters for your design."}
          - {id: df_method, label: "Degrees of freedom for the test (score outcome)", type: select, path: target_test.df_method, required: true,
             shown_if: {field: outcome_type, is: continuous},
             choices: {satterthwaite: "Satterthwaite's (lmerTest; the p-value most lme4 users report)", kenward_roger: "Kenward and Roger's (pbkrtest; slower to simulate)"},
             choice_notes: {kenward_roger: "Kenward and Roger's method also adjusts the standard errors of the effects for a small number of participants, items or groups. Each simulated study takes longer to test."},
             default: satterthwaite, default_source: "Satterthwaite's t test, the p-value lmerTest reports (Departure 16, decided 30 October 2026)",
             help: "Both correct the t or F test for having few participants, items or groups, and they usually give similar p-values. Plan with the one you will report."}
      - input: "How much participants and items vary (the variance components)"
        fields:
          - {id: sd_participant, label: "SD of participants' averages (random intercepts)", type: number, path: population.sd_participant, effect: true, min: 0,
             help: "For example, 100 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
          - {id: sd_participant_slope, label: "SD of the condition difference across participants (random slopes)", type: number, path: population.sd_participant_slope, effect: true, min: 0,
             shown_if: {field: crossed_participants, is: within_factor},
             help: "For example, 5.3 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
          - {id: r_participant, label: "Correlation of participants' averages and differences", type: number, path: population.r_participant, optional: true, empty_text: "0", min: -1, max: 1,
             shown_if: {field: crossed_participants, is: within_factor},
             help: "For example, -0.40 in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently. Empty means 0."}
          - {id: sd_item, label: "SD of items' averages (random intercepts)", type: number, path: population.sd_item, effect: true, min: 0,
             help: "For example, 43.6 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
          - {id: sd_residual, label: "Residual SD (trial-to-trial variation)", type: number, path: population.sd_residual, effect: true, min_exclusive: 0,
             shown_if: {field: outcome_type, is: continuous},
             help: "For example, 148.8 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently."}
      - input: "The items: how many, and whether each appears in one condition or both"
        fields:
          - {id: plan_unit, label: "What do you want to plan?", type: select, required: true,
             choices: {participants: "The number of participants, for a set of items", items: "The number of items (stimuli), for the participants you will have"},
             sets: {items: [{path: goal.unit, value: items}]},
             default: participants, default_source: "the number of participants, the usual question",
             help: "With items, the sample size below counts items, and you give the number of participants here."}
          - {id: items, in_effect_text: true, writeup_label: "number of items", label: "Number of items", type: number, path: population.items, required: true, min: 4, integer: true,
             shown_if: {field: plan_unit, is: participants}}
          - {id: participants, label: "Number of participants (analysed)", type: number, path: population.participants, required: true, min: 4, integer: true,
             shown_if: {field: plan_unit, is: items}}
          - {id: item_design, label: "Items appear", type: select, path: population.item_design, required: true,
             choices: {between: "In one condition each (half the items in each)", within: "In both conditions (with the conditions within participants, every participant sees every item twice)"},
             default: between, default_source: "the design this card was built for first (docs/decisions.md, 30 October 2026)"}
          - {id: sd_item_slope, label: "SD of the condition difference across items", type: number, path: population.sd_item_slope, optional: true, empty_text: "0", min: 0,
             shown_if: {field: item_design, is: within},
             help: "For example, 4.5 ms in a masked-priming lexical-decision study (response times in ms; Brysbaert & Stevens, 2018, Table 2). Use values from your own task where you can: other tasks and outcomes vary differently. Empty means 0."}

  # Participants and items in three or more conditions (simr), 31 October
  # 2026: the Satterthwaite F test, or one pair adjusted for all the pairs.
  E63:
    methods_name: "a linear mixed model with participants and items as random factors and three or more conditions (Satterthwaite tests)"
    sensitivity: true
    tool: simr
    departures: ["16", "17"]
    directional: false
    base: {spec_version: "0.1", design: mixed_model, template: crossed_conditions,
           variables: {X: {type: within_factor}, "Y": {type: continuous}}, population: {metric: raw},
           target_test: {effect: condition, method: satterthwaite_f}}
    groups:
      - input: "The conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are", help: "For example, face expression.", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "The conditions, separated by commas", help: "Three or more.", type: levels, path: variables.X.levels, required: true}
          - {id: Y_label, label: "Outcome", help: "For example, response time in ms.", type: text, path: variables.Y.label, required: true}
          - {id: outcome_type, label: "On each trial, the outcome is", type: select, path: variables.Y.type, required: true,
             choices: {continuous: "A score (for example, a response time)", binary: "Yes or no (for example, correct or not)"},
             sets: {binary: [{path: population.metric, value: probability}]},
             default: continuous, default_source: "a score, the commoner outcome",
             help: "With yes or no, Powerkit fits a logistic mixed model (lme4's glmer), and every SD below is on the log-odds scale."}
          - {id: crossed_participants, label: "Each participant takes part in", type: select, path: variables.X.type, required: true,
             choices: {within_factor: "Every condition", between_factor: "One condition (the participants split equally)"},
             default: within_factor, default_source: "every participant in every condition, the commoner design"}
      - input: "Each condition's mean, in the outcome's units, or its chance of 'yes'"
        fields:
          - {id: means, writeup_label: "means", label: "The mean in each condition, in the same order, separated by commas", type: numbers, per_levels: X_levels, path: population.means, effect: true,
             shown_if: {field: outcome_type, is: continuous}}
          - {id: probabilities, writeup_label: "chance of yes in each condition", label: "Chance of 'yes' in each condition", help: "For a typical participant and item, as proportions in the same order as the conditions, separated by commas, for example 0.75, 0.85.", type: numbers, per_levels: X_levels, path: population.probabilities, effect: true,
             shown_if: {field: outcome_type, is: binary}}
      - input: "How much participants and items vary (the variance components)"
        fields:
          - {id: sd_participant, writeup_label: "SD of participants' averages", label: "SD of participants' averages (random intercepts)", type: number, path: population.sd_participant, effect: true, min: 0}
          - {id: sd_participant_condition, writeup_label: "SD of participants' condition effects", label: "Participant-by-condition SD", type: number, path: population.sd_participant_condition, effect: true, min: 0,
             shown_if: {field: crossed_participants, is: within_factor},
             help: "How much each participant's mean in a condition departs from their average plus the condition's effect. The same for every condition. The several-condition counterpart of the SD of participants' condition differences: with two conditions, a participant's difference varies with an SD of about 1.4 times this value."}
          - {id: sd_item, writeup_label: "SD of items' averages", label: "SD of items' averages (random intercepts)", type: number, path: population.sd_item, effect: true, min: 0}
          - {id: sd_residual, writeup_label: "residual SD", label: "Residual SD (trial-to-trial variation)", type: number, path: population.sd_residual, effect: true, min_exclusive: 0,
             shown_if: {field: outcome_type, is: continuous}}
      - input: "The items: how many, and whether each appears in one condition or all"
        fields:
          - {id: items, in_effect_text: true, writeup_label: "number of items", label: "Number of items", type: number, path: population.items, required: true, min: 6, integer: true}
          - {id: item_design, label: "Items appear", type: select, path: population.item_design, required: true,
             choices: {between: "In one condition each (split equally between the conditions)", within: "In every condition"},
             default: between, default_source: "as for two conditions (decided 30 October 2026, docs/decisions.md)"}
          - {id: sd_item_condition, label: "Item-by-condition SD", help: "How much an item's mean in a condition departs from its average plus the condition's effect. Optional: empty means 0.", type: number, path: population.sd_item_condition, optional: true, empty_text: "0", min: 0,
             shown_if: {field: item_design, is: within}}
      - input: "The test: any difference between the conditions, or one pair"
        fields:
          - {id: conditions_test, label: "Test", type: select, path: target_test.effect, required: true,
             choices: {condition: "Whether the conditions differ at all (with a score, an F test)",
                       pairwise: "One pair of conditions, adjusted for all the pairs (with a score, a t test)"},
             sets: {pairwise: [{path: target_test.method, value: satterthwaite_t}]},
             default: condition, default_source: "the test of the design's main question, as on the one-way ANOVA cards"}
          - {id: binary_test, label: "Test (yes/no outcome)", type: select, path: target_test.method, required: true,
             shown_if: {field: outcome_type, is: binary},
             choices: {wald: "Wald test (the p-value glmer's summary reports)", likelihood_ratio: "Likelihood-ratio test (comparing the model with and without the differences, or the pair's difference)"},
             default: likelihood_ratio, default_source: "the likelihood-ratio test, simr's default for a factor: with three conditions and 30 participants, glmer's Wald chi-square test rejected 6.2% of 2,000 simulated studies with no difference at alpha .05, the likelihood ratio 5.65% (powerkit's checks, 1 November 2026)",
             help: "lme4's help on p-values (help('pvalues'), lme4 2.0.6) notes that glmer's Wald p-values rest on assumptions about the shape of the log-likelihood and about a chi-squared approximation; the likelihood-ratio test is its model comparison. Running both shows how much the choice matters for your design."}
          - {id: df_method, label: "Degrees of freedom for the test (score outcome)", type: select, path: target_test.df_method, required: true,
             shown_if: {field: outcome_type, is: continuous},
             choices: {satterthwaite: "Satterthwaite's (lmerTest; the p-value most lme4 users report)", kenward_roger: "Kenward and Roger's (pbkrtest; slower to simulate)"},
             choice_notes: {kenward_roger: "Kenward and Roger's method also adjusts the standard errors of the effects for a small number of participants, items or groups. Each simulated study takes longer to test."},
             default: satterthwaite, default_source: "Satterthwaite's t test, the p-value lmerTest reports (Departure 16, decided 30 October 2026)",
             help: "Both correct the t or F test for having few participants, items or groups, and they usually give similar p-values. Plan with the one you will report."}
          - {id: comparison, label: "The pair you'll compare: two conditions' names, separated by a comma", type: levels, path: target_test.comparison, required: true,
             shown_if: {field: conditions_test, is: pairwise},
             help: "The test of this pair is the one powered; every pair is still compared, and the adjustment counts them all."}
          - {id: p_adjust, label: "Adjustment for the number of comparisons", type: select, path: target_test.p_adjust, required: true,
             shown_if: {field: conditions_test, is: pairwise},
             choices: {holm: "Holm's method (never less power than Bonferroni's)", bonferroni: "Bonferroni's method", none: "None"},
             default: holm, default_source: "Holm's method, as on the one-way ANOVA cards (Departure 17)"}

  # The same people measured more than once with a count or yes/no outcome
  # (simr; Spower with glmer.nb() for a negative binomial count), 14
  # November 2026.
  E75:
    methods_name: "a generalised linear mixed model with a random intercept for each person"
    sensitivity: true
    tool: simr
    directional: false
    base: {spec_version: "0.1", design: mixed_model, template: repeated_glmm,
           variables: {X: {type: within_factor}, "Y": {type: count}}, population: {metric: rate},
           target_test: {effect: condition}}
    groups:
      - input: "The conditions, the outcome, and how often each person is measured"
        fields:
          - {id: glmm_groups, label: "Do you compare groups of people?", type: select, required: true,
             choices: {none: "No: one group of people", groups: "Yes: does the change over the conditions differ between the groups? (a group-by-time interaction)"},
             sets: {groups: [{path: variables.W.type, value: between_factor}, {path: target_test.effect, value: interaction}]},
             default: none, default_source: "one group of people, this card's first design",
             help: "Two or more groups, each measured in every condition. For example, a programme group and a control group, each measured before and after: the test is whether the programme group changes more than the control group, the interaction of group and occasion in the mixed model y ~ group * occasion + (1 | person)."}
          - {id: W_label, label: "What the groups are", help: "For example, programme or control.", type: text, path: variables.W.label, required: true,
             shown_if: {field: glmm_groups, is: groups}}
          - {id: W_levels, label: "The groups", help: "Separated by commas, the comparison group first. The people are split equally between them.", type: levels, path: variables.W.levels, required: true,
             shown_if: {field: glmm_groups, is: groups}}
          - {id: X_label, label: "What the conditions or occasions are", help: "For example before and after the programme.", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "The conditions or occasions, separated by commas", help: "Two or more.", type: levels, path: variables.X.levels, required: true}
          - {id: glmm_people, label: "Each person is measured in", type: select, path: variables.X.type, required: true,
             shown_if: {field: glmm_groups, is_not: groups},
             choices: {within_factor: "Every condition (for example, before and after)", between_factor: "One condition, several times (the people split equally between the conditions)"},
             default: within_factor, default_source: "the same people measured more than once, this card's usual design"}
          - {id: Y_label, label: "Outcome", help: "For example, cigarettes smoked per day.", type: text, path: variables.Y.label, required: true}
          - {id: glmm_outcome, label: "The outcome is", type: select, path: variables.Y.type, required: true,
             choices: {count: "A count (0, 1, 2, ...)", binary: "Yes or no", categorical: "Ordered categories (for example, a rating from 1 to 5)"},
             sets: {binary: [{path: population.metric, value: probability}], categorical: [{path: population.metric, value: proportion}]},
             default: count, default_source: "a count, the commoner outcome on this card",
             help: "With yes or no, Powerkit fits a logistic mixed model (lme4's glmer); with ordered categories, a cumulative link mixed model with proportional odds (the R package ordinal's clmm()). The SD below is then on the log-odds scale."}
          - {id: Y_levels, label: "The categories, lowest first, separated by commas", help: "Three or more.", type: levels, path: variables.Y.levels, required: true,
             shown_if: {field: glmm_outcome, is: categorical}}
          - {id: glmm_measurements, writeup_label: "measurements per person in each condition", label: "How many times each person is measured in each condition (1 if once)", type: number, path: population.measurements, required: true, min: 1, integer: true,
             default: 1, default_source: "one measurement per condition, as in a before-and-after study",
             help: "With each person in one condition, at least 2: the person's own average can't be told apart from their measurement otherwise. A yes/no answer given once in each of three or more conditions is tested with Cochran's Q."}
      - input: "The expected count, chance of 'yes' or answers in each condition, and how much people differ"
        fields:
          - {id: glmm_rates, writeup_label: "expected count in each condition", label: "Expected count in each condition", type: numbers, per_levels: X_levels, path: population.rates, effect: true,
             shown_if: [{field: glmm_outcome, is: count}, {field: glmm_groups, is_not: groups}],
             help: "The expected count per measurement for a typical person, in the same order as the conditions, separated by commas, for example 10, 8. A typical person is one whose own level is average (random intercept 0). The ratio of two of these is the rate ratio the test looks for."}
          - {id: glmm_probabilities, writeup_label: "chance of yes in each condition", label: "Chance of 'yes' in each condition", help: "For a typical person, as proportions in the same order as the conditions, separated by commas, for example 0.30, 0.20.", type: numbers, per_levels: X_levels, path: population.probabilities, effect: true,
             shown_if: [{field: glmm_outcome, is: binary}, {field: glmm_groups, is_not: groups}]}
          - {id: glmm_categories, writeup_label: "share of answers in each category in the first condition", label: "Share of answers in each category", help: "In the first condition, for a typical person, lowest category first, separated by commas. They add up to 1, for example 0.2, 0.3, 0.3, 0.2.", type: numbers, per_levels: Y_levels, path: population.category_probabilities, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: glmm_outcome, is: categorical}}
          - {id: glmm_odds_ratios, writeup_label: "odds ratio of a higher category in each condition", label: "Odds ratio of a higher category per condition", type: numbers, per_levels: X_levels, path: population.odds_ratios, effect: true, min_exclusive: 0,
             shown_if: [{field: glmm_outcome, is: categorical}, {field: glmm_groups, is_not: groups}],
             help: "Each condition's odds of a higher category compared with the first condition, in the same order, the first being 1, for example 1, 1.8. Proportional odds: the same odds ratio at every split of the categories into lower and higher. Above 1 means answers higher on the scale; 1.8 turns the 20% answering in the top category in the first condition into about 31%."}
          - {id: glmm_rates_groups, writeup_label: "expected count in each group and condition", label: "Expected count per group and condition", text_layout: "one line per group, with one number per condition, separated by commas", type: table, path: population.rates, effect: true,
             rows_from: W_levels, cols_from: X_levels, rows_name: "group", cols_name: "condition",
             shown_if: [{field: glmm_outcome, is: count}, {field: glmm_groups, is: groups}],
             help: "The expected count per measurement for a typical person: one line per group, with one number per condition, separated by commas. The test looks for groups whose counts change by different ratios: 2 and 2 for the control group with 2 and 1.4 for the programme group is a 30% fall in the programme group only."}
          - {id: glmm_probabilities_groups, writeup_label: "chance of yes in each group and condition", label: "Chance of 'yes' per group and condition", text_layout: "one line per group, with one number per condition, separated by commas", help: "For a typical person: one line per group, with one number per condition, separated by commas.", type: table, path: population.probabilities, effect: true,
             rows_from: W_levels, cols_from: X_levels, rows_name: "group", cols_name: "condition",
             shown_if: [{field: glmm_outcome, is: binary}, {field: glmm_groups, is: groups}]}
          - {id: glmm_odds_ratios_groups, writeup_label: "odds ratio of a higher category in each group and condition", label: "Each group's odds ratios across conditions", text_layout: "one line per group, with one number per condition, the very first 1", type: table, path: population.odds_ratios, effect: true,
             rows_from: W_levels, cols_from: X_levels, rows_name: "group", cols_name: "condition",
             shown_if: [{field: glmm_outcome, is: categorical}, {field: glmm_groups, is: groups}],
             help: "Odds of a higher category in each condition, compared with the first group in the first condition. One line per group, with one number per condition; the very first is 1. 1, 1 for the comparison group and 1, 2 for the other: the second group's odds of a higher answer double between the conditions while the first group's stay the same."}
          - {id: glmm_sd_person, writeup_label: "SD of people's levels", label: "How much people differ in their level", type: number, path: population.sd_person, effect: true, min: 0,
             help: "The SD of the person intercepts, on the log scale for a count (log-odds for yes/no or ordered categories). For a count, 0.5 means that a person one SD above average has a typical count about 1.65 times (exp(0.5)) the average person's."}
          - {id: glmm_distribution, label: "Counts are", type: select, required: true,
             shown_if: {field: glmm_outcome, is: count},
             choices: {poisson: "Poisson: given the person and condition, the variance equals the mean", negative_binomial: "More spread out than Poisson (negative binomial)"},
             help: "Not chosen for you: pick the one your earlier data support. Counts of behaviour often vary more from one measurement to the next than a Poisson distribution allows, and a Poisson model then gives too much power. The negative binomial model allows for that; it is slower to simulate (lme4's glmer.nb()), and gives less power for the same counts."}
          - {id: glmm_dispersion, writeup_label: "overdispersion k", label: "Overdispersion (k)", help: "A count with expected value mu varies with variance mu + k mu squared, for example 0.5.", type: number, path: population.dispersion, effect: true, min_exclusive: 0,
             shown_if: [{field: glmm_outcome, is: count}, {field: glmm_distribution, is: negative_binomial}]}
      - input: "The test"
        fields:
          - {id: glmm_test, label: "What the test compares", type: select, path: target_test.method, required: true,
             shown_if: {field: glmm_outcome, is_not: binary},
             choices: {likelihood_ratio: "Likelihood-ratio test (comparing the model with and without the differences)", wald: "Wald test (the Wald chi-square; with two conditions, the p-value the model's summary reports)"},
             default: likelihood_ratio, default_source: "the likelihood-ratio test, simr's default for a factor, as on the many-conditions card (E63)",
             help: "That the conditions differ, or, with groups, that the groups change differently. lme4's help on p-values (help('pvalues'), lme4 2.0.6) notes that glmer's Wald p-values rest on assumptions about the shape of the log-likelihood and about a chi-squared approximation; the likelihood-ratio test is its model comparison."}
          - {id: glmm_test_yes_no, label: "What the test compares (yes/no)", type: select, path: target_test.method, required: true,
             shown_if: [{field: glmm_outcome, is: binary}, {any: [{field: glmm_groups, is: groups}, {field: glmm_people, is: between_factor}, {field: glmm_measurements, is_not: "1"}]}],
             choices: {likelihood_ratio: "Likelihood-ratio test (comparing the model with and without the differences)"},
             default: likelihood_ratio, default_source: "the likelihood-ratio test, simr's default for a factor and the only test powerkit plans for a yes/no outcome on this card",
             help: "That the conditions differ, or, with groups, that the groups change differently. The Wald test isn't offered for yes/no answers: for people who differ a lot (an SD of 1.5), powerkit's simulations found it significant in about 6.2% of studies with no difference at a 5% significance level, while the likelihood-ratio test stayed near 5%."}
          - {id: glmm_test_once, label: "Test (a yes/no answer once in each condition)", type: select, path: target_test.method, required: true,
             shown_if: [{field: glmm_outcome, is: binary}, {field: glmm_groups, is_not: groups}, {field: glmm_people, is: within_factor}, {field: glmm_measurements, is: "1"}],
             choices: {cochran_q: "Cochran's Q"},
             default: cochran_q, default_source: "Cochran's Q, the usual test of one yes/no answer from each person in each of three or more conditions",
             help: "For three or more conditions; with two, Cochran's Q is McNemar's test, which has its own card. With one yes/no answer per condition the mixed model's tests find a difference too often when there is none (up to 8.5% of simulated studies at a 5% significance level), so each simulated study is tested with Cochran's Q, as researchers usually analyse such data. The answers are still drawn from the card's model: the SD above makes some people likelier to say yes in every condition, which is what makes the answers in different conditions go together. With people who differ, the share saying yes across everyone is a little closer to 50% than a typical person's chance; the check run shows those shares."}

  # Cochran's Q (17 November 2026): its own card for the test that the
  # repeated-measures card (E75) offers as a test version, so that a
  # researcher who knows the test by name finds it under its name. The
  # same engine route: the answers drawn from a logistic model with a
  # random intercept for each person, each study tested with Cochran's Q.
  E78:
    methods_name: "Cochran's Q"
    sensitivity: true
    tool: Spower
    directional: false
    base: {spec_version: "0.1", design: mixed_model, template: repeated_glmm,
           variables: {X: {type: within_factor}, "Y": {type: binary}}, population: {metric: probability, measurements: 1},
           target_test: {effect: condition, method: cochran_q}}
    groups:
      - input: "The conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are", help: "For example, the kind of reminder.", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "The conditions, separated by commas", type: levels, path: variables.X.levels, required: true,
             help: "Every person answers once in each condition. With two conditions, use McNemar's test, which has its own card. Three or more."}
          - {id: Y_label, label: "The yes/no outcome", help: "For example, attended.", type: text, path: variables.Y.label, required: true}
      - input: "The chance of 'yes' in each condition, and how much people differ"
        fields:
          - {id: glmm_probabilities, writeup_label: "chance of yes in each condition", label: "Chance of 'yes' in each condition", type: numbers, per_levels: X_levels, path: population.probabilities, effect: true, min_exclusive: 0, max_exclusive: 1,
             help: "For a typical person, as proportions in the same order as the conditions, separated by commas, for example 0.30, 0.40, 0.50. A typical person is one whose own tendency to say yes is average. With people who differ, the share saying yes across everyone is a little closer to 50% than this; the check run shows those shares."}
          - {id: glmm_sd_person, writeup_label: "SD of people's tendency to say yes", label: "How much people differ in saying yes", type: number, path: population.sd_person, effect: true, min: 0,
             help: "The SD of the person intercepts, on the log-odds scale. 0 if they don't differ; for example 1. This is what makes a person's answers in different conditions go together: people likelier to say yes in one condition are likelier in the others. The more people differ, the more the answers go together, and the fewer people you usually need for the same change in the chances. With an SD of 1, a person one SD above average has about 2.7 times (exp(1)) a typical person's odds of saying yes. Base it on earlier data where you can."}

  # A predictor measured on each item (simr), 1 November 2026.
  E67:
    methods_name: "a mixed model with participants and items as random factors and a measured predictor"
    sensitivity: true
    tool: simr
    departures: ["16"]
    directional: false
    base: {spec_version: "0.1", design: mixed_model, template: item_predictor,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: raw},
           target_test: {effect: slope, method: satterthwaite_t}}
    groups:
      - input: "The item score and the outcome"
        fields:
          - {id: X_label, label: "The predictor", help: "For example, word frequency.", type: text, path: variables.X.label, required: true}
          - {id: x_level, label: "The predictor is measured", type: select, path: population.x_level, required: true,
             choices: {item: "On each item: the same for every participant (for example, a word's frequency)", trial: "On each trial: it varies from trial to trial, within items too (for example, how long the stimulus is shown)"},
             default: item, default_source: "an item property, the commoner design"}
          - {id: Y_label, label: "Outcome", help: "For example, response time in ms.", type: text, path: variables.Y.label, required: true}
          - {id: outcome_type, label: "On each trial, the outcome is", type: select, path: variables.Y.type, required: true,
             choices: {continuous: "A score (for example, a response time)", binary: "Yes or no (for example, correct or not)"},
             sets: {binary: [{path: population.metric, value: probability}]},
             default: continuous, default_source: "a score, the commoner outcome",
             help: "With yes or no, Powerkit fits a logistic mixed model (lme4's glmer), and the effect and every SD below are on the log-odds scale."}
          - {id: binary_test, label: "Test (yes/no outcome)", type: select, path: target_test.method, required: true,
             shown_if: {field: outcome_type, is: binary},
             choices: {wald: "Wald test (the p-value glmer's summary reports)", likelihood_ratio: "Likelihood-ratio test (comparing the model with and without the item score)"},
             default: wald, default_source: "the test glmer's summary reports, simr's default for a numeric predictor"}
          - {id: df_method, label: "Degrees of freedom for the test (score outcome)", type: select, path: target_test.df_method, required: true,
             shown_if: {field: outcome_type, is: continuous},
             choices: {satterthwaite: "Satterthwaite's (lmerTest; the p-value most lme4 users report)", kenward_roger: "Kenward and Roger's (pbkrtest; slower to simulate)"},
             choice_notes: {kenward_roger: "Kenward and Roger's method also adjusts the standard errors of the effects for a small number of participants, items or groups. Each simulated study takes longer to test."},
             default: satterthwaite, default_source: "Satterthwaite's t test, the p-value lmerTest reports (Departure 16, decided 30 October 2026)",
             help: "Both correct the t or F test for having few participants, items or groups, and they usually give similar p-values. Plan with the one you will report."}
      - input: "The effect, and how participants and items vary"
        fields:
          - {id: slope, writeup_label: "effect per SD of the item score", label: "Effect of one SD more of the item score", help: "In the outcome's units, or on the log odds for yes/no.", type: number, path: population.slope, effect: true, optional_for: [sensitivity], when_empty: zero}
          - {id: probability, writeup_label: "chance of yes at the average item", label: "Chance of 'yes' at the average item score", help: "For a typical participant (0 to 1).", type: number, path: population.probability, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: outcome_type, is: binary}}
          - {id: sd_participant, writeup_label: "SD of participants' averages", label: "SD of participants' averages (random intercepts)", type: number, path: population.sd_participant, effect: true, min: 0}
          - {id: sd_participant_slope, writeup_label: "SD of participants' slopes", label: "SD of the effect across participants (random slopes)", type: number, path: population.sd_participant_slope, effect: true, min: 0}
          - {id: r_participant, label: "Correlation of participants' averages and slopes", help: "Empty means 0.", type: number, path: population.r_participant, optional: true, empty_text: "0", min: -1, max: 1}
          - {id: sd_item, writeup_label: "SD of items beyond the score", label: "SD of items' averages beyond what the item score explains", type: number, path: population.sd_item, effect: true, min: 0}
          - {id: sd_item_slope, label: "SD of the effect across items", help: "Empty means 0.", type: number, path: population.sd_item_slope, optional: true, empty_text: "0", min: 0,
             shown_if: {field: x_level, is: trial}}
          - {id: sd_residual, writeup_label: "residual SD", label: "Residual SD (trial-to-trial variation)", type: number, path: population.sd_residual, effect: true, min_exclusive: 0,
             shown_if: {field: outcome_type, is: continuous}}
      - input: "The items"
        fields:
          - {id: items, in_effect_text: true, writeup_label: "number of items", label: "Number of items", type: number, path: population.items, required: true, min: 6, integer: true,
             help: "Powerkit spreads the item score evenly across the items, as a normal distribution."}

  # Three levels (simr): people in groups in sites, the condition
  # assigned to sites, groups or people (1 November 2026).
  E68:
    methods_name: "a three-level mixed model"
    sensitivity: true
    tool: simr
    departures: ["16"]
    directional: false
    base: {spec_version: "0.1", design: mixed_model, template: three_level,
           variables: {X: {type: between_factor}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: condition, method: satterthwaite_t}}
    groups:
      - input: "The conditions, what is assigned to them, and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are", help: "For example, programme.", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "The two conditions, separated by a comma (first the comparison condition)", type: levels, path: variables.X.levels, required: true}
          - {id: Y_label, label: "Outcome", help: "For example, reading score.", type: text, path: variables.Y.label, required: true}
          - {id: three_outcome, label: "The outcome is", type: select, path: variables.Y.type, required: true,
             choices: {continuous: "A score (for example, a reading score)", binary: "Yes or no (for example, passed or not)"},
             sets: {binary: [{path: population.metric, value: probability}]},
             default: continuous, default_source: "a score, the commoner outcome",
             help: "With yes or no, Powerkit fits a logistic mixed model (lme4's glmer): you give each condition's chance of 'yes', and how much schools and classes differ as SDs on the log-odds scale."}
          - {id: three_test, label: "Test (yes/no outcome)", type: select, path: target_test.method, required: true,
             shown_if: {field: three_outcome, is: binary},
             choices: {wald: "Wald test (the p-value glmer's summary reports)", likelihood_ratio: "Likelihood-ratio test (comparing the model with and without the condition)"},
             default: wald, default_source: "the test glmer's summary reports, simr's default for a two-condition predictor"}
          - {id: df_method, label: "Degrees of freedom for the test (score outcome)", type: select, path: target_test.df_method, required: true,
             shown_if: {field: three_outcome, is: continuous},
             choices: {satterthwaite: "Satterthwaite's (lmerTest; the p-value most lme4 users report)", kenward_roger: "Kenward and Roger's (pbkrtest; slower to simulate)"},
             choice_notes: {kenward_roger: "Kenward and Roger's method also adjusts the standard errors of the effects for a small number of participants, items or groups. Each simulated study takes longer to test."},
             default: satterthwaite, default_source: "Satterthwaite's t test, the p-value lmerTest reports (Departure 16, decided 30 October 2026)",
             help: "Both correct the t or F test for having few participants, items or groups, and they usually give similar p-values. Plan with the one you will report."}
          - {id: three_assignment, label: "What is assigned to the conditions", type: select, path: population.assignment, required: true,
             choices: {site: "Whole larger groups (for example, schools)", group: "Groups within each larger group (for example, classes within each school)", person: "People within each group (for example, pupils within each class)"},
             default: site, default_source: "whole sites, the commonest three-level trial"}
      - input: "The effect, and how alike people in the same group and site are"
        fields:
          - {id: d, label: "Cohen's d: (condition 2 minus condition 1) / the outcome's total SD", type: number, path: population.d, effect: true, optional_for: [sensitivity], when_empty: zero,
             shown_if: {field: three_outcome, is: continuous},
             help: "The total SD is how much people vary on the outcome across everyone, not only within one group."}
          - {id: icc_site, writeup_label: "intraclass correlation of the larger groups", label: "Intraclass correlation of the larger groups", help: "The share of the outcome's variation between larger groups, for example schools (0 to 1).", type: number, path: population.icc_site, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: three_outcome, is: continuous}}
          - {id: icc_group, writeup_label: "intraclass correlation of the groups", label: "Intraclass correlation of the smaller groups", help: "The share of the outcome's variation between groups within the larger groups, for example classes within schools (0 to 1).", type: number, path: population.icc_group, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: three_outcome, is: continuous}}
          - {id: icc_effect_site, label: "Variation in the effect between larger groups", help: "As a share of the outcome's variation. Optional: empty means 0.", type: number, path: population.icc_effect_site, optional: true, empty_text: "0", min: 0, max_exclusive: 1,
             shown_if: [{field: three_assignment, is_not: site}, {field: three_outcome, is: continuous}]}
          - {id: icc_effect_group, label: "Variation in the effect between groups", help: "As a share of the outcome's variation. Optional: empty means 0.", type: number, path: population.icc_effect_group, optional: true, empty_text: "0", min: 0, max_exclusive: 1,
             shown_if: [{field: three_assignment, is: person}, {field: three_outcome, is: continuous}]}
          - {id: three_probabilities, writeup_label: "chance of yes in each condition", label: "Chance of 'yes' in each condition", help: "Separated by a comma, for a typical school and class.", type: numbers, per_levels: X_levels, path: population.probabilities, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: three_outcome, is: binary}}
          - {id: sd_site, writeup_label: "SD of the larger groups (log odds)", label: "SD of the larger groups' averages, e.g. schools (on the log-odds scale)", type: number, path: population.sd_site, effect: true, min: 0,
             shown_if: {field: three_outcome, is: binary},
             help: "On the log-odds scale; 0.5 is a moderate difference between schools."}
          - {id: sd_group, writeup_label: "SD of the groups (log odds)", label: "SD of the groups' averages", help: "Within larger groups, for example classes (log-odds scale).", type: number, path: population.sd_group, effect: true, min: 0,
             shown_if: {field: three_outcome, is: binary}}
          - {id: sd_effect_site, label: "SD of the effect across larger groups, log-odds scale", help: "Empty means 0.", type: number, path: population.sd_effect_site, optional: true, empty_text: "0", min: 0,
             shown_if: [{field: three_assignment, is_not: site}, {field: three_outcome, is: binary}]}
          - {id: sd_effect_group, label: "SD of the effect across groups, log-odds scale", help: "Empty means 0.", type: number, path: population.sd_effect_group, optional: true, empty_text: "0", min: 0,
             shown_if: [{field: three_assignment, is: person}, {field: three_outcome, is: binary}]}
      - input: "The sizes of the groups and sites"
        fields:
          - {id: group_size, label: "People in each group", help: "For example, pupils per class.", type: number, path: population.group_size, required: true, min: 2, integer: true}
          - {id: groups_per_site, label: "Groups in each larger group", type: number, path: population.groups_per_site, required: true, min: 2, integer: true,
             help: "The total number of people is then a whole number of larger groups; with whole larger groups assigned, an even number of them. For example, classes per school."}

  # Dyadic data (power4mome): the actor-partner interdependence model
  # (1 November 2026).
  E43:
    methods_name: "a time-to-event analysis (the log-rank test, or a Cox regression)"
    departures: ["35"]
    tool: Hmisc
    sensitivity: true
    directional: false
    base: {spec_version: "0.1", design: survival, variables: {"Y": {type: time_to_event}}, population: {}, target_test: {}}
    groups:
      - input: "What you want to test"
        fields:
          - {id: question, label: "What you want to test", type: select, path: template, required: true,
             choices: {log_rank: "Whether two groups differ in how soon the event happens (the log-rank test)",
                       cox_predictor: "Whether a measured score predicts how soon it happens (a Cox regression)"},
             sets: {log_rank: [{path: variables.X.type, value: binary}, {path: population.metric, value: event_proportions}, {path: target_test.effect, value: group_difference}, {path: target_test.method, value: log_rank}],
                    cox_predictor: [{path: variables.X.type, value: continuous}, {path: population.metric, value: hazard_ratio}, {path: target_test.effect, value: hazard_ratio}, {path: target_test.method, value: cox_regression}]}}
          - {id: Y_label, label: "The event, as the time until it happens", help: "For example, time to relapse.", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "What the groups or scores are", help: "For example condition, for groups, or baseline motivation, for a score.", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1 (usually the comparison group)", type: text, path: variables.X.levels.1, required: true,
             shown_if: {field: question, is: log_rank}}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true,
             shown_if: {field: question, is: log_rank}}
      - input: "Two groups: who has had the event by a given time, and how long people are followed"
        shown_if: {field: question, is: log_rank}
        fields:
          - {id: lr_time, writeup_label: "time", label: "Time at which the event shares are known", type: number, path: population.time, required: true, min_exclusive: 0,
             shown_if: {field: question, is: log_rank},
             help: "A time by which you know roughly how many have had the event, for example 12 for 12 months. Use the same unit (days, weeks, months) for every time on this screen."}
          - {id: p_event1, writeup_label: "proportion with the event in group 1", label: "Proportion of group 1 who have had the event by then", help: "Between 0 and 1.", type: number, path: population.p_event.1, effect: true, baseline: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: log_rank}}
          - {id: p_event2, optional_for: [sensitivity], when_empty: same_as, same_as: p_event1, writeup_label: "proportion with the event in group 2", label: "Proportion of group 2 who have had the event by then", type: number, path: population.p_event.2, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: log_rank},
             help: "The smallest difference worth detecting, for example 0.25 where group 1's is 0.40."}
          - {id: accrual, writeup_label: "recruitment period", label: "How long recruitment takes", type: number, path: population.accrual, required: true, min: 0,
             shown_if: {field: question, is: log_rank},
             default: 0, default_source: "0: everyone starts together (cpower() takes accrual = 0 for this, Hmisc 5.3-0)",
             help: "People are taken to join at an even rate over this time."}
          - {id: follow_up, writeup_label: "shortest follow-up", label: "How long the last person recruited is followed", type: number, path: population.follow_up, required: true, min_exclusive: 0,
             shown_if: {field: question, is: log_rank},
             help: "Everyone recruited earlier is followed for longer, up to this plus the recruitment period."}
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             shown_if: {field: question, is: log_rank},
             default: 1, default_source: "equal groups, as cpower() assumes when only the total is given (Hmisc 5.3-0)"}
      - input: "A measured score: its hazard ratio, and how many people have the event"
        shown_if: {field: question, is: cox_predictor}
        fields:
          - {id: hazard_ratio, optional_for: [sensitivity], when_empty: one, writeup_label: "hazard ratio per SD", label: "Hazard ratio for a person 1 SD higher on the score", type: number, path: population.hazard_ratio, effect: true, min_exclusive: 0,
             shown_if: {field: question, is: cox_predictor},
             help: "Above 1: the event comes sooner for people higher on the score; below 1, later. For example 0.75: at any time, a quarter less likely to drop out."}
          - {id: event_proportion, writeup_label: "proportion with the event", label: "Proportion expected to have the event", type: number, path: population.event_proportion, required: true, min_exclusive: 0, max: 1,
             shown_if: {field: question, is: cox_predictor},
             help: "Of all participants, during the study (0 to 1). Power depends on the number of events, not of people: rare events need many more people."}
          - {id: r2_other, writeup_label: "R-squared with the other predictors", label: "R-squared of the score on the other predictors in the model", type: number, path: population.r2_other, required: true, min: 0, max_exclusive: 1,
             shown_if: {field: question, is: cox_predictor},
             default: 0, default_source: "0: no other predictors related to the score (the value powerEpiCont.default()'s help gives for a randomised comparison, rho2 = 0, powerSurvEpi 0.1.5)",
             help: "How well the other predictors in the model predict the score. The more they overlap with it, the less the score adds."}
  E69:
    methods_name: "a test of reliability or agreement (the ICC, Cronbach's alpha, kappa or the Bland-Altman limits of agreement)"
    tool: kappaSize
    sensitivity: true
    sensitivity_shown_if: {field: question, is_one_of: [icc, cronbach_alpha, kappa]}
    departures: ["27", "29", "34"]
    directional: false
    base: {spec_version: "0.1", design: reliability, variables: {"Y": {type: continuous}}, population: {}, target_test: {}}
    groups:
      - input: "What you want to show"
        fields:
          - {id: question, label: "What you want to show", type: select, path: template, required: true,
             choices: {icc: "That raters (or occasions) agree on a score: the intraclass correlation (ICC)",
                       cronbach_alpha: "That a scale's items are consistent: Cronbach's alpha",
                       kappa: "That raters agree on a category: kappa",
                       bland_altman: "That two methods of measurement agree closely enough to be used in place of each other: Bland-Altman limits of agreement"},
             sets: {icc: [{path: population.metric, value: icc}, {path: target_test.effect, value: icc}],
                    cronbach_alpha: [{path: population.metric, value: cronbach_alpha}, {path: target_test.effect, value: cronbach_alpha}, {path: target_test.method, value: bonett_wright}],
                    kappa: [{path: variables.Y.type, value: categorical}, {path: population.metric, value: kappa}, {path: target_test.effect, value: kappa}, {path: target_test.method, value: kappa_chi_square}],
                    bland_altman: [{path: population.metric, value: bland_altman}, {path: target_test.effect, value: limits_of_agreement}]}}
          - {id: Y_label, label: "What is rated or measured", help: "For example therapist competence, or a study anxiety scale.", type: text, path: variables.Y.label, required: true}
          - {id: rel_alternative, label: "Which test", type: select, path: target_test.alternative, required: true,
             choices: {greater: "One-sided: show it is above the value you name (the usual aim)", two_sided: "Two-sided: show it differs from that value, in either direction"},
             shown_if: [{field: question, is_not: kappa}, {field: question, is_not: bland_altman}],
             default_source: "Not filled in for you (for reference: ICC.Sample.Size's calculateIccPower() is two-sided by default, tails = 2, version 1.1; statpsych's size.test.cronbach() is two-sided, version 2.0.0)",
             help: "A reliability study usually aims to show the value is above a minimum, such as 0.7, which is a one-sided test."}
      - input: "The ICC: the value you expect, the value to beat, and the number of ratings"
        shown_if: {field: question, is: icc}
        fields:
          - {id: icc, optional_for: [sensitivity], when_empty: same_as, same_as: icc_null, writeup_label: "expected ICC", label: "The ICC you expect", type: number, path: population.icc, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: icc}}
          - {id: icc_null, in_effect_text: true, writeup_label: "ICC to beat", label: "The ICC you want to show it is above", type: number, path: population.icc_null, required: true, min: 0, max_exclusive: 1,
             shown_if: {field: question, is: icc},
             help: "0 tests only that the ratings agree more than by chance, which is rarely the question. For example, 0.6."}
          - {id: icc_raters, in_effect_text: true, writeup_label: "ratings of each person", label: "Ratings of each person (raters, or occasions)", type: number, path: population.raters, required: true, min: 2, integer: true,
             shown_if: {field: question, is: icc}}
          # The F test's exact power by default, Walter, Eliasziw and
          # Donner's approximation on request (Departure 29, 15 November
          # 2026).
          - {id: icc_method, label: "How power is worked out", type: select, path: target_test.method, required: true,
             shown_if: {field: question, is: icc},
             choices: {icc_test: "The F test's exact power (Donner and Eliasziw, 1987)", icc_walter: "Walter, Eliasziw and Donner's approximation (ICC.Sample.Size)"},
             default: icc_test, default_source: "the F test's exact power, from the F distribution the one-way random-effects model gives (Donner and Eliasziw, 1987); ICC.Sample.Size's calculateIccPower() uses Walter, Eliasziw and Donner's normal approximation to it (version 1.1)",
             choice_notes: {icc_test: "The power of the F test you will run, from its exact distribution. Both are instant.",
                            icc_walter: "The normal approximation ICC.Sample.Size uses. It asks for a few more people than needed: for an ICC of 0.8 against 0.6 with 3 raters, one-sided, 27 rather than 26."}}
      - input: "Cronbach's alpha: the value you expect, the value to beat, and the number of items"
        shown_if: {field: question, is: cronbach_alpha}
        fields:
          - {id: reliability, optional_for: [sensitivity], when_empty: same_as, same_as: reliability_null, writeup_label: "expected alpha", label: "The alpha you expect", type: number, path: population.reliability, effect: true, min: 0.001, max: 0.999,
             shown_if: {field: question, is: cronbach_alpha}}
          - {id: reliability_null, in_effect_text: true, writeup_label: "alpha to beat", label: "The alpha you want to show it is above", help: "For example, 0.7.", type: number, path: population.reliability_null, required: true, min: 0, max_exclusive: 1,
             shown_if: {field: question, is: cronbach_alpha}}
          - {id: items, in_effect_text: true, writeup_label: "number of items", label: "Number of items in the scale", type: number, path: population.items, required: true, min: 2, integer: true,
             shown_if: {field: question, is: cronbach_alpha}}
      - input: "Kappa: the categories, the raters, and the kappa you expect"
        shown_if: {field: question, is: kappa}
        fields:
          - {id: Y_levels, label: "The categories raters choose from, separated by commas", help: "Between 2 and 5.", type: levels, path: variables.Y.levels, required: true,
             shown_if: {field: question, is: kappa}}
          - {id: proportions, in_effect_text: true, writeup_label: "share of subjects in each category", label: "Share of subjects in each category", help: "In the same order, separated by commas. They add up to 1.", type: numbers, per_levels: Y_levels, path: population.proportions, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: kappa}}
          - {id: kappa_raters, in_effect_text: true, writeup_label: "number of raters", label: "Number of raters who rate every subject", help: "Between 2 and 6.", type: number, path: population.raters, required: true, min: 2, max: 6, integer: true,
             shown_if: {field: question, is: kappa}}
          - {id: kappa, optional_for: [sensitivity], when_empty: same_as, same_as: kappa_null, writeup_label: "expected kappa", label: "The kappa you expect", type: number, path: population.kappa, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: kappa}}
          - {id: kappa_null, in_effect_text: true, writeup_label: "kappa under the null hypothesis", label: "The kappa to test against", type: number, path: population.kappa_null, required: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: question, is: kappa},
             help: "kappaSize tests whether kappa equals this value, in either direction; it takes values above 0. For example, 0.4."}
      - input: "Bland-Altman: the bias, the SD of the differences, and the largest acceptable difference"
        shown_if: {field: question, is: bland_altman}
        note: "Each subject is measured by both methods. The analysis is of the differences between them: their mean (the bias) and the limits of agreement, the bias plus and minus 1.96 SDs of the differences for 95% limits. Agreement is shown when both limits, at the outer ends of their confidence intervals, lie within plus and minus the largest difference that would not matter in practice."
        fields:
          - {id: ba_bias, writeup_label: "expected bias (method 1 minus method 2)", label: "Expected bias between the methods", help: "The mean difference you expect: method 1 minus method 2, in the measure's units.", type: number, path: population.bias, effect: true,
             shown_if: {field: question, is: bland_altman}}
          - {id: ba_sd, writeup_label: "expected SD of the differences", label: "The SD of the differences you expect (in the measure's units)", type: number, path: population.sd_difference, effect: true, min_exclusive: 0,
             shown_if: {field: question, is: bland_altman}}
          - {id: ba_margin, in_effect_text: true, writeup_label: "largest acceptable difference", label: "Largest difference that would not matter", type: number, path: population.margin, required: true, min_exclusive: 0,
             shown_if: {field: question, is: bland_altman},
             help: "The largest difference between the methods that wouldn't matter in practice. Both limits of agreement must lie within plus and minus this. Set it from clinical or practical grounds before the data are collected, not from the limits you hope to see."}
          - {id: agree_level, in_effect_text: true, writeup_label: "share of differences the limits cover", label: "The share of differences the limits of agreement cover", type: number, path: target_test.agree_level, required: true, min_exclusive: 0.5, max_exclusive: 1,
             default: 0.95, default_source: "95% limits of agreement, Bland and Altman's usual choice (SimplyAgree's agreement_limit(agree.level = 0.95), version 0.3.0)",
             shown_if: {field: question, is: bland_altman}}
          - {id: ba_method, label: "How to work it out", type: select, path: target_test.method, required: true,
             shown_if: {field: question, is: bland_altman},
             choices: {mover: "Simulate the analysis, with MOVER confidence intervals for the limits (recommended)",
                       bland_altman: "Simulate the analysis, with Bland and Altman's confidence intervals for the limits",
                       lu_formula: "Quick approximation: Lu et al.'s (2016) formula (instant, less accurate)"},
             default: mover, default_source: "the MOVER intervals, SimplyAgree's default (agreement_limit(loa_calc = 'mover'), version 0.3.0), whose error rates are close to their nominal level",
             choice_notes: {mover: "Powerkit simulates studies like yours and analyses each with SimplyAgree's agreement_limit(), as you would analyse your data. Each limit is tested at half the significance level you set (the outer end of a two-sided interval), so with a limit at the margin the chance of wrongly showing agreement is half that level; the MOVER intervals (Zou, 2013) keep it close to that. Power at a fixed sample size runs here in under a minute; a sample size comes as an R script that takes about 5 minutes.",
                            bland_altman: "The same simulation with Bland and Altman's (1999) approximate intervals. Choose it if that is the analysis you will report. Its intervals are a little too narrow in small samples, so it shows agreement more often than it should: at 30 subjects, about the full level you set rather than half of it.",
                            lu_formula: "The published formula for this analysis (Lu et al., 2016), SimplyAgree's blandPowerCurve(). It is instant, but it approximates the analysis it plans for: for a bias of 0.5, an SD of the differences of 2.5 and a margin of 8, it gives 80% power at 26 subjects, where the MOVER analysis has about 69% and needs 33. Use it to explore, and the simulation for the number you report."}}
  E44:
    methods_name: "an actor-partner interdependence model"
    tool: power4mome
    units: pairs
    directional: false
    base: {spec_version: "0.1", design: dyadic, template: apim,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {method: wald_z}}
    groups:
      - input: "The variables, and whether the members can be told apart"
        fields:
          - {id: X_label, label: "Measured on each member (X; for example, daily stress)", type: text, path: variables.X.label, required: true}
          - {id: Y_label, label: "The outcome measured on each member", help: "Y, for example relationship satisfaction.", type: text, path: variables.Y.label, required: true}
          - {id: distinguishable, label: "Can the two members be told apart in a way that matters?", type: select, required: true,
             choices: {"false": "No (for example, same-sex friends or twins): one actor and one partner effect, shared", "true": "Yes (for example, a woman and a man, or a parent and child): each member has their own"},
             sets: {"false": [{path: population.distinguishable, value: false}], "true": [{path: population.distinguishable, value: true}]},
             default: "false", default_source: "indistinguishable members, the model with fewer effects to give"}
          - {id: member_1, label: "Member 1", help: "For example, woman.", type: text, path: population.members.1, required: true,
             shown_if: {field: distinguishable, is: "true"}}
          - {id: member_2, label: "Member 2", help: "For example, man.", type: text, path: population.members.2, required: true,
             shown_if: {field: distinguishable, is: "true"}}
      - input: "The actor and partner effects"
        fields:
          - {id: actor, writeup_label: "actor effect", label: "Actor effect: a person's X on their own Y (a standardised path, -1 to 1)", type: number, path: population.actor, effect: true, min: -1, max: 1,
             shown_if: {field: distinguishable, is: "false"}}
          - {id: partner, writeup_label: "partner effect", label: "Partner effect: a person's X on their partner's Y (a standardised path)", type: number, path: population.partner, effect: true, min: -1, max: 1,
             shown_if: {field: distinguishable, is: "false"}}
          - {id: actor_1, writeup_label: "member 1's actor effect", label: "Member 1's actor effect: member 1's X on member 1's Y", type: number, path: population.actor_1, effect: true, min: -1, max: 1,
             shown_if: {field: distinguishable, is: "true"}}
          - {id: actor_2, writeup_label: "member 2's actor effect", label: "Member 2's actor effect: member 2's X on member 2's Y", type: number, path: population.actor_2, effect: true, min: -1, max: 1,
             shown_if: {field: distinguishable, is: "true"}}
          - {id: partner_12, writeup_label: "partner effect of member 1 on member 2", label: "Partner effect of member 1 on member 2: member 1's X on member 2's Y", type: number, path: population.partner_12, effect: true, min: -1, max: 1,
             shown_if: {field: distinguishable, is: "true"}}
          - {id: partner_21, writeup_label: "partner effect of member 2 on member 1", label: "Partner effect of member 2 on member 1: member 2's X on member 1's Y", type: number, path: population.partner_21, effect: true, min: -1, max: 1,
             shown_if: {field: distinguishable, is: "true"}}
          - {id: apim_effect, label: "The effect to test (shared effects)", type: select, path: target_test.effect, required: true,
             shown_if: [{field: distinguishable, is: "false"}, {field: apim_moderator, is: "none"}],
             choices: {partner: "The partner effect", actor: "The actor effect", actor_and_partner: "Both: the actor and the partner effect significant in the same study (joint power)"},
             default: partner, default_source: "the partner effect, the one dyadic designs are usually planned for"}
          - {id: apim_effect_d, label: "The effect to test (each member's own)", type: select, path: target_test.effect, required: true,
             shown_if: [{field: distinguishable, is: "true"}, {field: apim_moderator, is: "none"}],
             choices: {partner_21: "Member 2's partner effect on member 1", partner_12: "Member 1's partner effect on member 2", actor_1: "Member 1's actor effect", actor_2: "Member 2's actor effect",
                       both_partners: "Both partner effects significant in the same study (joint power)", both_actors: "Both actor effects (joint power)", all_four: "All four effects (joint power)"},
             default: partner_21, default_source: "a partner effect, the kind dyadic designs are usually planned for"}
      - input: "Whether the actor effect depends on something about the pair"
        fields:
          - {id: apim_moderator, label: "Does the actor effect depend on a pair-level score?", help: "A moderator that describes the pair, such as relationship length.", type: select, required: true,
             choices: {none: "No", "yes": "Yes: the pair-level score W moderates each member's actor effect"},
             sets: {"yes": [{path: variables.W.type, value: continuous}]},
             default: none, default_source: "no moderator, the actor-partner model on its own"}
          - {id: W_label, label: "The pair-level moderator (W)", help: "One value per pair, for example relationship length.", type: text, path: variables.W.label, required: true,
             shown_if: {field: apim_moderator, is: "yes"}}
          - {id: moderation, writeup_label: "moderation of the actor effect", label: "Moderation of the actor effect by W", type: number, path: population.moderation, effect: true, min: -1, max: 1,
             shown_if: [{field: apim_moderator, is: "yes"}, {field: distinguishable, is: "false"}],
             help: "How much the actor effect changes per SD of W: the standardised X x W path on a person's own Y. 0 means W doesn't change the actor effect. For example 0.15: one SD more of W makes the actor effect 0.15 larger. With few pairs the test lavaan reports for the moderation is slightly liberal: about 7% false positives at a 5% level with 60 pairs, close to 5% from 200."}
          - {id: w_y, writeup_label: "W's effect on each member's Y", label: "W's own effect on each member's Y (a standardised path)", type: number, path: population.w_y, effect: true, min: -1, max: 1,
             shown_if: [{field: apim_moderator, is: "yes"}, {field: distinguishable, is: "false"}]}
          - {id: moderation_1, writeup_label: "moderation of member 1's actor effect", label: "Moderation of member 1's actor effect (X1 x W on member 1's Y)", type: number, path: population.moderation_1, effect: true, min: -1, max: 1,
             shown_if: [{field: apim_moderator, is: "yes"}, {field: distinguishable, is: "true"}]}
          - {id: moderation_2, writeup_label: "moderation of member 2's actor effect", label: "Moderation of member 2's actor effect (X2 x W on member 2's Y)", type: number, path: population.moderation_2, effect: true, min: -1, max: 1,
             shown_if: [{field: apim_moderator, is: "yes"}, {field: distinguishable, is: "true"}]}
          - {id: w_y_1, writeup_label: "W's effect on member 1's Y", label: "W's own effect on member 1's Y", type: number, path: population.w_y_1, effect: true, min: -1, max: 1,
             shown_if: [{field: apim_moderator, is: "yes"}, {field: distinguishable, is: "true"}]}
          - {id: w_y_2, writeup_label: "W's effect on member 2's Y", label: "W's own effect on member 2's Y", type: number, path: population.w_y_2, effect: true, min: -1, max: 1,
             shown_if: [{field: apim_moderator, is: "yes"}, {field: distinguishable, is: "true"}]}
          - {id: r_xw, writeup_label: "correlation of W with each member's X", label: "Correlation of W with each member's X", type: number, path: population.r_xw, required: true, min_exclusive: -1, max_exclusive: 1,
             default: 0, default_source: "uncorrelated, the simplest assumption; give the correlation from earlier data if you have it",
             shown_if: {field: apim_moderator, is: "yes"}}
          - {id: apim_effect_w, label: "The effect to test (shared effects)", type: select, path: target_test.effect, required: true,
             shown_if: [{field: distinguishable, is: "false"}, {field: apim_moderator, is: "yes"}],
             choices: {moderation: "The moderation of the actor effect", actor_and_moderation: "Both: the actor effect and its moderation significant in the same study (joint power)",
                       partner: "The partner effect", actor: "The actor effect", actor_and_partner: "The actor and the partner effect (joint power)"},
             default: moderation, default_source: "the moderation, the reason for adding W"}
          - {id: apim_effect_dw, label: "The effect to test (each member's own)", type: select, path: target_test.effect, required: true,
             shown_if: [{field: distinguishable, is: "true"}, {field: apim_moderator, is: "yes"}],
             choices: {both_moderations: "Both moderations significant in the same study (joint power)", moderation_1: "The moderation of member 1's actor effect", moderation_2: "The moderation of member 2's actor effect",
                       actors_and_moderations: "Both actor effects and both moderations (joint power)", partner_21: "Member 2's partner effect on member 1", partner_12: "Member 1's partner effect on member 2",
                       actor_1: "Member 1's actor effect", actor_2: "Member 2's actor effect", both_partners: "Both partner effects (joint power)", both_actors: "Both actor effects (joint power)", all_four: "All four actor and partner effects (joint power)"},
             default: both_moderations, default_source: "both members' moderations, the reason for adding W"}
      - input: "How alike the members are"
        fields:
          - {id: r_x, writeup_label: "correlation of the members' X", label: "Correlation of the two members' X", type: number, path: population.r_x, effect: true, min: -1, max: 1}
          - {id: r_y, writeup_label: "residual correlation of the members' Y", label: "How alike the two members' Y are beyond their X (the residual correlation)", type: number, path: population.r_y, effect: true, min: -1, max: 1,
             help: "Often called non-independence: how much the two members' outcomes go together once both members' X are allowed for."}

  # People nested in groups (simr): a person-level X, a group-level W and
  # their cross-level interaction (31 October 2026).
  # Within-person moderation (E41): occasions within people, a predictor
  # measured on each occasion (X, centred within each person) and one
  # measured once per person (W); the cross-level interaction in E62's
  # two-level model, with n counting observations (goal > unit
  # "observations"), so the result names people and occasions.
  E41:
    methods_name: "a two-level mixed model of occasions within people, with an occasion-level and a person-level predictor"
    sensitivity: true
    # One coefficient tested: several together are not searched.
    sensitivity_shown_if: {field: two_level_effect, is_one_of: [cross_level_interaction, within_effect, between_effect]}
    tool: simr
    departures: ["16"]
    directional: false
    base: {spec_version: "0.1", design: mixed_model, template: two_level,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: raw},
           target_test: {method: satterthwaite_t}, goal: {unit: observations}}
    groups:
      - input: "The outcome, what is measured on each occasion, and what is measured once per person"
        fields:
          - {id: Y_label, label: "Outcome, measured on each occasion", help: "For example, evening mood.", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "Measured on each occasion (X; for example, the day's stress)", type: text, path: variables.X.label, required: true}
          - {id: W_label, label: "Measured once per person (W, the moderator; for example, neuroticism)", type: text, path: variables.W.label, required: true}
          - {id: two_outcome, label: "The outcome is", type: select, path: variables.Y.type, required: true,
             choices: {continuous: "A score (for example, a mood rating)", binary: "Yes or no (for example, drank alcohol that day)"},
             sets: {binary: [{path: population.metric, value: probability}]},
             default: continuous, default_source: "a score, the commoner outcome",
             help: "With yes or no, Powerkit fits a logistic mixed model (lme4's glmer), and every effect and SD below is on the log-odds scale."}
          - {id: two_test, label: "Test (yes/no outcome)", type: select, path: target_test.method, required: true,
             shown_if: {field: two_outcome, is: binary},
             choices: {wald: "Wald test (the p-value glmer's summary reports)", likelihood_ratio: "Likelihood-ratio test (comparing the model with and without the effect)"},
             default: wald, default_source: "the test glmer's summary reports, simr's default for a numeric predictor"}
          - {id: df_method, label: "Degrees of freedom for the test (score outcome)", type: select, path: target_test.df_method, required: true,
             shown_if: {field: two_outcome, is: continuous},
             choices: {satterthwaite: "Satterthwaite's (lmerTest; the p-value most lme4 users report)", kenward_roger: "Kenward and Roger's (pbkrtest; slower to simulate)"},
             choice_notes: {kenward_roger: "Kenward and Roger's method also adjusts the standard errors of the effects for a small number of participants, items or groups. Each simulated study takes longer to test."},
             default: satterthwaite, default_source: "Satterthwaite's t test, the p-value lmerTest reports (Departure 16, decided 30 October 2026)",
             help: "Both correct the t or F test for having few participants, items or groups, and they usually give similar p-values. Plan with the one you will report."}
      - input: "Each effect, how much people differ, and the occasion-to-occasion SD"
        fields:
          - {id: two_probability, writeup_label: "chance of yes for a typical person", label: "Chance of 'yes' for a typical person", help: "On a typical occasion, at the average X and W (0 to 1).", type: number, path: population.probability, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: two_outcome, is: binary}}
          - {id: b_X, writeup_label: "X's effect within people", help: "The change in the outcome (or its log odds, for yes/no) on an occasion when X is one SD above the person's own average.", label: "X's effect within people", type: number, path: population.b_X, effect: true}
          - {id: b_W, writeup_label: "W's effect between people", help: "The change in a person's average outcome for one SD more of W.", label: "W's effect between people", type: number, path: population.b_W, effect: true}
          - {id: b_XW, writeup_label: "cross-level interaction", label: "Cross-level interaction of X and W", help: "How much X's within-person effect changes for one SD more of W.", type: number, path: population.b_XW, effect: true}
          - {id: sd_group, writeup_label: "SD of people's averages", label: "SD of people's average outcome beyond W (random intercepts)", type: number, path: population.sd_group, effect: true, min: 0,
             help: "In the outcome's units. With an occasion-to-occasion SD of 1, an SD of 0.7 means about a third of the variance lies between people (an intraclass correlation of 0.33), common in diary studies."}
          - {id: sd_group_slope, writeup_label: "SD of X's effect across people", label: "SD of X's within-person effect across people beyond W (random slopes)", type: number, path: population.sd_group_slope, effect: true, min: 0}
          - {id: r_group, label: "Correlation of people's averages and their X effects", help: "Empty means 0.", type: number, path: population.r_group, optional: true, empty_text: "0", min: -1, max: 1}
          - {id: sd_residual, writeup_label: "occasion-to-occasion SD", label: "Occasion-to-occasion SD", help: "How much a person's outcome varies around their own line.", type: number, path: population.sd_residual, effect: true, min_exclusive: 0,
             shown_if: {field: two_outcome, is: continuous}}
      - input: "The number of occasions, and the effect to test"
        fields:
          - {id: cluster_size, label: "Occasions per person (the same for everyone; for example, 14 diary days)", type: number, path: population.cluster_size, required: true, min: 2, integer: true,
             help: "The sample size below counts every observation: people times occasions. The result gives the number of people too."}
          - {id: two_level_effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {cross_level_interaction: "The moderation: does X's within-person effect depend on W?", within_effect: "X's effect within people", between_effect: "W's effect between people",
                       within_and_interaction: "Both X's effect and the moderation significant in the same study (joint power)",
                       all_effects: "All three effects significant in the same study (joint power)"},
             help: "Joint power is the chance that every effect named is significant in the same study, when the claim needs all of them. It is lower than each effect's own power.",
             default: cross_level_interaction, default_source: "the cross-level interaction, the effect this design is usually planned for"}

  E62:
    methods_name: "a two-level mixed model with a person-level and a group-level predictor"
    sensitivity: true
    # One coefficient tested: several together are not searched.
    sensitivity_shown_if: {any: [[{field: in_sites, is: "no"}, {field: two_level_effect, is_one_of: [cross_level_interaction, within_effect, between_effect]}], [{field: in_sites, is: "yes"}, {field: three_level_effect, is_one_of: [cross_level_interaction, site_interaction, within_effect, between_effect, site_effect]}]]}
    tool: simr
    departures: ["16"]
    directional: false
    base: {spec_version: "0.1", design: mixed_model, template: two_level,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: raw},
           target_test: {method: satterthwaite_t}}
    groups:
      - input: "The outcome, and the predictors at each level"
        fields:
          - {id: Y_label, label: "Outcome", help: "For example, maths score.", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "Measured on each person (X; for example, homework time)", type: text, path: variables.X.label, required: true}
          - {id: W_label, label: "Measured on each group (W; for example, teacher experience)", type: text, path: variables.W.label, required: true}
          - {id: in_sites, label: "Are the groups themselves part of larger groups that matter for the design?", type: select, required: true,
             choices: {"no": "No: one level of groups (for example, classes)", "yes": "Yes: groups within larger groups (for example, classes within schools)"},
             sets: {"yes": [{path: variables.Z.type, value: continuous}]},
             default: "no", default_source: "one level of groups, the commoner design"}
          - {id: Z_label, label: "Measured on each larger group (Z; for example, school funding)", type: text, path: variables.Z.label, required: true,
             shown_if: {field: in_sites, is: "yes"}}
          - {id: two_outcome, label: "The outcome is", type: select, path: variables.Y.type, required: true,
             choices: {continuous: "A score (for example, a maths score)", binary: "Yes or no (for example, passed or not)"},
             sets: {binary: [{path: population.metric, value: probability}]},
             default: continuous, default_source: "a score, the commoner outcome",
             help: "With yes or no, Powerkit fits a logistic mixed model (lme4's glmer), and every effect and SD below is on the log-odds scale."}
          - {id: two_test, label: "Test (yes/no outcome)", type: select, path: target_test.method, required: true,
             shown_if: {field: two_outcome, is: binary},
             choices: {wald: "Wald test (the p-value glmer's summary reports)", likelihood_ratio: "Likelihood-ratio test (comparing the model with and without the effect)"},
             default: wald, default_source: "the test glmer's summary reports, simr's default for a numeric predictor"}
          - {id: df_method, label: "Degrees of freedom for the test (score outcome)", type: select, path: target_test.df_method, required: true,
             shown_if: {field: two_outcome, is: continuous},
             choices: {satterthwaite: "Satterthwaite's (lmerTest; the p-value most lme4 users report)", kenward_roger: "Kenward and Roger's (pbkrtest; slower to simulate)"},
             choice_notes: {kenward_roger: "Kenward and Roger's method also adjusts the standard errors of the effects for a small number of participants, items or groups. Each simulated study takes longer to test."},
             default: satterthwaite, default_source: "Satterthwaite's t test, the p-value lmerTest reports (Departure 16, decided 30 October 2026)",
             help: "Both correct the t or F test for having few participants, items or groups, and they usually give similar p-values. Plan with the one you will report."}
      - input: "Each effect, how much the groups differ, and the residual SD"
        fields:
          - {id: two_probability, writeup_label: "chance of yes for a typical group", label: "The chance of 'yes' for a typical group, at the average X and W", help: "Between 0 and 1.", type: number, path: population.probability, effect: true, min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: two_outcome, is: binary}}
          - {id: b_X, writeup_label: "X's effect within groups", help: "The change in the outcome (or its log odds, for yes/no) for one SD more of X than the group's average.", label: "X's effect within groups", type: number, path: population.b_X, effect: true}
          - {id: b_W, writeup_label: "W's effect between groups", help: "The change in a group's average for one SD more of W.", label: "W's effect between groups", type: number, path: population.b_W, effect: true}
          - {id: b_XW, writeup_label: "cross-level interaction", label: "Cross-level interaction of X and W", help: "How much X's effect changes for one SD more of W.", type: number, path: population.b_XW, effect: true}
          - {id: b_Z, writeup_label: "Z's effect between larger groups", help: "The change in a larger group's average for one SD more of Z.", label: "Z's effect between larger groups", type: number, path: population.b_Z, effect: true,
             shown_if: {field: in_sites, is: "yes"}}
          - {id: b_XZ, writeup_label: "X's interaction with Z", label: "X's interaction with Z: how much X's effect changes for one SD more of Z", type: number, path: population.b_XZ, effect: true,
             shown_if: {field: in_sites, is: "yes"}}
          - {id: sd_group, writeup_label: "SD of the groups' averages", label: "SD of the groups' averages beyond W (random intercepts)", type: number, path: population.sd_group, effect: true, min: 0,
             help: "In the outcome's units. With a residual SD of 1, an SD of 0.33 means about 10% of the variance lies between groups (an intraclass correlation of 0.1)."}
          - {id: sd_group_slope, writeup_label: "SD of X's effect across groups", label: "SD of X's effect across groups beyond W (random slopes)", type: number, path: population.sd_group_slope, effect: true, min: 0}
          - {id: r_group, label: "Correlation of the groups' averages and X's effects", help: "Empty means 0.", type: number, path: population.r_group, optional: true, empty_text: "0", min: -1, max: 1}
          - {id: sd_site, writeup_label: "SD of the larger groups' averages", label: "SD of the larger groups' averages beyond Z (random intercepts)", type: number, path: population.sd_site, effect: true, min: 0,
             shown_if: {field: in_sites, is: "yes"}}
          - {id: sd_site_slope, label: "SD of X's effect across larger groups beyond Z", help: "Empty means 0.", type: number, path: population.sd_site_slope, optional: true, empty_text: "0", min: 0,
             shown_if: {field: in_sites, is: "yes"}}
          - {id: sd_residual, writeup_label: "residual SD", label: "Residual SD: how much people differ within a group", type: number, path: population.sd_residual, effect: true, min_exclusive: 0,
             shown_if: {field: two_outcome, is: continuous}}
      - input: "The sizes of the groups, and the effect to test"
        fields:
          - {id: cluster_size, label: "People in each group (the same in every group)", type: number, path: population.cluster_size, required: true, min: 2, integer: true}
          - {id: groups_per_site, label: "Groups in each larger group (the same in every one)", type: number, path: population.groups_per_site, required: true, min: 2, integer: true,
             shown_if: {field: in_sites, is: "yes"},
             help: "The total number of people is then a whole number of larger groups."}
          - {id: two_level_effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             shown_if: {field: in_sites, is: "no"},
             choices: {cross_level_interaction: "The cross-level interaction: does X's effect depend on W?", within_effect: "X's effect within groups", between_effect: "W's effect between groups",
                       within_and_interaction: "Both X's effect and the cross-level interaction significant in the same study (joint power)",
                       all_effects: "All three effects significant in the same study (joint power)"},
             help: "Joint power is the chance that every effect named is significant in the same study, when the claim needs all of them. It is lower than each effect's own power.",
             default: cross_level_interaction, default_source: "the cross-level interaction, the effect this design is usually planned for"}
          - {id: three_level_effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             shown_if: {field: in_sites, is: "yes"},
             choices: {cross_level_interaction: "X's interaction with W: does X's effect depend on the group?", site_interaction: "X's interaction with Z: does X's effect depend on the larger group?",
                       within_effect: "X's effect within groups", between_effect: "W's effect between groups", site_effect: "Z's effect between larger groups",
                       both_interactions: "Both of X's interactions, with W and with Z, significant in the same study (joint power)",
                       within_and_interaction: "X's effect and its interaction with W, both significant in the same study (joint power)",
                       all_effects: "All five effects significant in the same study (joint power)"},
             default: cross_level_interaction, default_source: "the cross-level interaction, the effect this design is usually planned for"}

  E11:
    methods_name: "a parallel mediation model"
    sensitivity: true
    tool: power4mome
    departures: ["6", "7", "8"]
    known_differences: ["14"]
    known_differences_if_method: {"14": monte_carlo_ci}
    directional: false
    mediators: parallel
    base: {spec_version: "0.1", design: mediation, template: process_4,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, method: monte_carlo_ci}}
    names: [X, "Y"]
    # Generated by R/forms.R for the chosen number of mediators: the paths
    # for each mediator, the residual correlations and the target path.
    groups:
      - input: "Whether X is a score or two groups or conditions"
        fields:
          # A yes/no X (E16's decisions, 29 October 2026): power4mome's
          # rbinary_rs() with the share in X's second level; paths from X
          # stay standardised (per SD of X).
          - {id: x_type, label: "X is", type: select, required: true,
             choices: {score: "A score", binary: "Two groups or conditions"},
             default: score, default_source: "the design as most often planned; choose two groups for an experiment",
             sets: {score: [{path: variables.X.type, value: continuous}], binary: [{path: variables.X.type, value: binary}]}}
          - {id: X_levels, label: "X's two groups or conditions", help: "Separated by a comma, the comparison group first.", type: levels, path: variables.X.levels, required: true,
             shown_if: {field: x_type, is: binary}}
          - {id: x_prob, label: "Share of people in X's second group (0 to 1; empty = 0.5, equal groups)", type: number, path: population.x_prob, optional: true, empty_text: "0.5 (equal groups)", min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: x_type, is: binary}}
      - input: "Standardised paths for each mediator"
        generated: parallel_paths
      - input: "Correlations between the mediators' residuals"
        generated: residual_correlations
      - input: "Which indirect path the hypothesis is about"
        generated: target_path

  E12:
    methods_name: "a serial mediation model"
    sensitivity: true
    tool: power4mome
    departures: ["6", "8"]
    known_differences: ["14"]
    known_differences_if_method: {"14": monte_carlo_ci}
    directional: false
    mediators: serial
    base: {spec_version: "0.1", design: mediation, template: process_6,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, method: monte_carlo_ci}}
    names: [X, "Y"]
    groups:
      - input: "Whether X is a score or two groups or conditions"
        fields:
          # A yes/no X (E16's decisions, 29 October 2026): power4mome's
          # rbinary_rs() with the share in X's second level; paths from X
          # stay standardised (per SD of X).
          - {id: x_type, label: "X is", type: select, required: true,
             choices: {score: "A score", binary: "Two groups or conditions"},
             default: score, default_source: "the design as most often planned; choose two groups for an experiment",
             sets: {score: [{path: variables.X.type, value: continuous}], binary: [{path: variables.X.type, value: binary}]}}
          - {id: X_levels, label: "X's two groups or conditions", help: "Separated by a comma, the comparison group first.", type: levels, path: variables.X.levels, required: true,
             shown_if: {field: x_type, is: binary}}
          - {id: x_prob, label: "Share of people in X's second group (0 to 1; empty = 0.5, equal groups)", type: number, path: population.x_prob, optional: true, empty_text: "0.5 (equal groups)", min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: x_type, is: binary}}
      - input: "Standardised paths, every forward path"
        generated: serial_paths
      - input: "Which indirect path the hypothesis is about"
        generated: target_path

  E13:
    methods_name: "a first-stage moderated mediation model (index of moderated mediation)"
    sensitivity: true
    tool: power4mome
    departures: ["6", "8"]
    known_differences: ["14"]
    known_differences_if_method: {"14": monte_carlo_ci}
    directional: false
    base: {spec_version: "0.1", design: moderated_mediation, template: process_7,
           variables: {X: {type: continuous}, W: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: index_of_moderated_mediation, method: monte_carlo_ci}}
    names: [X, W, M, "Y"]
    groups:
      - input: "Standardised paths, including the interaction XW -> M"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_W_M, label: "Path W -> M", type: number, path: "population.paths.W->M", effect: true}
          - {id: p_XW_M, label: "Path XW -> M (the interaction)", type: number, path: "population.paths.XW->M", effect: true, help: "The coefficient of the product x*w in the regression of M on X, W and x*w, after X, W and M are each standardised (power4mome's meaning). The product itself is not standardised again, so when X and W correlate this is a little smaller than the product's fully standardised coefficient."}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
          - {id: c_X_W, label: "Correlation of X with W", help: "Optional: empty means 0, for example when X is randomised. It must be 0 if X or W is yes/no.", type: number, path: "population.correlations.X<->W", optional: true, min: -1, max: 1}

  E14:
    methods_name: "a second-stage moderated mediation model"
    sensitivity: true
    tool: power4mome
    departures: ["6", "8"]
    known_differences: ["14"]
    known_differences_if_method: {"14": monte_carlo_ci}
    directional: false
    base: {spec_version: "0.1", design: moderated_mediation, template: process_14,
           variables: {X: {type: continuous}, W: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: index_of_moderated_mediation, method: monte_carlo_ci}}
    names: [X, W, M, "Y"]
    groups:
      - input: "Standardised paths, including the interaction MW -> Y"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_W_Y, label: "Path W -> Y", type: number, path: "population.paths.W->Y", effect: true}
          - {id: p_MW_Y, label: "Path MW -> Y (the interaction)", type: number, path: "population.paths.MW->Y", effect: true, help: "The coefficient of the product m*w in the regression of Y, after M, W and Y are each standardised (power4mome's meaning). The product itself is not standardised again, so when M and W correlate this is a little smaller than the product's fully standardised coefficient."}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
          - {id: c_X_W, label: "Correlation of X with W", help: "Empty means 0.", type: number, path: "population.correlations.X<->W", optional: true, min: -1, max: 1}

  # Moderated mediation with a yes/no X or W (PROCESS models 7 and 14;
  # 1 November 2026): rbinary_rs(), rescaled to mean 0 and SD 1, as for
  # E16's X.
  E17:
    methods_name: "a moderated mediation model with a yes/no predictor or moderator (index of moderated mediation)"
    sensitivity: true
    tool: power4mome
    departures: ["6", "8"]
    known_differences: ["14"]
    known_differences_if_method: {"14": monte_carlo_ci}
    directional: false
    base: {spec_version: "0.1", design: moderated_mediation, template: process_7,
           variables: {X: {type: continuous}, W: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: index_of_moderated_mediation, method: monte_carlo_ci}}
    names: [X, W, M, "Y"]
    groups:
      - input: "Which link W changes, and which variables are yes/no"
        fields:
          - {id: modmed_stage, label: "W changes", type: select, path: template, required: true,
             choices: {process_7: "The link X -> M (PROCESS model 7)", process_14: "The link M -> Y (PROCESS model 14)"},
             default: process_7, default_source: "the first link, the commoner of the two"}
          - {id: x_type, label: "X is", type: select, path: variables.X.type, required: true,
             choices: {binary: "Two groups or conditions (for example, a randomised condition)", continuous: "A score"},
             default: binary, default_source: "two groups, the reason for this card"}
          - {id: x_prob, label: "Share of people in X's second group (0 to 1; optional, empty = 0.5)", type: number, path: population.x_prob, optional: true, empty_text: "0.5", min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: x_type, is: binary}}
          - {id: w_type, label: "W is", type: select, path: variables.W.type, required: true,
             choices: {continuous: "A score", binary: "Two groups (for example, gender, or a second condition)"},
             default: continuous, default_source: "a score, the commoner moderator"}
          - {id: w_prob, label: "Share of people in W's second group (0 to 1; optional, empty = 0.5)", type: number, path: population.w_prob, optional: true, empty_text: "0.5", min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: w_type, is: binary}}
      - input: "Standardised paths (per SD of a yes/no variable, as power4mome rescales it)"
        fields:
          - {id: x_effects, label: "Give X's effects as", type: select, required: true,
             choices: {paths: "Standardised paths, per SD of X (as power4mome takes them)", d: "Cohen's d of the groups: the difference between the groups' means, in standard deviations"},
             default: paths, default_source: "power4mome's own input, the paths per SD of X",
             shown_if: {field: x_type, is: binary},
             help: "With Cohen's d, Powerkit finds the paths from X that give these differences between the groups (averaged over W), from a simulated sample of 100,000 people, and shows them with the result."}
          - {id: d_M, writeup_label: "Cohen's d of the groups on M", help: "How far apart the groups' means on M are, in standard deviations.", label: "Cohen's d of the groups on M", type: number, path: population.group_d.M, effect: true,
             shown_if: [{field: x_type, is: binary}, {field: x_effects, is: d}]}
          - {id: d_Y, writeup_label: "Cohen's d of the groups on Y overall", help: "Through M as well as directly, in standard deviations.", label: "Cohen's d of the groups on Y overall", type: number, path: population.group_d.Y, effect: true,
             shown_if: [{field: x_type, is: binary}, {field: x_effects, is: d}]}
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true,
             shown_if: [{any: [{field: x_type, is_not: binary}, {field: x_effects, is_not: d}]}]}
          - {id: p_W_M, label: "Path W -> M", type: number, path: "population.paths.W->M", effect: true,
             shown_if: {field: modmed_stage, is: process_7}}
          - {id: p_XW_M, label: "Path XW -> M (the interaction)", type: number, path: "population.paths.XW->M", effect: true, help: "The coefficient of the product x*w in the regression of M on X, W and x*w, after X, W and M are each standardised (power4mome's meaning). The product itself is not standardised again, so when X and W correlate this is a little smaller than the product's fully standardised coefficient.",
             shown_if: {field: modmed_stage, is: process_7}}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_W_Y, label: "Path W -> Y", type: number, path: "population.paths.W->Y", effect: true,
             shown_if: {field: modmed_stage, is: process_14}}
          - {id: p_MW_Y, label: "Path MW -> Y (the interaction)", type: number, path: "population.paths.MW->Y", effect: true, help: "The coefficient of the product m*w in the regression of Y, after M, W and Y are each standardised (power4mome's meaning). The product itself is not standardised again, so when M and W correlate this is a little smaller than the product's fully standardised coefficient.",
             shown_if: {field: modmed_stage, is: process_14}}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true,
             shown_if: [{any: [{field: x_type, is_not: binary}, {field: x_effects, is_not: d}]}],
             help: "A yes/no variable is rescaled to mean 0 and SD 1, so a path from it is per SD, as for a score. With X and W uncorrelated, as a yes/no variable must be here."}
  # W on both links or the direct path too (PROCESS models 8, 58 and 59;
  # 1 November 2026): no single index, so the difference between the
  # conditional indirect effects at two values of W (decisions.md).
  E38:
    methods_name: "a moderated mediation model (the difference between conditional indirect effects)"
    tool: power4mome
    departures: ["6", "8", "19"]
    known_differences: ["14"]
    known_differences_if_method: {"14": monte_carlo_ci}
    directional: false
    base: {spec_version: "0.1", design: moderated_mediation, template: process_58,
           variables: {X: {type: continuous}, W: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: conditional_indirect_difference, method: monte_carlo_ci}}
    names: [X, W, M, "Y"]
    groups:
      - input: "Which links W changes"
        fields:
          - {id: modmed_model, label: "W changes", type: select, path: template, required: true,
             choices: {process_8: "X -> M and the direct path X -> Y (PROCESS model 8)", process_58: "X -> M and M -> Y (PROCESS model 58)", process_59: "X -> M, M -> Y and the direct path (PROCESS model 59)"},
             default: process_58, default_source: "W on both links of the indirect effect, the commonest of the three",
             help: "None of these has a single index of moderated mediation, so Powerkit tests the difference between the indirect effects at two values of W."}
      - input: "Standardised paths, including the interactions"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_W_M, label: "Path W -> M", type: number, path: "population.paths.W->M", effect: true}
          - {id: p_XW_M, label: "Path XW -> M (W changing the X -> M link)", type: number, path: "population.paths.XW->M", effect: true, help: "The coefficient of the product x*w in the regression of M on X, W and x*w, after X, W and M are each standardised (power4mome's meaning). The product itself is not standardised again, so when X and W correlate this is a little smaller than the product's fully standardised coefficient."}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_W_Y, label: "Path W -> Y", type: number, path: "population.paths.W->Y", effect: true}
          - {id: p_MW_Y, label: "Path MW -> Y (W changing the M -> Y link)", type: number, path: "population.paths.MW->Y", effect: true, help: "The coefficient of the product m*w in the regression of Y, after M, W and Y are each standardised (power4mome's meaning). The product itself is not standardised again, so when M and W correlate this is a little smaller than the product's fully standardised coefficient.",
             shown_if: {field: modmed_model, is_one_of: [process_58, process_59]}}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
          - {id: p_XW_Y, label: "Path XW -> Y (W changing the direct path)", type: number, path: "population.paths.XW->Y", effect: true,
             shown_if: {field: modmed_model, is_one_of: [process_8, process_59]}}
          - {id: c_X_W, label: "Correlation of X with W", help: "Empty means 0.", type: number, path: "population.correlations.X<->W", optional: true, min: -1, max: 1}
      - input: "The two values of W to compare"
        fields:
          - {id: w_from, label: "The lower value of W, in SDs from its mean", type: number, path: target_test.w_values.1, required: true,
             default: "-1", default_source: "one SD below the mean, as PROCESS's conditional effects use"}
          - {id: w_to, label: "The higher value of W, in SDs from its mean", type: number, path: target_test.w_values.2, required: true,
             default: "1", default_source: "one SD above the mean, as PROCESS's conditional effects use",
             help: "Power is for the indirect effect at this value minus the one at the lower value."}

  E40:
    methods_name: "a moderated mediation model with parallel mediators (index of moderated mediation)"
    sensitivity: true
    tool: power4mome
    departures: ["6", "7", "8"]
    known_differences: ["14"]
    known_differences_if_method: {"14": monte_carlo_ci}
    directional: false
    mediators: parallel
    base: {spec_version: "0.1", design: moderated_mediation, template: process_7,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: index_of_moderated_mediation, method: monte_carlo_ci}}
    names: [X, W, "Y"]
    groups:
      - input: "Which link W changes, and which variables are yes/no"
        fields:
          - {id: stage, label: "Which link depends on W", type: select, path: template, required: true, default: process_7,
             default_source: "the first-stage model (PROCESS model 7), as on the single-mediator cards' first choice",
             choices: {process_7: "The link from X to each mediator (PROCESS model 7)",
                       process_14: "The link from each mediator to the outcome (PROCESS model 14)"}}
          - {id: x_type, label: "X is", type: select, path: variables.X.type, required: true,
             choices: {continuous: "A score", binary: "Two groups or conditions (for example, a randomised condition)"},
             default: continuous, default_source: "a score, as on this card before yes/no variables were added"}
          - {id: x_prob, label: "Share of people in X's second group (0 to 1; optional, empty = 0.5)", type: number, path: population.x_prob, optional: true, empty_text: "0.5", min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: x_type, is: binary}}
          - {id: w_type, label: "W is", type: select, path: variables.W.type, required: true,
             choices: {continuous: "A score", binary: "Two groups (for example, gender, or a second condition)"},
             default: continuous, default_source: "a score, the commoner moderator"}
          - {id: w_prob, label: "Share of people in W's second group (0 to 1; optional, empty = 0.5)", type: number, path: population.w_prob, optional: true, empty_text: "0.5", min_exclusive: 0, max_exclusive: 1,
             shown_if: {field: w_type, is: binary}}
      - input: "Standardised paths for each mediator, including the interactions with W"
        generated: modmed_paths
      - input: "Correlations between the mediators' residuals, and of X with W"
        generated: residual_correlations
        fields_after:
          - {id: c_X_W, label: "Correlation of X with W", help: "Optional: empty means 0, for example when X is randomised.", type: number, path: "population.correlations.X<->W", optional: true, min: -1, max: 1}
      - input: "Which mediator's index of moderated mediation the hypothesis is about"
        generated: modmed_target

  # Wave 2 (engine PR #51, 18 October 2026): one-way ANOVA, R-squared, one
  # proportion and McNemar. No smallest detectable effect yet: the engine
  # doesn't offer it for these.
  E18:
    sensitivity: true
    sides: false
    methods_name: "a one-way between-subjects ANOVA"
    tool: Superpower
    departures: ["22", "3", "17"]
    known_differences_if_method: {"5": kruskal_wallis}
    known_differences: ["5"]
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_between,
           variables: {A: {type: between_factor}, "Y": {type: continuous}},
           target_test: {effect: main_effect_A}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: A_label, label: "What the groups are", help: "For example, condition.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (three or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected group means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "group means", label: "Means: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true}
      - input: "The SD"
        fields:
          - {id: welch_sd_input, label: "Do you expect the groups to vary by the same amount?", type: select,
             shown_if: {field: test_version, is: welch_f},
             choices: {common: "Yes, or I don't know: one SD for every group", separate: "No: an SD for each group, in the outcome's own units"}, default: common,
             default_source: "one SD for every group, as the F test assumes; Welch's F still guards against spreads that turn out to differ",
             help: "Welch's F doesn't assume the groups vary equally, so either way the test stays accurate. Give an SD for each group if earlier studies show the spreads differ: the sample size then allows for them."}
          - {id: sd, writeup_label: "SD", label: "SD (the same in every group; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: [{any: [{field: test_version, is_not: welch_f}, {field: welch_sd_input, is_not: separate}]}]}
          - {id: sds, writeup_label: "group SDs", label: "SDs: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.sds, effect: true,
             shown_if: [{field: test_version, is: welch_f}, {field: welch_sd_input, is: separate}],
             help: "In the same units as the means."}
      - input: "The ANOVA, Welch's F, the Kruskal-Wallis test, pairwise comparisons or a Bayes factor"
        fields:
          - {id: test_version, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {welch_f: "Welch's ANOVA", anova_f: "Classical one-way ANOVA",
                       kruskal_wallis: "Kruskal-Wallis test",
                       t_test: "Pairwise t-tests",
                       mann_whitney: "Pairwise rank comparisons: a Mann-Whitney test of each pair",
                       dunn: "Pairwise rank comparisons: Dunn's test (JASP's follow-up to the Kruskal-Wallis test)",
                       bayes_factor: "Bayes factor ANOVA"},
             sets: {t_test: [{path: target_test.effect, value: pairwise}], mann_whitney: [{path: target_test.effect, value: pairwise}],
                    dunn: [{path: target_test.effect, value: pairwise}]},
             default: welch_f, default_source: "Welch's F, as Delacre, Leys, Mora and Lakens (2019) recommend by default: it keeps the false-positive rate when the groups' spreads differ and loses little power when they don't. G*Power and Superpower plan for the classical F test",
             choice_notes: {bayes_factor: "Uses the default analysis prior and equal groups; choose the evidence threshold and prior settings below to match the planned Bayesian analysis.", kruskal_wallis: "Rank-based analysis, simulated; power depends on the score shape you choose.", t_test: "Simulates the selected pairwise comparison and applies the adjustment chosen below across all pairs.",
                            mann_whitney: "Each pair is compared on its own two groups' scores, so its result depends only on those two groups. Simulated, with the adjustment chosen below across all pairs; power depends on the score shape you choose.",
                            dunn: "Compares pairs on the ranks of all the groups together, as JASP does after the Kruskal-Wallis test, so a pair's result can change with the other groups' scores. Choose it if that is the test you will report. Simulated, with the adjustment chosen below across all pairs.",
                            welch_f: "Its power is worked out by formula (Levy's approximation, which Jan and Shieh, 2014, found within 1 percentage point of simulation), so the answer comes at once; you can choose a simulation instead below. With one SD for every group it needs only a few more people than the classical F test.",
                            anova_f: "Choose the classical F test when the analysis must match one fixed in advance: a direct replication of a study that used it, a preregistration that names it, or an ANOVA that is one part of a larger model assuming equal spreads. Reporting Welch's F beside it is good practice. Its power is worked out exactly (Superpower), with no simulation."}}
          - {id: comparison, label: "The pair you'll compare: two groups' names, separated by a comma", type: levels, path: target_test.comparison, required: true,
             shown_if: {field: test_version, is_one_of: [t_test, mann_whitney, dunn]},
             help: "This pair's test is the one powered; every pair is still compared, and the adjustment counts them all."}
          - {id: p_adjust, label: "Adjustment for the number of comparisons", type: select, path: target_test.p_adjust, required: true,
             shown_if: {field: test_version, is_one_of: [t_test, mann_whitney, dunn]},
             choices: {holm: "Holm's method (never less power than Bonferroni's)", bonferroni: "Bonferroni's method", none: "None"},
             default: holm, default_source: "Holm's method, which never has less power than Bonferroni's (powerkit's choice; Superpower's default is no adjustment)"}
          - {id: score_shape, label: "The shape of the scores in each group", type: select, path: population.score_shape, required: true,
             shown_if: {field: test_version, is_one_of: [kruskal_wallis, mann_whitney, dunn]},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, Spower's default (p_kruskal.test(), Spower 0.7)",
             help: "Every group has the same shape; the groups differ only by a shift (their means). A rank test's power depends on this shape; the parametric test's figure assumes normal scores."}
          - {id: evidence_threshold, label: "Evidence threshold: the Bayes factor (BF10) the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: test_version, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)",
             help: "BF10 is how many times more likely the data are if the group means differ than if they are all equal. Power here is the chance that BF10 reaches this number."}
          - {id: prior_scale, label: "Scale of the analysis prior", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: test_version, is: bayes_factor},
             default: 0.5, default_source: "JASP's Bayesian ANOVA ('r scale fixed effects' 0.5), the same as BayesFactor's default (anovaBF(rscaleFixed = 'medium'), 1/2; BayesFactor 0.9.12-4.8)",
             help: "The r scale of a Cauchy distribution on the group effects. The prior you will use when you analyse the data. 0.5 is the usual default; use the same value as in your analysis plan."}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         shown_if: {field: test_version, is: anova_f},
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}
      # Welch's F: Levy's approximation by default, Spower's simulation on
      # request (13 November 2026).
      - {id: welch_f_method, label: "How power is worked out", type: select, path: options.method, optional: true,
         shown_if: {field: test_version, is: welch_f},
         choices: {exact: "Formula (Levy's approximation, Jan and Shieh 2014): instant, no simulation noise", simulation: "Simulation (Spower, stats::oneway.test()): repeat studies under the specified population; slower"},
         default: exact, default_source: "Levy's noncentral F approximation to Welch's F, which Jan and Shieh (2014) recommend for power and sample size after finding it within .01 of simulated power; no package powerkit uses has a formula for Welch's F",
         help: "Both plan for the same test, Welch's F. The formula is an approximation that is very close to simulation; choose the simulation to check it, or to have the answer come from repeated studies."}

  # One-way repeated measures (27 October 2026): one within-participants
  # factor, one SD and one correlation for every pair of conditions, so
  # sphericity holds. The smallest detectable effect scales the pattern
  # of means entered.
  E54:
    sensitivity: true
    sides: false
    methods_name: "a one-way repeated-measures ANOVA"
    tool: Superpower
    departures: ["3", "17", "26", "28"]
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_within,
           variables: {A: {type: within_factor}, "Y": {type: continuous}},
           target_test: {effect: main_effect_A, method: anova_f}}
    groups:
      - input: "Names of the conditions and the outcome"
        fields:
          - {id: A_label, label: "What the conditions are", help: "For example, task difficulty or time.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The conditions' names (three or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected mean in each condition"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "condition means", label: "Means: one for each condition, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true}
      - input: "The SD"
        fields:
          - {id: spread, label: "Are the SD and the correlation the same in every condition?", type: select, required: true,
             choices: {same: "Yes: one SD, and one correlation for every pair of conditions", differ: "No: an SD for each condition and a correlation for each pair"},
             default: same, default_source: "one SD and one correlation, as Superpower's examples and G*Power's repeated-measures analysis take them",
             help: "When they differ, sphericity can fail, so Powerkit plans for the Greenhouse-Geisser corrected F test unless you choose otherwise below. Compare the MANOVA approach shown with the result."}
          - {id: sd, writeup_label: "SD", label: "SD (the same in every condition; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: spread, is_not: differ}}
          - {id: sds, writeup_label: "SDs", label: "SDs for each condition", help: "One for each condition, in the same order, separated by commas, in the means' units.", type: numbers, per_levels: A_levels, path: population.sd, effect: true,
             shown_if: {field: spread, is: differ}}
      - input: "The correlation between any two conditions"
        fields:
          - {id: r, writeup_label: "correlation between conditions", label: "Correlation between conditions", help: "Between people's scores in any two conditions. The same for every pair.", type: number, path: population.r, effect: true, min: -1, max: 1,
             shown_if: {field: spread, is_not: differ}}
          - {id: rs, writeup_label: "correlations between conditions", label: "Correlations between conditions", type: numbers, path: population.r, effect: true,
             shown_if: {field: spread, is: differ},
             help: "One for each pair of conditions, in the order (1, 2), (1, 3), ..., (2, 3), ..., separated by commas. With three conditions: first with second, first with third, second with third."}
          - {id: correction, label: "Sphericity correction of the F test", type: select, path: target_test.correction, required: true,
             shown_if: {field: spread, is: differ},
             choices: {none: "None", GG: "Greenhouse-Geisser", HF: "Huynh-Feldt"},
             default: GG, default_source: "powerkit's choice: once the SDs or correlations differ, the uncorrected F test gives false positives more often than alpha, and the Greenhouse-Geisser correction is what researchers usually report (Superpower's own default is no correction)",
             choice_notes: {none: "The uncorrected F test is only valid if sphericity holds. With the SDs and correlations you describe it need not, and the test can then give false positives more often than alpha."}}
      - input: "The ANOVA, Friedman's test, pairwise comparisons or a Bayes factor"
        fields:
          - {id: test_version, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {anova_f: "One-way repeated-measures ANOVA (F test)", friedman: "Friedman's test (rank-based), simulated",
                       t_test: "Pairwise comparisons between conditions (paired t-tests, adjusted for their number), simulated",
                       wilcoxon_signed_rank: "Pairwise rank comparisons: a Wilcoxon signed-rank test of each pair of conditions, simulated",
                       conover: "Pairwise rank comparisons: Conover's test (JASP's follow-up to Friedman's test), simulated",
                       bayes_factor: "Bayes factor of the effect (an inclusion Bayes factor), instead of a p-value, simulated"},
             sets: {t_test: [{path: target_test.effect, value: pairwise}], wilcoxon_signed_rank: [{path: target_test.effect, value: pairwise}],
                    conover: [{path: target_test.effect, value: pairwise}]},
             default: anova_f, default_source: "the F test Superpower computes (ANOVA_exact(), Superpower 0.2.4.1)",
             choice_notes: {wilcoxon_signed_rank: "Each pair is compared on the two conditions' own scores (each person's difference between them), so its result depends only on those two conditions. Power depends on the score shape you choose; the adjustment chosen below covers all the pairs.",
                            conover: "Ranks each person's scores across all the conditions and compares pairs on those ranks, as JASP does after Friedman's test. With only the order of a person's scores to go on it usually has less power than a signed-rank test of each pair, and a pair's result can change with the other conditions' scores. Choose it if that is the test you will report."}}
          - {id: evidence_threshold, label: "Evidence threshold: the inclusion Bayes factor the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: test_version, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)"}
          - {id: prior_scale, label: "Scale of the analysis prior on the effects (r scale, a Cauchy distribution)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: test_version, is: bayes_factor},
             default: 0.5, default_source: "BayesFactor's 'medium' r scale for fixed effects, 0.5, which JASP uses (jaspAnova's AdditionalOptions.qml); participants get JASP's r scale for random effects, 1"}
          - {id: inclusion, label: "How the effect's Bayes factor is averaged over the models", type: select, path: target_test.inclusion, required: true,
             shown_if: {field: test_version, is: bayes_factor},
             choices: {all_models: "Across all models", matched_models: "Across matched models (only models with and without the effect that otherwise match)"},
             default: all_models, default_source: "across all models with equal prior probabilities, the default of JASP's Effects table (jaspAnova's DefaultOptions.qml)",
             help: "Simulating this Bayes factor takes about a second per simulated study, so you get a rough preview here and an R script for the full analysis."}
          - {id: score_shape, label: "The shape of each person's scores around their own level", type: select, path: population.score_shape, required: true,
             shown_if: {field: test_version, is_one_of: [friedman, wilcoxon_signed_rank, conover]},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, as the ANOVA assumes",
             help: "Each score is the condition's mean, the person's own level and a deviation of this shape; the correlation between conditions is the share that is the person's, so it must be at least 0. Conditions differ only by a shift."}
          - {id: comparison, label: "The pair you'll compare: two conditions' names, separated by a comma", type: levels, path: target_test.comparison, required: true,
             shown_if: {field: test_version, is_one_of: [t_test, wilcoxon_signed_rank, conover]},
             help: "This pair's test is the one powered; every pair is still compared, and the adjustment counts them all."}
          - {id: p_adjust, label: "Adjustment for the number of comparisons", type: select, path: target_test.p_adjust, required: true,
             shown_if: {field: test_version, is_one_of: [t_test, wilcoxon_signed_rank, conover]},
             choices: {holm: "Holm's method (never less power than Bonferroni's)", bonferroni: "Bonferroni's method", none: "None"},
             default: holm, default_source: "Holm's method, which never has less power than Bonferroni's (powerkit's choice; Superpower's default is no adjustment)"}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         shown_if: [{field: test_version, is: anova_f}, {any: [{field: spread, is_not: differ}, {field: correction, is: none}]}],
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}
      # A corrected F test whose SDs or correlations differ: simulated by
      # default, because Superpower's exact data set scales the test by
      # epsilon, an approximation (Departure 28, 14 November 2026). Hidden
      # for the smallest detectable effect, which the engine finds with the
      # exact data set (sensitivity_method).
      - {id: gg_method, label: "How power is worked out", type: select, path: options.method, required: true,
         shown_if: [{field: test_version, is: anova_f}, {field: spread, is: differ}, {field: correction, is_not: none}, {field: goal, is_not: sensitivity}, {field: goal, is_not: sensitivity_curve}],
         choices: {simulation: "Repeated simulation of the corrected test (recommended)", exact: "Exact dataset, with the correction applied to its degrees of freedom: an approximation"},
         default: simulation, default_source: "powerkit's choice for a corrected test without sphericity (Departure 28): the exact dataset scales the test by epsilon, which missed simulated power by up to about 3 points in either direction",
         help: "With a sphericity correction and SDs or correlations that differ, only simulated studies give the corrected test's power itself. The exact dataset is instant but approximate.",
         choice_notes: {exact: "This approximation can be a few points too high or too low. Check the sample size by simulation before relying on it."}}

  # Mixed ANOVA beyond 2 x 2 (28 October 2026): one between factor by one
  # within factor, at least one with three or more levels; one SD and one
  # correlation, so sphericity holds. The smallest detectable effect scales
  # the pattern of means entered.
  E55:
    sensitivity: true
    sides: false
    methods_name: "a mixed ANOVA (between- by within-participants factor)"
    departures: ["3", "26", "28"]
    tool: Superpower
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: mixed,
           variables: {A: {type: between_factor}, B: {type: within_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "The groups of different people", help: "For example, group.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names, separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "What everyone is measured in", help: "For example, time.", type: text, path: variables.B.label, required: true}
          - {id: B_levels, label: "The timepoints' or conditions' names, separated by commas", type: levels, path: variables.B.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "cell means", label: "Means for each group and timepoint", text_layout: "one line per group, with one number per timepoint or condition, separated by commas", help: "One line per group, with one number per timepoint or condition, separated by commas.", type: table, path: population.means, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "group", cols_name: "timepoint or condition"}
      - input: "The SD"
        fields:
          - {id: spread, label: "Are the SD and the correlation the same everywhere?", type: select, required: true,
             choices: {same: "Yes: one SD, and one correlation for every pair of timepoints or conditions", differ: "No: an SD for each cell and a correlation for each pair of timepoints or conditions"},
             default: same, default_source: "one SD and one correlation, as Superpower's examples and G*Power's repeated-measures analysis take them",
             help: "Scores often spread out over time, and measurements further apart usually correlate less. Then sphericity can fail, so Powerkit plans for the Greenhouse-Geisser corrected F tests unless you choose otherwise below. Compare the MANOVA approach shown with the result."}
          - {id: sd, writeup_label: "SD", label: "SD (the same in every cell; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: spread, is_not: differ}}
          - {id: sds, writeup_label: "cell SDs", label: "SDs for each group and timepoint", text_layout: "one line per group, with one number per timepoint or condition, separated by commas (in the means' units)", help: "One line per group, with one number per timepoint or condition, separated by commas, in the means' units.", type: table, path: population.sd, effect: true,
             rows_from: A_levels, cols_from: B_levels, rows_name: "group", cols_name: "timepoint or condition", shown_if: {field: spread, is: differ}}
      - input: "The correlation between any two timepoints or conditions"
        fields:
          - {id: r, writeup_label: "correlation between timepoints or conditions", label: "Correlation between timepoints or conditions", help: "Between people's scores at any two timepoints or in any two conditions. The same for every pair.", type: number, path: population.r, effect: true, min: -1, max: 1,
             shown_if: {field: spread, is_not: differ}}
          - {id: rs, writeup_label: "correlations between timepoints or conditions", label: "Correlations between timepoints or conditions", type: numbers, path: population.r, effect: true,
             shown_if: {field: spread, is: differ},
             help: "One for each pair, in the order (1, 2), (1, 3), ..., (2, 3), ..., separated by commas. The same in every group. With three timepoints: first with second, first with third, second with third."}
          - {id: correction, label: "Sphericity correction of the F tests", type: select, path: target_test.correction, required: true,
             shown_if: [{field: spread, is: differ}, {field: test_version, is_not: aligned_rank_transform}],
             choices: {none: "None", GG: "Greenhouse-Geisser", HF: "Huynh-Feldt"},
             default: GG, default_source: "powerkit's choice: once the SDs or correlations differ, the uncorrected F test gives false positives more often than alpha, and the Greenhouse-Geisser correction is what researchers usually report (Superpower's own default is no correction)",
             choice_notes: {none: "The uncorrected F test is only valid if sphericity holds. With the SDs and correlations you describe it need not, and the test can then give false positives more often than alpha."}}
      - input: "Which effect"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction: "The interaction: does the change differ between groups?", main_effect_A: "The groups' difference, averaged over time or conditions", main_effect_B: "The change over time or conditions, averaged over groups"}}
      - input: "The F test, the aligned rank transform or a Bayes factor"
        fields:
          - {id: test_version, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {anova_f: "ANOVA (F test)", aligned_rank_transform: "Aligned rank transform ANOVA (rank-based), simulated", bayes_factor: "Bayes factor of the effect (an inclusion Bayes factor), instead of a p-value, simulated"},
             default: anova_f, default_source: "the F test Superpower computes (Superpower 0.2.4.1), as G*Power does"}
          - {id: evidence_threshold, label: "Evidence threshold: the inclusion Bayes factor the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: test_version, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)"}
          - {id: prior_scale, label: "Scale of the analysis prior on the effects (r scale, a Cauchy distribution)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: test_version, is: bayes_factor},
             default: 0.5, default_source: "BayesFactor's 'medium' r scale for fixed effects, 0.5, which JASP uses (jaspAnova's AdditionalOptions.qml); participants get JASP's r scale for random effects, 1"}
          - {id: inclusion, label: "How the effect's Bayes factor is averaged over the models", type: select, path: target_test.inclusion, required: true,
             shown_if: {field: test_version, is: bayes_factor},
             choices: {all_models: "Across all models", matched_models: "Across matched models (only models with and without the effect that otherwise match)"},
             default: all_models, default_source: "across all models with equal prior probabilities, the default of JASP's Effects table (jaspAnova's DefaultOptions.qml)",
             help: "Simulating this Bayes factor takes about a second per simulated study, so you get a rough preview here and an R script for the full analysis."}
          - {id: score_shape, label: "The shape of the scores in each cell", type: select, path: population.score_shape, required: true,
             shown_if: {field: test_version, is: aligned_rank_transform},
             choices: {normal: "Roughly normal (bell-shaped)", skewed: "Skewed: bunched at one end, with a long tail at the other", heavy_tailed: "Heavy-tailed: more extreme scores than a bell curve, in both directions"},
             default: normal, default_source: "normal scores, as Spower's rank-test experiments default to (Spower 0.7)",
             help: "Each person's scores are their own level plus a deviation of this shape, so one correlation holds between any two of their scores (one per group in a 2 x 2 design). A rank test's power depends on this shape; the ANOVA's figure assumes normal scores."}
      - input: "The size of each group"
        fields:
          # options > group_ratio (decided 1 November 2026): unequal groups
          # are simulated with Spower and afex.
          - {id: group_sizes, label: "Will the groups be the same size?", type: select, required: true,
             choices: {equal: "Yes, equal groups", unequal: "No: give their relative sizes"},
             default: equal, default_source: "equal groups, as Superpower and G*Power's repeated-measures analysis take them",
             help: "Unequal groups usually lower the power of the groups' difference and the interaction. Their power is then found by simulation, which takes longer."}
          - {id: group_ratio, writeup_label: "relative group sizes", label: "Relative group sizes: one whole number for each group, in the same order", type: numbers, per_levels: A_levels, path: options.group_ratio, required: true,
             shown_if: {field: group_sizes, is: unequal},
             help: "For example 2, 1 puts twice as many people in the first group. The total sample size is split in this ratio."}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)",
         shown_if: [{field: group_sizes, is_not: unequal}, {field: test_version, is: anova_f}, {any: [{field: spread, is_not: differ}, {field: correction, is: none}]}]}
      # A corrected F test whose SDs or correlations differ: simulated by
      # default, because Superpower's exact data set scales the test by
      # epsilon, an approximation (Departure 28, 14 November 2026). Hidden
      # for the smallest detectable effect, which the engine finds with the
      # exact data set (sensitivity_method).
      - {id: gg_method, label: "How power is worked out", type: select, path: options.method, required: true,
         shown_if: [{field: group_sizes, is_not: unequal}, {field: test_version, is: anova_f}, {field: spread, is: differ}, {field: correction, is_not: none}, {field: goal, is_not: sensitivity}, {field: goal, is_not: sensitivity_curve}],
         choices: {simulation: "Repeated simulation of the corrected test (recommended)", exact: "Exact dataset, with the correction applied to its degrees of freedom: an approximation"},
         default: simulation, default_source: "powerkit's choice for a corrected test without sphericity (Departure 28): the exact dataset scales the test by epsilon, which missed simulated power by up to about 3 points in either direction",
         help: "With a sphericity correction and SDs or correlations that differ, only simulated studies give the corrected test's power itself. The exact dataset is instant but approximate.",
         choice_notes: {exact: "This approximation can be a few points too high or too low. Check the sample size by simulation before relying on it."}}


  # Three-factor ANOVA (28 October 2026): three crossed factors, any mix of
  # between and within participants, the between factors listed first. One
  # SD; with a within factor, one correlation between every pair of a
  # participant's cells, so sphericity holds. The smallest detectable
  # effect scales the pattern of means entered (6 November 2026).
  E56:
    sensitivity: true
    sides: false
    methods_name: "a three-factor ANOVA"
    departures: ["3"]
    tool: Superpower
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: factorial_three,
           variables: {A: {type: between_factor}, B: {type: between_factor}, C: {type: between_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the three factors, their levels and the outcome"
        note: "List any factor with different people at each level first, then the factors everyone is measured in."
        fields:
          - {id: A_label, label: "First factor", help: "For example, group.", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The first factor's levels, separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: B_label, label: "Second factor", help: "For example, time.", type: text, path: variables.B.label, required: true}
          - {id: B_levels, label: "The second factor's levels, separated by commas", type: levels, path: variables.B.levels, required: true}
          - {id: C_label, label: "Third factor", help: "For example, task difficulty.", type: text, path: variables.C.label, required: true}
          - {id: C_levels, label: "The third factor's levels, separated by commas", type: levels, path: variables.C.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "Which factors everyone is measured in"
        fields:
          - {id: within, label: "Which factors does everyone take part in at every level?", type: select, required: true,
             choices: {none: "None: different people in every combination",
                       C: "Only the third factor",
                       BC: "The second and third factors",
                       ABC: "All three: everyone takes part in every combination"},
             sets: {C: [{path: variables.C.type, value: within_factor}],
                    BC: [{path: variables.B.type, value: within_factor}, {path: variables.C.type, value: within_factor}],
                    ABC: [{path: variables.A.type, value: within_factor}, {path: variables.B.type, value: within_factor}, {path: variables.C.type, value: within_factor}]}}
      - input: "The expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "cell means", label: "Means in each cell", text_layout: "one line for each combination of the first and second factors (first factor's first level with each of the second factor's levels, then its second level, and so on), with one number per level of the third factor, separated by commas", help: "One line for each combination of the first and second factors (the first factor's first level with each of the second factor's levels, then its second level, and so on), with one number per level of the third factor, separated by commas.", type: table, path: population.means, effect: true,
             rows_from: [A_levels, B_levels], nest_by: B_levels, cols_from: C_levels,
             rows_name: "combination of the first and second factors", cols_name: "level of the third factor"}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every cell; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The correlation between any two conditions a person is measured in"
        fields:
          - {id: r, writeup_label: "correlation between repeated measurements", label: "Correlation between conditions", help: "Between a person's scores in any two conditions. The same for every pair.", type: number, path: population.r, effect: true, min: -1, max: 1,
             shown_if: {field: within, is_not: none}}
      - input: "Which effect"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {interaction_ABC: "The three-way interaction: does the two-way interaction of the first two factors depend on the third?",
                       interaction_AB: "The interaction of the first and second factors, averaged over the third",
                       interaction_AC: "The interaction of the first and third factors, averaged over the second",
                       interaction_BC: "The interaction of the second and third factors, averaged over the first",
                       main_effect_A: "The first factor, averaged over the others",
                       main_effect_B: "The second factor, averaged over the others",
                       main_effect_C: "The third factor, averaged over the others"}}
      # The Bayes factor (15 November 2026): JASP's Bayesian ANOVA, the
      # effect's inclusion Bayes factor, simulated; the participants are a
      # random factor when a factor is within participants.
      - input: "The F test or a Bayes factor"
        fields:
          - {id: test_version, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {anova_f: "ANOVA (F test)", bayes_factor: "Bayes factor of the effect (an inclusion Bayes factor), instead of a p-value, simulated"},
             default: anova_f, default_source: "the F test Superpower computes (Superpower 0.2.4.1), as G*Power does",
             choice_notes: {bayes_factor: "Power becomes the chance that the effect's inclusion Bayes factor reaches the threshold you choose below. Simulated from the cell means, with equal groups; with a factor everyone is measured in, the full analysis is an R script you run yourself."}}
          - {id: evidence_threshold, label: "Evidence threshold: the inclusion Bayes factor the study should reach", type: number, path: target_test.evidence_threshold, required: true, min_exclusive: 1,
             shown_if: {field: test_version, is: bayes_factor},
             usual: 10, usual_label: "10 (a common threshold)", default_source: "Empty: choose the evidence your claim needs; 10 is a common threshold (so is 3; there is no correct one), the threshold powerkit's other Bayes factor tests use, bfpwr's default (its help calls it Jeffreys' threshold for evidence at the threshold; bfpwr 0.1.6)"}
          - {id: prior_scale, label: "Scale of the analysis prior on the effects (r scale, a Cauchy distribution)", type: number, path: target_test.prior_scale, required: true, min_exclusive: 0,
             shown_if: {field: test_version, is: bayes_factor},
             default: 0.5, default_source: "BayesFactor's 'medium' r scale for fixed effects, 0.5, which JASP uses (jaspAnova's AdditionalOptions.qml)"}
          - {id: inclusion, label: "How the effect's Bayes factor is averaged over the models", type: select, path: target_test.inclusion, required: true,
             shown_if: {field: test_version, is: bayes_factor},
             choices: {all_models: "Across all models", matched_models: "Across matched models (only models with and without the effect that otherwise match)"},
             default: all_models, default_source: "across all models with equal prior probabilities, the default of JASP's Effects table (jaspAnova's DefaultOptions.qml)",
             help: "The inclusion Bayes factor compares the models that include the effect with those that don't. With three factors, only one of the 18 models has the three-way interaction, so JASP's default across all models and the comparison across matched models can differ more than with two factors."}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         shown_if: {field: test_version, is: anova_f},
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}

  # Two-factor ANOVA, both factors within participants (2 x 2 or larger;
  # 28 October 2026): one SD and one correlation between every pair of
  # cells, so sphericity holds. The smallest detectable effect scales the
  # pattern of means entered.
  E20:
    sensitivity: true
    sides: false
    methods_name: "a two-factor within-participants ANOVA"
    departures: ["3", "26", "28"]
    tool: Superpower
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: factorial_within,
           variables: {A: {type: within_factor}, B: {type: within_factor}, "Y": {type: continuous}},
