    power_source: "ICC.Sample.Size's calculateIccSampleSize() and kappaSize's PowerBinary() start at 0.8 (versions 1.1 and 1.2); Powerkit leaves it empty on every card so that you choose it (8 November 2026); enter one"
  Hmisc:
    alpha: 0.05
    alpha_source: "the default of Hmisc's cpower() (alpha = 0.05, Hmisc 5.3-0) and powerSurvEpi's powerEpiCont.default() (alpha = 0.05, powerSurvEpi 0.1.5)"
    power_source: "neither package has a default target power (powerSurvEpi's ssizeEpiCont.default(power) must be given; cpower() reports power only); enter one"
  longpower:
    alpha: 0.05
