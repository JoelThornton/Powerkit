      full: {power: 400}
      script: {sample_size: "about 30 minutes to 3 hours on one core (an estimate; 5 to 8 sample sizes are simulated)", sensitivity: "about 30 minutes to 3 hours on one core (an estimate; 7 to 10 sizes of the effect are simulated)"}
    E75:
      full_run: [power]
      preview: {power: 20}
      full: {power: 200}
      script: {sample_size: "about 20 minutes to 2 hours on one core, longer with a negative binomial count or ordered categories (an estimate; 5 to 8 sample sizes are simulated)", sensitivity: "about 30 minutes to 3 hours on one core, longer with a negative binomial count or ordered categories (an estimate; 7 to 10 sizes of the effect are simulated)"}
    E67:
      full_run: [power]
      preview: {power: 35}
      full: {power: 350}
      script: {sample_size: "about 30 minutes to 2 hours on one core (an estimate; 5 to 8 sample sizes are simulated)", sensitivity: "about 30 minutes to 2 hours on one core (an estimate; 7 to 10 sizes of the effect are simulated)"}
    E68:
