# The seed a calculation uses unless the user changes it (judgement-calls.md
# B15): fixed, so the same answers always give the same result. It is shown
# on the input screen and the result screen, recorded in the result and
# written into the exported R script.
default_seed: 1

# How E1-E6 are calculated (docs/decisions.md, 17 October 2026): pwr's
# formula by default; Spower simulation estimates power under the supplied
# population, without automatically changing its assumptions. Welch's t-test (E2) has no pwr formula:
# it is simulated by default, with pwrss's formula on request (E2's
# welch_method).
# A form's `method_extra` fields are shown with this choice (E5: the z test,
# as in G*Power, or pwr's Cohen's h; Departure 11).
basic_method_field: {id: calc_method, label: "How power is worked out", type: select, path: options.method, optional: true,
  choices: {exact: "Formula (pwr; base R or pwrss for two proportions)", simulation: "Simulation (Spower): repeat studies under the specified population"},
  help: "Both methods rely on the population and analysis specified here. Selecting simulation does not add skewed scores, unequal spreads or missing data. A departure is included only when this screen provides a specific input for it. Simulation adds random error from the finite number of repeated studies.",
  default: exact, default_source: "powerkit's default for basic tests (docs/decisions.md, 17 October 2026)"}

# Designs the engine can compute that the app can't reach yet: a missing
# card and input screen, not a missing calculation. The queue to clear them
# is in docs/adding-a-test.md. test-repo-consistency.R refuses an engine
# template that is neither named by a card nor listed here, so a design
# can't go quietly unreachable again; delete an entry when its card and
# input screen land.
engine_only: {}  # none waiting at the moment
# Uncertain numbers other than the effect that the result screen's "Which
# assumption matters most?" comparison offers to vary (R/assumptions.R).
# Effect fields (effect: true) are offered without being listed. Each is a
# number the researcher estimates from evidence (an SD, a correlation
# between measures, a reliability, a clustering ICC, a base rate, dropout),
# not a design choice such as alpha or the number of groups.
assumption_fields: [sd_ratio, welch_sd_ratio, raw_sd, raw_sd1, raw_sd2, raw_sd_difference, raw_r, yuen_r,
  r2_main, r2_other, rel_X, rel_W, rel_Z, rel_Y, x_prob, mean_exposure, dispersion, zero_odds_ratio,
  sd_intercept, r_intercept_slope, event_proportion, manova_r, factor_correlation, binm_m_baseline,
  binm_y_baseline, p1, p0, base_rate, icc, icc_group, icc_site, within_correlation, predictor_correlation,
  ri_correlation]

# End points whose calculation runs on the input screen (phase 5). E1-E8
# run in seconds on one core (measured 17 October 2026 with the example
# values and 1,000 replications: 1 to 19 seconds, the longest a
# correlation's sample size). E9 runs in the background with a progress bar
# and a Cancel button (below). E10-E14 run as set under `simulations`.
calculates: [E45, E1, E2, E3, E4, E76, E5, E6, E7, E8, E9, E18, E19, E20, E21, E23, E24, E25, E26, E27, E28, E34, E36, E37, E48, E49, E50, E51, E52, E53, E54, E55, E56, E57, E31, E29, E47, E22, E15, E59, E60, E61, E64, E66, E46, E77, E44, E43, E69, E70, E32, E30, E35, E71, E72, E58, E73, E39, E78]

# End points that run in a separate R process, with an estimated progress
# bar and a Cancel button: the usual run time in seconds for each goal,
# measured with the example values and 1,000 replications on one core
# (docs/phase5-simulations.md, table 1). The bar is estimated from these.
background:
  E9: {power: 5, sample_size: 80, sensitivity: 2}
  E15: {power: 5, sample_size: 80, sensitivity: 45}
  E59: {power: 4, sample_size: 30}
  E58: {power: 25, sample_size: 120, sensitivity: 190}
  E73: {power: 35, sample_size: 320, sensitivity: 800}
  # Mediation with a yes/no mediator (regmedint), measured 14 November 2026.
  E39: {power: 25, sample_size: 200}
  E60: {power: 4, sample_size: 30}
# Cards whose default test version is simulated (runs_simulation()), so it
# runs in the background like those above, while a formula version of the
# same card does not: their usual run times, measured on 7 November 2026
# with the example values (sample size; power estimated as about a ninth,
# since a search simulates 7 to 13 sizes), so their cards no longer say
# "in a second or two" and their progress bars can estimate.
simulated_times:
  E44: {power: 60, sample_size: 520}
  E22: {power: 20, sample_size: 175}
  E61: {power: 8, sample_size: 65, sensitivity: 40}
  E47: {power: 6, sample_size: 50, sensitivity: 60}
  E64: {power: 5, sample_size: 40, sensitivity: 50}
  # Cochran's Q, measured 16 November 2026 on the repeated-measures card's
  # example design (one core).
  E78: {power: 11, sample_size: 190, sensitivity: 110}
  E70: {power: 5, sample_size: 40, sensitivity: 60}
  E30: {power: 4, sample_size: 35, sensitivity: 45}
  # E32: moderation takes about 4 seconds for power (an outcome in three
  # unordered categories, nnet::multinom(), about 10 and 80 for a sample
  # size); mediation with a negative binomial count (regmedint) about 30,
  # the slower case shown.
  E32: {power: 30, sample_size: 200, sensitivity: 90}
  E45: {power: 2, sample_size: 10, sensitivity: 60}
  E72: {power: 2, sample_size: 10, sensitivity: 10}
  # Measured 12 November 2026 the same way: Welch's ANOVA (the one-way
  # ANOVA's default), the trend test and two paired variances.
  E66: {power: 2, sample_size: 16, sensitivity: 35}
  E18: {power: 1, sample_size: 11}
  E57: {power: 1, sample_size: 10, sensitivity: 8}
# Usual times (seconds) for a version that simulates on a card whose
# default doesn't: shown only when that version runs (usual_seconds(),
# R/results.R), and not counted as a simulated card on About. The
# corrected F test without sphericity (Departure 28), measured 16 November
# 2026 on the engine's example designs with unequal correlations. Also a
# quick version of a long-run card (simulations > quick_methods): Cochran's
# Q on the repeated-measures card (E75), measured the same day on its
# example design (one core).
simulated_version_times:
  E54: {power: 22, sample_size: 120}
  E55: {power: 30, sample_size: 350}
  E20: {power: 21, sample_size: 170}
  E75: {power: 11, sample_size: 190, sensitivity: 110}
# At most this many background calculations (E9 and E10-E14's preview and
# full run) at once, across everyone using the app; others are asked to try
# again shortly (R/results.R, background_limit()). Two suits a server with
# two cores; POWERKIT_BACKGROUND_LIMIT overrides it.
background_limit: 2

# Mediation and moderated mediation (E10-E14; the maintainer's decision of
# 17 October 2026, docs/phase5-simulations.md and docs/decisions.md):
# for power, first a rough preview with `preview_nrep` replications, in a
# separate R process, shown as a range (a required N has no preview: with
# 100 replications per sample size the search is too slow and too noisy;
# only goals listed under `preview` get one); then, for the goals under
# `full_run`, the full
# analysis at the app's defaults in a separate process with a progress bar
# and Cancel; for every other goal, an R script to run the full analysis
# on the user's own computer. `preview` and `full` are the usual run times
# in seconds on one core (the bar is estimated from them); `script` is the
# expected run time in words. Measured or estimated as noted in
# docs/phase5-simulations.md.
# Usual run times (seconds) and script estimates. Mediation and PROCESS
# models were re-measured on 13 November 2026 after the Monte Carlo interval
# was computed directly from manymome's draws (fast-mediation-test.R): about
# 0.1 to 0.25 seconds per simulated study, and a PROCESS model 7 required-N
# search in about 15 minutes on a shared 4-core machine.
simulations:
  preview_nrep: 100
  endpoints:
    E10:
      full_run: [power]
      preview: {power: 20}
      full: {power: 230}
      script: {sample_size: "about 15 to 45 minutes on one core (an estimate; 5 to 8 sample sizes are simulated)", sensitivity: "about 15 to 45 minutes on one core (an estimate; 7 to 10 sizes of the effect are simulated)"}
    E16:
      full_run: [power]
      preview: {power: 20}
      full: {power: 230}
      script: {sample_size: "about 15 to 45 minutes on one core (an estimate; 5 to 8 sample sizes are simulated)", sensitivity: "about 15 to 45 minutes on one core (an estimate; 7 to 10 sizes of the effect are simulated)"}
    E42:
      full_run: [power]
      preview: {power: 15}
      full: {power: 150}
      script: {sample_size: "about 15 to 45 minutes on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E33:
      full_run: [power]
      preview: {power: 35}
      full: {power: 350}
      script: {sample_size: "about 30 minutes to 2 hours on one core (an estimate; 5 to 8 sample sizes are simulated)", sensitivity: "about 30 minutes to 2 hours on one core (an estimate; 7 to 10 sizes of the effect are simulated)"}
    E63:
