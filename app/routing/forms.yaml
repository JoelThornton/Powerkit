# Input screens for the end points powerkit runs (E1-E14).
#
# Routing prototype, phase 5 groundwork: a screen collects the values listed
# under "What you would enter" on the card, builds a design spec and checks
# it with the engine's validate_spec(). Nothing is calculated.
#
# Each form has `groups`, one per line of the card's "What you would enter"
# (`input` is that line, copied from tree.yaml; a test checks they match),
# plus the shared closing fields (goal, alpha, power, direction, effect-size
# justification, attrition) that R/forms.R adds.
#
# Field keys:
#   id       input id (prefixed "f_" in the app)
#   label    the field's own label
#   type     text | number | select | levels (comma-separated names) |
#            numbers (comma-separated numbers on one line; with per_levels,
#            one per name in that levels field) |
#            table (rows of comma-separated numbers)
#   path     where the value goes in the spec ("a.b.c"; levels.1 = first level)
#   effect   true for population values (effect sizes, SDs, correlations):
#            they start empty and are required (setting effect_size_inputs)
#   required true if the screen can't build a spec without it
#   optional true if it may be left empty (then the engine's default applies)
#   default  a starting value for a non-effect field, with default_source
#            saying whose default it is
#   min, max limits checked by the screen before the engine sees the spec
#   shown_if {field: <id>, is: <value>} or {field: <id>, is_not: <value>}:
#            the field is shown, checked and put in the spec only when the
#            other field's choice matches (E7's per-cell SDs)
#   sets     for a select: {choice: [{path, value}]}, further spec values
#            that follow from the choice (E24's question sets the effect)

# Defaults of the tool each end point wraps, read from the installed
# packages' function signatures on 17 October 2026.
tool_defaults:
  pwr:
    alpha: 0.05
    alpha_source: "pwr's default (pwr.t.test(sig.level = 0.05), pwr 1.3-0)"
    power_source: "pwr has no default target power (pwr.t.test(power = NULL)); enter one"
    alternative_source: "pwr's default (two-sided: pwr.t.test(alternative = \"two.sided\"), pwr 1.3-0)"
  Spower:
    alpha: 0.05
    alpha_source: "Spower's default (Spower(sig.level = 0.05), Spower 0.7)"
    power_source: "Spower has no default target power (Spower(power = NA)); enter one"
    alternative_source: "Spower's default (two-sided: two.tailed = TRUE, alternative = NULL, Spower 0.7)"
  Superpower:
    alpha: 0.05
    alpha_source: "Superpower's default (Superpower_options(\"alpha_level\") is 0.05, Superpower 0.2.4.1)"
    power_source: "Superpower reports power and has no default target power; enter one"
  InteractionPoweR:
    alpha: 0.05
    alpha_source: "InteractionPoweR's default (power_interaction(alpha = 0.05), InteractionPoweR 0.2.4)"
    power_source: "InteractionPoweR has no default target power (power_estimate() needs power_target); enter one"
  pwrss:
    alpha: 0.05
    alpha_source: "pwrss's default (power.f.regression(alpha = 0.05), power.exact.oneprop(alpha = 0.05), power.exact.mcnemar(alpha = 0.05), pwrss 1.3.3)"
    power_source: "pwrss has no default target power (power = NULL); enter one"
    alternative_source: "pwrss's default (two-sided: alternative = \"two.sided\", pwrss 1.3.3)"
  power4mome:
    alpha: 0.05
    alpha_source: "power4mome's default (95% confidence intervals: n_region_from_power(ci_level = 0.95), power4mome 0.2.1)"
    power: 0.8
    power_source: "power4mome's default (n_region_from_power(target_power = 0.8), power4mome 0.2.1)"

# The seed a calculation uses unless the user changes it (judgement-calls.md
# B15): fixed, so the same answers always give the same result. It is shown
# on the input screen and the result screen, recorded in the result and
# written into the exported R script.
default_seed: 1

# How E1-E6 are calculated (docs/decisions.md, 17 October 2026): pwr's
# formula by default; Spower simulation if the user expects their data
# won't meet the test's assumptions. Welch's t-test (E2) has no pwr formula:
# it is simulated by default, with pwrss's formula on request (E2's
# welch_method).
# A form's `method_extra` fields are shown with this choice (E5: the z test,
# as in G*Power, or pwr's Cohen's h; Departure 11).
basic_method_field: {id: calc_method, label: "How power is worked out", type: select, path: options.method, optional: true,
  choices: {exact: "Formula (pwr; base R or pwrss for two proportions): assumes the test's assumptions hold", simulation: "Simulation (Spower): if you expect your data won't meet the test's assumptions"},
  default: exact, default_source: "powerkit's default for basic tests (docs/decisions.md, 17 October 2026)"}

# Designs the engine can compute that the app can't reach yet: a missing
# card and input screen, not a missing calculation. The queue to clear them
# is in docs/adding-a-test.md. test-repo-consistency.R refuses an engine
# template that is neither named by a card nor listed here, so a design
# can't go quietly unreachable again; delete an entry when its card and
# input screen land.
engine_only:
  one_variance: "one group's variance against a fixed value; batch 1"
  two_variances: "two groups' variances compared; batch 1"

# End points whose calculation runs on the input screen (phase 5). E1-E8
# run in seconds on one core (measured 17 October 2026 with the example
# values and 1,000 replications: 1 to 19 seconds, the longest a
# correlation's sample size). E9 runs in the background with a progress bar
# and a Cancel button (below). E10-E14 run as set under `simulations`.
calculates: [E1, E2, E3, E4, E5, E6, E7, E8, E9, E18, E19, E23, E24, E25, E26, E27, E28, E48, E49, E50, E51]

# End points that run in a separate R process, with an estimated progress
# bar and a Cancel button: the usual run time in seconds for each goal,
# measured with the example values and 1,000 replications on one core
# (docs/phase5-simulations.md, table 1). The bar is estimated from these.
background:
  E9: {power: 5, sample_size: 80, sensitivity: 2}
# At most this many background calculations (E9 and E10-E14's preview and
# full run) at once, across everyone using the app; others are asked to try
# again shortly (R/results.R, background_limit()). Two suits a server with
# two cores; POWERKIT_BACKGROUND_LIMIT overrides it.
background_limit: 2

# Mediation and moderated mediation (E10-E14; the maintainer's decision of
# 17 October 2026, docs/phase5-simulations.md and docs/decisions.md):
# for power, first a rough preview with `preview_nrep` replications, in a
# separate R process, shown as a range (a required N has no preview: with
# 100 replications per sample size the search is too slow and too noisy;
# only goals listed under `preview` get one); then, for the goals under
# `full_run`, the full
# analysis at the app's defaults in a separate process with a progress bar
# and Cancel; for every other goal, an R script to run the full analysis
# on the user's own computer. `preview` and `full` are the usual run times
# in seconds on one core (the bar is estimated from them); `script` is the
# expected run time in words. Measured or estimated as noted in
# docs/phase5-simulations.md.
simulations:
  preview_nrep: 100
  endpoints:
    E10:
      full_run: [power]
      preview: {power: 50}
      full: {power: 734}
      script: {sample_size: "about 1 to 3 hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E11:
      full_run: [power]
      preview: {power: 50}
      full: {power: 780}
      script: {sample_size: "about 1 to 3 hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E12:
      full_run: [power]
      preview: {power: 60}
      full: {power: 890}
      script: {sample_size: "about 1 to 3 hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E13:
      full_run: []
      preview: {power: 165}
      script: {power: "about 25 minutes on one core (an estimate)", sample_size: "several hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}
    E14:
      full_run: []
      preview: {power: 170}
      script: {power: "about 25 minutes on one core (an estimate)", sample_size: "several hours on one core (an estimate; 5 to 8 sample sizes are simulated)"}

# Departures from the wrapped tool's conventions, shown on the result screen
# (CLAUDE.md). Each condenses its entry in docs/conventions.md, "Departures".
departures:
  "1": "Required N for a 2 x 2 interaction: powerkit gives the smallest N at which the exact F test reaches the target power. Sommet et al.'s (2023) z approximation gives slightly smaller numbers: 4 participants fewer (one per cell) in their two published examples."
  "2": "Mixed design: powerkit uses Superpower's ANOVA_exact(), which reproduces the G*Power values Superpower's vignette reports, not ANOVA_exact2(). The two differ slightly (91.2% vs 90.5% in the vignette's example)."
  "3": "Superpower's exact dataset is built under this run's seed, so the result is identical each time with the same seed. The size of this difference is about 1e-15 in power, with no practical effect."
  "9": "Calculated with a formula (pwr's, or base R's power.prop.test() for two proportions), not Spower's simulation (powerkit's earlier default): exact for the t-tests and the chi-square test, and approximate for a correlation (Fisher's z) and two proportions (a normal approximation), with no simulation noise. In the examples checked, the two differ by less than 0.01 in power, within the simulation's own noise."
  "10": "Correlation: pwr's formula uses Fisher's z, an approximation; G*Power uses the exact distribution of r. For r = .3 to .5 and N = 20 to 100 they differ by at most 0.004 in power, and the required N by at most 1 participant (85 rather than 84 for r = .3 and 80% power)."
  "11": "Two proportions: the z test as G*Power runs it (pooled variance under the null, no continuity correction, both tails counted), by base R's power.prop.test() with strict = TRUE; it matches G*Power to seven decimals. Its own default, strict = FALSE, counts one tail only: power .2340 rather than .2345 with proportions .10 and .25 and 20 per group. Unequal groups use pwrss's z test, which matches G*Power's power; powerkit keeps the groups in the exact ratio you give, so its required N can be a few higher (for 95% power with group 2 twice the size of group 1, 372 rather than G*Power's 370, whose groups of 123 and 247 fall just short of 95%)."
  "12": "Two dependent correlations: Steiger's z test as G*Power computes it, with the null hypothesis's correlation in the formula for how the two correlations vary together; pwrss, the package behind it, uses the average of the two correlations by default. powerkit reproduces the G*Power manual's two examples (144 and 886 people); pwrss's default would give 139 and 875, about 1 to 4% fewer."
  "5": "No continuity correction, as in G*Power; Spower applies Yates' correction by default. In an example with proportions .50 and .65 and 170 per group, power is .818 without the correction and .789 with it."
  "6": "Mediation is fitted with lavaan (maximum likelihood), as power4mome does, not by PROCESS's ordinary least squares. The estimates are identical; the standard errors are slightly smaller (at N = 50, 2% for the a path and 3% for b and c'; at N = 200, under 1%)."
  "7": "Parallel mediators: powerkit lets their residuals correlate, as PROCESS's separate regressions do; lavaan and power4mome fix that correlation at 0 by default. With a residual correlation of 0.4 and N = 200, fixing it at 0 would understate the standard errors of the mediator-to-outcome paths by about 10% and so overstate power."
  "8": "Boos and Zhang's (2000) method is switched off: every simulated sample is tested with its confidence interval. power4mome switches the method on for some numbers of Monte Carlo draws (39, 79, ..., 359). In powerkit's runs this makes no difference to power."

# Known differences between established tools, shown on the result screen
# (CLAUDE.md). Each condenses its entry in docs/conventions.md, "Known
# differences". They are not departures: powerkit follows one established
# tool, and another gives a different answer.
known_differences:
  "1": "Regression interactions: powerkit simulates power, drawing the predictors afresh in each sample (InteractionPoweR's power_interaction()). Fixed-model calculations, such as G*Power's and InteractionPoweR's power_interaction_r2(), give slightly higher power: up to about 1.4 points, so the N here may be about 3% larger than G*Power's."
  "1 sensitivity": "Regression interactions: the smallest detectable effect comes from InteractionPoweR's fixed-model formula, power_interaction_r2(), as G*Power's would, not from simulation. Fixed-model power is slightly higher than simulated power (up to about 1.4 points), so the smallest effect you could detect may be slightly larger than shown. Sample size and power for this design are simulated."
  "2": "One proportion, McNemar's test and Fisher's exact test are exact tests of counts: their power goes up and down as N grows, so a slightly larger N can have a little less power. powerkit reports the smallest N that reaches the target, as G*Power does; pwrss's own sample-size answer is a little larger (92 rather than 90 for a proportion of .65 against .50, two-sided; 130 rather than 129 for McNemar's test with .25 and .10, G*Power's exact option). Fisher's exact test hasn't been compared with G*Power yet."
  "3": "Logistic regression with other predictors: when this predictor overlaps with the others (R-squared above 0), the G*Power manual's example reports a slightly larger sample size than powerkit gives for the same inputs (395 against 375 at an R-squared of 0.1). powerkit applies the adjustment as the manual's formulas describe it; why the example differs hasn't been settled, so G*Power may ask for a few per cent more people. With no overlap (R-squared 0) the two agree."

# The same known differences as one sentence for the methods paragraph
# (docs/conventions.md, "Known differences").
known_differences_methods:
  "1": "Power was estimated by simulation, with the predictors drawn afresh in each simulated sample; fixed-model calculations such as G*Power's, which treat the predictors as fixed, give slightly higher power for interactions, so this sample size may be a few participants larger than G*Power's."
  "1 sensitivity": "The smallest detectable effect was found with a fixed-model formula, which treats the predictors as fixed; for interactions this gives slightly higher power than simulation with the predictors drawn afresh in each sample, so the smallest detectable effect may be slightly larger than reported."
  "2": "Because power for an exact test of counts goes up and down as N grows, the sample size reported is the smallest N that reaches the target power, as in G*Power; pwrss's own sample-size answer can be slightly larger."
  "3": "The predictor's overlap with the other predictors was allowed for through its R-squared with them; for this case the G*Power manual's example reports a sample size a few per cent larger than this method gives, a difference that has not yet been resolved."

forms:
  E1:
    methods_name: "a one-sample t-test"
    departures: ["9"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: one_sample_t,
           variables: {"Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean, method: t_test}}
    groups:
      - input: "Your outcome's name"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "Cohen's d: (expected mean minus the fixed value) / SD"
        fields:
          - {id: d, label: "Cohen's d", type: number, path: population.d, effect: true}

  E2:
    methods_name: "an independent-samples t-test"
    departures: ["9"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: independent_t,
           variables: {X: {type: binary}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean_difference}}
    groups:
      - input: "Names of the two groups and the outcome"
        fields:
          - {id: X_label, label: "What the groups are (for example, condition)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "Cohen's d: (group 2 minus group 1) / pooled SD"
        fields:
          - {id: d, label: "Cohen's d", type: number, path: population.d, effect: true}
      - input: "The size of group 2 relative to group 1 (1 = equal)"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwr.t.test() (pwr 1.3-0) and Spower's default (p_t.test(n2_n1 = 1), Spower 0.7)"}
      - input: "Student's or Welch's test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {student_t: "Student's t-test (equal spread assumed)", welch_t: "Welch's t-test (equal spread not assumed)"},
             default: student_t, default_source: "the t-test pwr's formula covers (pwr.t.test(), pwr 1.3-0), and Spower's default (p_t.test(var.equal = TRUE), Spower 0.7)"}
    method_extra:
      # Welch's t-test: Spower's simulation by default, pwrss's formula on
      # request (engine, wave 2).
      - {id: welch_method, label: "How power is worked out", type: select, path: options.method, optional: true,
         shown_if: {field: method, is: welch_t},
         choices: {simulation: "Simulation (Spower)", exact: "Formula (pwrss's power.t.welch()): faster, no simulation noise"},
         default: simulation, default_source: "powerkit's default for Welch's t-test (Spower's simulation; pwr has no Welch formula)"}

  E3:
    methods_name: "a paired-samples t-test"
    departures: ["9"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: paired_t,
           variables: {X: {type: within_factor}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: mean_difference, method: t_test}}
    groups:
      - input: "Names of the two conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are (for example, session)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "First condition", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Second condition", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "d_z: mean of the differences (second minus first) / SD of the differences"
        fields:
          - {id: dz, label: "d_z", type: number, path: population.dz, effect: true}

  E4:
    methods_name: "a Pearson correlation"
    departures: ["9", "10"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: correlation,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: correlation, method: pearson}}
    groups:
      - input: "Names of the two variables"
        fields:
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
      - input: "The expected correlation r"
        fields:
          - {id: r, label: "Correlation r", type: number, path: population.r, effect: true, min: -1, max: 1}

  E5:
    methods_name: "a test of two proportions (z test)"
    departures: ["9", "11", "5"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, group 2's proportion can stay empty if you have no estimate: powerkit keeps group 1's proportion and finds how far above it group 2's would need to be. A lower value for group 2 looks for a decrease instead."
    basic_method: true
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: two_proportions,
           variables: {X: {type: binary}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: proportion_difference, method: z_test}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: X_label, label: "What the groups are (for example, condition)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "Group 1", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Group 2", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Yes/no outcome (for example, attended)", type: text, path: variables.Y.label, required: true}
      - input: "The expected proportion of 'yes' in each group"
        fields:
          - {id: p1, label: "Proportion of 'yes' in group 1 (0 to 1)", type: number, path: population.p1, effect: true, baseline: true, min: 0, max: 1}
          - {id: p2, label: "Proportion of 'yes' in group 2 (0 to 1)", type: number, path: population.p2, effect: true, when_empty: same_as_p1, min: 0, max: 1}
      - input: "The size of group 2 relative to group 1"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwr.2p.test() (pwr 1.3-0) and Spower's default (p_prop.test(n.ratios = rep(1, length(prop))), Spower 0.7)"}
      - input: "The z test or Fisher's exact test"
        fields:
          - {id: method, label: "Test version", type: select, path: target_test.method, required: true,
             choices: {z_test: "The z test (a large-sample test)", fisher_exact: "Fisher's exact test (pwrss's power.exact.fisher()): for small samples or small expected counts"},
             default: z_test, default_source: "the test G*Power and pwr's formulas cover for two independent proportions"}
    # Known differences that apply only with one test version.
    known_differences_if_method: {"2": fisher_exact}
    known_differences: ["2"]
    method_extra:
      - {id: proportions_formula, label: "Which formula", type: select, path: options.proportions_formula, optional: true,
         shown_if: [{field: calc_method, is: exact}, {field: method, is: z_test}],
         choices: {z_test: "z test, as in G*Power (base R's power.prop.test() for equal groups, pwrss for unequal groups)", arcsine: "Cohen's h, the arcsine approximation (pwr)"},
         default: z_test, default_source: "G*Power's z test for two independent proportions, default options (maintainer's decision, docs/decisions.md, 17 October 2026)"}

  E6:
    sides: false
    methods_name: "a chi-square test of independence"
    departures: ["9", "5"]
    tool: pwr
    sensitivity: true
    sensitivity_without_effect: true
    sensitivity_note: "For the smallest effect you could detect, the table can stay empty if you have no estimate: powerkit then finds the smallest association (Cohen's w) for your numbers of categories."
    basic_method: true
    directional: false
    base: {spec_version: "0.1", design: basic_test, template: chi_square_independence,
           variables: {X: {type: categorical}, "Y": {type: categorical}}, population: {metric: proportion},
           target_test: {effect: association, method: pearson_chi_square}}
    groups:
      - input: "The categories of each variable"
        fields:
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: X_levels, label: "Its categories, separated by commas", type: levels, path: variables.X.levels, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
          - {id: Y_levels, label: "Its categories, separated by commas", type: levels, path: variables.Y.levels, required: true}
      - input: "The expected proportion of people in each combination (adding up to 1)"
        fields:
          - {id: probabilities, label: "Proportions: one line per category of the first variable, one number per category of the second, separated by commas", type: table, path: population.probabilities, effect: true, when_empty: no_association}

  E7:
    sides: false
    methods_name: "a 2 × 2 between-participants ANOVA"
    departures: ["1", "3"]
    tool: Superpower
    directional: false
    sensitivity: true
    base: {spec_version: "0.1", design: factorial_anova, template: 2x2_between,
           variables: {A: {type: between_factor}, B: {type: between_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the two factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "Factor A", type: text, path: variables.A.label, required: true}
          - {id: A_level1, label: "Factor A, level 1", type: text, path: variables.A.levels.1, required: true}
          - {id: A_level2, label: "Factor A, level 2", type: text, path: variables.A.levels.2, required: true}
          - {id: B_label, label: "Factor B", type: text, path: variables.B.label, required: true}
          - {id: B_level1, label: "Factor B, level 1", type: text, path: variables.B.levels.1, required: true}
          - {id: B_level2, label: "Factor B, level 2", type: text, path: variables.B.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The four expected cell means (raw or in SD units)"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: m11, label: "Mean: A level 1, B level 1", type: number, path: population.means.1.1, effect: true}
          - {id: m12, label: "Mean: A level 1, B level 2", type: number, path: population.means.1.2, effect: true}
          - {id: m21, label: "Mean: A level 2, B level 1", type: number, path: population.means.2.1, effect: true}
          - {id: m22, label: "Mean: A level 2, B level 2", type: number, path: population.means.2.2, effect: true}
      - input: "The SD (one, or one per cell)"
        fields:
          # The spec's population > sd is one number or a 2 x 2 array of
          # positive numbers (rows = levels of A), as validate_spec() accepts.
          - {id: sd_mode, label: "One SD, or one per cell", type: select, required: true,
             choices: {one: "One SD for all four cells", per_cell: "A different SD in each cell"},
             default: one, default_source: "the simpler choice; the design spec accepts either"}
          - {id: sd, label: "SD (one value for all four cells)", type: number, path: population.sd, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is_not: per_cell}}
          - {id: sd11, label: "SD: A level 1, B level 1", type: number, path: population.sd.1.1, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd12, label: "SD: A level 1, B level 2", type: number, path: population.sd.1.2, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd21, label: "SD: A level 2, B level 1", type: number, path: population.sd.2.1, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
          - {id: sd22, label: "SD: A level 2, B level 2", type: number, path: population.sd.2.2, effect: true, min_exclusive: 0,
             shown_if: {field: sd_mode, is: per_cell}}
      - input: "Which effect: factor A, factor B or the interaction"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {main_effect_A: "Factor A", main_effect_B: "Factor B", interaction: "The interaction"}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for the 2 x 2 designs (design spec, options > method)"}

  E8:
    sides: false
    methods_name: "a 2 × 2 mixed ANOVA"
    departures: ["2", "3"]
    tool: Superpower
    directional: false
    sensitivity: true
    base: {spec_version: "0.1", design: factorial_anova, template: 2x2_mixed,
           variables: {A: {type: between_factor}, B: {type: within_factor}, "Y": {type: continuous}},
           target_test: {method: anova_f}}
    groups:
      - input: "Names of the factors, their levels and the outcome"
        fields:
          - {id: A_label, label: "Between factor (for example, group)", type: text, path: variables.A.label, required: true}
          - {id: A_level1, label: "Between factor, level 1", type: text, path: variables.A.levels.1, required: true}
          - {id: A_level2, label: "Between factor, level 2", type: text, path: variables.A.levels.2, required: true}
          - {id: B_label, label: "Within factor (for example, time)", type: text, path: variables.B.label, required: true}
          - {id: B_level1, label: "Within factor, level 1", type: text, path: variables.B.levels.1, required: true}
          - {id: B_level2, label: "Within factor, level 2", type: text, path: variables.B.levels.2, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The four expected cell means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: m11, label: "Mean: between level 1, within level 1", type: number, path: population.means.1.1, effect: true}
          - {id: m12, label: "Mean: between level 1, within level 2", type: number, path: population.means.1.2, effect: true}
          - {id: m21, label: "Mean: between level 2, within level 1", type: number, path: population.means.2.1, effect: true}
          - {id: m22, label: "Mean: between level 2, within level 2", type: number, path: population.means.2.2, effect: true}
      - input: "The SD"
        fields:
          - {id: sd, label: "SD (one value for all four cells)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The correlation between the two repeated measurements"
        fields:
          - {id: r, label: "Correlation between the two measurements", type: number, path: population.r, effect: true, min: -1, max: 1}
      - input: "Which effect: between factor, within factor or the interaction"
        fields:
          - {id: effect, label: "Which effect", type: select, path: target_test.effect, required: true,
             choices: {main_effect_A: "The between factor", main_effect_B: "The within factor", interaction: "The interaction"}}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for the 2 x 2 designs (design spec, options > method)"}

  E9:
    methods_name: "a moderated regression (continuous × continuous interaction)"
    tool: InteractionPoweR
    known_differences: ["1"]
    # The smallest detectable effect: the interaction's correlation with Y,
    # by InteractionPoweR's fixed-model formula (the engine's
    # interactionpower_sensitivity()); labelled on the result screen.
    sensitivity: true
    directional: false
    base: {spec_version: "0.1", design: regression_interaction, template: two_way,
           variables: {X: {type: continuous}, W: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: interaction, method: ols_t}}
    names: [X, W, "Y"]
    groups:
      - input: "Correlations: X with Y, W with Y, the interaction XW with Y, and X with W"
        fields:
          - {id: r_X_Y, label: "Correlation of X with Y", type: number, path: population.r_X_Y, effect: true, min: -1, max: 1}
          - {id: r_W_Y, label: "Correlation of W with Y", type: number, path: population.r_W_Y, effect: true, min: -1, max: 1}
          - {id: r_XW_Y, label: "Correlation of the interaction XW with Y", type: number, path: population.r_XW_Y, effect: true, min: -1, max: 1}
          - {id: r_X_W, label: "Correlation of X with W", type: number, path: population.r_X_W, effect: true, min: -1, max: 1}
      - input: "Optional: reliability of X, W and Y"
        fields:
          - {id: rel_X, label: "Reliability of X (optional; empty = perfectly reliable)", type: number, path: variables.X.reliability, optional: true, min_exclusive: 0, max: 1}
          - {id: rel_W, label: "Reliability of W (optional; empty = perfectly reliable)", type: number, path: variables.W.reliability, optional: true, min_exclusive: 0, max: 1}
          - {id: rel_Y, label: "Reliability of Y (optional; empty = perfectly reliable)", type: number, path: variables.Y.reliability, optional: true, min_exclusive: 0, max: 1}

  E10:
    methods_name: "a simple mediation model (PROCESS model 4)"
    tool: power4mome
    departures: ["6", "8"]
    directional: false
    base: {spec_version: "0.1", design: mediation, template: process_4,
           variables: {X: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, path: "X->M->Y", method: monte_carlo_ci}}
    names: [X, M, "Y"]
    groups:
      - input: "Standardised paths X -> M, M -> Y and X -> Y"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
      - input: "Number of Monte Carlo draws per CI (optional)"
        fields:
          - {id: ci_draws, label: "Monte Carlo draws per CI (optional; empty = 1,000, power4mome's default for q_power_mediation())", type: number, path: options.ci_draws, optional: true, min: 100, max: 100000, integer: true}

  E11:
    methods_name: "a parallel mediation model (PROCESS model 4)"
    tool: power4mome
    departures: ["6", "7", "8"]
    directional: false
    mediators: parallel
    base: {spec_version: "0.1", design: mediation, template: process_4,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, method: monte_carlo_ci}}
    names: [X, "Y"]
    # Generated by R/forms.R for the chosen number of mediators: the paths
    # for each mediator, the residual correlations and the target path.
    groups:
      - input: "Standardised paths for each mediator"
        generated: parallel_paths
      - input: "Correlations between the mediators' residuals"
        generated: residual_correlations
      - input: "Which indirect path the hypothesis is about"
        generated: target_path

  E12:
    methods_name: "a serial mediation model (PROCESS model 6)"
    tool: power4mome
    departures: ["6", "8"]
    directional: false
    mediators: serial
    base: {spec_version: "0.1", design: mediation, template: process_6,
           variables: {X: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: indirect_effect, method: monte_carlo_ci}}
    names: [X, "Y"]
    groups:
      - input: "Standardised paths, every forward path"
        generated: serial_paths
      - input: "Which indirect path the hypothesis is about"
        generated: target_path

  E13:
    methods_name: "a first-stage moderated mediation model (PROCESS model 7; index of moderated mediation)"
    tool: power4mome
    departures: ["6", "8"]
    directional: false
    base: {spec_version: "0.1", design: moderated_mediation, template: process_7,
           variables: {X: {type: continuous}, W: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: index_of_moderated_mediation, method: monte_carlo_ci}}
    names: [X, W, M, "Y"]
    groups:
      - input: "Standardised paths, including the interaction XW -> M"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_W_M, label: "Path W -> M", type: number, path: "population.paths.W->M", effect: true}
          - {id: p_XW_M, label: "Path XW -> M (the interaction)", type: number, path: "population.paths.XW->M", effect: true}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
          - {id: c_X_W, label: "Correlation of X with W (optional; empty = 0, for example when X is randomised)", type: number, path: "population.correlations.X<->W", optional: true, min: -1, max: 1}

  E14:
    methods_name: "a second-stage moderated mediation model (PROCESS model 14)"
    tool: power4mome
    departures: ["6", "8"]
    directional: false
    base: {spec_version: "0.1", design: moderated_mediation, template: process_14,
           variables: {X: {type: continuous}, W: {type: continuous}, M: {type: continuous}, "Y": {type: continuous}}, population: {metric: standardised},
           target_test: {effect: index_of_moderated_mediation, method: monte_carlo_ci}}
    names: [X, W, M, "Y"]
    groups:
      - input: "Standardised paths, including the interaction MW -> Y"
        fields:
          - {id: p_X_M, label: "Path X -> M", type: number, path: "population.paths.X->M", effect: true}
          - {id: p_M_Y, label: "Path M -> Y", type: number, path: "population.paths.M->Y", effect: true}
          - {id: p_W_Y, label: "Path W -> Y", type: number, path: "population.paths.W->Y", effect: true}
          - {id: p_MW_Y, label: "Path MW -> Y (the interaction)", type: number, path: "population.paths.MW->Y", effect: true}
          - {id: p_X_Y, label: "Path X -> Y (direct)", type: number, path: "population.paths.X->Y", effect: true}
          - {id: c_X_W, label: "Correlation of X with W (optional; empty = 0)", type: number, path: "population.correlations.X<->W", optional: true, min: -1, max: 1}

  # Wave 2 (engine PR #51, 18 October 2026): one-way ANOVA, R-squared, one
  # proportion and McNemar. No smallest detectable effect yet: the engine
  # doesn't offer it for these.
  E18:
    sides: false
    methods_name: "a one-way between-subjects ANOVA"
    tool: Superpower
    departures: ["3"]
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_between,
           variables: {A: {type: between_factor}, "Y": {type: continuous}},
           target_test: {effect: main_effect_A, method: anova_f}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: A_label, label: "What the groups are (for example, condition)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (three or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected group means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "group means", label: "Means: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every group; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
    extra:
      - {id: method, label: "Method", type: select, path: options.method, required: true,
         choices: {exact: "Exact dataset (no repeated simulation)", simulation: "Repeated simulation"},
         default: exact, default_source: "powerkit's default for Superpower's designs (design spec, options > method)"}

  E23:
    sides: false
    methods_name: "a one-way ANCOVA (Shieh's method)"
    tool: pwrss
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_ancova,
           variables: {A: {type: between_factor}, "Y": {type: continuous}},
           target_test: {effect: main_effect_A, method: ancova_f}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: A_label, label: "What the groups are (for example, condition)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (two or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: Y_label, label: "Outcome (for example, the after score)", type: text, path: variables.Y.label, required: true}
      - input: "The expected (adjusted) group means and SD"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "adjusted group means", label: "Means adjusted for the covariates: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true}
          - {id: sd, writeup_label: "SD", label: "SD of the outcome within each group, before adjusting (the same in every group; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "How much the covariate explains (R-squared), or its correlation with the outcome"
        fields:
          - {id: r2_covariates, writeup_label: "R-squared of the covariates", label: "R-squared: the share of the outcome's variance the covariates explain (for one covariate, its correlation with the outcome, squared)", type: number, path: population.r2_covariates, effect: true, min: 0, max_exclusive: 1}
          - {id: covariates, label: "Number of covariates", type: number, path: population.covariates, required: true, min: 1, integer: true,
             default: 1, default_source: "one covariate, such as the before score"}

  E24:
    sides: false
    methods_name: "a multiple regression F test"
    tool: pwrss
    directional: false
    base: {spec_version: "0.1", design: multiple_regression,
           variables: {"Y": {type: continuous}}, population: {metric: r_squared},
           target_test: {method: f_test}}
    groups:
      - input: "Your outcome's name and what you want to test"
        fields:
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
          - {id: question, label: "What you want to test", type: select, path: template, required: true,
             choices: {r2_zero: "Whether the predictors together explain anything (R-squared against 0)",
                       r2_increase: "Whether some predictors add to the others (R-squared increase; for one predictor's coefficient, test 1 predictor)"},
             sets: {r2_zero: [{path: target_test.effect, value: r_squared}],
                    r2_increase: [{path: target_test.effect, value: r_squared_change}]}}
      - input: "R-squared, or the R-squared change for the predictor(s) of interest"
        fields:
          - {id: r2, writeup_label: "R²", label: "R-squared of the model (0 to 1)", type: number, path: population.r2, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: question, is: r2_zero}}
          - {id: r2_full, writeup_label: "R² with all predictors", label: "R-squared with all the predictors (0 to 1)", type: number, path: population.r2_full, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: question, is: r2_increase}}
          - {id: r2_reduced, writeup_label: "R² without the tested predictors", label: "R-squared without the predictors you are testing (0 to 1; 0 if there are no others)", type: number, path: population.r2_reduced, effect: true, min: 0, max_exclusive: 1,
             shown_if: {field: question, is: r2_increase}}
      - input: "Number of predictors"
        fields:
          - {id: predictors, label: "Number of predictors", type: number, path: population.predictors, required: true, min: 1, integer: true,
             shown_if: {field: question, is: r2_zero}}
          - {id: predictors_total, label: "Number of predictors in the full model", type: number, path: population.predictors_total, required: true, min: 1, integer: true,
             shown_if: {field: question, is: r2_increase}}
          - {id: predictors_tested, label: "How many of them you are testing", type: number, path: population.predictors_tested, required: true, min: 1, integer: true,
             shown_if: {field: question, is: r2_increase}}

  E25:
    methods_name: "an exact binomial test of one proportion"
    tool: pwrss
    known_differences: ["2"]
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: one_proportion,
           variables: {"Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: proportion_vs_constant, method: exact_binomial}}
    groups:
      - input: "Your outcome's name"
        fields:
          - {id: Y_label, label: "Yes/no outcome (for example, guessed correctly)", type: text, path: variables.Y.label, required: true}
      - input: "The expected proportion"
        fields:
          - {id: p, writeup_label: "expected proportion of 'yes'", label: "Expected proportion of 'yes' (0 to 1)", type: number, path: population.p, effect: true, min_exclusive: 0, max_exclusive: 1}
      - input: "The fixed value"
        fields:
          - {id: p0, label: "The fixed proportion you compare it with (0 to 1; for example 0.5 for chance with two options)", type: number, path: population.p0, required: true, min_exclusive: 0, max_exclusive: 1}

  E26:
    methods_name: "an exact McNemar's test"
    tool: pwrss
    known_differences: ["2"]
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: mcnemar,
           variables: {X: {type: within_factor}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: proportion},
           target_test: {effect: paired_proportion_difference, method: mcnemar_exact}}
    groups:
      - input: "Names of the two conditions and the outcome"
        fields:
          - {id: X_label, label: "What the conditions are (for example, session)", type: text, path: variables.X.label, required: true}
          - {id: X_level1, label: "First condition", type: text, path: variables.X.levels.1, required: true}
          - {id: X_level2, label: "Second condition", type: text, path: variables.X.levels.2, required: true}
          - {id: Y_label, label: "Yes/no outcome (for example, passed)", type: text, path: variables.Y.label, required: true}
      - input: "The expected discordant proportions"
        fields:
          - {id: p_first_only, writeup_label: "proportion 'yes' in the first condition only", label: "Proportion of people who say 'yes' in the first condition only (0 to 1)", type: number, path: population.p_first_only, effect: true, min: 0, max: 1}
          - {id: p_second_only, writeup_label: "proportion 'yes' in the second condition only", label: "Proportion of people who say 'yes' in the second condition only (0 to 1)", type: number, path: population.p_second_only, effect: true, min: 0, max: 1}

  E48:
    sides: false
    methods_name: "a chi-square goodness-of-fit test"
    tool: pwrss
    directional: false
    base: {spec_version: "0.1", design: basic_test, template: chi_square_gof,
           variables: {"Y": {type: categorical}}, population: {metric: proportion},
           target_test: {effect: goodness_of_fit, method: pearson_chi_square}}
    groups:
      - input: "The categories of the variable"
        fields:
          - {id: Y_label, label: "Variable (for example, preferred study method)", type: text, path: variables.Y.label, required: true}
          - {id: Y_levels, label: "Its categories, separated by commas", type: levels, path: variables.Y.levels, required: true}
      - input: "The expected proportion in each category, and the fixed proportions they are compared with"
        fields:
          - {id: probabilities, writeup_label: "expected proportions", label: "Expected proportions: one for each category, in the same order, separated by commas (adding up to 1)", type: numbers, per_levels: Y_levels, path: population.probabilities, effect: true}
          - {id: null_probabilities, writeup_label: "proportions under the null hypothesis", label: "Fixed proportions to compare with (the null hypothesis), in the same order (optional; equal proportions if left empty)", type: numbers, per_levels: Y_levels, path: population.null_probabilities, optional: true}

  E49:
    methods_name: "a test of two independent correlations (Fisher's z)"
    tool: pwrss
    directional: true
    base: {spec_version: "0.1", design: basic_test, template: two_correlations,
           variables: {G: {type: binary}, X: {type: continuous}, "Y": {type: continuous}}, population: {metric: correlation},
           target_test: {effect: correlation_difference, method: fisher_z}}
    groups:
      - input: "Names of the two groups and the two variables"
        fields:
          - {id: G_label, label: "What the groups are (for example, sample)", type: text, path: variables.G.label, required: true}
          - {id: G_level1, label: "Group 1", type: text, path: variables.G.levels.1, required: true}
          - {id: G_level2, label: "Group 2", type: text, path: variables.G.levels.2, required: true}
          - {id: X_label, label: "First variable", type: text, path: variables.X.label, required: true}
          - {id: Y_label, label: "Second variable", type: text, path: variables.Y.label, required: true}
      - input: "The expected correlation in each group"
        fields:
          - {id: r1, writeup_label: "correlation in group 1", label: "Correlation r in group 1", type: number, path: population.r1, effect: true, min_exclusive: -1, max_exclusive: 1}
          - {id: r2, writeup_label: "correlation in group 2", label: "Correlation r in group 2", type: number, path: population.r2, effect: true, min_exclusive: -1, max_exclusive: 1}
      - input: "The size of group 2 relative to group 1"
        fields:
          - {id: allocation_ratio, label: "Size of group 2 divided by size of group 1", type: number, path: options.allocation_ratio, required: true, min_exclusive: 0,
             default: 1, default_source: "equal groups, as in pwrss's power.z.twocors() (n.ratio = 1)"}

  # Logistic regression, one predictor (pwrss's Wald z test): a score X is
  # taken as standardised, so its odds ratio is per SD; a yes/no X compares
  # its second group with the first. Other predictors enter only through
  # X's R-squared with them (docs/conventions.md, Known difference 3).
  E27:
    methods_name: "a logistic regression (the Wald z test of one predictor)"
    tool: pwrss
    directional: true
    known_differences: ["3"]
    known_differences_if_above_zero: {"3": r2_other_predictors}
    base: {spec_version: "0.1", design: logistic_regression, template: single_predictor,
           variables: {X: {}, "Y": {type: binary, levels: ["No", "Yes"]}}, population: {metric: odds_ratio},
           target_test: {effect: odds_ratio, method: wald_z}}
    groups:
      - input: "Your outcome, your predictor and what kind of predictor it is"
        fields:
          - {id: Y_label, label: "Yes/no outcome (for example, sought help)", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "Predictor", type: text, path: variables.X.label, required: true}
          - {id: X_type, label: "What kind of predictor", type: select, path: variables.X.type, required: true,
             choices: {continuous: "A score (for example, a questionnaire total)", binary: "A yes/no group (for example, treatment or control)"}}
          - {id: X_level1, label: "First group (the comparison group)", type: text, path: variables.X.levels.1, required: true,
             shown_if: {field: X_type, is: binary}}
          - {id: X_level2, label: "Second group", type: text, path: variables.X.levels.2, required: true,
             shown_if: {field: X_type, is: binary}}
      - input: "The odds ratio and the proportion of 'yes' at the starting point"
        fields:
          - {id: odds_ratio, writeup_label: "odds ratio", label: "Odds ratio", type: number, path: population.odds_ratio, effect: true, min_exclusive: 0,
             help: "For a score: how many times the odds of 'yes' change for each standard deviation higher on the predictor. For a group: the odds of 'yes' in the second group divided by the odds in the first. 1 means no effect."}
          - {id: base_prob, writeup_label: "proportion of 'yes' at the starting point", label: "Proportion of 'yes' at the starting point (0 to 1)", type: number, path: population.base_prob, effect: true, min_exclusive: 0, max_exclusive: 1,
             help: "For a score: the proportion at the predictor's average. For a group: the proportion in the first group."}
          - {id: x_prob, label: "Proportion of people in the second group (0 to 1)", type: number, path: population.x_prob, required: true, min_exclusive: 0, max_exclusive: 1,
             default: 0.5, default_source: "equal groups, the design spec's default (population > x_prob)",
             shown_if: {field: X_type, is: binary}}
      - input: "How much the other predictors overlap with this one"
        fields:
          - {id: r2_other, label: "R-squared of this predictor on the other predictors (0 to 1; 0 if there are no others)", type: number, path: population.r2_other_predictors, required: true, min: 0, max_exclusive: 1,
             default: 0, default_source: "no other predictors, the design spec's default (population > r2_other_predictors)",
             help: "How much of this predictor the other predictors in your model explain. Their own effects on the outcome aren't needed."}

  # Poisson regression, one predictor (pwrss's Wald z test): a score X is
  # taken as standardised, so its rate ratio is per SD; a yes/no X compares
  # its second group with the first. Events are counted over a mean
  # exposure; other predictors enter only through X's R-squared with them.
  E28:
    methods_name: "a Poisson regression (the Wald z test of one predictor)"
    tool: pwrss
    directional: true
    base: {spec_version: "0.1", design: poisson_regression, template: single_predictor_count,
           variables: {X: {}, "Y": {type: count}}, population: {metric: rate_ratio},
           target_test: {effect: rate_ratio, method: wald_z}}
    groups:
      - input: "Your outcome, your predictor and what kind of predictor it is"
        fields:
          - {id: Y_label, label: "Count outcome (for example, clinic visits in a year)", type: text, path: variables.Y.label, required: true}
          - {id: X_label, label: "Predictor", type: text, path: variables.X.label, required: true}
          - {id: X_type, label: "What kind of predictor", type: select, path: variables.X.type, required: true,
             choices: {continuous: "A score (for example, a questionnaire total)", binary: "A yes/no group (for example, treatment or control)"}}
          - {id: X_level1, label: "First group (the comparison group)", type: text, path: variables.X.levels.1, required: true,
             shown_if: {field: X_type, is: binary}}
          - {id: X_level2, label: "Second group", type: text, path: variables.X.levels.2, required: true,
             shown_if: {field: X_type, is: binary}}
      - input: "The rate ratio, the starting rate and the time over which events are counted"
        fields:
          - {id: rate_ratio, writeup_label: "rate ratio", label: "Rate ratio", type: number, path: population.rate_ratio, effect: true, min_exclusive: 0,
             help: "For a score: how many times the rate of events changes for each standard deviation higher on the predictor. For a group: the rate in the second group divided by the rate in the first. 1 means no effect."}
          - {id: base_rate, writeup_label: "starting rate of events", label: "Starting rate: events per unit of time", type: number, path: population.base_rate, effect: true, min_exclusive: 0,
             help: "For a score: the expected count per unit of time at the predictor's average. For a group: in the first group."}
          - {id: mean_exposure, label: "Average time each person is followed, in those units", type: number, path: population.mean_exposure, required: true, min_exclusive: 0,
             default: 1, default_source: "one unit, so the starting rate is the expected count per person: the design spec's and pwrss's default (power.z.poisson(mean.exposure = 1))",
             help: "For example, with a rate per month and a year of follow-up, 12."}
          - {id: x_prob, label: "Proportion of people in the second group (0 to 1)", type: number, path: population.x_prob, required: true, min_exclusive: 0, max_exclusive: 1,
             default: 0.5, default_source: "equal groups, the design spec's default (population > x_prob)",
             shown_if: {field: X_type, is: binary}}
      - input: "How much the other predictors overlap with this one"
        fields:
          - {id: r2_other, label: "R-squared of this predictor on the other predictors (0 to 1; 0 if there are no others)", type: number, path: population.r2_other_predictors, required: true, min: 0, max_exclusive: 1,
             default: 0, default_source: "no other predictors, the design spec's default (population > r2_other_predictors)",
             help: "How much of this predictor the other predictors in your model explain. Their own effects on the outcome aren't needed."}

  # Planned contrast (pwrss's t test of one weighted combination of the
  # group means, k.covariates = 0): equal groups, two-sided only, because
  # power.t.contrasts() has no one-sided option (docs/conventions.md).
  E19:
    methods_name: "a planned contrast (a t test of a weighted combination of the group means)"
    tool: pwrss
    directional: false
    base: {spec_version: "0.1", design: factorial_anova, template: oneway_contrast,
           variables: {A: {type: between_factor}, "Y": {type: continuous}},
           target_test: {effect: contrast, method: contrast_t}}
    groups:
      - input: "Names of the groups and the outcome"
        fields:
          - {id: A_label, label: "What the groups are (for example, condition)", type: text, path: variables.A.label, required: true}
          - {id: A_levels, label: "The groups' names (three or more), separated by commas", type: levels, path: variables.A.levels, required: true}
          - {id: Y_label, label: "Outcome", type: text, path: variables.Y.label, required: true}
      - input: "The expected group means"
        fields:
          - {id: metric, label: "Units of the means", type: select, path: population.metric, required: true,
             choices: {raw: "The outcome's own units (raw)", standardised: "SD units"}}
          - {id: means, writeup_label: "group means", label: "Means: one for each group, in the same order, separated by commas", type: numbers, per_levels: A_levels, path: population.means, effect: true}
      - input: "The SD"
        fields:
          - {id: sd, writeup_label: "SD", label: "SD (the same in every group; 1 if the means are in SD units)", type: number, path: population.sd, effect: true, min_exclusive: 0}
      - input: "The contrast weights"
        fields:
          - {id: weights, writeup_label: "contrast weights", label: "Weights: one for each group, in the same order, adding up to 0", type: numbers, per_levels: A_levels, path: target_test.weights, required: true,
             help: "For example, with groups None, Neutral and Praise, -2, 1, 1 compares no feedback with both kinds of feedback; with four doses, -3, -1, 1, 3 tests a straight-line trend. Only the pattern matters, not the size of the numbers."}

  # Two dependent correlations (pwrss's Steiger z test, unpooled as in
  # G*Power: Departure 12). The first choice picks the template; the
  # variables' types follow from it (`sets`). A one-sided test runs in the
  # direction of the second correlation minus the first.
  E51:
    methods_name: "Steiger's z test of two dependent correlations"
    tool: pwrss
    directional: true
    departures: ["12"]
    base: {spec_version: "0.1", design: basic_test, population: {metric: correlation},
           target_test: {effect: correlation_difference, method: steiger_z}}
    groups:
      - input: "Which two correlations, and the variables' names"
        fields:
          - {id: comparison, label: "Which two correlations", type: select, path: template, required: true,
             choices: {overlapping_correlations: "Two that share a variable: X with Y, against X with Z",
                       nonoverlapping_correlations: "Two with no variable in common: X1 with Y1, against X2 with Y2 (for example, the same two measures at two ages)"},
             sets: {overlapping_correlations: [{path: variables.X.type, value: continuous}, {path: variables.Y.type, value: continuous}, {path: variables.Z.type, value: continuous}],
                    nonoverlapping_correlations: [{path: variables.X1.type, value: continuous}, {path: variables.Y1.type, value: continuous},
                                                  {path: variables.X2.type, value: continuous}, {path: variables.Y2.type, value: continuous}]}}
          - {id: X_label, label: "X, the shared variable", type: text, path: variables.X.label, required: true, shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: Y_label, label: "Y", type: text, path: variables.Y.label, required: true, shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: Z_label, label: "Z", type: text, path: variables.Z.label, required: true, shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: X1_label, label: "X1", type: text, path: variables.X1.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: Y1_label, label: "Y1", type: text, path: variables.Y1.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: X2_label, label: "X2", type: text, path: variables.X2.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: Y2_label, label: "Y2", type: text, path: variables.Y2.label, required: true, shown_if: {field: comparison, is: nonoverlapping_correlations}}
      - input: "The two correlations you are comparing"
        fields:
          - {id: r_X_Y, writeup_label: "first correlation (X with Y)", label: "First: X with Y", type: number, path: population.r_X_Y, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: r_X_Z, writeup_label: "second correlation (X with Z)", label: "Second: X with Z", type: number, path: population.r_X_Z, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: overlapping_correlations}}
          - {id: r_X1_Y1, writeup_label: "first correlation (X1 with Y1)", label: "First: X1 with Y1", type: number, path: population.r_X1_Y1, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_X2_Y2, writeup_label: "second correlation (X2 with Y2)", label: "Second: X2 with Y2", type: number, path: population.r_X2_Y2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
      - input: "The correlations between the other pairs of variables"
        fields:
          - {id: r_Y_Z, writeup_label: "correlation of Y with Z", label: "Y with Z", type: number, path: population.r_Y_Z, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: overlapping_correlations},
             help: "The higher this is, the more the two compared correlations move together, and the fewer people you need."}
          - {id: r_X1_X2, writeup_label: "correlation of X1 with X2", label: "X1 with X2", type: number, path: population.r_X1_X2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_Y1_Y2, writeup_label: "correlation of Y1 with Y2", label: "Y1 with Y2", type: number, path: population.r_Y1_Y2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_X1_Y2, writeup_label: "correlation of X1 with Y2", label: "X1 with Y2", type: number, path: population.r_X1_Y2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}
          - {id: r_Y1_X2, writeup_label: "correlation of Y1 with X2", label: "Y1 with X2", type: number, path: population.r_Y1_X2, effect: true, min_exclusive: -1, max_exclusive: 1,
             shown_if: {field: comparison, is: nonoverlapping_correlations}}

  # Generic tests (G*Power's "Generic" tests): no sample size, because the
  # noncentrality already reflects it. Goals: the power for a noncentrality,
  # or the noncentrality needed for a target power (R/forms.R,
  # closing_groups()). Only t and z have a direction.
  E50:
    generic: true
    sides: false
    methods_name: "a generic test from a noncentrality parameter"
    tool: pwrss
    directional: true
    direction_shown_if: [{field: generic_test, is_not: f}, {field: generic_test, is_not: chi_square}]
    base: {spec_version: "0.1", design: generic_test, template: t, variables: {},
           population: {metric: noncentrality}, target_test: {effect: noncentrality, method: t_test}}
    groups:
      - input: "The test statistic"
        fields:
          - {id: generic_test, label: "Which test statistic", type: select, path: template, required: true,
             choices: {t: "t", f: "F", chi_square: "Chi-square", z: "z (standard deviation 1)"},
             default: t, default_source: "powerkit's first choice; pick the statistic your analysis reports",
             sets: {t: [{path: target_test.method, value: t_test}], f: [{path: target_test.method, value: f_test}],
                    chi_square: [{path: target_test.method, value: chi_square_test}], z: [{path: target_test.method, value: z_test}]}}
      - input: "The noncentrality parameter and the degrees of freedom"
        fields:
          - {id: ncp, writeup_label: "noncentrality parameter", label: "Noncentrality parameter (for z, the mean of the z statistic if the effect is real); needed for power", type: number, path: population.ncp, effect: true, optional_for: [sensitivity]}
          - {id: df, label: "Degrees of freedom", type: number, path: population.df, required: true, min_exclusive: 0,
             shown_if: [{field: generic_test, is_not: f}, {field: generic_test, is_not: z}]}
          - {id: df1, label: "Numerator degrees of freedom", type: number, path: population.df1, required: true, min_exclusive: 0,
             shown_if: {field: generic_test, is: f}}
          - {id: df2, label: "Denominator degrees of freedom", type: number, path: population.df2, required: true, min_exclusive: 0,
             shown_if: {field: generic_test, is: f}}
